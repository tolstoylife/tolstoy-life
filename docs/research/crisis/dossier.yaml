# Corrections to received framing.
contradictions:
  - claim: "Tolstoy underwent a 'crisis' (a sudden, datable spiritual rupture) c.1876–1880 — the standard biographical framing, incl. Birukoff's chapter title 'The Crisis'."
    correction: >-
      In his own confessional works Tolstoy calls it a "переворот" that "had long been preparing" with
      "seeds always in me" (A Confession, PSS 23 p.40) and that he "could not say when and how" it took
      place (p.46); he never uses "кризис" of it. He uses "кризис" only medically (Strakhov, 1894) or
      as a plural, universal life-stage (Annenkova, 1894). "Crisis" is the apparatus's and biography's
      word, not the subject's.
    evidenceRef: ispoved_p40_perevorot

