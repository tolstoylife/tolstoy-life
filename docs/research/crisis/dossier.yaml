# Machine-readable dossier for the "crisis" corpus dive (index.md).
# Produced 2026-05-29 by a corpus-dive run (slug: crisis). The hand-written index.md is the
# authoritative narrative; this file is the ingestion-ready citation/entity/visuals ledger.
topic:
  slug: crisis
  title: "Crisis: how Tolstoy named — and did not name — his transformation of 1879–1882"
  question: >-
    Did Tolstoy frame his late-1870s/early-1880s religious transformation as a "crisis" (кризис),
    or is "crisis" a label applied from outside (editorial apparatus, biography) — as with the
    term "Tolstoyanism"? Which words does he actually use for it across the corpus?
  date: 2026-05-29
  period: prophet
  corpusSurface: [works, letters, diaries, notes, commentary]
  dateRange: "1879–1894 (keystone texts 1879–1884; lexical-usage letters 1894)"

# Layer 1 — flat citation ledger. Every quoteRu is byte-faithful from the clean extract named in
# `extract` (verified against the source PDF where `facsimile` is set). quoteEn is working English.
# Ids suffix the TEI id when one file yields several cited passages. PSS Tom -> local PDF via
# pss-volume-mapping.md (NB: vol83 = Tom 23, NOT vol23).
evidence:
  - id: ispoved_p40_perevorot
    teiId: v23_001_059_Ispoved
    genre: work
    pssTom: 23
    pages: "40"
    date: 1882
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: >-
      Я жил так года два, и со мной случился переворот, который давно готовился во мне и задатки
      которого всегда были во мне. Со мной случилось то, что жизнь нашего круга — богатых, ученых —
      не только опротивела мне, но потеряла всякий смысл.
    quoteEn: >-
      I lived like that for a couple of years, and there occurred in me an upheaval [переворот] that
      had long been preparing within me, and whose seeds had always been in me. What happened to me
      was that the life of our circle — the rich, the learned — not only grew repugnant to me, but
      lost all meaning. (working English)
    significance: >-
      The keystone. In the work where Tolstoy narrates the transformation, the word is "переворот"
      (upheaval), never "кризис"; and he denies a sudden rupture — it "had long been preparing" and
      "its seeds had always been in me". Verified verbatim against PSS Tom 23 p.40 (vol83, phys p.78).
    facsimile: extracts/pss-tom23-page-040-perevorot.png

  - id: ispoved_p46_undatable
    teiId: v23_001_059_Ispoved
    genre: work
    pssTom: 23
    pages: "46"
    date: 1882
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: >-
      И я спасся от самоубийства. Когда и как совершился во мне этот переворот, я не мог бы сказать.
      […] так же постепенно, незаметно возвратилась ко мне эта сила жизни. И странно, что та сила
      жизни, которая возвратилась ко мне, была не новая, а самая старая, — та самая, которая влекла
      меня на первых порах моей жизни.
    quoteEn: >-
      And I was saved from suicide. When and how this upheaval [переворот] took place in me, I could
      not say. […] just as gradually, imperceptibly, the force of life returned to me. And it is
      strange that the force of life which returned to me was not a new one, but the very oldest —
      the same that had drawn me in the first days of my life. (working English)
    significance: >-
      The transformation stated as explicitly un-datable ("when and how … I could not say") and as a
      return to something old rather than the arrival of something new — the strongest textual
      counter to reading it as a dated "crisis".
    facsimile: null

  - id: ispoved_p10_ostanovka
    teiId: v23_001_059_Ispoved
    genre: work
    pssTom: 23
    pages: "10"
    date: 1882
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: extracts/v23_001_059_Ispoved.txt
    quoteRu: >-
      Так я жил, но пять лет тому назад со мною стало случаться что-то очень странное: на меня стали
      находить минуты сначала недоумения, остановки жизни, как будто я не знал, как мне жить, что мне
      делать, и я терялся и впадал в уныние. […] Эти остановки жизни выражались всегда одинаковыми
      вопросами: Зачем? Ну, а потом?
    quoteEn: >-
      So I lived, but five years ago something very strange began to happen to me: at first there
      came over me moments of bewilderment, of life coming to a stop, as though I did not know how to
      live or what to do, and I lost my footing and fell into dejection. […] These stoppages of life
      always expressed themselves in the same questions: Why? And then what? (working English)
    significance: >-
      Tolstoy's own image for the episode — "остановка жизни" (the arrest of life) — alongside
      отчаяние (despair, 16×) and the lost "смысл жизни" (meaning of life, 22×). Narrative and
      figurative, never the clinical noun "crisis".
    facsimile: null

  - id: vchem_moya_vera_opening
    teiId: v23_304_465_V_chem_moja_vera
    genre: work
    pssTom: 23
    pages: "304"
    date: 1884
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: >-
      Пять лет тому назад я поверил в учение Христа — и жизнь моя вдруг переменилась […] Со мной
      случилось то, что случается с человеком, который вышел за делом и вдруг дорогой решил, что дело
      это ему совсем не нужно,— и повернул домой.
    quoteEn: >-
      Five years ago I came to believe in Christ's teaching — and my life suddenly changed […] What
      happened to me was what happens to a man who goes out on some errand and then suddenly decides
      on the way that the errand is of no use to him at all — and turns back home. (working English)
    significance: >-
      The companion account, told as the turn toward faith. The word is "переменилась" (changed),
      not "кризис". Note the tension with A Confession: here the change is "вдруг" (sudden), there it
      "had long been preparing" — two framings, neither a "crisis".
    facsimile: null

  - id: v67_083_H_N_Straxovu
    teiId: v67_083_H_N_Straxovu
    genre: letter
    pssTom: 67
    pages: "84"
    date: 1894-03-16
    addressee: "N. N. Strakhov"
    localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
    extract: extracts/v67_083_H_N_Straxovu.txt
    quoteRu: >-
      Вы знаете, что Марья Петровна Фет при смерти — крупозное воспаление легких. До сих пор нет
      кризиса, и шансов смерти, говорят, больше, чем жизни.
    quoteEn: >-
      You know that Marya Petrovna Fet is dying — lobar pneumonia. So far there is no crisis, and the
      chances of death, they say, are greater than of life. (working English)
    significance: >-
      Tolstoy's own use of "кризис" in body text — the *medical* sense, the turning-point of a
      pneumonia. Evidence that for him the word is clinical, not a term for spiritual transformation.
    facsimile: null

  - id: v67_214_L_F_Annenkovoj
    teiId: v67_214_L_F_Annenkovoj
    genre: letter
    pssTom: 67
    pages: "213–214"
    date: 1894-09-04
    addressee: "L. F. Annenkova"
    localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
    extract: extracts/v67_214_L_F_Annenkovoj.txt
    quoteRu: >-
      …я, к счастию, этого отчаяния никогда не знал с тех пор, как родился вновь… то каждый, проходя
      эти возрасты, эти кризисы, не будет пугаться, а будет ждать следующего состояния, будет знать,
      что то же было и с другими.
    quoteEn: >-
      …I, fortunately, have never known this despair since I was born anew… so that everyone, passing
      through these ages, these crises, would not take fright, but would wait for the next state,
      knowing that the same was so for others. (working English)
    significance: >-
      The other clean body-text "кризис": plural ("эти кризисы"), one of the universal "spiritual
      ages" everyone passes through — the opposite of a single great crisis. In the same breath
      Tolstoy describes his own change as "родился вновь" (born anew), not a crisis.
    facsimile: null

  - id: pss85_apparatus_krizis_vozzrenij
    teiId: v85_059_a10_11
    genre: commentary
    pssTom: 85
    pages: "193–196 (editorial note)"
    date: 1885
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol44/vol44.pdf
    extract: extracts/v85_059_a10_11.txt   # body extract; phrase is in the apparatus (--notes=force)
    quoteRu: >-
      …21 мая 1883 г. Толстой, пережив уже кризис своих воззрений и отстраняясь от всяких дел
      материального характера, выдал ей нотариально засвидетельствованную доверенность…
    quoteEn: >-
      …on 21 May 1883 Tolstoy, having already lived through the crisis of his views and withdrawing
      from all affairs of a material character, issued her a notarised power of attorney… (working
      English; EDITORIAL voice — Jubilee Edition apparatus, not Tolstoy)
    significance: >-
      The "crisis" label in the corpus is supplied by the editors, not Tolstoy: "кризис своих
      воззрений". Sits inside the editorial apparatus (recovered with extract_tei.py --notes=force),
      so attributed to the PSS editors, not to Tolstoy's hand.
    facsimile: null

