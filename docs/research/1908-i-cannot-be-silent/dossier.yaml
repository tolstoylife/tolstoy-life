    significance: >-
      The triggering report, embedded verbatim in the essay's first chapter. (A footnote — number 19
      in the TEI, an inline note this extract's --notes=auto run did not recover — records that the
      papers later contradicted the figure of twenty; Tolstoy kept the text and substituted "twelve" for
      "twenty," "leaving the rest as it was," because what is said applies "not to twelve alone but to all
      the thousands." The corrected count survives in the marquee passage's "twenty or twelve.")

  - id: twelve-hanged-bodies
