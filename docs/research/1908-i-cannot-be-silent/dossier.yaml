  - item: "bans[].scope = passages-cut vs. complete-ban+confiscation — the legal appearance was fragmentary but the whole was effectively banned and one publisher arrested."
    phase: 4
    why: "Scope is documentation-only; choose at ingestion."
  - item: "No independent corroboration of the 8 May 1908 Kherson / Strelbitsky / Lubenko-estate hanging beyond Tolstoy's text + PSS commentary."
    phase: 3
    why: "The triggering event rests on a single newspaper notice; flag before any wiki 'event' page asserts it as established fact."
