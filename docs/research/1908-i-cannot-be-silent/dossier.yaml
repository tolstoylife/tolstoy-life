  # ===== D. MANUSCRIPT DESCRIPTION (B. M. Eikhenbaum, PSS Tom 37, pp. 427–432) — attributed =====

  - id: ms-autograph-first-draft
    genre: comments
    pssTom: 37
    pages: "427"
    date: 1956
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_427_432_Ne_mogu_molchat_Opisanie.txt
    quoteRu: >-
      Автограф. 9 лл. почтового формата и 2 отрезка. Первая черновая редакция статьи. Заглавия нет.
    quoteEn: >-
      Autograph. 9 leaves of letter format and 2 cuttings. The first rough redaction of the article. No title. (working English)
    significance: >-
      Manuscript №1 — the autograph first draft, untitled, published as variant №1. The seventeen
      manuscripts run from this nine-leaf autograph to рук. №17, the copy from which the edition prints.
      The facsimile of its first page is rendered in extracts/ (entity:facsimile-first-ms).
    facsimile: extracts/v37_first_manuscript_facsimile.jpg

  - id: ms-gusev-cover-title
    genre: comments
    pssTom: 37
    pages: "427"
    date: 1956
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_427_432_Ne_mogu_molchat_Opisanie.txt
    quoteRu: >-
      На обложке помета Н. Н. Гусева: «О смертной казни» и дата: «15/V 08».
    quoteEn: >-
      On the cover, N. N. Gusev's note: "On Capital Punishment" and the date "15/V 08." (working English)
    significance: >-
      The working title. Gusev's cover note on manuscript №2 (15 May 1908) titles the piece "О смертной
      казни" (On Capital Punishment) — the title carried through the drafts; the diary of 29 May still
      calls it "О смертных казнях." "Не могу молчать" was a late choice, drawn from the text's own refrain.

  - id: ms-chertkov-redink
    genre: comments
    pssTom: 37
    pages: "429"
    date: 1956
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_427_432_Ne_mogu_molchat_Opisanie.txt
    quoteRu: >-
      В. Г. Чертков пометил в ней красными чернилами ряд новых абзацев, исправил пунктуацию и внес значительное число мелких исправлений, вставок и сокращений.
    quoteEn: >-
      V. G. Chertkov marked in it, in red ink, a number of new paragraphs, corrected the punctuation, and made a significant number of small corrections, insertions and abridgements. (working English)
    significance: >-
      The editorial collaboration, documented: Chertkov's red-ink markup of рук. №15 (new paragraphing,
      punctuation, cuts), all approved by Tolstoy (telegram, 9 June). The manuscript description then
      lists the edits line by line — the published text is a Tolstoy–Chertkov text.

  - id: ms-chertkov-cut-coda
    genre: comments
    pssTom: 37
    pages: "431"
    date: 1956
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_427_432_Ne_mogu_molchat_Opisanie.txt
    quoteRu: >-
      Перестаньте, а если не хотите перестать, то делайте то же и надо мною, потому что до тех пор, пока я жив, и вы будете делать то же, я не перестану обличать вас.
    quoteEn: >-
      Stop; and if you will not stop, then do the same to me too, because until I die, and while you go on doing the same, I will not cease to denounce you. (working English)
    significance: >-
      The most charged of Chertkov's cuts (p. 96, line 38). The manuscript's original ending carried this
      explicit "do the same to me / I will not cease to denounce you" coda after "живет в вас"; Chertkov
      cut it and the published text ends on the quieter "живет в вас." The literal "do the same to me"
      demand was therefore pruned from the close — though the milder hang-me wish survives in chapter VI.
      This bears directly on the marquee question (how literal the demand is meant to be).

  # ===== E. THE 1908 DIARY (PSS Tom 56) — byte-faithful ========================================

  - id: diary-phonograph-12may
    genre: diaries
    pssTom: 56
    pages: "117"
    date: "1908-05-12"
    addressee: null
    localPdf: null
    extract: extracts/v56_117_117_1908_05_12.txt
    quoteRu: >-
      Вчера мне было особенно мучительно тяжело от известия о 20 повешенных крестьянах. Я начал диктовать в фонограф, но не мог продолжать.
    quoteEn: >-
      Yesterday it was especially agonisingly hard for me, from the news of the 20 hanged peasants. I began dictating into the phonograph, but could not continue. (working English)
    significance: >-
      Tolstoy's own record of the genesis (12 May 1908 OS). The same entry's opening sentence — "Read
      parts of my work The Law of Violence and the Law of Love... and I finished it" — is the twin dive's
      keystone: the two great 1908 statements meet in one diary page.

  - id: diary-wrote-denunciation-14may
    genre: diaries
    pssTom: 56
    pages: "117–118"
    date: "1908-05-14"
    addressee: null
    localPdf: null
    extract: extracts/v56_117_118_1908_05_14.txt
    quoteRu: >-
      Вчера, 13-го, написал обращение, обличение — не знаю, что — о казнях, и еще о Молочникове. Кажется, то, что нужно.
    quoteEn: >-
      Yesterday, the 13th, I wrote an appeal, a denunciation — I do not know what — about the executions, and also about Molochnikov. It seems to be what is needed. (working English)
    significance: >-
      Tolstoy dates the first draft to 13 May 1908 OS and is unsure of its genre ("an appeal, a
      denunciation — I do not know what"). The generic uncertainty is itself a finding: the essay was born
      formless, between sermon and indictment.

  - id: diary-finished-on-capital-punishment-29may
    genre: diaries
    pssTom: 56
    pages: "130–131"
    date: "1908-05-29"
    addressee: null
    localPdf: null
    extract: extracts/v56_130_132_1908_05_29.txt
    quoteRu: >-
      За это время кончил О смертных Казнях
    quoteEn: >-
      In this time I finished On Capital Punishment (working English)
    significance: >-
      29 May 1908 OS: Tolstoy calls the work by its working title, "О смертных Казнях" (On Capital
      Punishment) — confirming the title was still unsettled two weeks before he sent it out. He thought
      it finished; it was not.

  - id: diary-finished-sent-chertkov-3june
    genre: diaries
    pssTom: 56
    pages: "132"
    date: "1908-06-03"
    addressee: null
    localPdf: null
    extract: extracts/v56_132_133_1908_06_03.txt
    quoteRu: >-
      Кончил «Не могу[…]Молчать» и отослал Черткову.
    quoteEn: >-
      Finished "I Cannot Be Silent" and sent it off to Chertkov. (working English)
    significance: >-
      3 June 1908 OS — the title "Не могу молчать" now in place, the essay sent to Chertkov. The same
      entry adds "Кончил почти и ту, большую" ("almost finished the big one too") — The Law of Violence
      and the Law of Love. The two 1908 works were completed in the same breath.

