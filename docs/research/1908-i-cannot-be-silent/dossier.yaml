      "from agitation" (Gusev). The essay grew out of a dictation he was too shaken to complete; the
      phrase "Нельзя так жить" survives almost verbatim in the finished chapter VI.

  - id: hist-nun-scene-march
    genre: comments
    pssTom: 37
    pages: "425"
    date: 1956
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_425_427_Ne_mogu_molchat_Istorija.txt
    quoteRu: >-
