    quoteEn: >-
      Twelve husbands, fathers, sons — those people on whose goodness, industry and simplicity Russian life alone holds together — were seized, put in prisons, shackled in leg-irons. (working English)
    significance: >-
      The hanging is then narrated in slow, clinical detail (the soaped nooses, the long-haired priest in
      brocade, the doctor feeling the bodies). The unbearable physical particularity is the essay's
      method — not argument but enforced witness.

