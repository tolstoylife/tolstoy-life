    significance: >-
      The pre-history: on 27 March 1908, weeks before the Kherson report, Tolstoy shouted this at a nun
      visiting Yasnaya Polyana; Gusev "had never seen Lev Nikolaevich so agitated." The executions were
      already consuming him; the May report broke the dam.

