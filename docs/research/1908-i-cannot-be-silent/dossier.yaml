    significance: >-
      Chapter VII's closing direct address — to "all participants in these terrible deeds, from those who
      put caps and nooses on people-brothers... up to you, the chief disposers." The address that draft №1
      had aimed by name at Stolypin and Nicholas II is here generalised to every link in the chain.

  - id: the-one-will-is-love
