    significance: >-
      Chapter III's reply to the government's "but what is to be done to calm the people?" — the
      non-resistance core in its negative, political form: not a programme but a cessation.

  - id: revolutionaries-your-children
    genre: works
    pssTom: 37
    pages: "91"
    date: 1908
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_083_096_Ne_mogu_molchat.txt
    quoteRu: >-
      они не только ваши ученики, они — ваше произведение, они ваши дети. Не будь вас — не было бы их
    quoteEn: >-
      they are not only your pupils, they are your product, they are your children. Were it not for you, they would not exist (working English)
    significance: >-
      The symmetric critique (chapter IV): the revolutionaries do exactly what the government does, by
      the same means and the same justification — but the government is worse, and the revolutionaries
      are its creation. "When you want to suppress them by force, you do what a man does who leans with
      all his weight on a door that opens towards him."

  - id: government-worse-than-revolution
    genre: works
    pssTom: 37
    pages: "92"
    date: 1908
