  # ===== B. THE FIRST DRAFT — VARIANTS (PSS Tom 37, pp. 391–399) ================================

  - id: draft1-hang-as-21st
    genre: variants
    pssTom: 37
    pages: "391–392"
    date: 1908
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_391_399_Ne_mogu_molchat_Varianty.txt
    quoteRu: >-
      надели бы на меня на 21-го или 21000 первого саван, колпак и так же столкнули с скамейки, чтобы я своей тяжестью затянул на своем старом горле петлю.
    quoteEn: >-
      they would put on me, as the twenty-first or the twenty-one-thousand-and-first, the shroud and cap and likewise push me off the bench, so that with my own weight I tighten the noose on my old throat. (working English)
    significance: >-
      The hang-me demand in variant №1 (the first rough draft, signed 14 May 1908). Here it is even more
      literal: hang me "as the 21st or the 21,001st." The final text softened "21-го" to "так же как на
      тех двадцать или двенадцать крестьян" and added "намыленную" (soaped) to the noose. The argument is
      present from the very first sketch.

  - id: draft1-names-stolypin-nicholas
    genre: variants
    pssTom: 37
    pages: "393"
    date: 1908
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_391_399_Ne_mogu_molchat_Varianty.txt
    quoteRu: >-
      до вас, двух главных скрытных палачей, своим попустительством участвующих во всех этих преступлениях: Петру Столыпину и Николаю Романову.
    quoteEn: >-
      up to you, the two chief hidden executioners, who by your connivance take part in all these crimes: Pyotr Stolypin and Nikolai Romanov. (working English)
    significance: >-
      The single most consequential redaction. Draft №1 named the Prime Minister and the Tsar directly as
      "the two chief hidden executioners" and addressed the appeal to them by name. The published text
      removed every name and generalised the address (see entity:names-cut). The depersonalisation is what
      lets the essay read as a universal moral appeal rather than a personal denunciation.

