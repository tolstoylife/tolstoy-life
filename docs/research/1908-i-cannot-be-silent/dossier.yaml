  # ===== C. EDITORIAL HISTORY (B. M. Eikhenbaum, PSS Tom 37, pp. 425–427) — attributed ==========

  - id: hist-trigger-report-text
    genre: comments
    pssTom: 37
    pages: "425"
    date: 1956
