  - id: hist-phonograph-dictation
    genre: comments
    pssTom: 37
    pages: "425"
    date: 1956
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_425_427_Ne_mogu_molchat_Istorija.txt
    quoteRu: >-
