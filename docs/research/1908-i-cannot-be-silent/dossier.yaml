    significance: >-
      Chapter V's parable of the painter and the executioner-caretaker: the actual hangman hides and
      fears people because he knows his deed is evil; the ministers and judges who order the killings feel
      no shame. The hands-on executioner is morally above the desk-bound ones.

  - id: for-me-complicity-dependency
    genre: works
    pssTom: 37
    pages: "95"
    date: 1908
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_083_096_Ne_mogu_molchat.txt
    quoteRu: >-
      есть несомненная зависимость между моей просторной комнатой, моим обедом, моей одеждой, моим досугом и теми страшными преступлениями, которые совершаются для устранения тех, кто желал бы отнять у меня то, чем я пользуюсь.
    quoteEn: >-
      there is an undoubted dependence between my spacious room, my dinner, my clothing, my leisure, and those terrible crimes which are committed to remove those who would take from me what I enjoy. (working English)
    significance: >-
      The marquee argument's logical core (chapter VI): the executions are done "in the name of the
      common good" and so "for me, living in Russia" — and Tolstoy's own comfort is materially secured by
      them. The "для меня" (for me) anaphora runs the whole page. This is the personal-complicity claim.

  - id: cannot-live-so
    genre: works
    pssTom: 37
    pages: "95"
    date: 1908
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_083_096_Ne_mogu_molchat.txt
    quoteRu: >-
      Нельзя так жить. Я по крайней мере не могу так жить, не могу и не буду.
    quoteEn: >-
      One cannot live so. I at least cannot live so, cannot and will not. (working English)
    significance: >-
      The title's sense — the refusal to be silent is the refusal to keep living in complicity. The phrase
      "не могу" (I cannot) tolls through the chapter and supplies the title chosen later (the working title
      was "On Capital Punishment"; "I Cannot Be Silent" was fixed in editing).

  - id: marquee-hang-me-too
    genre: works
    pssTom: 37
    pages: "95"
    date: 1908
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_083_096_Ne_mogu_molchat.txt
    quoteRu: >-
      надели на меня, так же как на тех двадцать или двенадцать крестьян, саван, колпак и так же столкнули с скамейки, чтобы я своей тяжестью затянул на своем старом горле намыленную петлю.
    quoteEn: >-
      put on me, just as on those twenty or twelve peasants, the shroud and cap and likewise push me off the bench, so that with my own weight I tighten the soaped noose on my old throat. (working English)
    significance: >-
      THE marquee passage. Having shown that the executions are carried out for him, Tolstoy asks for one
      of two outcomes: prison, where he could know the horrors are no longer done for him — or, "best of
      all," to be hanged alongside the condemned. "Twenty or twelve" carries the corrected count. The
      demand is the personal-complicity argument taken to its literal end.

  - id: brothers-come-to-yourselves
    genre: works
