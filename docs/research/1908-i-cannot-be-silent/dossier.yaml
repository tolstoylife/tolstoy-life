    quoteRu: >-
      «Семь смертных приговоров: два в Петербурге, один в Москве, два в Пензе, два в Риге. Четыре казни: две в Херсоне, одна в Вильне, одна в Одессе».
    quoteEn: >-
      "Seven death sentences: two in Petersburg, one in Moscow, two in Penza, two in Riga. Four executions: two in Kherson, one in Vilna, one in Odessa." (working English)
    significance: >-
      The essay opens not with Tolstoy's voice but with a quoted newspaper tally of death sentences —
      the bare list "in every paper" that he says has gone on "not a week, not a month, not a year, but
      years," in a Russia that "until very recently had by law no death penalty." The form announces the
      subject: the press normalisation of execution.
    facsimile: extracts/v37_083_Ne_mogu_molchat_opening_facsimile.jpg

