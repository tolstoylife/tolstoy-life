contradictions:
  - claim: "The report said twenty peasants were hanged (opening of ch I)."
    correction: "The papers later contradicted it; Tolstoy substituted 'twelve' for 'twenty' in his footnote and left the rest, so the body says 'twelve' and the marquee says 'twenty or twelve.' Not an error — a documented self-correction inside the work."
    evidenceRef: marquee-hang-me-too
  - claim: "The text is dated 31 May 1908 (author's date)."
    correction: "Composition continued to ~15 June 1908 OS (editorial history); the essay was 'finished' on 29 May and 3 June as well. The dateline marks the manuscript sent to Chertkov, not the end of revision."
    evidenceRef: hist-work-period

