    quoteEn: >-
      If there is a difference between you and them, it is by no means in your favour, but in theirs. (working English)
    significance: >-
      Tolstoy lists the mitigating circumstances for the revolutionaries (greater personal risk, youth,
      they at least reject the religion whose God forbids killing) — and concludes the government, which
      claims Christianity, has none. The even-handedness that estranged him from both sides.

