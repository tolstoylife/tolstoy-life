    quoteEn: >-
      Of executions, hangings, murders, bombs they now write and speak as they used to speak of the weather. Children play at hanging. (working English)
    significance: >-
      The measure of the corruption: killing has become as ordinary as weather. (The same chapter gives
      the executioners' market — only one hangman in all Russia in the 1880s; now a Moscow shopkeeper
      and an Orel volunteer haggle over the per-head rate.)

  - id: stop-doing-what-you-do
