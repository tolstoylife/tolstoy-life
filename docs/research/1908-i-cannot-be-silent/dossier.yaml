# ---------------------------------------------------------------------------------------------
# Layer 4 — secondary scholarship (Phase 3). Attributed, not asserted; no byte-fidelity demanded.
# ---------------------------------------------------------------------------------------------
scholarship:
  summary: >-
    English-language scholarship treats "I Cannot Be Silent" as a late-life political protest as much
    as a text — legible as an event. Liza Knapp (Leo Tolstoy: A Very Short Introduction, 2019) gives it
    a whole chapter, "Tolstoy cannot be silent," reading it as the capstone of the first-person voice
    Tolstoy used "for his last thirty years, from Confession to 'I Cannot Be Silent'," and noting it
    brings fiction's "devices, techniques and subject matter" to non-fiction. W. Gareth Jones titled an
    anthology of Tolstoy's polemics after it (1989). Contemporaries cited it directly: Kropotkin (The
    Terror in Russia, 1909) on the "degrading influence" of mass executions; Trotsky's 1908 tribute
    called it "a curse upon the heads of those who serve as hangmen." The essay coincided with Tolstoy's
    80th-birthday-jubilee year and the standing 1901 excommunication; the documented official response
    was to fine publishers and arrest one, not to confront Tolstoy. The Tolstoy→Gandhi nonviolence
    lineage is routed by scholarship through other texts (A Letter to a Hindu, The Kingdom of God Is
    Within You), not this essay. The mainstream contested labels ("Christian anarchist," "conservative
    anarchist" — Trotsky's phrase) are the outside's words; this dive points at the project's
    Christian-anarchism and Tolstoyanism dives rather than adopting them.
  triangulation:
    - evidenceRef: marquee-hang-me-too
      conventionalView: >-
        Scholarship that engages the essay reads the first-person protest / personal implication as its
        core (Knapp: the outward-addressed first-person voice; Trotsky: the "curse… on the hangmen";
        Kropotkin and a 2016 Spanish commentary: individuals' unwitting participation in systemic
        injustice). None contradicts the personal-complicity reading.
      relation: confirms
      source: "Knapp 2019 (OUP); Trotsky 1908 (Die Neue Zeit); Kropotkin 1909."
    - evidenceRef: draft1-names-stolypin-nicholas
      conventionalView: >-
        No secondary source found discusses the variant-level decision to remove Stolypin's and
        Nicholas's names; the published text's namelessness is noted (Wikisource) but not its drafting.
        The corpus (variants + Eikhenbaum's history) supplies the depersonalisation that scholarship
        does not reach.
      relation: extends
      source: null
    - evidenceRef: ms-chertkov-cut-coda
      conventionalView: >-
        Scholarship reads the demand-to-be-hanged as the essay's literal rhetorical peak, but does not
        register that Chertkov (with Tolstoy's approval) cut the most explicit "do the same to me / I
        will not cease to denounce you" coda from the close. The corpus shows the published demand was
        deliberately moderated in editing — complicating the "pure unmediated outburst" reading.
      relation: complicates
      source: null
    - evidenceRef: hist-pub-fragments-fined
      conventionalView: >-
        The newspaper fines, the Sevastopol arrest, the Tula illegal printing, and the simultaneous
        worldwide appearance are confirmed in the secondary literature and Tolstoy bibliography; the
        publication-as-event framing is the standard one.
      relation: confirms
      source: "Knapp 2019; Wikisource; general Tolstoy bibliography."
    - evidenceRef: kherson-report-in-text
      conventionalView: >-
        The Kherson / Strelbitsky / Elisavetgrad detail is confirmed only through Tolstoy's own text and
        the Maude translation (which carries the twenty→twelve footnote). No independent archival record
        of the specific 8 May 1908 hanging or the Lubenko estate raid was located; Kropotkin documents
        comparable cases but not this one by name.
      relation: complicates
      source: "Wikisource / Maude translation; Kropotkin 1909 (analogous cases)."
    - evidenceRef: corruption-spreads-fire
      conventionalView: >-
        Knapp reads the essay as bringing fictional technique to bear; the corpus supplies the specific
        figure (corruption "like fire through dry straw") that the fire-metaphor dive traces — a concrete
        image-level reading the biographical literature does not unpack.
      relation: extends
      source: "Knapp 2019; project fire-metaphor dive."

