# Machine-readable dossier for the "I Cannot Be Silent" (Не могу молчать, 1908) corpus work-dive.
# Created 2026-06-13. Slug: 1908-i-cannot-be-silent.
# Subject: Tolstoy's May–June 1908 essay against capital punishment, written in his 80th-birthday
# year and provoked by a newspaper report of twenty peasants hanged at Kherson. A Prophet-period
# WORK dive (carries a workRecord block — RECORD-CREATING: no works/ record exists yet, so the
# workRecord proposes the full field set for a new one, non-fiction / essays-and-criticism).
# Every evidence[].quoteRu is byte-faithful from the named `extract` file (verify_quotes.py).
# quoteEn is working English (labelled). PSS Tom 37 -> local PDF jubilee-edition/vol06/vol06.pdf
# (verified: that PDF's <book-title> is "...Том 37"). Editorial history is B. M. Eikhenbaum's
# "История писания и печатания" + "Описание рукописей" (PSS Tom 37) — cited as editorial history,
# attributed. Twin dive: ../1908-the-law-of-violence-and-the-law-of-love (same Tom, same year;
# its 12 May 1908 diary entry already cross-references the "20 hanged peasants" that drove THIS work).
# This dive seeds the planned death-penalty theme-dive (P3) — reuse its evidence + entities.

topic:
  slug: 1908-i-cannot-be-silent
  title: "I Cannot Be Silent (Не могу молчать) — a corpus work-dive"
  question: >-
    How did Tolstoy's 1908 essay against capital punishment Не могу молчать come to be written
    (the Kherson hanging of twenty peasants, the failed phonograph dictation, the first draft of
    13 May 1908); what does it argue (the symmetric condemnation of state and revolutionary
    violence, and the personal-complicity demand that he be hanged alongside the condemned because
    the executions are carried out in his name); how was its public appearance itself the story
    (Russian newspapers fined for printing fragments, the complete text only illegal at home and
    abroad through Chertkov); and how does its drafting — draft №1 named Stolypin and Nicholas II,
    the final text removed them, and Chertkov's red-ink edits cut the most explicit "do the same to
    me" coda — bear on reading the personal-complicity argument as the work's centre?
  date: 2026-06-13
  period: prophet
  corpusSurface: [works, variants, diaries, comments, letters]
  dateRange: "1908 (composition 13 May–15 June 1908 OS; publication July 1908; reception 1908–present)"

# ---------------------------------------------------------------------------------------------
# Layer 1 — flat citation ledger.
#   OS = Old Style (Julian, used in Russia); NS = New Style (Gregorian). 1908: OS + 13 = NS.
# ---------------------------------------------------------------------------------------------
evidence:

