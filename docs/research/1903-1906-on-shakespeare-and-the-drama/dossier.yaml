    why: "Affects dateFirstPublished and the publishedDuringLifetime provenance; sources disagree on which printing came first."
  - item: "Identify Tolstoy's daughter-in-law (wife of son Mikhail L. Tolstoy) who translated Crosby's article under Tolstoy's supervision."
    phase: 1
    why: "Named in Grossman's commentary / Stasov's letter but not by full name; a possible minor person entity."
