# Corpus-dive dossier — On Shakespeare and the Drama
# Layer: reference. Primary evidence + entity/visual/scholarship/work-record/coverage maps.
# The dive PROPOSES vault pages and a works record; it never writes them.

topic:
  slug: 1903-1906-on-shakespeare-and-the-drama
  title: "On Shakespeare and the Drama (О Шекспире и о драме)"
  question: >-
    Tolstoy's 1903–04 essay attacking Shakespeare's reputation. Does it confirm or
    over-extend the What Is Art? doctrine — through the claims that Shakespeare's fame is
    a collective "epidemic suggestion" and that his drama fails the religious-art /
    sincerity test (craft without sincerity)?
  date: 2026-06-13
  period: "Prophet period (post-1880); composed 1903–04, published 1906"
  corpusSurface: "work text + variants (Tom 35); composition-window diaries (Toms 54–55) + letters (Toms 74–75, 88); Grossman commentary apparatus (Tom 35)"
  dateRange: "1903-09 .. 1906-11 (composition → first publication); roots from the 1850s"

# ─────────────────────────────────────────────────────────────────────────────
# EVIDENCE LEDGER — flat citation list. quoteRu verified verbatim against `extract`.
# ─────────────────────────────────────────────────────────────────────────────
evidence:

  # ── Genesis: diaries (Tom 54–55) ──
  - id: diary-22sep-preface
    genre: diary
    pssTom: 54
    pages: "192"
    date: "1903-09-22 (OS)"
    extract: extracts/_diaries_1903-1904.txt
    quoteRu: "Пишу несколько дней (больше недели ) предисловие о Шекспире."
    quoteEn: "(working English) I have been writing a preface about Shakespeare for several days (more than a week)."
    significance: "First diary mention; confirms it began as a 'preface' and that writing was already a week old by 22 Sept (OS) — matching the 13 Sept (OS) start the manuscript covers record."
  - id: diary-19dec-finished
    genre: diary
    pssTom: 54
    pages: "200-201"
    date: "1903-12-19 (OS)"
    extract: extracts/_diaries_1903-1904.txt
    quoteRu: "Кончил заниматься Шекспиром и начал о значении религии."
    quoteEn: "(working English) I have finished with Shakespeare and begun on the meaning of religion."
    significance: "The 'finished' date in the diary. But corrections continued: cf. 18 Jan 1904 ('added a bit to Shakespeare'); the last manuscript date is 19 Jan 1904."
  - id: diary-distraction
    genre: diary
    pssTom: 54
    pages: "193-199"
    date: "1903-11-14 .. 1903-12-02 (OS)"
    extract: extracts/_diaries_1903-1904.txt
    quoteRu: "Все вожусь с Шекспиром"
    quoteEn: "(working English) Still messing with Shakespeare."
    significance: "The recurring self-reproach: the essay 'kept growing' (14 Nov) and he kept 'digging'/'messing' with it (24 Nov, 2 Dec) as a distraction from work he judged 'more necessary'."
  - id: diary-18jan-lastadd
    genre: diary
    pssTom: 55
    pages: "8-9"
    date: "1904-01-18 (OS)"
    extract: extracts/_diaries_1903-1904.txt
    quoteRu: "Вчера немного добавил к Шекспиру"
    quoteEn: "(working English) Yesterday I added a little to Shakespeare."
    significance: "The last datable touch to the essay in the diary, the day before the final manuscript date (19 Jan 1904 OS)."

  # ── Genesis: letters (Toms 74, 88) ──
  - id: letter-chertkov-6oct
    genre: letter
    pssTom: 88
    pages: "308-310"
    date: "1903-10-06 (OS)"
    addressee: "V. G. Chertkov"
    extract: extracts/_letters_window.txt
    quoteRu: "Это начатое мною предисловие к статье Crosby об отношении Шекспира к рабочему народу, которое переросло статью Crosby и стоило мне большого труда."
    quoteEn: "(working English) This is the preface I began to Crosby's article on Shakespeare's relation to the working people, which has outgrown Crosby's article and cost me much labour."
    significance: "The clearest statement of the genesis: a preface to Crosby that outgrew its frame. Same letter: he calls it 'a very unexpected work' that has distracted him 'for nearly a month' from 'more necessary works'."
  - id: letter-chertkov-6oct-impression
    genre: letter
    pssTom: 88
    pages: "308-310"
    date: "1903-10-06 (OS)"
    addressee: "V. G. Chertkov"
    extract: extracts/_letters_window.txt
    quoteRu: "Мне хотелось высказать мое много раз и очень добросовестно проверенное впечатление о Шекспире, совершенно противоположное установившемуся."
    quoteEn: "(working English) I wanted to express my many-times and very conscientiously verified impression of Shakespeare, completely opposite to the established one."
    significance: "The essay's self-understanding: a long-tested, deliberate dissent — not a whim. Echoes the essay's own opening."
  - id: letter-stasov-9oct
    genre: letter
    pssTom: 74
    pages: "202-203"
    date: "1903-10-09 (OS)"
    addressee: "V. V. Stasov"
    extract: extracts/_letters_window.txt
    quoteRu: "Я всё копаюсь с Шекспиром et je ne démords pas de mon idée."
    quoteEn: "(working English) I keep digging at Shakespeare, and I won't give up my idea. [French: 'et je ne démords pas de mon idée']"
    significance: "To Stasov, who had supplied the Shakespeare scholarship and visited Yasnaya Polyana in Sept 1903."
  - id: letter-stasov-9oct-halfcentury
    genre: letter
    pssTom: 74
    pages: "202-203"
    date: "1903-10-09 (OS)"
    addressee: "V. V. Stasov"
    extract: extracts/_letters_window.txt
    quoteRu: "Дело не в аристократизме Шекспира, а в извращении, посредством восхваления нехудожественных произведений, эстетического вкуса."
    quoteEn: "(working English) The point is not Shakespeare's aristocratism, but the perversion of aesthetic taste through the praise of non-artistic works."
    significance: "Distinguishes his thesis from Crosby's (whose point WAS Shakespeare's class politics): for Tolstoy the deeper harm is the corruption of taste — the What Is Art? continuity. Same letter: 'I needed to express what has been sitting in me for half a century' (сидело во мне полстолетия)."

  # ── The work itself (Tom 35, pp. 216-272) ──
  - id: essay-great-evil
    genre: works
    pssTom: 35
    pages: "216-217"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "есть великое зло, как и всякая неправда"
    quoteEn: "(working English) [the indisputable fame of Shakespeare] is a great evil, like every untruth."
    significance: "Ch I. Frames the whole essay: the fame is not merely mistaken but harmful, because untrue. Sets up the 'suggestion = lie = evil' chain completed in Ch VIII."
  - id: essay-fifty-years
    genre: works
    pssTom: 35
    pages: "216-217"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "я ли безумен, находя ничтожными и прямо дурными произведения, которые считаются верхом совершенства всем образованным миром"
    quoteEn: "(working English) am I mad, finding insignificant and downright bad the works that the whole educated world considers the height of perfection…"
    significance: "Ch I. The 50-year struggle and the 75-year-old's re-reading; the personal stake that Orwell (1947) reads autobiographically."
  - id: essay-leir-better
    genre: works
    pssTom: 35
    pages: "239-240"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "вся эта старая драма без всякого сравнения во всех отношениях лучше переделки Шекспира"
    quoteEn: "(working English) this whole old play is, beyond all comparison and in every respect, better than Shakespeare's reworking of it."
    significance: "Ch IV. The claim that the anonymous old King Leir surpasses Shakespeare — the natural reconciliation scene (both kneel) vs Cordelia's needless death."
  - id: essay-hamlet-hypnosis
    genre: works
    pssTom: 35
    pages: "245-246"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "то слепое поклонение Шекспиру, тот нерассуждающий гипноз"
    quoteEn: "(working English) that blind worship of Shakespeare, that unreasoning hypnosis…"
    significance: "Ch IV. Hamlet as the case where 'hypnosis' forbids even the thought that a Shakespeare work could be ungenius; critics invented 'characterlessness as a profound character'."
  - id: essay-homer-insincere
    genre: works
    pssTom: 35
    pages: "256-257"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "Сейчас видно, что он не верит в то, что говорит, что оно ему не нужно"
    quoteEn: "(working English) One sees at once that he does not believe what he says, that he has no need of it…"
    significance: "Ch V. The sincerity charge stated against Homer's foil: Homer believes and never exaggerates; Shakespeare neither believes nor needs what he writes."
  - id: essay-three-criteria-sincerity
    genre: works
    pssTom: 35
    pages: "260-261"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "сущность искусства состоит в заражении воспринимающего произведение искусства чувством автора"
    quoteEn: "(working English) the essence of art consists in infecting the perceiver of the work of art with the author's feeling."
    significance: "Ch VI. The third criterion — sincerity — is the What Is Art? infection (заражение) theory, here named as the standard Shakespeare fails. The hinge of the marquee question."
  - id: essay-content-lowest
    genre: works
    pssTom: 35
    pages: "261-262"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "самое низменное, пошлое миросозерцание, считающее внешнюю высоту сильных мира действительным преимуществом людей, презирающее толпу, т. е. рабочий класс"
    quoteEn: "(working English) the lowest, most vulgar worldview, which regards the outward elevation of the powerful as a real human advantage and despises the crowd, i.e. the working class."
    significance: "Ch VI. The content critique — the point Crosby raised, now in Tolstoy's own voice; the failure of criterion 1 (content)."
  - id: essay-epidemic-suggestion
    genre: works
    pssTom: 35
    pages: "263-264"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "слава эта есть одно из тех эпидемических внушений, которым всегда подвергались и подвергаются люди"
    quoteEn: "(working English) this fame is one of those epidemic suggestions to which people have always been, and still are, subject."
    significance: "Ch VII. THE marquee thesis. Compared to the Crusades, witch-belief, torture-for-truth, the philosopher's stone, the Dutch tulip mania; magnified by the press 'like a snowball'."
  - id: essay-dreyfus
    genre: works
    pssTom: 35
    pages: "265-266"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "делом Дрейфуса"
    quoteEn: "(working English) the Dreyfus affair."
    significance: "Ch VII. The worked contemporary example of press-amplified collective suggestion — a recent case (1894–1906) his readers had lived through."
  - id: essay-goethe-proclaimed
    genre: works
    pssTom: 35
    pages: "268-269"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "провозгласил Шекспира великим поэтом"
    quoteEn: "(working English) [Goethe] proclaimed Shakespeare a great poet."
    significance: "Ch VIII. The genealogy: Goethe — 'dictator of public opinion in aesthetic questions' — canonised him because their worldviews coincided; the German critics, 'like crows on carrion' (как вороны на падаль), then built the theory of 'objective art' out of him."
  - id: essay-suggestion-is-lie
    genre: works
    pssTom: 35
    pages: "270-271"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "Внушение же всегда есть ложь, а всякая ложь есть зло."
    quoteEn: "(working English) But suggestion is always a lie, and every lie is evil."
    significance: "Ch VIII. Closes the chain from Ch I (fame as 'untruth'): suggestion → lie → evil; hence the harm of Shakespeare-worship is moral, not merely aesthetic."
  - id: essay-conclusion-other-sources
    genre: works
    pssTom: 35
    pages: "271-272"
    date: "1903-1904"
    extract: extracts/v35_216_272_O_Shekspire_i_o_drame.txt
    quoteRu: "учение о жизни, покуда нет настоящей религиозной драмы, надо искать в других источниках"
    quoteEn: "(working English) the teaching of life, until there is a true religious drama, must be sought in other sources."
    significance: "The essay's final words. The positive programme: a new religious form of drama, and meanwhile life's teaching from elsewhere — the What Is Art? religious-art standard restated."

  # ── Variants / redactions (Tom 35, pp. 557-577) ──
  - id: var-preface-original
    genre: works
    pssTom: 35
    pages: "557-558"
    date: "1903 (рук. № 1)"
    extract: extracts/v35_557_577_Varianty.txt
    quoteRu: "Печатая прекрасное основательное исследование г-на Э. Кросби об отношении Шекспира к рабочему народу, я считаю не лишним высказать и мое отношение к произведениям Шекспира"
    quoteEn: "(working English) In printing Mr. E. Crosby's excellent, thorough study of Shakespeare's attitude to the working people, I think it not superfluous to express my own attitude to Shakespeare's works…"
    significance: "Draft № 1 (рук. № 1), titled ПРЕДИСЛОВИЕ (Preface) — the essay's first form, literally a preface to Crosby. The published Ch I softens 'Печатая… предисловие' to 'Crosby's article led me to the thought'. Keystone redaction."
  - id: var-would-not-die
    genre: works
    pssTom: 35
    pages: "557-558"
    date: "1903 (рук. № 1)"
    extract: extracts/v35_557_577_Varianty.txt
    quoteRu: "мне бы не хотелось умереть, не высказав его"
    quoteEn: "(working English) I should not like to die without having expressed it."
    significance: "Draft № 1. The personal urgency, cut from the published opening — the 75-year-old's compulsion that Orwell (1947) reads as self-reproach."
  - id: var-infection-cut
    genre: works
    pssTom: 35
    pages: "571-572"
    date: "1903 (рук. № 12)"
    extract: extracts/v35_557_577_Varianty.txt
    quoteRu: "всякое художественно воспринимаемое впечатление есть заражение тем чувством, которое испытывает художник"
    quoteEn: "(working English) every artistically perceived impression is an infection with the feeling the artist experiences…"
    significance: "Draft № 24 (рук. № 12) — a CUT passage giving the psychological mechanism: the feeling of union with the many who praise Shakespeare counterfeits the genuine aesthetic union, deceiving even gifted readers (Goethe, Hugo, Turgenev). The most explicit What Is Art? bridge; dropped from the published text."
  - id: var-awl-objectivity
    genre: works
    pssTom: 35
    pages: "568-569"
    date: "1903 (рук. № 11)"
    extract: extracts/v35_557_577_Varianty.txt
    quoteRu: "Шила в мешке не утаишь."
    quoteEn: "(working English) You can't hide an awl in a sack. [i.e. an author's worldview always shows through]"
    significance: "Draft № 15 (рук. № 11) — a CUT critique of 'objectivity in art': the 'Olympianism of Goethe and the soaring of Shakespeare above life's events' is only proof that 'they are not in earnest'. Objectivity survives only obliquely in the published Ch VIII."
  - id: var-hamlet-nochar
    genre: works
    pssTom: 35
    pages: "562"
    date: "1903 (рук. № 8)"
    extract: extracts/v35_557_577_Varianty.txt
    quoteRu: "Гамлет есть отсутствие характера"
    quoteEn: "(working English) Hamlet is the absence of character."
    significance: "Draft № 7/8. The blunt form of the Hamlet argument ('only Shakespeare's worshippers recognised this absence of character as a character')."

  # ── Editorial commentary (Grossman, Tom 35, pp. 680-685) — secondary/provenance ──
  - id: comm-start-13sep
    genre: commentary
    pssTom: 35
    pages: "680-684"
    date: "1950 (Grossman)"
    extract: extracts/_commentary_istoriya-pisaniya.txt
    quoteRu: "Как видно по обложкам, сохранившимся в рукописях статьи, она была начата 13 сентября."
    quoteEn: "(working English) As is clear from the covers preserved among the manuscripts of the essay, it was begun on 13 September."
    significance: "Provenance for the composition start (13 Sept 1903, OS). Secondary (editorial); used for dates, not asserted as Tolstoy's voice."
  - id: comm-continuation-of-wia
    genre: commentary
    pssTom: 35
    pages: "680-684"
    date: "1950 (Grossman)"
    extract: extracts/_commentary_istoriya-pisaniya.txt
    quoteRu: "с которым статья о Шекспире непосредственно связана, являясь как бы его продолжением"
    quoteEn: "(working English) …with which [What Is Art?] the Shakespeare essay is directly connected, being, as it were, its continuation."
    significance: "The PSS editor's own statement of the What Is Art? link, and that the theses formed in 1896–97. Grounds the sequel relationship and the marquee."
  - id: comm-publication
    genre: commentary
    pssTom: 35
    pages: "680-684"
    date: "1950 (Grossman)"
    extract: extracts/_commentary_istoriya-pisaniya.txt
    quoteRu: "Статья появилась сначала в газете «Русское слово» 1906 г."
    quoteEn: "(working English) The essay first appeared in the newspaper Russkoe Slovo in 1906."
    significance: "Provenance for first publication: Russkoe Slovo, Nov 1906 (OS, nos. 277–285), then Sytin separate ed. (Moscow 1907) and the English Free Age Press ed. (Christchurch 1907)."
  - id: comm-conspectus-25sep
    genre: commentary
    pssTom: 35
    pages: "684-685"
    date: "1950 (Grossman)"
    extract: extracts/_commentary_opisanie-rukopisej.txt
    quoteRu: "конспект в 11 пунктах (пункт 1 не сохранился), с перечислением недостатков в творчестве Шекспира. В конце листа 5 этой рукописи дата Толстого: «25 сент.»."
    quoteEn: "(working English) [Manuscript № 6 — also an autograph —] a conspectus in 11 points (point 1 not preserved), enumerating the defects in Shakespeare's work. At the end of leaf 5 of this manuscript is Tolstoy's date: '25 Sept.'."
    significance: "Provenance for the 11-point conspectus (the argument's skeleton) and its date, 25 Sept (OS) — i.e. the analytic spine was fixed within ~2 weeks of starting. Secondary (editorial, from the manuscript description)."

