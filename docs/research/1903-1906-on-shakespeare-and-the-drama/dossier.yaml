# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). See extracts/_scholarship.md.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    English-language criticism overwhelmingly treats the essay as a brilliant failure.
    George Orwell's "Lear, Tolstoy and the Fool" (1947) set the durable terms: the logical
    case is partly unanswerable, but it cannot dislodge the enjoyment readers take from the
    plays (the "survival" test of merit), and the venom is best explained by the Lear-Tolstoy
    biographical parallel — renunciation, flight, a death among strangers. A. N. Wilson
    (1988: "fifteen thousand words of nonsense") and Harold Bloom (Tolstoy's attack as a
    strong writer's anxiety-of-influence repudiation) repeat the dismissal. A minority grants
    Tolstoy something: G. Wilson Knight (1934) conceded he exposed real weaknesses in
    Shakespeare-worship; Shaw (who coined "bardolatry") agreed on Shakespeare's missing social
    conscience while defending the "word-music"; George Gibian (1957, the only dedicated study)
    locates Tolstoy in the French neoclassical tradition; Catherine Brown (2015) reads it as a
    self-aware moral criticism. The hostile mainstream, as Brown notes, tends to beg the
    question — taking the pleasure in Shakespeare as a settled fact, which is exactly what
    Tolstoy contests.
  triangulation:
    - evidenceRef: essay-three-criteria-sincerity
      conventionalView: "The essay is the practical application of What Is Art? — the same three criteria, with sincerity (infection) decisive."
      relation: confirms
      source: "Gibian (1957), Tolstoj and Shakespeare; Orwell (1947)"
    - evidenceRef: essay-epidemic-suggestion
      conventionalView: "Orwell calls the 'epidemic suggestion' a conspiracy-theory substitute for argument; Bloom reframes the fame as a real aesthetic fact the essay fails to explain."
      relation: complicates
      source: "Orwell (1947); Bloom (1994), The Western Canon"
    - evidenceRef: essay-goethe-proclaimed
      conventionalView: "Gibian places Tolstoy himself in a French (not German) neoclassical lineage, which softens the Germany-as-villain story; Orwell treats the historical claim as beside the point."
      relation: complicates
      source: "Gibian (1957); Orwell (1947)"
    - evidenceRef: essay-content-lowest
      conventionalView: "Shaw and Crosby independently affirm the class critique — Shakespeare had no social conscience."
      relation: confirms
      source: "Shaw (1906 letter); Crosby (1902/1906)"
    - evidenceRef: essay-leir-better
      conventionalView: "Orwell, Bloom and Wilson read the scene-by-scene demolition as wilfully obtuse — missing verbal music, symbolic depth, the Fool; Orwell defends the very Fool material Tolstoy omits."
      relation: contradicts
      source: "Orwell (1947); Bloom (1998); Wilson (1988)"
    - evidenceRef: essay-fifty-years
      conventionalView: "Orwell develops the Lear-Tolstoy autobiographical parallel (renunciation → resentment), which Tolstoy's own account does not make."
      relation: extends
      source: "Orwell (1947); Brown (2015)"
    - evidenceRef: var-preface-original
      conventionalView: "The Crosby-preface origin and the self-reproached 'distraction' are confirmed by the 1906 edition's own structure and front matter."
      relation: confirms
      source: "Funk & Wagnalls (1906) volume; Crosby (1902)"

