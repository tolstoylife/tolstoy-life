coverage:
  - surface: "Genesis & composition (incl. the people)"
    status: covered
    note: "13 dated diary/letter passages (Toms 54–55, 74, 88) + Grossman commentary; the people sweep yielded Crosby, Stasov, Chertkov, Maude, Storozhenko, the daughter-in-law (translator)."
  - surface: "What the work says (structural map)"
    status: covered
    note: "All 8 chapters read; keystones for each (the Lear retelling, no-characters/Leir, Homer/sincerity, the three criteria, epidemic suggestion, the Goethe genealogy, the conclusion)."
  - surface: "Redactions & textual history"
    status: covered
    note: "Variants № 1–28 read: the original ПРЕДИСЛОВИЕ opening, the 11-point conspectus (dated 25 Sept), and the cut passages (the infection/union mechanism, the objectivity critique, the Shakespeare-the-man portrait, the Turgenev anecdote, the Koran analogy)."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "Russkoe Slovo Nov 1906 (OS) → Sytin 1907 → English Free Age Press 1907 / Funk & Wagnalls 1906 (Tchertkoff & Mayo). English-edition priority and the Fortnightly Dec 1906 appearance flagged to needsReview."
  - surface: "Reception & afterlife"
    status: partial
    note: "Scholarly reception strong (Orwell, Knight, Shaw, Bloom, Gibian, Wilson, Brown). Contemporary 1906–07 press reaction (Russian and English) is thin in open sources — needsReview; the 1907 ed.'s 'Press against Shakespeare' section not recovered."
  - surface: "Scholarly context (triangulation)"
    status: covered
    note: "7 triangulation entries; the question-begging move in the hostile mainstream named and attributed (Brown 2015)."
  - surface: "Marquee question (confirm vs over-extend WIA)"
    status: covered
    note: "Tested as hypothesis: confirms (faithful application of the three criteria) + extends (the hypnotism charge generalised into a press-amplified social-contagion theory of fame); the unfalsifiable sincerity verdict noted as the doctrine's exposed vulnerability."
  - surface: "Visual & manuscript record"
    status: covered
    note: "4 PD images cached (Tolstoy 1906, Crosby 1904, Stasov/Repin 1905, Droeshout 1623) + full provenance + fetch recipe for the Funk & Wagnalls 1906 title page (IA)."

# ─────────────────────────────────────────────────────────────────────────────
contradictions:   # intra-corpus (primary-vs-primary) only
  - claim: "The launch framing: 'published 1906 as the preface to Crosby's book'."
    correction: "The essay was CONCEIVED as a preface to Crosby (draft № 1 is titled ПРЕДИСЛОВИЕ) but OUTGREW it into a standalone essay (Chertkov, 6 Oct 1903). It was published on its own (Russkoe Slovo 1906; Sytin separate ed. 1907). The English editions printed it bound TOGETHER WITH Crosby's companion piece — that is where 'with Crosby' is true."
    evidenceRef: var-preface-original
  - claim: "A single 'date completed' for the essay."
    correction: "Tolstoy declared it 'finished' in the diary 19 Dec 1903 (OS) but went on correcting it; the last manuscript date is 19 Jan 1904 (OS), and the diary records an addition on 18 Jan 1904. Composition spans Sept 1903 – Jan 1904, not a clean single endpoint."
    evidenceRef: diary-18jan-lastadd

notCovered:
  - "The 1851 anonymous old play King Leir itself (Tolstoy's preferred text) — not in this corpus; would need an external Elizabethan-drama source."
  - "Crosby's companion essay Shakespeare's Attitude toward the Working Classes (the occasion) — not Tolstoy's text; available in the Funk & Wagnalls 1906 / Free Age Press 1907 volumes (IA)."
  - "The full 1151-unit manuscript fond (Tolstoy Museum, Moscow) — only the 48 dated covers and key drafts (№ 1, 6, 8, 11, 12) are characterised from Grossman's description."
  - "Variant drafts beyond № 1–28 / fine-grained collation of which published sentence derives from which redaction."
  - "Tolstoy's earlier scattered Shakespeare remarks (1850s–1894) — characterised from Grossman's commentary, not independently swept from the diaries/letters of those decades (out of the declared composition window)."

