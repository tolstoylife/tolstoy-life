references:
  primary:
  - 'Толстой Л. Н. Полное собрание сочинений: в 90 тт. — М.: Гос. изд. «Художественная литература», 1928–1958 (PSS, Jubilee Edition; local copies at primary-sources/jubilee-edition/). Christian-anarchism material concentrated in Toms 52 (diary), 67, 68, 72, 73 (letters), 28 (The Kingdom of God Is Within You).'
  - tolstoydigital TEI corpus, Слово Толстого project, HSE Moscow. CC BY-SA. https://github.com/tolstoydigital/TEI (local copy at primary-sources/tolstoydigital-TEI/).
  background:
  - 'Eltzbacher, Paul. Der Anarchismus. Berlin: J. Guttentag, 1900 — the book that classified Tolstoy among the seven principal anarchists and prompted the 1900 letter. English trans. Steven T. Byington, Anarchism: Exponents of the Anarchistic Philosophy (New York: Benjamin R. Tucker, 1908).'
  - 'Christoyannopoulos, Alexandre. Christian Anarchism: A Political Commentary on the Gospel. Exeter: Imprint Academic, 2010 — the fullest treatment; explicit that the label is the scholarship''s, not Tolstoy''s.'
  - 'Christoyannopoulos, Alexandre. Tolstoy''s Political Thought: Christian Anarcho-Pacifist Iconoclasm Then and Now. London: Routledge (BASEES series) — systematises Tolstoy''s political thought under the label. [Publication year unsettled — see needsReview.]'
  - 'Alston, Charlotte. Tolstoy and His Disciples: The History of a Radical International Movement. London: I.B. Tauris, 2013 — maps the international circle (Schmitt, Kenworthy, Crosby, Ortt) in which the phrase circulated.'
  - 'Marshall, Peter. Demanding the Impossible: A History of Anarchism. London: HarperCollins, 1992 — ch. ''Leo Tolstoy: The Count of Peace''; the standard general history, states Tolstoy ''did not publicly call himself an anarchist because of that title''s associations with violence''.'
  - Morris, Brian. 'Tolstoy and Anarchism' (The Anarchist Library) — characterises Tolstoy's thought as 'a religious form of anarchism' and gives the violence-association explanation of his refusal.
  - 'Hopton, Terry. ''Tolstoy, God and Anarchism.'' Anarchist Studies 8, no. 1 (2000): 27–52 — locates Tolstoy''s thought within the anarchist tradition.'
  - 'Chertkov, V. G. O khristianskom anarkhizme. Christchurch: Свободное слово, 1905 — the in-circle programmatic statement that gave «христианский анархизм» consolidated Russian form (so titled in the PSS Tom 72 apparatus; possibly the same pamphlet listed elsewhere as Protiv vlasti — see needsReview). Not held locally.'
