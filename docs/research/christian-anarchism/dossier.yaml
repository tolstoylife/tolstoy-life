needsReview:
- item: 'Gabriel Sacy (1858–1903): Syrian-born; head of the personnel office at the Egyptian Ministry of Finance, Cairo; wrote Du Règne de Dieu et de l''Agneau connu sous le nom de Bábysme (Cairo, 1902). The PSS calls him «бабист» (Bábí), but the Baháʼí record (Adib Masumian) shows him moving toward the Baháʼí branch under Abu''l-Faḍl Gulpáygání by ~1900.'
  phase: 3
  why: Identity now sufficient for a stub (resolved via Phase-3 sweep); the Bábí-vs-Baháʼí nuance matters for reading the letter and should be carried into any wiki page.
- item: Gabriel Sacy portrait — no image on Wikimedia Commons (search returns only the unrelated orientalist Silvestre de Sacy). No portrait obtained.
  phase: 2
  why: Visual record for Sacy is empty; would need an Egyptian/Russian archive request if a portrait is wanted.
- item: 'Christoyannopoulos citation — Christian Anarchism (Imprint Academic, 2010) is firm. The companion Tolstoy''s Political Thought (Routledge, BASEES) has an unsettled year: the vault page cites 2009, a Routledge catalogue page returned 2013, and the original hardback may differ. Cited without year until confirmed.'
  phase: 3
  why: Avoid asserting a wrong publication year for a secondary source; confirm against the book itself before ingestion.
- item: Chertkov 1905 Christchurch booklet title — cited by the PSS Tom 72 apparatus (and the legacy/dive-#1 surveys) as «О христианском анархизме»; a Russian-anarchism bibliography lists a 1905 Christchurch Chertkov title «Против власти» (Against Authority).
  phase: 3
  why: Confirm whether these are the same pamphlet under different titles or two distinct publications before any catalogue entry.
- item: The claim that 'Christian anarchism' was coined by reviewers of The Kingdom of God Is Within You in 1894 — made on the vault page website/src/wiki/Christian Anarchism.md and repeated widely on the web — is uncited and could not be verified in the Phase-3 sweep.
  phase: 3
  why: 'Flag when ingesting the vault page: its own <!-- NEEDS PRIMARY SOURCE --> note for this claim is justified — the dive could not source it either. The corpus supports a circle-of-correspondents genealogy instead.'
