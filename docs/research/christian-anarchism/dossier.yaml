topic:
  slug: christian-anarchism
  title: Tolstoy and "Christian anarchism"
  question: Where, and in what voice, does Tolstoy engage the label «христианский анархизм» / 'anarchist' across the local corpus — given that Eltzbacher (1900) canonised him as an anarchist, that he refused the political label while affirming the religious substance, and that he used «христианский анархизм» in his own voice exactly once (to Sacy, 1901)?
  date: '2026-05-30'
  period: prophet
  corpusSurface:
  - diaries
  - letters
  - works
  dateRange: 1894–1901
evidence:
- id: v52_seed_opener
  genre: diary
  pssTom: 52
  pages: 138–140
  date: '1894-09-10'
  addressee: diary (Yasnaya Polyana)
  localPdf: primary-sources/jubilee-edition/vol18/vol18.pdf
  extract: extracts/v52_138_140_1894_09_10.txt
  quoteRu: Вчера утром, проснувшись, думал об ответе об анархизме, как быть без правительства, англичанину.
  quoteEn: Yesterday morning, on waking, I was thinking about the answer about anarchism, how to be without government, to the Englishman. (working English)
  significance: THE SEED. The opening line of the 10 Sept 1894 diary records the question Tolstoy was turning over — 'how to be without government' — put to him by an Englishman, six years before Eltzbacher's Der Anarchismus (1900) made the question public.
  facsimile: null
- id: v52_seed_reframing
  genre: diary
  pssTom: 52
  pages: 138–140
  date: '1894-09-10'
  addressee: diary (Yasnaya Polyana)
  localPdf: primary-sources/jubilee-edition/vol18/vol18.pdf
  extract: extracts/v52_138_140_1894_09_10.txt
  quoteRu: 'Ответ не может быть дан на вопрос, потому что он дурно поставлен. Вопрос не в том — устроить государство: по нынешнему, или по новому. Я и никто из нас не приставлен к решению этого вопроса.'
  quoteEn: The answer cannot be given to the question, because it is badly posed. The question is not whether to arrange the state in the present way or in a new way. Neither I nor any of us is appointed to the solving of that question. (working English)
  significance: 'The structural move that defines Tolstoy''s ''anarchism'': the question ''how to organise a stateless society'' is rejected as wrongly posed. No one is appointed to redesign the state; that is not the question a person can answer.'
  facsimile: null
- id: v52_seed_dilemma
  genre: diary
  pssTom: 52
  pages: 138–140
  date: '1894-09-10'
  addressee: diary (Yasnaya Polyana)
  localPdf: primary-sources/jubilee-edition/vol18/vol18.pdf
  extract: extracts/v52_138_140_1894_09_10.txt
  quoteRu: подчинить ли свою совесть делам, совершающимся вокруг меня, признать ли себя солидарным с правительством, которое вешает заблудших людей, гонит на убийство солдат, развращает опиумом и водкой народ и т. п., или подчинить свои дела совести, т. е. не участвовать в правительстве, дела которого противны моему сознанию?
  quoteEn: '[the only question is] whether to subordinate my conscience to the deeds being done around me — to acknowledge myself in solidarity with a government that hangs erring men, drives soldiers to murder, debauches the people with opium and vodka, and so on — or to subordinate my deeds to my conscience, that is, not to take part in a government whose deeds are repugnant to my consciousness. (working English)'
  significance: 'The real question, in Tolstoy''s reframing: not what order to build, but whether to lend one''s conscience to a violent state or withdraw it. The Christian-anarchist answer is individual and religious (refusal of participation), not a political programme.'
  facsimile: null
- id: v72_eltzbacher_praise_ru
  genre: letter
  pssTom: 72
  pages: 424–426
  date: '1900-08-01'
  addressee: Paul Eltzbacher
  localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
  extract: extracts/v72_341_PaulyuElcbaxeruPaulEltzhacher.txt
  quoteRu: 'Ваша книга делает для анархизма то, что 30 лет назад было сделано для социализма: вводит его в программу политических наук. Ваша книга мне чрезвычайно понравилась. Она совершенно объективна, понятна, и, насколько я могу судить, источники в ней отлично использованы.'
  quoteEn: 'Your book does for anarchism what was done thirty years ago for socialism: it brings it into the programme of the political sciences. Your book pleased me exceedingly. It is entirely objective, intelligible, and — so far as I can judge — the sources in it are excellently handled. (working English)'
  significance: The praise that sets up the refusal. Tolstoy genuinely admires Eltzbacher's Der Anarchismus (1900), which classified him as one of seven principal anarchist thinkers (with Godwin, Proudhon, Stirner, Bakunin, Kropotkin, Tucker) — making the qualified denial that follows all the sharper.
  facsimile: null
- id: v72_eltzbacher_reject_ru
  genre: letter
  pssTom: 72
  pages: 424–426
  date: '1900-08-01'
  addressee: Paul Eltzbacher
  localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
  extract: extracts/v72_341_PaulyuElcbaxeruPaulEltzhacher.txt
  quoteRu: Мне кажется только, что я не анархист в смысле политического реформатора. В оглавлении вашей книги под словом «насилие» сделаны указания на разные страницы из других сочинений, но ни одной ссылки на мои. Не доказательство ли это того, что то учение, которое вы мне приписываете и которое, в сущности, есть не что иное, как учение Христа, вовсе не политическое, а религиозное учение?
  quoteEn: It seems to me only that I am not an anarchist in the sense of a political reformer. In the index of your book under the word 'violence' references are made to various pages of the other writers, but not one to mine. Is this not proof that the teaching which you ascribe to me, and which is, in essence, nothing other than the teaching of Christ, is not a political but a religious teaching? (working English)
  significance: 'THE REJECTION (political). The classic double move: refuse the label (''not an anarchist in the sense of a political reformer''), affirm the substance, re-name it Christ''s teaching. The index argument is the proof — Eltzbacher''s own book has no Tolstoy reference under ''violence'', because Tolstoy wrote on non-resistance as religion, never on violence as politics. (PSS Tom 72 p.442 facsimile.)'
  facsimile: extracts/pss-pages/tom72-eltzbacher-442.png
- id: v72_eltzbacher_reject_de
  genre: letter
  pssTom: 72
  pages: 424–426
  date: '1900-08-01'
  addressee: Paul Eltzbacher
  localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
  extract: extracts/v72_341_PaulyuElcbaxeruPaulEltzhacher.txt
  quoteRu: 'Mir scheint nur, dass ich kein Anarchist bin im Sinne eines politischen Reformators. Im Register Ihres Buches beim Worte: «Zwang» sind verschiedene Seiten bei allen anderen angegeben, aber keine in meinen Schriften. Ist das nicht ein Beweis, dass die Lehre, die Sie mir zuschreiben, aber die eigentlich nur die Lehre Christi ist, keine politische aber eine religiöse Lehre ist?'
  quoteEn: '[Tolstoy''s German original of the same passage] It seems to me only that I am not an anarchist in the sense of a political reformer. In the register of your book under the word ''Zwang'' [coercion] various pages are given for all the others, but none in my writings. Is this not a proof that the teaching you ascribe to me, but which is really only the teaching of Christ, is not a political but a religious teaching? (working English)'
  significance: Tolstoy's own German original of the rejection (the letter is bilingual, German then his Russian). 'quoteRu' here holds the German as it stands in Tolstoy's hand. Note the German index word is «Zwang» (coercion); the Russian renders it «насилие» (violence).
  facsimile: null
- id: v73_sacy_ru
  genre: letter
  pssTom: 73
  pages: 109–110
  date: '1901-07-28'
  addressee: Gabriel Sacy
  localPdf: primary-sources/jubilee-edition/vol37/vol37.pdf
  extract: extracts/v73_126_GabrielyuSasiGabrielSacy.txt
  quoteRu: я все-таки думаю, что бабизм, как нравственное и гуманитарное учение, имеет большое будущее в восточном мире. Имея много общего с христианским анархизмом, он должен рано или поздно с ним слиться.
  quoteEn: I still think that Babism, as a moral and humanitarian doctrine, has a great future in the eastern world. Having much in common with Christian anarchism, it must sooner or later merge with it. (working English)
  significance: THE UNIQUE SELF-ATTESTATION. The only place in the entire 90-volume Jubilee Edition where Tolstoy uses «христианский анархизм» in his own voice. Even here it is third-person — Babism 'has much in common with Christian anarchism' — naming it as an existing body of doctrine, one step short of 'I am a Christian anarchist'. (PSS Tom 73 p.154 facsimile.)
  facsimile: extracts/pss-pages/tom73-sacy-154.png
- id: v73_sacy_fr
  genre: letter
  pssTom: 73
  pages: 109–110
  date: '1901-07-28'
  addressee: Gabriel Sacy
  localPdf: primary-sources/jubilee-edition/vol37/vol37.pdf
  extract: extracts/v73_126_GabrielyuSasiGabrielSacy.txt
  quoteRu: je crois tout de même que le Babisme comme doctrine morale et humanitaire a un grand avenir dans le monde oriental ayant beaucoup de rapports avec l’anarchisme chrétien et tôt ou tard doit s’unir à lui.
  quoteEn: '[Tolstoy''s French original] ...I still believe that Babism, as a moral and humanitarian doctrine, has a great future in the eastern world, having much in common with Christian anarchism (l''anarchisme chrétien) and sooner or later must unite with it. (working English)'
  significance: Tolstoy's own French original of the Sacy attestation (the letter is bilingual, French then his Russian). The phrase in his French hand is «l'anarchisme chrétien». 'quoteRu' here holds the French as it stands in the letter.
  facsimile: null
- id: v67_davidson_corroborate
  genre: letter
  pssTom: 67
  pages: 178–180
  date: '1894-07-23'
  addressee: John Morrison Davidson
  localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
  extract: extracts/v67_179_DzhonuMorrisonuDavidsonu.txt
  quoteRu: социалистическая, коммунистическая и анархическая теории приводятся в подкрепление христианской истины, которая составляет ее главную часть.
  quoteEn: the socialist, communist and anarchist theories are brought in to corroborate the Christian truth, which forms its chief part. (working English)
  significance: 'How Tolstoy ranks the relation. Praising Davidson''s The Gospel of the Poor, he approves the order of subordination: the political theories (socialist, communist, anarchist) serve to corroborate the Christian truth — not the reverse. The same hierarchy the Eltzbacher and Sacy letters state for ''anarchism'' six years later.'
  facsimile: null
- id: v68_schmitt_gods_work
  genre: letter
  pssTom: 68
  pages: 26–28
  date: '1895-02-01'
  addressee: Eugen Heinrich Schmitt
  localPdf: primary-sources/jubilee-edition/vol34/vol34.pdf
  extract: extracts/v68_024_E_G_SHmitu.txt
  quoteRu: Ваше дело, наше дело, т. е. божье дело, у вас делает успехи.
  quoteEn: Your work, our work, that is, God's work, is making progress with you. (working English)
  significance: The foreign Christian-anarchist correspondence in one phrase. Writing to the Hungarian Schmitt — one of the circle (with Kenworthy, Davidson, Crosby, Ortt) among whom «христианский анархизм» circulated as a term of art — Tolstoy frames the shared cause as 'God's work', the religious register in which he always kept it.
  facsimile: null
