scholarship:
  summary: 'Modern scholarship makes Tolstoy the founding and most influential figure of ''Christian anarchism'' (or ''Christian anarcho-pacifism''), while generally noting — usually in passing — that he avoided the label. The classification goes back to the document at the centre of this dive: Eltzbacher''s Der Anarchismus (1900) canonised him as one of seven anarchist ''sages'', and that canon held in the general histories (Marshall, Demanding the Impossible, 1992). Brian Morris and Peter Marshall both explain the refusal by the label''s association with political violence; Alexandre Christoyannopoulos (Christian Anarchism, Imprint Academic, 2010) is the fullest treatment and is explicit that the label is the scholarship''s, not Tolstoy''s. What the literature does not engage at the textual level — and what this dive supplies — is the specific evidence: the Eltzbacher index argument, the unique Sacy attestation, and the genealogy of the phrase in the correspondent circle (Schmitt''s Ohne Staat journal, Kenworthy''s Brotherhood Church) rather than in any Tolstoy coinage. The widely-repeated claim that reviewers of The Kingdom of God Is Within You coined the term in 1894 is uncited and could not be verified.'
  triangulation:
  - evidenceRef: v72_eltzbacher_reject_ru
    conventionalView: 'The standard account explains Tolstoy''s refusal of ''anarchist'' by the label''s association with political violence (Marshall: he ''did not publicly call himself an anarchist because of that title''s associations with violence'').'
    relation: complicates
    source: Marshall, Demanding the Impossible (1992); Morris, 'Tolstoy and Anarchism' (The Anarchist Library)
  - evidenceRef: v73_sacy_ru
    conventionalView: Scholarship calls Tolstoy a Christian anarchist without examining whether or how he used the phrase himself; the coinage is usually credited vaguely to 1894 reviewers of The Kingdom of God Is Within You.
    relation: extends
    source: null
  - evidenceRef: v52_seed_reframing
    conventionalView: Tolstoy's anti-state position is dated to The Kingdom of God Is Within You (1893) and the 1900s essays; the 1894 diary reframing of the 'how to be without government' question is not singled out.
    relation: extends
    source: null
  - evidenceRef: v68_schmitt_gods_work
    conventionalView: The term is often credited to 1894 reviewers (uncited) or treated as flowing from Tolstoy; Alston maps the international network as a consequence of his teaching rather than as the term's source.
    relation: complicates
    source: Alston, Tolstoy and His Disciples (2013); the «coined by reviewers» claim is uncited
  - evidenceRef: v67_davidson_corroborate
    conventionalView: Tolstoy is read as subordinating socialist/communist/anarchist theory to the Gospel.
    relation: confirms
    source: Christoyannopoulos, Christian Anarchism (2010)
contradictions:
- claim: Tolstoy is one of the seven principal anarchists (Eltzbacher 1900) and is routinely called a 'Christian anarchist'.
  correction: In his own letter to Eltzbacher (1900) he refuses the label «в смысле политического реформатора» — as a political reformer — and re-files the teaching as religious. The one time he uses «христианский анархизм» himself (Sacy, 1901) it is third-person, about Babism's affinity, not self-application. Not a contradiction in the corpus so much as a gap between the external label and his own voice.
  evidenceRef: v72_eltzbacher_reject_ru
notCovered:
- Chertkov's 1905 booklet O khristianskom anarkhizme — the in-circle programmatic frame the Sacy phrase points to; not held locally.
- Incoming letters (Eltzbacher's, Sacy's, Schmitt's to Tolstoy) — the TEI corpus holds only outgoing letters.
- The Kingdom of God Is Within You (PSS Tom 28) — the doctrinal work Eltzbacher classified from; a Tolstoy WORK (handled in works/, not a wiki entity), referenced here but not re-extracted.
- 'On Anarchy / «Об анархии» and the 1900s political essays (Tom 34–38: The Slavery of Our Time, To Political Activists, etc.) — the broader anti-state corpus beyond the label question; left to a state/non-resistance dive.'
- The Goldenweiser / Makovický conversation transcripts — spoken-voice remarks, not swept.
