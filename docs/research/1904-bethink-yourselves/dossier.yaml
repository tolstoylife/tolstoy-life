# Machine-readable dossier for the "Bethink Yourselves!" (Одумайтесь!, 1904) corpus work-dive.
# Created 2026-06-08. Slug: 1904-bethink-yourselves.
# Subject: Tolstoy's anti-war essay written during the Russo-Japanese War, "a letter to the men
# of war and the tsar." A Prophet-period WORK dive (carries a workRecord block).
# Every evidence[].quoteRu is byte-faithful from the named `extract` file (verify_quotes.py).
# quoteEn is working English (labelled). PSS Tom -> local PDF via pss-volume-mapping.md
