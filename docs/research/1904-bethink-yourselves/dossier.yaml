  - "The full epigraph apparatus: ~50 epigraphs (Voltaire, Pascal, Kant, Maupassant, Lao-Tzu, Marcus Aurelius, Origen, etc.), most drawn from Jean Grave's anthology Guerre-Militarisme (Paris, 1902). The dive maps their function, not each source."
  - "A page-by-page collation of the PSS text against the Free Age Press first edition (Chertkov's six proof cuts are described in the commentary but not independently re-collated against a held copy)."
  - "The Japanese-side reception beyond Kōtoku (Anesaki Masaharu; the broader Heimin Shimbun circle)."
  - "Vereshchagin's anti-war paintings as a visual counterpart (his death on the Petropavlovsk is the essay's central event)."

needsReview:
  - item: "Colophon dates. The PSS text shows «30 Апреля 1904 г.» (the fire coda) and «8 Мая 1904 г.» (the seaman postscript); the PG/Free Age Press English edition is reported to carry 'May 2' / '13 May 1904'. The OS↔NS pairing of the printed colophon dates should be checked against the printed editions before any chronology is driven from them."
    phase: 2
    why: "Bears on the workRecord dateWritingCompleted and on the TEI-diary-filename-year gotcha; do not let a colophon date drive a slug/date unchecked."
  - item: "Swedish translator unidentified. «Betänken Eder!» (Björck & Börjesson, 1904) names no translator in the Runeberg catalogue or any source found; translated from Russian, epigraphs omitted."
    phase: 3
    why: "A detail Johan's edition project could surface; left open rather than guessed."
  - item: "Pre-1918 orthography in the variants extract (odum-variant-apostrophe and the other 12 variants). The PSS variants apparatus is printed diplomatically in old orthography, so --choice=reg had nothing to normalize; quote bytes are pre-reform (ъ/ѣ/і)."
    phase: 2
    why: "Verbatim, but old orthography — flag like the fire-metaphor dive did for its pre-reform rows."
  - item: "First legal Russian publication after 1917 not pinned (PSS 1936 is the authoritative Soviet text; whether an earlier early-Soviet legal printing exists is unconfirmed)."
    phase: 3
    why: "Bears on the publication-history completeness; not in-scope to resolve fully."
  - item: "The 'множество японцев' (chapter XII) vs the Petropavlovsk. The Petropavlovsk (chapter XI) was a Russian loss; the chapter-XII 'multitude of peaceful Japanese' drowned refers to Admiral Iessen's sinking of transports near Genzan (~late Apr 1904). The commentary records Chertkov softening «несколько тысяч» → «множество». Keep the two events distinct in any wiki page."
    phase: 3
    why: "Easy to conflate the two naval events; the scholarship sweep briefly did."

