  # ===== C. TEXTUAL HISTORY & CHERTKOV'S EDITING (editorial commentary) ============

  - id: odum-genesis-letter
    genre: letters
    pssTom: 36
    pages: "604–621"
    date: 1904-04-28
    addressee: V. G. Chertkov
    localPdf: primary-sources/jubilee-edition/vol05/vol05.pdf
    extract: extracts/v36_604_621_Odumajtes_comments.txt
    quoteRu: >-
      От этого я соединил две темы, и, пожалуй, ни одна не обработана достаточно
    quoteEn: >-
      Because of this I joined two themes together, and perhaps neither is worked out sufficiently. (working English)
    significance: >-
      Tolstoy to Chertkov, 28 Apr 1904, quoted in the editorial history. His own account of the essay's
      double structure: he was writing on the absence of religion as the root of all human ills when the
      war broke out "as an illustration of my thought," and welded the two. Source: editorial commentary
      (secondary), quoting the Chertkov correspondence (АЧ).
    facsimile: null

  - id: odum-softening-letter
    genre: letters
    pssTom: 36
    pages: "604–621"
    date: 1904-05-04
    addressee: V. G. Chertkov
    localPdf: primary-sources/jubilee-edition/vol05/vol05.pdf
    extract: extracts/v36_604_621_Odumajtes_comments.txt
    quoteRu: >-
      пожалуйста, выкиньте всё такое
    quoteEn: >-
      please throw out everything of that kind. (working English)
    significance: >-
      Tolstoy to Chertkov, 4 May 1904 (per the commentary), asking him to cut the harsh words about the
      military ("большей частью пьяные" — "mostly drunk") that might wound. He gave Chertkov carte
      blanche; Chertkov made six documented cuts in proof and Tolstoy approved them all (1 July 1904).
    facsimile: null

  - id: odum-pub-abroad
    genre: works
    pssTom: 36
    pages: "604–621"
    date: 1904
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol05/vol05.pdf
    extract: extracts/v36_604_621_Odumajtes_comments.txt
    quoteRu: >-
      Статья вышла в издании «Свободного слова», в Крайстчерче, в Англии, в 1904 г.
    quoteEn: >-
      The article appeared in the Free Word [Free Age Press] edition, at Christchurch, in England, in 1904. (working English)
    significance: >-
      The first publication, abroad, through Chertkov's Free Age Press. The editors added the subtitle
      "Статья по поводу русско-японской войны" (An article on the Russo-Japanese War). A second popular
      edition (no epigraphs, for the people and soldiers) and a corrected third followed the same year.
    facsimile: null

  - id: odum-pub-russia-banned
    genre: works
    pssTom: 36
    pages: "604–621"
    date: 1906
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol05/vol05.pdf
    extract: extracts/v36_604_621_Odumajtes_comments.txt
    quoteRu: >-
      В России «Одумайтесь!» вышло впервые в 1906 г. в издании «Обновление» отдельной брошюрой (конфискована).
    quoteEn: >-
      In Russia, Bethink Yourselves! appeared for the first time in 1906, published by Obnovlenie [Renewal] as a separate pamphlet (confiscated). (working English)
    significance: >-
      The measure of the Russian state's reaction: not prosecution of the celebrity author but
      confiscation of the text. The 1911 reprint in vol. 19 of the 12th collected edition was likewise
      confiscated. Never legally published in Russia in Tolstoy's lifetime.
    facsimile: null

  # ===== D. A REDACTION VARIANT (the excised direct apostrophe) ====================

  - id: odum-variant-apostrophe
    genre: works
    pssTom: 36
    pages: "426–435"
    date: 1904
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol05/vol05.pdf
    extract: extracts/v36_426_435_Odumajtes_Varianty.txt
    quoteRu: >-
      Одумайтесь, главное, вы, несчастные толпы молодых людей военных, необдуманно повинующихся людям, ведущих вас на заклание или на убийство братьев.
    quoteEn: >-
      Bethink yourselves, above all, you unhappy crowds of young military men, blindly obeying those who lead you to slaughter or to the murder of your brothers. (working English)
    significance: >-
      Variant No. 13 (pre-1918 orthography in the PSS variants apparatus). An early draft ended chapter
      XI with a four-fold direct "Bethink yourselves!" apostrophe to tsar, clergy, journalists, and
      soldiers; Tolstoy cut the whole passage. Shows the title used as a live second-person imperative
      before he muted it. NOTE pre-reform orthography (see needsReview).
    facsimile: null

