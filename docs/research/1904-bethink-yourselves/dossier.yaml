    quoteEn: >-
      Ask a private soldier, a corporal, a sergeant who has left his old parents, wife, and children, why he is preparing to kill people he does not know — at first he will be surprised by your question. (working English)
    significance: >-
      Chapter IV. The structural engine of the essay: soldier, officer, diplomat, journalist, and
      tsar are each asked the personal question and each answers with an abstraction — faith,
