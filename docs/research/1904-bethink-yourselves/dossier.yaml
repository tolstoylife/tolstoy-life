# ---------------------------------------------------------------------------------------------
# Layer 4 — secondary scholarship (Phase 3). Attributed, English-first. Contrast, not baseline.
# ---------------------------------------------------------------------------------------------
scholarship:
  summary: >-
    English-language biography gives Bethink Yourselves! brief but consistent coverage as the most
    prominent of Tolstoy's anti-war interventions — his stand against jingoism on both sides of the
    Russo-Japanese War, read between the 1901 excommunication and the 1905 revolution. The specific
    page-level treatment in Maude (1908/10), Simmons (1946), and Bartlett (2010) could not be confirmed
    in this pass (Archive.org access failures). The sharpest contemporary engagement is not Western but
    Japanese: Shūsui Kōtoku's 1904 response in the socialist Heimin Shimbun praised Tolstoy's moral
    courage while rejecting his individual-repentance remedy as inadequate to war's structural,
    capitalist causes — the founding instance of the socialist critique of Tolstoyan nonresistance. The
    essay's reach was immediate (Kōtoku notes even Nicholas II's reaction was telegraphed worldwide) and
    durable (Navalny cited its opening sentence at his 2022 trial).
  triangulation:
    - evidenceRef: odum-pub-abroad
      conventionalView: "The essay was banned at home and published abroad through Chertkov's Free Age Press."
      relation: confirms
      source: "PSS v.36 commentary; Free Age Press / Ginn (Boston, 1904) edition records."
    - evidenceRef: odum-pub-russia-banned
      conventionalView: "Not legally published in Russia in Tolstoy's lifetime."
      relation: extends
      source: "PSS v.36 commentary — the dive supplies the precise confiscations (1906 Obnovlenie; 1911 vol.19)."
    - evidenceRef: odum-individual-not-external
      conventionalView: "The essay's thesis is individual conscience over collective/state war-duty."
      relation: confirms
      source: "Kōtoku 1904 engages exactly this thesis; Wikisource text; PSS text."
    - evidenceRef: odum-bethink-definition
      conventionalView: "Scholarship treats the remedy (individual repentance) as the essay's distinctive and contested move."
      relation: complicates
      source: "Kōtoku 1904 (Heimin Shimbun no.40) — rejects the remedy as circular; structural critique."
    - evidenceRef: odum-genesis-letter
      conventionalView: "Chertkov was the authorised translator."
      relation: extends
      source: "PSS v.36 commentary — six documented proof cuts, a paragraph reordering, epigraph omissions, all delegated and approved: editor as much as translator."
    - evidenceRef: odum-metanoeite
      conventionalView: "The title renders the Gospel μετανοεῖτε."
      relation: confirms
      source: "PSS v.36 commentary (first autograph «Одумайтесь (μετανοεῖτε)»); Wikisource text."
    - evidenceRef: odum-fire-rising
      conventionalView: "(no secondary source in this pass discusses the fire coda)"
      relation: extends
      source: "Primary text only; the corpus (and the fire-metaphor dive) ground an image the scholarship leaves untouched."

