    pssTom: 36
    pages: "100–148"
    date: 1904
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol05/vol05.pdf
    extract: extracts/v36_100_148_Odumajtes.txt
    quoteRu: >-
      испытываешь ужас уже не перед ужасами войны, а перед тем, что ужаснее всех ужасов, — перед сознанием бессилия человеческого разума.
    quoteEn: >-
      one feels horror no longer at the horrors of war, but at what is more horrible than all horrors — at the consciousness of the impotence of human reason. (working English)
    significance: >-
      Chapter III. Having catalogued the writers who exposed war (Voltaire, Pascal, Kant), Tolstoy's
      deeper dread is that reason itself is overridden the moment war begins.
    facsimile: null

