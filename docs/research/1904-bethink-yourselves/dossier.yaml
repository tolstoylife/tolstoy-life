    extract: extracts/v36_100_148_Odumajtes.txt
    quoteRu: >-
      Опять война. Опять никому не нужные, ничем не вызванные страдания, опять ложь, опять всеобщее одурение, озверение людей.
    quoteEn: >-
      Again war. Again sufferings that no one needs, utterly uncalled for; again fraud, again the universal stupefaction and brutalization of men. (working English)
    significance: >-
      The essay's first words. The Russo-Japanese War as a relapse: the indictment is set before a
      single argument is made.
    facsimile: null

  - id: odum-enlightened-preach-war
    genre: works
    pssTom: 36
    pages: "100–148"
    date: 1904
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol05/vol05.pdf
    extract: extracts/v36_100_148_Odumajtes.txt
    quoteRu: >-
      Но как могут так называемые просвещенные люди проповедовать войну, содействовать ей, участвовать в ней, и, что ужаснее всего, не подвергаясь опасностям войны, возбуждать к ней, посылать на нее своих несчастных, обманутых братьев?
    quoteEn: >-
      But how can so-called enlightened people preach war, abet it, take part in it, and — most terrible of all — without themselves facing war's dangers, incite others to it, sending their unfortunate, deceived brothers to it? (working English)
    significance: >-
      Chapter I. Tolstoy excuses the deceived peasant-conscript but turns the whole essay against the
      educated classes — professors, journalists, clergy — who know better and incite anyway.
    facsimile: null

  - id: odum-impotence-of-reason
