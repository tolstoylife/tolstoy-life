topic:
  slug: 1904-bethink-yourselves
  title: "Bethink Yourselves! (Одумайтесь!) — a corpus work-dive"
  question: >-
    How does Tolstoy's 1904 anti-war essay Одумайтесь! argue its case across its twelve sections;
    how was it composed during the Russo-Japanese War; and how did its abroad-first publication,
    censorship in Russia, and translation lineage (incl. the Swedish Betänken Eder!) carry it to
    the world?
  date: 2026-06-08
  period: prophet
  corpusSurface: [works, diaries, letters, commentary, variants]
  dateRange: "1904 (composition Jan–May 1904; reception 1904–present)"

# ---------------------------------------------------------------------------------------------
# Layer 1 — flat citation ledger.
# ---------------------------------------------------------------------------------------------
