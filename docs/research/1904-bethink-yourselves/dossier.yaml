# ---------------------------------------------------------------------------------------------
# Intra-corpus contradictions (primary-vs-primary) — distinct from scholarship triangulation.
# ---------------------------------------------------------------------------------------------
contradictions:
  - claim: "The RU coda reads «Не будем же противиться, а будем служить ему» — 'let us not resist it, but serve it.'"
    correction: >-
      The Swedish Betänken Eder! (1904) renders the same sentence "låtom oss då icke släcka den, utan
      sprida och underhålla den" — "let us not extinguish it, but spread and sustain it." A free
      translation/redaction variant (the Swedish was made from Russian, omitting the epigraphs), not a
      different source. Worth flagging for the wiki because it changes the verb of the essay's last act
      from non-resistance to active spreading.
    evidenceRef: odum-fire-rising

