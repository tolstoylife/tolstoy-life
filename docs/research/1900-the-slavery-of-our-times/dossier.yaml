    significance: "The genesis statement to Chertkov: the former Yasnaya Polyana servant Afanasy Ageev (weigher at the Moscow–Kazan goods station) reported the 36-hour shifts; Tolstoy visited (26 Dec 1899 OS) and resolved to write. The TEI dates this letter 2 Jan 1900; the editorial history (and PSS apparatus) cites it as 31 Dec 1899."
