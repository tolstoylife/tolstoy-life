  # ---- I–II: the reportage and society's indifference ----
  - id: W5
    genre: works
    pssTom: 34
    pages: "150 (ch. I)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "за деньги, дающие только пропитание, люди, считающиеся свободными, находят нужным отдаваться в такую работу, в которую во времена крепостного права ни один самый жестокий рабовладелец не послал бы своих рабов"
    quoteEn: "(working English) for money that gives only subsistence, men considered free find it necessary to give themselves up to work to which, in the time of serfdom, no cruellest slaveholder would have sent his slaves."
    significance: "The keystone of the opening reportage on the Moscow–Kazan goods-station loaders (36–37-hour shifts): wage 'freedom' is harder than serfdom. He adds that no cab-owner would so use a horse, which costs money."
    facsimile: ""
  - id: W6
    genre: works
    pssTom: 34
    pages: "152 (ch. II)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Что же за удивительное затмение находит на нас, как только дело касается тех миллионов рабочих, которые со всех сторон медленно и часто мучительно убиваются на тех работах, которыми мы пользуемся для своих удобств и удовольствий?"
    quoteEn: "(working English) What strange eclipse comes over us the moment it concerns those millions of workers who, on all sides, are slowly and often painfully killed at the labour we use for our comforts and pleasures?"
    significance: "The 'astonishing eclipse' (удивительное затмение) of the educated conscience — humane to animals, indifferent to the workers dying for our convenience (the silk factory of 3,000 women opposite his house; English life expectancy 55 vs 29 for unhealthy trades)."
    facsimile: ""

  # ---- III–V: justification by 'science'; the Marx expropriation quote ----
  - id: W7
    genre: works
    pssTom: 34
    pages: "154 (ch. III)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Новые объяснения эти явились в виде науки — политической экономии, которая утверждает, что она нашла законы, по которым распределяются между людьми труд и пользование его произведениями."
    quoteEn: "(working English) These new explanations appeared in the form of a science — political economy — which asserts that it has discovered the laws by which labour and the enjoyment of its products are distributed among men."
    significance: "The structural move of the work: political economy now does what theology once did — supplies a 'law' (supply and demand, capital, rent, wages) that lets one class live calmly off another."
    facsimile: ""
  - id: W8
    genre: works
    pssTom: 34
    pages: "157–158 (ch. IV)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Сельское население сначала насильственно обезземеливали, говорит К. Маркс, изгоняли и доводили до бродяжничества, а затем, в силу жестоких законов, его пытали, клеймили каленым железом, наказывали плетьми, с целью подчинить требованиям наемного труда."
    quoteEn: "(working English) The rural population was first forcibly deprived of its land, Marx says, driven out and reduced to vagrancy, and then, by cruel laws, tortured, branded with hot iron, and flogged, in order to subject it to the demands of wage labour."
    significance: "The one Marx citation kept in the final text (Capital vol. I, ch. XXIV, on the enclosure and bloody-vagrancy laws). Tolstoy read Capital (annotated Russian copy in the Yasnaya Polyana library); he uses Marx's history but rejects the Marxist remedy."
    facsimile: ""

  # ---- VI–VII: the untenability of the socialist ideal; culture or freedom ----
  - id: W9
    genre: works
    pssTom: 34
    pages: "166 (ch. VI)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Очевидно, всем будет приятнее заниматься сенокосом или рисованием, чем быть кочегаром или очистителем клоаков."
    quoteEn: "(working English) Obviously everyone will find it pleasanter to mow hay or draw than to be a stoker or a cleaner of cesspits."
    significance: "Ch. VI ('The Untenability of the Socialist Ideal') — who, in a free society without compulsion, will do the foul work? In the Free Word edition the Chertkovs altered «сенокосом» to «науками» (sciences); the PSS restores Tolstoy's «сенокосом» (hay-mowing). See [christian-communism-socialism] for the section's socialist-critique core (do not duplicate)."
    facsimile: ""
  - id: W10
    genre: works
    pssTom: 34
    pages: "172 (ch. VII)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "пропади они пропадом, и не только они, но и железные дороги и все фабричные ситцы и сукна в мире, если для их производства нужно, чтобы 99/100 людей были в рабстве и тысячами погибали на работах, нужных для производства этих предметов"
    quoteEn: "(working English) let them perish — and not only they, but the railways and all the factory cottons and cloths in the world — if their production requires that 99/100ths of men be in slavery and perish by the thousand at the labour needed to produce these objects."
    significance: "Ch. VII ('Culture or Freedom?') — the keystone choice: not fiat cultura — pereat justitia but fiat justitia — pereat cultura. Yet, he adds, useful culture will not perish: freed of slavery, technique can be turned to not destroying lives."
    facsimile: ""

  # ---- VIII: slavery exists among us ----
  - id: W11
    genre: works
    pssTom: 34
    pages: "176 (ch. VIII)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "все люди нашего времени разделяются на рабов и господ — так же определенно, как, несмотря на сумерки, разделяются сутки на день и ночь"
    quoteEn: "(working English) all men of our time are divided into slaves and masters — as definitely as, despite the twilight, the day is divided into day and night."
    significance: "Ch. VIII — slavery exists among us, unrecognised as serfdom was at the end of the 18th century. The stranger-from-another-country device divides society into a small clean-handed leisured class and the labouring mass."
    facsimile: ""
  - id: W12
    genre: works
    pssTom: 34
    pages: "180 (ch. VIII)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Одно средство порабощения отменяется только тогда, когда другое уже заменило его."
    quoteEn: "(working English) One means of enslavement is abolished only when another has already replaced it."
    significance: "The structural thesis (also the genesis-diary insight, D2): emancipation from serfdom and chattel slavery only swapped an old form of slavery for a firmer, money form — abolished once landlessness and taxes held the people fast."
    facsimile: ""

  # ---- IX: the three causes — land, taxes, manufactured needs (Henry George) ----
  - id: W13
    genre: works
    pssTom: 34
    pages: "182 (ch. IX)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Можно себе представить по проекту Генри Джорджа освобождение земли от права личной собственности и потому уничтожение первой из причин, загоняющих людей в рабство — недостатка земли."
    quoteEn: "(working English) One can imagine, by Henry George's project, the freeing of the land from the right of private property, and thus the abolition of the first of the causes driving men into slavery — the lack of land."
    significance: "Ch. IX names the three causes of slavery — landlessness, taxes, and the manufactured 'needs' of luxury. Henry George could remove the first; but the third — the seductions of new needs — is, he says, the firmest and most ineradicable."
    facsimile: ""
  - id: W14
    genre: works
    pssTom: 34
    pages: "183 (ch. IX)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "условие это составляет самую твердую, неустранимую причину рабства"
    quoteEn: "(working English) this condition [the manufactured needs of luxury] constitutes the firmest, most ineradicable cause of slavery."
    significance: "Why neither Henry George's land reform nor the abolition of taxes can free the worker: the appetite for new needs, caught from the rich, re-sells his freedom. The most original of the three causes, and the one 'science' does not recognise."
    facsimile: ""

  # ---- X–XI: the three laws; reform only moves the chains ----
  - id: W15
    genre: works
    pssTom: 34
    pages: "190 (ch. XI)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Происходит нечто подобное тому, что делает тюремщик, перекладывая цепи пленника с шеи на руки, с рук на ноги, или снимая их, но утверждая запоры и решетки."
    quoteEn: "(working English) Something happens like what a jailer does, shifting a prisoner's chains from neck to hands, from hands to feet, or removing them but strengthening the bolts and bars."
    significance: "Ch. XI — every reform (abolishing taxes, George's land-rent, the socialists' socialisation of the means of production) merely replaces one slavery-making law with another. The socialists' project must add a law compelling labour — 'slavery in its primal form' (cross-link [christian-communism-socialism] for that passage)."
    facsimile: ""

  # ---- XII–XIII: laws = organized violence; government ----
  - id: W16
    genre: works
    pssTom: 34
    pages: "194 (ch. XII)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Узаконения — это правила, устанавливаемые людьми, распоряжающимися организованным насилием, за неисполнение которых неисполняющие подвергаются побоям, лишению свободы и даже убийству."
    quoteEn: "(working English) Laws are rules established by people who command organized violence, for the non-fulfilment of which the non-fulfillers are subjected to beatings, deprivation of freedom, and even killing."
    significance: "Ch. XII — Tolstoy's definition of law, stripped of the jurists' fog. Laws are not the will of the people but the will of whoever commands organized violence."
    facsimile: ""
  - id: W17
    genre: works
    pssTom: 34
    pages: "197 (ch. XIII)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Но организованное насилие есть правительство."
    quoteEn: "(working English) But organized violence is government."
    significance: "Ch. XIII completes the chain: misery → slavery → laws → organized violence → government. The brick-column image answers 'can we live without government?' — that a structure collapses at a touch proves it badly built, not necessary."
    facsimile: ""

  # ---- XIV: how to destroy governments — exposing the deception (the disciplined army) ----
  - id: W18
    genre: works
    pssTom: 34
    pages: "197 (ch. XIV)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Дисциплина есть уничтожение разума и свободы в человеке и не может иметь другой цели, как только приготовление к совершению таких злодеяний, которых не может совершить ни один человек в нормальном состоянии."
    quoteEn: "(working English) Discipline is the destruction of reason and freedom in man, and can have no other aim than the preparation for crimes which no man in a normal state could commit."
    significance: "Ch. XIV — the few rule the many not by force but by deception (обман), of which the disciplined army is the core. Governments are destroyed not by violence (which only installs a new government) but by exposing this deception — refusing soldiers and taxes."
    facsimile: ""
  - id: W19
    genre: works
    pssTom: 34
    pages: "198 (ch. XIV)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "что же такое государство, как не такое же разбойническое учреждение"
    quoteEn: "(working English) what is the state, then, if not just such a robber institution?"
    significance: "Following Eugen Schmitt's Ohne Staat article and the Calabrian-robber analogy: the state is a brigand institution, only more complex and more immoral — the more one shares in its organized deception, the more one is rewarded."
    facsimile: ""

  # ---- XV + Afterword: what each person must do ----
  - id: W20
    genre: works
    pssTom: 34
    pages: "199 (ch. XV)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "если человек — всё равно раб он или рабовладелец — точно хочет улучшить не одно свое положение, а положение людей, то должен сам не делать дурного, которое производит рабство его и его братьев"
    quoteEn: "(working English) if a man — whether slave or slaveholder — truly wishes to improve not his own position alone but the position of all, he must himself stop doing the evil that produces the slavery of himself and his brothers."
    significance: "Ch. XV — the remedy is not to design society for the slaves (the propertied class's reflex) but for each person to stop doing the evil: refuse government office, voluntary taxes, and the state's protection of property."
    facsimile: ""
  - id: W21
    genre: works
    pssTom: 34
    pages: "199 (ch. XV)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "У меня одна жизнь. Зачем же я в этой короткой моей жизни, поступая противно голоса совести, стану участником ваших гадких дел? — Не хочу и не буду."
    quoteEn: "(working English) I have one life. Why, in this short life of mine, acting against the voice of conscience, should I become a participant in your vile deeds? — I will not, and I shall not."
    significance: "The voice of the honest man of our time — the conscientious refusal that closes the argument; the 'highest and incontestable judge,' the voice of conscience, confirms what the general reasoning reaches."
    facsimile: ""
  - id: W22
    genre: works
    pssTom: 34
    pages: "199 (Afterword)"
    date: "1900-08 (afterword added ~9 Aug, OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "для избавления людей от дурного устройства общества есть только одно средство — воздержание от насилия, причины бедствий, — от личного насилия, от проповеди насилия, от всякого оправдания насилия"
    quoteEn: "(working English) to free men from the bad ordering of society there is only one means — abstention from violence, the cause of the calamities — from personal violence, from the preaching of violence, from any justification of violence."
    significance: "The Afterword answers the charge that this is 'the old preaching of non-doing': as an alcoholic's only cure is abstinence, society's only cure is abstinence from violence; the social remedy coincides with each person's moral law."
    facsimile: ""

