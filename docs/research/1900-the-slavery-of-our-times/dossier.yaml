topic:
  slug: 1900-the-slavery-of-our-times
  title: "The Slavery of Our Times (Рабство нашего времени)"
  question: >-
    Read Tolstoy's 1900 economic/social treatise as a single work: its argument
    (modern wage labour is a new form of slavery, continuous with serfdom and
    chattel slavery — "one chain is released only when another holds firm"; the
    three causes are landlessness, taxes, and manufactured needs; slavery rests
    on laws, laws on organized violence, violence on government; the remedy is
    each person's withdrawal from participation in government violence); its
    genesis at the Moscow–Kazan goods station, redactions, ban and translation
    lineage, reception, and place in the late anti-state / economic cluster.
  date: "2026-06-07"
  period: "Prophet period (post-1880)"
  corpusSurface: "works (PSS Tom 34: work pp.144–199, variants pp.491–502; Tom 90 variants pp.169–173) + editorial history (Tom 34 pp.563–567) + composition-window diary (Tom 54, 1900) + letters (Toms 72, 88) + the La Boétie Circle-of-Reading intertext (Toms 41, 42); light visuals sweep"
  dateRange: "composition 1899-12-27 (OS, first sketch «Самый дешевый товар») → 1900-07-30 (OS, sent to Chertkov); afterword + epigraphs ~Aug, corrections Sept 1900. First publication 1900 (England); full Russian publication 1917"

