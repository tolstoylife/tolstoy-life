    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Почти пятнадцать лет тому назад перепись населения в Москве вызвала во мне ряд мыслей и чувств, которые я, как умел, выразил в книге, озаглавленной: «Что же нам делать?»"
    quoteEn: "(working English) Almost fifteen years ago the Moscow census aroused in me a series of thoughts and feelings which I expressed, as best I could, in a book entitled What Then Must We Do?"
    significance: "The work declares itself a continuation of the 1882–86 What Then Must We Do? — the same answers, reached by new arguments. (The editors corrected Tolstoy's draft '10 years' to 'fifteen.')"
    facsimile: ""
  - id: W4
    genre: works
    pssTom: 34
