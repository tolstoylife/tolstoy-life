    addressee: ""
    localPdf: ""
    extract: extracts/v54_010_015_1900_03_13.txt
    quoteRu: "Невольничество отменяется, когда утверждается крепостное право. Крепостное право отменяется, когда земля отнята и подати установлены; теперь освобождают от податей, когда орудия труда отняты."
