    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "Система, по которой действуют все народы мира, основана на самом грубом обмане, на самом глубоком невежестве или на соединении обоих"
    quoteEn: "(working English) The system on which all the peoples of the world act is founded on the grossest deception, on the deepest ignorance, or on a combination of the two."
    significance: "The Robert Owen epigraph (taken, Tolstoy told Maude, from Morrison Davidson, The Annals of Toil, 1899); sets the frame that the existing economic order is a system that can only produce evil."
    facsimile: ""
  - id: W2
    genre: works
    pssTom: 34
    pages: "145 (epigraph)"
    date: "1900"
    addressee: ""
    localPdf: ""
    extract: extracts/v34_144_199_Rabstvo_nashego_vremeni.txt
    quoteRu: "не работа разделена, но люди разделены на частицы людей, разломлены на маленькие кусочки, на крошки"
    quoteEn: "(working English) it is not labour that is divided, but men — divided into fragments of men, broken into small pieces, into crumbs."
    significance: "The Ruskin epigraph (Stones of Venice), the division-of-labour passage; the keynote that the wrong is the breaking-up of the human being, not merely low pay or long hours."
