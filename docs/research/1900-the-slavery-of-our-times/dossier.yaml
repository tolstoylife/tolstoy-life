contradictions:
  - claim: "The editorial history (Opulsky) dates the genesis Chertkov letter — the Afanasy / 36-hours report — to 31 December 1899 (PSS Tom 88)."
    correction: "The tolstoydigital TEI carries that passage in the letter dated 2 January 1900 (v88_581, PSS Tom 88 pp.188–189), which opens «Написал вам... вчера словечко» (i.e. a continuation of a New-Year note). The apparatus's 31 Dec 1899 attribution and the TEI's 2 Jan 1900 dating differ by the year boundary."
    evidenceRef: L1
  - claim: "The editorial history quotes the genesis letter as «...рассказывал мне, что там грузчики работают 36 часов сряду»."
    correction: "The letter text reads «...рассказал мне, что там грузчики работают 36 часов сряду» (perfective рассказал, not imperfective рассказывал) — a minor divergence between the apparatus's paraphrase and the letter."
    evidenceRef: L1

