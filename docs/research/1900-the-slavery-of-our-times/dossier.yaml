# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3), filled from extracts/_scholarship.md.
# Attribute, don't assert; ground in primary + prior dives first.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    Scholarship treats The Slavery of Our Times thinly next to Tolstoy's fiction and even next to
    What Then Must We Do? (1886): major anglophone biographers (Maude, Simmons, Wilson, Bartlett)
    acknowledge it as the sequel to Tolstoy's earlier political economy but rarely analyse its
    argument, filing it with his late pamphlet production — diagnosis accurate, the individual-
    non-participation remedy dismissed as earnest but inoperative. The one specialist axis is
    Georgist: Wenzer (1997) documents that this work is the single place Tolstoy "comes out against
    George's economics," an anomalous trough between Resurrection's Georgist peak (1899) and The
    Great Sin (1905). The Marx reading is attested by a Soviet record (Breitburg, Звенья V, 1935)
    confirming the annotated Yasnaya Polyana copy of Capital, but is not followed up in anglophone
    scholarship. Maude's own 1900 framing (and his 1902 essay) is the primary lifetime reading;
    contested labels — "utopian," "a crank," "impractical" — are reported here as the mainstream's
    words about Tolstoy's economic thought in general, never asserted.
  triangulation:
    - evidenceRef: D2
      conventionalView: "Biographers note the serfdom/slavery parallel as a rhetorical device (Maude frames the work via non-resistance; Simmons calls it a 'trenchant sequel' to What Then Must We Do?), but do not analyse the chain-of-causation argument — that each emancipation (chattel→serfdom→tax-and-land→means-of-production) is a managed substitution — on its own terms."
      relation: extends
      source: "Maude, intro to The Slavery of Our Times (Free Age Press, 1900); Simmons, Leo Tolstoy (1946) ch. 13."
    - evidenceRef: W13
      conventionalView: "Henry George scholarship (Wenzer 1997) records that this is the one work where Tolstoy 'comes out against George's economics' — privately calling George 'a concession, a weakness' (via Axelrod) — an anomaly between Resurrection (1899) and The Great Sin (1905); but it documents the fact of rejection, not Tolstoy's internal anti-compulsion argument (obligatory rent is still a legal compulsion backed by violence)."
      relation: complicates
      source: "Wenzer, 'Tolstoy's Georgist Spiritual Political Economy (1897–1910)', Pennsylvania History 64 (1997)."
    - evidenceRef: W17
      conventionalView: "That government-backed laws create the condition for wage servitude — the chain misery→slavery→laws→organized violence→government — is captured by Maude's framing and by Christoyannopoulos's 'Economic enslavement' subsection; it is the work's recognised central contribution."
      relation: confirms
      source: "Maude (1900); Christoyannopoulos, Tolstoy's Political Thought (Routledge, 2012) [subsection content unverified]."
    - evidenceRef: W8
      conventionalView: "That Tolstoy read and annotated Capital is recorded by Breitburg (1935) and the PSS note; but no accessible scholarship analyses the rhetorical move by which Tolstoy uses Marx's own history of expropriation (Capital I ch. XXIV) to ground his argument and then turns it against Marx's socialist solution."
      relation: extends
      source: "Breitburg, 'Лев Толстой за чтением «Капитала» Маркса', Звенья V (1935); PSS T.34 note pp.157–158."
    - evidenceRef: W1
      conventionalView: "No anglophone scholarship comments on the epigraph sources; the PSS apparatus alone establishes the Owen epigraph's conduit (Morrison Davidson, Annals of Toil, 1899, via Tolstoy's 25 Aug 1900 letter to Maude) and the Ruskin source (Stones of Venice II.iv), both added after the main text was sent to Chertkov."
      relation: extends
      source: "PSS T.34 history (Opulsky), pp.563–567 — primary apparatus, not secondary scholarship."
    - evidenceRef: L1
      conventionalView: "The publication/ban sequence (Free Word 1900; Severny Kurier blocked; excerpts; 1911 seizure; 1917 full Russian) is the PSS record. On the church: the 1901 excommunication did NOT cite this work — its grounds were doctrinal (sacraments, Resurrection's satire of church ritual), confirming the work is not implicated in the decree."
      relation: confirms
      source: "PSS T.34 history; Wikisource, Decree of Excommunication (1901); Free Age Press bibliographic records."

