evidence:

  # — The Вступление (introduction): method & charge —
  - id: dogmth-text-01
    genre: work
    pssTom: 23
    pages: "60 (Вступление)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Я был приведен к исследованию учения о вере православной церкви неизбежно."
    quoteEn: "(working English) I was led to the examination of the teaching of the faith of the Orthodox Church inevitably."
    significance: "The opening sentence — and the source of Tolstoy's own title «Исследование» (examination/investigation), restored by the PSS editors against the émigré editions' «Критика». Having found in union with the Church his rescue from despair, he was forced to study the teaching itself when its expressions clashed with his basic notions of God."

  - id: dogmth-text-02
    genre: work
    pssTom: 23
    pages: "60 (Вступление)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "я нашел в этом учении не только бессмысленность, но сознательную ложь людей, избравших веру средством для достижения каких-то своих целей."
    quoteEn: "(working English) I found in this teaching not only senselessness, but a conscious lie of people who had chosen faith as a means of attaining some ends of their own."
    significance: "The book's governing charge, stated at the outset: the dogmatics is not merely confused but a deliberate deception. The «сознательная ложь» framing is what distinguishes this work from a sceptic's critique — Tolstoy says he would have become 'the bitterest enemy of all faith' had his own faith not been independently grounded."

  - id: dogmth-text-03
    genre: work
    pssTom: 23
    pages: "61 (Вступление)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Самая позднейшая и полнейшая и пользующаяся наибольшим распространением из этих изложений есть Богословие Макария, и потому я для разбора избрал его."
    quoteEn: "(working English) The latest and fullest and most widely circulated of these expositions is Makary's Theology, and therefore I chose it for analysis."
    significance: "Why the book takes Metropolitan Makary (Bulgakov)'s «Православно-догматическое богословие» as its target: having read the symbol of faith, the catechisms (Filaret, Platon), the Eastern Patriarchs, Peter Mogila and John of Damascus, Tolstoy judged them all the same teaching and chose the fullest. To examine Makary, he says, is to examine the symbol of faith and all the catechisms at once."

  - id: dogmth-text-04
    genre: work
    pssTom: 23
    pages: "62 (Вступление)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "достиг того, что выучил богословие, как хороший семинарист"
    quoteEn: "(working English) I attained to having learned the theology like a good seminarian"
    significance: "Tolstoy's method, in his own words: he mastered Orthodox dogmatics on its own terms — well enough to explain the inner connection of every dogma and why each was chosen — the better to dismantle it from inside. The whole book is a chapter-by-chapter mechanical following of Makary, dogma by dogma, because (he argues) the work itself has no internal connection."

  - id: dogmth-text-05
    genre: work
    pssTom: 23
    pages: "62 (Вступление)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "И я понял, наконец, что всё это вероучение, то, в котором мне казалось тогда, что выражается вера народа, что всё это не только ложь, но сложившийся веками обман людей неверующих, имеющий определенную и низменную цель."
    quoteEn: "(working English) And I understood, at last, that this whole creed — the one in which it then seemed to me the faith of the people was expressed — that all of it is not only a lie, but a deception built up over centuries by unbelieving men, with a definite and base aim."
    significance: "The verdict the introduction reaches before the chapter-by-chapter analysis begins: the dogmatic theology is a centuries-old deception with a worldly purpose (power over others). Tolstoy says the seminaries, where it is taught, reliably produce atheists."

  # — The chapter-by-chapter demolition —
  - id: dogmth-text-06
    genre: work
    pssTom: 23
    pages: "~78–90 (гл. IV)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Не бросить ли? Ведь это бред сумасшедшего. Но нет, я сказал себе, что прослежу строго, точно всё изложение богословия."
    quoteEn: "(working English) Should I not give it up? This, after all, is the raving of a madman. But no — I told myself I would follow strictly, exactly, the whole exposition of the theology."
    significance: "Ch. IV (essence and attributes of God). Tolstoy's recurring temptation to abandon the task — the dogmatics reads as 'the raving of a madman' (бред сумасшедшего, an image he repeats at the divinity-of-Christ chapter) — set against his methodical resolve to follow every page."

  - id: dogmth-text-07
    genre: work
    pssTom: 23
    pages: "~88 (гл. IV)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Церковь учит нас признавать и то и другое, т. е. что черное есть белое, а белое есть черное."
    quoteEn: "(working English) The Church teaches us to acknowledge both the one and the other — that is, that black is white, and white is black."
    significance: "Ch. IV. The §22 attempt to reconcile John of Damascus (the divine attributes are not really distinct) with Augustine (they are distinct) leaves the contradiction openly unresolved — so the Church, Tolstoy says, demands assent to a flat contradiction."

  - id: dogmth-text-08
    genre: work
    pssTom: 23
    pages: "~108 (гл. V)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Сказать, что я понял это, я не могу, и не может никто, и потому не могу сказать, что верю."
    quoteEn: "(working English) To say that I have understood this I cannot, and no one can; and therefore I cannot say that I believe it."
    significance: "Ch. V (the Trinity). The pivot of Tolstoy's whole objection: a dogma stated so that reason positively grasps it cannot be grasped is not a mystery to be believed but a form of words. He notes that after 1,000 years of Russian Christianity scarcely one peasant in ten can state the Trinity — 'because one cannot know what has no meaning.'"

  - id: dogmth-text-09
    genre: work
    pssTom: 23
    pages: "~157 (гл. VII)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Бог этих первых глав есть не бог христианский, не бог даже пророков и Моисея, бог, любящий людей, но это — бог, ревнующий свою власть к людям, бог, боящийся людей."
    quoteEn: "(working English) The God of these first chapters is not the Christian God, not even the God of the prophets and Moses, the God who loves men — but a God jealous of his power over men, a God who fears men."
    significance: "Ch. VII (the image of God in man; the Fall re-read against Genesis). Tolstoy reconstructs the Eden story's one coherent meaning as the opposite of the Church's: a God who wished to keep man ignorant like the animals, deceived him about death, and feared his knowledge — 'the same God as Zeus in relation to Prometheus.'"

  - id: dogmth-text-10
    genre: work
    pssTom: 23
    pages: "~177 (гл. VIII)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Учение же церкви на место этого вопроса, как мне жить, подставляет вопрос о том, отчего я дурен."
    quoteEn: "(working English) But the teaching of the Church, in place of this question — how shall I live — substitutes the question of why I am bad."
    significance: "Ch. VIII (original sin). The moral heart of the critique: the dogma of inherited sin displaces the living question of conduct ('how shall I live?') with a fantastical aetiology ('why am I bad?' — because of Adam), and teaches that man can do no good of himself but only through grace, sacraments and the hierarchy. Tolstoy calls it the most immoral teaching that could be invented."

  - id: dogmth-text-11
    genre: work
    pssTom: 23
    pages: "~178 (гл. VIII)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Может ли быть изобретено другое более безнравственное учение?"
    quoteEn: "(working English) Could any more immoral teaching be invented?"
    significance: "Ch. VIII. The summary judgment on the dogma of original sin and the helplessness it teaches — that man's own striving toward good is useless without grace dispensed by the hierarchy."

  - id: dogmth-text-12
    genre: work
    pssTom: 23
    pages: "~189 (гл. X)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Бог делает свое дело, которое я, очевидно, никогда понять не буду в силах, а мне надо делать свое."
    quoteEn: "(working English) God does His work, which I shall obviously never be able to understand; but I have to do mine."
    significance: "Ch. X (redemption). Tolstoy's recurring move: the Trinity, providence and redemption are God's business, which he need not and cannot grasp; his own business is how to live, and theology shrinks that to nothing. He notes that the redemption dogma, unlike the unknowable attributes of God, asserts something about men — and asserts the plain opposite of fact, since after the 'redemption' men sin, suffer and die exactly as before."

  - id: dogmth-text-13
    genre: work
    pssTom: 23
    pages: "~242 (гл. XIII)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Церковь — то самое, на чем основано всё богословие, — есть сама себя учредившая иерархия и, в противность всем другим иерархиям, считающая одну себя святою и непогрешимою и одну себя имеющею власть проповедывать божеское откровение."
    quoteEn: "(working English) The Church — the very thing on which all theology is founded — is a self-instituted hierarchy which, against all other hierarchies, considers itself alone holy and infallible and alone having the authority to preach divine revelation."
    significance: "Ch. XIII (the Church) — the chapter Tolstoy treats as the keystone of the whole edifice. 'The Church' is given shifting definitions (all believers, including angels and the dead) until, late and quietly, the word is swapped for the bishops; the sole real foundation of every church is the asserted infallibility of its own succession, equivalent to a man swearing 'by God, I am right.'"

  - id: dogmth-text-14
    genre: work
    pssTom: 23
    pages: "~261 (гл. XV)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Если сумасшедший верит, что у него на носу башня, то ведь несомненно то, что ему представляется на носу башня, но никто не станет утверждать, что у него на носу действительно башня."
    quoteEn: "(working English) If a madman believes there is a tower on his nose, then it is indeed beyond doubt that a tower appears to him to be on his nose — but no one will assert that there is actually a tower on his nose."
    significance: "Ch. XV (sanctification by faith). The §197 redefinition of 'faith' — for the first time in the book — not as knowledge of God but as a willed certainty, so that whoever believes he is sanctified is declared actually sanctified. Tolstoy answers with the madman certain there is a tower on his nose: the certainty is real, the tower is not."

  - id: dogmth-text-15
    genre: work
    pssTom: 23
    pages: "~255 (гл. XVI)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "В чем разница между чувашином, мажущим сметаной своего бога, и православным, торопящимся подать 5 копеек, чтобы имя его помянули в известном месте и в известное время?"
    quoteEn: "(working English) What is the difference between the Chuvash smearing his god with sour cream, and the Orthodox man hurrying to hand over 5 kopecks so that his name be commemorated in a certain place at a certain time?"
    significance: "Ch. XVI (the sacraments). The descent 'into the swamp of the most incomprehensible superstitions': once grace is said to be transmitted by physical manipulations, Orthodox sacramental practice is, for Tolstoy, on a level with pagan magic."

  - id: dogmth-text-16
    genre: work
    pssTom: 23
    pages: "~283 (гл. XVI)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Ясно: таинства суть чисто внешние действия, как заговоры от зубов, действующие на людей, и о духовном ни со стороны заговорщиков зубов, ни тех, которые лечатся, нечего думать и говорить."
    quoteEn: "(working English) Clearly: the sacraments are purely external acts, like spells against toothache, acting upon people, and there is nothing spiritual to think or speak of, either on the part of the toothache-charmers or of those being treated."
    significance: "Ch. XVI. The sacraments reduced to mechanical efficacy — 'make such-and-such movements with hands and lips, and grace will descend.' (This is one of the passages the 1911 S. A. Tolstaya edition softened for the censorship — «как заговоры от зубов» was struck.)"

  - id: dogmth-text-17
    genre: work
    pssTom: 23
    pages: "~291 (гл. XVII)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Одно чувство, которое я испытывал, выписывая это, есть чувство ужаса и страха перед тем кощунством, которое я совершаю, переписывая и повторяя это."
    quoteEn: "(working English) The one feeling I experienced while copying this out is a feeling of horror and dread at the blasphemy I am committing in transcribing and repeating it."
    significance: "Ch. XVII (relics, icons, hell, the last judgment). Tolstoy's reversal of the charge of blasphemy: it is repeating the Church's own teaching — the toll-houses, the eternal physical torments, the relics — that he feels to be the blasphemy. He asks what the state of 'the good God' must be, eternally watching the torments of hell."

  # — The Заключение (conclusion): the deadpan summary, the censored passage, the positive turn —
  - id: dogmth-text-18
    genre: work
    pssTom: 23
    pages: "~301 (Заключение)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Смысл моей жизни, по этому учению, есть совершеннейшая бессмыслица, без сравнения худшая той, которая мне представлялась при свете одного моего разума."
    quoteEn: "(working English) The meaning of my life, according to this teaching, is the most complete nonsense — incomparably worse than the one that presented itself to me by the light of my reason alone."
    significance: "The conclusion answers the question the whole project began with (A Confession's 'why live?'): the Church's dogmatic answer is worse than no answer, because it makes the senselessness eternal. The conclusion opens with a deadpan paraphrase of the entire dogmatic system in plain words (the 'strange, wild' half-monster God who creates the world on a whim)."

  - id: dogmth-text-19
    genre: work
    pssTom: 23
    pages: "~302 (Заключение)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Велят они, чтобы на молитве дьякон половину времени кричал многая лета правоверной, благочестивой блуднице Екатерине II или благочестивейшему разбойнику, убийце Петру, который кощунствовал на Евангелии, и я должен молиться об этом."
    quoteEn: "(working English) They command that at prayer the deacon half the time cry 'many years' to the orthodox, pious harlot Catherine II, or to the most pious robber and murderer Peter, who blasphemed against the Gospel — and I am to pray for this."
    significance: "The single most censored passage of the work: the comparison of Catherine the Great to a pious harlot and Peter the Great to a pious robber-murderer. The 1908 Gertsik edition cut the two names; the 1911 S. A. Tolstaya and 1913 Biryukov/Sytin editions replaced the whole clause with dots. The keystone of the work's collision with the Russian state, not only the Church."

  - id: dogmth-text-20
    genre: work
    pssTom: 23
    pages: "~303 (Заключение)"
    date: "1879–1880"
    extract: extracts/v23_060_303_Issledovanie_dogmaticheskogo_bogoslovija.txt
    quoteRu: "Дело веры есть только жизнь по вере. И жизнь одна выше всего и не может быть подчинена ничему, кроме бога, познаваемого только жизнью."
    quoteEn: "(working English) The business of faith is only life according to faith. And life alone is higher than everything and cannot be subordinated to anything except God, who is known only through life."
    significance: "The book's positive turn and last words: having demolished the dogmatic Church, Tolstoy ends not in negation but in his own constructive faith — the true Church is not a hierarchy or a confession but life-by-deeds; 'sacred tradition is the tradition of deeds and life.' This is the seed of the constructive works (the Gospel harmony, What I Believe) that the four-part project went on to."

  # — Genesis letters: PSS Tom 63 (Feb–Mar 1880). No diary survives for 1879–80. —
  - id: dogmth-let-01
    genre: letter
    pssTom: 63
    pages: "12–13"
    date: "1880-02-29 (OS)"
    addressee: "N. N. Strakhov"
    extract: extracts/v63_011_H_H_Straxovu.txt
    quoteRu: "Особенно тяжело мне было то, что, начав все перерабатывать сначала, я отдел обзора православного богословия должен был расширить. И я изучил хорошо богословие и теперь вот кончаю разбор его."
    quoteEn: "(working English) What weighed on me most was that, having begun to rework everything from the start, I had to expand the section surveying Orthodox theology. And I have studied theology thoroughly, and now I am finishing its analysis."
    significance: "The single most important dateable genesis witness (the PSS commentary calls it essentially the one certain indication relating to the work's creation). With no diary surviving for 1879–80, this 29 Feb 1880 letter to Strakhov shows the dogmatic-theology examination being expanded out of the larger religious treatise and nearing completion. The letter continues: «Если бы мне рассказывали то, чтò я там нашел, я бы не поверил. И все это очень важно» — 'If I had been told what I found there, I would not have believed it.'"

  - id: dogmth-let-02
    genre: letter
    pssTom: 63
    pages: "15–16"
    date: "1880-03-23 (OS)"
    addressee: "N. N. Strakhov"
    extract: extracts/v63_014_H_N_Straxovu.txt
    quoteRu: "и не могу оторваться и часто счастлив своей работой, но очень часто слабею головой."
    quoteEn: "(working English) and I cannot tear myself away, and am often happy with my work, but very often my head grows weak."
    significance: "Three weeks later (23 March 1880), the intensity of the work continues — the absorption and the physical toll the PSS commentary documents from this period (S. A. Tolstaya's parallel report that he was exhausting himself). The corpus's TEI editorial note attributes this letter's 'work' to the Gospel examination rather than the dogmatic theology — a divergence from the Tom 23 commentary, logged in needsReview."

