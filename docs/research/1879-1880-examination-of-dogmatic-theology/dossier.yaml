# ── Scholarship (secondary layer — Phase 3) ─────────────────────────────────
scholarship:
  summary: >-
    Examination of Dogmatic Theology is, by common acknowledgement, the
    least-read and least-discussed of Tolstoy's four major religious writings.
    English-language scholarship tends to name it, place it second after A
    Confession, and pass on to the 'constructive' Gospel works — framing it as the
    negative or destructive panel of the project. Where it is engaged, the older
    biographical tradition praises its method while keeping the polemic at arm's
    length: Ernest Simmons calls it 'perhaps the least read of all these works, and
    undeservedly so,' an 'unusually fervent and compellingly logical attack on
    revealed religion.' A. N. Wilson and Rosamund Bartlett barely treat it; Gustafson
    engages the fiction–theology interface rather than this text. The decisive modern
    exception is Pål Kolstø's Heretical Orthodoxy (Cambridge, 2022), whose chapter 3
    is the only full English-language study of the work; Kolstø explains the neglect
    bluntly ('the stylist Tolstoi is conspicuously absent; the polemics … are so
    coarse and overplayed') and then reads the book 'against the grain,' arguing that
    the crude anti-clerical demolition conceals deeply Orthodox structural features in
    Tolstoy's own mature theology — a sharply dualistic anthropology and an apophatic
    register — and that Tolstoy in fact faults Makary for having abandoned
    apophaticism. The corpus grounds and extends this: the dive's primary reading
    shows the book's positive turn at the conclusion (life-by-deeds as the true
    Church) — i.e. the demolition is in the service of a constructive faith — and
    documents, from the Jubilee apparatus, the precise genesis (the 1879 single
    treatise; the two 1880 Strakhov letters; the 1882 Solovyov-prompted insertion;
    the 1884 revision) and the title history (Tolstoy's «Исследование» vs the émigré
    «Критика») that the Western literature, working from Wiener's 'Critique,' does not
    register. Treat the 'merely negative' framing critically: by the work's own last
    page it is not merely negative.
  triangulation:
    - evidenceRef: dogmth-text-20
      conventionalView: "Examination of Dogmatic Theology is the negative / purely destructive counterpart to Tolstoy's constructive religious works (Simmons; general reference framing)."
      relation: complicates
      source: "Ernest J. Simmons, Introduction to Tolstoy's Writings (1968), ch. 7; the primary text complicates this — the conclusion turns from demolition to Tolstoy's own positive faith («Дело веры есть только жизнь по вере»), so the book is the negative panel of a project whose constructive aim is already visible inside it."
    - evidenceRef: dogmth-text-13
      conventionalView: "The book's anti-Orthodox polemic is too coarse and overplayed to repay close study, which is why scholarship has ignored it (Kolstø 2022)."
      relation: extends
      source: "Pål Kolstø, Heretical Orthodoxy (Cambridge UP, 2022), ch. 3 — who, against that view, reads the work 'against the grain' for the Orthodox structures it conceals (dualist anthropology; apophatic/cataphatic registers; Tolstoy faulting Makary for abandoning apophaticism). The corpus supplies the close primary reading the older tradition skipped."
    - evidenceRef: dogmth-text-01
      conventionalView: "The work's title is 'A Critique of Dogmatic Theology' (Wiener 1904; the standard English title)."
      relation: contradicts
      source: "The PSS editors (Savodnik) restored «Исследование» (Examination/Investigation) from Tolstoy's own autograph title page; «Критика» entered circulation through Elpidine's 1891 first edition (confirmed by the PY Rare Books catalogue) and is not Tolstoy's word — the primary record corrects the title the Western reception inherited."
    - evidenceRef: dogmth-text-19
      conventionalView: "Tolstoy's 1901 excommunication followed from his religious writings, of which this is the most direct attack on the Church."
      relation: complicates
      source: "Wikisource, Decree of Excommunication (1901), names no individual works; the dive (cf. the A Confession dive) treats the work as institutional background to the 1901 edict, not a cited cause — and notes the work attacks the imperial state (the Catherine/Peter passage) as fiercely as the Church."
    - evidenceRef: dogmth-let-01
      conventionalView: "The four religious works form a connected project beginning with A Confession (often described as its 'introduction')."
      relation: confirms
      source: "Simmons (1968), who notes A Confession's original title was 'An Introduction to a Criticism of Dogmatic Theology'; the corpus confirms the single-treatise origin (the 29 Feb 1880 Strakhov letter; the PSS commentary) and supplies the genesis chronology."

