  - item: "dateFirstPublishedInRussia — Askarkhanov (partial, undated here) vs Gertsik 1908 (fuller)."
    phase: "4 (workRecord)"
    why: "Askarkhanov printed only half the book; Gertsik 1908 is the fuller first Russian printing. Which counts as 'first' is a convention call."
  - item: "bans[] encoding — a single imperial-censorship complete-ban entry vs adding a holy-synod entry."
    phase: "4 (workRecord)"
    why: "The work fell under both secular and spiritual (ecclesiastical) censorship; it was never formally submitted in Russia, so the 'ban' is a standing unpublishability rather than a dated decree. Human ingestion call on how to encode."
