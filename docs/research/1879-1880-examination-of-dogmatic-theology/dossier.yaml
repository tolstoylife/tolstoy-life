# ── Coverage ledger (surfaces × status) ─────────────────────────────────────
coverage:
  - surface: "Genesis & composition"
    status: covered
    note: "Grounded despite the 1879–80 diary gap: the four-part-project origin (begun as one treatise late 1879), the two 1880 Strakhov letters (the only certain dateable witnesses), the 1882 Solovyov-prompted inserted article, and the Sept–Nov 1884 revision (the Chertkov letters; the October-1884 letters to S. A. Tolstaya) — all from the PSS commentary + Tom 63 letters. Diary witness is absent for 1879–80 and documented as a gap."
  - surface: "What the work says"
    status: covered
    note: "Deep structural read of the Вступление, all 17 chapters and the Заключение (the demolition follows Makary's dogma order: knowability of God, Trinity, attributes, creation/Fall, original sin, providence, divinity of Christ, redemption, the Church, grace, sacraments, relics/judgment); 20 keystone passages extracted byte-faithful, incl. the conclusion's deadpan paraphrase, the censored Catherine/Peter passage, and the positive turn."
  - surface: "Redactions & textual history"
    status: partial
    note: "The four manuscript redactions and the 1884 revision are summarized from the PSS commentary (incl. the first redaction's greater personal warmth, the inserted 1882 article, Strakhov's marginalia, the base manuscript no. 4). The variants themselves were not collated (Tom 23 carries no separate «варианты» file for this work as it does for Confession)."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "Elpidine (Geneva 1891 / Carouge 1896, as «Критика»); «Свободное слово» Christchurch 1903; Russian printings Askarkhanov (partial) and Gertsik 1908, with the 1911/1913 censorship cuts; English by Wiener (Boston 1904). The title history (Tolstoy's «Исследование» vs «Критика») is documented. The 1903 Christchurch edition rests on the PSS commentary (not independently web-confirmed)."
  - surface: "Reception & afterlife (Russian society + Church)"
    status: partial
    note: "The work's near-total neglect in Western criticism is documented (Simmons; Kolstø). Contemporary Russian critical/clerical reception was NOT separately swept — the work circulated abroad and in manuscript, so its 1880s–1900s Russian reception is thin in the corpus and was not pursued in scholarship beyond the censorship history. Honestly partial."
  - surface: "Place in the cluster"
    status: covered
    note: "The second, demolishing panel of the four-part project (A Confession → this → Gospel harmony → What I Believe), cross-linked to the sibling dives; the negative counterpart to the constructive Gospel work, with its own positive turn at the conclusion."
  - surface: "The author's later verdict"
    status: partial
    note: "Tolstoy never disowned the work and authorized/corrected the 1902–03 «Свободное слово» reissue (he corrected the first sheets in Nov 1902); the 1884 preface to «Краткое изложение Евангелия» describes the four-part work as 'unprintable' but standing. No separate later self-assessment of this book specifically was swept — partial."
  - surface: "Visual & manuscript record"
    status: covered
    note: "Medium sweep: 6 PD images cached (keystone = Makary Bulgakov, the antagonist-text author; period Tolstoy 1880s + Kramskoy 1873; Strakhov; Chertkov; Filaret) + a committed PD English facsimile (Wiener 1904 vol. XIII title page + frontispiece). Not openly found: a title-page facsimile of the banned Elpidine «Критика» 1891 first edition (logged to acquire); no Elpidine portrait on Commons."

contradictions:
  - claim: "The corpus TEI editorial note on the 23 March 1880 Strakhov letter (dogmth-let-02) attributes the 'work' Tolstoy describes to «разбор Евангелия» (the Gospel examination)."
    correction: "The PSS Tom 23 commentary treats both the 29 Feb and (with a caveat) the ~March 1880 Strakhov letters as witnesses to the dogmatic-theology examination, while itself noting it cannot be certain the later letter refers to the dogmatics rather than the Gospel work. The two religious works were being written in the same intense period; the attribution is genuinely uncertain — flagged, not resolved."
    evidenceRef: dogmth-let-02

notCovered:
  - "Contemporary Russian critical and clerical reception of the work in the 1880s–1900s (it circulated abroad / in manuscript; a dedicated reception sweep was not run)."
  - "The four manuscript variants themselves (collated only in summary from the commentary; Tom 23 carries no separate «варианты» apparatus file for this work)."
  - "The 1882 inserted article «По поводу статей Соловьева, Ив.-П. и Д. X.» in its own right, and the underlying «Русь» 1881–82 articles by Solovyov, Ivantsov-Platonov and D. A. Khomyakov."
  - "Pål Kolstø's full 'apophatic/cataphatic' and dualist-anthropology argument (Heretical Orthodoxy ch. 3) — summarized from the publisher/abstract level, not read in full."
  - "The Wiener 1904 English translation's text and accuracy (only its title page / publication facts used)."
  - "The relation of this work to the Gospel harmony («Соединение и перевод четырех Евангелий») as a text — named as the constructive sibling but not deep-read here (see the gospel-translation dive)."

