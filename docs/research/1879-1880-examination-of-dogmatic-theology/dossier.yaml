topic:
  slug: 1879-1880-examination-of-dogmatic-theology
  title: "Examination of Dogmatic Theology (Исследование догматического богословия)"
  question: >-
    Document Examination of Dogmatic Theology as a work across the local Tolstoy
    corpus — the second panel of the original four-part religious project Tolstoy
    began as one treatise in late 1879 (A Confession → Examination of Dogmatic
    Theology → the Gospel harmony → What I Believe), and the negative,
    demolishing counterpart to the constructive Gospel work. Its genesis in the
    last months of 1879 – March 1880, witnessed (with no surviving diary for those
    years) by two letters to N. N. Strakhov; Tolstoy's method of learning Orthodox
    dogmatics "like a good seminarian" the better to dismantle it, taking
    Metropolitan Makary (Bulgakov)'s «Православно-догматическое богословие» as the
    representative text; what the book argues, chapter by chapter, against the
    knowability of God, the Trinity, the divine attributes, creation and the Fall,
    original sin, providence, the divinity of Christ, redemption, the Church, grace,
    the sacraments and relics — the recurring charge being not mere error but
    deliberate, "conscious lie" (сознательная ложь) and a theology that replaces the
    question "how shall I live?" with "why am I bad?"; its closing turn from
    demolition to Tolstoy's own positive faith (the true Church as life-by-deeds,
    not doctrine); its four manuscript redactions and the 1884 revision; the title
    question (Tolstoy's own «Исследование» vs the «Критика догматического богословия»
    of the émigré editions); and its publication abroad (Elpidine, Geneva 1891 /
    Carouge 1896; «Свободное слово», Christchurch 1903) under a ban in Russia, with
    the late, censored Russian printings (the "Catherine the pious harlot / Peter the
    pious robber" passage cut) — grounded in Tolstoy's own words, the Jubilee-Edition
    apparatus, the composition-window letters, and the project's prior dives.
  date: "2026-06-07"
  period: "Prophet period (post-1880); composition late 1879 – March 1880 (Old Style); final revision Sept–Nov 1884"
  corpusSurface: "PSS Tom 23 (work «Исследование догматического богословия» pp. 60–303; commentary by V. F. Savodnik pp. 538–547); composition-window letters Tom 63 (to N. N. Strakhov, Feb–Mar 1880). No diaries survive for 1879–80 (Tom 48 ends 1878; Tom 49 begins 1881)."
  dateRange: "1879 (genesis, as part of the single religious treatise) – 1903 (Christchurch «Свободное слово» edition); 1891 first publication (Elpidine, Geneva); 1908 first Russian printing (Gertsik, censored). English: Wiener, Boston 1904."

# ── Evidence ledger (primary; byte-faithful) ────────────────────────────────
