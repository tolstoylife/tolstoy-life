# ── Scholarship (secondary layer — Phase 3) ─────────────────────────────────
scholarship:
  summary: >-
    English-language scholarship treats What Then Must We Do? as the document of
    Tolstoy's turn from art to social prophecy — a powerful eyewitness account of
    the 1882 Moscow census slums (Lyapinsky, Rzhanov) converted into a wholesale
    attack on charity, property, money and the division of labour, ending in a
    bread-labour doctrine drawn from the peasant Bondarev and reinforced by Henry
    George. Standard biography (Simmons 1946; Bartlett 2011; Maude, who also
    translated it as What Then Must We Do?, Oxford 1925) registers the census
    trigger, the rejection of charity, and the famous «get off his back» image.
    But the precision of the primary argument — money as a bloodless form of
    slavery enabled specifically by the state's fiscal coercion (the Fiji
    parable), and the «scientific» Spencer/organic division-of-labour theory as a
    fiction dressing «захват чужого труда» — is largely undeveloped in the
    secondary literature. The censorship mechanics (Pobedonostsev's refusal,
    Ivantsov-Platonov's neutralizing notes, S. A. Tolstaya's simultaneous
    concession-and-petition) are noted only in passing. The final chapter on women
    is consistently flagged as retrograde and absorbed into the Sofia-centred
    «guilt-ridden patriarch» frame (Popoff; The Last Station), rather than read
    against the primary family-conflict record. The newest scholarship (Nicolosi
    2024, Russian Review) reads the slum chapters as a deliberate intervention in
    Russian slum-literature, individualizing the poor against the period's
    degeneration-discourse — an angle the biographical and economic traditions had
    not developed.
  triangulation:
    - evidenceRef: wtmwd-text-01
      conventionalView: "The book issues from the January 1882 Moscow census; the essay «О переписи в Москве» is its first textual fruit."
      relation: confirms
      source: "Simmons, Leo Tolstoy (1946); Bartlett, Tolstoy: A Russian Life (2011); Maude introduction (1925)"
    - evidenceRef: wtmwd-text-05
      conventionalView: "Tolstoy rejects charity and condemns money-possession as immoral; popular reception cites the «get off his back» image and the evil of money."
      relation: complicates
      source: "general reception (Goodreads aggregate; Maude trans.); the fiscal-coercion-as-slavery mechanism (the Fiji parable's point) is not developed in the secondary literature found"
    - evidenceRef: wtmwd-text-06
      conventionalView: "Tolstoy attacks the division of labour and 'science' as a justification for idleness."
      relation: extends
      source: "Goodreads/quotations; the Comte/Spencer organic-theory axis as the church's successor in sanctifying inequality is not unpacked in the English-language scholarship found"
    - evidenceRef: wtmwd-text-08
      conventionalView: "The bread-labour doctrine derives from the peasant Bondarev (manuscript reached Tolstoy July 1885; he championed its publication)."
      relation: confirms
      source: "Wikipedia/Bondarev; Donskov, Tolstoy in Conversation with Four Peasant Sectarian Writers (2019); Gandhi & Peace Studies"
    - evidenceRef: wtmwd-let-02
      conventionalView: "Bondarev is the acknowledged peasant source; Sutaev's parallel role (no-property, no-locks) in the book's property argument is much sparser in scholarship."
      relation: extends
      source: "Donskov 2019 (covers Bondarev, not Sutaev); the December 1884 Alekseev letter integrating Sutaev's position is not cited in any secondary source found"
    - evidenceRef: wtmwd-let-05
      conventionalView: "Henry George's Progress and Poverty influenced Tolstoy's economic thought."
      relation: complicates
      source: "Progress and Poverty Institute; George (read early 1885) is reinforcement of the 1885–86 phase, not the 1882 genesis; first Tolstoy→George letter is 1889"
    - evidenceRef: wtmwd-text-10
      conventionalView: "The final chapter's gender doctrine is retrograde — an idealization of maternal domesticity that condemns the 'woman question.'"
      relation: complicates
      source: "Cruise, in Orwin ed. The Cambridge Companion to Tolstoy (2002); Lounsbery, 'The Woman Question,' Tolstoy in Context (2022); the primary family-conflict record (PSS apparatus) — S. A. Tolstaya objected to the NAMING of family, not the argument, and petitioned to print the book — is not registered in scholarship and complicates the Sofia-centred frame"

# ── Work-record proposal (READ-ONLY to works/; human ingestion applies) ──────
workRecord:
  recordPath: "website/src/works/non-fiction/treatises/what-then-must-we-do/What Then Must We Do.md   # PROPOSED — no record exists yet; treatises/ is the natural home (cf. the What I Believe proposal). Folder is a human decision."
  workId: "what-then-must-we-do"
  fields:
    - field: titleRu
      value: "Так что же нам делать?"
      evidenceRefs: [wtmwd-text-01]
      source: jubilee-edition
      confidence: high
    - field: titleEn
      value: "What Then Must We Do?"
      evidenceRefs: []
      source: jubilee-edition
      confidence: high
      note: "Standard scholarly English title (Maude, Oxford 1925). The first English edition (Hapgood, 1887) used 'What to Do?'; Wiener (1904) used 'What Is to Be Done?'."
    - field: titleAlternatives
      value: "[{title: 'What to Do?', type: translation, language: en}, {title: 'What Is to Be Done?', type: translation, language: en}, {title: 'Какова моя жизнь?', type: variant, language: ru}]"
      evidenceRefs: []
      source: jubilee-edition
      confidence: high
      note: "Hapgood 1887 'What to Do? Thoughts evoked by the census of Moscow'; Wiener 1904 'What Is to Be Done?'; Maude 1925 'What Then Must We Do?'. The Geneva/Elpidine first fuller text (1886) bore the variant Russian title «Какова моя жизнь?»."
    - field: genre
      value: "essay   # religious-philosophical / social treatise; mirror the controlled value used for Confession & the What I Believe proposal"
      evidenceRefs: []
      source: jubilee-edition
      confidence: medium
    - field: dateWritingStarted
      value: "1882"
      oldStyle: "1882"
      approximate: true
      evidenceRefs: [wtmwd-perepis-01]
      source: jubilee-edition
      confidence: medium
      note: "Begun early 1882, right after the January 1882 census and «О переписи в Москве» (S. A. Tolstaya's note on the 4 Feb 1882 letter). NOT 1884, despite the dating in lifetime collected editions. The slug window 1882–1886 takes the genesis year."
    - field: dateWritingCompleted
      value: "1886"
      oldStyle: "1886"
      approximate: true
      evidenceRefs: [wtmwd-let-03]
      source: jubilee-edition
      confidence: medium
      note: "Still in progress March 1886 (letter to Bondarev); the 5th-edition vol. 12 carrying the work was out by 10 April 1886. The work was finished/printed in cut form by spring 1886; the complete text was settled only later (Chertkov 1902)."
    - field: dateFirstPublished
      value: "1885"
      approximate: true
      evidenceRefs: []
      source: jubilee-edition
      confidence: medium
      note: "First (cut) appearance: fragments in Russkoe Bogatstvo, 1885 («Жизнь в городе» March–April; «Из воспоминаний о переписи» Sept–Oct; «Деревня и город» Dec). Serialization at Russkaya Mysl (Jan 1885) was refused by the censor. First cut FULL text: 5th ed. of the collected works, vol. 12, out 10 April 1886. First fuller text abroad: «Какова моя жизнь?», Geneva (Elpidine), 1886. First COMPLETE text: Chertkov, Свободное слово, Christchurch, 1902. Human to decide which event the field carries."
