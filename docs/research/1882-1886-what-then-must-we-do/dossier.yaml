# ── Coverage ledger (surfaces × status) ─────────────────────────────────────
coverage:
  - surface: "Genesis & composition"
    status: covered
    note: "Triply grounded: the Jan-1882 census + «О переписи в Москве»; the 1 Jan 1883 property/violence diary entry and the 1884 estate-reform plan; the Dec-1884 Alekseev bridge and the 1885–86 Bondarev letters. Composition chronology 1882→1886 reconstructed from the apparatus (begun early 1882, not 1884; stop-start; intensive Dec 1884; finishing Jan 1885 and into 1886)."
  - surface: "What the work says"
    status: covered
    note: "Deep structural read of all 40 chapters; keystone passages (failed charity / «I sit on his back»; money as slavery + the Fiji parable; the science / division-of-labour critique; the three answers and bread-labour / Bondarev; the final chapter on women) extracted byte-faithful."
  - surface: "Redactions & textual history"
    status: partial
    note: "The apparatus's complex redaction history (the «О помощи при переписи» first draft; the Russkaya Mysl vs Russkoe Bogatstvo vs 5th-ed. recensions; the first printed variant of ch. XVII; the Henry-George/Spencer reworking of the money and science chapters; the 1901 corrected ch. XL) is summarized from the commentary, not exhaustively collated. The 765 KB variants file (Tom 25 pp. 614–652) was not deep-read."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "Serialization refused (Russkaya Mysl, Jan 1885); cut fragments (Russkoe Bogatstvo, 1885); cut full text (5th ed. vol. 12, 10 Apr 1886) after Pobedonostsev's Synod refusal + Ivantsov-Platonov's notes; fuller text abroad (Geneva/Elpidine «Какова моя жизнь?» 1886; «Деньги» 1887; «Что же нам делать?» ≥1889); complete text (Chertkov, Christchurch, 1902). English: Hapgood 1887 → Wiener 1904 → Maude 1925."
  - surface: "Reception & afterlife (Russian society + Church)"
    status: partial
    note: "Composition-window reception grounded in letters (Strakhov agreed-diagnosis-disagreed-conclusion; Rusanov; the doctor-enthusiast 'new era' in the text itself) and the censorship verdicts (Pobedonostsev). The wider critical/press reception and the work's influence on the Tolstoyan colonies are sketched (Alekseev/Sibiryakov, the Alekhin commune in the 1889 letter) but not fully swept. The Synod/excommunication tie is left to needsReview."
  - surface: "Place in the cluster"
    status: covered
    note: "The economic/social application of the What I Believe ethic; fourth Prophet-period panel after A Confession, the Gospel works, and What I Believe. Cross-links to sibling dives and forward into the economic cluster (copyright-renunciation, christian-communism-socialism, doukhobors)."
  - surface: "The author's later verdict"
    status: not-covered
    note: "Tolstoy's later (post-1886) explicit judgments on the book itself not extracted; the 1889 Alekseev letter on the Alekhin commune shows where the bread-labour argument went in practice, but is not a verdict on the text."
  - surface: "Visual & manuscript record"
    status: covered
    note: "Medium sweep: 8 PD images cached (keystone = Repin's 1887 Tolstoy ploughing; the 1884 Ge portrait; the Makovsky night-shelter; the 1887 Hapgood first English edition). Not openly available: portraits of Alekseev, Bondarev, Sutaev, and a Lyapinsky-house photograph (all logged to request)."

contradictions:
  - claim: "Lifetime Russian collected editions dated the work «1884–1885»."
    correction: "The PSS apparatus shows it was begun in early 1882 (right after the census), per S. A. Tolstaya's note on the 4 Feb 1882 letter and the «О помощи при переписи» first draft; the 1884 dating reflects the resumption, not the start."
    evidenceRef: wtmwd-perepis-01

notCovered:
  - "The 765 KB variants file (Tom 25 pp. 614–652) and the full redaction collation — summarized from the commentary, not deep-read."
  - "The «Деньги» (1887) and «Что же нам делать?» (≥1889) Elpidine émigré printings, and the 1901 corrected ch. XL — named from the apparatus, not seen."
  - "The wider contemporary critical/press reception (named critics, reviews) beyond the letter-network and censorship verdicts."
  - "Tolstoy's later explicit verdict on the work; «О жизни» (1887) is the philosophical successor but was not swept here."
  - "The full Bondarev and Sutaev correspondence (and Bondarev's «Торжество земледельца» text itself) — the relationship is documented here from the 1885–86 letters and the book's acknowledgement, not the peasant texts."
  - "The de-facto dating of the «О переписи в Москве» printing (Sovremennye Izvestiya, 20 Jan 1882) rests on the scholarship sweep, not the PSS bibl — confirm before asserting as primary."

needsReview:
  - item: "excommunicationRelated field value for What Then Must We Do?."
    phase: "4 (workRecord)"
    why: "The 1901 Synod edict names no individual works; the doctrine is part of the broader condemned teaching but a direct tie should not be asserted. Proposed false."
  - item: "dateFirstPublished — which event the field should carry (refused Russkaya Mysl serialization Jan 1885 / cut fragments Russkoe Bogatstvo 1885 / cut full text 5th-ed. vol. 12 1886 / fuller text Geneva 1886 / complete text Christchurch 1902)."
    phase: "4 (workRecord)"
    why: "No clean 'first publication': the work appeared in cut and dispersed forms over 1885–1902. Convention needed for a work that was never cleanly banned but never cleanly published whole in its time."
  - item: "Proposed works/ folder (treatises) and exact filename for the new record."
    phase: "4 (workRecord)"
    why: "treatises/ is the natural home; human ingestion decision (cf. the What I Believe folder question)."
  - item: "Cross-dive diary ambiguity: the Tom 25 commentary places a «не могу продолжать свою статью. Тонкости, и потому будет ложь» stall-entry at 28 April 1884 for THIS book, but the What I Believe dive cited an identically-worded 28 April 1883 entry (v49_1883_04_28) for THAT book; the corpus has only the 1883 file."
    phase: "1 (sweep) / 2 (extract)"
    why: "The two near-contemporaneous books shared a single strained writing period; the diary line should not be attributed to this work without resolving the year. Not cited in this dive's evidence."
  - item: "The family-conflict primary quotes (S. A. Tolstaya's note + Tolstoy's late-Jan-1885 apology «каюсь в них… отстаиваю самую мысль») are cited via the PSS Tom 25 apparatus, not from the primary letter (Tom 83, letters to S. A. Tolstaya — not independently extracted)."
    phase: "3 (reception)"
    why: "The finding is well-attested in the apparatus but the underlying letter was not byte-extracted; flag before treating the quote as primary-verified."

