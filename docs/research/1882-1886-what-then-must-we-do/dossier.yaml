topic:
  slug: 1882-1886-what-then-must-we-do
  title: "What Then Must We Do? (Так что же нам делать?)"
  question: >-
    Document What Then Must We Do? as a work across the local Tolstoy corpus —
    its genesis in the January 1882 Moscow census and the «О переписи в Москве»
    appeal; what the text argues (the failure of charity; «I sit on a man's
    back»; money as a bloodless modern form of slavery rooted in state coercion;
    the critique of political economy's three factors and of the «scientific»
    organic division of labour as a fiction dressing the seizure of others'
    labour — «захват чужого труда»; the positive doctrine of bread-labour drawn
    from the peasant T. M. Bondarev and the sectarian V. K. Sutaev; and the
    contested final chapter assigning the world's salvation to self-sacrificing
    mothers); its long stop-start composition 1882–1886; its serialization-refusal,
    censorship cuts and dispersed publication; and its place as the economic and
    social application of the What I Believe ethic — grounded in Tolstoy's own
    words, the Jubilee-Edition apparatus, the composition-window diaries and
    letters, and the project's prior dives.
  date: "2026-06-06"
  period: "Prophet period (post-1880); composition 1882–1886 (Old Style); begun early 1882, written mostly 1884–86"
  corpusSurface: "PSS Tom 25 (work pp. 182–411; first printed variant of ch. XVII pp. 503–507; variants pp. 614–652; commentary pp. 740–839); forerunner «О переписи в Москве» pp. 173–181; diaries Tom 49 (1882–87, sparse for the writing window); letters Tom 63 (1880–86) and Tom 64 (1887–89)"
  dateRange: "1882 (Moscow census, genesis) – 1906 (Bondarev full text / late legal printings); first cut Russian fragments 1885, first cut full Russian text 1886 (5th ed., vol. 12); first fuller text abroad 1886 (Geneva/Elpidine); first complete text 1902 (Chertkov, Christchurch)"

# ── Evidence ledger (primary; byte-faithful) ────────────────────────────────
# extract paths are relative to this file's directory.
evidence:

  # — The forerunner appeal: «О переписи в Москве», PSS Tom 25, pp. 173–181 —
  - id: wtmwd-perepis-01
    genre: work
    pssTom: 25
    pages: "173–181"
    date: "1882-01 (OS)"
    extract: extracts/v25_173_181_O_perepisi.txt
    quoteRu: "Деньги сами по себе зло. И потому кто дает деньги, тот дает зло."
    quoteEn: "(working English) Money is in itself an evil. And therefore he who gives money gives evil."
    significance: "The proto-thesis, in the January 1882 census appeal that immediately precedes the book: money itself is an evil, so charity-by-money cannot be 'doing good.' The kernel of the money critique the treatise will build out."

  - id: wtmwd-perepis-02
    genre: work
    pssTom: 25
    pages: "181 (close)"
    date: "1882-01 (OS)"
    extract: extracts/v25_173_181_O_perepisi.txt
    quoteRu: "Приди один человек в сумерки к Ляпинскому ночлежному дому, когда 1000 человек раздетых и голодных ждут на морозе впуска в дом, и постарайся этот один человек помочь им, и у него сердце обольется кровью, и он с отчаянием и злобой на людей убежит оттуда; а придите на эту тысячу человек еще тысяча человек с желанием помочь, и дело окажется легким и радостным."
    quoteEn: "(working English) Let one person come at dusk to the Lyapinsky night-shelter, when a thousand undressed and hungry people wait in the frost for admission, and let that one try to help them, and his heart will pour out blood, and he will run away in despair and anger at people; but let another thousand come to that thousand with the wish to help, and the task will prove light and joyful."
    significance: "The Lyapinsky night-shelter — the scene that crystallized the book's opening crisis — already named in the appeal, with its closing call «Дружней, братцы, разом!» (All together, brothers, at once!)."

  # — The work's own text: PSS Tom 25, pp. 182–411 —
  - id: wtmwd-text-01
    genre: work
    pssTom: 25
    pages: "182 (ch. I)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "Я всю жизнь прожил не в городе. Когда я в 1881 году переехал на житье в Москву, меня удивила городская бедность."
    quoteEn: "(working English) I lived my whole life away from the city. When in 1881 I moved to Moscow to live, the city poverty astonished me."
    significance: "The opening: the autobiographical frame. Tolstoy's 1881 move to Moscow and the shock of urban poverty — a poverty unlike the village poverty he knew — that sets the book in motion."

  - id: wtmwd-text-02
    genre: work
    pssTom: 25
    pages: "ch. II (the Lyapinsky house)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "есть преступление, не один раз совершенное, но постоянно совершающееся, и что я, с своей роскошью, не только попуститель, но прямой участник его."
    quoteEn: "(working English) [it] is a crime, committed not once but constantly committed, and that I, with my luxury, am not only its condoner but its direct participant."
    significance: "After the Lyapinsky-house visit: Tolstoy likens his luxury beside the starving thousands to having once watched a guillotine execution in Paris — complicity in a crime constantly committed. The personal guilt the book turns into a structural argument."

  - id: wtmwd-text-03
    genre: work
    pssTom: 25
    pages: "ch. XVI (the keystone)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "Я сижу на шее у человека, задавил его и требую, чтобы он вез меня, и, не слезая о него, уверяю себя и других, что я очень жалею и хочу облегчить его положение всеми возможными средствами, но только не тем, чтобы слезть с него."
    quoteEn: "(working English) I sit on a man's back, choking him and making him carry me, and yet assure myself and others that I am very sorry for him and wish to ease his lot by every possible means — except by getting off his back."
    significance: "THE keystone of the book. Charity is impossible because the rich man's means are taken from the very people he means to help — the famous image of the rider who will do anything for the man he rides except dismount. Drafted first in a 5–7 Sep 1884 letter to Chertkov."

  - id: wtmwd-text-04
    genre: work
    pssTom: 25
    pages: "ch. XVI–XVII (the turn to money)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "И я почувствовал, что в деньгах, в самых деньгах, в обладании ими есть что-то гадкое, безнравственное, что самые деньги и то, что я имею их, есть одна из главных причин тех зол, которые я видел перед собой, и я спросил себя: что такое деньги?"
    quoteEn: "(working English) And I felt that in money, in money itself, in the possession of it, there is something vile and immoral — that money itself, and my having it, is one of the chief causes of the evils I saw before me — and I asked myself: what is money?"
    significance: "The pivot from the failed-charity narrative to the theoretical core. The realization that money itself is the problem opens ch. XVII («Деньги! Что ж такое деньги?») and the critique of political economy."

  - id: wtmwd-text-05
    genre: work
    pssTom: 25
    pages: "ch. XX (money as slavery)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "Говорить о том, что деньги не производят порабощения — это всё равно, что было бы говорить полстолетия тому назад, что крепостное право не производит порабощения."
    quoteEn: "(working English) To say that money does not produce enslavement is exactly like saying, half a century ago, that serfdom does not produce enslavement."
    significance: "The conclusion of the money chapters (illustrated at length by the Fiji-islands parable of taxation): money is a bloodless modern form of slavery, structurally identical to serfdom because it is backed by the state's coercive demand for taxes."

  - id: wtmwd-text-06
    genre: work
    pssTom: 25
    pages: "ch. XXXII (division of labour)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "а будет, как оно и есть, один только захват чужого труда сильным; тот самый захват чужого труда сильным, который прежде богословы называли божеским назначением, потом философы — необходимыми формами жизни, а теперь научная наука называет органическим разделением труда."
    quoteEn: "(working English) it will be, as it really is, simply the seizure of another's labour by the strong — that very seizure of another's labour by the strong which theologians once called a divine ordinance, then philosophers called necessary forms of life, and which scientific science now calls the organic division of labour."
    significance: "The hinge of the science critique: the «scientific» (Comte/Spencer) organic theory of the division of labour is the modern priestly dressing for «захват чужого труда» — the seizure of others' labour — succeeding theology and philosophy in the same office."

  - id: wtmwd-text-07
    genre: work
    pssTom: 25
    pages: "ch. XXVIII (science as the new priesthood)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "в толпе же ходят принимаемые на веру выводы о том, что разделение труда есть закон, утвержденный наукой, и что так и надо: одним умирать с голода и работать, а другим вечно праздновать, и что эта-то самая гибель одних и празднование других и есть несомненный закон жизни человечества, которому должно подчиняться."
    quoteEn: "(working English) and among the crowd circulate, taken on faith, the conclusions that the division of labour is a law affirmed by science, and that this is how it must be: that some are to die of hunger and toil while others feast forever, and that this very perishing of some and feasting of others is the indubitable law of human life, to which one must submit."
    significance: "Tolstoy's charge that 'scientific science' has taken over from the church the function of sanctifying inequality — beliefs 'taken on faith' from the new priesthood of learning."

  - id: wtmwd-text-08
    genre: work
    pssTom: 25
    pages: "ch. XXXVIII (bread-labour / Bondarev)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "В Библии сказано, как закон человека: «в поте лица снеси хлеб, и в муках родиши чада». Мужик Бондарев, написавший об этом статью, осветил для меня мудрость этого изречения."
    quoteEn: "(working English) In the Bible it is said, as a law for man: «in the sweat of thy face shalt thou eat bread, and in pain shalt thou bear children». The peasant Bondarev, who wrote an article about this, illuminated for me the wisdom of this saying."
    significance: "The acknowledgement of the source of the bread-labour doctrine: the Siberian exile peasant T. M. Bondarev, whose «Торжество земледельца» Tolstoy read in 1885 and championed. Note the saying pairs the man's law (labour) and the woman's law (childbearing) — the hinge into the final chapter."

  - id: wtmwd-text-09
    genre: work
    pssTom: 25
    pages: "ch. XXXVIII (the three answers)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "исполнять тот вечный, несомненный закон человека — трудом всего существа своего, не стыдясь никакого труда, бороться с природою для поддержания жизни своей и других людей."
    quoteEn: "(working English) to fulfil that eternal, indubitable law of man — to struggle with nature, with the labour of one's whole being, ashamed of no labour, for the support of one's own life and the lives of others."
    significance: "The third and decisive of the book's three answers to its title question (after: do not lie to yourself; renounce your supposed privilege and own your guilt). The positive doctrine — bread-labour as the eternal law of man."

  - id: wtmwd-text-10
    genre: work
    pssTom: 25
    pages: "ch. XL (the final chapter on women)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "Так называемый женский вопрос возник и мог возникнуть только среди мужчин, отступивших от закона настоящего труда."
    quoteEn: "(working English) The so-called woman question arose and could only have arisen among men who have fallen away from the law of real labour."
    significance: "The contested final chapter: as the man's law is labour, the woman's law is childbearing; Tolstoy reads the 'woman question' as a symptom of men's abandonment of real labour, and assigns the world's salvation to self-sacrificing mothers. The book's most reactionary-on-gender turn; to be presented factually and read critically."

  - id: wtmwd-text-11
    genre: work
    pssTom: 25
    pages: "ch. XL (close)"
    date: "1882–1886"
    extract: extracts/v25_182_411_Tak_chto_zhe.txt
    quoteRu: "Да, женщины-матери, в ваших руках, больше чем в чьих-нибудь других, спасение мира!"
    quoteEn: "(working English) Yes, women-mothers, in your hands, more than in anyone else's, lies the salvation of the world!"
    significance: "The final words of the book — salvation placed in the hands of mothers who knowingly submit to the 'law' of childbearing and self-sacrifice. The closing note that the standard scholarship reads as Tolstoy's retrograde gender doctrine."

  # — Composition-window diaries: PSS Tom 49 (1882–86; sparse) —
  - id: wtmwd-diary-01
    genre: diary
    pssTom: 49
    pages: "59"
    date: "1883-01-01 (OS)"
    extract: extracts/v49_059_059_1883_01_01.txt
    quoteRu: "Но собственность, ограждаемая насилием — городовым с пистолетом — это зло."
    quoteEn: "(working English) But property guarded by violence — by a policeman with a pistol — is an evil."
    significance: "The conceptual seed of the property/money argument, in the diary: Tolstoy distinguishes natural property (the spoon he carves) from property enforced by state violence — the distinction that structures the book's money chapters. Falls in the What I Believe writing year but is squarely WTMWD's theme."

  - id: wtmwd-diary-02
    genre: diary
    pssTom: 49
    pages: "122–123"
    date: "1884 (OS; aggregate, undated)"
    extract: extracts/v49_122_123_1884.txt
    quoteRu: "Цель одна — счастье, свое и семьи — зная, что счастье это в том, чтобы довольствоваться малым и делать добро другим."
    quoteEn: "(working English) The single aim — the happiness of oneself and one's family — knowing that this happiness lies in being content with little and doing good to others."
    significance: "The most direct compositional document in the diary record: Tolstoy's private estate-reform plan (hand the land to the peasants, reduce the household, teach the children manual labour alongside study, Sunday dinners for the poor) — working out privately what the book argues publicly in its bread-labour conclusion."

  - id: wtmwd-diary-03
    genre: diary
    pssTom: 49
    pages: "110"
    date: "1883-07-06 (OS)"
    extract: extracts/v49_110_110_1883_07_06.txt
    quoteRu: "В банках чистенькие, щелкают счетами и моча о губку, считают, постукивая, бумажки; а по дороге бабы навивают, мужики косят, скородят. Нищие и странники слабые, голодные идут."
    quoteEn: "(working English) In the banks, clean people click their abacuses and, wetting their fingers on a sponge, count the banknotes, tapping; while along the road women bind sheaves, men mow and harrow. Beggars and wanderers, weak and hungry, walk by."
    significance: "The visual and moral architecture of the division-of-labour critique, caught in the diary: idle money-counters set against labouring peasants set against starving wanderers."

  # — Composition-window & reception letters: PSS Tom 63 (1880–86), Tom 64 (1887–89) —
  - id: wtmwd-let-01
    genre: letter
    pssTom: 63
    pages: "193–196"
    date: "1884-12 (OS)"
    addressee: "V. I. Alekseev"
    extract: extracts/v63_286.txt
    quoteRu: "Я теперь печатаю статью (ее не пропустят ) о собственности"
    quoteEn: "(working English) I am now printing an article (it will not be passed) about property"
    significance: "The documentary bridge from What I Believe into this book, surfaced last session. December 1884: Tolstoy is sending the manuscript to the Russkaya Mysl printer, foreseeing the ban. The «статья о собственности» is What Then Must We Do?."

  - id: wtmwd-let-02
    genre: letter
    pssTom: 63
    pages: "193–196"
    date: "1884-12 (OS)"
    addressee: "V. I. Alekseev"
    extract: extracts/v63_286.txt
    quoteRu: "Собственность есть самый прочный и страшный соблазн — я постоянно о нем думаю и борюсь с его хитростями."
    quoteEn: "(working English) Property is the most durable and terrible temptation — I think about it constantly and struggle with its cunning."
    significance: "The same December 1884 letter to Alekseev states the book's property ethic in private: property as the most stubborn 'snare', Sutaev's radical position (no locks, no «мое и твое»), and the self-deception of denying property in theory while keeping its convenient forms."

  - id: wtmwd-let-03
    genre: letter
    pssTom: 63
    pages: "332–335"
    date: "1886-03 (OS; 1–20 March)"
    addressee: "T. M. Bondarev"
    extract: extracts/v63_486.txt
    quoteRu: "упомянул о том, что я почерпнул это не от ученых и мудрых мира сего, но от крестьянина Т. М. Бондарева."
    quoteEn: "(working English) [in the book I am writing on this same subject] I mentioned that I drew this not from the learned and wise of this world, but from the peasant T. M. Bondarev."
    significance: "Tolstoy's own confirmation, March 1886, that the book was still in progress and that it credits Bondarev by name as the source of its bread-labour doctrine — the educated world's wisdom set below a Siberian peasant's."

  - id: wtmwd-let-04
    genre: letter
    pssTom: 63
    pages: "332–335"
    date: "1886-03 (OS; 1–20 March)"
    addressee: "T. M. Bondarev"
    extract: extracts/v63_486.txt
    quoteRu: "Книжки мои не пропускают и жгут, и правительство считает меня врагом своим."
    quoteEn: "(working English) My little books are not passed and are burned, and the government considers me its enemy."
    significance: "The suppression from Tolstoy's own hand, in the same 1886 letter: for five years everything he writes on these matters is banned and burned. The censorship context in which the book could appear only in cut and dispersed forms."

  - id: wtmwd-let-05
    genre: letter
    pssTom: 63
    pages: "220–222"
    date: "1885-03-31 (OS)"
    addressee: "N. N. Strakhov"
    extract: extracts/v63_337.txt
    quoteRu: "Ведь я не дорожу тем, чтò есть моего в этой статье, […] тем, чтò в ней есть божеского, и мне радостно видеть, что я не так еще попортил его, чтобы нельзя было узнать."
    quoteEn: "(working English) For I do not value what is mine in this article, but what is God's in it, and I am glad to see that I have not yet spoiled it so far that it cannot be recognized."
    significance: "Early reception, March 1885: Strakhov had read the article (then being suppressed at Russkaya Mysl) and praised it while disagreeing with its conclusions. Tolstoy's reply — he holds not his own words but the divine truth in them — and the letter names Henry George, Theodore Parker and Giordano Bruno as his current reading."

