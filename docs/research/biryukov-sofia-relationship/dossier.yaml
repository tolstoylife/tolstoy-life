topic:
  slug: biryukov-sofia-relationship
  title: "Biryukov and Sofia: the dedication, the withheld lover, and the contested diaries"
  question: "The story behind Biryukov's warm 1908 dedication to Sofia in Vol II; whether it connects to his withholding a pre-marriage lover's name; the (strained) Biryukov–Sofia relationship; and the lines Sofia is said to have removed from the diary will-note, and how Biryukov handled it as biographer."
  date: 2026-05-31
  period: "1862; 1895; 1897–1910 (biography-making + the will/diaries crisis)"
  corpusSurface: "Tolstoy's letters to Biryukov (PSS 63–82); diaries (Toms 48, 53, 57, 58); diary publication-history apparatus; the reader's photographs of the Swedish Vol II; secondary scholarship."
  dateRange: "1862–1910"

evidence:
  # --- The dedication & afterword (Swedish Vol II; reader's photographs) ---
  - id: dedication-1908
    genre: biography
    pssTom: null
    pages: "Vol II front matter"
    date: 1908-01-11
    localPdf: null
    extract: extracts/birukoff-vol2-dedication-and-slutord-swedish.txt
    quoteRu: "Ni har ock afvärjt mycken ofärd från hans hufvud."
    quoteEn: "You have also averted much misfortune from his head. (working English) — source language Swedish."
    significance: "Biryukov, a Chertkov ally, opens Vol II (Kostroma, 11 Jan 1908) with an unguarded tribute to Sofia, mid-strife — the central puzzle of the dive."
    facsimile: null
  - id: slutord-archive-1908
    genre: biography
    pssTom: null
    pages: "Vol II p. 453"
    date: 1908-08-27
    localPdf: null
    extract: extracts/birukoff-vol2-dedication-and-slutord-swedish.txt
    quoteRu: "S. A. Tolstojs arkiv."
    quoteEn: "The archive of S. A. Tolstaya. (working English) — footnote sourcing the volume's closing quotation; documentary sign of Sofia's cooperation."
    significance: "The Slutord (Ivanskoye, 27 Aug 1908) closes Vol II on a document held in Sofia's archive — the dependence behind the dedication."
    facsimile: null

  # --- The withheld lover: Arsenyeva (Tolstoy's own disclosure) ---
  - id: arsenyeva-disclosure-1903
    genre: letter
    pssTom: 74
    pages: "319"
    date: 1903-11-27
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v74_319_P_I_Biryukovu.txt
    quoteRu: "это была Арсеньева Валерия. Она теперь жива, за Волковым была, живет в Париже."
    quoteEn: "that was Arsenyeva, Valeria. She is alive now, was married to Volkov, lives in Paris. (working English)"
    significance: "Tolstoy himself names Arsenyeva to his biographer as the most serious pre-marriage love — the candor came from Tolstoy, the suppression from Sofia."
    facsimile: null
  - id: arsenyeva-letters-packet-1903
    genre: letter
    pssTom: 74
    pages: "319"
    date: 1903-11-27
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v74_319_P_I_Biryukovu.txt
    quoteRu: "есть целая пачка моих писем к ней."
    quoteEn: "there is a whole packet of my letters to her. (working English)"
    significance: "Tolstoy actively supplies the Arsenyeva letters (via his daughter Tanya) — the very material Sofia would later veto."
    facsimile: null
  - id: arsenyeva-sofia-veto-1905
    genre: letter
    pssTom: 76
    pages: "65"
    date: 1905-10-18
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v76_065_P_I_Biryukovu.txt
    quoteRu: "протестовала против писем Арсеньевой."
    quoteEn: "[Sofia Andreevna] protested against the Arsenyeva letters. (working English)"
    significance: "The documentary hinge: Tolstoy's own statement that Sofia objected to the Arsenyeva letters — the suppression that kept the chapter out until Berlin 1921."
    facsimile: null

  # --- The biography collaboration & candor philosophy ---
  - id: biography-earliest-auth-1898
    genre: letter
    pssTom: 71
    pages: "5"
    date: 1898-01-09
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v71_005_P_I_Biryukovu.txt
    quoteRu: "Делайте скорее, не откладывая."
    quoteEn: "Do it quickly, without delay. (working English)"
    significance: "Earliest explicit authorization of the biography programme, written while Biryukov was in exile."
    facsimile: null
  - id: biography-pose-1901
    genre: letter
    pssTom: 73
    pages: "186"
    date: 1901-12-02
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v73_186_P_I_Biryukovu.txt
    quoteRu: "позировать вам и буду категорически отвечать на ваши вопросы."
    quoteEn: "[glad] to sit for you and will answer your questions categorically. (working English)"
    significance: "Opens the active Q&A collaboration on the biography."
    facsimile: null
  - id: candor-rousseau-1902
    genre: letter
    pssTom: 73
    pages: "315"
    date: 1902-08-20
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v73_315_P_I_Biryukovu.txt
    quoteRu: "правдивее даже, чем Руссо"
    quoteEn: "more truthful even than Rousseau. (working English)"
    significance: "The editorial philosophy: between self-whitewash and cynical exposure, aim to be more honest than Rousseau — the standard governing what the biography could include."
    facsimile: null
  - id: biography-form-1902
    genre: letter
    pssTom: 73
    pages: "256"
    date: 1902-05-19
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v73_256_P_I_Biryukovu.txt
    quoteRu: "нашел форму, в которой могу исполнить ваше желание"
    quoteEn: "found a form in which I can fulfil your wish. (working English)"
    significance: "The breakthrough of genuine consent to the biography."
    facsimile: null
  - id: biography-before-after-1902
    genre: letter
    pssTom: 73
    pages: "373"
    date: 1902-11-11
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v73_373_P_I_Biryukovu.txt
    quoteRu: "всю мерзость моей жизни до моего пробуждения"
    quoteEn: "all the vileness of my life before my awakening. (working English)"
    significance: "Commits to the before/after-awakening arc — the pre-1879 darkness included, not whitewashed."
    facsimile: null

  # --- The relationship arc with Sofia ---
  - id: sofia-loves-you-1897
    genre: letter
    pssTom: 70
    pages: "57"
    date: 1897-03-12
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v70_057_P_I_Biryukovu.txt
    quoteRu: "Софья Андреевна всё так же любит вас, чему я очень радуюсь."
    quoteEn: "Sofia Andreevna loves you just as before, at which I greatly rejoice. (working English)"
    significance: "The warm baseline of the relationship during Biryukov's exile years."
    facsimile: null
  - id: sofia-crisis-1910
    genre: letter
    pssTom: 82
    pages: "95"
    date: 1910-07-19
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v82_095_P_I_Biryukovu.txt
    quoteRu: "почти душевно больна — ненависть к Черткову, ревность к нему, и мне очень трудно."
    quoteEn: "almost mentally ill — hatred of Chertkov, jealousy of him, and it is very hard for me. (working English)"
    significance: "The relationship at its final-summer extreme, poured out to Biryukov three months before Tolstoy's flight."
    facsimile: null
  - id: biography-prosecution-1910
    genre: letter
    pssTom: 82
    pages: "172"
    date: 1910-09-01
    addressee: "P. I. Biryukov"
    localPdf: null
    extract: extracts/v82_172_P_I_Biryukovu.txt
    quoteRu: "Неужели только биография?"
    quoteEn: "Surely not just for the biography? (working English)"
    significance: "The biography itself triggers a criminal prosecution of Biryukov in 1910 — the censorship dimension, two months before Tolstoy's death."
    facsimile: null

  # --- The diaries as contested document (1862 → 1897) ---
  - id: bachelor-diaries-1862
    genre: diary
    pssTom: 48
    pages: "45"
    date: 1862-09-15
    localPdf: null
    extract: extracts/v48_045_045_1862_09_15_1.txt
    quoteRu: "не будет тайн для одного, а тайны для двух, она будет всё читать."
    quoteEn: "there will be no secrets for one, but secrets for two; she will read everything. (working English)"
    significance: "A week before the wedding — the willing surrender of the private self that the bachelor-diary handover to Sofia enacted; the root of the diary-as-contested-document theme."
    facsimile: null
  - id: sonya-reads-diary-1897
    genre: diary
    pssTom: 53
    pages: "132"
    date: 1897-02-04
    localPdf: null
    extract: extracts/v53_132_136_1897_02_04.txt
    quoteRu: "Соня без меня читала этот дневник, и ее очень огорчило то, что из него могут потом заключить о том, что она была нехорошей женой."
    quoteEn: "Sonya read this diary while I was away, and it grieved her greatly that from it people might later conclude she had been a bad wife. (working English)"
    significance: "The fear of the diary's posthumous verdict on her — the anxiety that would drive Sofia to seize the secret diary in 1910."
    facsimile: null

  # --- The 1895 testament (keystone) ---
  - id: testament-1895-diaries-clause
    genre: diary
    pssTom: 53
    pages: "14-18"
    date: 1895-03-27
    localPdf: "primary-sources/jubilee-edition/vol19/vol19.pdf"
    extract: extracts/v53_014_018_1895_03_27.txt
    quoteRu: "Чертков обещал мне еще при жизни моей сделать это."
    quoteEn: "Chertkov promised me, while I am still alive, to do this [destroy/prune the diaries]. (working English)"
    significance: "Keystone: the testamentary diary entry assigns the diaries' pruning to Chertkov — the seed of the 1910 custody war."
    facsimile: extracts/keystone-1895-testament.png
  - id: testament-1895-copyright-clause
    genre: diary
    pssTom: 53
    pages: "14-18"
    date: 1895-03-27
    localPdf: "primary-sources/jubilee-edition/vol19/vol19.pdf"
    extract: extracts/v53_014_018_1895_03_27.txt
    quoteRu: "отказаться от авторского права."
    quoteEn: "to renounce the author's right. (working English)"
    significance: "The copyright-renunciation clause of the 1895 testament — the material Biryukov (its named translator) printed; the prize Sofia fought to keep."
    facsimile: extracts/keystone-1895-testament.png

  # --- The 1910 will crisis (Diary for myself alone; reconstructed from TEI reg) ---
  - id: will-invalid-senile-1910
    genre: diary
    pssTom: 58
    pages: "137"
    date: 1910-09-16
    localPdf: "primary-sources/jubilee-edition/vol24/vol24.pdf"
    extract: extracts/v58_137_137_1910_09_16.txt
    quoteRu: "завещание, если есть таковое."
    quoteEn: "[to make my will invalid,] if such a will exists. (working English) — reconstructed from TEI reg, cross-checked vs facsimile."
    significance: "Tolstoy records Sofia's plan to have him declared senile so as to void the will — the 1910 endgame."
    facsimile: extracts/keystone-1910-diary.png
  - id: diary-seized-1910
    genre: diary
    pssTom: 58
    pages: "141"
    date: 1910-10-13
    localPdf: "primary-sources/jubilee-edition/vol24/vol24.pdf"
    extract: extracts/v58_141_141_1910_10_13.txt
    quoteRu: "нашла и унесла мой дневник маленький."
    quoteEn: "[she] found and carried off my little diary. (working English) — reconstructed from TEI reg, cross-checked vs facsimile."
    significance: "The documented act of Sofia 'removing' a diary — the seizure of the secret notebook over fear of the copyright will; not an excision of will-lines from the 1895 note."
    facsimile: extracts/keystone-1910-diary.png

