scholarship:
  summary: >
    The conventional view treats Biryukov's biography as the "voluminous and reverential" authorized
    life (Bartlett 2010) and the 1910 catastrophe as "fundamentally about the struggle for control of
    his diaries" between Sofia and the Chertkov/Alexandra side (Meek, LRB 2010). The dive mostly
    confirms and extends this, with one correction to the reader's premise about Sofia removing
    will-lines.
  triangulation:
    - evidenceRef: dedication-1908
      conventionalView: "The biography is reverential; Biryukov used Sofia's archive and thanked her."
      relation: extends
      source: "tolstoy-lit.ru; Russian Wikipedia (Бирюков); Bartlett 2010"
    - evidenceRef: sofia-loves-you-1897
      conventionalView: "Sofia was hostile to the Tolstoyans."
      relation: complicates
      source: "Bartlett 2010 (Sofia tolerated the meek Biryukov specifically)"
    - evidenceRef: arsenyeva-sofia-veto-1905
      conventionalView: "The Arsenyeva chapter was suppressed in Sofia's lifetime, restored Berlin 1921."
      relation: extends
      source: "PSS apparatus; Tolstoi's Love Letters (Hogarth 1923) front matter; Aldanov 1923"
    - evidenceRef: testament-1895-copyright-clause
      conventionalView: "Tolstoy renounced copyright; Biryukov reproduced the testament."
      relation: confirms
      source: "Birukoff trans. of the testament (Ybarra 1922); Bartlett 2010 (1891 public renunciation)"
    - evidenceRef: diary-seized-1910
      conventionalView: "Sofia removed/excised will-lines from the diary note."
      relation: contradicts
      source: "PSS Tom 53/58 apparatus (the 1895 break is authorial; the cuts are Chertkov's 1916 ed.; Sofia's act was the 1910 diary seizure)"

contradictions:
  - claim: "The «.....» in the 1895 testament marks a line removed about the will."
    correction: "It is Tolstoy's own trailing-off (literal dots in the <p>, no editorial gap); the one deletion there (his daughters' names) is also his own."
    evidenceRef: testament-1895-diaries-clause
  - claim: "Sofia removed will-lines from the 1895 diary note."
    correction: "No such excision is documented. Sofia's documented acts are the Arsenyeva-letters veto and the 1910 seizure of the secret diary; the diaries' will/copyright cuts were Chertkov's (1916 Sytin edition, 'с многими купюрами')."
    evidenceRef: diary-seized-1910
  - claim: "The 1895 testament names Strakhov among the executors."
    correction: "The diary-notebook text does name Strakhov, but on the fair copy his name was struck (with 'умер' added) after his 1896 death; the version Biryukov translated names wife + Chertkov + daughters."
    evidenceRef: testament-1895-diaries-clause

