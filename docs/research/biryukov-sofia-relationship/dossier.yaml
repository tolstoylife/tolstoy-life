  - item: "Tom 58 (1910) quotations reconstructed from TEI <reg> readings (extract_tei.py drops pre-reform <choice> pairs); cross-checked vs facsimile but not PDF-collated."
    phase: 2
    why: "Byte-fidelity for ingestion should rest on a PDF collation, not the TEI reg alone. Tooling gap: extract_tei.py needs a --choice mode for pre-reform volumes."
  - item: "Vault transliteration divergence: dive uses 'Biryukov'/'Sofia'; vault files are 'Pavel Birukoff.md'/'Sophia Tolstaya.md'. wikilinkTarget points at the existing files."
    phase: 4
    why: "Surfaced during verification; worth a project-wide naming decision before more cross-links accrue."

