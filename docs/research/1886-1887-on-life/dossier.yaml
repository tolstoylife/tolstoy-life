topic:
  slug: 1886-1887-on-life
  title: "On Life (О жизни)"
  question: >-
    Document On Life as a work across the local Tolstoy corpus — the philosophical
    capstone of the Prophet period and the metaphysics beneath the social ethic of
    What Then Must We Do?. Its genesis in Tolstoy's near-fatal summer-1886 leg
    illness and the reply-letter to A. K. Dieterichs on life and death; the diary
    that drafts its whole argument in June 1886, months before that letter; its
    growth through the working title «О жизни и смерти» into the 14 March 1887
    lecture «Понятие жизни» read to N. Ya. Grot's Moscow Psychological Society, and
    then into the book; what the text argues (the fundamental contradiction of the
    animal personality that seeks a good it cannot keep; the world-teachers' shared
    definitions of life that the Pharisees and scribes hide; reason — разум — as the
    law of human life; the renunciation of the animal personality; love as the one
    rational activity of true life and the abolition of the contradiction between
    selves; and death not as destruction but as entry into a new relation to the
    world — «нет смерти»); its seven redactions and the proofs Grot held; the 1888
    Mamontov first edition banned and destroyed by the Holy Synod; its dispersed
    publication (the «Неделя» 1889 partial, the Geneva and Christchurch editions)
    and its translation lineage (S. A. Tolstaya's French De la vie; Hapgood's
    English Life) — grounded in Tolstoy's own words, the Jubilee-Edition apparatus,
    the composition-window diaries and letters, and the project's prior dives.
  date: "2026-06-06"
  period: "Prophet period (post-1880); composition 1886–1887 (Old Style); genesis summer–autumn 1886, finished Aug 1887, printed Jan 1888"
  corpusSurface: "PSS Tom 26 (work «О жизни» pp. 313–442; the «Понятие жизни» lecture stenogram pp. 881–885; variants pp. 578–634 and the «Неделя» 1889 last-chapters variants pp. 451–456; Chertkov's simplified «Об истинной жизни» pp. 885–926; commentary pp. 748–844); diaries Tom 49 (1886–87); letters Tom 64 (1887–89) and Tom 63 tail"
  dateRange: "1886 (genesis: illness + Dieterichs letter; June-1886 diary draft) – 1903 (Christchurch «Свободное слово» complete edition); 1888 first (banned) Russian edition; 1889 first legal Russian appearance («Неделя», partial) and French De la vie; 1888 English (Hapgood)"

# ── Evidence ledger (primary; byte-faithful) ────────────────────────────────
# extract paths are relative to this file's directory.
evidence:

  # — The work's own text: «О жизни», PSS Tom 26, pp. 313–442 —
  - id: onlife-text-01
    genre: work
    pssTom: 26
    pages: "313 (Вступление)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Жизнь есть та мельница, которую хочет исследовать человек. Мельница нужна для того, чтобы она хорошо молола, жизнь нужна только затем, чтобы она была хорошая."
    quoteEn: "(working English) Life is the mill that man wishes to investigate. The mill is needed in order that it should grind well; life is needed only in order that it should be good."
    significance: "The introduction's governing parable: the miller who, having learned a little mechanics, ends by studying the river instead of the milling, and convinces himself the river is the mill. Science studies where life comes from («отчего») instead of how to live well («как») — and so loses the only question that gives the word 'life' its meaning."

  - id: onlife-text-02
    genre: work
    pssTom: 26
    pages: "324 (гл. I)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Живет всякий человек только для того, чтобы ему было хорошо, для своего блага."
    quoteEn: "(working English) Every man lives only in order that it may be well with him, for his own good."
    significance: "The opening axiom of ch. I, 'The fundamental contradiction of human life': life is the striving for one's own good — but the animal personality that seeks that good is surrounded by other beings each seeking the same, and is itself decaying toward death, so its good is impossible. This contradiction is the engine of the whole book."

  - id: onlife-text-03
    genre: work
    pssTom: 26
    pages: "326–327 (гл. II)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "«Жизнь — это подчинение разуму, дающее благо человеку», сказали стоики. «Жизнь — это любовь к Богу и ближнему, дающая благо человеку», сказал Христос, включая в свое определение все предшествующие."
    quoteEn: "(working English) 'Life is submission to reason, which gives man his good,' said the Stoics. 'Life is love of God and of one's neighbour, which gives man his good,' said Christ, including in his definition all that came before."
    significance: "The list of the world-teachers' definitions of life that resolve the contradiction (Confucius, the Brahmins, Buddha, Lao-Tzu, Hebrew wisdom, the Stoics, Christ). On Life is not a private mysticism but a claim to restate a perennial cross-traditional teaching that the 'Pharisees and scribes' (church and materialist science) hide."

  - id: onlife-text-04
    genre: work
    pssTom: 26
    pages: "347 (гл. X)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Разум для человека тот закон, по которому совершается его жизнь"
    quoteEn: "(working English) Reason is for man the law by which his life is accomplished"
    significance: "The hinge of the book (ch. X, 'Reason is the law by which man's life must be accomplished'). Reason (разум) is not a faculty but the law of human life — as organic law governs the plant and physical law the heavenly bodies — with the one difference that man must himself enact it. This is the primary-source answer to the 'woolly mysticism' framing: On Life makes reason, not feeling, the law of life."

  - id: onlife-text-05
    genre: work
    pssTom: 26
    pages: "363 (гл. XV)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Отречение от блага животной личности есть закон жизни человеческой."
    quoteEn: "(working English) The renunciation of the good of the animal personality is the law of human life."
    significance: "The book's central imperative (ch. XV). Renunciation is not heroism or merit but the unavoidable condition of human life: the animal personality is constantly perishing, so to locate life in it is contradiction and suffering; true life begins only when its good is renounced."

  - id: onlife-text-06
    genre: work
    pssTom: 26
    pages: "365 (гл. XVI)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Животная личность для человека — это лопата, которая дана разумному существу для того, чтобы ею копать и, копая, тупить ее и точить, тратить, а не отчищать и хранить."
    quoteEn: "(working English) The animal personality is for man a spade, given to a rational being so that he should dig with it and, in digging, blunt and whet it, wear it out — not polish and preserve it."
    significance: "Ch. XVI, 'The animal personality is the instrument of life.' The body is not an obstacle to life but its tool, to be spent, not hoarded — sealed with the Gospel paradox «И кто хочет жизнь свою сберечь, тот потеряет ее» (he who would save his life shall lose it)."

  - id: onlife-text-07
    genre: work
    pssTom: 26
    pages: "381 (гл. XXII)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "отрицательные философы нашего времени ( Шопенгауэр, Гартман), отрицающие жизнь и все-таки остающиеся в ней"
    quoteEn: "(working English) the negative philosophers of our time (Schopenhauer, Hartmann), who deny life and yet remain in it"
    significance: "Decisive against the standard 'On Life is warmed-over Schopenhauer' reading: Tolstoy names Schopenhauer and Hartmann as the pessimists he is refuting. He grants their diagnosis (the animal personality's good is impossible) but rejects their conclusion (denial of life / suicide), answering it with love. On Life is positioned against pessimism, not as its restatement."

  - id: onlife-text-08
    genre: work
    pssTom: 26
    pages: "381 (гл. XXII)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Любовь есть единственная разумная деятельность человека."
    quoteEn: "(working English) Love is the only rational activity of man."
    significance: "The pivot from the metaphysics to the ethic (ch. XXII): once reason has shown the impossibility of the personality's good, the one activity left open — the 'key made only to this lock' — is love. Love is not sentiment here but the rational consequence of the whole argument."

  - id: onlife-text-09
    genre: work
    pssTom: 26
    pages: "392 (гл. XXV)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "И нет иной любви, как той, чтобы положить душу свою за други свои. Любовь — только тогда любовь, когда она есть жертва собой."
    quoteEn: "(working English) And there is no other love than to lay down one's soul for one's friends. Love is love only when it is the sacrifice of oneself."
    significance: "Ch. XXV, 'Love is the single and complete activity of true life.' Love is defined as self-sacrifice — the mother feeding her child with her own body, the labourer wearing his body out for others — not as preference for chosen people (which Tolstoy treats as the 'wild stock' on which true love is grafted)."

  - id: onlife-text-10
    genre: work
    pssTom: 26
    pages: "392 (гл. XXV)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Жив только тот, кто любит."
    quoteEn: "(working English) Only he who loves is alive."
    significance: "The compression of the whole book: true life IS love (after 1 John, which Tolstoy quotes around it). Life and love are the same thing, set against the 'living death' of the personality that does not love."

  - id: onlife-text-11
    genre: work
    pssTom: 26
    pages: "398 (гл. XXVII)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "«Нет смерти», говорит людям голос истины."
    quoteEn: "(working English) 'There is no death,' the voice of truth says to men."
    significance: "The opening of the death movement (ch. XXVII, 'The fear of death is only the consciousness of the unresolved contradiction of life'). The fear of death is not fear of death — which man cannot know — but the consciousness that one is not living the true life one ought to. To the man who lives by reason and love there is no death; bodily death only destroys the spatial body and the temporal consciousness, not one's 'special relation to the world.'"

  - id: onlife-text-12
    genre: work
    pssTom: 26
    pages: "409 (гл. XXX)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Он, по преданию, говорил только: братья, любите друг друга!"
    quoteEn: "(working English) He, by tradition, said only: brothers, love one another!"
    significance: "From ch. XXX ('Life is a relation to the world. The movement of life is the establishment of a new, higher relation, and so death is entry into a new relation'): the aged John the Theologian, fallen into second childhood, able only to repeat 'love one another' — the figure of a man in whom the animal existence has been wholly consumed by a new relation to the world that no longer fits inside bodily life."

  - id: onlife-text-13
    genre: work
    pssTom: 26
    pages: "434 (Заключение)"
    date: "1886–1887"
    extract: extracts/v26_313_442_O_zhizni.txt
    quoteRu: "Жизнь человека есть стремление к благу, и то, к чему он стремится, то и дано ему."
    quoteEn: "(working English) Man's life is a striving for the good, and that toward which he strives is given to him."
    significance: "The conclusion's frame (it opens and closes on this sentence), sealed with Matthew 11:28–30 ('Come unto me all ye that labour…'): death and suffering are visible only to the man who takes the law of his animal existence for the law of his life; for the man who lives by his own law there is neither death nor suffering."

  # — The genesis proto-text: «Понятие жизни», the 14 Mar 1887 lecture stenogram, PSS Tom 26 pp. 881–885 —
  # NB: a press stenogram ("по стенографическим записям", Novoe Vremya No. 3973, 22 Mar 1887),
  # printed as PSS Appendix 1 — the reported lecture, not Tolstoy's polished prose; byte-faithful to the extract.
  - id: onlife-ponjatie-01
    genre: work
    pssTom: 26
    pages: "881–885"
    date: "1887-03-14 (OS; lecture)"
    extract: extracts/v26_881_885_Ponjatie_zhizni.txt
    quoteRu: "Одно «я» говорит: «Я хочу жить, жить вечно»."
    quoteEn: "(working English) One 'I' says: 'I want to live, to live forever.'"
    significance: "From the lecture stenogram: the two warring selves — the animal 'I' that wants to live forever and the reasoning 'I' that knows it must soon die. The contradiction stated in the proto-text that became chs. I and VI–VIII of the book."

  - id: onlife-ponjatie-02
    genre: work
    pssTom: 26
    pages: "881–885"
    date: "1887-03-14 (OS; lecture)"
    extract: extracts/v26_881_885_Ponjatie_zhizni.txt
    quoteRu: "И потому всякий человек всегда движется от одного предела к другому, т. е. живет. Это-то движение и есть сама жизнь."
    quoteEn: "(working English) And therefore every man always moves from the one limit to the other, that is, lives. This movement is life itself."
    significance: "The lecture's definition of life as movement between two limits — total absorption in the personality (least life) and total renunciation of it for the infinite world (most life). The dynamic image of life that the book's chs. XIV–XV unfold; preceded in the stenogram by the Bismarck-and-his-cook parable (both equally vain before eternity if reason lights their activity)."

  # — Composition-window diaries: PSS Tom 49 (1886–87) —
  - id: onlife-diary-01
    genre: diary
    pssTom: 49
    pages: "127–129"
    date: "1886-06-19 (OS)"
    extract: extracts/v49_127_129_1886_06_19.txt
    quoteRu: "Но разум есть в человеке. Он-то и уничтожает это противоречие."
    quoteEn: "(working English) But reason is in man. It is precisely this that abolishes the contradiction."
    significance: "The single most important genesis witness: a 19 June 1886 diary entry that drafts the whole argument of On Life — the contradiction of egoism abolished by reason-love, the seed-not-tree image, timelessness — written THREE MONTHS BEFORE the September-1886 Dieterichs letter the commentary names as the work's seed. The book's metaphysic is already complete in the diary."

  - id: onlife-diary-02
    genre: diary
    pssTom: 49
    pages: "127–129"
    date: "1886-06-19 (OS)"
    extract: extracts/v49_127_129_1886_06_19.txt
    quoteRu: "Бессмертно только то, что не я. Разум — любовь — Бог — природа."
    quoteEn: "(working English) Immortal is only that which is not-I. Reason — love — God — nature."
    significance: "The same 19 June 1886 entry's closing identification of reason, love, God and nature as the one immortal thing — the equation the book spends 35 chapters unfolding (reason as the law of life; love as its activity; the not-I as what survives death)."

  - id: onlife-diary-03
    genre: diary
    pssTom: 49
    pages: "124"
    date: "1886-05-25 (OS)"
    extract: extracts/v49_124_124_1886_05_25.txt
    quoteRu: "Смерть сон. Зачем бояться сна?"
    quoteEn: "(working English) Death is sleep. Why fear sleep?"
    significance: "The death-as-sleep argument (the book's chs. XXVIII–XXIX, where the daily loss of consciousness in sleep is the model for bodily death) already in the diary in May 1886, before the work began. Confirms the death theme preceded the Dieterichs letter."

  - id: onlife-diary-04
    genre: diary
    pssTom: 49
    pages: "129"
    date: "1887-02-03 (OS)"
    extract: extracts/v49_129_129_1887_02_03.txt
    quoteRu: "Разум решает только основной вопрос как."
    quoteEn: "(working English) Reason answers only the basic question: how."
    significance: "From February 1887, while the work was in active composition: reason is not given to answer 'why?' and 'whence?' (the metaphysical questions science chases) but only 'how to live?' — and the answer is 'blessedly' (блаженно). The mill-parable thesis stated privately in the diary."

  - id: onlife-diary-05
    genre: diary
    pssTom: 49
    pages: "129"
    date: "1886-10-18 (OS)"
    extract: extracts/v49_129_129_1886_10_18.txt
    quoteRu: "Так же странно и невероятно показалось бы зародышу, что будущая жизнь зародыша будет та сложная деятельность моего тела."
    quoteEn: "(working English) It would seem just as strange and incredible to an embryo that the embryo's future life would be the complex activity of my body."
    significance: "October 1886, exactly while the reply-letter to Dieterichs was turning into the book: the embryo analogy for the life of the dead continuing in the world — the argument of ch. XXXI. The diary tracks the work's growth in real time."

  # — Composition & reception letters: PSS Tom 64 (1887–88) —
  - id: onlife-let-01
    genre: letter
    pssTom: 64
    pages: "27–28"
    date: "1887-03-24 (OS)"
    addressee: "N. L. Ozmidov"
    extract: extracts/v64_039_N_L_Ozmidovu.txt
    quoteRu: "жизнь есть совсем не та путаница и страдания, которые мы себе представляем под этим словом, а нечто очень простое, ясное, легкое и всегда радостное."
    quoteEn: "(working English) life is not at all the tangle and suffering we imagine under that word, but something very simple, clear, light, and always joyful."
    significance: "Ten days after the Psychological-Society lecture, Tolstoy states the book's intent to Ozmidov: he has been writing for over a month 'on what life is' and hopes to show, simply and clearly, that life is something joyful. The author's own gloss on the work's purpose — against any reading of it as gloom."

  - id: onlife-let-02
    genre: letter
    pssTom: 64
    pages: "112–113"
    date: "1887-09/10 (OS)"
    addressee: "V. I. Alekseev"
    extract: extracts/v64_148_V_I_Alekseevu.txt
    quoteRu: "Я начал с заглавием о жизни и смерти, но когда кончил, то вычеркнул слова «и смерти», потому что слова эти потеряли свой смысл."
    quoteEn: "(working English) I began with the title 'On Life and Death,' but when I finished I struck out the words 'and death,' because those words had lost their meaning."
    significance: "Tolstoy's own account of the title change: the working title «О жизни и смерти» became «О жизни» because, on the book's own argument, death is nothing — the words 'and death' lost their sense. The same letter has him pre-empting the charge his friends will make — «страшное слово: мистицизм?» (the dreadful word: mysticism?) — which he rejects."

  - id: onlife-let-03
    genre: letter
    pssTom: 64
    pages: "138"
    date: "1888-01-24 (OS)"
    addressee: "N. N. Strakhov"
    extract: extracts/v64_181_N_N_Straxovu.txt
    quoteRu: "Книга «о жизни» всё в духовной цензуре. Едва ли пропустят."
    quoteEn: "(working English) The book 'On Life' is still in the spiritual censorship. They will hardly pass it."
    significance: "January 1888: the printed book is held in the ecclesiastical (spiritual) censorship and Tolstoy foresees the ban. Three months later the Synod ordered all 600 copies surrendered and destroyed. The censorship verdict from the author's own hand, mid-process."

