# ── Scholarship (secondary layer — Phase 3) ─────────────────────────────────
scholarship:
  summary: >-
    English-language scholarship treats On Life as Tolstoy's most sustained
    philosophical statement — the systematic metaphysic beneath the religious
    turn, written after his near-fatal summer-1886 injury and turning a
    meditation on death into a treatise on life, reason, love and the overcoming
    of pessimism (the framing of the modern critical edition, Medzhibovskaya &
    Denner, Northwestern UP, 2019, which prints the «Понятие жизни» talk and
    contemporary responses; and of Gustafson's Resident and Stranger, 1986,
    which reads it as the core of Tolstoy's metaphysics of life). Two received
    framings recur and both are worth reading critically against the primary
    text. The first is that On Life is a woolly mysticism: the primary record
    pushes back hard — Tolstoy makes reason (разум), not feeling, the law of life
    (ch. X), titles a chapter on the body as the 'instrument of life,' and the
    Holy Synod banned the book precisely for elevating «единственно и
    исключительно человеческий разум» over the word of God; Soina (in the
    English-language reception) reads it as rational ethics in a Stoic-and-early-
    Christian lineage, not mysticism. The second is that the book is a restatement
    of Schopenhauer or of Buddhist/Eastern pessimism: Tolstoy names Schopenhauer
    and Hartmann in ch. XXII as the 'negative philosophers' he is refuting,
    granting their diagnosis and rejecting their conclusion in favour of love.
    Contemporary Russian reception was philosophical, not only ecclesiastical:
    Grot and the Moscow Psychological Society midwifed the work; Strakhov compared
    it to Fichte; Prince D. N. Tsertelev gave a sympathetic account (Russkoe
    obozrenie, 1890) and Prof. A. A. Kozlov a polemical one (Voprosy filosofii,
    1890) — both prompted by S. A. Tolstaya's French De la vie. What the corpus
    adds and the biographical literature underplays is the precise genesis: the
    19 June 1886 diary already drafts the whole argument, months before the
    Dieterichs letter the apparatus names as the seed; and the work's deep,
    documented dependence on N. Ya. Grot and the Psychological Society for both
    its public form and its proofs.
  triangulation:
    - evidenceRef: onlife-diary-01
      conventionalView: "On Life grew out of Tolstoy's summer-1886 illness, beginning as a meditation on death prompted by A. K. Dieterichs's letter (Medzhibovskaya & Denner 2019; the PSS commentary)."
      relation: extends
      source: "Medzhibovskaya & Denner, On Life: A Critical Edition (Northwestern UP, 2019); PSS Tom 26 commentary (Gusev). The corpus shows the whole argument already drafted in the 19 June 1886 diary, before both the illness's worst and the September-1886 Dieterichs letter — the genesis is earlier and more internal than the reply-letter account implies."
    - evidenceRef: onlife-text-04
      conventionalView: "On Life is Tolstoy's mystical or religious meditation on the meaning of life and immortality."
      relation: contradicts
      source: "popular framing (Goodreads; The Marginalian); against it, the primary text makes разум the law of life (ch. X), and Soina (Ted K Archive trans.) reads On Life as rational ethics, not mysticism — as did the Synod, which banned it for exalting human reason over dogma."
    - evidenceRef: onlife-text-07
      conventionalView: "On Life restates Schopenhauerian / Buddhist pessimism about the suffering of existence."
      relation: contradicts
      source: "general 'Tolstoy and Schopenhauer' reception (e.g. McLaughlin; Brill CASS 2014 on War and Peace); the primary text names Schopenhauer and Hartmann as the pessimists Tolstoy refutes — he accepts their diagnosis of the personality and answers their conclusion with love."
    - evidenceRef: onlife-text-08
      conventionalView: "Tolstoy's ethic of love is sentimental / a religious feeling."
      relation: complicates
      source: "popular reception; the primary text defines love as «единственная разумная деятельность человека» — a rational consequence of the metaphysic, and explicitly NOT preference or feeling (ch. XXIII–XXIV), which the love-anthology readings flatten."
    - evidenceRef: onlife-ponjatie-01
      conventionalView: "On Life was presented in an early version at the Moscow Psychological Society (March 1887)."
      relation: confirms
      source: "Medzhibovskaya & Denner 2019 (which prints 'The Concept of Life: Tolstoy's Talk at the Moscow Psychological Society'); the corpus supplies the «Понятие жизни» stenogram and, via the commentary, Grot's central role in both the lecture and the proofs."
    - evidenceRef: onlife-let-03
      conventionalView: "On Life was banned by the religious censorship."
      relation: extends
      source: "standard biography (Simmons 1946; Bartlett 2011); the corpus + commentary supply the mechanism and date — the Moscow Spiritual Censorship Committee's report to the Synod (25 Jan 1888) and the Synod's 5 April 1888 order to destroy all 600 copies (Apostolov, Synod file No. 2264) — usually given only in passing."

