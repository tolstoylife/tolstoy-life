# ── Coverage ledger (surfaces × status) ─────────────────────────────────────
coverage:
  - surface: "Genesis & composition"
    status: covered
    note: "Triply grounded: the summer-1886 illness and the A. K. Dieterichs reply-letter (commentary); the 19 June / 25 May / 18 Oct 1886 and 3 Feb 1887 diaries (which draft the argument before and during the letter); and the Grot / Moscow Psychological Society lecture (14 March 1887) with the Ozmidov, Alekseev and Strakhov letters. The reply-letter → «О жизни и смерти» → «Понятие жизни» lecture → book chronology reconstructed from the apparatus."
  - surface: "What the work says"
    status: covered
    note: "Deep structural read of the introduction, all 35 chapters, conclusion and 3 addenda (Tolstoy's own «Обзор содержания по главам» used as the spine); keystone passages (mill parable; the fundamental contradiction; the world-teachers; reason as the law of life; renunciation; the animal personality as instrument; the refutation of Schopenhauer/Hartmann; love as the only rational activity; «нет смерти»; death as a new relation; the conclusion) extracted byte-faithful."
  - surface: "Redactions & textual history"
    status: partial
    note: "The seven redactions (incl. the heavy 'proof redaction' of Aug–Dec 1887) and the title change are summarized from the commentary; the 1.2 MB variants file (Tom 26 pp. 578–634) and the «Неделя» variants (pp. 451–456) were not collated. The base text is the 1888 edition."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "1888 Mamontov first edition (Часть 13) banned and destroyed by the Synod (5 Apr 1888); first legal Russian partial in «Неделя» 1889; French De la vie (S. A. Tolstaya & Tastevin, Paris 1889); English Life (Hapgood, NY 1888); Geneva (Elpidine) 1891; Christchurch («Свободное слово») 1903; Biryukov 1913. Danish/Czech/German/Italian translations noted."
  - surface: "Reception & afterlife (Russian society + Church)"
    status: covered
    note: "Church: the Censorship Committee verdict and the Synod ban (with Archbishop Nikanor's letter). Society/philosophy: the Psychological-Society debate (Astafyev, Bugaev), Strakhov's Fichte comparison, Tsertelev's sympathetic account (Russkoe obozrenie 1890) and Kozlov's polemic (Voprosy filosofii 1890) — all from the commentary. Wider lay/working-class reception (the responses the critical edition collects) only sketched."
  - surface: "Place in the cluster"
    status: covered
    note: "The metaphysical capstone of the Prophet sequence — the philosophy of life and death beneath the social ethic of What Then Must We Do?; cross-linked to the prior dives."
  - surface: "The author's later verdict"
    status: partial
    note: "Tolstoy's 19 March 1889 diary verdict on the French De la vie («очень показалось плохо-искусственно, хотя и не лживо») is recorded via the commentary; his later explicit judgments on the book itself were not separately swept."
  - surface: "Visual & manuscript record"
    status: covered
    note: "Medium sweep: 7 PD images cached (keystone = Repin's 1887 Tolstoy; portraits of Grot, Strakhov, Chertkov, A. K. Dieterichs and S. A. Tolstaya; Ge's 1884 Tolstoy). Not openly available: a title-page facsimile of the banned 1888 edition (only 3 copies survive, RGB/GTM) and of the French De la vie (1889) — both logged to request."

contradictions:
  - claim: "The PSS commentary names A. K. Dieterichs's September-1886 letter on death as the 'immediate instigator' of On Life — i.e. the work began as Tolstoy's reply to it."
    correction: "The corpus shows the argument already fully drafted in the 19 June 1886 diary (reason abolishing the contradiction of egoism; immortality as the not-I; the seed-not-tree image; God/nature beyond time) — before the illness's worst and the September letter. The Dieterichs letter is the occasion that turned a standing meditation into a written work, not the origin of its thought."
    evidenceRef: onlife-diary-01

