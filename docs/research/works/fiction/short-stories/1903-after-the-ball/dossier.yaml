topic:
  slug: 1903-after-the-ball
  title: "After the Ball (После бала) — a 1903 work-subject dive"
  question: >-
    What does the corpus show about Tolstoy's 1903 story «После бала» — its
    Kishinev-commission genesis, its real prototypes, the redaction history that
    moved its ending from complicity to non-participation, and its posthumous
    reception — and is the story really about «случай» (chance), as its frame asserts?
  date: 2026-06-12
  period: "Prophet period (post-1880); written 1903, published posthumously 1911"
  corpusSurface: >-
    PSS Tom 34 — the story (pp. 116–125), the planned/variant material
    (pp. 484–490), and the two commentary apparatuses («История писания и
    печатания» pp. 550–551, «Описание рукописей» pp. 551–553); PSS Tom 54 (the
    1903 diary — the 9 June conception, the 9 and 20 August completion notes);
    PSS Tom 74 (the 1903 letters to Sholom Aleichem). Composition window: a first
    draft in two days (6–7 Aug 1903), polished to 20 Aug 1903, at Yasnaya Polyana.
  dateRange: "1903-06-09 to 1903-08-20 (composition); 1911 (first publication)"

# ─────────────────────────────────────────────────────────────────────────────
# EVIDENCE LEDGER — flat citation list. Every quoteRu is verbatim in its extract.
# ─────────────────────────────────────────────────────────────────────────────
evidence:

  # ---- The frame's thesis ----
  - id: E01
    genre: works
    pssTom: 34
    pages: "116"
    date: "1903"
    addressee: null
    localPdf: "primary-sources/jubilee-edition/vol03/vol03.pdf (p.156 = PSS p.116)"
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: 'что всё дело в среде, что среда заедает. А я думаю, что всё дело в случае.'
    quoteEn: '(working English) that it is all a matter of environment, that the environment devours one. But I think it is all a matter of chance.'
    significance: >-
      The opening frame. Ivan Vasilyevich rejects the company's social-determinist
      thesis («среда заедает») with his own: «всё дело в случае». This is the
      surface claim the dive's marquee tests.
    facsimile: extracts/v34_116_Posle_bala_p116_facsimile-156.png

  # ---- The «по закону» / suede-glove motif: ballroom ----
  - id: E02
    genre: works
    pssTom: 34
    pages: "121"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: 'натянув замшевую перчатку на правую руку, — «надо всё по закону», — улыбаясь сказал он'
    quoteEn: '(working English) drawing a suede glove onto his right hand, "everything must be done according to the rules," he said, smiling.'
    significance: >-
      The colonel before the mazurka. «Надо всё по закону» — by the rules — is the
      hinge phrase: the same suede glove and the same appeal to «закон» return at
      the flogging (E05). The ballroom and the gauntlet are one man's single code.

  # ---- The centrepiece: the flogging ----
  - id: E03
    genre: works
    pssTom: 34
    pages: "123"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: 'Он не говорил, а всхлипывал: «Братцы, помилосердуйте. Братцы, помилосердуйте». Но братцы не милосердовали'
    quoteEn: '(working English) He did not speak but sobbed: "Brothers, have mercy. Brothers, have mercy." But the brothers showed no mercy.'
    significance: >-
      The Tatar deserter run through the gauntlet. The centrepiece of the story's
      second half — the scene Tolstoy reworked hardest (E20).

  - id: E04
    genre: works
    pssTom: 34
    pages: "123"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: 'Это было что-то такое пестрое, мокрое, красное, неестественное, что я не поверил, чтобы это было тело человека.'
    quoteEn: '(working English) It was something so mottled, wet, red, unnatural, that I could not believe it was the body of a man.'
    significance: >-
      The flogged man's back. The canonical defamiliarization («остранение»)
      passage cited in the Formalist reception (Shklovsky): the body made strange
      so the horror cannot be normalised.

  - id: E05
    genre: works
    pssTom: 34
    pages: "124"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: 'он своей сильной рукой в замшевой перчатке бил по лицу испуганного малорослого слабосильного солдата за то, что он недостаточно сильно опустил свою палку'
    quoteEn: '(working English) with his strong hand in its suede glove he struck the face of a frightened, undersized, weak soldier because he had not brought his stick down hard enough.'
    significance: >-
      The colonel strikes a soldier for striking too softly («Будешь мазать?
      Будешь?»). The suede glove of the mazurka bow (E02) is the same glove — the
      loving father and the torturer are the one figure, the dive's central image.

  # ---- The moral epistemology ----
  - id: E06
    genre: works
    pssTom: 34
    pages: "124"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: '«Очевидно, он что-то знает такое, чего я не знаю», думал я про полковника. «Если бы я знал то, что он знает, я бы понимал и то, что я видел, и это не мучило бы меня»'
    quoteEn: '(working English) "Evidently he knows something that I do not know," I thought about the colonel. "If I knew what he knows, I would understand what I saw, and it would not torment me."'
    significance: >-
      The story's moral epistemology: the narrator cannot find the «knowledge»
      that would justify the cruelty — and the failure to find it is the verdict.
      Conscience operates by an absence, not an argument.

  # ---- The published ending: non-participation ----
  - id: E07
    genre: works
    pssTom: 34
    pages: "125"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: 'не мог поступить в военную службу, как хотел прежде, и не только не служил в военной, но нигде не служил и никуда, как видите, не годился'
    quoteEn: '(working English) I could not enter military service, as I had meant to before, and not only did not serve in the army but served nowhere at all and, as you see, was good for nothing.'
    significance: >-
      The published ending. Ivan's whole life turns on the refusal to participate —
      «никуда не годился» framed not as failure but as the only honest response.
      The keystone for the non-participation reading; contrast the variants E10–E11.

  - id: E08
    genre: works
    pssTom: 34
    pages: "125"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_116_125_Posle_bala.txt
    quoteRu: 'Любовь? Любовь с этого дня пошла на убыль.'
    quoteEn: '(working English) Love? Love began to fade from that day on.'
    significance: >-
      The love-plot resolution: the romance does not end in a quarrel but
      withers, poisoned by what the lover saw in the beloved's father.

  # ---- Variants: the ending evolution (keystone) ----
  - id: E09
    genre: works
    pssTom: 34
    pages: "487"
    date: "1903-08-06"
    addressee: null
    localPdf: null
    extract: extracts/v34_484_490_Posle_bala_Varianty.txt
    quoteRu: 'Это было ужасно, но если оно делалось, значит оно было необходимо, оно было стихийно вроде как грозы, бури, и спорить с этим нельзя было'
    quoteEn: '(working English) It was terrible, but if it was being done, then it was necessary; it was elemental, like a thunderstorm or a gale, and one could not argue with it.'
    significance: >-
      The first draft's ending («Дочь и отец», 6 Aug 1903). The narrator SUBMITS
      to the cruelty as elemental necessity — there is no withdrawal, no
      «не годился». The moral refusal is not yet in the story.

  - id: E10
    genre: works
    pssTom: 34
    pages: "489"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_484_490_Posle_bala_Varianty.txt
    quoteRu: 'после университета поступил в военную службу и хотя и не сумел выработать в себе такой же твердости, как у полковника, как видите, вышел в отставку поручиком, все-таки считал, что военная служба хорошее дело'
    quoteEn: '(working English) after university I entered military service, and although I did not manage to develop the same firmness as the colonel, I retired, as you see, a lieutenant — and still considered military service a good thing.'
    significance: >-
      Variant № 4 (рук. № 5). In this draft the narrator DOES enter the army and
      thinks it a good thing — the exact opposite of the published «нигде не служил».
      Resolves the scholarship's open question (did Ivan ever serve?): yes, in two
      drafts. The textual proof that the non-participation ending was built in late.

  - id: E11
    genre: works
    pssTom: 34
    pages: "490"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_484_490_Posle_bala_Varianty.txt
    quoteRu: 'я поступил, как хотел, в военную службу и старался выработать в себе такое же твердое сознание своего долга, — я так называл это, — как у полковника, и отчасти достигал этого. И только к старости теперь понял весь ужас того, что я видел и что сам делал'
    quoteEn: '(working English) I entered military service, as I had wished, and tried to develop in myself the same firm sense of duty — so I called it — as the colonel had, and partly succeeded. And only now, in old age, have I understood the full horror of what I saw and what I myself did.'
    significance: >-
      Variant № 5 (рук. № 6). Here the narrator becomes LIKE the colonel and grasps
      the horror only in old age — «что я видел и что сам делал». The complicity
      ending. The published version cuts both this and E10: Tolstoy moved the verdict
      from late guilt to immediate refusal.

  # ---- Genesis: the Kishinev commission ----
  - id: E12
    genre: letters
    pssTom: 74
    pages: "118-119"
    date: "1903-05-06"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    localPdf: null
    extract: extracts/v74_144_RabinovichuSHolom_Alejxemu_6may.txt
    quoteRu: 'виновник не только кишиневских ужасов, но всего того разлада, который поселяется в некоторой малой части — и не народной — русского населения[…]одно правительство. К сожалению, этого-то я не могу сказать в русском легальном издании.'
    quoteEn: '(working English) the culprit not only of the Kishinev horrors but of all the discord that settles into a certain small — and not popular — part of the Russian population … is the government alone. Unfortunately, this is just what I cannot say in a legal Russian publication.'
    significance: >-
      The genesis seed, shared with the 1903 folk-tales cluster. Replying to Sholom
      Aleichem's request for the Kishinev-pogrom relief almanac, Tolstoy names the
      state as the true culprit — and names the censorship limit that kept «После
      бала» unprintable in his lifetime. The story is the «eврейский сборник» idea
      that could not be encoded enough to print.

  - id: E13
    genre: diaries
    pssTom: 54
    pages: "177"
    date: "1903-06-09"
    addressee: null
    localPdf: null
    extract: extracts/v54_177_178_1903_06_09.txt
    quoteRu: 'Немного подвигаюсь в Николае Павловиче. Задумал три новые вещи. Умирать пора, а я задумываю. 1) Рассказ о бале и сквозь строй'
    quoteEn: '(working English) Making a little progress on Nikolai Pavlovich [Nicholas I, i.e. Hadji Murat]. Conceived three new things. It is time to die, and I am conceiving things. 1) A story about a ball and running the gauntlet.'
    significance: >-
      The conception, 9 June 1903 — and in the same breath as «Николае Павловиче»,
      the Nicholas I material of Hadji Murat. The two Nicholas-era works on military
      cruelty were alive in Tolstoy's mind on the same day. The story's working idea
      is already its whole structure: a ball + the gauntlet.

  - id: E14
    genre: comments
    pssTom: 34
    pages: "550"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_550_551_Istorija.txt
    quoteRu: 'веселый бал в Казани, влюблен в Корейшу красавицу, дочь воинского начальника[…]танцую с нею; ее красавец старик-отец ласково берет ее и идет мазурку. И на утро после влюбленной бессонной ночи звуки барабана и сквозь строй гонит татарина, и воинский начальник велит больней бить. (Очень бы хорошо)'
    quoteEn: '(working English) a gay ball in Kazan, in love with a Koreysh beauty, daughter of the military commander … I dance with her; her handsome old father tenderly takes her and dances the mazurka. And in the morning, after the love-struck sleepless night, the sounds of a drum, and he drives a Tatar through the gauntlet, and the military commander orders them to beat harder. (Would be very good.)'
    significance: >-
      Tolstoy's own sujet note (quoted in the commentary from the 1903 notebook).
      Names the real ground: Kazan, the Koreysh family, the military commander as
      both dancing father and flogging officer. The author-stated core of the
      prototype.

  - id: E15
    genre: comments
    pssTom: 34
    pages: "550"
    date: "1886"
    addressee: null
    localPdf: null
    extract: extracts/v34_550_551_Istorija.txt
    quoteRu: 'я знал одного такого, который накануне с красавицей дочерью танцовал мазурку на бале и уезжал раньше, чтобы на завтра рано утром распорядиться прогонянием на смерть сквозь строй бежавшего солдата татарина, засекал этого солдата до смерти и возвращался обедать в семью'
    quoteEn: '(working English) I knew one such man, who the evening before had danced the mazurka with his beautiful daughter at a ball and left early so as to give orders the next morning for a runaway Tatar soldier to be driven to death through the gauntlet — flogged the soldier to death and returned to dine with his family.'
    significance: >-
      The commentary's most important find: the whole plot of «После бала» is
      already in Tolstoy's 1886 essay «Николай Палкин» (PSS т. 26, с. 559),
      seventeen years earlier — a Kazan-period recollection. The story is a long-held
      memory finally written.

  - id: E16
    genre: comments
    pssTom: 34
    pages: "550"
    date: "1898-1899"
    addressee: null
    localPdf: null
    extract: extracts/v34_550_551_Istorija.txt
    quoteRu: 'Самой экзекуции Толстой, однако, не наблюдал. В 1898—1899 гг. он встретился в Москве с писателем И. Н. Захарьиным (Якуниным), который рассказал, как ему пришлось по наряду присутствовать при наказании солдата'
    quoteEn: '(working English) Tolstoy did not, however, witness the execution itself. In 1898–1899 he met in Moscow the writer I. N. Zakharyin (Yakunin), who told him how he had been ordered to attend the punishment of a soldier.'
    significance: >-
      Tolstoy never saw a gauntlet punishment. The second informant — Zakharyin-
      Yakunin, c. 1898–99 — supplied the eyewitness detail; Tolstoy urged him to
      write it («Вы непременно это напишите») and then wrote it himself.

  - id: E17
    genre: diaries
    pssTom: 54
    pages: "189"
    date: "1903-08-09"
    addressee: null
    localPdf: null
    extract: extracts/v54_189_189_1903_08_09.txt
    quoteRu: 'Написал в один день Дочь и отец. Не дурно. Сказки кончил.'
    quoteEn: '(working English) Wrote "Daughter and Father" in one day. Not bad. Finished the tales.'
    significance: >-
      9 Aug 1903. The first draft came in a single day — and in the same entry as
      «Сказки кончил», the three Kishinev tales: the story and the tales are the
      same midsummer's work.

  - id: E18
    genre: diaries
    pssTom: 54
    pages: "189"
    date: "1903-08-20"
    addressee: null
    localPdf: null
    extract: extracts/v54_189_189_1903_08_20.txt
    quoteRu: 'За то «А вы говорите» недурно.'
    quoteEn: '(working English) On the other hand, "But You Say" is not bad.'
    significance: >-
      20 Aug 1903 — the last copy's date. Tolstoy names the story by its then-title
      «А вы говорите» and judges it the better of the summer's work, even as he is
      «недоволен» with the tales. His own modest verdict.

  # ---- Manuscript / redaction history ----
  - id: E19
    genre: comments
    pssTom: 34
    pages: "551"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_551_553_Rukopisi.txt
    quoteRu: 'Первоначальное заглавие «А вы говорите» зачеркнуто Толстым и начато «Дочь»; затем и это слово зачеркнуто и надписано «После бала», с подзаголовком: «Рассказ».'
    quoteEn: '(working English) The original title "But You Say" was crossed out by Tolstoy and "Daughter" begun; then this word too was crossed out and "After the Ball" written in, with the subtitle "A Story".'
    significance: >-
      The title's path — «Дочь и отец» → «Отец и дочь» → «А вы говорите» → «Дочь»
      → «После бала» — across 12 manuscripts and 104 leaves. The final title shifts
      the centre of gravity from the father-daughter pair to the morning «после».

  - id: E20
    genre: comments
    pssTom: 34
    pages: "551"
    date: "1903"
    addressee: null
    localPdf: null
    extract: extracts/v34_550_551_Istorija.txt
    quoteRu: 'Особенно сильным переделкам подверглась вторая часть рассказа (сцена экзекуции), в первом наброске очень сжатая, и заключение. Однако окончательной отделки рассказ не получил и при жизни Толстого напечатан не был.'
    quoteEn: '(working English) The second part of the story (the execution scene) — very compressed in the first draft — and the conclusion underwent especially heavy reworking. The story did not, however, receive its final polish and was not printed in Tolstoy''s lifetime.'
    significance: >-
      The commentary's own account of where the labour went: the flogging scene and
      the ending. Confirms the variant evidence (E09–E11) and that the story was left
      essentially finished but unpolished, unpublished in his life.

  - id: E21
    genre: comments
    pssTom: 34
    pages: "551"
    date: "1911"
    addressee: null
    localPdf: null
    extract: extracts/v34_550_551_Istorija.txt
    quoteRu: 'Впервые рассказ «После бала» был напечатан в издании: «Посмертные художественные произведения Льва Николаевича Толстого под редакцией В. Черткова», I, М. 1911, стр. 117—128.'
    quoteEn: '(working English) The story "After the Ball" was first printed in the edition: "Posthumous Artistic Works of Lev Nikolaevich Tolstoy, edited by V. Chertkov," vol. I, Moscow, 1911, pp. 117–128.'
    significance: >-
      First publication: posthumous, 1911, in Chertkov's «Посмертные художественные
      произведения», vol. I. Published in Russia, but only after Tolstoy's death.

