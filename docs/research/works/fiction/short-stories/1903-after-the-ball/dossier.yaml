# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). Attribute, don't assert.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    English-language scholarship on «После бала» is thin and mostly pedagogical;
    the richest readings are Russian (Soviet curriculum + Formalist) and
    Zholkovsky's English/Russian structural work. The dominant frame is
    «composition by contrast» — the ball and the dawn flogging as a mirror —
    entrenched in the Soviet school curriculum as an anti-tsarist, anti-militarist
    classic (Trostnikov 1965, Zhdanov 1971, via Zholkovsky). Shklovsky's
    «остранение» (defamiliarization) is routinely illustrated by the flogged back
    «пестрое, мокрое, красное, неестественное» (E04). The prototype — brother
    Sergei Nikolaevich's Kazan courtship of Varvara Koreysh, the commander-father
    as both dancer and flogger — is multiply attributed in Russian biography and
    confirmed by the Tolstoy State Museum (2024). The «chance vs. environment»
    frame is widely read as a decoy installed only to be bypassed by the
    unmediated response of conscience; Zholkovsky reads Ivan's withdrawal as the
    «principled non-participation characteristic of late Tolstoy». No specific
    Eikhenbaum essay on the story was located (needsReview).
  triangulation:
    - evidenceRef: E07
      conventionalView: >-
        The opening «chance vs. environment» debate is the story's question; the
        Soviet reading takes the cruelty as systemically mandated by tsarism, with
        «случай» as Tolstoy's irony (it was a chance encounter, but what it reveals
        is not accidental). Ivan's response is read as recognition of systemic evil.
      relation: complicates
      source: "Trostnikov (1965); Zhdanov (1971), via Zholkovsky (USC Dornsife)"
    - evidenceRef: E07
      conventionalView: >-
        Zholkovsky reads Ivan's withdrawal («никуда не годился») not as paralysis
        but as principled non-complicity — «characteristic of late Tolstoy» — the
        frame performing the non-participation as a lived fact.
      relation: confirms
      source: "Zholkovsky, 'After the Ball' (USC Dornsife, English chapter)"
    - evidenceRef: E10
      conventionalView: >-
        Scholarship notes the ending was «значительно изменён и расширён» in
        revision and that a confessional «what I myself did» phrase was removed, but
        does not reach the specific earlier endings.
      relation: extends
      source: "obrazovaka.ru (creation-history synthesis); the variants are PSS т.34"
    - evidenceRef: E04
      conventionalView: >-
        The flogged back is the textbook «остранение» example; the story is taught
        as «контраст как основа композиции».
      relation: confirms
      source: "Shklovsky (defamiliarization), via Russian pedagogy; Odintsov (1969)"
    - evidenceRef: E15
      conventionalView: >-
        The prototype is brother Sergei Nikolaevich's Kazan romance with Varvara
        Koreysh; the commander-father was both the dancing father and the flogging
        officer.
      relation: confirms
      source: "Tolstoy State Museum (2024 exhibition); ru.wikipedia (Sergei Nikolaevich Tolstoy)"

