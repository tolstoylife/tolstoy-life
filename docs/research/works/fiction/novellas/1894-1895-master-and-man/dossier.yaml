    wikiType: character
    wikilinkTarget: "Vasily Brekhunov"
    vaultStatus: missing
    role: >-
      The master (хозяин): a second-guild merchant, church elder, innkeeper and grain
      dealer; the calculating acquirer who is transfigured by a substitutionary death.
      The principal/titular figure; the one the marquee turns on.
    sources: []
    evidenceRefs: [E1, E2, E3, E4, E6, E6b, E13]
    ingestionPriority: 1
    prototypes:
      - person: ""
        name: "(no single documented prototype)"
        basis: editorial
        certainty: conjectured
        note: >-
          The surname Брехунов derives from брехать (to lie, to bluster) — an authorial,
          characterising name. No single real prototype is documented; Brekhunov is a type
          drawn from the post-Emancipation provincial merchant world Tolstoy knew at
          Begichevka and around Tula. Do not assert a specific model.
        sourceId: ""
  - name: "Nikita"
    wikiType: character
    wikilinkTarget: "Nikita (Master and Man)"
    vaultStatus: missing
    role: >-
      The workman (работник): a 50-year-old peasant, a reformed drunk, paid half his
      worth and knowing it, who lives by surrender and is ready to die; the instrument
      of the master's salvation and the survivor of the storm.
    sources: []
    evidenceRefs: [E7, E8, E9, E11]
    ingestionPriority: 1
    prototypes:
      - person: ""
        name: "(no single documented prototype)"
        basis: editorial
        certainty: conjectured
        note: >-
          Drawn from the Yasnaya Polyana / Tula peasants Tolstoy knew; no single documented
          model. The figure of the equable, self-effacing peasant who has made peace with
          God recurs across the late fiction (cf. Platon Karataev) but Nikita is not a
          re-use of a named person. Marfa (his wife) folds into this page, not a standalone node.
        sourceId: ""

