topic:
  slug: 1894-1895-master-and-man
  title: "Master and Man (Хозяин и работник) — a novella-dive"
  question: >-
    Does Master and Man give narrative flesh to Tolstoy's doctrine of On Life
    (1887) — that true life is the renunciation of the separate "animal
    personality" (личность) for love — and does it make its boldest move by
    routing salvation through the master, the calculating exploiter Brekhunov,
    whose substitutionary death (he covers and warms his workman Nikita with his
    own body, and dying feels "он — Никита, а Никита — он") gives the treatise its
    flesh, while standing as a lived specimen of the "universal religious art"
    Tolstoy would theorise two years later in What Is Art? (1897–98)? Read the
    novella (conceived 6 Sept 1894, finished Jan 1895, published March 1895)
    against its composition and redaction record to test the three claims.
  date: 2026-06-10
  period: "Prophet period (post-1880); composed Sept 1894 – Feb 1895"
  corpusSurface: >-
    PSS Tom 29 (the novella pp. 3–46; Posrednik printed variant pp. 233–248;
    «Варианты» pp. 295–324 incl. the first rough redaction in full; «История
    писания и печатания» pp. 375–378; «Описание рукописей» pp. 378–380);
    composition-years diaries (Toms 52–53, Sept 1894 – Mar 1895) and letters
    (Toms 67–68 to Strakhov / Gurevich / Volynsky / Olsufyeva; Tom 84 to S. A.
    Tolstaya).
  dateRange: "1892–1895 (Begichevka seed to first publication)"

evidence:

  # ---------- THE TEXT (PSS Tom 29, main text, pp. 3–46) ----------
  - id: E1
    genre: work
    pssTom: 29
    pages: "3-46 (ch. IX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "ему кажется, что он — Никита, а Никита — он, и что жизнь его не в нем самом, а в Никите"
    quoteEn: "(working English) it seems to him that he is Nikita and Nikita is he, and that his life is not in himself but in Nikita"
    significance: >-
      The centrepiece. In the death-dream Brekhunov's separate self dissolves: his
      life is now located in the man he covers. This is On Life's thesis — that the
      boundary of the animal личность is the illusion, and true life is found in
      love for another — given narrative flesh. The marquee's first hypothesis (On
      Life given flesh) and its second (salvation through the exploiter) converge in
      this sentence.
    facsimile: ""
  - id: E2
    genre: work
    pssTom: 29
    pages: "3-46 (ch. IX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "«Жив Никита, значит жив и я», — с торжеством говорит он себе"
    quoteEn: "(working English) \"Nikita is alive, so I too am alive,\" he says to himself with triumph."
    significance: >-
      The self-dissolution stated as triumph, not loss. Brekhunov's survival is now
      conditional on Nikita's — the master's life routed through the man's. The word
      "с торжеством" (with triumph) marks a positive spiritual event, not a tragedy.
    facsimile: ""
  - id: E3
    genre: work
    pssTom: 29
    pages: "3-46 (ch. IX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "лег на него, покрывая его не только своей шубой, но и всем своим теплым, разгоряченным телом"
    quoteEn: "(working English) he lay on him, covering him not only with his fur coat but with his whole warm, heated body"
    significance: >-
      The substitutionary act, bodily and deliberate. The master makes himself the
      covering that keeps the workman alive — the хозяин becomes the servant of his
      работник. The marquee's second hypothesis (salvation routed through the
      exploiter, the master saving the man) in its literal gesture.
    facsimile: ""
  - id: E4
    genre: work
    pssTom: 29
    pages: "3-46 (ch. IX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "Не знал, так теперь знаю. Теперь уж без ошибки. Теперь знаю"
    quoteEn: "(working English) I did not know, so now I know. Now without mistake. Now I know."
    significance: >-
      Brekhunov's recognition, spoken about himself in the third person ("про Василья
      Брехунова") — the man who lived for acquisition sees, at the threshold, what
      his life was actually for. The instantaneous awakening On Life describes:
      rational consciousness breaking through where its preconditions had long
      accumulated unseen.
    facsimile: ""
  - id: E5
    genre: work
    pssTom: 29
    pages: "3-46 (ch. IX, closing image)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "лежащего под мертвым уже хозяином угревшегося Никиту"
    quoteEn: "(working English) Nikita, warmed, lying beneath the master who was now dead"
    significance: >-
      The closing tableau: the snow swirling over the dead master and the living,
      warmed man beneath him. The economic relation of the title is inverted in the
      final picture — the хозяин is the covering, the работник is alive under him.
    facsimile: ""
  - id: E6
    genre: work
    pssTom: 29
    pages: "3-46 (ch. I)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "И, говоря это, Василий Андреич был искренно уверен, что он благодетельствует Никите"
    quoteEn: "(working English) And, saying this, Vasily Andreich was sincerely convinced that he was a benefactor to Nikita."
    significance: >-
      The exploiter established at the outset, and the precise mechanism of the
      exploitation: self-deception. Brekhunov pays Nikita 40 roubles where the labour
      is worth 80, mostly in overpriced shop goods, and believes himself generous.
      The figure who is saved is introduced as the one who cheats — the asymmetry the
      marquee turns on.
    facsimile: ""
  - id: E6b
    genre: work
    pssTom: 29
    pages: "3-46 (ch. I)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "Василий Андреич платил Никите не 80 руб., сколько стоил такой работник, а рублей 40"
    quoteEn: "(working English) Vasily Andreich paid Nikita not 80 roubles, the worth of such a workman, but some 40"
    significance: >-
      The concrete ledger of the exploitation — half wages, paid in kind at the shop's
      inflated prices. Tolstoy grounds the master/man relation in exact economics
      before he dissolves it in the snow.
    facsimile: ""
  - id: E7
    genre: work
    pssTom: 29
    pages: "3-46 (ch. IX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "двух смертей не бывать, а одной не миновать"
    quoteEn: "(working English) there are not two deaths to die, and the one cannot be escaped"
    significance: >-
      Nikita's equanimity before death — the man who already lives by surrender ("видно
      и меня зовешь", he says, as if God is calling). The scholarship's "parallel
      salvation" reading rests here: Nikita does not need converting. The dive's
      asymmetry: it is the master, not the already-grounded peasant, who is transfigured.
    facsimile: ""
  - id: E8
    genre: work
    pssTom: 29
    pages: "3-46 (ch. VII)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "Известно, грехи. Да что же, разве я сам их на себя напустил?"
    quoteEn: "(working English) Of course, sins. But what of it — did I bring them on myself?"
    significance: >-
      Nikita's settled relation to his own failings (drink, the money drunk away,
      wrongs to his wife) — accepted without despair, "such, it seems, God made me."
      The unselfconscious faith Tolstoy sets against Brekhunov's calculating ego.
    facsimile: ""
  - id: E9
    genre: work
    pssTom: 29
    pages: "3-46 (ch. X)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v29_003_046_main-text.txt
    quoteRu: "умер, истинно радуясь тому, что избавляет своей смертью сына и сноху"
    quoteEn: "(working English) died, truly rejoicing that by his death he was relieving his son and daughter-in-law [of a burden]"
    significance: >-
      The coda: Nikita is rescued, crippled, lives twenty more years and dies content,
      "as he had wished, under the icons, a lighted candle in his hand." His good death
      mirrors Brekhunov's — the two are the same passage seen twice. Frames the
      Ivan-Ilyich diptych (a bad death and a good death).
    facsimile: ""

  # ---------- REDACTIONS (PSS Tom 29, «Варианты» pp. 295–324) ----------
  - id: E10
    genre: work
    pssTom: 29
    pages: "295-324 (Первая черновая редакция, рук. № 2)"
    date: "1894-09"
    addressee: ""
    localPdf: ""
    extract: extracts/v29_295_324_variants.txt
    quoteRu: "Он поднялся над всем миром."
    quoteEn: "(working English) He rose above the whole world."
    significance: >-
      KEYSTONE REDACTION. In the first rough redaction (6–13 Sept 1894) Brekhunov's
      awakening is solitary and self-regarding — "he rose above the whole world… he
      recognised in himself something so high, which in 40 years he had never once
      felt." It is NOT tied to saving Nikita. The substitutionary, other-directed
      salvation of the final text is absent here.
    facsimile: ""
  - id: E11
    genre: work
    pssTom: 29
    pages: "295-324 (Первая черновая редакция, рук. № 2)"
    date: "1894-09"
    addressee: ""
    localPdf: ""
    extract: extracts/v29_295_324_variants.txt
    quoteRu: "огляделся и в 100 саженях увидал, что чернеется, и пошел туда"
    quoteEn: "(working English) [Nikita] looked round and saw something dark some 100 sazhens off, and walked towards it — it was a village."
    significance: >-
      The first draft's ending: Brekhunov simply freezes, Nikita rolls the dead master
      off "как чурбан" (like a log) and walks to a village alone — survival, terse, with
      no merging of selves. The whole spiritual climax of the published novella did not
      yet exist. The story began as "рассказ о метели" (a blizzard story), not a parable
      of substitutionary death.
    facsimile: ""
  - id: E12
    genre: work
    pssTom: 29
    pages: "295-324 (вариант № 33, рук. № 11 — Severny Vestnik galley proofs)"
    date: "1895-02"
    addressee: ""
    localPdf: ""
    extract: extracts/v29_295_324_variants.txt
    quoteRu: "он Никита, а Никита — он"
    quoteEn: "(working English) he is Nikita, and Nikita is he"
    significance: >-
      The self-dissolution centrepiece (E1) reaches its final form only at the PROOF
      stage (рук. № 11, the Severny Vestnik galleys, Feb 1895) — variant № 33 carries
      "он Никита, а Никита — он… Жив Никита, значит я жив." The doctrinal heart of the
      story was the last thing Tolstoy wrote into it, matching the 6 Jan 1895 diary
      ("Теперь знаю, что сделать"). The marquee is thus grounded in compositional fact,
      not only in interpretation.
    facsimile: ""
  - id: E13
    genre: work
    pssTom: 29
    pages: "295-324 (вариант № 18, рук. № 4)"
    date: "1894-12"
    addressee: ""
    localPdf: ""
    extract: extracts/v29_295_324_variants.txt
    quoteRu: "А на что ему жить? Какая его жизнь"
    quoteEn: "(working English) And what is there for him to live for? What kind of life is his?"
    significance: >-
      In the December redactions the master's contempt for the workman's life is made
      explicit ("Nikita guessed right, didn't drink, maybe he'll survive — but what's
      there for him to live for?"). Sharpening the contempt first deepens the eventual
      reversal: the man whose life Brekhunov dismisses becomes the one through whom he
      finds his own.
    facsimile: ""
  - id: E14
    genre: work
    pssTom: 29
    pages: "295-324 (вариант № 26, рук. № 5)"
    date: "1894-12"
    addressee: ""
    localPdf: ""
    extract: extracts/v29_295_324_variants.txt
    quoteRu: "он перенес на Никиту"
    quoteEn: "(working English) he transferred [the terror of death] onto Nikita"
    significance: >-
      The hinge of the conversion as Tolstoy built it across the redactions: Brekhunov's
      own terror of death is "transferred onto Nikita," and pity for the man displaces
      fear for the self. The mechanism of salvation is the redirection of the same
      egoistic energy toward another — the move scholarship (Saunders) notes formally.
    facsimile: ""

  # ---------- GENESIS — diaries (PSS Toms 52–53) ----------
  - id: E15
    genre: diary
    pssTom: 52
    pages: "137-138"
    date: "1894-09-06"
    addressee: ""
    localPdf: ""
    extract: extracts/_diaries_composition.txt
    quoteRu: "продумал очень живой художественный рассказ о хозяине и работнике"
    quoteEn: "(working English) thought through a very vivid artistic story about a master and a workman"
    significance: >-
      The conception, arrived in bed after a bad night — the story is named from its
      relation (хозяин и работник) at the very first. The genesis is dated to the day.
    facsimile: ""
  - id: E16
    genre: diary
    pssTom: 52
    pages: "141"
    date: "1894-09-14"
    addressee: ""
    localPdf: ""
    extract: extracts/_diaries_composition.txt
    quoteRu: "написал рассказ о метели. Нехорошо"
    quoteEn: "(working English) wrote the story about the blizzard. Not good."
    significance: >-
      The first full drafting session, and the story named for its setting — "a story
      about a blizzard." The self-verdict ("Нехорошо") is immediate and recurs through
      the whole composition.
    facsimile: ""
  - id: E17
    genre: diary
    pssTom: 52
    pages: "157-159"
    date: "1894-12-31"
    addressee: ""
    localPdf: ""
    extract: extracts/_diaries_composition.txt
    quoteRu: "Не знаю, хорошо ли. Довольно ничтожно"
    quoteEn: "(working English) I don't know if it is good. Rather insignificant."
    significance: >-
      After the Christmas-week revision surge. Tolstoy judges the very story that would
      sell 15,000 copies in four days "rather insignificant" — the tension between his
      verdict and the work's reception runs through the dive.
    facsimile: ""
  - id: E18
    genre: diary
    pssTom: 53
    pages: "2"
    date: "1895-01-03"
    addressee: ""
    localPdf: ""
    extract: extracts/_diaries_composition.txt
    quoteRu: "Стало порядочно по художественности, но по содержанию еще слабо"
    quoteEn: "(working English) It has become tolerable artistically, but in content it is still weak."
    significance: >-
      Tolstoy separates art from content — the form is coming right, the meaning is not
      yet there. Three days before the breakthrough that would supply the meaning (the
      substitutionary death).
    facsimile: ""
  - id: E19
    genre: diary
    pssTom: 53
    pages: "3-4"
    date: "1895-01-06"
    addressee: ""
    localPdf: ""
    extract: extracts/_diaries_composition.txt
    quoteRu: "Нет характера ни того, ни другого. Теперь знаю, что сделать"
    quoteEn: "(working English) There is no character in either one or the other. Now I know what to do."
    significance: >-
      THE BREAKTHROUGH, dated. After reading the story aloud at the Olsufyevs', Tolstoy
      finds neither the master nor the man has depth — "now I know what to do." The
      redaction record (E10–E12) shows what he did: fuse the two in the substitutionary
      death and the self-dissolution. The diary and the manuscripts agree.
    facsimile: ""
  - id: E22
    genre: diary
    pssTom: 53
    pages: "10"
    date: "1895-02-26"
    addressee: ""
    localPdf: ""
    extract: extracts/_diaries_composition.txt
    quoteRu: "Похоронили Ваничку"
    quoteEn: "(working English) We buried Vanichka."
    significance: >-
      Tolstoy's youngest son Ivan (Vanechka), aged six, died of scarlet fever on 23 Feb
      1895, as the final proofs were being dispatched. The diary line "terrible — no, not
      terrible, but great spiritual event" registers the grief and the effort to convert
      it into acceptance — the same movement the novella performs.
    facsimile: ""
  - id: E23
    genre: diary
    pssTom: 53
    pages: "10-13"
    date: "1895-03-12"
    addressee: ""
    localPdf: ""
    extract: extracts/_diaries_composition.txt
    quoteRu: "слышу со всех сторон похвалы, а мне не нравится"
    quoteEn: "(working English) I hear praise from all sides, but I do not like it"
    significance: >-
      The author's verdict against the reception, three weeks after Vanechka's death:
      praise everywhere, but he dislikes the work — "and yet, a feeling of petty, vain
      satisfaction." The candour is the diary's; the dive carries it as Tolstoy's own
      later verdict.
    facsimile: ""

  # ---------- GENESIS — letters (PSS Toms 68, 84) ----------
  - id: E20
    genre: letter
    pssTom: 68
    pages: "15-16"
    date: "1895-01-14"
    addressee: "N. N. Strakhov"
    localPdf: ""
    extract: extracts/_letters_composition.txt
    quoteRu: "Если вы скажете, что нехорошо, я нисколько не обижусь"
    quoteEn: "(working English) If you say it is no good, I shall not be in the least offended."
    significance: >-
      Sending the manuscript to Petersburg via Strakhov (carried by Baroness Meyendorf),
      Tolstoy hands his friend a veto and asks for blunt judgment — "whether my faculty
      has weakened." The anxiety of a man returning to fiction after years of treatises.
    facsimile: ""
  - id: E21
    genre: letter
    pssTom: 68
    pages: "32-33"
    date: "1895-02-14"
    addressee: "N. N. Strakhov (confidential postscript)"
    localPdf: ""
    extract: extracts/_letters_composition.txt
    quoteRu: "почти безумный припадок"
    quoteEn: "(working English) an almost insane fit [of jealousy of Gurevich]… She was close to suicide"
    significance: >-
      The most unguarded record of the publication crisis: S. A. Tolstaya, distressed
      that the story was given gratis to Severny Vestnik and seized by a baseless jealousy
      of its editor L. Ya. Gurevich, "was close to suicide." Tolstoy asks Strakhov to tear
      off and burn the postscript. The story's own blizzard runs parallel to the household's.
    facsimile: ""

scholarship:
  summary: >-
    Biographers (Troyat, Bartlett, Simmons, Wilson) and craft critics (Saunders,
    Deresiewicz) read Master and Man as Tolstoy's most artistically controlled late
    story and as a conversion tale: the greedy merchant Brekhunov dies saving his
    servant and "thereby saves his own soul," usually paired with The Death of Ivan
    Ilyich as a diptych on dying badly versus dying well. Gustafson's theological-realist
    framework ("emblematic realism") is the nearest scholarly instrument for reading the
    death-merging as a doctrinal proposition rather than sentiment. But three things the
    dive foregrounds sit below where the accessible scholarship stops: (1) the explicit
    grounding in On Life's vocabulary of личность-renunciation is noted only thematically,
    never traced to the treatise; (2) the soteriological asymmetry — that it is the
    exploiter who is saved, the already-grounded peasant the instrument — is named in
    passing (Deresiewicz, the church-reader Austin) but not argued; (3) the proto–What Is
    Art? reading (the story as a prior enactment of "universal religious art," its 15,000
    copies in four days the proof of infectious universality) is pointed at (Deresiewicz)
    but undeveloped. The popular biographies give disproportionate space to the publication
    drama (Sofia's breakdown, Vanechka's death), sometimes eclipsing the text.
  triangulation:
    - evidenceRef: E1
      conventionalView: >-
        Scholarship agrees the story dramatises Tolstoy's late religious philosophy
        (true life = living for others) and that Brekhunov's death is a positive
        spiritual event; the specific link to On Life (1887) and its личность argument
        is asserted thematically, not traced to the treatise.
      relation: extends
      source: "Gustafson 1986; Troyat 1965/1967; Deresiewicz 2010"
    - evidenceRef: E3
      conventionalView: >-
        The merchant's transformation from exploiter to saviour is universally noted,
        but read as PARALLEL salvation (Nikita "had known salvation all along";
        Brekhunov arrives at it). The asymmetry — Brekhunov saved in the full sense,
        Nikita the instrument — is at most implicit.
      relation: complicates
      source: "Deresiewicz 2010; Saunders 2021; Austin 2022"
    - evidenceRef: E12
      conventionalView: >-
        No scholar appears to use the redaction record to show that the
        self-dissolution / substitution was a late (proof-stage) addition; the
        composition history is treated as biographical drama, not as evidence for the
        reading of the death scene.
      relation: extends
      source: "(corpus; PSS Tom 29 «Варианты» / «История писания»)"
    - evidenceRef: E2
      conventionalView: >-
        The What Is Art? (1897–98) connection is noted as chronological proximity and
        thematic consistency; the claim that Master and Man is a PRIOR ENACTMENT of
        "universal religious art" in Tolstoy's technical sense (infecting the reader with
        brotherhood across class lines) is not made.
      relation: extends
      source: "Deresiewicz 2010; literariness.org"

