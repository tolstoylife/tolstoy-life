coverage:
  - surface: "Genesis & composition (work-mood + the people around the work)"
    status: covered
    note: "Heavy — 23 diary/letter quotes; the full named network; the Begichevka seed; the Olsufyev breakthrough."
  - surface: "What the work says (close-read of pivotal scenes)"
    status: covered
    note: "Centrepiece (the death-dream / self-dissolution) quoted in full; the exploiter opening, Nikita's equanimity, the deliberate covering, the coda all close-read."
  - surface: "Redactions & textual history"
    status: covered
    note: "The keystone finding — the substitutionary climax was a late (proof-stage) addition — fully evidenced from «Варианты» + «Описание рукописей»."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "March 1895, three simultaneous editions, 15,000 copies in four days, not censored; English translations 1895 (Beaman; Rapoport/Kenworthy; Maude)."
  - surface: "Reception & afterlife — Russian society & critics"
    status: partial
    note: "Popular phenomenon + the SAT/Gurevich crisis well-covered from the corpus; specific 1895 critical reviews (the Symbolist/Severny-Vestnik camp) thin — see needsReview. No church/Synod dimension (the work is not anti-clerical; the 1901 excommunication does not bear on it)."
  - surface: "Characters & prototypes"
    status: covered
    note: "Two titular characters routed (character + prototypes[]); twelve real people routed (person)."
  - surface: "Scholarly context"
    status: covered
    note: "Triangulated; English-first; the three marquee hypotheses each tested against the received view."
  - surface: "Visual & manuscript record"
    status: covered
    note: "13 PD images downloaded; the keystone 1895 portrait, the famine-relief seed, the Copeland frontispiece, Orlov's coeval peasant genre, and the principals' portraits."
  - surface: "Source-research sub-layer"
    status: not-covered
    note: "Not applicable — Master and Man is invented (seeded by a lived blizzard), not built from an archive. No «Список источников» layer (unlike Hadji Murat)."

contradictions:
  - claim: "The story's spiritual climax — Brekhunov saving Nikita by covering him, the two selves merging — was the original conception."
    correction: "The first rough redaction (рук. 2, Sept 1894) has only a solitary, self-regarding awakening and ends with Nikita walking to a village alone; the substitutionary death and the «он — Никита, а Никита — он» self-dissolution were built across the December–February redactions and reached final form only at the Severny Vestnik proof stage (вариант № 33, рук. 11)."
    evidenceRef: E10

notCovered:
  - "Variant-by-variant collation of all 33 printed «Варианты» (sampled, not collated — novel-mode policy)."
  - "The Posrednik printed text (pp. 233–248) vs the Severny Vestnik text — the 184-correction divergence not line-collated."
  - "Specific 1895 critical reviews from the Symbolist / Severny Vestnik circle (Merezhkovsky, Gippius) — named as a camp, individual reviews not retrieved."
  - "Wiener English facsimile (local archive-org PDF set) — not consulted; it is Wiener's Boston 1904 EN edition, not the Russian PSS."
  - "Film/stage adaptations beyond a note (Bernard Rose's Boxing Day, 2012; early Russian/Soviet films unconfirmed)."

needsReview:
  - item: "N. S. Leskov's reported reaction to Master and Man."
    phase: 3
    why: "Leskov died 5 March 1895 (the day of the Posrednik release), so any reaction was private and pre-publication; a documented Leskov notice could not be confirmed. Do not assert a Leskov endorsement without a source."
  - item: "The OS→NS date conversions in the workRecord (+12 days) and the dateWritingCompleted choice (final fair copy vs end of proof revision)."
    phase: 4
    why: "The corpus dates are Old Style; the works schema carries both. The +12-day NS values and the decision to date completion to the 14 Jan OS fair copy (proofs ran to ~23 Feb) should be confirmed by a human before applying to the record."
  - item: "relatedWorks ids and relationshipType vocabulary (the-death-of-ivan-ilyich / on-life / what-is-art)."
    phase: 4
    why: "The diptych with The Death of Ivan Ilyich is standard, but the controlled-vocabulary relationshipType values and the exact work ids must be checked against the works schema and live records before the proposal is applied."
  - item: "Character slugs / wikilink targets for Brekhunov and Nikita."
    phase: 4
    why: "No vault page exists; the proposed targets ('Vasily Brekhunov', 'Nikita (Master and Man)') are the dive's suggestion — the ingestion step should settle the canonical filename/disambiguation."

