scholarship:
  summary: >-
    Unusually for a Tolstoy work, the mainstream already leads with pride/vainglory,
    not lust, and frequently quotes Tolstoy's own "the main battle is with human
    glory" line to do so (Britannica frames the work as a man who finds "sainthood
    cannot be consciously sought, potentially Tolstoy's self-critique"; Edmund
    Wilson, NYRB 1971, reads it as spiritual pride). So the marquee's contest is
    about grounding, not reading. The mainstream supplies a hagiographic
    source-genealogy (the finger-cutting from a hermit legend, the healer-figure
    from the type of Serafim of Sarov, the monastic milieu from Optina/Ambrose) —
    treated here as contrast, and unverified against the PSS.
  triangulation:
    - evidenceRef: E11
      conventionalView: "The pride/vainglory reading is the received English-language reading (Britannica; Wilson 1971), argued thematically from the finished text."
      relation: extends
      source: "Wilson, Edmund (1971), NYRB; Encyclopædia Britannica, 'Father Sergius'"
    - evidenceRef: E13
