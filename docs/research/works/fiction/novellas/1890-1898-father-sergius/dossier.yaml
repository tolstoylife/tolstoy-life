topic:
  slug: 1890-1898-father-sergius
  title: "Father Sergius (Отец Сергий) — a novel-dive"
  question: >-
    Does Father Sergius dramatize Tolstoy's thesis that the pursuit of holiness
    and asceticism is itself a form of pride — слава людская, the craving for human
    esteem — and that humble, anonymous service (Pashenka) is the real thing? Read
    the novella (begun 1890, finished 1898 for the Doukhobor emigration, published
    posthumously 1911) against its composition record to test that claim, which
    Tolstoy stated himself in the 1891 letters.
  date: 2026-06-09
  period: "Prophet period (post-1880); composed 1890–1898"
  corpusSurface: >-
    PSS Tom 31 (the novella pp. 5–46; plans & variants pp. 203–210; «История
    писания и печатания» pp. 257–267; «Описание рукописей» pp. 267–269);
    composition-years diaries (Toms 51–53) and letters (Toms 65, 72, 87).
  dateRange: "1889–1911 (conception to first publication)"

evidence:
  # --- The text (PSS Tom 31, ch. refs from the close-read) ---
  - id: E1
    genre: work
    pssTom: 31
    pages: "5-46 (ch. VII)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v31_005_046_main-text.txt
    quoteRu: "Очисти от скверны славы людской, обуревающей меня"
    quoteEn: "(working English) Cleanse me of the defilement of human glory that besets me"
    significance: >-
      The centrepiece. Father Sergius names the marquee thesis in Tolstoy's own
      vocabulary (слава людская) in a prayer — and falls with Marya within the
      hour. The diagnosis and the failure are deliberately adjacent.
    facsimile: ""
  - id: E2
    genre: work
    pssTom: 31
    pages: "5-46 (ch. VII)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v31_005_046_main-text.txt
    quoteRu: "дьявол подменил всю его деятельность для бога деятельностью для людей."
    quoteEn: "(working English) the devil had substituted, for all his activity for God, activity for people."
    significance: >-
      The hollowing-out, stated by the narrator just before the centrepiece prayer:
      service-for-people has replaced service-for-God.
    facsimile: ""
  - id: E3
    genre: work
    pssTom: 31
    pages: "5-46 (ch. V)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v31_005_046_main-text.txt
    quoteRu: "положил указательный палец левой руки на чурбан, взмахнул топором и ударил по нем ниже второго сустава."
    quoteEn: "(working English) laid the index finger of his left hand on the chopping-block, swung the axe, and struck below the second joint."
    significance: >-
      The finger-cutting — the famous self-mutilation to resist Makovkina. A
      victory of will, not of humility; ch. VII shows the will eventually losing.
    facsimile: ""
  - id: E4
    genre: work
    pssTom: 31
    pages: "5-46 (ch. VIII)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v31_005_046_main-text.txt
    quoteRu: "Я жил для людей под предлогом бога, она живет для бога, воображая, что она живет для людей."
    quoteEn: "(working English) I lived for people under the pretext of God; she lives for God, imagining that she lives for people."
    significance: >-
      The thesis from the positive side: Pashenka's unselfconscious service is the
      holiness Sergius counterfeited. She thinks herself a failure — which is what
      makes her holiness real.
    facsimile: ""
  - id: E5
    genre: work
    pssTom: 31
    pages: "5-46 (ch. VIII)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v31_005_046_main-text.txt
    quoteRu: "Чем меньше имело значения мнение людей, тем сильнее чувствовался бог."
    quoteEn: "(working English) The less the opinion of people mattered, the more strongly God was felt."
    significance: >-
      The resolution (the 1898 chapter). Anonymity, not asceticism, is the cure —
      the marquee's positive pole.
    facsimile: ""
  - id: E6
    genre: work
    pssTom: 31
    pages: "5-46 (ch. II)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v31_005_046_main-text.txt
    quoteRu: "была за год тому назад любовницей Николая Павловича"
    quoteEn: "(working English) had been, a year before, the mistress of Nikolai Pavlovich"
    significance: >-
      The plot hinge: the fiancée's past affair with the Tsar shatters Kasatsky and
      drives the renunciation. Nicholas I appears as himself (routes person); this
      strand was cut by censorship in 1911.
    facsimile: ""
  - id: E7
    genre: work
    pssTom: 31
    pages: "203-210 (variant № 7)"
    date: "1891"
    addressee: ""
    localPdf: ""
    extract: extracts/v31_203_210_variants.txt
    quoteRu: "взмахнув топором, ударил ее вдоль головы ниже темени"
    quoteEn: "(working English) swinging the axe, struck her along the head below the crown"
    significance: >-
      The keystone variant. In the 1891 redaction Sergius murders Marya with an
      axe and flees to drown himself; the 1898 reworking cut the killing entirely
      (killer → broken man from whom recovery is possible).
    facsimile: ""
  # --- Diaries (composition-years witness sweep) ---
  - id: E8
    genre: diary
    pssTom: 51
    pages: "47-48"
    date: "1890-06-06"
    addressee: ""
    localPdf: ""
    extract: extracts/v51_047_048_1890_06_08.txt
    quoteRu: "Начал Отца Сергия и вдумался в него. Весь интерес — психологические стадии, которые он проходит."
    quoteEn: "(working English) Started Father Sergius and thought my way into it. The whole interest is the psychological stages he passes through."
    significance: >-
      The conception note: Tolstoy locates the work's interest in interior
      development, not plot — the seed of the eight-chapter ladder. (In the 8 June
      bundle file; no standalone 06_06 entry exists.)
    facsimile: ""
  - id: E9
    genre: diary
    pssTom: 51
    pages: "78"
    date: "1890-08-18"
    addressee: ""
    localPdf: ""
    extract: extracts/v51_078_078_1890_08_18.txt
    quoteRu: "Соблазн славы людской и прославления, — т. е. обман, чтоб скрыть веру."
    quoteEn: "(working English) The temptation of human glory and of being glorified — i.e. a deceit, to hide faith."
    significance: >-
      The marquee stated in the diary before the letters: слава людская is the
      work's true subject.
    facsimile: ""
  - id: E10
    genre: diary
    pssTom: 51
    pages: "98-101"
    date: "1890-10-31"
    addressee: ""
    localPdf: ""
    extract: extracts/v51_098_101_1890_10_31.txt
    quoteRu: "Большое самолюбие ( Кузмннский и Урусов ), честолюбие и потребность безукоризненности."
    quoteEn: "(working English) Great self-love (Kuzminsky and Urusov), ambition, and a need for impeccability."
    significance: >-
      The author-stated prototype: Sergius's defining trait grounded in two real
      men — A. M. Kuzminsky (brother-in-law) and L. D. Urusov (Tula vice-governor).
      (TEI renders "Кузмннский," a source slip.)
    facsimile: ""
  # --- Letters (the marquee) ---
  - id: E11
    genre: letter
    pssTom: 87
    pages: "71-73"
    date: "1891-02-16"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v87_280_a16.txt
    quoteRu: "Борьба с похотью тут эпизод, или скорее одна ступень, главная борьба с другим — с славой людской."
    quoteEn: "(working English) The struggle with lust is here an episode, or rather one step; the main struggle is with something else — with human glory."
    significance: >-
      The defining external statement of the dive. Against the carnal-temptation
      reading, Tolstoy tells his closest collaborator that lust is one rung and the
      true subject is слава людская.
    facsimile: ""
  - id: E12
    genre: letter
    pssTom: 65
    pages: "268-269"
    date: "1891-03-14"
    addressee: "V. P. Zolotarev"
    localPdf: ""
    extract: extracts/v65_254_V_P_Zolotarevu.txt
    quoteRu: "только в падении, осрамившись навеки перед людьми, он нашел настоящую опору в боге. Надо опустить руки, чтобы стать на ноги."
    quoteEn: "(working English) only in the fall, having disgraced himself forever before people, did he find a true support in God. One must lower the hands in order to stand on the feet."
    significance: >-
      The second marquee statement — the clearest single-sentence account of the
      novella's redemptive logic.
    facsimile: ""
  # --- The 1898 completion (the Doukhobors) ---
  - id: E13
    genre: diary
    pssTom: 53
    pages: "203-204"
    date: "1898-07-17"
    addressee: ""
    localPdf: ""
    extract: extracts/v53_203_204_1898_07_17.txt
    quoteRu: "Решил отдать свои повести: Воскресение и Отец Сергий в печать для духоборов."
    quoteEn: "(working English) Decided to give my novellas — Resurrection and Father Sergius — to print, for the Doukhobors."
    significance: >-
      The completion decision: the novella exists in finished form because of the
      Doukhobor emigration to Canada. The same entry the Doukhobors dive cites for
      Resurrection names this novella beside it.
    facsimile: ""
  - id: E14
    genre: diary
    pssTom: 53
    pages: "203-204"
    date: "1898-07-17"
    addressee: ""
    localPdf: ""
    extract: extracts/v53_203_204_1898_07_17.txt
    quoteRu: "Успокоение только тогда, когда человек живет для служения Богу среди людей."
    quoteEn: "(working English) Peace comes only when a man lives to serve God among people."
    significance: >-
      The resolved meaning of ch. VIII, in the same 17 July 1898 entry — the
      corrective to the hermit's solitary pride: service to God among people, not
      apart from them.
    facsimile: ""
  - id: E15
    genre: work
    pssTom: 31
    pages: "5-46 (ch. I)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v31_005_046_main-text.txt
    quoteRu: "погрозил пальцем и потом, уезжая, сказал:"
    quoteEn: "(working English) wagged a finger at him, and then, departing, said:"
    significance: >-
      Nicholas I acts and speaks in the narration (the cadet-corps scene), confirming
      the person routing — a historical figure appearing as himself, not a cipher.
    facsimile: ""

