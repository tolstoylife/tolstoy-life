contradictions:
  - claim: "The genesis diary entries are dated 1883 (TEI filenames)."
    correction: "They are 1884: each file's «# bibl» reads «Дневник 1884 г.» and the Tom 26 commentary dates them 1884; Tolstoy's diary was in a gap through early 1884. The filename year is a cataloguing artifact."
    evidenceRef: G1
