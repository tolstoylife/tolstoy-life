topic:
  slug: 1884-1886-the-death-of-ivan-ilyich
  title: "The Death of Ivan Ilyich (Смерть Ивана Ильича) — a corpus work-dive"
  question: >
    A single-work corpus dive on Tolstoy's novella «Смерть Ивана Ильича» (1884–1886):
    its genesis and composition (from the PSS Tom 26 editorial history and the 1884–1886
    diaries and letters), what the work says (a structural read of its own text), its three
    redactions, its uncensored publication, and its place in the Prophet-period cluster as
    Tolstoy's first major fiction after the religious conversion.
  date: 2026-06-07
  period: "Prophet period (post-1880)"
  corpusSurface: "work text + variants + editorial history (PSS Tom 26); diaries (Tom 49); letters (Toms 63, 83, 85)"
  dateRange: "1884–1886 (composition); conception from 1881"

evidence:
  # --- Genesis: diaries (Tom 49) ---
  - id: G1
    genre: diary
    pssTom: 49
    pages: "87"
    date: "1884-04-27 (OS; filed in TEI as 1883 — cataloguing artifact)"
    addressee: ""
    localPdf: ""
    extract: extracts/v49_087_087_1883_04_27.txt
    quoteRu: "Хочу начать и кончить новое"
    quoteEn: "(working English) I want to begin and finish something new (either The Death of a Judge, or The Notes of a Not-Madman)."
    significance: "First diary record of the literary work; the working title is still «смерть судьи». Anchors the 1884 start."
    facsimile: ""
  - id: G2
    genre: diary
    pssTom: 49
    pages: "88–89"
    date: "1884-04-30 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v49_088_089_1883_04_30.txt
    quoteRu: "Смерть Ивана Ильича достал — хорошо и скорее могу"
    quoteEn: "(working English) Got out The Death of Ivan Ilyich — good, and I can do it more quickly."
    significance: "Title has shifted to «Смерть Ивана Ильича»; «достал» implies earlier embryonic drafts already existed."
    facsimile: ""
  - id: G3
    genre: diary
    pssTom: 49
    pages: "89"
    date: "1884-05-01 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v49_089_089_1883_05_01.txt
    quoteRu: "мне нужен отдых от той работы, и эта, художественная, такая"
    quoteEn: "(working English) I need a rest from that work, and this, the artistic kind, is such a rest."
    significance: "Frames the novella as restorative artistic work set against his treatise labour — not as a doctrinal vehicle. Key to the framing watch."
    facsimile: ""
  # --- Genesis: letters (Toms 63, 83, 85) ---
  - id: G4
    genre: letter
    pssTom: 85
    pages: "67"
    date: "1885-06-01/02"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v85_067_iyunya1_2.txt
    quoteRu: "по содержанию ко всем"
    quoteEn: "(working English) in content, to everyone (it relates to our circle only in form)."
    significance: "Positions the work beyond his circle of followers a year before completion; the genesis of the «universal art» idea later theorised in What Is Art?."
    facsimile: ""
  - id: G5
    genre: letter
    pssTom: 63
    pages: "282–283"
    date: "1885-08-20 (OS, approx.)"
    addressee: "Prince L. D. Urusov"
    localPdf: ""
    extract: extracts/v63_408_Kn_L_D_Urusovu.txt
    quoteRu: "описаніе простой смерти простого человѣка"
    quoteEn: "(working English) a description of the simple death of a simple man, describing it from within him."
    significance: "The clearest statement of the artistic programme, plus the immediate motive (finishing for S. A. Tolstaya's new edition as a «surprise»). Pre-reform orthography retained in the letter text."
    facsimile: ""
  - id: G6
    genre: letter
    pssTom: 83
    pages: "336"
    date: "1885-10-23 (OS)"
    addressee: "S. A. Tolstaya"
    localPdf: ""
    extract: extracts/v83_336_oktyabrya23.txt
    quoteRu: "весь поглощен теперь этой работой, уже тянущейся несколько лет"
    quoteEn: "(working English) wholly absorbed now in this work, already dragging on for several years (and now nearing its end)."
    significance: "The canonical statement of absorption; «уже тянущейся несколько лет» supports the multi-year (not seven-month) composition span."
    facsimile: ""
  - id: G7
    genre: letter
    pssTom: 85
    pages: "95"
    date: "1886-01-16/17"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v85_095_yanvarya16_17.txt
    quoteRu: "скоро сталь путаться"
    quoteEn: "(working English) soon got tangled (today I wrote a little of Ivan Ilyich and soon got tangled)."
    significance: "The early-1886 strain note, just before the heavy galley revision. («сталь» for «стал» is in the extract — left verbatim.)"
    facsimile: ""
  # --- Editorial history & prototype (Tom 26 commentary) ---
  - id: C1
    genre: commentary
    pssTom: 26
    pages: "679–691"
    date: "1936 (editorial)"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_679_691_Smert_Ivana_Ilicha_commentary.txt
    quoteRu: "Иван Ильич Мечников умер 2 июля 1881 года"
    quoteEn: "(working English) Ivan Ilyich Mechnikov died on 2 July 1881."
    significance: "Fixes the prototype (Tula prosecutor) and the 1881 conception date; he was brother of the scientist Ilya Mechnikov."
    facsimile: ""
  - id: C2
    genre: commentary
    pssTom: 26
    pages: "679–691"
    date: "1936 (editorial)"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_679_691_Smert_Ivana_Ilicha_commentary.txt
    quoteRu: "Повесть (1884—1886)"
    quoteEn: "(working English) [The Death of Ivan Ilyich.] A tale (1884–1886)."
    significance: "N. N. Strakhov's title-page instruction on the galleys — the authoritative contemporaneous dating, reproduced in lifetime editions; basis for the 1884–1886 slug."
    facsimile: ""
  - id: C3
    genre: commentary
    pssTom: 26
    pages: "679–691"
    date: "1936 (editorial)"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_679_691_Smert_Ivana_Ilicha_commentary.txt
    quoteRu: "Нельзя, нельзя и нельзя так жить"
    quoteEn: "(working English) One cannot, cannot, and cannot live as I have lived (and as we all live)."
    significance: "The theme stated as a thesis on the first manuscript page (the marginal programme of the first redaction)."
    facsimile: ""
  # --- Redaction sample (variants, Tom 26) ---
  - id: R1
    genre: work-variant
    pssTom: 26
    pages: "505–528"
    date: "1884–1885 (first redaction)"
    addressee: ""
    localPdf: ""
    extract: extracts/v26_505_528_Smert_Ivana_Ilicha_Varianty.txt
    quoteRu: "Я узнал о смерти Ивана Ильича в суде"
    quoteEn: "(working English) I learned of the death of Ivan Ilyich at the court."
    significance: "The first-person opening of the first redaction (frame-narrator Творогов), against the final third-person «В большом здании судебных учреждений…»."
    facsimile: ""
  # --- What the work says (Tom 26, main text) ---
  - id: W1
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "что умер он, а не я"
    quoteEn: "(working English) that it was he who had died and not I."
    significance: "Ch. I — the colleagues' first thought; the moral premise (death evaded by displacement) stated at the social surface."
    facsimile: extracts/pss-tom26-p61-ivan-ilyich-opening.png
  - id: W2
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "Прошедшая история жизни Ивана Ильича была самая простая и обыкновенная и самая ужасная."
    quoteEn: "(working English) The past history of Ivan Ilyich's life was the most simple and ordinary and the most terrible."
    significance: "Ch. II — the thesis sentence; ordinariness itself is the horror; the structural hinge into the flashback."
    facsimile: ""
  - id: W3
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "легко, приятно и прилично"
    quoteEn: "(working English) easily, pleasantly, and decorously."
    significance: "Ch. II — the three-word creed of the false life; decorum («приличие») as his religion («по его вере»)."
    facsimile: ""
  - id: W4
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "так точно над ним знаменитый доктор делал тоже вид"
    quoteEn: "(working English) so exactly over him the famous doctor put on the same air [as he had over defendants in court]."
    significance: "Ch. IV — the false life mirrored back: the formality he perfected as judge now used against him."
    facsimile: ""
  - id: W5
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "люди смертны, потому Кай смертен"
    quoteEn: "(working English) men are mortal, therefore Caius is mortal [— correct for Caius, but not for himself]."
    significance: "Ch. VI — the Kiesewetter syllogism; abstract mortality that cannot be made personal. The crux for the phenomenological reception (Heidegger §51)."
    facsimile: ""
  - id: W6
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "Отчего же не потрудиться?"
    quoteEn: "(working English) So why not take a little trouble? [We shall all die.]"
    significance: "Ch. VII — Gerasim's frank acceptance of death and freely given compassion; the one authentic relation in the book."
    facsimile: ""
  - id: W7
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "Главное мучение Ивана Ильича была ложь"
    quoteEn: "(working English) Ivan Ilyich's chief torment was the lie."
    significance: "Ch. VII — the central social evil: the collective pretense that he is only ill, not dying."
    facsimile: ""
  - id: W8
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "вся моя жизнь сознательная жизнь, была «не то»"
    quoteEn: "(working English) my whole life, my conscious life, was 'not the right thing.'"
    significance: "Ch. XI — the central revelation; «не то» becomes the name of the false life. The turning point."
    facsimile: ""
  - id: W9
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "надо сделать, чтобы им не больно было"
    quoteEn: "(working English) he must do something so that it should not hurt them."
    significance: "Ch. XII — the resolution: pity for son and wife dissolves the self-justifying ego; «как хорошо и как просто»."
    facsimile: ""
  - id: W10
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "Вместо смерти был свет"
    quoteEn: "(working English) Instead of death there was light."
    significance: "Ch. XII — the climactic reversal; death negated from within by the inner turn."
    facsimile: ""
  - id: W11
    genre: work
    pssTom: 26
    pages: "61–113"
    date: "1886"
    addressee: ""
    localPdf: "jubilee-edition/vol86/vol86.pdf"
    extract: extracts/v26_061_113_Smert_Ivana_Ilicha.txt
    quoteRu: "Кончена смерть"
    quoteEn: "(working English) Death is finished — it is no more."
    significance: "Ch. XII — the final inversion of «Кончено!» (the man is finished) into «Кончена смерть» (death has ended)."
    facsimile: ""

