scholarship:
  summary: >
    The English-language consensus treats the novella as a masterpiece of late Tolstoy and his
    first major fiction after the religious conversion — a concentrated study of mortality, social
    self-deception, and spiritual awakening, structurally distinguished by its death-first inversion.
    Its philosophical afterlife (German modernism, and above all Heidegger) has shaped its reputation
    as much as its literary reception; from the 1970s it became a core text of medical / end-of-life
    humanities. It is read retrospectively as an exemplar of the «universal art» Tolstoy theorised in
    What Is Art? (1898). Sources: Nabokov (1981), Heidegger (1927 §51), Irwin (2013), Jahn ed. (2018).
  triangulation:
    - evidenceRef: G3
      conventionalView: "Near-universal: the novella is Tolstoy's first major post-conversion fiction; commonly read as a vehicle for the conversion's moral-religious message."
      relation: complicates
      source: "Jahn (ed.) 2018; Wikipedia; Nabokov 1981"
    - evidenceRef: G4
      conventionalView: "The «universal» reading is folded into the retrospective What Is Art? framing rather than tracked to the genesis."
      relation: extends
      source: "Morningside/university syllabi pairing the two texts"
    - evidenceRef: C1
      conventionalView: "The Mechnikov prototype is in specialist scholarship and the PSS apparatus but largely absent from the English mainstream."
      relation: extends
      source: "PSS Tom 26 commentary; cf. Jahn (ed.) 2018"
    - evidenceRef: C2
      conventionalView: "Scholarly consensus often gives composition as 1885–86 (some: October 1885)."
      relation: complicates
      source: "Jahn (ed.) 2018 'Writing and Publication'; PSS Tom 26 commentary (rebuts Sreznevsky/Balukhatyi)"
    - evidenceRef: W5
      conventionalView: "The Kiesewetter syllogism is universally cited as the crux linking the novella to Heidegger's death-analytic."
      relation: confirms
      source: "Heidegger 1927 §51; Irwin 2013"
    - evidenceRef: W7
      conventionalView: "The «decorous lie» is standard, typically framed as social critique of the Russian professional classes."
      relation: complicates
