    extract: extracts/v35_005_118_Hadzhi_Murat.txt
    quoteRu: "Но он всё стоит и не сдается человеку, уничтожившему всех его братий кругом его."
    quoteEn: >-
      (working English) But it still stands and does not surrender to man, who has
      destroyed all its brothers around it.
    significance: >-
      The crushed-but-standing "Tatar" thistle of the prologue — the work's
      controlling image of a life-force that will not yield, explicitly equated
      with Hadji Murat.
