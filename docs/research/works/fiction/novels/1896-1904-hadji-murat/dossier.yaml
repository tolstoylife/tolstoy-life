    addressee: ""
    localPdf: ""
    extract: extracts/diary-v53_099-1896_07_19.txt
    quoteRu: "Напомнил Хаджи-Мурата. Хочется написать. Отстаивает жизнь до последнего, и один среди всего поля, хоть как-нибудь, да отстоял ее."
    quoteEn: >-
      (working English) It reminded me of Hadji Murat. I want to write [it]. It
      defends its life to the last, and alone in the whole field, somehow or other,
      has held on to it.
    significance: >-
      THE genesis seed (entry of 19 July 1896; the thistle seen the day before).
      The crushed roadside thistle becomes the controlling image and the trigger.
    facsimile: ""

  - id: d-obman-very
