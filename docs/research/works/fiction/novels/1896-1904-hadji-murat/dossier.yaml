coverage:
  - surface: "Textual — the novella (scene-led close-read + thematic map)"
    status: covered
    note: "Full text extracted once (--choice=reg); thistle frame, Nicholas I, Shamil, aul-burning, and the death close-read; 25-chapter structural map + themes. Light layer by design (novel-dive)."
  - surface: "Genesis & composition (incl. the source-research layer)"
    status: covered
    note: "Heaviest layer: «История писания» mine + diaries Tom 53–55 (26 finalists) + letters Tom 69–75 (20 finalists). The thistle seed, the secret 1896→1904 gestation, the shame thread, and the full archive network (Stasov, Grand Duke NM, Bartenev, the Tiflis chain, the Korganov eyewitnesses)."
  - surface: "Sources / archival research (the «Список источников»)"
    status: covered
    note: "82-item source list characterised; the load-bearing items (AKAK vol. X, Loris-Melikov «Русская старина» 1881, Зиссерман, Сборник сведений о кавказских горцах, the Vorontsov–Chernyshov correspondence, Шильдер / Custine for Nicholas I) named for entity routing."
  - surface: "Redactions & textual history"
    status: covered
    note: "Ten redactions (1896→1904) and the chronology characterised; 2166 manuscript sheets; «Репей» → «Хазават» → «Хаджи-Мурат» title history. Not collated (the ~270pp variants file sampled, not transcribed) — by design."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "The posthumous 1912 dual publication (censored Moscow vs uncensored Berlin); the Belgard verdict and the specific cuts (Nicholas-I chapter, ch. XVII). Translation lineage beyond the first editions not pursued."
  - surface: "Reception & afterlife — Russian society & church first"
    status: partial
    note: "The posthumous state/dynasty censorship is covered as the primary reception; early Russian critical reception is thin in the corpus (the work appeared after Tolstoy's death). Soviet canonisation + the post-Chechen-war revival via scholarship only."
  - surface: "Characters & prototypes"
    status: covered
    note: "Hadji Murat → character (+ prototype = the historical figure); Nicholas I/Shamil/Vorontsov/Loris-Melikov → person; Butler (prototype F. F. Kutler) + Marya Dmitrievna → character; the highlanders → group. Applies wiki-schema v1.4."
  - surface: "Themes"
    status: covered
    note: "Mirrored despotism, the life-force/thistle, the brutality of empire, honour/betrayal/divided loyalty, the highlanders' world from inside, the sensuous-prose-vs-renunciation tension."
  - surface: "Scholarly context"
    status: covered
    note: "25 sources; the marquee debate triangulated (Simmons fulfilment vs Herman violation/silence vs biographical indulgence); the colonial complication (Bojanowska, Gould) and the Sufi reading (Kokobobo) attributed; Shklovsky on the unfinished work."
  - surface: "Visual & manuscript record"
    status: covered
    note: "Heavy sweep: 24 PD images cached (Lanceray cycle, six Shamil portraits, Nicholas I, Vorontsov, Loris-Melikov, Roubaud/Gagarin/Horschelt/Kivshenko/Aivazovsky, a map). Not openly available: the full GTM-held Lanceray plates, the 1851 Tolstoy daguerreotype, the historical Hadji Murat lithograph — request channels logged."
  - surface: "workRecord (record-CREATING)"
    status: covered
    note: "Single record proposed, field-shaped to the live Master and Man novella record + works schema; posthumous-publication and passages-cut censorship fields filled."

# ============================================================================
contradictions:
  - claim: "Marya Dmitrievna sees Hadji Murat alive as late as June (in the 1896 first sketch «Репей»)."
    correction: >-
      An authorial slip the PSS editors flag: the historical Hadji Murat was killed
      in April 1852, so a June sighting is impossible. Corrected in later redactions.
      An intra-corpus chronology error, not a transmission error.
    evidenceRef: c-thistle-notebook
  - claim: "Hadji Murat's father is named «Абдулл» (as in the 1896 sketch)."
    correction: >-
      The real father's name was Итин-Магомет (per Neverovsky); in 1896 Tolstoy had
      not yet read Neverovsky and used an invented name. The PSS «Примечания» record
      both. A genesis-stage invention later overtaken by the source research.
    evidenceRef: c-thistle-notebook

