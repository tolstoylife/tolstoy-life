  - item: >-
      Nicholas I and Shamil are routed as `person` (dominant historical identity),
      not `character`. But each is a major fictional set-piece in the novel; a
      `character` treatment of Tolstoy's satirical Nicholas-I construct is a
      defensible alternative. Routed person here per the schema's "historical person
      who appears" guidance; flag for the reader.
