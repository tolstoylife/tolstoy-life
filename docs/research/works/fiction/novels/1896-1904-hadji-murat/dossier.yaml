    addressee: ""
    localPdf: ""
    extract: extracts/diary-v53_143_145_1897_04_04.txt
    quoteRu: "Вчера думал очень хорошо о Хаджи-Мурате — о том, что в нем, главное, надо выразить обман веры."
    quoteEn: >-
      (working English) Yesterday I thought very well about Hadji Murat — that the
      main thing in him is to express the deceit of faith.
    significance: >-
      The thematic core Tolstoy assigns the work in 1897 — «обман веры», the
      deceit/delusion of faith; the same entry records his shame at the
      "unlawfulness" of his own life.
    facsimile: ""

