# ============================================================================
scholarship:
  summary: >-
    The mainstream treats Hadji Murat as Tolstoy's last great fiction and, para-
    doxically, the aesthetic capstone of a career whose public author had renounced
    art — Harold Bloom's "the best story in the world" (The Western Canon, 1994)
    anchors the popular reception, and biographers (Bartlett 2010; A. N. Wilson;
    Troyat; Simmons 1968) read it as a "return" to the Caucasian energies of his
    youth, distinguished by the absence of the didacticism that marks the other late
    fiction. The two dominant labels are "return to art" and "anti-imperialist
    masterpiece" (the symmetrical indictment of Nicholas I and Shamil), the latter
    revived by the 1990s–2000s Chechen wars. The dive treats both as the mainstream's
    framings to attribute, not confirm: post-colonial scholarship complicates the
    anti-imperial story (Bojanowska 2022 on Tolstoy as a settler-colonial landlord;
    Gould 2013 on the "ethnographic gaze"), and the Sufi/Islamic dimension is argued
    to have been omitted from prior readings (Kokobobo 2017/2025). On the marquee
    question the literature splits three ways — fulfilment of What Is Art? (Simmons
    1968), flagrant violation / a structuring "silence" that withdraws from all
    moralizing (Herman 2005), and biographical private-indulgence (Wilson; Grasso) —
    and is not settled in one place. Full attribution + 25 sources: extracts/_scholarship.md.
  triangulation:
    - evidenceRef: d-eagerness-and-shame
      conventionalView: >-
        The What-Is-Art tension is read three ways: Simmons (1968) calls Hadji Murat
        "almost a perfect example of the good universal art" the treatise demands;
        Herman (2005) reads it as a flagrant violation of his late aesthetic/ethical
        standards; the biographical camp (Wilson; Grasso) reads it as a private
        relapse he disowned.
      relation: extends
      source: >-
        Simmons 1968; Herman, Slavic Review 64.1 (2005); Wilson 1988. The corpus
        locates the seam none of the three resolves: the diaries show Tolstoy never
        reconciled the contradiction intellectually — he LIVED it as shame
        («совестно», «стыдом», «глупого») while unable to stop, and refused to
        publish. The "fulfilment" reading is the scholar's reconstruction, not
        Tolstoy's; the felt record is unreconciled guilt over the worthiness of
        making art at all.
    - evidenceRef: hm-death-nightingales
      conventionalView: >-
        Herman (2005): the work is structured by "silence" — an unspoken critique of
        all moralizing and teaching; it withdraws from prescription.
      relation: confirms
      source: >-
        Herman 2005. The text bears this out: the moral judgment is carried
        structurally (Nicholas → raid → severed head; the indifferent nightingales),
        never asserted — which, read against What Is Art?'s attack on didacticism, is
        the closest the work comes to OBEYING the doctrine even as Tolstoy condemned
        writing it.
    - evidenceRef: hm-nicholas-selfdeception
      conventionalView: >-
        The mirrored-despots / "anti-imperialist masterpiece" reading: Nicholas I and
        Shamil as twin absolutisms.
      relation: confirms
      source: >-
        Tolstoy's own stated design (reported by S. N. Shulgin, PSS 35 commentary):
        «два полюса властного абсолютизма — азиатского и европейского». The parallel is the author's, not
        only the critics'. The "anti-imperialist" LABEL, however, stays the
        mainstream's — Bojanowska (2022) and Gould (2013) complicate it.
    - evidenceRef: hm-aul-beyond-hatred
      conventionalView: >-
        The novella as a clean anti-colonial conscience; or, conversely, as an
        imperial "ethnographic gaze" on Russia's enemies (Gould).
      relation: complicates
      source: >-
        Bojanowska, Slavic Review 81.2 (2022); Gould, CLS 50.1 (2013); Kokobobo 2017.
        The aul-burning is rendered from the highlanders' side with real force, yet
        the post-colonial scholarship questions whether the author held a coherent
        anti-imperial position; the corpus does not resolve this beyond Tolstoy's
        own design statements.
    - evidenceRef: c-tenth-redaction
      conventionalView: >-
        Shklovsky: no "final" version of Hadji Murat exists — Tolstoy simply stopped;
        the impulse to write fiction as if "true" is the "energy of delusion."
      relation: confirms
      source: >-
        Shklovsky, Energy of Delusion (1981, tr. 2007). The PSS apparatus confirms
        ten redactions across 1896–1904, 2166 manuscript sheets, and an unfinished
        verdict — the work was abandoned, not closed.

