topic:
  slug: 1896-1904-hadji-murat
  title: "Hadji Murat (Хаджи-Мурат) — a novel-dive"
  question: >-
    Is Hadji Murat a betrayal or a fulfilment of What Is Art?? Tolstoy wrote his
    most sensuous late fiction in secret (1896–1904) while publicly teaching that
    art must be moral, universal, and "infectious" — and he called writing it
    self-indulgence. Read the novella against the composition record (the heaviest
    genesis + source-research layer in his fiction) to test that relation, and to
    render the mirrored critique of Nicholas I and Shamil as Tolstoy built it.
  date: 2026-06-09
  period: "Prophet period (post-1880); composed 1896–1904"
  corpusSurface: >-
    PSS Tom 35 (the novella pp. 5–118; working notes pp. 275–283; variants
    pp. 284–556; commentary: «История писания» pp. 583–629, «История печатания»
    pp. 629–631, «Список источников» pp. 631–633, «Примечания» pp. 634–643,
    glossary of mountaineer words pp. 644–647, «Описание рукописей» pp. 648–666);
    diaries Tom 53–55 (1895–1904); letters Tom 69–75 (1896–1904).
  dateRange: "1896–1904 (composition); published posthumously 1912"

