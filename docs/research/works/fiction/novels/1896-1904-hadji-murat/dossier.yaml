      Hadji Murat himself is routed as a `character` (titular) with a prototypes[]
      edge to the historical figure. Whether the HISTORICAL Hadji Murat ALSO warrants
      a standalone `person` page (he is historically significant in his own right,
      independent of the novel) is an ingestion judgment call — the work is so
      grounded in the documentary record that the line is unusually thin here.
