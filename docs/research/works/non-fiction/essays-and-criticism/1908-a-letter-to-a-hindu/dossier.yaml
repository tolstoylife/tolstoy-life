scholarship:
  summary: >-
    The mainstream reads the letter almost entirely through Gandhi: it is "the trigger of the
    Tolstoy–Gandhi correspondence" and a formative influence on Gandhi's South African campaign
    (Green; Guha; Doke's 1909 "Undoubtedly Count Tolstoy has profoundly influenced him"). The best
    recent scholarship is more careful. Hazama (2023) shows the letter shaped Gandhi's anti-violence
    in South Africa but that "satyagraha"/"ahimsa"/"non-violence" as a framework came later, after
    Gandhi's 1915 return to India and partly for reasons unrelated to Tolstoy (he coined "non-violence"
    in 1919). Mantena (2012) reads Gandhi's nonviolence as contextual "political realism", structurally
    unlike Tolstoy's absolute spiritual non-resistance. Scholarship rarely reads the letter's own text
    closely — the Spencer-epigraph frame and the seven-section Krishna-epigraph spine go undiscussed.
    English-first; the dive grounds in the primary record (Tolstoy's text + the correspondence + the
    PSS commentary) and treats the Gandhi-origin-of-satyagraha story as the received view to test, not
    confirm. See extracts/_scholarship.md for the full attributed layer and source list.
  triangulation:
    - evidenceRef: hindu-marquee-lever
      conventionalView: >-
        That "A Letter to a Hindu" shaped Gandhi's commitment to non-violence in South Africa
        (Green; Guha; Hazama; Gandhi's own "what I had learned from Tolstoy has fructified a
        hundredfold").
      relation: confirms
      source: "Hazama 2023; Guha 2013; Doke 1909"
    - evidenceRef: hindu-marquee-lever
      conventionalView: >-
        That the letter is therefore the source of satyagraha / Gandhian nonviolence.
      relation: complicates
      source: "Hazama 2023 (ahimsa framing post-1915; 'non-violence' coined 1919); Mantena 2012 (satyagraha as organised political realism, not Tolstoyan individual withdrawal)"
    - evidenceRef: hindu-thirty-thousand
      conventionalView: >-
        That Tolstoy's counsel was welcome to the Indian independence movement.
      relation: contradicts
      source: "Tarak Nath Das, 'Open Letter to Count Leo Tolstoy' (16 Oct 1909) — the addressee, a revolutionary, publicly rejected the non-resistance counsel and defended resistance to despotism as a duty"
    - evidenceRef: hindu-spencer-frame
      conventionalView: >-
        (Scholarship does not treat the letter as a structured rebuttal of the Spencer epigraph.)
      relation: extends
      source: "No source found; the PSS commentary (hindu-spencer-source) supplies the frame the corpus reads"
    - evidenceRef: gandhi-last-transvaal
      conventionalView: >-
        Tolstoy's praise of Gandhi's Transvaal work is variously translated ('most weighty practical
        proof' in some English texts).
      relation: extends
      source: "The primary Russian (PSS Tom 82) gives 'самое центральное, самое важное из всех дел... в мире' — grounding the stronger 'most important work in the world' phrasing"

