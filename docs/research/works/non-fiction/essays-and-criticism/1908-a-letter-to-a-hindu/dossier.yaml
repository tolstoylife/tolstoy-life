    status: covered
    note: "The 3 Tolstoy→Gandhi letters; Gandhi's preface and serialization; Das's rejection; the satyagraha triangulation; Tolstoy's later approval."
  - surface: "Reception & afterlife — Russian society & church"
    status: partial
    note: "The letter drew far less Russian/Church reaction than the banned treatises (it was a letter to a foreigner, printed in excerpts). No Synod/critic storm found; marked partial honestly, not padded."
