  - id: hindu-diary-finished
    genre: diary
    pssTom: 56
    pages: "163"
    date: "1908-12-14 (OS)"
    addressee: null
    localPdf: null
    extract: extracts/v56_163_163_1908_12_14.txt
    quoteRu: >-
      Кончил письмо Индусу, слабо, повторения.
    quoteEn: >-
      Finished the letter to the Hindu, weak, repetitions. (working English)
    significance: >-
      The completion date, 14 Dec 1908 (OS) = 27 Dec NS, and the closing verdict. The same entry
      records his anger that day at news of executions ("вешанье, мучанье людей") — the Stolypin
      hangings that drove the 1908 essay «I Cannot Be Silent»; the non-resistance argued to India
      was written against that domestic backdrop.
    facsimile: null

  - id: hindu-mss-413
    genre: comments
    pssTom: 37
    pages: "444–446"
    date: 1908
    addressee: null
    localPdf: null
    extract: extracts/v37_444_446_comments_istoria_pisania.txt
    quoteRu: >-
      Общее количество рукописного материала, относящегося к «Письму к индусу», исчисляется в 413 листов разного формата
    quoteEn: >-
      The total manuscript material relating to the «Letter to a Hindu» comes to 413 sheets of various formats. (working English)
    significance: >-
      413 manuscript sheets (45 autograph, the rest typed copies with corrections), 29 numbered
      redactions — a heavy redaction history for a short open letter, confirming the "all
      repetitions" struggle was a real, prolonged reworking, not a single sitting.
    facsimile: null

  # ===== C. RECEPTION — publication and the Gandhi correspondence ====================

  - id: hindu-chertkov-translated
    genre: comments
    pssTom: 37
    pages: "444–446"
    date: "1909-05 (OS)"
    addressee: null
    localPdf: null
    extract: extracts/v37_444_446_comments_istoria_pisania.txt
    quoteRu: >-
      На английский язык письмо было переведено В. Г. Чертковым. Толстой исправил и отредактировал этот перевод
    quoteEn: >-
      The letter was translated into English by V. G. Chertkov. Tolstoy corrected and edited this translation. (working English)
    significance: >-
      Resolves the "who translated it" question (a scholarship needsReview): the published English
      "A Letter to a Hindoo" is Chertkov's translation, corrected and edited by Tolstoy — i.e. the
      English the dive quotes is authorized, not a working gloss.
    facsimile: null

  - id: hindu-pub-russian
    genre: comments
    pssTom: 37
    pages: "444–446"
    date: "1909-04-19 (OS)"
    addressee: null
    localPdf: null
    extract: extracts/v37_444_446_comments_istoria_pisania.txt
    quoteRu: >-
      «Письмо к индусу» по-русски впервые было напечатано в выдержках в газетах
    quoteEn: >-
      The «Letter to a Hindu» was first printed in Russian, in excerpts, in the newspapers [«Kievskie Vesti» no. 103 of 19 April and «Russkie Vedomosti» no. 89 of 19 April 1909; in full only in S. A. Tolstaya's collected works, Moscow 1911]. (working English)
    significance: >-
      First appearance anywhere = Russian newspaper excerpts, 19 April 1909 (OS) = 2 May NS, in
      Tolstoy's lifetime. The full Russian text appeared only in 1911 (posthumous), in S. A.
      Tolstaya's collected works. The letter circulated meanwhile in typed copies (машинописные
      списки) — one of which reached Gandhi.
    facsimile: null

  - id: hindu-pub-gandhi
    genre: comments
    pssTom: 37
    pages: "444–446"
    date: "1910-01"
    addressee: null
    localPdf: null
    extract: extracts/v37_444_446_comments_istoria_pisania.txt
    quoteRu: >-
      На английском языке письмо впервые было напечатано в журнале М. Ганди «Indian opinion» 1910, январь.
    quoteEn: >-
      In English the letter was first printed in M. Gandhi's journal «Indian Opinion», January 1910. (working English)
    significance: >-
      The hinge of the reception story, in the PSS's own words. The commentary continues: Gandhi's
      preface explained the letter circulated in typed copies, one sent to him to print; Gandhi
      wrote to Tolstoy for confirmation of authorship and permission, and on receiving it
      published the letter. (Scholarship dates the serialization 25 Dec 1909 / 1 Jan / 8 Jan 1910
      — the PSS "January 1910" is the completion; see _scholarship.md §A.)
    facsimile: null

  - id: hindu-tolstoy-approved
    genre: comments
    pssTom: 37
    pages: "444–446"
    date: "1910-03-19 (OS)"
    addressee: null
    localPdf: null
    extract: extracts/v37_444_446_comments_istoria_pisania.txt
    quoteRu: >-
      Прочел письмо свое индусу и очень одобрил
    quoteEn: >-
      Read my own letter to the Hindu and very much approved it. (working English)
    significance: >-
      Tolstoy's later verdict, reversing the composition-time disdain. Receiving Gandhi's printed
      «Indian Opinion» in March 1910, he reread the letter he had called "rubbish and repetition"
      and "very much approved" it. The work he dismissed while writing, he embraced once Gandhi
      had made it a movement document.
    facsimile: null

