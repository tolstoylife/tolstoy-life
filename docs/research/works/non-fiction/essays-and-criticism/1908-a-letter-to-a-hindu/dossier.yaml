  - id: gandhi-reincarnation
    genre: letter
    pssTom: 80
    pages: "110–112"
    date: "1909-09-25 / 1909-10-07"
    addressee: "Mohandas K. Gandhi"
    localPdf: null
    extract: extracts/v80_149_MaxatmeGandiMohandasGandhi.txt
    quoteRu: >-
      Слово reincarnation […] мне бы не хотелось исключать, потому что, по моему мнению, вера в reincarnation никогда не может быть так тверда, как вера в неумираемость души и в справедливость и любовь бога.
    quoteEn: >-
      As to the word reincarnation, I should not myself like to omit it, for, in my opinion, belief in reincarnation can never be as firm as belief in the soul's immortality and in God's justice and love. (Tolstoy's own English, in the same letter)
    significance: >-
      Gandhi proposed cutting the reincarnation material for his readership; Tolstoy preferred to
      keep it but left the choice to Gandhi ("делайте, как хотите"). The published «Indian Opinion»
      text is thus a Gandhi-edited version — a small but documented instance of Gandhi curating
      Tolstoy for an Indian audience.
    facsimile: null

  - id: gandhi-transvaal-struggle
    genre: letter
    pssTom: 80
    pages: "110–112"
    date: "1909-09-25 / 1909-10-07"
    addressee: "Mohandas K. Gandhi"
    localPdf: null
    extract: extracts/v80_149_MaxatmeGandiMohandasGandhi.txt
    quoteRu: >-
      Та же борьба мягкого против жесткого, смирения и любви против гордости и насилия с каждым годом всё более и более проявляется и у нас, в особенности в одном из самых резких столкновений закона религиозного с законом мирским — в отказах от военной службы.
    quoteEn: >-
      That same struggle of the tender against the harsh, of meekness and love against pride and violence, is every year making itself more and more felt here among us also, especially in one of the very sharpest of the conflicts of the religious law with the worldly laws — in refusals of military service. (Tolstoy's own English, in the same letter)
    significance: >-
      Tolstoy ties Gandhi's Transvaal campaign to the Russian conscientious-objector movement and
      the Doukhobors — the same law of love working itself out East and West. His non-resistance
      is refusal-of-participation (military service first of all), not organised confrontation.
    facsimile: null

  - id: gandhi-hindswaraj
    genre: letter
    pssTom: 81
    pages: "247–249"
    date: "1910-04-25 / 1910-05-08"
    addressee: "Mohandas K. Gandhi"
    localPdf: null
    extract: extracts/v81_318_M_GandiM_Gandhi.txt
    quoteRu: >-
      Я прочел вашу книгу с большим интересом, так как я думаю, что вопрос, который вы в ней обсуждаете — пассивное сопротивление — вопрос величайшей важности, не только для Индии, но и для всего человечества.
    quoteEn: >-
      I read your book with great interest because I think that the question you treat in it: passive resistance — is a question of the greatest importance, not only for India but for the whole humanity. (Tolstoy's own English, in the same letter)
    significance: >-
      On receiving Gandhi's «Hind Swaraj» («Indian Home Rule») — written, scholarship notes, on the
      very voyage on which Gandhi translated the Letter to a Hindu into Gujarati. The exchange has
      become a two-way conversation about "passive resistance".
    facsimile: null

  - id: gandhi-last-love
    genre: letter
    pssTom: 82
    pages: "137–140"
    date: "1910-09-07"
    addressee: "Mohandas K. Gandhi"
    localPdf: null
    extract: extracts/v82_178_GandiGandhi.txt
    quoteRu: >-
      мне хочется сказать другим то, что я так особенно живо чувствую и что, по моему мнению, имеет огромную важность, а именно о том, что называется непротивлением, но что в сущности есть не что иное, как учение любви, не извращенное ложными толкованиями.
    quoteEn: >-
      I want to say to others what I feel so especially vividly and what in my opinion is of enormous importance — namely, what is called non-resistance, but which in essence is nothing other than the teaching of love undistorted by false interpretations. (working English)
    significance: >-
      From Tolstoy's last letter to Gandhi (7 Sep 1910, from Kochety) — the long non-resistance
      letter, written eight weeks before his death. His final definition: non-resistance is simply
      the law of love undistorted. The letter prompted by reading Gandhi's «Indian Opinion».
    facsimile: null

  - id: gandhi-last-transvaal
    genre: letter
    pssTom: 82
    pages: "137–140"
    date: "1910-09-07"
    addressee: "Mohandas K. Gandhi"
    localPdf: null
    extract: extracts/v82_178_GandiGandhi.txt
    quoteRu: >-
      ваша деятельность в Трансвале, как нам кажется на конце света, есть дело самое центральное, самое важное из всех дел, какие делаются теперь в мире
    quoteEn: >-
      your work in the Transvaal, which to us seems at the end of the world, is the most central, the most important of all the affairs being done now in the world. (working English)
    significance: >-
      Tolstoy's verdict on Gandhi's campaign, in his own words — resolving the scholarship's
      needsReview about the famous "most important work in the world" phrasing (which the corpus
      confirms from the primary Russian, against the looser "most weighty practical proof" of some
      English translations). The dying Tolstoy names a stranger's distant campaign the most
      important thing happening on earth.
    facsimile: null

  # ===== D. THE INDIAN-CORRESPONDENCE CONTEXT =======================================

  - id: chitale-indian-religion
    genre: letter
    pssTom: 78
    pages: "32–33"
    date: "1908-01-21 / 1908-02-03"
    addressee: "S. R. Chitale"
    localPdf: null
    extract: extracts/v78_023_S_R_CHitelyuS_R_Chitale.txt
    quoteRu: >-
      Я высоко ценю мое общение с индийскими религиозными людьми, каковым и вы являетесь, судя по вашему письму. С большим интересом и пользой для моей духовной жизни прочел я все встретившиеся мне браминские религиозные книги
    quoteEn: >-
      I appreciate very highly all my intercourse with Indian religious men such as from your letter I infer you to be. I have read with great interest and profit for my spiritual life all the Braminic religious books which I have come across. (Tolstoy's own English, in the same letter)
    significance: >-
      The letter to Das did not come from nowhere: Tolstoy was in active correspondence with a
      network of Indians (Chitale, Das, later Gandhi, with Baba Premananda Bharati's book as a
      source) and had been reading Indian religious texts. This Jan 1908 letter to Chitale, on the
      Bhagavad-Gita, shows the engagement six months before Das's appeal arrived.
    facsimile: null

