topic:
  slug: 1908-a-letter-to-a-hindu
  title: "A Letter to a Hindu (Письмо к индусу)"
  question: >-
    Tolstoy's 1908 open letter to Tarak Nath Das, editor of «Free Hindustan» — its genesis,
    its argument (non-resistance as the lever of India's liberation), and the reception that
    made it historically decisive: Gandhi read it, reprinted it in «Indian Opinion», and it
    fed his satyagraha. Marquee question: India is held by a handful of Englishmen only
    because Indians themselves participate in violence — does the corpus + the Gandhi record
    confirm, complicate, or extend that claim?
  date: 2026-06-13
  period: "Prophet period (late, 1908)"
  corpusSurface: "works (the letter) + comments (история писания) + diaries (Tom 56, 1908) + letters (Gandhi Toms 80–82; Chitale Tom 78)"
  dateRange: "composition June–December 1908; reception 1909–1910"

evidence:

  # ===== A. THE LETTER'S OWN TEXT (PSS Tom 37, pp. 245–272) ==========================
  # The TEI carries BOTH the authorized contemporary English (Chertkov, revised by Tolstoy)
  # and the full Russian original. quoteRu = Russian original; quoteEn = the published 1909
  # English where it has a direct equivalent (labelled), else a working gloss.

  - id: hindu-epigraph-vedas
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das (and, through him, the colonised East)"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Всё, что существует, едино: люди только называют это единое разными именами.
    quoteEn: >-
      All that exists is One; people only call this One by different names. (Tolstoy/Chertkov English, 1909)
    significance: >-
      The opening epigraph (from the Vedas), one of a triad — Vedas, 1 John ("God is love"),
      Vivekananda — that frames the whole letter as a statement of the one law of love common
      to all religions. The letter is studded throughout with epigraphs attributed to "Krishna",
      drawn from Baba Premananda Bharati's «Sree Krishna: The Lord of Love» (1904).
    facsimile: null

  - id: hindu-thesis-oppression
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      В Индии это кажется особенно странным, так как здесь более чем 200-миллионный, высокоодаренный и духовными и телесными силами народ находится во власти совершенно чуждого ему небольшого кружка людей, стоящих в религиозно-нравственном отношении неизмеримо ниже тех людей, над которыми они властвуют.
    quoteEn: >-
      It appears especially strange of India, for here we have a people of 200 millions of individuals, highly endowed with spiritual and physical powers, in absolute subjection to a small clique, composed of persons utterly alien in thought and aspiration and altogether inferior to those whom they enslave. (Tolstoy/Chertkov English, 1909)
    significance: >-
      Section I — the opening puzzle the whole letter answers: how does a vast, gifted nation
      come to be ruled by a small, alien, and (in Tolstoy's framing) inferior minority. The
      setup for the "consent" thesis.
    facsimile: null

  - id: hindu-spencer-frame
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Вы в своем журнале, как основной принцип, долженствующий руководить деятельностью вашего народа, ставите эпиграфом такую мысль
    quoteEn: >-
      In your magazine you insert as the basic principle which should direct the activity of your people the following thought as an epigraph [Spencer: "Resistance to aggression is not simply justifiable but imperative; non resistance hurts both Altruism and Egoism"]. (Tolstoy/Chertkov English, 1909)
    significance: >-
      The structural pivot. The letter is built as a direct rebuttal to the Herbert Spencer
      motto that «Free Hindustan» flew as its epigraph (per the PSS commentary, from ch. 8 of
      Spencer's «Sociology»). Tolstoy quotes the Spencer line verbatim in Section V and turns
      it on its head. Scholarship (see _scholarship.md §E) does not discuss this inversion —
      it is dropped from some English editions; the corpus supplies it (extends).
    facsimile: null

  - id: hindu-love-only-means
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Любовь есть единственное средство спасения людей от всех претерпеваемых ими бедствий. В данном случае единственное средство освобождения вашего народа от порабощения только в любви.
    quoteEn: >-
      Love is the only means of saving people from all disasters which he may undergo. In your case the only means of liberating your people from slavery lies in love. (Tolstoy/Chertkov English, 1909)
    significance: >-
      Tolstoy's answer to Spencer: not resistance but love (which "includes non-resistance")
      is the sole means of liberation. The doctrinal core of the marquee claim.
    facsimile: null

  - id: hindu-contrary
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Но ведь это совершенно наоборот. Если англичане поработили индусов, то только потому, что индусы признавали и признают главными, основными принципами своего общественного устройства насилие.
    quoteEn: >-
      But it is just the contrary. If the English have enslaved the Hindoos, it is just because the Hindoos recognised and do recognise coercion as the main and fundamental principle of their social order. (Tolstoy/Chertkov English, 1909)
    significance: >-
      The inversion stated flatly: the English did not impose subjection from outside; the
      Hindoos' own commitment to violence as a principle is what makes subjection possible.
    facsimile: null

  - id: hindu-thirty-thousand
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Что значит то, что 30 тысяч людей, не силачей, даже скорее слабых и дурных людей, поработили 200 миллионов живых, умных, сильных, любящих свободу людей? Разве не ясно по одним цифрам, что не англичане, а сами индусы поработили себя.
    quoteEn: >-
      What does it mean that thirty thousand people not athletes, but rather weak and illooking have enslaved 200 millions of vigorous, clever, strong, freedom-loving people? Do not the figures make it clear that not the English, but the Hindoos, have enslaved themselves? (Tolstoy/Chertkov English, 1909)
    significance: >-
      The single most-cited passage of the letter — the arithmetic of consent. A commercial
      company (the East India Company) holding 200 millions is, to Tolstoy, proof on the face
      of the numbers that the subjection is self-imposed.
    facsimile: null

  - id: hindu-drunkard
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Индусам жаловаться на то, что англичане поработили их, всё равно, что людям, предающимся пьянству, жаловаться на то, что поселившиеся среди них продавцы вина поработили их.
    quoteEn: >-
      For the Hindoos to complain that the English have enslaved them, is equal to people who are addicted to drink, complaining that vendors of wine, who have settled in their midst, have enslaved them. (Tolstoy/Chertkov English, 1909)
    significance: >-
      The drunkard analogy — the rhetorical heart of the consent thesis. The wine-seller
      doesn't enslave; the drinking does. The image makes the argument concrete and is the one
      most likely to land, and to wound, an audience seeking endorsement of resistance.
    facsimile: null

  - id: hindu-marquee-lever
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Только живи человек согласно с свойственным его сердцу и открытым уже ему законом любви, включающей в себя непротивление, и потому естественно не участвуя в каком бы то ни было насилии, и не только сотни не поработят миллионы, но миллионы не поработят одного. Не противьтесь злу, но и сами не участвуйте во зле, в насилиях администрации, судов, сборов податей и, главное, войска, и никто в мире не поработит вас.
    quoteEn: >-
      If man lives only in accord with the law of love which includes non resistance, which has been already revealed to him and is natural to his heart, and hence does not participate in any form of violence, not only hundreds will not enslave millions but even millions will be unable to enslave one individual. Do not resist evil, but also yourselves participate not in evil, in the violent deeds of the administration, of the law courts, the collection of taxes, and what is most important of the soldiers, and no one in the world will enslave you. (Tolstoy/Chertkov English, 1909)
    significance: >-
      THE marquee keystone — the lever stated in full. Liberation is not won by resisting the
      oppressor but by withdrawing participation from the machinery of violence (administration,
      courts, taxes, above all the army). This is the Tolstoyan, anarchist, individual form of
      non-resistance — distinct from the organised mass civil disobedience Gandhi would build
      (see scholarship triangulation).
    facsimile: null

  - id: hindu-self-enslaved
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Если индусы порабощены насилием, то только оттого, что они сами жили насилием, живут насилием и не признают вечного, свойственного человечеству закона любви.
    quoteEn: >-
      If the Hindoos have been enslaved by violence it is because they themselves have lived by violence, live by violence, and do not recognise the eternal law of love, inherent in humanity. (Tolstoy/Chertkov English, 1909)
    significance: >-
      The diagnosis closed: subjection follows from the subjected nation's own embrace of
      violence. The cure is therefore not counter-violence but its renunciation.
    facsimile: null

  - id: hindu-science-ballast
    genre: works
    pssTom: 37
    pages: "245–272"
    date: 1908
    addressee: "Tarak Nath Das"
    localPdf: null
    extract: extracts/v37_245_272_letter_to_a_hindu.txt
    quoteRu: >-
      Для того, чтобы спасти тонущий корабль, надо выбросить из него тот балласт, который если и был, может быть, когда-нибудь нужен, теперь губит его.
    quoteEn: >-
      In order to save a sinking ship it is necessary to throw overboard the ballast, which though it might have been indispensable at one time, would now cause destruction. (Tolstoy/Chertkov English, 1909)
    significance: >-
      The second front of the letter: the law of love is hidden not only by false religion but
      by a new "scientific" superstition (historical law, struggle-for-existence, the will of
      the people). Both must be thrown overboard. Tolstoy's late anti-scientism, here aimed at
      the Westernising Indian leadership that looks to European forms for deliverance.
    facsimile: null

  # ===== B. GENESIS (commentary + 1908 diaries, all OS dates) ========================

  - id: hindu-das-appeal
    genre: comments
    pssTom: 37
    pages: "444–446"
    date: "1908-05-24 (OS)"
    addressee: null
    localPdf: null
    extract: extracts/v37_444_446_comments_istoria_pisania.txt
    quoteRu: >-
      Именем голодающих миллионов взываю к вашему христианскому чувству
    quoteEn: >-
      In the name of the starving millions I appeal to your Christian feeling [— take up this cause]. (working English)
    significance: >-
      From Tarak Nath Das's letter of 24 May 1908 (OS), quoted in full in the PSS commentary
      (Mishin). Das, a Bengali revolutionary, asked Tolstoy — whose moral authority over the
      Russian government he invoked — to write an article on India. He led with the 1891–1900
      famine (19 million dead) set against war deaths, arguing India suffers worse than Russia.
      He wanted endorsement for the struggle; the reply he got reframed the struggle itself.
    facsimile: null

  - id: hindu-spencer-source
    genre: comments
    pssTom: 37
    pages: "444–446"
    date: 1908
    addressee: null
    localPdf: null
    extract: extracts/v37_444_446_comments_istoria_pisania.txt
    quoteRu: >-
      Редакция журнала выставляла эпиграфом цитату из восьмой главы «Социологии» Г. Спенсера
    quoteEn: >-
      The journal's editors flew as their epigraph a quotation from chapter eight of H. Spencer's «Sociology» [—the last clause, that non-resistance harms both altruism and egoism, especially caught Tolstoy's attention]. (working English)
    significance: >-
      The PSS commentary identifies the Spencer epigraph as the provocation Tolstoy fixed on —
      grounding the dive's reading that the whole letter answers Spencer. Resolves a needsReview
      from the scholarship sweep (which could not find the Spencer frame in English editions).
    facsimile: null

  - id: hindu-genesis-start
