    quoteRu: >-
      Все копаюсь над Письмом к Индусу. Кажется, дребедень и повторение. Надо кончить и оторваться.
    quoteEn: >-
      Still digging away at the Letter to the Hindu. Seems like rubbish and repetition. Must finish it and tear myself away. (working English)
    significance: >-
      The harshest self-judgment of the dive: "дребедень и повторение" — rubbish and repetition.
