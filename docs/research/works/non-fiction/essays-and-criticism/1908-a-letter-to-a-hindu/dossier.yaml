    quoteRu: >-
      Начало писания ответа Дасу относится к 7 июня 1908 г.
    quoteEn: >-
      The start of writing the reply to Das dates to 7 June 1908. (working English)
    significance: >-
      Composition began 7 June 1908 (OS) — the cover of the first drafts is dated "7, 8, 9 June 08".
      The work then stalled for months and was only finished in a sustained 17 Nov–14 Dec push.
    facsimile: null

  - id: hindu-diary-zapnulsja
