# ── Intra-corpus development (primary vs primary) ───────────────────────────
contradictions:
  - claim: "The 1894 Maupassant preface lists three conditions of a true work of art — a moral relation to the subject, beauty of form, and sincerity (wia-maupassant-3conditions)."
    correction: "The 1898 treatise drops 'beauty of form' as a criterion entirely and relocates the centre to 'infection' (заражение) — the transmission of feeling (wia-def-v). This is a development of Tolstoy's own position across four years, not an inconsistency within one text."
    evidenceRef: wia-maupassant-3conditions

