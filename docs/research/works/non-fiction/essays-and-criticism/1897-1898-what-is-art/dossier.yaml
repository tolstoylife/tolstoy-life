topic:
  slug: 1897-1898-what-is-art
  title: "What Is Art? (Что такое искусство?)"
  question: >-
    Document What Is Art? as a work across the local Tolstoy corpus: its definition of
    art as the "infection" (заражение) / transmission of feeling and its rejection of
    beauty (красота) as the criterion; the religious-consciousness criterion of good
    art and the "counterfeits" (подделки) that produce bad art; the verdicts on Wagner,
    Beethoven, the Decadents, and on Tolstoy's own novels; the survey-and-demolition of
    Western aesthetics (Baumgarten → Kant → the empiricists) read as a concept/philosopher
    juxtaposition; the long gestation (art-essays 1882–1896, the 1894 Maupassant preface)
    and the agonised 1897 composition witnessed in the diaries and letters and its people
    (Stasov, Grot, Maude, Chertkov, Lazursky); the two-stage censorship (Grot's softening
    + the spiritual censor's cuts and the inserted redemption dogma) told in Tolstoy's own
    preface to the English edition; and the publication lineage (censored Russian serial
    1897–98; Maude's English 1898 as the first complete text) — grounded in Tolstoy's own
    words, the Jubilee-Edition apparatus, and the project's sibling dives.
  date: "2026-06-07"
  period: "Prophet period (post-1880); treatise composed Jan 1897 – Feb 1898 (Old Style); gestation from 1882"
  corpusSurface: "PSS Tom 30 (treatise pp. 27–203; English-edition preface pp. 204–206; Maupassant preface pp. 3–24; precursor art-essays 1882–1896; variants; Gudzy's commentary pp. 487–582). Composition-window diaries Tom 53 (1896–1898), letters Toms 69–71, and Tolstoy–Chertkov letters Tom 88."
  dateRange: "1882 (first art-essay) – 1913 (Biryukov's PSS ed.); treatise 1897–1898; first complete text = Maude's English, 1898."

# ── Evidence ledger (primary; byte-faithful) ────────────────────────────────
# extract paths are relative to this file's directory.
evidence:

  # — The treatise: definition, beauty, the criterion —
  - id: wia-def-v
    genre: work
    pssTom: 30
    pages: "Ch V (pp. 27–203)"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Искусство есть деятельность человеческая, состоящая в том, что один человек сознательно известными внешними знаками передает другим испытываемые им чувства, а другие люди заражаются этими чувствами и переживают их."
    quoteEn: "(working English) Art is a human activity consisting in this, that one person consciously, by certain external signs, transmits to others feelings he has lived through, and other people are infected by these feelings and also experience them."
    significance: "The load-bearing definition of the treatise — art relocated from beauty/pleasure to the transmission of feeling, with заражение (infection) as its mechanism (Ch V)."

  - id: wia-beauty-vi
    genre: work
    pssTom: 30
    pages: "Ch VI"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Красота же, если мы не довольствуемся словами, а говорим о том, что понимаем, — красота есть не что иное, как то, что нам нравится."
    quoteEn: "(working English) Beauty, if we are not satisfied with words but speak of what we understand — beauty is nothing other than what pleases us."
    significance: "Tolstoy defines beauty downward to mere pleasure precisely so he can reject it as art's criterion — the dive's rhetorical pivot."

  - id: wia-infectiousness-xv
    genre: work
    pssTom: 30
    pages: "Ch XV"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Признак, выделяющий настоящее искусство от поддельного, есть один несомненный — заразительность искусства."
    quoteEn: "(working English) The one indubitable sign distinguishing real art from counterfeit is the infectiousness of art."
    significance: "The practical test (заразительность) that recasts the Ch V definition and governs the good-art analysis of Ch XVI."

  - id: wia-sincerity-xv
    genre: work
    pssTom: 30
    pages: "Ch XV"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Более же всего увеличивается степень заразительности искусства степенью искренности художника."
    quoteEn: "(working English) Most of all the degree of infectiousness of art is increased by the degree of the artist's sincerity."
    significance: "Sincerity — the strongest of the three conditions of infection — does the polemical work against Wagner and the Decadents: they write for effect, not from felt experience."

  - id: wia-counterfeits-xi
    genre: work
    pssTom: 30
    pages: "Ch XI"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Приемы эти следующие: 1) заимствование, 2) подражательность, 3) поразительность и 4) занимательность."
    quoteEn: "(working English) These techniques are the following: (1) borrowing, (2) imitativeness, (3) strikingness [/effect], and (4) interest [/diversion]."
    significance: "The four-device recipe by which talent fabricates the semblance of art without feeling — the diagnostic applied to Wagner in Ch XIII."

  - id: wia-religious-criterion-xvi
    genre: work
    pssTom: 30
    pages: "Ch XVI"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Религиозное сознание нашего времени в самом общем практическом приложении его есть сознание того, что наше благо, и материальное и духовное, и отдельное и общее, и временное и вечное, заключается в братской жизни всех людей, в любовном единении нашем между собой."
    quoteEn: "(working English) The religious consciousness of our time, in its most general practical application, is the consciousness that our good — material and spiritual, individual and common, temporal and eternal — lies in the brotherly life of all people, in our loving union with one another."
    significance: "The criterion of good art: the brotherhood-of-all religious consciousness — the same one grounded in What I Believe and The Kingdom of God (Ch XVI)."

  - id: wia-twokinds-xvi
    genre: work
    pssTom: 30
    pages: "Ch XVI"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "И потому христианское искусство нашего времени может быть и есть двух родов: 1) искусство, передающее чувства, вытекающие из религиозного сознания положения человека в мире, по отношению к Богу и ближнему, — искусство религиозное, и 2) искусство, передающее самые простые житейские чувства, такие, которые доступны всем людям всего мира, — искусство всемирное."
    quoteEn: "(working English) And therefore the Christian art of our time can be and is of two kinds: (1) art transmitting feelings flowing from the religious consciousness of man's position in the world, in relation to God and neighbour — religious art; and (2) art transmitting the very simplest feelings of everyday life, such as are accessible to all people of the whole world — universal art."
    significance: "The two kinds of good art — religious and universal — the constructive core of Ch XVI."

  - id: wia-wagner-xiii
    genre: work
    pssTom: 30
    pages: "Ch XIII"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Вагнер с большим умением воспользовался всеми, долгой практикой ложного искусства выработанными, средствами подделки под искусство и составил образцовое поддельное произведение искусства."
    quoteEn: "(working English) Wagner, with great skill, made use of all the means of counterfeiting art worked out by the long practice of false art, and composed a model counterfeit work of art."
    significance: "Wagner's Ring enthroned as the exemplary counterfeit — proof-by-instance of the four-device recipe (Ch XIII)."

  - id: wia-decadents-x
    genre: work
    pssTom: 30
    pages: "Ch X"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Бодлер и Верлен придумывают новую форму, при этом подновляя ее еще неупотребительными до сих пор порнографическими подробностями."
    quoteEn: "(working English) Baudelaire and Verlaine invent a new form, freshening it up with pornographic details not used until now."
    significance: "The Decadents as Tolstoy's case-study in the upper-class drift to deliberate obscurity (Ch X)."

  - id: wia-beethoven-xvi
    genre: work
    pssTom: 30
    pages: "Ch XVI"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "«Как, девятая симфония принадлежит к дурному роду искусства?!» слышу я возмущенные голоса. «Без всякого сомнения», отвечаю я."
    quoteEn: "(working English) \"What, the Ninth Symphony belongs to the bad kind of art?!\" I hear indignant voices. \"Without any doubt,\" I answer."
    significance: "The most-cited verdict in the book — the canonical masterpiece fails the universality test because it unites only the specially trained (Ch XVI)."

  - id: wia-goodart-xvi
    genre: work
    pssTom: 30
    pages: "Ch XVI"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "в области словесности я указал бы на «Разбойников» Шиллера"
    quoteEn: "(working English) in the domain of literature I would point to Schiller's Die Räuber [The Robbers]"
    significance: "Opening of Tolstoy's positive canon of religious art (Schiller, Hugo, Dickens, Uncle Tom's Cabin, Dostoevsky's House of the Dead, George Eliot) — strikingly narrow (Ch XVI)."

  - id: wia-selfcondemn-xvi
    genre: work
    pssTom: 30
    pages: "Ch XVI (footnote)"
    date: "1897–1898"
    extract: extracts/v30_027_203_notes.txt
    quoteRu: "При этом еще должен заметить, что свои художественные произведения я причисляю к области дурного искусства, за исключением рассказа «Бог правду видит», желающего принадлежать к первому роду, и «Кавказского пленника», принадлежащего ко второму."
    quoteEn: "(working English) I must also note that I assign my own artistic works to the domain of bad art, with the exception of the story God Sees the Truth [But Waits], which wishes to belong to the first kind, and A Prisoner of the Caucasus, which belongs to the second."
    significance: "The famous self-condemnation — an authorial footnote stripped by extract_tei.py, recovered byte-faithfully into v30_027_203_notes.txt. Tolstoy turns the criterion on his own novels."

  # — The concept/philosopher map: flattening exhibits —
  - id: wia-kant-iii
    genre: work
    pssTom: 30
    pages: "Ch III"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "способность суждения (Urtheilskraft), которая составляет суждения без понятий и производит удовольствие без желания"
    quoteEn: "(working English) the faculty of judgement (Urtheilskraft), which forms judgements without concepts and produces pleasure without desire"
    significance: "Tolstoy renders Kant's disinterested-pleasure formula accurately, then (Ch IV) re-reads 'pleasure without desire' as merely 'what pleases us' — flattening the autonomy thesis into hedonism."

  - id: wia-guyau-iii
    genre: work
    pssTom: 30
    pages: "Ch III"
    date: "1897–1898"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Искусство же есть выражение жизни разумной и сознательной"
    quoteEn: "(working English) Art is the expression of rational and conscious life"
    significance: "Guyau — 'art raises man from personal to universal life by shared feeling' — is essentially Tolstoy's own заражение thesis; yet Tolstoy files his nearest unacknowledged predecessor under the discredited beauty-as-pleasure camp (Ch III)."

  # — The English-edition preface: the censorship keystone —
  - id: wia-pref-trueform
    genre: work
    pssTom: 30
    pages: "pp. 204–206 (preface to the English edition)"
    date: "1898-03-17"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "Книга эта моя «Что такое искусство?» выходит теперь в первый раз в ее настоящем виде."
    quoteEn: "(working English) This book of mine, What Is Art?, now comes out for the first time in its true form."
    significance: "The keystone: Tolstoy declares the English edition authoritative because every Russian edition was mangled by the censor."

  - id: wia-pref-grot
    genre: work
    pssTom: 30
    pages: "pp. 204–206"
    date: "1898-03-17"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "Сначала Грот смягчал мои выражения, иногда ослабляя их, напр. заменял слова «всегда» — словами «иногда»; слова «все» — словами «некоторые»; слово «церковное» — словом «католическое»; слово «богородица» — словом «мадонна»; слово «патриотизм» — словом «лжепатриотизм»; слово «дворцы» — словом «палаты» и т. п."
    quoteEn: "(working English) At first Grot softened my expressions, sometimes weakening them — e.g. he replaced 'always' with 'sometimes'; 'all' with 'some'; 'ecclesiastical' with 'Catholic'; 'the Mother of God' with 'the Madonna'; 'patriotism' with 'false patriotism'; 'palaces' with 'mansions,' and so on."
    significance: "Stage one of the mangling — Grot's lexical softening to pass the secular censor."

  - id: wia-pref-censor-redemption
    genre: work
    pssTom: 30
    pages: "pp. 204–206"
    date: "1898-03-17"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "там, где я говорю о Христе, шедшем на крест за исповедуемую им истину, цензор вычеркнул это и поставил «за род человеческий», т. е. приписал мне таким образом утверждение догмата искупления, который я считаю одним из самых неверных и вредных церковных догматов."
    quoteEn: "(working English) where I speak of Christ going to the cross for the truth he professed, the censor struck this out and put 'for the human race' — thus ascribing to me an affirmation of the dogma of redemption, which I consider one of the most false and harmful of the church's dogmas."
    significance: "Stage two — the spiritual censor cuts and inserts the redemption dogma Tolstoy rejected, putting an alien doctrine in his mouth."

  - id: wia-pref-moral
    genre: work
    pssTom: 30
    pages: "pp. 204–206"
    date: "1898-03-17"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "всякий компромисс с учреждением, не согласным с вашей совестью — компромисс, который делается обыкновенно в виду общей пользы, неизбежно затягивает вас, вместо пользы, не только в признание законности отвергаемого вами учреждения, но и в участие в том вреде, который производит это учреждение."
    quoteEn: "(working English) any compromise with an institution not in accord with your conscience — a compromise usually made for the sake of the common good — inevitably drags you, instead of into benefit, not only into recognising the legitimacy of the institution you reject but into participation in the harm it produces."
    significance: "Tolstoy frames the whole censorship episode as a moral exhibit, not a literary grievance — the through-line to his non-resistance to institutions."

  # — The Maupassant preface (1894): the precursor criterion —
  - id: wia-maupassant-3conditions
    genre: work
    pssTom: 30
    pages: "pp. 3–24 (Preface to Maupassant, 1894)"
    date: "1894"
    extract: extracts/v30_003_024_Predislovie_k_sochinenijam_Gjui_de_Mopassana.txt
    quoteRu: "Из этих трех условий: 1) правильного, т. е. нравственного, отношения автора к предмету, 2) ясности изложения или красоты формы, что одно и то же, и 3) искренности, т. е. непритворного чувства любви или ненависти к тому, что изображает художник, из этих трех условий Мопассан обладал только двумя последними и был совершенно лишен первого."
    quoteEn: "(working English) Of these three conditions — (1) a correct, i.e. moral, relation of the author to his subject, (2) clarity of exposition, or beauty of form, which is the same thing, and (3) sincerity, i.e. an unfeigned feeling of love or hatred for what the artist depicts — of these three conditions Maupassant possessed only the last two and was entirely without the first."
    significance: "The 1894 precursor criterion (moral relation + beauty of form + sincerity); the treatise drops 'beauty of form' and relocates the centre to infection (заражение). The textual-history pivot."

  # — Genesis & strain (composition-window diaries & letters) —
  - id: wia-genesis-jan1897
    genre: letter
    pssTom: 88
    pages: "letter to V. G. Chertkov, 12 Jan 1897"
    date: "1897-01-12"
    addressee: "V. G. Chertkov"
    extract: extracts/v88_431_yanvarya12.txt
    quoteRu: "Пишу об искусстве, […] но эта работа отчасти, особенно теперь, ученая и не захватывающая, а на другие работы нет энергии."
    quoteEn: "(working English) I am writing about art, but this work is partly — especially now — scholarly and not engaging, and I have no energy for other work."
    significance: "To his most intimate correspondent, Tolstoy confesses at the outset that the treatise is not the creative work that sustains him."

  - id: wia-genesis-jul1897
    genre: letter
    pssTom: 88
    pages: "letter to V. G. Chertkov, 12 Jul 1897"
    date: "1897-07-12"
    addressee: "V. G. Chertkov"
    extract: extracts/v88_455_iyulya12.txt
    quoteRu: "чаще кажется, что ничтожно, что я не имею права свои последние силы класть на такое неважное дело"
    quoteEn: "(working English) more often it seems trivial, that I have no right to lay my last strength on such an unimportant matter"
    significance: "The treatise holds him against his own judgement of its worth — the double bind of the gestation."

  - id: wia-genesis-prostitution
    genre: diary
    pssTom: 53
    pages: "diary, 19 Feb 1898"
    date: "1898-02-19"
    extract: extracts/v53_182_184_1898_02_19.txt
    quoteRu: "Наше искусство с поставкой потех для богатых классов не только похоже на проституцию, но есть не что иное, как проституция."
    quoteEn: "(working English) Our art, in supplying entertainment for the wealthy classes, is not merely similar to prostitution — it is nothing other than prostitution."
    significance: "The rawest formulation of the treatise's thesis first surfaces in a diary note at the final, painful proof-stage; added to Ch XVIII."

  - id: wia-stasov-books
    genre: letter
    pssTom: 70
    pages: "letter to V. V. Stasov, 3 Sep 1897"
    date: "1897-09-03"
    addressee: "V. V. Stasov"
    extract: extracts/v70_157_V_V_Stasovu.txt
    quoteRu: "Больше мне ничего не нужно. И так совестно, что держу еще ваши книги."
    quoteEn: "(working English) I need nothing more. And I feel so ashamed at still holding your books."
    significance: "Stasov supplied the aesthetics bibliography Tolstoy then demolishes; the borrowed books are still in his hands in August 1897."

