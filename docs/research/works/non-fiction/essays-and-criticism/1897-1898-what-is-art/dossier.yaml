needsReview:
  - item: "extract_tei.py has no mode to recover authorial inline <note> footnotes (it strips them). The famous self-condemnation footnote was recovered here with a one-off helper (extracts/_recover_notes.py). Candidate for a tooling enhancement (e.g. --notes=inline)."
    phase: "Phase 2"
    why: "Tooling gap that silently dropped the single most-cited line in the treatise; affects any future dive on a work with authorial footnotes."
  - item: "workRecord dating is Old Style; OS→NS conversion for dateWritingStarted/Completed and dateFirstPublished should be finalized by ingestion."
    phase: "Phase 4"
    why: "PSS diary/letter dates are Julian; the works schema's main date fields likely expect a chosen calendar."
  - item: "Stasov's published reaction to the printed (censored) treatise — his 1898–1900 criticism — was not recovered; needs an archival check."
    phase: "Phase 3"
    why: "Russian-society reception is partial without it; the dive only has the composition-stage collaboration."
  - item: "No single authoritative monograph found that argues at length that Tolstoy caricatures Kant/Schopenhauer/Helmholtz; the concept-map's 'flattened' judgements are the dive's own analysis, attributed as such."
    phase: "Phase 3"
    why: "The juxtaposition section advances a reading without a named scholarly backer for the flattening claim."
  - item: "Russian 1898 first-edition title-page facsimile not located as PD (for the visual record)."
    phase: "Phase 2"
    why: "Visual record is partial; likely survives in RGALI / RGB, not digitised publicly."
  - item: "relatedWorks ids for the Maupassant preface and the precursor art-essays — resolve against works/ records before linking."
    phase: "Phase 4"
    why: "The dive will not fabricate work ids; the precursors are companions/sources to the treatise."

