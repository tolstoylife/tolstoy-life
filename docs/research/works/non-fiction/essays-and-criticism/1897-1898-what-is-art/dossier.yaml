# ── Scholarship (secondary layer; attributed, not byte-checked) ──────────────
scholarship:
  summary: >-
    The scholarly consensus treats What Is Art? as philosophically serious but flawed, and
    classifies it as a version of the expression / transmission theory of art (distinct from
    Collingwood and Croce in insisting that completed outward transmission to an audience is
    constitutive). Gary R. Jahn (1975) gives the most technical critique — the central term
    'emotion' is under-defined and the religious/universal/counterfeit categorisation is
    'often confusing'. John Bayley (1986) locates the book's force in its rejection of received
    aesthetics rather than its positive thesis. Aylmer Maude (the translator) calls it 'probably
    the most masterly of all Tolstoy's works'; Rimvydas Šilbajoris (1991) argues, against the
    'old-age rupture' reading, that Tolstoy's aesthetics are consistent across his career and
    embodied in the novels; H. O. Mounce (2001) frames it as a principled, Plato-like denial of
    the autonomy of art. The widely-repeated charge that Tolstoy caricatures Kant, Schopenhauer
    and Helmholtz circulates in teaching materials but was not found argued at length in a single
    authoritative monograph (needsReview). VOICE NOTE: the mainstream tendency to call the
    condemnations of Wagner/Beethoven/Shakespeare/his own novels 'arbitrary excess' risks
    inverting Tolstoy's position — they follow rigorously from the infection-criterion, and are
    judged 'arbitrary' largely by the beauty-criterion he explicitly rejects.
  triangulation:
    - evidenceRef: wia-def-v
      conventionalView: "Art as transmission of feeling (not beauty) is the standard characterisation of the treatise; aesthetics handbooks file it as the (or a) transmission/expression theory."
      relation: confirms
      source: "Jahn 1975; Šilbajoris 1991; Mounce 2001; Maude 1925"
    - evidenceRef: wia-religious-criterion-xvi
      conventionalView: "The religious-consciousness criterion and the religious/universal/counterfeit scheme are read as 'often confusing' and as conflating moral with aesthetic 'good' (Jahn); Šilbajoris defends the scheme as coherent in light of the fiction; Mounce reads the denial of aesthetic autonomy as the point."
      relation: complicates
      source: "Jahn 1975; Šilbajoris 1991; Mounce 2001"
    - evidenceRef: wia-selfcondemn-xvi
      conventionalView: "The condemnation of high culture and of his own novels is universally registered as the book's most provocative feature; the mainstream tends to treat it as moralistic excess."
      relation: complicates
      source: "Bayley 1986; Simmons 1973; Šilbajoris 1991 (who argues it follows from the theory's logic, not self-flagellation)"
    - evidenceRef: wia-stasov-books
      conventionalView: "Scholarship mentions Stasov's bibliographic help only thematically; the PSS correspondence supplies the primary grounding (the «Pan» journal, the borrowed books)."
      relation: extends
      source: "PSS letters Tom 70 (this dive); cf. general accounts"
    - evidenceRef: wia-pref-censor-redemption
      conventionalView: "Tolstoy's own preface is the fullest first-person account of the censorship; Maude's translation as the first unexpurgated text 'in any language' is uncontested."
      relation: confirms
      source: "Tolstoy, Author's Preface (PSS Tom 30); Maude 1925"

