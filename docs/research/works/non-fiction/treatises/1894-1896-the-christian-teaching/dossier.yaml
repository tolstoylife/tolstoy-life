contradictions:
  - claim: "The Christian Teaching is a minor work Tolstoy 'put on one side.'"
    correction: "Tolstoy's own 12 March 1895 diary heads his entire late-period to-do list with the catechism, above Father Sergius, The Forged Coupon and Hadji-Murat — he ranked it co-equal with the unfinished novels."
    evidenceRef: E31

