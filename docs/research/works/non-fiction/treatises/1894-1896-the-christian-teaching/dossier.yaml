# ── Scholarship (secondary layer; ground in primary first, attribute) ─────
scholarship:
  summary: >-
    The Anglophone scholarship represents Tolstoy's late religion almost entirely
    through The Kingdom of God Is Within You (polemic) and What Is Religion?
    (compression); The Christian Teaching is rarely treated as a text in its own
    right — where it surfaces it is mined for a quotation. The diagnostic case is
    Stepanova (2020), a study of Tolstoy's faith that cites the work exactly once,
    in passing. Aylmer Maude's contemporary filing — "written later, put on one
    side, and published in 1898 without final revision" — is the framing the
    literature inherited: minor, abstract, unfinished restatement. The neglect is
    structural; it is the reception's judgment, not the author's (Tolstoy ranked
    the catechism at the head of his late to-do list, co-equal with the unfinished
    novels). Read mainstream framing as a foil, not a baseline.
  triangulation:
    - evidenceRef: E8
      conventionalView: "The late religious statement is Kingdom of God (polemic) + What Is Religion? (compression); the calm systematic middle term is largely unrecognised as a distinct achievement."
      relation: extends
      source: "Stepanova 2020; Maude 1910; absence across surveyed scholarship"
    - evidenceRef: E10
      conventionalView: "Filed as an unfinished, abstract restatement — implicitly milder because less polemical."
      relation: complicates
      source: "Maude 1910 ('without final revision'); primary text v39_117_191 chs 31, 33–43"
    - evidenceRef: E28
      conventionalView: "Where noted, the work is called 'abstract' — but as a defect of execution, not as the author's own consciously-named risk."
      relation: extends
      source: "keystone letter to Popov 22 Oct 1894; diary 19 July 1896 (E33)"
    - evidenceRef: E31
      conventionalView: "'Minor' / 'put on one side' (Maude) — i.e. peripheral."
      relation: contradicts
      source: "Tolstoy diary 12 March 1895 vs Maude 1910"
    - evidenceRef: E21
      conventionalView: "The work is unfinished and was published only with an editor's caveat."
      relation: confirms
      source: "PSS commentary ll. 45–47; editor's preface (Chertkov 1898)"
    - evidenceRef: E22
      conventionalView: "Readers cite the Chertkov 8-part form; few flag that the PSS prints the 64-chapter manuscript."
      relation: extends
      source: "PSS commentary l. 51; PSS prints рук. №113"

