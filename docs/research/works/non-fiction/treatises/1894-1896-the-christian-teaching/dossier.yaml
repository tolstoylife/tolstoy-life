topic:
  slug: 1894-1896-the-christian-teaching
  title: "The Christian Teaching (Христианское учение)"
  question: >-
    Does The Christian Teaching (1894–96) soften or systematise the ethic that
    The Kingdom of God Is Within You (1890–93) argued polemically — doctrine as
    calm catechism vs. doctrine as combative polemic? And what is its place in
    the late religious cluster?
  date: 2026-06-13
  period: "Prophet period (post-1880)"
  corpusSurface: >-
    The work itself (PSS Tom 39); its composition-history commentary (Mishin,
    Tom 39); the 1894–96 diaries (Toms 52–53) and letters (Toms 67, 84, 87) for
    genesis and the people around the work; prior corpus-dives for the cluster;
    English-first scholarship for the received view.
  dateRange: "1894-03 .. 1896-10 (composition); 1898 (first publication)"

# ── Work-subject metadata ────────────────────────────────────────────────
work:
  pssTom: 39
  pssPages: "117–191"
  mainTextTei: v39_117_191_Hristianskoe_uchenie
  commentaryTei: v39_242_247_Hristianskoe_uchenie_Istorija_pisanija_i
  compositionStart: "1894-03/04"   # begun between 23 March and 21 April 1894 (PSS commentary)
  compositionRoughComplete: "1896-10-05"  # last authorial review of рук. №113 (M.L. Tolstaya's date)
  structure: "Preface + 64 numbered chapters (PSS, from manuscript №113); Chertkov's 1898 editions regroup these into 8 titled parts with paragraphs renumbered 1–404"
  recordPath: "website/src/works/non-fiction/treatises/the-christian-teaching/The Christian Teaching.md"
  recordExists: false   # → the workRecord proposes CREATION

# ── Evidence ledger (flat) ───────────────────────────────────────────────
# genre: works | diary | letter | commentary. quoteRu copied byte-for-byte from
# the named extract file (verify_quotes.py asserts this). Commentary entries are
# PSS editorial apparatus (Mishin) — attributed, not byte-claimed as Tolstoy.
evidence:
  # --- the work itself (PSS Tom 39) ---
  - id: E1
    genre: works
    pssTom: 39
    pages: "118"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "начиная с Моисея, Исаии, Конфуция, древних греков, Будды, Сократа и до Паскаля, Спинозы, Фихте, Фейербаха"
    quoteEn: "beginning with Moses, Isaiah, Confucius, the ancient Greeks, Buddha, Socrates and down to Pascal, Spinoza, Fichte, Feuerbach (working English)"
    significance: "Preface. The recovered truth is not his private reading of the Gospel but the universal witness of mankind's best minds — the autobiographical Confession-in-miniature opens the treatise on a deliberately ecumenical footing."
  - id: E2
    genre: works
    pssTom: 39
    pages: "118"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "если я говорю истину, то истина эта не моя, а божья"
    quoteEn: "if I speak the truth, this truth is not mine but God's (working English)"
    significance: "Preface. The author disclaims authorship of the doctrine — it merely passes through him as through anyone who perceives truth. Sets the impersonal, non-polemical voice of the whole book."
  - id: E3
    genre: works
    pssTom: 39
    pages: "120"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "Человек хочет быть зверем или ангелом, но не может быть ни тем, ни другим"
    quoteEn: "Man wants to be a beast or an angel, but can be neither (working English)"
    significance: "Ch. 4. The metaphysical core: the contradiction of human life (animal vs. spiritual)."
  - id: E4
    genre: works
    pssTom: 39
    pages: "120"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "ангел, рождающийся из зверя, — духовное существо, рождающееся из животного"
    quoteEn: "an angel being born out of a beast — a spiritual being born out of an animal (working English)"
    significance: "Ch. 4. Christianity's resolution of the contradiction: life is the birth of the spiritual self out of the animal — the generative image the whole architecture rests on."
  - id: E5
    genre: works
    pssTom: 39
    pages: "121"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "Желание же блага всему существующему есть начало всякой жизни, есть любовь, есть бог"
    quoteEn: "The desire for the good of all that exists is the source of all life, is love, is God (working English)"
    significance: "Ch. 7. God defined immanently — known directly within as the desire-for-the-good-of-all = love. The positive doctrinal kernel, calmly stated."
  - id: E6
    genre: works
    pssTom: 39
    pages: "123"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "называется установлением царства божия"
    quoteEn: "is called the establishment of the kingdom of God (working English)"
    significance: "Ch. 9. The work of life = replacing division with union — 'the establishment of the kingdom of God.' Direct conceptual bridge to The Kingdom of God Is Within You."
  - id: E7
    genre: works
    pssTom: 39
    pages: "125"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "подобна пару, сжатому в паровике"
    quoteEn: "like steam compressed in a boiler (working English)"
    significance: "Ch. 13. Love is like steam in a boiler; the body's limits are the walls it needs to do its work — the obstacles to love are not evils but the very mechanism of the spiritual birth."
  - id: E8
    genre: works
    pssTom: 39
    pages: "127"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "Есть три рода грехов, мешающих любви"
    quoteEn: "There are three kinds of sins that obstruct love (working English)"
    significance: "Ch. 15. The taxonomic backbone: every sin is analysed in three forms — прирожденные (innate), наследственные (inherited), личные (personal/contrived). The 'catechism' become a system."
  - id: E9
    genre: works
    pssTom: 39
    pages: "133"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "Соблазн по-гречески σκάνδαλον — означает западню, ловушку"
    quoteEn: "Soblazn — in Greek σκάνδαλον — means a snare, a trap (working English)"
    significance: "Ch. 24. The second category of evil: соблазны (seductions/snares) are the false justifications that excuse sins. Tolstoy etymologises to fix the term."
  - id: E10
    genre: works
    pssTom: 39
    pages: "143"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "я делаю это не на свою ответственность, а потому, что исполняю волю высшей власти"
    quoteEn: "I do this not on my own responsibility, but because I am carrying out the will of a higher power (working English)"
    significance: "Ch. 31, the государственный (state) seduction. The diffusion-of-responsibility analysis of state violence — executions, war, land-seizure — as radical as anything in Kingdom of God, here folded calmly into the taxonomy. Cf. the Caiaphas reference (good-of-the-many)."
  - id: E11
    genre: works
    pssTom: 39
    pages: "150"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "Пятый прием самый жестокий"
    quoteEn: "The fifth method is the cruellest (working English)"
    significance: "Ch. 35. The third category of evil: обманы веры (deceptions of faith), worked by five methods. The fifth and cruellest is instilling a false faith in children — the anti-Church critique at its sharpest."
  - id: E12
    genre: works
    pssTom: 39
    pages: "150"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "душа человеческая по природе христианка"
    quoteEn: "the human soul is by nature Christian (working English)"
    significance: "Ch. 35. Tolstoy cites Tertullian — the child arrives with a clean reason already disposed to truth, which the deceptions of faith then poison."
  - id: E13
    genre: works
    pssTom: 39
    pages: "157"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "Истина не может войти в человека помимо разума"
    quoteEn: "Truth cannot enter a man except through reason (working English)"
    significance: "Ch. 38. The rationalist axis: reason (разум) is the one God-given instrument of knowledge; faith built against reason is deception. The ground of liberation from the deceptions of faith."
  - id: E14
    genre: works
    pssTom: 39
    pages: "186"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "молитва необходима не как средство избавления от мирских бедствий"
    quoteEn: "prayer is necessary not as a means of deliverance from worldly afflictions (working English)"
    significance: "Ch. 60. Prayer reconceived: not petition for worldly goods or relief, but a means of strengthening in the struggle with sins. The doctrine reaches into the inner life."
  - id: E15
    genre: works
    pssTom: 39
    pages: "186"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "молитва христианская бывает двоякая"
    quoteEn: "Christian prayer is of two kinds (working English)"
    significance: "Ch. 60. The two prayers — молитва временная (occasional, clarifying one's place before God, in solitude) and молитва ежечасная (hourly, the constant awareness of being a messenger). Grace, atonement and petition are rejected as no help in the struggle."
  - id: E16
    genre: works
    pssTom: 39
    pages: "191"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "Прежде чем был Авраам, я есмь"
    quoteEn: "Before Abraham was, I am — John 8:58 (working English)"
    significance: "Ch. 64. The future after death is a wrongly-posed question: the divine essence is timeless and spaceless — 'we are.' The serene metaphysical close."
  - id: E17
    genre: works
    pssTom: 39
    pages: "191"
    extract: extracts/v39_117_191_Hristianskoe_uchenie.txt
    quoteRu: "я радостно возвращаюсь к нему"
    quoteEn: "I joyfully return to him (working English)"
    significance: "Ch. 64, final paragraph. On Christ's dying words ('Into thy hands I commit my spirit'), Tolstoy ends on consolation, not indictment — the tonal signature that separates this book from Kingdom of God."
  # --- composition-history commentary (PSS Tom 39, Mishin — attributed) ---
  - id: E18
    genre: commentary
    pssTom: 39
    pages: "242"
    extract: extracts/v39_242_247_commentary.txt
    quoteRu: "приступил между 23 марта и 21 апреля 1894 г."
    quoteEn: "began [work] between 23 March and 21 April 1894 — PSS commentary (working English)"
    significance: "Pins the start of composition. (Mishin, PSS Tom 39 apparatus.)"
  - id: E19
    genre: commentary
    pssTom: 39
    pages: "243"
    extract: extracts/v39_242_247_commentary.txt
    quoteRu: "нужно бросить катехизическую форму"
    quoteEn: "the catechism form must be abandoned — Tolstoy, 2 Nov 1894, quoted in PSS commentary (working English)"
    significance: "The formal turning-point: Tolstoy drops the question-and-answer catechism form (diary + letter to Chertkov, 2 Nov 1894). The 'catechism' becomes an ordered 'exposition of faith.'"
  - id: E20
    genre: commentary
    pssTom: 39
    pages: "243"
    extract: extracts/v39_242_247_commentary.txt
    quoteRu: "Как хорошо, что я не кончил катехизиса"
    quoteEn: "How good that I did not finish the catechism — Tolstoy diary 5 Nov 1895, quoted in PSS commentary (working English)"
    significance: "The restart impulse — he is relieved not to have finished, because he means to 'write it differently and better.' The compositional churn that produced 115 manuscripts."
  - id: E21
    genre: commentary
    pssTom: 39
    pages: "245"
    extract: extracts/v39_242_247_commentary.txt
    quoteRu: "считаю это писание неконченным"
    quoteEn: "I consider this writing unfinished — Tolstoy to Chertkov 2 Sept 1897, quoted in PSS commentary (working English)"
    significance: "Tolstoy's own status for the work: unfinished, far short of what he would have demanded 20 years earlier — yet useful enough to print 'as it is.' The author's disavowal that frames the 1898 publication."
  - id: E22
    genre: commentary
    pssTom: 39
    pages: "246"
    extract: extracts/v39_242_247_commentary.txt
    quoteRu: "Статья разбита Чертковым на восемь частей"
    quoteEn: "The article was divided by Chertkov into eight parts — PSS commentary (working English)"
    significance: "Chertkov's editorial re-shaping of the 1898 text — 8 titled parts + paragraphs renumbered 1–404 'for the reader's convenience.' The popular English text carries Chertkov's shape; the PSS prints the manuscript's own chapter form."
  - id: E23
    genre: commentary
    pssTom: 39
    pages: "246"
    extract: extracts/v39_242_247_commentary.txt
    quoteRu: "2154 лл."
    quoteEn: "2154 leaves — PSS commentary (working English)"
    significance: "Scale of the manuscript labour: 2154 leaves across 115 numbered manuscripts (рук. №№ 1–115) over two and a half years."
  # --- genesis: diaries & letters (1894–96) ---
  - id: E24
    genre: diary
    pssTom: 52
    date: "1894-04-21"
    extract: extracts/d1894_04_21.txt
    quoteRu: "катехизис, который напрасно затеял"
    quoteEn: "the catechism, which I undertook in vain (working English)"
    significance: "First diary mention — born already burdened with guilt about competing projects (the Maupassant preface)."
  - id: E25
    genre: diary
    pssTom: 52
    date: "1894-05-03"
    extract: extracts/d1894_05_03.txt
    quoteRu: "серьезнее и важнее и труднее, чем я думал"
    quoteEn: "more serious and important and difficult than I had thought (working English)"
    significance: "The scope dawns on him; the modest 'catechism' label is already too small."
  - id: E26
    genre: letter
    pssTom: 67
    date: "1894-05-08"
    addressee: "N. N. Ge (the son)"
    extract: extracts/L1894_05_08_Ge_son.txt
    quoteRu: "катехизиса — изложения веры"
    quoteEn: "the catechism — the exposition of faith (working English)"
    significance: "Both titles coexist in his mind in May 1894; the design brief is to answer the universal child's/simple-person's questions briefly and convincingly."
  - id: E27
    genre: letter
    pssTom: 67
    date: "1894-09-04"
    addressee: "A. A. Tolstaya"
    extract: extracts/L1894_09_04_Tolstaya_AA.txt
    quoteRu: "изложение в самой короткой и всем понятной форме"
    quoteEn: "the exposition, in the shortest and universally comprehensible form (working English)"
    significance: "The brevity-and-universal-clarity criterion, stated to the Orthodox kinswoman he expects to reject the content. Form, not content, is what he is anxious about."
  - id: E28
    genre: letter
    pssTom: 67
    date: "1894-10-22"
    addressee: "E. I. Popov"
    extract: extracts/L1894_10_22_Popov_a.txt
    quoteRu: "опасность отвлеченного умствования"
    quoteEn: "the danger of abstract reasoning (working English)"
    significance: "KEYSTONE genesis letter. The named risk of the whole project is abstraction — never radicalism. (Commentary cites this letter as 23 Oct; the corpus TEI dates it 22 Oct — see needsReview.)"
  - id: E29
    genre: letter
    pssTom: 67
    date: "1894-10-22"
    addressee: "E. I. Popov"
    extract: extracts/L1894_10_22_Popov_a.txt
    quoteRu: "чтобы было понятно Ваничке"
    quoteEn: "so that it be comprehensible to Vanichka [and the yard-keeper] (working English)"
    significance: "The one test he applies: accessibility to a child (his youngest son Vanichka, who would die Feb 1895) and a simple labourer. The accessibility benchmark, not a doctrinal one."
  - id: E30
    genre: letter
    pssTom: 87
    date: "1894-11-02"
    addressee: "V. G. Chertkov"
    extract: extracts/L1894_11_02_Chertkov.txt
    quoteRu: "хочется писать не в катехизической форме"
    quoteEn: "I want to write [it] not in the catechism form (working English)"
    significance: "The rename decision confirmed to his chief editor the same day as the diary — the move from catechism to ordered exposition."
  - id: E31
    genre: diary
    pssTom: 53
    date: "1895-03-12"
    extract: extracts/d1895_03_12.txt
    quoteRu: "Рядом с этим кончать Катехизис"
    quoteEn: "Alongside these — to finish the Catechism (working English)"
    significance: "The catechism heads his entire late-period to-do list, set against the unfinished fiction (Father Sergius, The Forged Coupon, Hadji-Murat) — evidence he ranked it co-equal with the novels. Contradicts the 'minor work' filing."
  - id: E32
    genre: letter
    pssTom: 87
    date: "1895-12-01"
    addressee: "V. G. Chertkov"
    extract: extracts/L1895_12_01_Chertkov.txt
    quoteRu: "то, чтó было катихизис"
    quoteEn: "what was the catechism (working English)"
    significance: "By Dec 1895 the rename has happened: he is rewriting 'what was the catechism' from scratch as the exposition of faith. (Byte-faithful to the pre-reform spelling «катихизис» / accented «чтó» in the letters volume.)"
  - id: E33
    genre: diary
    pssTom: 53
    date: "1896-07-19"
    extract: extracts/d1896_07_19.txt
    quoteRu: "совсем недоступно простолюдину и ребенку"
    quoteEn: "quite inaccessible to the common man and the child (working English)"
    significance: "Tolstoy's own verdict that the book FAILS his Vanichka test — coherent and complete, but too abstract. The central tension of the project in his own words."
  - id: E34
    genre: letter
    pssTom: 84
    date: "1896-09-26"
    addressee: "S. A. Tolstaya"
    extract: extracts/L1896_09_26_Tolstaya_SA.txt
    quoteRu: "если умру, не исправив"
    quoteEn: "if I die without correcting it [they will still understand what I wanted to say] (working English)"
    significance: "The rough-completion announcement to his wife, with the testamentary frame — a measure of the weight he placed on the unpolished text."
  - id: E35
    genre: letter
    pssTom: 87
    date: "1896-10-12"
    addressee: "V. G. Chertkov"
    extract: extracts/L1896_10_12_Chertkov.txt
    quoteRu: "более простом и сокращенном виде"
    quoteEn: "[I have begun it again] in a simpler and shortened form (working English)"
    significance: "Having 'finished' it, he immediately restarts a shorter version (8 chapters that day, Tanya copying) — the simplification drive that never reached the end. The work is declared done and condemned in the same breath."

