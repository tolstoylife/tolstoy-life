# What I Believe (В чём моя вера?) — corpus-dive dossier
# Machine-readable companion to index.md. Primary evidence is byte-faithful
# (verify with: python3 docs/research/lib/verify_quotes.py docs/research/1882-1884-what-i-believe/dossier.yaml).
# Secondary/scholarly claims are attributed, not byte-checked (prototype rigor).
# NOTE: diary/letter evidence (believe-diary-*, believe-let-*), the visuals block, and the
# scholarship block are folded in after the Phase-1 sweeps + Phase-3 pass.

topic:
  slug: 1882-1884-what-i-believe
  title: "What I Believe (В чём моя вера?)"
  question: >-
    Document What I Believe as a work across the local Tolstoy corpus — its
    genesis out of the Engelhardt letter and the unfinished 1881 "Записки
    христианина"; what the text argues (the «не противься злому» key, the
    Sermon on the Mount read as five binding commandments, the rejection of
    courts, oaths, war and the state); its redactions and title history; its
    1884 printing, ban and dispersal; its translation lineage and Church
    reception; and its place as the doctrinal sequel to A Confession in the
    Prophet-period project — grounded in Tolstoy's own words, the Jubilee-
    Edition apparatus, the composition-window diaries and letters, and the
    project's prior dives.
  date: "2026-06-06"
  period: "Prophet period (post-1880); composition 1882–1884 (Old Style); written mostly 1883, completed Jan 1884"
  corpusSurface: "PSS Tom 23 (work pp. 304–465; plans & variants p. 512; commentary by V. F. Savodnik pp. 548–560); diaries Tom 49 (1883); letters Tom 63 (1882–84); echo Tom 26 (О верах, 1886)"
  dateRange: "1882 (Engelhardt letter, genesis) – 1906 (first legal Russian printing); émigré full text Geneva/Elpidine 1880s–1900; translation lineage from 1885"

# ── Evidence ledger (primary; byte-faithful) ────────────────────────────────
# extract paths are relative to this file's directory.
evidence:

  # — The work's own text: PSS Tom 23, pp. 304–465 —
  - id: believe-text-01
    genre: work
    pssTom: 23
    pages: "304 (opening)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Я прожил на свете 55 лет и, за исключением 14 или 15 детских, 35 лет я прожил нигилистом в настоящем значении этого слова, то есть не социалистом и революционером, как обыкновенно понимают это слово, а нигилистом в смысле отсутствия всякой веры."
    quoteEn: "(working English) I have lived 55 years in the world and, apart from the 14 or 15 of childhood, I lived 35 years a nihilist in the real sense of the word — not a socialist and revolutionary, as the word is usually understood, but a nihilist in the sense of the absence of any faith."
    significance: "The opening: the autobiographical frame and the internal age-marker (55 → 1883) that dates the writing. Picks up exactly where A Confession leaves off."

  - id: believe-text-02
    genre: work
    pssTom: 23
    pages: "304 (opening)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Пять лет тому назад я поверил в учение Христа — и жизнь моя вдруг переменилась: мне перестало хотеться того, чего прежде хотелось, и стало хотеться того, чего прежде не хотелось."
    quoteEn: "(working English) Five years ago I came to believe in Christ's teaching — and my life suddenly changed: I ceased to want what I had wanted before, and began to want what I had not wanted before."
    significance: "The bridge from A Confession (which the A-Confession dive cites as the doctrinal sequel's opening). 'Five years ago' → the 1878 crisis onset."

  - id: believe-text-03
    genre: work
    pssTom: 23
    pages: "ch. I (the larger works)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "О том, почему я прежде не понимал учения Христа и как и почему я понял его, я написал два большие сочинения: Критику догматического богословия и новый перевод и соединение четырех Евангелий с объяснениями."
    quoteEn: "(working English) On why I did not understand Christ's teaching before, and how and why I came to understand it, I have written two large works: the Critique of Dogmatic Theology and a new translation and harmony of the four Gospels with explanations."
    significance: "Tolstoy names the two preceding panels of the project from within this one — explicitly places What I Believe third in the sequence."

  - id: believe-text-04
    genre: work
    pssTom: 23
    pages: "ch. I (the key)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Я понял в первый раз, что центр тяжести всей мысли в словах: «не противься злу», а что последующее есть только разъяснение первого положения."
    quoteEn: "(working English) I understood for the first time that the centre of gravity of the whole thought lies in the words 'resist not evil,' and that what follows is only an elucidation of that first proposition."
    significance: "The keystone of the book: Matthew V:39 read literally. «Не противься злу» is 'the key that opened everything' for Tolstoy."

  - id: believe-text-05
    genre: work
    pssTom: 23
    pages: "ch. II"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Не противься злому — значит не противься злому никогда, т. е. никогда не делай насилия, т. е. такого поступка, который всегда противоположен любви."
    quoteEn: "(working English) Resist not evil — means resist not evil ever, that is, never do violence, that is, never do an act that is always the opposite of love."
    significance: "The literal reading spelled out: non-resistance = a total renunciation of violence (насилие). The doctrine the censor would call subversive of the state."

  - id: believe-text-06
    genre: work
    pssTom: 23
    pages: "ch. III"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Личная моя жизнь переплетена с общей государственной, а государственная требует от меня нехристианской деятельности, прямо противной заповеди Христа."
    quoteEn: "(working English) My personal life is interwoven with the common life of the state, and the state demands of me un-Christian activity directly contrary to Christ's commandment."
    significance: "The pivot from personal salvation to politics: non-resistance is not a private counsel but a verdict on courts, army, the state. The grenadier and the rabbi anecdotes dramatize it."

  - id: believe-text-07
    genre: work
    pssTom: 23
    pages: "ch. VI (the five commandments)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "И вот эти пять заповедей его действительно дают этот мир людям. Все пять заповедей имеют только одну эту цель — мира между людьми."
    quoteEn: "(working English) And these five commandments of his do really give people this peace. All five commandments have only this one aim — peace among people."
    significance: "The doctrinal core: the Sermon on the Mount distilled to five binding commandments (be not angry; no lust/divorce; swear no oaths; resist not evil; love all without national distinction). Their single aim is peace."

  - id: believe-text-08
    genre: work
    pssTom: 23
    pages: "ch. VI (first commandment)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "И вот вместо туманных, подлежащих толкованиям и произволу, неопределенных и неважных выражений открылась мне с стиха 21—28 простая, ясная и определенная первая заповедь Христа: живи в мире со всеми людьми, никогда своего гнева на людей не считай справедливым."
    quoteEn: "(working English) And so, instead of vague, arbitrarily interpretable, indefinite and unimportant expressions, there opened to me from verses 21–28 the simple, clear and definite first commandment of Christ: live in peace with all people, never consider your anger at people just."
    significance: "The first commandment, and Tolstoy's textual argument that the word «напрасно» ('without cause', Matt 5:22) is a corrupting interpolation that guts the commandment."

  - id: believe-text-09
    genre: work
    pssTom: 23
    pages: "ch. VI (third commandment)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Ведь если учение Христа в том, чтобы исполнять всегда волю бога, то как же может человек клясться, что он будет исполнять волю человека?"
    quoteEn: "(working English) For if Christ's teaching is to do always the will of God, then how can a person swear that he will do the will of a man?"
    significance: "The third commandment — swear no oaths — and its political edge: the oath of allegiance is the mechanism by which men make themselves instruments of state violence. Recapitulated in ch. XII as the third 'snare'."

  - id: believe-text-10
    genre: work
    pssTom: 23
    pages: "ch. VIII / XII (the credo)"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Я верю в учение Христа, и вот в чем моя вера."
    quoteEn: "(working English) I believe in Christ's teaching, and this is what my faith consists in."
    significance: "The opening line of the concluding chapter XII — the 'Я верю…' credo that answers the book's title and recapitulates the five commandments as five 'snares' (соблазны) renounced."

  - id: believe-text-11
    genre: work
    pssTom: 23
    pages: "ch. XII (close)"
    date: "1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Не бойся, малое стадо, ибо отец ваш благоволил дать вам царство (Лук. XII, 32)."
    quoteEn: "(working English) Fear not, little flock, for it is your Father's good pleasure to give you the kingdom (Luke XII, 32)."
    significance: "The final words of the book — the 'true church' is the community of those who do the commandments, not those who say 'Lord, Lord.' Followed by the colophon «Москва. 22 января 1884 г.»"

  - id: believe-text-12
    genre: work
    pssTom: 23
    pages: "ch. I"
    date: "1883–1884"
    extract: extracts/v23_304_465_V_chem_moja_vera.txt
    quoteRu: "Работа эта продолжается уже шестой год. Каждый год, каждый месяц я нахожу новые и новые уяснения и подтверждения основной мысли, исправляю вкравшиеся в мою работу, от поспешности и увлеченья, ошибки, исправляю их и дополняю то, что сделано."
    quoteEn: "(working English) This work has been going on for a sixth year now. Every year, every month I find new clarifications and confirmations of the basic thought, correct the errors that crept into my work from haste and enthusiasm, correct them and supplement what has been done."
    significance: "Tolstoy's self-description of the project's pace from inside the work — 'a sixth year' (counting from ~1878), the strain and ongoing correction that the diaries and letters of 1883 corroborate."

  # — Composition-window diaries: PSS Tom 49 (1883) —
  - id: believe-diary-01
    genre: diary
    pssTom: 49
    pages: "64–65"
    date: "1883-03-09 (OS)"
    extract: extracts/v49_1883_03_09.txt
    quoteRu: "Письмо Черткова — вызывает написать о заповедях для народа. Кажется, что надо. Это захватило меня, но не знаю."
    quoteEn: "(working English) A letter from Chertkov — urges me to write about the commandments for the people. It seems I must. It has seized me, but I don't know."
    significance: "The proximate catalyst of the project: V. G. Chertkov's letter of 9 March 1883 turns the long-gestating gospel work toward 'the commandments for the people' — the Sermon-on-the-Mount scaffold of What I Believe. Complicates the commentary's Engelhardt-only genesis."

  - id: believe-diary-02
    genre: diary
    pssTom: 49
    pages: "88"
    date: "1883-04-28 (OS)"
    extract: extracts/v49_1883_04_28.txt
    quoteRu: "Утром опять попытался. И решительно — не могу продолжать свою статью. Тонкости, и потому будет ложь."
    quoteEn: "(working English) In the morning I tried again. And decisively — I cannot continue my article. Subtleties, and therefore it will be a lie."
    significance: "The composition strain from inside the writing year: the work stalls on its own over-subtlety. The criterion 'тонкости — потому будет ложь' is the one driving his repeated rewrites of the chapters on oaths and courts."

  - id: believe-diary-03
    genre: diary
    pssTom: 49
    pages: "86"
    date: "1883-04-23 (OS)"
    extract: extracts/v49_1883_04_23.txt
    quoteRu: "Как не противиться злу? Всё то же. Хочется знать истину и осуждать других, но делать ее не хочется."
    quoteEn: "(working English) How not to resist evil? Always the same. One wants to know the truth and to judge others, but not to do it."
    significance: "The book's central doctrine as a live struggle in his own conduct — «не противься злому» is not yet a settled position but a daily difficulty during composition."

  # — Composition-window letters: PSS Tom 63 (1882–84). Body text recovered via --notes=auto. —
  - id: believe-let-01
    genre: letter
    pssTom: 63
    pages: "112–128"
    date: "1882-12-20 – 1883-01-20 (OS)"
    addressee: "M. A. Engelhardt"
    extract: extracts/v63_140.txt
    quoteRu: "1) Не сердись; 2) Не блядуй; 3) Не клянись; 4) Не судись и 5) Не воюй. Воть в чем для меня сущность учения Христа."
    quoteEn: "(working English) 1) Do not be angry; 2) Do not fornicate; 3) Do not swear oaths; 4) Do not go to law; 5) Do not make war. That is the essence of Christ's teaching for me."
    significance: "The doctrinal seed of the whole book, stated outright a year before it was finished — the five commandments as Tolstoy's own distillation of the Sermon on the Mount. The unsent reply to Engelhardt that the commentary identifies as the genesis."

  - id: believe-let-02
    genre: letter
    pssTom: 63
    pages: "112–128"
    date: "1882-12-20 – 1883-01-20 (OS)"
    addressee: "M. A. Engelhardt"
    extract: extracts/v63_140.txt
    quoteRu: "коротенькая 3-я заповедь ( Матф. 5, 38, 39) не противиться злу, т. е. злом не отвечать на зло — есть не скажу главное, но есть смыкающее звено всего учения"
    quoteEn: "(working English) the brief third commandment (Matt. 5:38, 39) — resist not evil, i.e. do not answer evil with evil — is, I won't say the main thing, but the linking link of the whole teaching."
    significance: "Non-resistance as «смыкающее звено всего учения» — the architectural claim the finished book makes in ch. I ('the centre of gravity'). The letter pre-states the book's thesis."

  - id: believe-let-03
    genre: letter
    pssTom: 63
    pages: "149–152"
    date: "1884-01-10 (OS)"
    addressee: "A. N. Pypin"
    extract: extracts/v63_184.txt
    quoteRu: "Не могу себе представить, чтò сделает цензура. Пропустить нельзя. Не пропустить тоже, мне кажется, в их видах нельзя."
    quoteEn: "(working English) I cannot imagine what the censorship will do. To pass it is impossible. Not to pass it, it seems to me, is also against their interest."
    significance: "Written the day Tolstoy delivered the last sheets to the printer (the completion date). The censorship double-bind stated precisely, weeks before the 14 Feb 1884 ban."

  - id: believe-let-04
    genre: letter
    pssTom: 63
    pages: "155–157"
    date: "1884-02-19 (OS)"
    addressee: "A. S. Buturlin"
    extract: extracts/v63_199.txt
    quoteRu: "Она вышла и запрещена; но не сожжена, а увезена в Петербург, где, сколько мне известно, те, которые запретили ее, разбирают ее по экземплярам и читают. И то хорошо. У меня есть и будут рукописные экземпляры — плачу я за переписку по 15 р."
    quoteEn: "(working English) It came out and was banned; but not burned — taken to Petersburg, where, as far as I know, those who banned it are sharing the copies among themselves and reading it. That is something at least. I have and will have manuscript copies — I pay 15 rubles for the copying."
    significance: "The ban from Tolstoy's own hand the day after the seizure: not burned but confiscated, read by the very censors, and routed around through paid manuscript copies — the suppression that failed."

  - id: believe-let-05
    genre: letter
    pssTom: 63
    pages: "159–161"
    date: "1884-03-02 (OS)"
    addressee: "N. N. Ge (the painter)"
    extract: extracts/v63_202.txt
    quoteRu: "мы переживаем не период проповеди Христа, не период воскресения, a период распинания."
    quoteEn: "(working English) we are living through not the period of Christ's preaching, not the period of resurrection, but the period of crucifixion."
    significance: "Tolstoy's own image for the moment after the ban, answering a drawing by the painter N. N. Ge — the suppressed book as a crucifixion the teaching will survive."

  - id: believe-let-06
    genre: letter
    pssTom: 63
    pages: "200–202"
    date: "1884 (OS; exact date undetermined)"
    addressee: "Countess A. A. Tolstaya"
    extract: extracts/v63_291.txt
    quoteRu: "Весь смысл моих писаний тот, что я высказываю свою, свою личную веру и нетолько не говорю, что помимо моей веры нет спасения, но признаю, что всякая вера хороша, если она искренна, и непременно соединяет нас в делах любви."
    quoteEn: "(working English) The whole meaning of my writings is that I express my own, my personal faith — and not only do I not say that outside my faith there is no salvation, but I acknowledge that every faith is good if it is sincere, and surely unites us in works of love."
    significance: "Tolstoy's self-definition at the height of the controversy, to his devout Orthodox cousin: the title's question («в чём моя вера?») answered as a confession of personal, not dogmatic, faith — against the charge of «учительствование» (preaching at others)."

  - id: believe-let-07
    genre: letter
    pssTom: 63
    pages: "200–202"
    date: "1884 (OS; exact date undetermined)"
    addressee: "Countess A. A. Tolstaya"
    extract: extracts/v63_291.txt
    quoteRu: "Одни — либералы и естетики считают меня сумашедшим или слабоумным в роде Гоголя; другие — революционеры, радикалы считают меня мистиком, болтуном; правительственные люди считают меня зловредным революционером; православные считают меня диаволом."
    quoteEn: "(working English) Some — liberals and aesthetes — think me mad or feeble-minded like Gogol; others — revolutionaries, radicals — think me a mystic, a windbag; government people think me a noxious revolutionary; the Orthodox think me the devil."
    significance: "The reception of What I Believe in one sentence — refused from every quarter at once. A primary-source map of the book's isolation, in Tolstoy's own catalogue."

  - id: believe-let-08
    genre: letter
    pssTom: 63
    pages: "454–455"
    date: "1883-12 / 1884-01 (OS)"
    addressee: "Kushnerev printing house"
    extract: extracts/v63_607.txt
    quoteRu: "Прошу все верстать. Все лежит по порядку. Первые 9 гранок вы прислали мне не исправив."
    quoteEn: "(working English) Please make up everything into pages. Everything is laid out in order. The first 9 galleys you sent me without correcting."
    significance: "The production note to the printer that set the suppressed first edition — the work physically in type in Dec 1883/Jan 1884, corroborating the commentary's galley chronology."

  - id: believe-let-09
    genre: letter
    pssTom: 63
    pages: "175–176"
    date: "1884-06-06 (OS)"
    addressee: "an unknown rifle-ensign (reader)"
    extract: extracts/v63_229.txt
    quoteRu: "это не мои (Льва Николаевича) мысли, а это истина Божеская, которая лежит в сердце вашем, в моем, в сердце всех людей."
    quoteEn: "(working English) these are not my (Lev Nikolaevich's) thoughts, but God's truth, which lies in your heart, in mine, in the hearts of all people."
    significance: "Early reception in the manuscript channel: a serving military officer, changed by reading the banned book, writes to Tolstoy about his service — and Tolstoy refuses the role of life-planner, pointing him to the truth in his own conscience. Evidence the text was reaching soldiers by mid-1884."

