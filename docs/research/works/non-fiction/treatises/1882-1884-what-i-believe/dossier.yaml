# ── Scholarship (secondary layer — Phase 3) ─────────────────────────────────
scholarship:
  summary: >-
    English-language biography treats What I Believe (often as "My Religion") as the
    systematic sequel to A Confession — the place where non-resistance hardens from
    experience into doctrine — and the Maude translation (1921) packages the two as a
    unit. Two scholarly axes matter for this dive. (1) Continuity vs. break: Simmons's
    and Wilson's "two Tolstoys" / crisis-break frame subordinates the work as a symptom
    of the rupture; Medzhibovskaya's "long conversion" (2008) and Gustafson's coherence
    thesis (1986) instead read it as the systematic statement the long arc arrives at —
    the readings closest to the corpus. (2) The non-resistance ethic: Christoyannopoulos,
    Stepanova and D'Amato take it as a coherent programme; Wilson frames it as "a counsel
    of craziness," a critical inversion the corpus answers (the book argues *against* the
    impracticality objection, not toward it). The "Christian anarchism" label is the
    scholars' taxonomy (Christoyannopoulos), to be attributed, not adopted. On reception,
    the censorship chain and church-refutation literature are PSS-documented; the 1901
    Synod edict names no individual works (Kolstø 2022 the authoritative recent account).
  triangulation:
    - evidenceRef: believe-text-03
      conventionalView: "What I Believe is the systematic sequel to A Confession and part of the religious-period sequence; the two are read as a unit."
      relation: confirms
      source: "Maude, A Confession and What I Believe (Oxford, 1921); Simmons, Leo Tolstoy II (1946)"
    - evidenceRef: believe-text-04
      conventionalView: "Non-resistance (Matt 5:38–42) is the pivot of Tolstoy's religious-political teaching and of his place in the Christian-anarchist tradition."
      relation: extends
      source: "Christoyannopoulos, 'Tolstoy the Peculiar Christian Anarchist' (2008) & Christian Anarchism (2010); Stepanova (2020); D'Amato (2015)"
    - evidenceRef: believe-text-08
      conventionalView: "The five commandments are recognized as Tolstoy's doctrinal core, but the textual-critical argument that «напрасно» (Matt 5:22) is a corrupting interpolation is generally not developed at the corpus's level of precision."
      relation: extends
      source: "Christoyannopoulos, Christian Anarchism (2010)"
    - evidenceRef: believe-let-01
      conventionalView: "The work is presented as arising from the gospel study of 1879–82; standard biographies do not identify the Dec-1882 Engelhardt letter and Chertkov's 9 Mar 1883 prompting as the two precise anchors of its genesis."
      relation: extends
      source: "Simmons, Leo Tolstoy II (1946); Bartlett, Tolstoy: A Russian Life (2011)"
    - evidenceRef: believe-let-04
      conventionalView: "Scholarship notes the 1884 ban and the Geneva publication, but the tidy 'suppressed → Geneva' story elides the documented dispersal of the seized edition into the libraries of the officials who banned it."
      relation: complicates
      source: "Bartlett, Tolstoy (2011); Simmons, Leo Tolstoy II (1946); cf. Bakhmetyev's account in PSS Tom 23 apparatus"

