  # --- Concepts ---
  - name: 'Spiritualism (спиритизм) as superstition of the educated'
    wikiType: concept
    wikilinkTarget: 'Spiritualism'
    vaultStatus: missing
    role: 'The 1860s–80s Russian séance vogue — mediums, the "spiritual ether," scientist-believers (Butlerov, Wagner) against the sceptic Mendeleev — which Tolstoy satirised as the type-specimen of superstition surviving among the educated classes. The play''s central target and the irony of its title.'
    sources: []
    evidenceRefs: [fe-investigation, fe-prof-mediumism, fe-fedor-superstition, fe-let-apollov, fe-let-wagner]
    ingestionPriority: 2
    dependsOn: []
  # --- Institutions ---
  - name: 'Society of Art and Literature (Общество искусства и литературы)'
    wikiType: institution
    wikilinkTarget: 'Society of Art and Literature'
    vaultStatus: missing
    role: 'Stanislavski''s amateur theatre society; its Feb 1891 production of the comedy (Stanislavski as Zvezdintsev) was his first independent directorial work and a step toward the founding of the Moscow Art Theatre (1898).'
    sources: []
    evidenceRefs: []
    ingestionPriority: 3
  - name: 'Alexandrinsky Theatre'
    wikiType: institution
    wikilinkTarget: 'Alexandrinsky Theatre'
    vaultStatus: missing
    role: 'St Petersburg Imperial theatre; gave the first public/Imperial performance of the comedy on 26 September 1891, once the stage ban was eased to the Imperial stage.'
    sources: []
    evidenceRefs: [fe-com-stageban]
    ingestionPriority: 3
  - name: 'Main Administration for Press Affairs'
    wikiType: institution
    wikilinkTarget: 'Main Administration for Press Affairs'
    vaultStatus: missing
    role: 'The imperial censorship body (under E. M. Feoktistov) that, after Alexander III''s ruling, banned the comedy from the public stage (circular 28 Apr 1890) while permitting amateur performance — the same apparatus that handled The Power of Darkness and The Kreutzer Sonata.'
    sources: []
    evidenceRefs: [fe-com-stageban]
    ingestionPriority: 3
  # --- Events ---
  - name: 'The séance at N. A. Lvov''s flat'
    wikiType: event
    wikilinkTarget: 'Séance at Lvov''s flat'
    vaultStatus: missing
    role: 'The Moscow spiritualist séance (≤1886) Tolstoy attended on his own initiative — the seed of the play. Failed; confirmed his scorn for spiritualism.'
    sources: []
    evidenceRefs: [fe-com-seance, fe-com-milk]
    ingestionPriority: 3
    dependsOn: ['N. A. Lvov']
  - name: 'Yasnaya Polyana amateur première (30 Dec 1889)'
    wikiType: event
    wikilinkTarget: 'The Fruits of Enlightenment première (1889)'
    vaultStatus: missing
    role: 'The first performance — a home theatrical got up by Tatyana Lvovna, directed by Davydov, cast from the young Tolstoys and their circle; the satirised class staging its own satire.'
    sources: []
