topic:
  slug: 1886-1890-the-fruits-of-enlightenment
  title: 'The Fruits of Enlightenment (Плоды просвещения, 1886–1890)'
  question: >-
    A --novel work-subject dive (drama flex) on Tolstoy's four-act comedy. Marquee: The Fruits of
    Enlightenment is the satirical INVERSE of The Power of Darkness — where the tragedy was written
    FOR the people (peasant speech, the people's stage) and failed to reach them, the comedy was
    written BY and FOR Tolstoy's own class (the Yasnaya Polyana family theatre, then the court at
    Tsarskoye Selo) to laugh at itself, using the peasants not as audience but as the MORAL MEASURE
    against which the "enlightened" gentry's spiritualist idleness is judged. The title's irony
    makes it Tolstoy's comic anti-pseudo-science companion to What Is Art?; the stage-only ban then
    literally confined a play mocking the gentry to amateur (gentry) performance.
  date: '2026-06-11'
  period: Prophet
  corpusSurface: 'works (PSS Tom 27, pp. 95–250) · the two plans + the first redaction «Исхитрилась!» + variants (Tom 27, pp. 433–480) · editorial commentary «История писания» (Tom 27, pp. 647–670) · diaries (Toms 49–51, 1884–1890) · letters (Toms 64–65, 1889–1890)'
  dateRange: '1886 (séance source + first plans) — 1890 (final redaction, proofs); amateur première 30 Dec 1889; first publication 1891; reception to the Maly transfer (Dec 1891) and beyond'

evidence:
  # ---- The play's own text (PSS Tom 27, pp. 95–250) ----
  - id: fe-investigation
    genre: work
    pssTom: 27
    pages: '~118'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Но мы и не требуем веры. Мы требуем исследованья.'
    quoteEn: '(working English) "But we do not require faith. We require investigation." (Leonid Fyodorovich Zvezdintsev to the sceptic Sakhatov, Act 1.)'
    significance: 'The gentry-spiritualist''s self-justification: spiritualism dressed as empirical science ("we require investigation"). The play''s satire of pseudo-science is stated by its dupe in Act 1.'
    facsimile: ''
  - id: fe-land-need
    genre: work
    pssTom: 27
    pages: '~110'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Земля наша малая, не то что скотину, — курицу, скажем, и ту выпустить некуда.'
    quoteEn: '(working English) "Our land is so small that — not to speak of cattle — there''s nowhere even to let out a chicken." (The 3rd Peasant, pleading, Act 1.)'
    significance: 'The peasant land-hunger that is the play''s real subject — repeated as a refrain through all four acts. The material need against which the gentry''s séances are measured.'
    facsimile: ''
  - id: fe-yum
    genre: work
    pssTom: 27
    pages: '~106'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Тем более, что лицом он очень похож на Юма. Вы помните Юма? — белокурый, наивный.'
    quoteEn: '(working English) "All the more so as in face he much resembles Home. You remember Home? — fair-haired, naïve." (Leonid Fyodorovich, declaring the peasant-lad Semyon a medium, Act 1.)'
    significance: 'The play names the celebrity medium D. D. Home (Юм) — the real spiritualism vogue glimpsed inside the fiction. Leonid Fyodorovich reads the village lad as a "medium" by resemblance to Home.'
    facsimile: ''
  - id: fe-tanya-believed
    genre: work
    pssTom: 27
    pages: '~135'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Поверил, поверил! (Взвизгивает, прыгает.) Ей-Богу, поверил! Вот чудо-то! (Взвизгивает.) Теперь сделаю, только бы Семен не сробел.'
    quoteEn: '(working English) "He believed me, he believed me! (Squeals, jumps.) By God, he believed me! What a wonder! (Squeals.) Now I''ll do it, if only Semyon doesn''t lose his nerve." (The maid Tanya, alone, Act 1.)'
    significance: 'The plot engine: Tanya has persuaded the master that the peasant-lad Semyon is a medium, and will fake the séance phenomena to get the land deed signed. The servant''s wit drives the play.'
    facsimile: ''
  - id: fe-fedor-superstition
    genre: work
    pssTom: 27
    pages: '~170'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Народные суеверия, грубые, истребляются, суеверия домовых, колдунов, ведьм... А ведь если вникнуть, ведь это такое же суеверие.'
    quoteEn: '(working English) "Folk superstitions — coarse ones — are being stamped out: the superstitions of house-spirits, sorcerers, witches... And yet, if you look into it, this [spiritualism] is just the same kind of superstition." (Fyodor Ivanych, the valet, alone, Act 3.)'
    significance: 'The play''s plain-sense verdict, given to the educated servant: the gentry''s fashionable spiritualism is the same superstition as the peasant beliefs being "stamped out." Ends "Удивительна слабость человеческая!" ("Amazing — human weakness!").'
    facsimile: ''
  - id: fe-coaching
    genre: work
    pssTom: 27
    pages: '~183'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'как бумага на стол падет — я еще в колокольчик позвоню, — так ты сейчас же руками вот так... Разведи шире и захватывай. Кто возле сидит, того и захватывай. А как захватишь, так жми.'
    quoteEn: '(working English) "...when the paper falls on the table — I''ll also ring the little bell — then at once with your hands like this... Spread them wide and grab. Whoever sits beside you, grab them. And once you''ve grabbed, squeeze." (Tanya coaching Semyon for the séance, Act 3.)'
    significance: 'The mechanics of the fraud: Tanya, hidden, will throw the land-deed onto the séance table and ring a bell; Semyon, the "medium," is to seize and squeeze whoever is next to him until the master signs. The hoax is wholly stage-managed by the servants.'
    facsimile: ''
  - id: fe-prof-mediumism
    genre: work
    pssTom: 27
    pages: '~200'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'один из таких новых, мало известных видов энергии и исследуется нами. Я говорю об энергии медиумизма.'
    quoteEn: '(working English) "...one of these new, little-known kinds of energy is what we are investigating. I speak of the energy of mediumism." (Professor Krugosvetlov''s lecture, the séance, Act 3.)'
    significance: 'The centrepiece of the pseudo-science satire: the Professor derives "the energy of mediumism" and a "spiritual ether" (proven by the invented "genius Hermann Schmidt and Joseph Schmatzhofen") whose particles are "the souls of the living, the dead, and the unborn." Materialist science pressed into the service of superstition.'
    facsimile: ''
  - id: fe-signed
    genre: work
    pssTom: 27
    pages: '~228'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Оказывается что землю-то надо уступить крестьянам на их условиях.'
    quoteEn: '(working English) "It turns out the land must be ceded to the peasants on their terms." (Leonid Fyodorovich to Fyodor Ivanych, after the séance, Act 3.)'
    significance: 'The hoax succeeds: the "spirit" Nikolai has commanded the master to sign the deed Tanya threw on the table. The land is sold — by a fraud worked through the master''s own credulity.'
    facsimile: ''
  - id: fe-prof-unfalsifiable
    genre: work
    pssTom: 27
    pages: '~248'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'может быть, она что-нибудь и делала, но то, что она делала, — делала она, то, что было проявлением медиумической энергии, — было проявлением медиумической энергии.'
    quoteEn: '(working English) "...maybe she did do something, but what she did, she did; and what was a manifestation of mediumic energy was a manifestation of mediumic energy." (Professor Krugosvetlov, told the maid faked it all, Act 4.)'
    significance: 'The satirical climax: confronted with proof of the fraud, the believer cannot be disabused — the girl''s trick merely "solicited" the genuine medium-energy. The unfalsifiability of pseudo-science, exposed by making it absurd.'
    facsimile: ''
  - id: fe-far-europe
    genre: work
    pssTom: 27
    pages: '~248'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Да, как еще мы далеки от Европы!'
    quoteEn: '(working English) "Yes — how far we still are from Europe!" (Professor Krugosvetlov''s exit line, Act 4.)'
    significance: 'The title''s irony in one line: the Europhile "enlightened" man laments Russia''s backwardness — while he is the superstitious dupe. "Enlightenment" inverted.'
    facsimile: ''
  - id: fe-oldcook
    genre: work
    pssTom: 27
    pages: '~155'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Я у плиты тридцать лет прожарился. А вот не нужен стал: издыхай, как собака!.. Как же, пожалеют!'
    quoteEn: '(working English) "I roasted thirty years at the stove. And now I''m not needed: die like a dog!.. Pity, indeed!" (The Old Cook, a cast-off ex-chef, the servants'' kitchen, Act 2.)'
    significance: 'The human cost beneath the comedy: the Old Cook — once chef to the Emperor — discarded, dying of drink and cold, kept alive only by the kitchen-maid''s pity. The casualty of the idle gentry the séance-farce sits atop.'
    facsimile: ''
  - id: fe-made-people
    genre: work
    pssTom: 27
    pages: '~250'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Она нас людьми изделала; а то бы что? земля малая, не то что скотину, — курицу, скажем, и ту выпустить некуда.'
    quoteEn: '(working English) "She made us into human beings; for what else? — the land is so small that, not to speak of cattle, there''s nowhere even to let out a chicken." (The 3rd Peasant of Tanya, the final scene, Act 4.)'
    significance: 'The peasants'' verdict on Tanya: the servant-girl''s trick has won them the land and "made them into people." The moral weight is given to the servants and peasants, not the masters.'
    facsimile: ''
  - id: fe-without-her
    genre: work
    pssTom: 27
    pages: '~250'
    date: '1890'
    extract: extracts/v27_095_250_Plody_prosveschenija.txt
    quoteRu: 'Да благодарите Таню. Кабы не она, быть бы вам без земли.'
    quoteEn: '(working English) "Thank Tanya. Had it not been for her, you''d be without land." (Fyodor Ivanych, the valet, the final scene, Act 4.)'
    significance: 'The kind valet closes the play crediting Tanya — confirming the comedy''s moral hierarchy: practical intelligence and decency belong to the servants, folly to the masters.'
    facsimile: ''
  # ---- The plans (PSS Tom 27, pp. 433–437) ----
  - id: fe-plan-lvov
    genre: work
    pssTom: 27
    pages: '433'
    date: '1886'
    extract: extracts/v27_433_435_Pervyj_plan.txt
    quoteRu: 'вертит блюдечко о земле крестьянам. Самарин неверующий.'
    quoteEn: '(working English) "[Lvov] spins the saucer about the peasants'' land. Samarin the unbeliever." (The first plan of the comedy, Act 1.)'
    significance: 'The genesis in the draft: the spiritualist master is named outright «Львов» (Lvov, the real séance host) and the sceptic «Самарин» (Samarin, a real séance-goer). The whole mechanism — séance vs. the peasants'' land — is present from the first plan.'
    facsimile: ''
  # ---- The first redaction «Исхитрилась!» (PSS Tom 27, pp. 438–475) ----
  - id: fe-ishitrilas-title
    genre: work
    pssTom: 27
    pages: '438'
    date: '1886'
    extract: extracts/v27_438_475_Ishitrilas.txt
    quoteRu: 'ИСХИТРИЛАСЬ!'
    quoteEn: '(working English) "SHE CONTRIVED IT!" (Title of the first redaction.)'
    significance: 'The keystone variant: the first redaction was titled «Исхитрилась!» — named for the maid''s trick, a plot-farce. Its cast is far smaller; the heavy social-satire layer (the Professor''s pseudo-science, the mind-reader, the dying Old Cook, the microbe-panic) was added only after the Dec 1889 staging, in 1890. The retitling «Исхитрилась!» → «Плоды просвещения» tracks the work''s growth from servant''s-trick farce into class-satire.'
    facsimile: ''
  # ---- Editorial commentary «История писания» (PSS Tom 27, pp. 647–670; Sreznevsky) ----
  - id: fe-com-seance
    genre: commentary
    pssTom: 27
    pages: '647'
    date: '1886'
    extract: extracts/v27_commentary_fruits.txt
    quoteRu: 'спиритического сеанса, бывшего в Москве на квартире Н. А. Львова, куда Толстой был приглашен по собственной инициативе.'
    quoteEn: '(working English) "...a spiritualist séance held in Moscow at the flat of N. A. Lvov, to which Tolstoy had had himself invited on his own initiative." (Editorial commentary.)'
    significance: 'The documented source: the séance at N. A. Lvov''s Moscow flat (no later than spring 1886; Lvov died 1887), attended by Tolstoy on his own initiative, with P. F. Samarin, K. Yu. Milioti, and N. V. Davydov (who described it). Lvov → Zvezdintsev, Samarin → Sakhatov.'
    facsimile: ''
  - id: fe-com-milk
    genre: commentary
    pssTom: 27
    pages: '647'
    date: '1886'
    extract: extracts/v27_commentary_fruits.txt
    quoteRu: 'что верить в то, что из моей трости, если я ее пососу, потечет молоко, чего никогда не было и быть не может'
    quoteEn: '(working English) "...[it is just the same] as believing that if I suck my walking-stick, milk will flow from it — which has never happened and cannot happen." (Tolstoy before the séance, reported by N. V. Davydov.)'
    significance: 'Tolstoy went to the séance already a scoffer; the play grew from contempt, not curiosity. The cane-and-milk simile is his pre-séance verdict on spiritualism.'
    facsimile: ''
  - id: fe-com-simultaneous
    genre: commentary
    pssTom: 27
    pages: '648'
    date: '1886'
    extract: extracts/v27_commentary_fruits.txt
    quoteRu: 'работа над комедией была начата осенью 1886 г., одновременно или почти одновременно с работой над «Властью тьмы»'
    quoteEn: '(working English) "...work on the comedy was begun in the autumn of 1886, simultaneously or almost simultaneously with the work on The Power of Darkness." (Editorial commentary.)'
    significance: 'The matched pair, literal: the comedy (as «Исхитрилась!») and the tragedy The Power of Darkness were begun in the same season — the apparatus elsewhere notes, in the same notebook — both sparked by A. A. Stakhovich reading Ostrovsky and Gogol aloud at Yasnaya. The tragedy and the comedy of Tolstoy''s Prophet years are twins.'
    facsimile: ''
  - id: fe-com-staging
    genre: commentary
    pssTom: 27
    pages: '660'
    date: '1889-12-30'
    extract: extracts/v27_commentary_fruits.txt
    quoteRu: 'Первое представление комедии в Ясной поляне состоялось 30 декабря 1889'
    quoteEn: '(working English) "The first performance of the comedy at Yasnaya Polyana took place on 30 December 1889." (Editorial commentary; Old Style.)'
    significance: 'The amateur première — a home theatrical got up by the daughter Tatyana Lvovna, directed by N. V. Davydov, cast almost entirely from the young Tolstoys and their friends. The play''s first audience was the satirised class itself.'
    facsimile: ''
  - id: fe-com-staging-cast
    genre: commentary
    pssTom: 27
    pages: '661'
    date: '1889-12-30'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'М. Л. Толстую — кухарку, А. М. Новикова — буфетчика Якова, С. А. Лопухина — Звездинцева, С. Э. Мамонову — толстую барыню, Н. В. Давыдова — профессора Кругосветлова, Т. Л. Толстую — Таню'
    quoteEn: '(working English) "...M. L. Tolstaya as the cook, A. M. Novikov as the butler Yakov, S. A. Lopukhin as Zvezdintsev, S. E. Mamonova as the fat lady, N. V. Davydov as Professor Krugosvetlov, T. L. Tolstaya as Tanya." (Editorial commentary, the 30 Dec 1889 cast.)'
    significance: 'The author''s own daughters played the maid Tanya (Tatyana) and the cook (Maria); the satirised gentry roles were taken by the family and its circle. The casting is the marquee made literal.'
    facsimile: ''
  - id: fe-com-prototypes
    genre: commentary
    pssTom: 27
    pages: '655'
    date: '1890'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'Звездинцев и Сахатов, прототипами для которых послужили Н. А. Львов и П. Ф. Самарин. ... фамилия профессора звучала сначала Кутлер, затем Кутлеров, т. е. созвучно с фамилией знаменитого химика и в то же время спирита академика и профессора — А. М. Бутлерова'
    quoteEn: '(working English) "...Zvezdintsev and Sakhatov, whose prototypes were N. A. Lvov and P. F. Samarin. ...the professor''s surname sounded at first Kutler, then Kutlerov — i.e. consonant with the surname of the famous chemist and at the same time spiritualist, academician and professor A. M. Butlerov." (Editorial commentary.)'
    significance: 'The prototype chain: Zvezdintsev←Lvov, Sakhatov←Samarin, and Professor Krugosvetlov''s draft name Кутлеров echoing the chemist-spiritualist A. M. Butlerov (d. 1886). The satire of "scientific" spiritualism had real targets — which Tolstoy then denied (see fe-let-wagner).'
    facsimile: ''
  - id: fe-com-uncensored
    genre: commentary
    pssTom: 27
    pages: '665'
    date: '1891'
    extract: extracts/v27_commentary_fruits.txt
    quoteRu: 'Впервые «Плоды просвещения» были напечатаны, видимо без каких-либо цензурных изъятий, в книге «В память Юрьева. Сборник, изданный друзьями покойного». М. 1891'
    quoteEn: '(working English) "The Fruits of Enlightenment was first printed — apparently without any censorship excisions — in the book In Memory of [S. A.] Yuryev. A collection issued by the late man''s friends, Moscow 1891." (Editorial commentary.)'
    significance: 'First publication: 1891, in Russia, in Tolstoy''s lifetime, uncensored — corrects the works-record stub (publishedDuringLifetime / publishedInRussiaDuringLifetime were false → both true). Reprinted the same year in Part 13 of the collected works.'
    facsimile: ''
  - id: fe-com-stageban
    genre: commentary
    pssTom: 27
    pages: '667'
    date: '1890-04-26'
    extract: extracts/v27_commentary_fruits.txt
    quoteRu: 'эту пьесу неудобною для сцены, на любительских же театрах она может быть разрешена'
    quoteEn: '(working English) "[His Majesty is pleased to find] this play unsuitable for the [public] stage, but on amateur theatres it may be permitted." (Alexander III''s resolution, in Minister Durnovo''s hand, on the report of 26 April 1890 [OS].)'
    significance: 'The stage-only ban: print was free, but Alexander III barred the public stage while permitting amateur performance — a play mocking the idle gentry confined to performance by the gentry. The Feoktistov circular (28 Apr 1890) enforced it; the public stage opened only at the Alexandrinsky on 26 Sept 1891, general permission 1894. The exact shape the bans[].scope=stage-ban value was added for.'
    facsimile: ''
  # ---- Diaries & letters (PSS Toms 49–51, 64–65) ----
  - id: fe-diary-lvov-1884
    genre: diary
    pssTom: 49
    pages: '84'
    date: '1884-04-19'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'Львов рассказывал о Блавацкой, переселении душ, силах духа, белом слоне, присяге новой вере. Как не сойти с ума при таких впечатлениях?'
    quoteEn: '(working English) "Lvov told [me] of Blavatsky, transmigration of souls, spirit-forces, the white elephant, the oath to a new faith. How can one not go mad amid such impressions?" (Diary, 19 April 1884.)'
    significance: 'The séance host N. A. Lvov in person — Tolstoy''s source for the theosophy-and-spirits milieu the play satirises, recorded two years before composition began. (TEI filename says 1883; the bibl header and PSS commentary fix it to 19 April 1884 — see needsReview.)'
    facsimile: ''
  - id: fe-ge-three-works
    genre: letter
    pssTom: 64
    pages: '392'
    date: '1889-06-23'
    addressee: 'N. N. Ge (father and son)'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'Пишу и комедию,² и повесть,³ и об искусстве.⁴'
    quoteEn: '(working English) "I am writing both the comedy, and a story, and about art." (To N. N. Ge, 23 June 1889.)'
    significance: 'The comedy was written in parallel with the story (The Kreutzer Sonata) and the treatise (What Is Art?, then in progress) — the three projects of 1889 share a workshop. Grounds the What-Is-Art companion link as contemporaneity.'
    facsimile: ''
  - id: fe-annenkova-tanya
    genre: letter
    pssTom: 64
    pages: '479'
    date: '1889-12-25'
    addressee: 'L. F. Annenkova'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'которая у меня давно была набросана. Таня дочь затеяла спектакль и попросила у меня, я согласился и вот поправил ее кое-как, и вот они играют у нас на праздниках.'
    quoteEn: '(working English) "...quite unexpectedly I took up a comedy I had long ago sketched. My daughter Tanya got up a play and asked me for it; I agreed and patched it up somehow, and now they are performing it over the holidays." (To L. F. Annenkova, 25 December 1889.)'
    significance: 'The genesis of the staged version in Tolstoy''s own words: written for the family theatre, at his daughter Tatyana''s request — not for the people or a public stage. The marquee''s "by and for the class" point, from the author.'
    facsimile: ''
  - id: fe-biryukov-mocks
    genre: letter
    pssTom: 64
    pages: '484'
    date: '1889-12-31'
    addressee: 'P. I. Biryukov'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'Делали с спокойной совестью в усиленной мере то самое, что осмеивается комедией. Маша играла кухарку необыкновенно хорошо'
    quoteEn: '(working English) "With clear consciences we were doing, in heightened measure, the very thing the comedy ridicules. Masha played the cook remarkably well." (To P. I. Biryukov, 31 December 1889.)'
    significance: 'The deepest, self-aware irony of the marquee, in Tolstoy''s own voice: the family staging the satire of idle gentry amusement was itself an idle gentry amusement — "in heightened measure" — and he knew it. The satirist caught inside his satire''s target, and naming it.'
    facsimile: ''
  - id: fe-diary-shame
    genre: diary
    pssTom: 50
    pages: '194'
    date: '1889-12-27'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'Мне же всё время стыдно, стыдно за эту безумную трату среди нищеты.'
    quoteEn: '(working English) "I myself am ashamed the whole time — ashamed of this senseless extravagance amid poverty." (Diary, 27 December 1889, of the staging.)'
    significance: 'Tolstoy''s shame at the staging — the senseless gentry expense amid surrounding poverty, the exact contrast the play draws between the séance and the peasants'' landlessness, felt in his own household.'
    facsimile: ''
  - id: fe-diary-shameful
    genre: diary
    pssTom: 50
    pages: '116'
    date: '1889-08-02'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'Дома взялся было за комедию, но противно и совестно.'
    quoteEn: '(working English) "At home I took up the comedy, but [it is] repugnant and shameful." (Diary, 2 August 1889.)'
    significance: 'Tolstoy''s recurrent self-disparagement of the comedy across the years of composition — art as a "low and seductive occupation" in the Prophet-period frame (cf. the Kreutzer Sonata / What Is Art? mood).'
    facsimile: ''
  - id: fe-diary-trash
    genre: diary
    pssTom: 51
    pages: '37'
    date: '1890-04-13'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'Очень скучно, комедия плоха — дребедень.'
    quoteEn: '(working English) "Very dull; the comedy is poor — trash." (Diary, 13 April 1890, at a Tula rehearsal.)'
    significance: 'Tolstoy''s own verdict on the work even as it triumphed — the author''s later judgment is contempt, not pride, despite the comedy''s stage success.'
    facsimile: ''
  - id: fe-let-wagner
    genre: letter
    pssTom: 65
    pages: '51'
    date: '1890-03-25'
    addressee: 'N. P. Wagner'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'И главное мое с годами всё усиливающееся отвращение, от которого я не отрекаюсь, ко всяким суевериям, к которым я причисляю спиритизм.'
    quoteEn: '(working English) "And the main thing is my hatred, growing with the years, which I do not renounce, of every kind of superstition, among which I count spiritualism." (To the zoologist-spiritualist N. P. Wagner, 25 March 1890.)'
    significance: 'The apology to Wagner (who took Professor Krugosvetlov as a libel on himself and Butlerov): Tolstoy denies a personal portrait but states the play''s purpose outright — his deepening hatred of superstition, spiritualism included. The anti-pseudo-science marquee, from the author. Also restates the genesis (the daughters asked to play it).'
    facsimile: ''
  - id: fe-let-apollov
    genre: letter
    pssTom: 65
    pages: '23'
    date: '1890-02-22'
    addressee: 'A. I. Apollov'
    extract: extracts/witness_1886_1890_diaries_letters.txt
    quoteRu: 'не только среди неученых, но и среди, ученых классов (пример — спиритизм)'
    quoteEn: '(working English) "...not only among the unlearned but among the educated classes too (example — spiritualism)." (To A. I. Apollov, 22 February 1890.)'
    significance: 'Tolstoy names spiritualism as the type-specimen of superstition surviving among the EDUCATED — the precise target of a play whose title calls such superstition the "fruits of enlightenment."'
    facsimile: ''

entities:
  # --- Characters (fictional; prototypes[] = fiction→life edge) ---
  - name: Tanya (Tatyana Markovna)
    wikiType: character
    wikilinkTarget: 'Tanya (The Fruits of Enlightenment)'
    vaultStatus: missing
    role: 'The young maid — an orphan of the peasants'' own village, in love with the peasant-lad Semyon — who engineers the land sale by faking the séance phenomena. The play''s practical, decent intelligence; its protagonist and the title of its first redaction («Исхитрилась!» = "she contrived it").'
    sources: []
    evidenceRefs: [fe-tanya-believed, fe-coaching, fe-made-people, fe-without-her]
    ingestionPriority: 1
    prototypes:
      - person: ''
        name: ''
        basis: editorial
        certainty: conjectured
        note: 'No documented life-prototype; an invented figure (the clever-servant type). Played at the 1889 première by Tolstoy''s daughter T. L. Tolstaya — casting, not a prototype.'
        sourceId: ''
  - name: Leonid Fyodorovich Zvezdintsev
    wikiType: character
    wikilinkTarget: 'Leonid Zvezdintsev (The Fruits of Enlightenment)'
    vaultStatus: missing
    role: 'The retired-officer landowner, master of the house, devout believer in spiritualism, who lavishes money on séances while refusing the peasants land; the séance "spirits" he trusts command him to sign the deed.'
    sources: []
    evidenceRefs: [fe-investigation, fe-yum, fe-signed, fe-plan-lvov, fe-com-prototypes]
    ingestionPriority: 1
    prototypes:
      - person: ''
        name: 'N. A. Lvov'
        basis: editorial
        certainty: documented
        note: 'The host of the real séance Tolstoy attended; in the first two plans the character bears Lvov''s actual surname. The PSS editors state the prototype; the draft naming makes it documented.'
        sourceId: ''
  - name: Professor Krugosvetlov
    wikiType: character
    wikilinkTarget: 'Professor Krugosvetlov (The Fruits of Enlightenment)'
    vaultStatus: missing
    role: 'The scientist who explains the séance phenomena as "the energy of mediumism" / a "spiritual ether" — the embodiment, in Tolstoy''s phrase, of the comic contradiction between strict scientific method and the most fantastical assertions. Even shown the fraud, he cannot be disabused.'
    sources: []
    evidenceRefs: [fe-prof-mediumism, fe-prof-unfalsifiable, fe-far-europe, fe-com-prototypes, fe-let-wagner]
    ingestionPriority: 1
    prototypes:
      - person: ''
        name: 'A. M. Butlerov'
        basis: editorial
        certainty: probable
        note: 'The draft surname Кутлер→Кутлеров echoes the chemist-and-spiritualist academician A. M. Butlerov (d. 1886). Tolstoy explicitly DENIED portraying Butlerov or his friend N. P. Wagner (letter, 25 Mar 1890), calling the professor "a personification of comic contradiction" — so this is a name-source/composite, NOT a documented portrait. Do not overclaim.'
        sourceId: ''
  - name: Grossman
    wikiType: character
    wikilinkTarget: 'Grossman (The Fruits of Enlightenment)'
    vaultStatus: missing
    role: 'The travelling hypnotist / thought-reader who, blindfolded, "finds" the hidden spoon in a terrified peasant''s bag (Act 2) and "vibrates" in sympathy with the medium at the séance.'
    sources: []
    evidenceRefs: [fe-com-prototypes]
    ingestionPriority: 2
    prototypes:
      - person: ''
        name: 'O. I. Feldman'
        basis: editorial
        certainty: documented
        note: 'Based on the celebrity hypnotist O. I. Feldman, whom Tolstoy met (Apr 1889; diary "Шарлатанство"). The PSS editors trace the development Шпюлер→Гросман to that meeting; the final touches were a soundalike surname and "a brunet of Jewish type." The Maly actor Garin-Vinding played him made up to look like Feldman, who sued.'
        sourceId: ''
  - name: Sakhatov
    wikiType: character
    wikilinkTarget: 'Sakhatov (The Fruits of Enlightenment)'
    vaultStatus: missing
    role: 'The urbane sceptic — a former deputy minister — who attends the séance unconvinced, catches Tanya''s thread, but "reserves his opinion." The play''s on-stage doubter.'
    sources: []
    evidenceRefs: [fe-plan-lvov, fe-com-prototypes]
    ingestionPriority: 2
    prototypes:
      - person: ''
        name: 'P. F. Samarin'
        basis: editorial
        certainty: documented
        note: 'In the first two plans the sceptic bears the surname Samarin — P. F. Samarin, a real attendee of the Lvov séance. PSS editors state the prototype.'
        sourceId: ''
  - name: Semyon
    wikiType: character
    wikilinkTarget: 'Semyon (The Fruits of Enlightenment)'
    vaultStatus: missing
    role: 'The healthy young buffet-peasant taken for a "medium"; Tanya''s betrothed and the unwitting instrument of the séance hoax. A son of the 2nd Peasant; returns to the village to marry Tanya.'
    sources: []
    evidenceRefs: [fe-coaching, fe-yum]
    ingestionPriority: 2
    prototypes:
      - person: ''
        name: ''
        basis: editorial
        certainty: conjectured
        note: 'No documented life-prototype; the village-lad type. Present from the first plan (as "Семка").'
        sourceId: ''
  # --- Persons (real figures in genesis / staging / reception) ---
  - name: 'N. A. Lvov'
    wikiType: person
    wikilinkTarget: 'Nikolai Lvov'
    vaultStatus: missing
    role: 'Host of the spiritualist séance (Moscow, ≤1886) that Tolstoy attended on his own initiative; died 1887. The source impression of the play and the prototype of Zvezdintsev; in person in the 1884 diary expounding Blavatsky.'
    sources: []
    evidenceRefs: [fe-com-seance, fe-diary-lvov-1884, fe-plan-lvov]
    ingestionPriority: 2
  - name: 'P. F. Samarin'
    wikiType: person
    wikilinkTarget: 'Pyotr Samarin'
    vaultStatus: missing
    role: 'Attendee of the Lvov séance; the prototype of the sceptic Sakhatov (his surname is the character''s draft name).'
    sources: []
    evidenceRefs: [fe-com-seance, fe-plan-lvov]
    ingestionPriority: 3
  - name: 'N. V. Davydov'
    wikiType: person
    wikilinkTarget: 'Nikolai Davydov'
    vaultStatus: missing
    role: 'Tula prosecutor and Tolstoy''s friend; séance attendee who described it in his memoirs; director of the 30 Dec 1889 Yasnaya staging and player of Professor Krugosvetlov; secured the Tula stage permit. (The same Davydov who supplied the Koloskov case for The Power of Darkness.)'
    sources: []
    evidenceRefs: [fe-com-seance, fe-com-staging-cast]
    ingestionPriority: 2
  - name: 'A. M. Butlerov'
    wikiType: person
    wikilinkTarget: 'Aleksandr Butlerov'
    vaultStatus: missing
    role: 'Eminent chemist (structural theory) and convinced spiritualist (d. 1886); the name-source for Professor Krugosvetlov (Кутлеров). With Wagner, the leading St-Petersburg scientist-spiritualist; hosted the medium D. D. Home in 1871.'
    sources: []
    evidenceRefs: [fe-com-prototypes, fe-let-wagner]
    ingestionPriority: 3
  - name: 'N. P. Wagner'
    wikiType: person
    wikilinkTarget: 'Nikolai Wagner'
    vaultStatus: missing
    role: 'Zoologist and convinced spiritualist, Butlerov''s friend; heard the comedy read (12 Mar 1890), took Professor Krugosvetlov as a libel on himself and Butlerov, and protested (13 Mar 1890). Tolstoy apologised (25 Mar 1890) while affirming his hatred of spiritualism.'
    sources: []
    evidenceRefs: [fe-let-wagner]
    ingestionPriority: 3
  - name: 'O. I. Feldman'
    wikiType: person
    wikilinkTarget: 'Osip Feldman'
    vaultStatus: missing
    role: 'Celebrity hypnotist / thought-reader Tolstoy met in April 1889 ("charlatanry," diary); the prototype of the character Grossman. Later sued the Maly actor Garin-Vinding for the look-alike makeup.'
    sources: []
    evidenceRefs: [fe-com-prototypes]
    ingestionPriority: 3
  - name: 'T. L. Tolstaya'
    wikiType: person
    wikilinkTarget: 'Tatyana Tolstaya'
    vaultStatus: exists
    role: 'Tolstoy''s eldest daughter; initiated the 30 Dec 1889 home theatrical on returning from abroad, asked her father for the play, and played the maid Tanya. The proximate cause of the staged comedy.'
    sources: []
    evidenceRefs: [fe-annenkova-tanya, fe-com-staging-cast]
    ingestionPriority: 2
  - name: 'M. L. Tolstaya'
    wikiType: person
    wikilinkTarget: 'Maria Tolstaya'
    vaultStatus: exists
    role: 'Tolstoy''s daughter; played the cook at the 30 Dec 1889 première "remarkably well" (Tolstoy to Biryukov).'
    sources: []
    evidenceRefs: [fe-biryukov-mocks, fe-com-staging-cast]
    ingestionPriority: 3
  - name: 'A. A. Stakhovich'
    wikiType: person
    wikilinkTarget: 'Alexander Stakhovich'
    vaultStatus: missing
    role: 'Theatre-lover whose reading-aloud of Ostrovsky and Gogol at Yasnaya (mid-Oct 1886) prompted Tolstoy to begin the play — the same spark as The Power of Darkness.'
    sources: []
    evidenceRefs: [fe-com-simultaneous]
    ingestionPriority: 3
  - name: 'V. M. Lopatin'
    wikiType: person
    wikilinkTarget: 'Vladimir Lopatin'
    vaultStatus: missing
    role: 'Then a justice of the peace, later a Moscow Art Theatre actor; played the 3rd Peasant so well at the 1889 staging that Tolstoy expanded the role.'
    sources: []
    evidenceRefs: [fe-com-staging-cast]
    ingestionPriority: 3
  - name: 'K. S. Stanislavski'
    wikiType: person
    wikilinkTarget: 'Konstantin Stanislavski'
    vaultStatus: missing
    role: 'Staged the comedy for his amateur Society of Art and Literature (Feb 1891), playing Zvezdintsev — by his own account his first independent directorial work, and a Moscow event that impressed the future Moscow Art Theatre co-founder Nemirovich-Danchenko.'
    sources: []
    evidenceRefs: []
    ingestionPriority: 2
