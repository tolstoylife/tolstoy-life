      value: 'Print free and uncensored (1891). A stage-only ban: Alexander III ruled the play unsuitable for the public stage but permitted on amateur theatres (Apr 1890); the Feoktistov circular enforced it (28 Apr 1890 OS, reaffirmed 11 Mar 1891 after an unauthorised Kharkov staging). The public stage opened at the Imperial Alexandrinsky (26 Sept 1891 OS); a general permission followed in 1894. The dramatic censor had cleared the Tula amateur staging with a few words cut, including «монах».'
