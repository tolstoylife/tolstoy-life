scholarship:
  summary: >-
    The English-language reception of The Fruits of Enlightenment (Tolstoy's title; the Maude
    translation circulates it as The Fruits of Culture) is unusually warm for late Tolstoy and
    strikingly uniform: it is read as his one successful stage comedy and the natural pendant to
    the tragedy The Power of Darkness of the same years. Ernest J. Simmons (Introduction to
    Tolstoy's Writings, 1968, ch. 11) calls it "a merry comedy in four acts, in which high society
    and spiritualism were blisteringly satirized," with "wonderful peasant characters … who
    provided a combination of farce and genuine distress over their lack of land" — naming the two
    targets the literature consistently identifies: the spiritualist idleness of the gentry and the
    land question the three peasants embody. Reference works file the play as social satire of "the
    persistence of unenlightened attitudes towards the peasants amongst the Russian landed
    aristocracy" (Wikipedia) and place it in the Russian social-comedy line of Gogol and Ostrovsky
    (themselves heirs to Molière) — reinforced by the primary record, since Stakhovich's reading of
    Gogol and Ostrovsky aloud sparked the play. The single most-cited fact in the English reception
    is the Stanislavski connection: his amateur Society of Art and Literature staging of February
    1891, playing Zvezdintsev himself, was "his first fully independent directorial work" and a
    Moscow event that impressed the future Moscow Art Theatre co-founder Nemirovich-Danchenko
    (Britannica; Stanislavski, My Life in Art) — so the comedy sits in the documented MAT
    prehistory. The deeper spiritualism context (the scientist-spiritualists Butlerov and Wagner,
    Mendeleev's 1875–76 debunking commission, the medium D. D. Home) is well documented in the
    history-of-science literature but is NOT in the PSS Tom 27 apparatus, and is therefore
    attributed strictly to general scholarship, never to the PSS.
  triangulation:
    - evidenceRef: fe-biryukov-mocks
      conventionalView: 'The English literature instinctively pairs the two plays as the comic/tragic twins of the same years (Simmons treats both in one chapter; the comedy "contrasts sharply with" the tragedy) and reads the comedy as gentry self-satire with the peasants as the wise foil — but it does NOT draw the audience-inversion (written-for-the-people vs. written-by-the-class) as sharply as the dive, which depends on the project''s own Power of Darkness dive.'
      relation: extends
      source: 'Simmons (1968), ch. 11 ("contrasts sharply"); the project''s Power of Darkness dive; PSS Tom 27 apparatus (Yasnaya family theatre → Tsarskoye Selo court, no peasant audience).'
    - evidenceRef: fe-com-prototypes
      conventionalView: 'History-of-science scholarship independently documents Butlerov (chemist) and Wagner (zoologist) as the two eminent St-Petersburg scientist-spiritualists of exactly this milieu, divided from the sceptic Mendeleev — corroborating the PSS-stated prototype from outside the apparatus.'
      relation: confirms
      source: 'Encyclopedia.com, "A. M. Butlerov"; the 1875–76 Mendeleev commission record; Annals of Science (2025) on the Russian scientist-spiritualist milieu.'
    - evidenceRef: fe-land-need
      conventionalView: 'Reference works lead with this reading: the play satirises "unenlightened attitudes towards the peasants amongst the Russian landed aristocracy" (Wikipedia); Simmons names the peasants'' "genuine distress over their lack of land."'
      relation: confirms
      source: 'Wikipedia, "The Fruits of Enlightenment" (accessed June 2026); Simmons (1968), ch. 11.'
    - evidenceRef: fe-ge-three-works
      conventionalView: 'The English literature reads the spiritualism satire but does not routinely tie the comedy forward to the aesthetics treatise; the title''s irony (плоды просвещения = "fruits of enlightenment") and the parallel composition with What Is Art? make the false-enlightenment continuity the dive''s synthesis.'
      relation: extends
      source: 'The project''s What Is Art? dive; the 23 Jun 1889 letter to Ge (comedy + story + "about art" in parallel).'
    - evidenceRef: fe-com-stageban
      conventionalView: 'The English-language reception is largely silent on the stage ban (neither the Wikipedia nor the Britannica entry mentions Alexander III''s ruling); the censorship story is carried by the PSS apparatus and the Raskolnikov 1928 archival study, not the mainstream.'
      relation: extends
      source: 'PSS Tom 27 apparatus (Durnovo report to Alexander III, 26 Apr 1890; Feoktistov circular, 28 Apr 1890); F. Raskolnikov, Krasnaya nov no. 11 (1928).'
    - evidenceRef: fe-diary-trash
      conventionalView: 'Simmons reports exactly Tolstoy''s resistance — staging "was an amusement of rich and idle people," the work "insignificant and weak" — consistent with the self-disparaging letters and diary.'
      relation: confirms
      source: 'Simmons (1968), ch. 11; PSS Tom 27 letters/diary.'

