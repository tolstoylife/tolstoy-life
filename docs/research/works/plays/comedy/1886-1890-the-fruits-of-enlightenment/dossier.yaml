    - field: synopsis
      value: 'In a rich Moscow household gripped by a fashionable belief in spiritualism, three Kursk peasants wait for the landowner''s signature on a land sale he keeps refusing. The maid Tanya, in love with a peasant-lad, exploits the household''s séance mania: she persuades the master that the lad is a "medium" and, hidden, fakes the séance phenomena so that the "spirits" command him to sign the deed. He does; the land is sold; Tanya wins her marriage. A four-act comedy satirising the idle, superstitious gentry against the practical good sense of the servants and the real need of the peasants — the bitter "fruits of enlightenment."'
      evidenceRefs: [fe-tanya-believed, fe-signed, fe-made-people]
      source: 'dive synthesis from the play text'
      confidence: high
      note: 'Proposed; the record''s prose body already carries a similar summary.'
