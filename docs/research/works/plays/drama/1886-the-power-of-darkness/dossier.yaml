    phase: 3
    why: 'Secondary-source discrepancy; the PSS commentary says only "в Париже в Théâtre libre".'
  - item: 'European stagings beyond Paris (Geneva, Amsterdam, Milan, Rome, Turin, Venice, Genoa, Berlin) are named in the PSS commentary as a list but without dates; specific productions/dates unverified.'
    phase: 3
    why: 'The commentary lists cities; no per-city dates. Do not assert individual premières.'
  - item: 'A common secondary claim credits Stanislavski with prompting the variant Act 4 (for an intended 1895 production). The PSS apparatus dates the variant to Dec 1886, sixteen years earlier, prompted by literati/theatre-people (A. K. Chertkova''s memoir). The dive follows the apparatus; flag the secondary error.'
    phase: 3
    why: 'Primary record contradicts a circulating secondary attribution.'
