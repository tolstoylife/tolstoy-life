topic:
  slug: 1886-the-power-of-darkness
  title: 'The Power of Darkness (Власть тьмы, 1886)'
  question: >-
    A --novel work-subject dive (drama flex) on Tolstoy's five-act peasant tragedy.
    Marquee: the play enacts the chain-of-sin doctrine («коготок увяз, всей птичке
    пропасть») in peasant speech and locates redemption not in the naturalist horror
    (the infanticide that drove the censors) but in Akim's inarticulate moral truth
    and Nikita's public confession — "art for the people" practised a decade before
    What Is Art? (1897–98) theorised it.
  date: '2026-06-10'
  period: Prophet
  corpusSurface: 'works (PSS Tom 26) · letters (Toms 63–64) · diaries (Tom 49) · editorial commentary (Tom 26) · in-circle biography (Biryukov vol. III)'
  dateRange: '1886 (composition) — 1895 (Russian stage première); reception to 1902 (MAT)'

evidence:
  # ---- The play's own text (PSS Tom 26, pp. 123–243) ----
  - id: vt-epigraph
    genre: work
    pssTom: 26
    pages: '123'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'А я говорю вам, что всякий, кто смотрит на женщину с вожделением, уже прелюбодействовал с нею в сердце своем.'
    quoteEn: '(working English) "But I say unto you, that whosoever looketh on a woman to lust after her hath committed adultery with her already in his heart." (Matthew 5:28 — the epigraph the censor struck from the printed text.)'
    significance: 'The epigraph (Matt. 5:28–29) frames the whole play around the INTERNAL origin of sin — adultery of the heart — the first claw of the chain. Cut by censorship; restored only in the 1913 Biryukov edition.'
    facsimile: ''
  - id: vt-akim-deceive-god
    genre: work
    pssTom: 26
    pages: '~140'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'От людей утаишь, а от Бога не утаишь.'
    quoteEn: '(working English) "You can hide it from people, but you cannot hide it from God." (Akim to Nikita, Act 1.)'
    significance: 'Akim — the inarticulate, God-fearing father — states the moral law at the outset: the wrong done to the orphan Marina cannot be hidden from God. The conscience the chain of sin will override.'
    facsimile: ''
  - id: vt-akim-bank
    genre: work
    pssTom: 26
    pages: '~159'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'Бог трудиться велел. А ты, значит, тае, положил в банку деньги, да и спи, а деньги тебя, значит, тае, поваля кормить будут. Скверность это, значит, не по закону это.'
    quoteEn: '(working English) "God bade us labour. But you, see, tae, put money in the bank and sleep, and the money, tae, lying down, will feed you. That''s vileness, that is, that''s not by the law." (Akim, Act 3 — the usury speech the censor circled.)'
    significance: 'Akim''s inarticulate but morally penetrating attack on living off money instead of labour — the "bank" discourse the theatrical censor marked. The play''s positive doctrine voiced through a stammering peasant.'
    facsimile: ''
  - id: vt-anisya-smother
    genre: work
    pssTom: 26
    pages: '~232'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'Задуши скорей, не будет живой.'
    quoteEn: '(working English) "Smother it quick, it won''t stay alive." (Anisya, throwing the newborn into the cellar, Act 4.)'
    significance: 'The nadir of the chain of sin: Anisya forces Nikita to kill the infant — "your business, you finish it." The crime the prototype case supplied.'
    facsimile: ''
  - id: vt-board
    genre: work
    pssTom: 26
    pages: '~233'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'Доской прикрыл, на доску сел. Кончил, должно.'
    quoteEn: '(working English) "He covered it with a board, sat on the board. Finished it, must have." (Anisya, watching, Act 4.)'
    significance: 'The infanticide itself — narrated, off-stage in the cellar. The scene Pobedonostsev and Feoktistov fixed on as unstageable.'
    facsimile: ''
  - id: vt-ne-chelovek
    genre: work
    pssTom: 26
    pages: '~235'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'Как запищит, да как захрустят эти косточки[…]не человек я стал.'
    quoteEn: '(working English) "The way it squealed, and the way those little bones crunched — kr... kr... I am no longer a man." (Nikita, variant Act 4.)'
    significance: 'Nikita''s breaking point. The crunching of the bones is the play''s most harrowing line; the murder undoes him — the chain of sin destroys the man who let himself be led.'
    facsimile: ''
  - id: vt-matrena-chorus
    genre: work
    pssTom: 26
    pages: '~233'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'О-ох! И рад бы не грешить, а что сделаешь?'
    quoteEn: '(working English) "Oh-oh! Glad enough not to sin, but what can you do?" (Matryona, on the cellar step, Act 4.)'
    significance: 'Matryona''s worldly accommodation — the voice that rationalises every link in the chain. The mother who facilitates the evil with folk-proverb comfort.'
    facsimile: ''
  - id: vt-mitrich-women
    genre: work
    pssTom: 26
    pages: '~217'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'Вашей сестры в России большие миллионы, а все как кроты слепые, — ничего не знаете.'
    quoteEn: '(working English) "There are great millions of your sisters in Russia, and all like blind moles — you know nothing." (Mitrich to little Anyutka, variant Act 4.)'
    significance: 'Mitrich — the retired soldier Tolstoy added late to serve "the function of the chorus of ancient Greek tragedy" — carries the variant Act 4''s indirect horror through his drunken aria on the abandonment of peasant women.'
    facsimile: ''
  - id: vt-confession
    genre: work
    pssTom: 26
    pages: '~242'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'На погребице доской ребеночка ее задушил.'
    quoteEn: '(working English) "In the cellar I smothered her little child with a board." (Nikita''s public confession at the wedding, Act 5.)'
    significance: 'The turn: Nikita confesses everything publicly at the wedding feast, refusing to let Akulina shield him — "Forgive me, Orthodox world!"'
    facsimile: ''
  - id: vt-kogotok
    genre: work
    pssTom: 26
    pages: '~243'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'говорил ты мне: «коготок увяз и всей птичке пропасть», не послушал я, пес, твоего слова, и вышло по-твоему.'
    quoteEn: '(working English) "You told me: ''a claw caught, the whole bird is lost'' — I did not heed your word, dog that I am, and it came out as you said." (Nikita to his father Akim, Act 5.)'
    significance: 'THE doctrinal keystone. Nikita names the subtitle-proverb as Akim''s Act-1 warning come true — the chain of sin traced back to its first lustful link. The proverb bookends the play.'
    facsimile: ''
  - id: vt-akim-transfig
    genre: work
    pssTom: 26
    pages: '~243'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'Себя не пожалел, Он тебя пожалеет.'
    quoteEn: '(working English) "You did not spare yourself — He will spare you." (Akim, "в восторге"/in rapture, embracing his son, Act 5.)'
    significance: 'The redemption — located not in the horror but in the self-not-sparing public confession, blessed by the inarticulate father. Tolstoy coached the actor Svobodin that Akim must "come to rapture at his son''s deed."'
    facsimile: ''
  - id: vt-final-line
    genre: work
    pssTom: 26
    pages: '~243'
    date: '1886'
    extract: extracts/v26_123_243_Vlast_tmy.txt
    quoteRu: 'Всё я один сделал. Мой и умысел, мое и дело.'
    quoteEn: '(working English) "I did it all alone. Mine the intent, mine the deed." (Nikita, bound, final line before the curtain.)'
    significance: 'The original closing line the PSS (1936) restored, rejecting Chertkov''s softened "От меня всё. Мой грех, мое и дело." Tolstoy: in folk speech "мой умысел" means he owns the guilt in the spiritual sense, not the legal.'
    facsimile: ''
  # ---- The plan (PSS Tom 26, pp. 533–534) ----
  - id: plan-kogotok-seed
    genre: work
    pssTom: 26
    pages: '534'
    date: '1886'
    extract: extracts/v26_533_534_plan_dramy.txt
    quoteRu: 'Входит Влас. Кается на коленах. — Вяжите меня. Коготок увяз, и всей птичке пропасть.'
    quoteEn: '(working English) "Vlas enters. Repents on his knees. — Bind me. A claw caught, the whole bird is lost." (The drama plan, Act 5.)'
    significance: 'The night-written plan already carries the doctrine: the protagonist (here named Vlas, later Nikita) ends in kneeling public confession with the proverb. The chain-of-sin reading is original, not a late overlay.'
    facsimile: ''
  # ---- Genesis & composition (editorial commentary, PSS Tom 26, pp. 705–736; Gudzy) ----
  - id: com-rakshanin-fabula
    genre: commentary
    pssTom: 26
    pages: '705'
    date: '1886'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Фабула «Власти тьмы» почти целиком взята мною из подлинного уголовного дела, рассматривавшегося в Тульском суде.'
    quoteEn: '(working English) "The plot of The Power of Darkness is taken by me almost entirely from a real criminal case heard in the Tula court." (Tolstoy to the journalist N. Rakshanin.)'
    significance: 'Author-stated prototype: the Koloskov case (Tula, 1879–80), supplied by prosecutor N. V. Davydov. Tolstoy met the convict Efrem Koloskov twice.'
    facsimile: ''
  - id: com-poisoning-invented
    genre: commentary
    pssTom: 26
    pages: '705'
    date: '1886'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Отравление мужа было придумано мною, но даже главные фигуры навеяны действительным происшествием.'
    quoteEn: '(working English) "The poisoning of the husband was invented by me, but even the main figures were inspired by the actual event." (Tolstoy to Rakshanin.)'
    significance: 'The single invented crime (Pyotr''s poisoning) darkens Anisya beyond her real prototype Marfa Koloskova — Tolstoy reshaped the case to deepen the chain of sin.'
    facsimile: ''
  - id: com-illness
    genre: commentary
    pssTom: 26
    pages: '707'
    date: '1886'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Во время болезни и вынужденного бездействия он и написал «Власть тьмы».'
    quoteEn: '(working English) "It was during this illness and forced inactivity that he wrote The Power of Darkness." (Tolstoy spent ~3 months bedridden with erysipelas after a hay-cart leg injury, autumn 1886.)'
    significance: 'The play was written fast, in a burst of forced rest in autumn 1886, prompted by Lentovsky''s people''s-theatre appeal and Stakhovich''s reading-aloud of Ostrovsky.'
    facsimile: ''
  - id: com-folk-theatre-intent
    genre: commentary
    pssTom: 26
    pages: '708'
    date: '1886'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Так как с самого начала работы над пьесой Толстой предназначал ее для постановки на сцене народного театра'
    quoteEn: '(working English) "Since from the very beginning of work on the play Tolstoy intended it for staging on the people''s-theatre stage..."'
    significance: 'The intent was popular-theatre from the start (M. V. Lentovsky''s Skomorokh). The "art for the people" frame is Tolstoy''s own design.'
    facsimile: ''
  - id: com-sa-diary-act1
    genre: commentary
    pssTom: 26
    pages: '708'
    date: '1886-10-26'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Левочка написал 1-е действие драмы. Я буду переписывать'
    quoteEn: '(working English) "Lyovochka has written the 1st act of the drama. I shall copy it." (S. A. Tolstaya''s diary, 26 October 1886 [OS].)'
    significance: 'Dates composition: Act 1 written 26 Oct 1886; the whole drama drafted within ~two to three weeks, Sofya Andreyevna copying as he wrote.'
    facsimile: ''
  - id: com-chertkov-adultery
    genre: commentary
    pssTom: 26
    pages: '708'
    date: '1886-11-14'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Написал драму на прелюбодеяние. Кажется хорошо'
    quoteEn: '(working English) "I have written a drama on adultery. Seems good." (Tolstoy to V. G. Chertkov, 14 November 1886.)'
    significance: 'Tolstoy''s own one-line description of the finished draft — names adultery (the Matthew-epigraph root) as the subject.'
    facsimile: ''
  - id: com-variant-act4
    genre: commentary
    pssTom: 26
    pages: '709'
    date: '1886-12'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'четвертый акт слишком реалистичен и потому для исполнения на сцене мало пригоден, решил написать вариант последних четырех явлений этого действия. Работа над ним происходила в декабре 1886 г.'
    quoteEn: '(working English) "...the fourth act was too realistic and therefore little suited for stage performance, [so he] decided to write a variant of the last four scenes of that act. Work on it took place in December 1886."'
    significance: 'The keystone variant Act 4 (the indirect, Anyutka-and-Mitrich version) was written in Dec 1886 — sixteen years before Stanislavski''s involvement, correcting a common secondary attribution.'
    facsimile: ''
  - id: com-peasants-not-understood
    genre: commentary
    pssTom: 26
    pages: '708'
    date: '1886-11'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Крестьянами драма не была понята и не произвела на них того впечатления, на которое рассчитывал автор.'
    quoteEn: '(working English) "The drama was not understood by the peasants and did not produce on them the impression the author had counted on." (Of the reading aloud to ~40 Yasnaya Polyana peasants.)'
    significance: 'The central complication of the marquee, in the primary record: the play written FOR the people failed with its first peasant audience.'
    facsimile: ''
  - id: com-above-masses
    genre: commentary
    pssTom: 26
    pages: '714'
    date: '1887-01'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: '«Власть тьмы» вообще выше понимания масс, которым только доступны народные рассказы и поучения Льва Николаевича'
    quoteEn: '(working English) "...The Power of Darkness is altogether above the understanding of the masses, to whom only Lev Nikolaevich''s folk tales and teachings are accessible." (A. A. Stakhovich''s argument to the censor, per his letter to S. A. Tolstaya.)'
    significance: 'The irony at the heart of the censorship win: Chertkov and Stakhovich got the play past the censor for the popular Posrednik edition by arguing the people would not understand it — and used the failed Yasnaya reading as proof.'
    facsimile: ''
  # ---- Publication, censorship, reception (commentary) ----
  - id: com-aleks3-praise
    genre: commentary
    pssTom: 26
    pages: '717'
    date: '1887-01-27'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Александр III остался очень доволен пьесой и после пятого акта воскликнул: «Чудная вещь».'
    quoteEn: '(working English) "Alexander III was very pleased with the play and after the fifth act exclaimed: ''A wonderful thing.''" (Court reading by Stakhovich, 27 Jan 1887.)'
    significance: 'The tsar first praised it and ordered it staged at the imperial theatres — the court audience read its moral centre exactly where the marquee locates it.'
    facsimile: ''
  - id: com-pobedonostsev-zola
    genre: commentary
    pssTom: 26
    pages: '718'
    date: '1887-02-18'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Едва ли сам Золя дошел до такой степени грубого реализма, на какую здесь становится Толстой.'
    quoteEn: '(working English) "Hardly even Zola himself reached such a degree of crude realism as Tolstoy attains here." (K. P. Pobedonostsev to Alexander III, 18 Feb 1887.)'
    significance: 'The Ober-Procurator''s horrified letter — invoking Zola/naturalism and "a negation of the ideal" — reversed the tsar the next day. The naturalism charge comes from the censor''s own mouth.'
    facsimile: ''
  - id: com-aleks3-reversal
    genre: commentary
    pssTom: 26
    pages: '718'
    date: '1887-02-19'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Мое мнение и убеждение, что эту драму на сцене давать невозможно, она слишком реальна и ужасна по сюжету.'
    quoteEn: '(working English) "My opinion and conviction is that this drama is impossible to give on stage — it is too real and horrible in subject." (Alexander III to Pobedonostsev, 19 Feb 1887, reversing himself.)'
    significance: 'The tsar''s about-face the day after Pobedonostsev''s letter — the stage ban that would hold until 1895.'
    facsimile: ''
  - id: com-feoktistov-nerves
    genre: commentary
    pssTom: 26
    pages: '712'
    date: '1887-01-09'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Надо иметь железные нервы, чтобы вынести всё это'
    quoteEn: '(working English) "One must have iron nerves to bear all this." (E. M. Feoktistov, head of the Press Affairs directorate, to S. A. Tolstaya, 9 Jan 1887.)'
    significance: 'The press chief''s verdict on the fourth act — yet he permitted the play for print (13 Jan 1887) while banning the stage.'
    facsimile: ''
  - id: com-publication
    genre: commentary
    pssTom: 26
    pages: '715'
    date: '1887-02'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'в начале февраля 1887 г. драма вышла в свет в издании «Посредника»'
    quoteEn: '(working English) "...in early February 1887 the drama appeared in the Posrednik edition." (Sytin press, Moscow; censorship permission 13 Jan 1887, 12,000 copies.)'
    significance: 'First publication: the cheap popular Posrednik edition, marked "For adults" — the form Tolstoy intended (a 9-kopeck book for the people).'
    facsimile: ''
  - id: com-100000
    genre: commentary
    pssTom: 26
    pages: '715'
    date: '1887'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'в течение первых месяцев 1887 г. «Власть тьмы» была напечатана в количестве свыше 100 000 экземпляров'
    quoteEn: '(working English) "...within the first months of 1887 The Power of Darkness was printed in more than 100,000 copies." (The 5th Posrednik edition alone ran to 40,000 at 3 kopecks.)'
    significance: 'Mass popular circulation despite the stage ban — exactly what alarmed Pobedonostsev ("sold for 10 kopecks by peddlers at every crossroads"). (S. A. Tolstaya''s reminiscence gives 250,000 in three days — see contradictions.)'
    facsimile: ''
  - id: com-title-luke
    genre: commentary
    pssTom: 26
    pages: '715'
    date: '1887'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'видимо, заимствовано из «Евангелия» от Луки, гл. XXII, ст. 53: «Но теперь — ваше время и власть тьмы».'
    quoteEn: '(working English) "...evidently borrowed from the Gospel of Luke, ch. XXII, v. 53: ''But now is your hour, and the power of darkness.''" (The title, supplied late by Tolstoy.)'
    significance: 'The title is Christ''s words at his arrest (Luke 22:53); the original title became the subtitle proverb. Title and epigraph (Matt. 5:28) together frame the play between the hour of darkness and the lustful heart.'
    facsimile: ''
  - id: com-copyright
    genre: commentary
    pssTom: 26
    pages: '715'
    date: '1887-02-23'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: 'Прошу всех печатать где и как хотят, и прав собственности ни я ни мои наследники заявлять не будем'
    quoteEn: '(working English) "I ask everyone to print it where and how they wish, and neither I nor my heirs will declare property rights." (Tolstoy to Chertkov, 23 Feb 1887.)'
    significance: 'Tolstoy renounced literary-property rights on the play immediately after publication — the same copyright renunciation the project dives separately.'
    facsimile: ''
  - id: com-theatre-libre
    genre: commentary
    pssTom: 26
    pages: '720'
    date: '1888-02-10'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: '10 февраля 1888 г. она была поставлена в Париже в «Théâtre libre» в переводе И. Я. Павловского и Оскара Магенье под названием «La Puissance des Ténèbres».'
    quoteEn: '(working English) "On 10 February 1888 it was staged in Paris at the Théâtre Libre, in the translation of I. Ya. Pavlovsky and Oscar Méténier, under the title La Puissance des Ténèbres."'
    significance: 'The world première was abroad — André Antoine''s Théâtre Libre, Paris — and it played Geneva, Berlin, Milan, Rome and elsewhere while still banned from the Russian stage.'
    facsimile: ''
  - id: com-nicholas2-lifts
    genre: commentary
    pssTom: 26
    pages: '719'
    date: '1895-09-15'
    extract: extracts/v26_705_736_commentary.txt
    quoteRu: '15 сентября 1895 г. последовало, помимо Феоктистова и без его ведома, разрешение Николая II на постановку пьесы на императорской сцене.'
    quoteEn: '(working English) "On 15 September 1895 there followed — bypassing Feoktistov and without his knowledge — Nicholas II''s permission to stage the play on the imperial stage."'
    significance: 'The eight-year stage ban ended by the new tsar''s fiat; Russian premières followed Oct–Nov 1895 (Alexandrinsky, Skomorokh, Maly).'
    facsimile: ''
  # ---- Letters (re-extracted clean) ----
  - id: let-great-world
    genre: letter
    pssTom: 64
    pages: '6'
    date: '1887-01'
    addressee: 'A. A. Tolstaya'
    extract: extracts/v64_010_A_A_Tolstoj.txt
    quoteRu: 'будет полезна для тех, для «большого света»[…]для которого я писал ее, но вам она совсем не нужна.'
    quoteEn: '(working English) "...it (the play) will be useful for those, for the ''great world,'' for whom I wrote it, but you have no need of it at all." (Tolstoy to Countess A. A. Tolstaya, ~Jan 1887.)'
    significance: 'The marquee''s decisive complication, in Tolstoy''s own words: by January 1887 he frames the moral TARGET of his "folk" play as the educated upper class — not the peasantry. Folk form, "great world" audience.'
    facsimile: ''
  - id: let-svobodin-akim
    genre: letter
    pssTom: 64
    pages: '24'
    date: '1887-03-05'
    addressee: 'P. M. Svobodin'
    extract: extracts/v64_035_P_M_Svobodinu.txt
    quoteRu: 'В 5-м действии он должен упираться, гнушаясь видом сватьбы, потом начать понимать, в чем дело, потом придти в восторг от поступка сына'
    quoteEn: '(working English) "In Act 5 he must resist, loathing the sight of the wedding, then begin to understand what is happening, then come to rapture at his son''s deed." (Tolstoy directing the actor on how to play Akim.)'
    significance: 'Tolstoy''s own staging note confirms Akim''s arc — resistance → understanding → rapture at the confession — as the play''s spiritual spine. Akim, not the horror, is where the meaning lands.'
    facsimile: ''

entities:
  # --- Characters (fictional; prototypes[] fiction→life edge) ---
  - name: Nikita
    wikiType: character
    wikilinkTarget: 'Nikita (The Power of Darkness)'
    vaultStatus: missing
    role: 'The weak-willed farmhand whose chain of sins (seduction, complicity in poisoning, infanticide) drives the tragedy; ends in public confession.'
    sources: []
    evidenceRefs: [vt-kogotok, vt-ne-chelovek, vt-confession, vt-final-line, com-rakshanin-fabula]
    ingestionPriority: 1
    prototypes:
      - person: ''
        name: 'Efrem Koloskov'
        basis: author-stated
        certainty: documented
        note: 'Tolstoy to Rakshanin names the Koloskov case as the source; but he softened the figure — Nikita is no rapist and is "soft-hearted" in the plan, where Koloskov was "a bad, stern man."'
        sourceId: ''
  - name: Akim
    wikiType: character
    wikilinkTarget: 'Akim (The Power of Darkness)'
    vaultStatus: missing
    role: 'Nikita''s father — the inarticulate, God-fearing peasant (the "тае" speech tic) who voices the play''s moral truth and, in rapture, blesses his son''s confession.'
    sources: []
    evidenceRefs: [vt-akim-deceive-god, vt-akim-bank, vt-akim-transfig, let-svobodin-akim]
    ingestionPriority: 1
    prototypes:
      - person: ''
        name: 'an unnamed old отходник (migrant-labourer) peasant'
        basis: editorial
        certainty: probable
        note: 'N. V. Davydov recalled Tolstoy describing a meek, good-natured old peasant met on the highway around the time of writing; the commentary identifies him as Akim''s prototype.'
        sourceId: ''
  - name: Anisya
    wikiType: character
    wikilinkTarget: 'Anisya (The Power of Darkness)'
    vaultStatus: missing
