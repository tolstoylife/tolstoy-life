scholarship:
  summary: >-
    Mainstream criticism files the play under "naturalism" (English Wikipedia''s genre tag;
    the German 1880s–90s reception that grouped Tolstoy "with Zola and Ibsen"), but the label
    is contested at the source: at Antoine''s 1888 Théâtre Libre première Zola and de Vogüé
    defended the play''s stageability while Dumas fils, Sardou and Augier said it "could only
    be read"; and Stanislavski — who staged it at the MAT in 1902 — held that "realism becomes
    naturalism [only] when it is not justified by the artist from within," judging his own
    production''s external realism unjustified. The most useful modern study (Gatrall 2008)
    argues the moralism and the naturalist surface work together — the murdered child is at
    once "cutting-edge naturalism" and the play''s "moral and artistic climax." Sizova (2023,
    from RGALI) situates the play inside the народность / accessibility-of-art declaration
    "the active creator of which was Tolstoy." The in-circle sources (Biryukov, S. A. Tolstaya)
    frame it not as naturalism or as a temperance tract but as a chain-of-sin drama turning on
    "the lingering force of sin and the brilliance of truth in the humble form of Akim."
  triangulation:
    - evidenceRef: vt-kogotok
      conventionalView: 'Simmons reads the proverb-subtitle as the work''s whole thematic weight ("the terrible evil-begetting power of evil"); Biryukov names the idea "the lingering force of sin and the brilliance of truth in Akim."'
      relation: confirms
      source: 'Simmons, Introduction to Tolstoy''s Writings (1968), ch. 11; Biryukov, Life of Tolstoy, vol. III.'
    - evidenceRef: vt-akim-transfig
      conventionalView: 'The court audience of 27 Jan 1887, per Stakhovich, talked after Act 5 "of Nikita''s heartfelt confession, of Akim''s holy joy" — locating redemption exactly where the marquee does.'
      relation: confirms
      source: 'Stakhovich''s letter, in Biryukov vol. III ch. 6.'
    - evidenceRef: com-folk-theatre-intent
      conventionalView: 'Sizova (2023) places the play inside the 19th-c. "accessibility of art" (народность) declaration of which Tolstoy was "the active creator," anticipating What Is Art?.'
      relation: extends
      source: 'I. I. Sizova, Literaturnyi fakt no. 28 (2023); cf. the project''s What Is Art? dive.'
    - evidenceRef: com-peasants-not-understood
      conventionalView: 'Scholarship treats the play as Tolstoy''s major "folk drama"; the primary record shows its first peasant audience did not understand it and its triumphs were salon, court and student — a gap Tolstoy felt and recorded.'
      relation: complicates
      source: 'Biryukov vol. III chs 6 & 19 (the Yasnaya reading; the Moscow students); Tolstoy to Strakhov, 3 Mar 1887.'
    - evidenceRef: com-pobedonostsev-zola
      conventionalView: 'The "naturalist / Russian Zola" reading is real (German critics; Wikipedia genre tag) but contested by a practitioner (Stanislavski) and complicated by Gatrall (2008): the moral frame and naturalist surface are not rivals.'
      relation: complicates
      source: 'J. Gatrall, Theatre Survey 49.2 (2008); Stanislavski, My Life in Art; cf. the Paris 1888 debate.'

