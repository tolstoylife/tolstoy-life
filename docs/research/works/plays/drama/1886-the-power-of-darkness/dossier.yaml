        sourceId: ''
  - name: Matryona
    wikiType: character
    wikilinkTarget: 'Matryona (The Power of Darkness)'
    vaultStatus: missing
    role: 'Nikita''s mother (orig. Katerina, "a cunning witch"); supplies the poison and rationalises every sin. Tolstoy''s hardest-worked role linguistically (folk proverbs).'
    sources: []
    evidenceRefs: [vt-matrena-chorus]
    ingestionPriority: 2
    prototypes:
      - person: ''
        name: ''
