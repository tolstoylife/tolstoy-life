needsReview:
  - item: "The 'hidden in a chair' anecdote — popular claim that Tolstoy sewed the manuscript into chair upholstery to hide it from Sofia."
    phase: 3
    why: "Not in the PSS commentary (which says the autograph was kept in Petersburg with E. I. Chertkova); a retailer-level embellishment with no traceable scholarly source. Do not assert."
  - item: "The 1911 Posmertnye volume number for The Devil (vol. 1 vs vol. II)."
    phase: 4
    why: "PSS apparatus says vol. 1; a bookseller catalogue says vol. II. The dive follows the PSS. Confirm before ordering a title-page scan."
  - item: "The name of Aksinya Bazykina's son (the diary's «Ермил» vs the biographers' Timofei Bazykin, patronymic Ermilovich)."
    phase: 4
    why: "Tolstoy's 1909 notebook says «Ермил мой сын»; biographical scholarship names the boy Timofei. Genealogy unresolved; cite the diary verbatim, attribute the identification."
  - item: "Liza ↔ Sofia Andreevna as a character prototype."
    phase: 4
    why: "The jealousy/discovery material draws on Sofia, but no author-stated or documented prototype edge exists for Liza; do not mint the link as a fact. Liza may fold into the work's prose."
  - item: "Maria Tolstaya disambiguation (daughter M. L. Obolenskaya vs sister M. N. Tolstaya)."
    phase: 4
    why: "The existing maria-tolstaya page is the daughter (1871–1906); confirm before linking the Obolensky genesis edge. (Same disambig flagged by the Father Sergius dive.)"
  - item: "Character tiering: whether Liza, and the minor figures (the uncle, Varvara Alekseevna, Danila, the steward), earn standalone character nodes."
    phase: 4
    why: "Only Irtenev and Stepanida clearly meet the v1.4 tiering rule (principal + documented prototype). The rest likely fold into the work's prose."

