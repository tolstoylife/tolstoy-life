scholarship:
  summary: >-
    The dominant English-language framing reads The Devil as an autobiographical
    study of uncontrollable male sexual obsession and, to varying degrees, casts
    Stepanida as a dangerous elemental female force — a peasant "femme fatale," the
    title taken literally. The autobiographical basis in the Aksinya Bazykina affair
    is universal consensus (Wilson, Troyat, the Maude preface, which also names the
    Domna incident). The two-ending structure is usually described as Tolstoy's
    personal indecision rather than as a structural argument about where the
    destroying force is located. Møller's Postlude to The Kreutzer Sonata (1988) is
    the key contextual study of the 1890s sexual-morality debate but treats Kreutzer,
    not The Devil. Rancour-Laferriere (1998) reads the projection of evil onto women
    as Tolstoy's own pathology. No source surveyed argues that the title is the
    protagonist's self-deceiving projection offered critically by the author.
  triangulation:
    - evidenceRef: E9
      conventionalView: "The title is literal: Stepanida is the devil, an irresistible peasant femme fatale (popular editions; the 'From the Ideal to Femme Fatale' line of reading)."
      relation: contradicts
      source: "Penguin / Melville House edition blurbs; russiantheatrefest, 'From the Ideal to Femme Fatale' (unverified author)"
    - evidenceRef: E4
      conventionalView: "Tolstoy's projection of evil onto women is symptomatic of his own misogynistic pathology (maternal-loss psychoanalysis)."
      relation: complicates
      source: "Daniel Rancour-Laferriere, Tolstoy on the Couch, 1998"
    - evidenceRef: E14
      conventionalView: "The novella is built on the Aksinya Bazykina affair (autobiographical confession)."
      relation: extends
      source: "A. N. Wilson, Tolstoy, 1988; Henri Troyat, 1965; Aylmer Maude preface, 1925"
    - evidenceRef: E22
      conventionalView: "The Devil is paired with The Kreutzer Sonata (sexual obsession); the triptych with Father Sergius and Tolstoy's own withdrawal-quote is rarely noted in English scholarship."
      relation: complicates
      source: "Peter Ulf Møller, Postlude to The Kreutzer Sonata, 1988"

