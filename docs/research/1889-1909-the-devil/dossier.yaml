topic:
  slug: 1889-1909-the-devil
  title: "The Devil (Дьявол) — a novella-dive"
  question: >-
    Is the "devil" of the title the peasant Stepanida, or Evgeny Irtenev's own
    divided, involuntary will? Read the novella (drafted Nov 1889 in the Kreutzer
    fortnight, given a second ending and its title c. 1909, published posthumously
    1911) against its composition record — the genesis diaries, the 1858–60 Aksinya
    Bazykina diaries, the 1898/1909 letters and diaries, and the PSS Tom 27
    commentary — to test the claim that the title is the protagonist's self-deceiving
    projection, not the author's verdict.
  date: 2026-06-10
  period: "Prophet period (post-1880); drafted 1889, second ending c. 1909"
  corpusSurface: >-
    PSS Tom 27 (the novella pp. 481–515; the variant ending pp. 516–517; draft
    variants pp. 518–519; Sreznevsky's «История писания» pp. 714–728);
    composition-years diaries (Tom 50), the autobiographical diaries (Tom 48,
    1858–60), the late diaries (Toms 56–57, 1908–09), and letters (Toms 65, 85, 88).
  dateRange: "1858–1911 (autobiographical source to first publication)"

evidence:
  # --- The text: PSS Tom 27, main redaction (suicide ending) ---
  - id: E1
    genre: work
    pssTom: 27
    pages: "481 (epigraph)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "Если же правый глаз твой соблазняет тебя, вырви его и брось от себя, ибо лучше для тебя, чтобы погиб один из членов твоих, а не всё тело твое было ввержено в геенну."
    quoteEn: "(working English) And if your right eye causes you to stumble, pluck it out and cast it from you; for it is better for you that one of your members perish, than that your whole body be cast into hell."
    significance: >-
      The epigraph (Matthew V:28–30) frames the sin and its remedy as the man's own
      — the same Gospel verse set over The Kreutzer Sonata. The offending member is
      the looker's; the title's accusation of the woman runs against it.
    facsimile: ""
  - id: E2
    genre: work
    pssTom: 27
    pages: "511 (ch. XX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "Ах, да, третий есть: себя, — сказал он тихо вслух, и вдруг мороз пробежал у него по коже."
    quoteEn: "(working English) Ah, yes, there is a third: myself, he said quietly aloud, and suddenly a chill ran over his skin."
    significance: >-
      The centrepiece. The three-exits monologue worked out in the 18 Nov 1889 diary
      — kill the wife, kill her, or kill himself. The suicide ending names the will
      as the thing to be destroyed.
    facsimile: ""
  - id: E3
    genre: work
    pssTom: 27
    pages: "511 (ch. XX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "Я думал, что я ее взял, а она взяла меня, взяла и не пустила. Ведь я думал, что я свободен, а я не был свободен."
    quoteEn: "(working English) I thought I had taken her, but she had taken me — taken me and not let go. I thought I was free, and I was not free."
    significance: >-
      The involuntary will stated in Evgeny's own voice — possession from inside.
      The mechanism the dive reads as the true "devil."
    facsimile: ""
  - id: E4
    genre: work
    pssTom: 27
    pages: "511 (ch. XX)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "Ведь она чорт. Прямо чорт. Ведь она против воли моей завладела мною."
    quoteEn: "(working English) She is the devil. Simply the devil. She has taken possession of me against my will."
    significance: >-
      The title-word «чорт» in Evgeny's mouth in the suicide redaction — voiced in
      the same breath as the reasoning toward suicide; the projection and its
      correction are adjacent.
    facsimile: ""
  - id: E5
    genre: work
    pssTom: 27
    pages: "485 (ch. III)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "Он подошел к ней и, оглядываясь, коснулся ее."
    quoteEn: "(working English) He went up to her and, looking around, touched her."
    significance: >-
      The first fall (ch. III). The seduction is almost without event and Stepanida
      is barely seen — the text withholds her interiority so the "devil" stays
      Evgeny's projection.
    facsimile: ""
  - id: E6
    genre: work
    pssTom: 27
    pages: "502 (ch. XIII)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "зажег спичку и положил палец в огонь. «Ну, думай о ней теперь», — иронически обратился он к себе."
    quoteEn: "(working English) He struck a match and held his finger in the flame. 'Well, think about her now,' he said to himself ironically."
    significance: >-
      The burned-finger scene — the self-excision of the Gospel epigraph attempted
      and failed. Direct sibling image to Father Sergius's axe-cut finger, written
      within a year.
    facsimile: ""
  - id: E7
    genre: work
    pssTom: 27
    pages: "515 (ch. XXI)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "Он приставил к виску, замялся было, но как только вспомнил Степаниду, решение не видеть, борьбу, соблазн, падение, опять борьбу, так вздрогнул от ужаса."
    quoteEn: "(working English) He put it to his temple, hesitated a moment, but the instant he remembered Stepanida — the resolve not to see her, the struggle, the temptation, the fall, the struggle again — he shuddered with horror."
    significance: >-
      The canonical (suicide) ending. The violence turns on its true source — the
      man's own will — not on the woman.
    facsimile: ""
  - id: E8
    genre: work
    pssTom: 27
    pages: "515 (ch. XXI)"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/v27_481_515_Djavol.txt
    quoteRu: "самые же душевно-больные это несомненно те, которые в других людях видят признаки сумасшествия, которых в себе не видят."
    quoteEn: "(working English) the most insane of all are surely those who see the signs of madness in others and not in themselves."
    significance: >-
      The closing meditation, identical in both endings — turns the diagnosis of
      Evgeny back on the reader who would call him mad.
    facsimile: ""
  # --- The text: PSS Tom 27, variant (murder) ending, c. 1909 ---
  - id: E9
    genre: work
    pssTom: 27
    pages: "517 (variant ending)"
    date: "c. 1909"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_516_517_Djavol_varianty_kontsa.txt
    quoteRu: "Да нет никакого Бога. Есть дьявол. И это она. Он овладел мной. А я не хочу, не хочу. Дьявол, да, дьявол"
    quoteEn: "(working English) No — there is no God. There is a devil, and it is she. He has taken possession of me. And I do not want this, I do not want it. The devil, yes, the devil."
    significance: >-
      THE KEYSTONE VARIANT. The murder ending's title-naming sentence — denying God
      and naming the woman the devil are one act. The work is titled after a
      murderer's self-justification; the projection is staged as projection.
    facsimile: ""
  - id: E10
    genre: work
    pssTom: 27
    pages: "517 (variant ending)"
    date: "c. 1909"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_516_517_Djavol_varianty_kontsa.txt
    quoteRu: "Он подошел вплоть к ней, вынул из кармана револьвер и раз, два, три раза выстрелил ей в спину."
    quoteEn: "(working English) He went right up to her, took the revolver from his pocket, and fired into her back — one, two, three times."
    significance: >-
      The murder itself, immediately following the «дьявол» sentence. He is acquitted
      as temporarily insane and degenerates into an alcoholic — survival without
      redemption.
    facsimile: ""
  # --- Genesis: November 1889 diaries (Tom 50) ---
  - id: E11
    genre: diary
    pssTom: 50
    pages: "177"
    date: "1889-11-10 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v50_177_177_1889_11_10_2.txt
    quoteRu: "После обеда неожиданно стал писать историю Фредерикса."
    quoteEn: "(working English) After dinner unexpectedly began writing the story of Frederiks."
    significance: >-
      The start of composition, to the day. In the diaries the work is «История
      Фредерикса/Фридрихса», never «Дьявол».
    facsimile: ""
  - id: E12
    genre: diary
    pssTom: 50
    pages: "179-180"
    date: "1889-11-18 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v50_179_180_1889_11_18.txt
    quoteRu: "две жизни представляются ему и два выхода. И наконец 3-й. Себя убить."
    quoteEn: "(working English) two lives present themselves to him and two ways out. And finally a third: to kill himself."
    significance: >-
      The double-ending structure conceived in the diary before the draft was
      finished — the formal feature of the work, planned not improvised. At this
      stage the only end was suicide.
    facsimile: ""
  - id: E13
    genre: diary
    pssTom: 50
    pages: "177"
    date: "1889-11-12 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v50_177_177_1889_11_12.txt
    quoteRu: "Писал Фредерикса, вписал в Крейцерову Сонату"
    quoteEn: "(working English) Wrote Frederiks, inserted [a passage] into the Kreutzer Sonata."
    significance: >-
      The two works literally interleaved — The Devil drafted inside the Kreutzer
      fortnight, in Tolstoy's own hand.
    facsimile: ""
  # --- The autobiographical prototype: Aksinya Bazykina (Tom 48, 1858–60) ---
  - id: E14
    genre: diary
    pssTom: 48
    pages: "15"
    date: "1858-05-13 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v48_015_015_1858_05_13.txt
    quoteRu: "Я влюблен, как никогда в жизни. Нет другой мысли. Мучаюсь."
    quoteEn: "(working English) I am in love as never before in my life. No other thought. I am tormented."
    significance: >-
      The autobiographical origin of Evgeny's helpless attraction — Tolstoy's own
      affair with the married peasant Aksinya Bazykina.
    facsimile: ""
  - id: E15
    genre: diary
    pssTom: 48
    pages: "16"
    date: "1858-06-16 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v48_016_016_1858_06_16.txt
    quoteRu: "Имел Аксинью....; но она мне постыла."
    quoteEn: "(working English) Had Aksinya…; but she has become repugnant to me."
    significance: >-
      The rapid revulsion after consummation — the attraction→aversion cycle the
      novella gives Evgeny toward Stepanida.
    facsimile: ""
  - id: E16
    genre: diary
    pssTom: 48
    pages: "21-22"
    date: "1859-10-09 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v48_021_022_1859_10_09.txt
    quoteRu: "Аксинью продолжаю видать исключительно."
    quoteEn: "(working English) I continue to see Aksinya exclusively."
    significance: >-
      The re-flaring after revulsion — the obsession persists months later, the same
      oscillation transposed into the fiction.
    facsimile: ""
  - id: E17
    genre: diary
    pssTom: 48
    pages: "25"
    date: "1860-05-26 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v48_025_025_1860_05_26.txt
    quoteRu: "Уж не чувство оленя, а мужа к жене."
    quoteEn: "(working English) No longer the feeling of a stag, but of a husband to his wife."
    significance: >-
      The change from animal lust to quasi-conjugal feeling — directly echoed in
      Evgeny's deepening bond with Stepanida.
    facsimile: ""
  # --- Late recollection of Aksinya (Toms 56–57, 1908–09) ---
  - id: E18
    genre: diary
    pssTom: 56
    pages: "173-174"
    date: "1908-07-09 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v56_173_174_1908_07_09.txt
    quoteRu: "И так до связи с крестьянкой Акс. — она жива."
    quoteEn: "(working English) And so up to the liaison with the peasant woman Aks. — she is alive."
    significance: >-
      The intimate diary: the Aksinya guilt still live in 1908, in the months before
      the return to the work. «она жива» — she is still alive.
    facsimile: ""
  # --- The 1909 return ---
  - id: E19
    genre: diary
    pssTom: 57
    pages: "28-29"
    date: "1909-01-19 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v57_028_029_1909_01_19.txt
    quoteRu: "Просмотрел «Дьявола». Тяжело, неприятно."
    quoteEn: "(working English) Read through 'The Devil.' Heavy, unpleasant."
    significance: >-
      The dated return to the work c. 1909 — the moment the second ending and the
      title belong to (per Sreznevsky's handwriting analysis). Commentary dates this
      19 Feb; the corpus dates it 19 Jan (see needsReview).
    facsimile: ""
  - id: E20
    genre: diary
    pssTom: 57
    pages: "66"
    date: "1909-05-13 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v57_066_066_1909_05_13.txt
    quoteRu: "Оказывается, она читала «Дьявол», и в ней поднялись старые дрожжи"
    quoteEn: "(working English) It turns out she had read 'The Devil,' and the old yeast rose in her."
    significance: >-
      Sofia Tolstaya discovers the manuscript in 1909 — the marital crisis the
      twenty-year secrecy had been built to prevent.
    facsimile: ""
  # --- Letters ---
  - id: E21
    genre: letter
    pssTom: 65
    pages: ""
    date: "1890-01-17 (OS)"
    addressee: "P. I. Birukoff"
    localPdf: ""
    extract: extracts/v65_005_P_I_Biryukovu.txt
    quoteRu: "у меня начаты еще другие художественные работы всё на тему половой любви (это секрет)"
    quoteEn: "(working English) I have also begun other artistic works, all on the theme of sexual love (this is a secret)."
    significance: >-
      The work named as a secret — the suppression begun at conception, covering The
      Devil and the «Коневская повесть» (Resurrection).
    facsimile: ""
  - id: E22
    genre: letter
    pssTom: 88
    pages: ""
    date: "1898-07-14 (OS)"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v88_506_iyulya14.txt
    quoteRu: "Иртенева нехорошо печатать, потому что мотив один и тот же, что в Отце Сергие."
    quoteEn: "(working English) It is not good to publish Irtenev, because the motif is the same as in Father Sergius."
    significance: >-
      The same-day withdrawal of The Devil from the Doukhobor-fund sale — Tolstoy's
      own pairing of the work with Father Sergius, not Kreutzer.
    facsimile: ""
  - id: E23
    genre: letter
    pssTom: 85
    pages: ""
    date: "1884-07-24 (OS)"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v85_022_a24.txt
    quoteRu: "я назначил ей свиданье и пошел на него."
    quoteEn: "(working English) I arranged an assignation with her and went toward it."
    significance: >-
      The Domna confession — the 1880s temptation and the chance interruption (the
      son's lesson) that becomes Evgeny's near-escape structure in the novella.
    facsimile: ""
  # --- PSS commentary (Tom 27, Sreznevsky) ---
  - id: E24
    genre: commentary
    pssTom: 27
    pages: "714-728"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/_commentary_istoriya.txt
    quoteRu: "связь с крестьянской женщиной из нашей деревни, до моей женитьбы, — на это есть намек в моем рассказе «Дьявол»."
    quoteEn: "(working English) a liaison with a peasant woman of our village, before my marriage — there is a hint of it in my story 'The Devil.'"
    significance: >-
      Tolstoy's own statement to Birukoff naming the autobiography — the author
      confirming Aksinya as the source of Stepanida.
    facsimile: ""
  - id: E25
    genre: commentary
    pssTom: 27
    pages: "714-728"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/_commentary_istoriya.txt
    quoteRu: "вспомнил Аксинью, то, что она жива, и, говорят, Ермил мой сын"
    quoteEn: "(working English) remembered Aksinya, that she is alive, and that, they say, Ermil is my son."
    significance: >-
      The 13 June 1909 notebook entry (quoted in the commentary; extract_tei.py
      dropped it from the notebook file) — the unforgiven debt naming the son.
    facsimile: ""
  - id: E26
    genre: commentary
    pssTom: 27
    pages: "714-728"
    date: ""
    addressee: ""
    localPdf: ""
    extract: extracts/_commentary_istoriya.txt
    quoteRu: "начерно в течение двух недель, в промежуток между окончанием предпоследней редакции «Крейцеровой сонаты» и началом работы над последней ее редакцией."
    quoteEn: "(working English) in rough over two weeks, in the gap between the penultimate and final redactions of The Kreutzer Sonata."
    significance: >-
      The editor's dating of the composition — The Devil drafted inside the Kreutzer
      fortnight, November 1889.
    facsimile: ""

