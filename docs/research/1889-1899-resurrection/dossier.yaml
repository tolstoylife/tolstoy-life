      the comma-and-«больше» recension. Pairs with diary-1899-12-18-completion
      (the diary file's own period-and-«более» form). SECONDARY, attributed.
    facsimile: ""

  # ---- Redactions (Tom 33 third redaction) ----
  - id: redaction3-church-framing
    genre: works
    pssTom: 33
    pages: "135-160"
    date: "1898"
    addressee: ""
    localPdf: vol02
    extract: extracts/v33_135_160_red3.txt
    quoteRu: >-
      Религия, которую исповедывали и арестанты и те, которые содержали их, была
      религия Христа, та религия, которая, по словам Христа, состоит в том,
      чтобы не делать другому чего не хочешь, чтобы тебе делали, в прощении всех
    quoteEn: >-
      (working English) The religion professed by the prisoners and by those
      who held them was the religion of Christ, that religion which, in Christ's
      own words, consists in not doing to another what you would not wish done
      to yourself, in forgiving all...
    significance: >-
      The second of two adjacent third-redaction drafts of the church scene
      (variant 58), with the theological framing moved to the front — later
      transferred into Nekhlyudov's interiority and the narratorial voice in the
      final text. Light redaction sample.
    facsimile: ""

  # ---- Thematic scenes (novel text) ----
  - id: thematic-verdict-error
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      Все так устали, так запутались в спорах, что никто не догадался прибавить
      к ответу: да, но без намерения лишить жизни.
    quoteEn: >-
      (working English) Everyone was so tired, so tangled in arguments, that no
      one thought to add to the answer: yes, but with no intention of taking
      life.
    significance: >-
      The wrongful-verdict scene (Part I): Maslova is condemned to katorga by a
      procedural blunder, not malice — the jury drops the robbery motive but
      forgets the parallel qualifier on intent to kill. The court as machinery
      that grinds without regard to guilt.
    facsimile: ""

  - id: thematic-single-tax
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      А так как трудно распределить, кто кому должен платить, и так как на
      общественные нужды деньги собирать нужно, то и сделать так, чтобы тот, кто
      владеет землей, платил бы в общество на всякие нужды то, что его земля
      стоит. Так всем ровно будет.
    quoteEn: >-
      (working English) And since it is hard to work out who should pay whom,
      and since money has to be collected for common needs, then arrange it so
      that whoever owns land pays into the community, for all its needs, what his
      land is worth. So it will be equal for all.
    significance: >-
      The land question (Part II): Nekhlyudov's Henry-George single-tax scheme,
      received by the peasants with suspicion, not gratitude — kept provisional
      in Nekhlyudov's own mouth ("a transition from a cruder to a less crude
      form of violence").
    facsimile: ""

  - id: thematic-ending-new-life
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      С этой ночи началась для Нехлюдова совсем новая жизнь, не столько потому,
      что он вступил в новые условия жизни, а потому, что всё, что случилось с
      ним с этих пор, получало для него совсем иное, чем прежде, значение. Чем
      кончится этот новый период его жизни, покажет будущее.
    quoteEn: >-
      (working English) From that night a wholly new life began for Nekhlyudov,
      not so much because he had entered new conditions of life, as because
      everything that happened to him from then on took on a wholly different
      meaning for him than before. How this new period of his life will end, the
      future will show.
    significance: >-
      The ending (Part III, ch. XXVIII): the "resurrection" of the title
      realised not as plot (Maslova chooses Simonson) but as a private reading of
      the Gospel; the awakening is interior and the ending deliberately open. The
      text is dated «16 декабря 1899 года. Конец.»
    facsimile: ""

  # ---- Excommunication (Reply to the Synod, Tom 34; diaries Tom 54; commentary) ----
  - id: reply-broad-indictment
    genre: works
    pssTom: 34
    pages: "245-253"
    date: "1901-04-04"
    addressee: "Holy Synod"
    localPdf: vol03
    extract: extracts/v34_245_253_Otvet_Sinodu.txt
    quoteRu: >-
      отвергаю бога, во святой троице славимого создателя и промыслителя
      вселенной, отрицаю господа Иисуса Христа, богочеловека, искупителя и
      спасителя мира, пострадавшего нас ради человеков и нашего ради спасения и
      воскресшего из мертвых, отрицаю бессемейное зачатие по человечеству Христа
      господа и девство до рождества и по рождестве пречистой богородицы
    quoteEn: >-
      (working English) [the decree charges that I] reject God, glorified in the
      Holy Trinity, Creator and Provider of the universe; deny the Lord Jesus
      Christ, God-man, Redeemer and Saviour of the world, who suffered for us men
      and for our salvation and rose from the dead; deny the seedless conception
      in His humanity of Christ the Lord and the virginity before and after birth
      of the Most Pure Mother of God.
    significance: >-
      Tolstoy's verbatim quotation, inside his Reply, of the Synod decree's broad
      doctrinal indictment (Trinity, Christ's divinity/resurrection, virgin
      birth). The standing content of his 1880s–90s religious works — none of it
      turns on Resurrection. The decree's own wording is cited HERE (corpus), not
      from the web-sourced Skvortsov printing.
    facsimile: ""

  - id: reply-eucharist-climax
    genre: works
    pssTom: 34
    pages: "245-253"
    date: "1901-04-04"
    addressee: "Holy Synod"
    localPdf: vol03
    extract: extracts/v34_245_253_Otvet_Sinodu.txt
    quoteRu: >-
      Сказано, наконец, как последняя и высшая степень моей виновности, что я,
      «ругаясь над самыми священными предметами веры, не содрогнулся подвергнуть
      глумлению священнейшее из таинств — евхаристию».
    quoteEn: >-
      (working English) It is said, finally, as the last and highest degree of
      my guilt, that I, "mocking the most sacred objects of the faith, did not
      shudder to subject to derision the most holy of the sacraments — the
      Eucharist."
    significance: >-
      The decisive clause for the marquee question: the Synod names the
      communion satire, but explicitly as the «последняя и высшая степень»
      (rhetorical climax) of a broad indictment, not its basis. Tolstoy's
      verbatim quotation of the decree.
    facsimile: ""

  - id: reply-eucharist-defence
    genre: works
    pssTom: 34
    pages: "245-253"
    date: "1901-04-04"
    addressee: "Holy Synod"
    localPdf: vol03
    extract: extracts/v34_245_253_Otvet_Sinodu.txt
    quoteRu: >-
      То, что я не содрогнулся описать просто и объективно то, что священник
      делает для приготовления этого, так называемого, таинства, то это
      совершенно справедливо; но то, что это, так называемое, таинство есть
      нечто священное и что описать его просто, как оно делается, есть кощунство,
      — это совершенно несправедливо.
    quoteEn: >-
      (working English) That I did not shudder to describe simply and
      objectively what the priest does to prepare this so-called sacrament — that
      is perfectly true; but that this so-called sacrament is something holy, and
      that to describe it simply, as it is done, is blasphemy — that is perfectly
      untrue.
    significance: >-
      Tolstoy's own answer to the Eucharist charge: he affirms he wrote the flat
      Resurrection-manner description and defends it. The one place where Tolstoy
      and the Synod meet on the communion question — confirming the chapter is
      genuinely in play, embedded in his total rejection of sacrament-as-sorcery.
    facsimile: ""

  - id: reply-church-renunciation
    genre: works
    pssTom: 34
    pages: "245-253"
    date: "1901-04-04"
    addressee: "Holy Synod"
    localPdf: vol03
    extract: extracts/v34_245_253_Otvet_Sinodu.txt
    quoteRu: >-
      То, что я отрекся от церкви, называющей себя православной, это совершенно
      справедливо. […] Сказано также, что я отвергаю все таинства. Это
      совершенно справедливо.
    quoteEn: >-
      (working English) That I renounced the church that calls itself Orthodox —
      that is perfectly true. […] It is also said that I reject all the
      sacraments. That is perfectly true.
    significance: >-
      Tolstoy concedes both the church-renunciation (dating it to years of study
      of dogmatic theology, not to any novel) and the rejection of ALL
      sacraments as a class — communion being one item in a total alternative
      theology. Supports the COMPLICATES verdict.
    facsimile: ""

  - id: diary-1901-03-19-strange
    genre: diary
    pssTom: 54
    pages: "090-093"
    date: "1901-03-19"
    addressee: ""
    localPdf: vol20
    extract: extracts/v54_090_093_1901_03_19.txt
    quoteRu: >-
      За это время было странное отлучение от церкви и вызванные им выражения
      сочувствия, и тут же студенческия истории, принявшия общественный характер
    quoteEn: >-
      (working English) During this time there was the strange excommunication
      from the church and the expressions of sympathy it provoked, and at the
      same time the student affairs, which took on a public character.
    significance: >-
      Tolstoy's first diary reaction (cool, doctrinal): «странное отлучение»
      filed in one breath between his work and student unrest, no mention of
      Resurrection as cause. Load-bearing for the COMPLICATES reading.
    facsimile: ""

  - id: diary-1901-03-28-sorcery
    genre: diary
    pssTom: 54
    pages: "093"
    date: "1901-03-28"
    addressee: ""
    localPdf: vol20
    extract: extracts/v54_093_093_1901_03_28.txt
    quoteRu: >-
      Записано только одно — то, что стало совершенно ясно, что все наше
      православие есть колдовство от страха. И корень всего — вера в чудесное.
    quoteEn: >-
      (working English) Only one thing recorded — that it has become completely
      clear that all our Orthodoxy is sorcery out of fear. And the root of it all
      is belief in the miraculous.
    significance: >-
      The one recorded thought (28 Mar 1901): the frame is the whole sacramental
      system as «колдовство» (the same word he aims at all the sacraments in the
      Reply), not the communion scene in particular.
    facsimile: ""

  - id: commentary-tolchok-publish
    genre: commentary
    pssTom: 34
    pages: "575-577"
    date: "1964"
    addressee: ""
    localPdf: vol03
    extract: extracts/v34_575_577_Otvet_commentary.txt
    quoteRu: >-
      Отлучение Толстого от церкви было задумано царским правительством еще в
      1880-х гг. Толчком к опубликованию отлучения послужило появление в 1899 г.
      романа «Воскресение», в котором Толстой разоблачил лицемерие казенной
      церкви и создал сатирический образ Топорова, недвусмысленно намекавший на
      обер-прокурора «святейшего» синода К. П. Победоносцева.
    quoteEn: >-
      (working English) The excommunication of Tolstoy was conceived by the
      tsarist government as far back as the 1880s. The impulse to publish the
      excommunication was the appearance in 1899 of the novel Resurrection, in
      which Tolstoy exposed the hypocrisy of the official church and created the
      satirical figure of Toporov, an unmistakable allusion to the
      Over-Procurator of the "most holy" Synod, K. P. Pobedonostsev.
    significance: >-
      The corpus's own editor (A. I. Opulsky) distinguishes long-laid intent
      (1880s) from proximate occasion (1899 publication), and locates the sting
      as much in the Toporov caricature of Pobedonostsev as in the Mass scene.
      The crux of the COMPLICATES verdict. SECONDARY (Soviet-era) commentary,
      attributed; the Pobedonostsev-as-author line is contested (see needsReview).
    facsimile: ""

