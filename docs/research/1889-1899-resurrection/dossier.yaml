        arranged "domestic" pre-censorship via editor Sementkovsky. V. D.
        Bonch-Bruevich counted 497 distortions/omissions/paraphrases affecting
        10,240 words; only 25 of 123 chapters printed without distortion. The
        prison-church communion chapters (Part I, XXXIX–XL) were cut WHOLESALE,
        leaving only «Началось богослужение». The complete text was printed
        simultaneously abroad by Chertkov's «Свободное слово» (Purleigh, Essex);
        first complete Russian text 1936 (Jubilee Ed.), first complete English
        1938.
      evidenceRefs: [censorship-communion-cut, censorship-survival-sentence, letter-marks-censorship]
      source: jubilee-edition
