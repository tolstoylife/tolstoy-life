# dossier.yaml — Resurrection (Воскресение), 1889–1899 — novel-dive
# Machine-readable backbone for the narrative index.md. Quotes byte-verified
# against the named extract files with docs/research/lib/verify_quotes.py.
# All Russian extracted with extract_tei.py --choice=reg --notes=auto.
# English glosses are working translations, labelled.

topic:
  slug: 1889-1899-resurrection
  title: "Resurrection (Воскресение) — a novel-dive"
  question: >
    How was Tolstoy's last novel finished (the Doukhobor-funded sprint), what
    is its central church-service satire, and did that satire trigger the 1901
    excommunication? Tested against the primary record.
  date: 2026-06-08
  period: "Prophet period (late Tolstoy)"
  corpusSurface: >
    PSS Tom 32 (novel + censorship variants → vol01), Tom 33 (six redactions +
    «История писания» commentary → vol02), Tom 34 (Reply to the Synod + commentary
    → vol03), diaries Tom 53 (1898–99 → vol19) and Tom 54 (1901 → vol20), letters
    Toms 71 (→vol53) / 72 (→vol36) / 88 (Chertkov → vol47).
  dateRange: "1889-12-26 – 1899-12-18 (writing); 1899–1901 (publication, excommunication)"

# ── EVIDENCE — flat citation ledger, one row per cited primary passage ─────────
# genre ∈ works|diary|letter|commentary. extract = filename only (file holds the
# quote). localPdf is informational (Tom→vol mapping). quoteRu is byte-exact.
evidence:

  # ---- Communion centrepiece (Part I, chs XXXIX–XLI; novel text) ----
  - id: communion-service-physical
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      Богослужение состояло в том, что священник, одевшись в особенную
      странную и очень неудобную парчевую одежду, вырезывал и раскладывал
      кусочки хлеба на блюдце и потом клал их в чашу с вином, произнося при
      этом различные имена и молитвы.
    quoteEn: >-
      (working English) The service consisted in this: the priest, having
      dressed in a peculiar, strange and very uncomfortable brocade garment,
      cut up and laid out little pieces of bread on a saucer and then put them
      into a cup of wine, pronouncing meanwhile various names and prayers.
    significance: >-
      The defamiliarised opening of the prison-church liturgy (ch. XXXIX): the
      Eucharist named only as physical actions, every sacral term refused. Head
      of the dive's marquee scene.
    facsimile: ""

  - id: communion-manipulations-napkin
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      Самое же главное действие было то, когда священник, взяв обеими руками
      салфетку,равномерно и плавно махал ею над блюдцем и золотой чашей.
      Предполагалось, что в это самое время из хлеба и вина делается тело и
      кровь, и потому это место богослужения было обставлено особенной
      торжественностью.
    quoteEn: >-
      (working English) But the main action of all was when the priest, taking
      a napkin in both hands, evenly and smoothly waved it over the saucer and
      the golden cup. It was supposed that at this very moment the bread and
      wine became body and blood, and therefore this part of the service was
      furnished with a special solemnity.
    significance: >-
      The consecration rendered as "manipulations" and a napkin waved over the
      saucer; transubstantiation bracketed by "it was supposed" (предполагалось).
    facsimile: ""

  - id: communion-ate-god-body
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      После этого считалось, что превращение совершилось, и священник, сняв
      салфетку с блюдца,разрезал серединный кусочек начетверо и положил его
      сначала в вино, а потом в рот.Предполагалось, что он съел кусочек тела
      Бога и выпил глоток Его крови.
    quoteEn: >-
      (working English) After this it was held that the transformation had been
      accomplished, and the priest, having removed the napkin from the saucer,
      cut the central little piece into four and put it first into the wine and
      then into his mouth. It was supposed that he ate a piece of the body of
      God and drank a gulp of His blood.
    significance: >-
      The Eucharist rendered as ingestion — the most-quoted single offence of
      the satire; what the Synod decree later named as the «последняя и высшая
      степень» of Tolstoy's guilt (see excommunication rows).
    facsimile: ""

  - id: communion-priest-cheerful-boots
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      После этого священник унес чашку за перегородку и, допив там всю
      находившуюся в чашке кровь и съев все кусочки тела Бога, старательно
      обсосав усы и вытерев рот и чашку, в самом веселом расположении духа,
      поскрипывая тонкими подошвами опойковых сапог, бодрыми шагами вышел
      из-за перегородки.
    quoteEn: >-
      (working English) After this the priest carried the cup away behind the
      partition and, having drunk up there all the blood remaining in the cup
      and eaten all the pieces of the body of God, having diligently sucked his
      moustache and wiped his mouth and the cup, in the most cheerful frame of
      mind, the thin soles of his calfskin boots squeaking, walked out from
      behind the partition with brisk steps.
    significance: >-
      Bodily, commercial detail displaces mystery; the priest finishes the cup,
      sucks his moustache, walks out cheerful. The flat register at full pitch.
    facsimile: ""

  - id: communion-cross-gallows
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      Никому в голову не приходило того, что золоченый крест с эмалевыми
      медальончиками на концах, который вынес священник и давал целовать людям,
      был не что иное, как изображение той виселицы, на которой был казнен
      Христос именно за то,что он запретил то самое, что теперь его именем
      совершалось здесь.
    quoteEn: >-
      (working English) It occurred to no one that the gilded cross with enamel
      medallions on its ends, which the priest had carried out and gave people
      to kiss, was nothing other than the image of that gallows on which Christ
      was executed precisely for forbidding the very thing that was now being
      performed here in his name.
    significance: >-
      The ch. XL explicit indictment: the gilded cross = the gallows on which
      Christ was executed for forbidding what is now done in his name. The
      flat-register satire dropped for direct authorial polemic.
    facsimile: ""

  - id: communion-priest-18-years
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      Он верил не в то, что из хлеба сделалось тело, что полезно для души
      произносить много слов или что он съел действительно кусочек Бога, — в
      это нельзя верить, — а верил в то, что надо верить в эту веру. Главное
      же, утверждало его в этой вере то, что за исполнение треб этой веры он
      18 лет уже получал доходы, на которые содержал свою семью, сына в
      гимназии, дочь в духовном училище.
    quoteEn: >-
      (working English) He believed not that the bread had become body, nor
      that it is useful for the soul to pronounce many words, nor that he had
      really eaten a piece of God — that cannot be believed — but he believed
      that one must believe in this faith. And what chiefly confirmed him in
      this faith was that for performing the rites of this faith he had for 18
      years already been receiving an income, on which he kept his family, a son
      at the gymnasium and a daughter at the church school.
    significance: >-
      The priest's psychology given as complicity, not malice: he believes only
      "that one must believe in this faith," sustained by 18 years of income.
    facsimile: ""

  - id: communion-bells-same-service
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: >-
      Со всех сторон дрожал воздух от разнообразного звона и гула
      колоколов,призывающих народ к присутствованию при таком же служении,
      какое совершалось теперь в тюрьме.
    quoteEn: >-
      (working English) From all sides the air trembled with the varied
      ringing and din of bells, calling the people to attend the same kind of
      service as was now being performed in the prison.
    significance: >-
      The ch. XLI structural hammer-blow: the city's bells call the free
      population to the same rite as in the prison — church and prison are one
      institution.
    facsimile: ""

  # ---- Censorship: the «Началось богослужение» cut ----
  - id: censorship-communion-cut
    genre: commentary
    pssTom: 32
    pages: "471-505"
    date: "1936"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_471_505_Tsenzurnye_varianty.txt
    quoteRu: >-
      От главы XXXIX I части в Н. сохранилась только первая фраза: Началось
      богослужение., присоединенная к главе XXXVIII. Глава XL в Н. выпущена
      целиком. В связи с этим общее количество глав в первой части романа в Н.
      уменьшено на две.
    quoteEn: >-
      (working English) Of chapter XXXIX of Part I, only the first sentence
      survived in «Нива»: "The church service began.", appended to chapter
      XXXVIII. Chapter XL was dropped entirely. As a result the total number of
      chapters in Part I of the novel in «Нива» is reduced by two.
    significance: >-
      The decisive censorship datum: the communion chapters were cut WHOLESALE
      from the «Нива» serialisation (only the first sentence left, part
      renumbered to hide the gap). The single most heavily censored passage in
      the novel; PSS editorial note (variants file).
    facsimile: ""

  - id: censorship-survival-sentence
    genre: works
    pssTom: 32
    pages: "3-445"
    date: "1899"
    addressee: ""
    localPdf: vol01
    extract: extracts/v32_003_445_Voskresenie.txt
    quoteRu: "Началось богослужение."
    quoteEn: '(working English) "The church service began."'
    significance: >-
      The one sentence the censor allowed through (novel line 2357); everything
      after it in chs XXXIX–XL was removed from «Нива». Russian serial readers
      saw only these four words.
    facsimile: ""

  # ---- Genesis diaries (Tom 53) ----
  - id: diary-1898-07-17-decision
    genre: diary
    pssTom: 53
    pages: "203-204"
    date: "1898-07-17"
    addressee: ""
    localPdf: vol19
    extract: extracts/v53_203_204_1898_07_17.txt
    quoteRu: >-
      Решил отдать свои повести: Воскресение и Отец Сергий в печать для
      духоборов. […] Взялся за Воскресение, и сначала шло хорошо, но с тех пор
      как встревожили — два дня ничего не мог сделать. […] Приди и вселися в ны.
      Возбуди воскресение во мне.
    quoteEn: >-
      (working English) I decided to give my tales — Resurrection and Father
      Sergius — to print for the Doukhobors. […] I took up Resurrection and at
      first it went well, but from the moment I was disturbed — two days I could
      do nothing. […] Come and dwell within us. Kindle resurrection in me. — the
      entry fuses the novel's title with a prayer.
    significance: >-
      The founding decision: Tolstoy resolves to sell his fiction to fund the
      Doukhobor emigration, reversing his post-1881 refusal of literary fees.
      First day of resumed work after the spring illness.
    facsimile: ""

  - id: diary-1898-11-02-12000
    genre: diary
    pssTom: 53
    pages: "210-211"
    date: "1898-11-02"
    addressee: ""
    localPdf: vol19
    extract: extracts/v53_210_211_1898_11_02.txt
    quoteRu: >-
      Продажа повести и получение 12-ти тысяч, которые отдал духоборам,
      устроилось хорошо. […] Дела очень много, но я весь поглощен Воскресением,
      берегу воду и пускаю только на Воскресение.
    quoteEn: >-
      (working English) The sale of the tale and the receipt of twelve
      thousand, which I handed over to the Doukhobors, worked out well. […] I
      have a great deal of work, but I am wholly absorbed in Resurrection, I
      husband my water and let it flow only onto Resurrection.
    significance: >-
      The transaction recorded (12,000 r. advance handed to the Doukhobors) plus
      the total creative immersion of autumn 1898.
    facsimile: ""

  - id: diary-1899-12-18-completion
    genre: diary
    pssTom: 53
    pages: "232-234"
    date: "1899-12-18"
    addressee: ""
    localPdf: vol19
    extract: extracts/v53_232_234_1899_12_18.txt
    quoteRu: >-
      Кончил «Воскресение». Нехорошо. Не поправлено. Поспешно. Но отвалилось и
      не интересует более.
    quoteEn: >-
      (working English) I finished Resurrection. It is not good. Uncorrected.
      Rushed. But it has fallen away and no longer interests me.
    significance: >-
      The completion verdict — Tolstoy's own contemporaneous, unsparing
      self-assessment. A primary datum the criticism rarely cites; grounds the
      "rough/rushed" charge. NOTE: the commentary file v33_329_422 carries the
      comma-and-«больше» variant; this diary file carries the period-and-«более»
      form used here and in index.md.
    facsimile: ""

  - id: diary-1898-11-25-outgrows
    genre: diary
    pssTom: 53
    pages: "214-216"
    date: "1898-11-25"
    addressee: ""
    localPdf: vol19
    extract: extracts/v53_214_216_1898_11_25.txt
    quoteRu: "Воскресение разрастается. Едва ли влезет в 100 глав."
    quoteEn: >-
      (working English) Resurrection is growing. It will hardly fit into 100
      chapters.
    significance: >-
      Explicit acknowledgment that the reopened novel has outgrown its original
      shape — the 1898 expansion that brought in the church service, the
      politicals, and Toporov.
    facsimile: ""

  # ---- Letters (Toms 71/72/88) ----
  - id: letter-marks-contract
    genre: letter
    pssTom: 71
    pages: "279"
    date: "1898-10-12"
    addressee: "A. F. Marks"
    localPdf: vol53
    extract: extracts/v71_279_A_F_Marksu.txt
    quoteRu: >-
      Предоставляю Редакции Нивы право первого печатания моей повести
      Воскресение. Редакция же Нивы платит мне по ты сяче рублей за печатный
      лист в 35 000 букв. Двенадцать тысяч рублей Редакция выдает мне теперь же.
    quoteEn: >-
      (working English) I grant the editorial office of Niva the right of first
      publication of my novel Resurrection. The editorial office of Niva pays me
      one thousand roubles per printed sheet of 35,000 characters. Twelve
      thousand roubles the editorial office pays me now.
    significance: >-
      The contract's hard financial datum: first-printing rights to «Нива»,
      1,000 r./sheet, 12,000 r. advance. The corpus-anchored figure (no lump-sum
      "total raised" is asserted). NOTE: «по ты сяче» with an internal space is a
      verbatim TEI artefact in the extract, preserved here for byte-fidelity.
    facsimile: ""

  - id: letter-marks-censorship
    genre: letter
    pssTom: 71
    pages: "306"
    date: "1898-11-07"
    addressee: "A. F. Marks"
    localPdf: vol53
    extract: extracts/v71_306_A_F_Marksu.txt
    quoteRu: >-
      Дело это предоставлено мною Черткову (V. Tchertkoff. Maldon. Essex,
      England), к которому немецкие переводчики и издатели имеют обратиться. […]
      В повести есть много мест нецензурных, и чем дальше я над нею работаю, тем
      этих нецензурных мест становится больше.
    quoteEn: >-
      (working English) [On foreign rights:] This matter has been delegated by me
      to Chertkov (V. Tchertkoff. Maldon. Essex, England), to whom German
      translators and publishers should apply. […] The novel contains many
      passages that will not pass the censor, and the further I work on it the
      more such passages appear.
    significance: >-
      Tolstoy's own "domestic censorship" strategy (engage a literator to
      pre-cut) and the delegation of foreign rights to Chertkov — the mechanism
      by which the complete text reached print abroad.
    facsimile: ""

  - id: letter-marks-fee-routing
    genre: letter
    pssTom: 72
    pages: "056"
    date: "1899-03-02"
    addressee: "A. F. Marks"
    localPdf: vol36
    extract: extracts/v72_056_A_F_Marksu.txt
    quoteRu: >-
      Будьте так добры переслать две тысячи рублей в Англию по следующему
      адресу: Vladimir Tchertkoff, Purleigh, Maldon, Essex, England. Две тысячи
      рублей эти я буду считать полученными мною за предоставленное вам право
      первого печатания в Ниве моего отрывка: История Матери.
    quoteEn: >-
      (working English) Please be so good as to forward two thousand roubles to
      England to the following address: Vladimir Tchertkoff, Purleigh, Maldon,
      Essex, England. These two thousand roubles I shall consider as received by
      me in exchange for the first-publication right in Niva which I have granted
      you for my excerpt: The Story of a Mother.
    significance: >-
      Direct proof that the novel's fees funded the emigration: «Нива» pays 2,000
      r. straight to Chertkov in England, charged against rights to a Resurrection
      excerpt («История Матери»).
    facsimile: ""

  - id: letter-biryukov-ships
    genre: letter
    pssTom: 71
    pages: "347"
    date: "1898-12-16"
    addressee: "P. I. Biryukov"
    localPdf: vol53
    extract: extracts/v71_347_P_I_Biryukovu.txt
    quoteRu: >-
      Чертков просил, чтобы я просил его взять на себя все дела по
      духоборческому делу и переводам Воскресения, и я сделал это. […]
      Воскресенье выйдет в России 13-го марта, так нужно для переводов — и, как
      кажется, право первого печатания продано в Англию и Америку.
    quoteEn: >-
      (working English) Chertkov asked me to ask him to take charge of all
      affairs relating to the Doukhobor matter and to the translations of
      Resurrection, and I have done so. […] Resurrection will appear in Russia
      on 13 March; that date is set for the sake of the translations — and, it
      seems, first-publication rights have been sold to England and America.
    significance: >-
      The nexus letter: Chertkov coordinates both the Doukhobor emigration and
      the foreign Resurrection rights; the Russian release date (13 March 1899)
      is fixed to synchronise the simultaneous foreign editions. The same letter
      reports the Doukhobor ships Lake Huron and Lake Superior sailing.
    facsimile: ""

  - id: letter-chertkov-40000-paralysis
    genre: letter
    pssTom: 88
    pages: "541"
    date: "1899-02-05"
    addressee: "V. G. Chertkov"
    localPdf: vol47
    extract: extracts/v88_541_fevralya5.txt
    quoteRu: >-
      Первое и самое главное: духоборы, и духоборы Кипрские. […] Вы меня очень
      озадачили и смутили, написав, что для их отъезда нужно 40 тысяч и деньги
      эти должен достать я. […] Другое дело это мое писанье, в котором я не могу
      ничего двигать, так как нездоровится и мне прямо противно это писанье,
      особенно конец. А Маркс просит прислать конец, чтобы, судя по нем, цензура
      решила, можно ли пропустить начало.
    quoteEn: >-
      (working English) First and most important: the Doukhobors, and the
      Cyprus Doukhobors. […] You puzzled and disturbed me greatly by writing
      that 40,000 roubles are needed for their departure and that I must obtain
      this money. […] The other matter is my writing, which I cannot advance at
      all since I am unwell and the writing is simply repellent to me, especially
      the ending. And Marks is pressing me to send the ending so that the censor
      can decide, on the basis of it, whether the beginning may be passed.
    significance: >-
      The funding pressure (40,000 r. shortfall target for the Cyprus
      Doukhobors) set directly against the novel's stalled ending and Marks's
      censorship-clearance demand. The 40,000 figure is the shortfall target, not
      a "total raised" — see needsReview on the money inconsistency.
    facsimile: ""

