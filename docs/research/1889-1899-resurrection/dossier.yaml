needsReview:
  - item: >-
      The Doukhobor-fund "total raised" is inconsistent across secondary sources
      (Wikipedia 34,200 r.; others ≈30,000 r.; 22,000 r. attributed to Marks; the
      40,000 r. shortfall target in v88_541). Do NOT assert a single figure. The
      corpus anchors only the 1,000 r./sheet rate and the 12,000 r. advance
      (letter-marks-contract) plus documented routed sums (2,000 r. via v72_056;
      8,000+2,000 via v88_545; 3,000 r. Konshin via v88_548). Reception extract
      cites 34,200 r. from PSS — reconcile before quoting any total.
    phase: scholarship/reception
    why: "Secondary money figures are not mutually consistent; risk of asserting a false total."
  - item: >-
      Pobedonostsev's exact role in the decree (author/prime-mover per Soviet PSS
      vs reluctant participant who feared amplifying Tolstoy, per a revisionist
      strand) is contested. Report attributed; do not adjudicate; do not let
      either label harden.
    phase: scholarship/excommunication
    why: "Corpus (Soviet PSS) and later accounts disagree; the revisionist line partly serves a rehabilitative frame."
  - item: >-
      The Synod decree's own wording (beyond Tolstoy's quotations of it) is
      web-sourced (Skvortsov 1901 via azbyka.ru) and NOT corpus-verified. Only the
      decree passages Tolstoy quotes verbatim inside his Reply (Tom 34) are in the
      corpus and cited as evidence. The «священнейшее» (Tolstoy) vs «величайшее»
      (Skvortsov) Eucharist-clause variant is flagged.
    phase: excommunication
    why: "No corpus extract exists for the full decree text; keep the web wording out of the evidence ledger."
  - item: >-
      The Koni 1887 genesis letter (Tom 64) is unswept; the seed quotation is
      reported only via the «История писания» editorial commentary, not the letter
      itself. A future pass should fetch Tom 64 for the primary attestation.
    phase: genesis
    why: "The plot-origin primary source is outside the swept Toms."
  - item: >-
      Named 1899–1900 Russian press reviews (Русская мысль, Новое время, Вестник
      Европы) were not recovered — a reception gap. The art-vs-sermon debate is
      documented mostly via English/retrospective sources.
    phase: reception
    why: "Period Russian press archives not searched this session."
  - item: >-
      The censored-chapters autograph (RU-MS-03, blue-pencilled proofs of chs
      XXXIX–XL at the State Tolstoy Museum) is the highest-value visual but is not
      digitised — request-only. Provenance recorded for a future reproduction
      request.
    phase: visuals
