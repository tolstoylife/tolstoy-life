# ── SCHOLARSHIP — received view (attributed contrast layer) + triangulation ────
scholarship:
  summary: >-
    The received scholarly view, attributed here as a contrast to the primary
    record, runs: Resurrection is Tolstoy's third and last full-length novel,
    "usually regarded as inferior to War and Peace and Anna Karenina" yet a
    sensation on publication that outsold both (Wikipedia; Bartlett 2010). Its
    centre of gravity is the art-vs-sermon debate — Simmons (1968) calls the
    didacticism its "major artistic fault"; McLean (Cambridge Companion, 2002)
    recovers its artistic import; a minority (Aldiss) dissents upward. On
    genesis, the received view and the corpus PSS commentary agree: the plot came
    from Koni's Rozalia Oni case (1887); Tolstoy rushed the stalled book in 1898
    to fund the Doukhobor emigration to Canada, breaking his post-1881 refusal of
    fees. On the excommunication the conventional account is at its loosest and
    internally split — the popular line makes the mass-satire chapter the trigger
    (Bartlett: "finally exasperated by Tolstoy's blistering satire of a mass"),
    while a more careful strand sets the decree inside the long arc of Tolstoy's
    heterodoxy, and a revisionist strand inverts the Soviet-PSS Pobedonostsev-as-
    author line. Money figures for the Doukhobor fund vary by source and are not
    mutually consistent; the dive anchors only the corpus's per-sheet rate and
    advance, asserting no single total. All secondary claims attributed; none
    given byte-fidelity.
  triangulation:
    - evidenceRef: diary-1898-07-17-decision
      conventionalView: >-
        Standard: Tolstoy decided in 1898 to finish and sell the novel to fund
        the Doukhobors' move to Canada (Wikipedia; Simmons 1968; Britannica).
      relation: confirms
      source: >-
        English Wikipedia, "Resurrection (Tolstoy novel)"; Simmons 1968,
        ourcivilisation.com; Britannica. (Extends edge: the dive's PSS-sourced
        point that the deadline forced the massive expansion into the politically
        sharp final text is sharper than the handbooks.)
    - evidenceRef: letter-marks-contract
      conventionalView: >-
        Secondary "total raised" figures diverge — Wikipedia "34,200 rubles";
        gw2ru "about 30,000 rubles… and 22,000 rubles from A. F. Marx."
      relation: complicates
      source: >-
        Wikipedia, "Resurrection (Tolstoy novel)"; gw2ru, "How Leo Tolstoy
        resettled the Doukhobors in Canada." The round totals are not mutually
        consistent and none is corpus-anchored; the corpus datum is the
        per-sheet rate + 12,000 r. advance, not a lump sum.
    - evidenceRef: communion-service-physical
      conventionalView: >-
        Critics register the mass satire as real and as a flaw of taste — Simmons
        (1968) "a lapse of taste… the blasphemously satiric account"; Bartlett
        (2010) "blistering satire of a mass." The device is read as Tolstoy's
        signature остранение (defamiliarisation).
      relation: confirms
      source: >-
        Simmons 1968; Bartlett 2010 (via Goodreads description); "Estranged and
        Degraded Worlds: The Grotesque Aesthetics of Tolstoy's Resurrection"
        (academia.edu). Confirms the fact/centrality; complicates the
        value-judgement (lapse-of-taste vs deliberate technique).
    - evidenceRef: reply-eucharist-climax
      conventionalView: >-
        The popular line makes the communion chapter the trigger of the
        excommunication (Bartlett 2010; Wikipedia "publication led to" it); a
        more careful strand attributes the decree to Tolstoy's "broader religious
        writings" (gw2ru, naming A Confession and What I Believe).
      relation: contradicts
      source: >-
        Bartlett 2010 (Goodreads); Wikipedia; gw2ru, "Why was Tolstoy kicked out
        of the Russian Orthodox Church?" The dive's primary-record reading
        contradicts the strong "mass-satire-caused-it" formulation and extends
        the careful strand with the corpus's long-intent / proximate-occasion
        distinction.
    - evidenceRef: commentary-tolchok-publish
      conventionalView: >-
        Pobedonostsev's role is genuinely split: (a) "composed by Pobedonostsev"
        / long advocate (Soviet PSS; Anthony Vadkovsky Wikipedia); (b) revisionist
        — Metropolitan Antony drove it while Pobedonostsev hesitated/opposed,
        fearing it would amplify Tolstoy (socialbites.ca).
      relation: complicates
      source: >-
        Anthony Vadkovsky (Wikipedia); socialbites.ca, "Tolstoy Excommunication
        and Its Aftermath." The two secondary strands contradict each other; the
        revisionist strand complicates the corpus's authorship attribution. Left
        contested, not adjudicated — neither label allowed to harden.
    - evidenceRef: censorship-communion-cut
      conventionalView: >-
        Handbooks register heavy censorship but not the granularity — Wikipedia
        notes parts "censored and shortened" and that the complete Russian text
        was not published until 1936 (English 1938).
      relation: extends
      source: >-
        English Wikipedia, "Resurrection (Tolstoy novel)." The dive's corpus
        record is far more precise (specific chapters cut, Bonch-Bruevich's 497
        distortions / 10,240 words, the parallel-printing leak of censored proofs
        into the "uncut" Chertkov edition); the secondary view adds the useful
        1936 RU / 1938 EN first-complete-publication dates.
    - evidenceRef: diary-1899-12-18-completion
      conventionalView: >-
        Dominant verdict: "lesser than the two great novels, because didactic"
        (Simmons 1968 "major artistic fault"; Wikipedia "usually regarded as
        inferior"); minority upward dissent (Aldiss); recovery readings (McLean).
      relation: confirms
      source: >-
        Simmons 1968; Wikipedia; McLean in Orwin (ed.), The Cambridge Companion
        to Tolstoy, 2002. The "rough/unpolished" charge is confirmed by Tolstoy's
        own contemporaneous diary verdict — a primary datum the criticism rarely
        cites; the dive extends the debate by grounding it in Tolstoy's words.

