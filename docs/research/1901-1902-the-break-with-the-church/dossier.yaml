evidence:

  # --- THE EDICT & THE REPLY (the spine) ---
  - id: E01
    genre: work
    pssTom: 34
    pages: "245–253"
    date: "1901-04-17"
    addressee: null
    extract: extracts/v34_245_253_Otvet_na_opredelenie_Sinoda_ot_20_22_fevralja_i_na_poluchennye_mnoju_po_etomu_sluchaju_pisma.txt
    quoteRu: 'Известный миру писатель, русский по рождению, православный по крещению и воспитанию, граф Толстой, в прельщении гордого ума своего, дерзко восстал на господа и на Христа его и на святое его достояние, явно перед всеми отрекся от вскормившей и воспитавшей его матери, церкви православной'
    quoteEn: '(working English) The world-renowned writer, Russian by birth, Orthodox by baptism and upbringing, Count Tolstoy, in the seduction of his proud mind, has boldly risen up against the Lord and against His Christ and against His holy possession, has openly before all renounced the Orthodox Church that nourished and reared him.'
    significance: "The edict's own words, quoted verbatim inside the Reply — the spine document carries the Synod's text inside it. The phrasing the dive attributes to the Synod, never adopts as its own voice."
    facsimile: null
  - id: E02
    genre: work
    pssTom: 34
    pages: "245–253"
    date: "1901-04-17"
    addressee: null
    extract: extracts/v34_245_253_Otvet_na_opredelenie_Sinoda_ot_20_22_fevralja_i_na_poluchennye_mnoju_po_etomu_sluchaju_pisma.txt
    quoteRu: 'Постановление синода вообще имеет много недостатков. Оно незаконно или умышленно двусмысленно; оно произвольно, неосновательно, неправдиво и, кроме того, содержит в себе клевету и подстрекательство к дурным чувствам и поступкам.'
    quoteEn: '(working English) The Synod''s ruling has many defects in general. It is unlawful or intentionally equivocal; it is arbitrary, unfounded, untruthful and, besides, contains slander and incitement to evil feelings and deeds.'
    significance: "Tolstoy's structured indictment of the edict — the «незаконно или умышленно двусмысленно» line is the anathema-or-not point the scholarship now agrees with: the edict was neither a proper excommunication nor an honest statement of non-membership."
    facsimile: null
  - id: E03
    genre: work
    pssTom: 34
    pages: "245–253"
    date: "1901-04-17"
    addressee: null
    extract: extracts/v34_245_253_Otvet_na_opredelenie_Sinoda_ot_20_22_fevralja_i_na_poluchennye_mnoju_po_etomu_sluchaju_pisma.txt
    quoteRu: 'Но отрекся я от нее не потому, что я восстал на господа, а напротив, только потому, что всеми силами души желал служить ему.'
    quoteEn: '(working English) But I renounced it not because I had risen up against the Lord, but on the contrary, only because with all the powers of my soul I wished to serve Him.'
    significance: "The hinge of the Reply and the dive's marquee: the break is with the church, not with God. He accepts the fact of the renunciation and inverts its meaning."
    facsimile: null
  - id: E04
    genre: work
    pssTom: 34
    pages: "245–253"
    date: "1901-04-17"
    addressee: null
    extract: extracts/v34_245_253_Otvet_na_opredelenie_Sinoda_ot_20_22_fevralja_i_na_poluchennye_mnoju_po_etomu_sluchaju_pisma.txt
    quoteRu: 'верю в бога, которого понимаю как дух, как любовь, как начало всего.'
    quoteEn: '(working English) I believe in God, whom I understand as spirit, as love, as the origin of all things.'
    significance: "The positive credo at the centre of the Reply — answering the edict's charge that he «отвергает бога». The break is constructive, not a renunciation of faith."
    facsimile: null
  - id: E05
    genre: work
    pssTom: 34
    pages: "245–253"
    date: "1901-04-17"
    addressee: null
    extract: extracts/v34_245_253_Otvet_na_opredelenie_Sinoda_ot_20_22_fevralja_i_na_poluchennye_mnoju_po_etomu_sluchaju_pisma.txt
    quoteRu: 'вызвало, как и должно было ожидать, в людях непросвещенных и нерассуждающих озлобление и ненависть ко мне, доходящие до угроз убийства'
    quoteEn: '(working English) [the ruling] called forth, as was to be expected, in unenlightened and unreasoning people bitterness and hatred toward me, going as far as threats of murder.'
    significance: "Tolstoy's own account of the violent edge of the public reaction — the death threats — which he reads as the edict's «подстрекательство». Reception evidence from the primary text itself."
    facsimile: null
  - id: E06
    genre: work
    pssTom: 34
    pages: "245–253"
    date: "1901-04-17"
    addressee: null
    extract: extracts/v34_245_253_Otvet_na_opredelenie_Sinoda_ot_20_22_fevralja_i_na_poluchennye_mnoju_po_etomu_sluchaju_pisma.txt
    quoteRu: 'Вернуться же к тому, от чего я с такими страданиями только что вышел, я уже никак не могу, как не может летающая птица войти в скорлупу того яйца, из которого она вышла.'
    quoteEn: '(working English) To return to what I have only just left with such suffering I am quite unable, just as a flying bird cannot re-enter the shell of the egg from which it came.'
    significance: "The closing image of the Reply and the dive's keystone metaphor: the break is irreversible because it is a birth, not a defection. Answers every later call to «вернитесь к церкви»."
    facsimile: null
  - id: E07
    genre: work
    pssTom: 34
    pages: "245–253"
    date: "1901-04-17"
    addressee: null
    extract: extracts/v34_245_253_Otvet_na_opredelenie_Sinoda_ot_20_22_fevralja_i_na_poluchennye_mnoju_po_etomu_sluchaju_pisma.txt
    quoteRu: 'Я начал с того, что полюбил свою православную веру более своего спокойствия, потом полюбил христианство более своей церкви, теперь же люблю истину более всего на свете.'
    quoteEn: '(working English) I began by loving my Orthodox faith more than my peace; then I loved Christianity more than my church; and now I love truth more than anything in the world.'
    significance: "The reversed Coleridge epigraph (the Reply opens with Coleridge on loving Christianity above truth) — Tolstoy says he travelled the opposite road. The autobiography of the whole break in one sentence."
    facsimile: null

  - id: E08
    genre: commentary
    pssTom: 34
    pages: "575–577"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_575_577_Otvet_na_opredelenie_Sinoda_ot_20_22_fev.txt
    quoteRu: 'Это определение, составленное Победоносцевым, было проредактировано митрополитом петербургским и ладожским Антонием и другими членами синода и одобрено Николаем II.'
    quoteEn: '(working English) This edict, composed by Pobedonostsev, was revised by Metropolitan Antony of St Petersburg and Ladoga and other members of the Synod, and approved by Nicholas II.'
    significance: "The PSS (Soviet, 1952) attribution: Pobedonostsev drafted, Antony edited, Nicholas II approved. CONTESTED — Kolstø (2022) reverses this from the archives (see scholarship.triangulation): the initiative was the Synod's bishops, Antony chiefly; Pobedonostsev opposed it. The dive presents both, attributed."
    facsimile: null
  - id: E09
    genre: commentary
    pssTom: 34
    pages: "575–577"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_575_577_Otvet_na_opredelenie_Sinoda_ot_20_22_fev.txt
    quoteRu: 'Дальнейшая перепечатка статьи была запрещена духовной цензурой.'
    quoteEn: '(working English) Further reprinting of the article was forbidden by the spiritual [ecclesiastical] censorship.'
    significance: "The Reply first appeared in Russia only truncated (~100 lines of the sharpest passages cut) in the church journal «Миссионерское обозрение» (1901, no. 6); the ecclesiastical censorship then banned further reprints. The full text first appeared abroad (Chertkov) and complete-in-Russia only in 1905."
    facsimile: null

  # --- GENESIS: Tolstoy's own witness (the 1901–02 diary + letters) ---
  - id: E10
    genre: diary
    pssTom: 54
    pages: "90–93"
    date: "1901-04-01"
    addressee: null
    extract: extracts/diary_v54_090_093_1901_03_19.txt
    quoteRu: 'За это время было странное отлучение от церкви и вызванные им выражения сочувствия'
    quoteEn: '(working English) During this time there was the strange excommunication from the church, and the expressions of sympathy it called forth.'
    significance: "★ KEYSTONE. The first diary mention of the excommunication, on 19 March OS — almost a month after it was published. His word for it is «странное» (strange), paired at once with the «выражения сочувствия» it drew. No wound, no protest: detachment. The excommunication day itself (22 Feb) went unrecorded — a real-time silence."
    facsimile: null
  - id: E11
