    quoteRu: 'Ей богу, мы одни составляем истинную церковь'
    quoteEn: '(working English) By God, we alone constitute the true church.'
    significance: "His reduction of every church's claim to infallibility to a bare oath — the same weight as any person saying «ей богу, я прав». Since the churches are many and each says this, the claim is self-cancelling; only force can sustain it."
