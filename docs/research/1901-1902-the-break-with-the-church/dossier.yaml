  # --- RELIGION AND MORALITY (1893) — the philosophical foundation ---
  - id: E18
    genre: work
    pssTom: 39
    pages: "3–26"
    date: "1893-11-09"
    addressee: null
    extract: extracts/v39_003_026_Religija_i_nravstvennost.txt
    quoteRu: 'религия есть установленное человеком между собой и вечным бесконечным миром или началом и первопричиной его известное отношение.'
    quoteEn: '(working English) religion is a certain relation, established by a person between himself and the eternal infinite world, or its origin and first cause.'
    significance: "The definition of religion — written 1893, eight years before the excommunication. This is the ground on which the whole break stands: religion is the individual's relation to the infinite, prior to and independent of any church. The same kernel the «Что такое религия» dive dates to Feb 1901."
    facsimile: null
  - id: E19
    genre: work
    pssTom: 39
    pages: "3–26"
    date: "1893-11-09"
    addressee: null
    extract: extracts/v39_003_026_Religija_i_nravstvennost.txt
    quoteRu: 'наша церковно-государственная, низведенная на эту степень Августином, хотя она и называется не свойственным ей именем — христианской'
    quoteEn: '(working English) our church-and-state [religion], lowered to this level by Augustine, although it is called by a name not proper to it — Christian.'
    significance: "The deepest root of the break, stated in 1893: church-and-state Christianity is, in Tolstoy's taxonomy of three relations to the world, the SECOND (pagan, social-state) level wearing a name «не свойственное ей» — Christian. The institution he would be excommunicated from is, on his account, pre-Christian. (Cross-links the religion/church distinction the «Что такое религия» dive develops.)"
    facsimile: null
  - id: E20
    genre: work
    pssTom: 39
    pages: "3–26"
    date: "1893-11-09"
    addressee: null
    extract: extracts/v39_003_026_Religija_i_nravstvennost.txt
    quoteRu: 'Утверждать, что социальный прогресс производит нравственность, всё равно что утверждать, что постройка печей производит тепло.'
    quoteEn: '(working English) To assert that social progress produces morality is just like asserting that the building of stoves produces heat.'
    significance: "The image that anchors the essay's answer to the German Ethical Society: heat comes from the sun (religion); the stove (the social form) only holds it. Morality cannot be founded apart from religion — so a church that corrupts religion corrupts morality at the root (the thesis the 1902 diary, E-series, and To the Clergy carry forward)."
    facsimile: null
  - id: E21
    genre: commentary
    pssTom: 39
    pages: "225–228"
    date: "1956 (PSS apparatus)"
    addressee: null
    extract: extracts/v39_225_228_Religija_i_nravstvennost_Istorija_pisani.txt
    quoteRu: 'По-русски статья «Религия и нравственность» впервые была опубликована в журнале «Северный вестник» (1894, январь) с большими цензурными пропусками и искажениями и с измененным редакцией заглавием: «Противоречия эмпирической нравственности».'
    quoteEn: '(working English) In Russian, "Religion and Morality" was first published in the journal "Severny Vestnik" (January 1894) with large censorship cuts and distortions, and with a title changed by the editors to "The Contradictions of Empirical Morality".'
    significance: "The censorship pattern of the whole cluster, already in 1893–94: foreign editions first (German «Für Ethische Kultur» 1893–94, English «Contemporary Review» March 1894), the Russian printing cut, distorted, and retitled. The standalone edition was banned outright (Glavnoe upravlenie circular № 5412, 19 Sep 1894)."
    facsimile: null

  # --- HOW TO READ THE GOSPELS (1896) ---
  - id: E22
    genre: work
    pssTom: 39
    pages: "113–116"
    date: "1896-07-04"
    addressee: null
    extract: extracts/v39_113_116_Kak_chitat_evangelie_i_v_chem_ego_suschnost.txt
    quoteRu: 'у меня нет никакого учения, а понимаю я христианское учение так, как оно изложено в евангелиях.'
    quoteEn: '(working English) I have no teaching of my own; I understand the Christian teaching as it is set forth in the Gospels.'
    significance: "The constructive answer to the church's monopoly on interpretation: there is no «учение Толстого» (cross-links the tolstoyanism dive's keystone) — only the Gospels, read directly. The method that makes the church's mediation unnecessary."
    facsimile: null
  - id: E23
    genre: work
    pssTom: 39
    pages: "113–116"
    date: "1896-07-04"
    addressee: null
    extract: extracts/v39_113_116_Kak_chitat_evangelie_i_v_chem_ego_suschnost.txt
    quoteRu: 'Пусть каждый, читая евангелие, подчеркнет всё то, что ему кажется вполне простым, ясным и понятным, — синим карандашом, отметив, кроме того, красным карандашом из отмеченного синим слова самого Христа'
    quoteEn: '(working English) Let everyone, reading the Gospel, underline in blue pencil everything that seems to him fully simple, clear, and intelligible, and mark besides, in red pencil, the words of Christ himself among what is underlined in blue.'
    significance: "The blue-and-red-pencil method: a layman's tool for stripping the church's gloss and finding the teaching directly — the practical inverse of «К духовенству»'s account of how the church teaches scripture to those who cannot judge it."
    facsimile: null

  # --- ON RELIGIOUS TOLERANCE (1901) ---
  - id: E24
    genre: work
    pssTom: 34
    pages: "291–298"
    date: "1902-01-10"
    addressee: null
    extract: extracts/v34_291_298_O_veroterpimosti.txt
    quoteRu: 'по самому определению своему, церковь не может быть веротерпима'
    quoteEn: '(working English) by its very definition, the church cannot be tolerant.'
    significance: "The pivot of «О веротерпимости» (occasioned by Stakhovich's freedom-of-conscience speech at the Oryol missionary congress): a church that claims to hold the one saving truth cannot, by definition, tolerate dissent — so the demand for a tolerant church is incoherent."
    facsimile: null
  - id: E25
    genre: work
    pssTom: 34
    pages: "291–298"
    date: "1902-01-10"
    addressee: null
    extract: extracts/v34_291_298_O_veroterpimosti.txt
    quoteRu: 'учреждение, называющее себя христианской церковью, не есть христианское учреждение, а мирское учреждение, несогласное с христианством и скорее враждебное ему.'
    quoteEn: '(working English) the institution calling itself the Christian church is not a Christian institution but a worldly one, at odds with Christianity and rather hostile to it.'
    significance: "The sharpest statement of the dive's core: the church is not a degraded form of Christianity but a worldly institution hostile to it. The conclusion he says he first disbelieved («я не поверил ей») and then could not escape."
    facsimile: null
  - id: E26
