    quoteEn: '(working English) The Reply to the Synod, it seems, is finished. […] The greetings and the abuse continue.'
    significance: "The dated completion of the Reply (31 March OS; the printed text bears 4 April). «Продолжаются приветствия и ругательства» — the divided public response (acclaim and abuse) in his own four words."
    facsimile: null
  - id: E13
