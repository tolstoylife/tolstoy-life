    addressee: null
    extract: extracts/v34_291_298_O_veroterpimosti.txt
    quoteRu: 'Веротерпимым может быть только истинное, свободное христианство, не связанное ни с какими мирскими учреждениями'
    quoteEn: '(working English) Only true, free Christianity, bound to no worldly institutions, can be tolerant.'
    significance: "The constructive close: the remedy is not a tolerant church but free Christianity, and (earlier in the essay) not «tolerance» from the church but the state's withdrawal of its exclusive support — separation, not reform."
    facsimile: null

  # --- TO THE CLERGY (1902) ---
  - id: E28
    genre: work
    pssTom: 34
    pages: "299–318"
    date: "1902-11-14"
    addressee: null
    extract: extracts/v34_299_318_K_duhovenstvu.txt
    quoteRu: 'Средство это есть внушение церковного учения людям в том состоянии, в котором они не могут обсудить того, что им передается.'
    quoteEn: '(working English) This means is the suggestion of church teaching to people in a state in which they cannot weigh what is conveyed to them.'
    significance: "The charge at the heart of «К духовенству»: the church's most powerful method is внушение (suggestion/hypnosis) to those who cannot judge — above all children. The corruption is moral as well as intellectual."
    facsimile: null
  - id: E29
    genre: work
    pssTom: 34
    pages: "299–318"
    date: "1902-11-14"
    addressee: null
    extract: extracts/v34_299_318_K_duhovenstvu.txt
    quoteRu: 'Христианство, проповедуемое вами, есть прививка ложного христианства, как прививка оспы или дифтерита, делающая того, кому она прививается, уже неспособным принять истинное христианство.'
    quoteEn: '(working English) The Christianity you preach is an inoculation of false Christianity — like a smallpox or diphtheria vaccination — making the one inoculated unable to receive true Christianity.'
    significance: "The vaccination image — church Christianity as an inoculation that immunises against the real thing. The most concentrated form of the dive's thesis that the church does not merely fail to convey Christianity but actively blocks it."
    facsimile: null
  - id: E30
    genre: work
    pssTom: 34
    pages: "299–318"
    date: "1902-11-14"
    addressee: null
    extract: extracts/v34_299_318_K_duhovenstvu.txt
    quoteRu: 'Положа руку на сердце, спросите себя, верите ли вы в то, что проповедуете?'
    quoteEn: '(working English) Hand on heart, ask yourselves: do you believe what you preach?'
    significance: "The direct appeal to the clergy's conscience — the work's rhetorical core. He answers for them: «нет, не верите». The address is to clergy of every confession (papas, cardinals, pastors), not the Orthodox alone — the break is with the church as such."
    facsimile: null
  - id: E31
    genre: work
    pssTom: 34
    pages: "299–318"
    date: "1902-11-14"
    addressee: null
    extract: extracts/v34_299_318_K_duhovenstvu.txt
    quoteRu: 'в голове, в которую вбит клин троицы или бога, сделавшегося человеком и своим страданием искупившего род человеческий и потом опять улетевшего на небо, не может уже удержаться никакое разумное, твердое убеждение.'
    quoteEn: '(working English) in a head into which the wedge of the Trinity has been driven — or of a God who became man and by his suffering redeemed the human race and then flew up to heaven again — no reasonable, firm conviction can hold any longer.'
    significance: "The wedge-in-the-grain-bin image: drive in one absurd dogma and the mind can hold no firm conviction afterward. The intellectual half of the harm (the moral half is the inoculation, E29)."
    facsimile: null

  # --- THE RESTORATION OF HELL (1902) — reconcile/cross-link 1903-folk-tales ---
  - id: E32
    genre: work
    pssTom: 34
    pages: "100–115"
    date: "1903-01"
    addressee: null
    extract: extracts/v34_100_115_Razrushenie_ada_i_vosstanovlenie_ego.txt
    quoteRu: 'Дело шло хорошо, но я боялся, как бы они не увидали слишком очевидного обмана, и тогда я выдумал церковь.'
    quoteEn: '(working English) Things were going well, but I feared they might notice the too-obvious deception — and so I invented the church.'
    significance: "The thesis of the satirical legend in the devil's own mouth: the church is the devil-in-the-cape's invention for keeping Christ's teaching from working. Conceived as a companion-illustration to «К духовенству». FULL treatment is in the 1903-folk-tales dive — cross-referenced, not duplicated, here."
    facsimile: null
  - id: E33
    genre: work
    pssTom: 34
    pages: "100–115"
    date: "1903-01"
    addressee: null
    extract: extracts/v34_100_115_Razrushenie_ada_i_vosstanovlenie_ego.txt
    quoteRu: 'Так переделал, что люди верят не в его ученье, а в мое, которое они называют его именем.'
    quoteEn: '(working English) I reworked it so that people believe not in his teaching but in mine, which they call by his name.'
    significance: "The legend's mechanism — Christ's teaching kept under Christ's name but emptied of content. The fiction-side statement of E25/E29's argument. (Cross-link 1903-folk-tales for the genesis, the Shchegolyonok source, and the ban arc.)"
    facsimile: null

  # --- THE TEACHING OF CHRIST FOR CHILDREN (1907–08) — the constructive endpoint ---
  - id: E34
    genre: work
    pssTom: 37
    pages: "97–147"
    date: "1908-06-25"
    addressee: null
    extract: extracts/v37_097_147_Uchenie_Hrista_izlozhennoe_dlja_detej.txt
    quoteRu: 'Иисус Христос своим учением и жизнью открыл людям то, что дух божий живет в каждом человеке.'
    quoteEn: '(working English) Jesus Christ, by his teaching and his life, revealed to people that the spirit of God lives in every person.'
    significance: "The opening of the children's gospel — the teaching as Tolstoy would have children receive it, with comprehension questions after each chapter. The exact inverse of «К духовенству»'s account of how the church teaches children the Nicene Creed and the «священная история»."
    facsimile: null
  - id: E35
    genre: work
    pssTom: 37
    pages: "97–147"
    date: "1908-06-25"
    addressee: null
    extract: extracts/v37_097_147_Uchenie_Hrista_izlozhennoe_dlja_detej.txt
    quoteRu: 'Иисус пососал губку и сказал громким голосом: — Кончено! Отец, в руки твои отдаю дух мой! — И, склонив голову, испустил дух.'
    quoteEn: '(working English) Jesus sucked the sponge and said in a loud voice: "It is finished! Father, into thy hands I give my spirit!" — and, bowing his head, gave up the spirit.'
    significance: "The children's gospel ends at the human death of Jesus — NO bodily resurrection. The de-mythologised faith embodied: exactly the «воскресение из мертвых» the Synod's edict charged him with denying, and which he denies plainly even in a book for children."
    facsimile: null

