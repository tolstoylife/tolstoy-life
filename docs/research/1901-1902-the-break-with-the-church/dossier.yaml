# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). Mainstream = contrast, not baseline.
# Full sweep + 26 sources: extracts/_scholarship.md.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    Mainstream scholarship agrees that Tolstoy had broken with the institutional Church by the early
    1880s and that 1901 only made the rupture official. The single most important historiographical
    point is the nature of the edict: it was NOT a formal анафема (anathema) but an отлучение — a
    declaration that Tolstoy had, by his own public statements, placed himself outside the Church
    («не числит его более членом церкви ... доколе он не раскается»). Tolstoy himself seized on this
    («незаконно или умышленно двусмысленно»), and Kolstø (2022) calls it «both an excommunication
    and not an excommunication» — a self-defeating attempt to do two incompatible things at once.
    Kolstø's «Heretical Orthodoxy» (Cambridge, 2022) is the current benchmark and overturns the
    Soviet-era attribution preserved in the PSS apparatus: the archival record shows the edict was
    initiated by the Synod's own priestly members (Metropolitan Antony Vadkovsky chiefly), while
    Ober-Procurator Pobedonostsev OPPOSED it, fearing it would amplify Tolstoy's prestige — which it
    did. The public reaction backfired on the Church: crowds acclaimed Tolstoy in Moscow, Repin's
    portrait was showered with flowers, and ~500 students marched on the Kazan Cathedral demanding
    to be excommunicated too. Mainstream biography (Maude 1910; Bartlett 2010; Medzhibovskaya 2008)
    treats the 1901–02 works piecemeal; the corpus clusters them as one sustained 18-month riposte.
  triangulation:
    - evidenceRef: E03
      conventionalView: "1901 was the moment of rupture (the 'excommunication' that cast Tolstoy out)."
      relation: extends
      source: "Medzhibovskaya 2008, Tolstoy and the Religious Culture of His Time; Kolstø 2022, ch. 12. The corpus shows the break was self-declared ~20 years earlier (E18–E19, 1893) and only formalised in 1901."
    - evidenceRef: E02
      conventionalView: "The action is commonly called an 'excommunication' (anathema framing in the popular press)."
      relation: complicates
      source: "Kolstø 2022 ('both an excommunication and not'); Archim. Tikhon Shevkunov 2010 ('merely stated an accomplished fact'). Scholarship now agrees with Tolstoy's own «двусмысленно»: it was an отлучение, not an анафема."
    - evidenceRef: E08
      conventionalView: "Pobedonostsev drove the edict (PSS apparatus, 1952; Soviet historians; popular account)."
      relation: contradicts
      source: "Kolstø 2022 (archival): Metropolitan Antony Vadkovsky and the Synod's priestly members initiated it; Pobedonostsev opposed it. The PSS apparatus (E08) preserves the Soviet attribution the dive flags as superseded."
    - evidenceRef: E04
      conventionalView: "The 'excommunicated' framing casts Tolstoy implicitly as anti-religious / God-denying (the edict's own charge)."
      relation: contradicts
      source: "Tolstoy's Reply explicitly affirms faith in God (E04); the corpus and Kolstø 2022 show the break was a religious act, not its abandonment."
    - evidenceRef: E25
      conventionalView: "Biographies treat the 1901–02 anticlerical writings as separate occasional pieces."
      relation: extends
      source: "Maude 1910 ch. 16; Bartlett 2010. The corpus clusters Reply + To the Clergy + Restoration of Hell + On Religious Tolerance as one 18-month polemical unit with a shared thesis (church = мирское учреждение)."
    - evidenceRef: E05
      conventionalView: "The Church framed the edict as a protective pastoral measure."
      relation: extends
      source: "Long 1901; Maude 1910 ch. 16. Tolstoy read it as incitement to violence (E05); the documented backfire — acclaim, flowers at the Repin portrait, the student march — is Kolstø's central 'miscalculation' argument."

