    quoteEn: '(working English) the only means in our time of serving humanity consists in destroying corrupted Christianity and establishing the true Christian religion.'
    significance: "The whole church-break project in one year-end sentence: demolition AND reconstruction. The negative cluster (Reply, To the Clergy, Restoration of Hell) and the positive cluster (Religion and Morality, the gospel works) are two halves of this one programme."
