topic:
  slug: 1901-1902-the-break-with-the-church
  title: "The break with the Church — Tolstoy, the Holy Synod, and the 1901 excommunication"
  question: >-
    The 1901 break between Tolstoy and the Russian Orthodox Church: the Holy Synod's edict of
    20–22 February 1901, Tolstoy's «Ответ Синоду», and the cluster of anticlerical works around it
    («К духовенству», «Разрушение ада», «О веротерпимости») — read together with the constructive
    counter-faith they were paired with («Религия и нравственность», «Как читать евангелие»,
    «Учение Христа, изложенное для детей»). What the edict was and was not; how Tolstoy answered it;
    and the thesis the cluster makes plain — that he had broken with the church (not God) on
    principle long before, and 1901 only ratified, belatedly and (he argued) ambiguously, a
    separation he had already made.
  date: "2026-06-13"
  period: "1893–1908, centred on the 1901–1902 cluster (the spine event = the Feb 1901 edict)"
  corpusSurface: >-
    PSS Tom 34 (the 1900–1903 statyi + the legend «Разрушение ада»: Reply to the Synod, To the
    Clergy, On Religious Tolerance, The Restoration of Hell) and their «История писания» apparatus;
    Tom 37 (The Teaching of Christ for Children + apparatus); Tom 39 (Religion and Morality, How to
    Read the Gospels + apparatus); Tom 54 (the 1901–1902 diary, all 85 entries); Tom 73 (the
    1901–1902 letters — to Nicholas II and the intermediary Grand Duke Nikolai Mikhailovich).
  dateRange: "1893-08 – 1908-06 (composition); spine event 1901-02"

