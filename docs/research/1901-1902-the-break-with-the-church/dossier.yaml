    quoteEn: '(working English) People urge me to pray, to keep the fast, and to perform all those acts that give such great comfort when one believes in their efficacy.'
    significance: "Direct witness to the post-excommunication pressure to reconcile with the church — people pressing him back to the rites. He refuses."
