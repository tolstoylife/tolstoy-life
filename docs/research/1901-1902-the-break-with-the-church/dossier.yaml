    quoteEn: '(working English) it became completely clear that our whole Orthodoxy is sorcery born of fear. And the root of it all is belief in the miraculous.'
    significance: "His core diagnosis of the church, written in the weeks he was drafting the Reply — Orthodoxy as колдовство (sorcery) rooted in belief in the miraculous. The same charge the Reply makes of the sacraments."
    facsimile: null
