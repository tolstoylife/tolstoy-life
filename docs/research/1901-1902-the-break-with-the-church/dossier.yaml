contradictions:
  - claim: "The 1901 action was a formal anathema (анафема) — Tolstoy was 'cursed' by the Church (popular/press framing)."
    correction: "The edict was an отлучение — a declaration that Tolstoy had placed himself outside the Church («не числит его более своим членом ... доколе он не раскается»), explicitly not the liturgical anathema. Tolstoy himself flagged the ambiguity (E02); scholarship (Kolstø 2022) and the Church's own 2010 statement agree."
    evidenceRef: E02
  - claim: "Pobedonostsev drove / drafted the excommunication (PSS apparatus E08; Soviet historians; popular account)."
    correction: "Kolstø (2022), from the archives, shows the initiative was the Synod's priestly members (Metropolitan Antony Vadkovsky chiefly); Pobedonostsev OPPOSED it, fearing it would amplify Tolstoy's prestige. The PSS apparatus preserves the superseded Soviet attribution; the dive presents both, attributed."
    evidenceRef: E08
  - claim: "«Религия и нравственность» was completed in 1898 (the date «28 октября 1898 г.» printed by Birukov in PSS-1913 vol. XV)."
    correction: "The year is a known error (the PSS т.39 apparatus flags it twice): the essay was written and signed 28 October 1893; the later signed ms. is lost. Composition is Aug–Oct 1893, occasioned by Gizycki's August 1893 letter."
    evidenceRef: E21

