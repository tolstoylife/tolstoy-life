  - "Chertkov's own letter of 10 Feb 1902 (NS) responding to the essay in detail — referenced in the PSS apparatus but not in the local corpus (T. 88 extracts do not include Chertkov-to-Tolstoy letters)."
  - "Full manuscript collation of the 82 drafts (1,449 units) — requires GTM Manuscript Department access."
