coverage:
  - surface: "Genesis & composition"
    status: covered
    note: "Full arc from Nov 1900 three-article plan through Chicherin rejection (Feb 1901), composition at Yasnaya Polyana (Aug–Sept 1901) and Gaspra (Sept 1901 – Jan 1902), multiple completion notes, and post-despatch additions during pneumonia (Jan–Feb 1902)."

  - surface: "What the work says"
    status: covered
    note: "All 17 chapters read. Structural map: I–II (religion vs science); III (definition); IV (equality as religion's core); V (three corruption mechanisms); VI (the Church truc); VII (faith redefined); VIII–IX (the irreligious present); X–XI (norms-without-religion pathologies); XII–XIII (scholars as gatekeepers); XIV (four propositions of universal religion); XV (what education should do); XVI–XVII (the vicious circle and who breaks it)."

  - surface: "Redactions & textual history"
    status: partial
    note: "82 manuscripts (1,449 units) known from PSS. Main textual variants in the Free Word edition noted (three places where Chertkov's editors restored material Tolstoy had struck). The lost Chapter III late insertion (not received by Chertkov) documented. Full collation requires the manuscripts at the Tolstoy Museum."

  - surface: "Publication, censorship & translation"
    status: covered
    note: "Free Word No. 75 (Christchurch, 1902); Russian ban; first Russian publication 1906; French translation Bienstock + Biryukov (Paris, Stock, 1902); Tolstoy's verdict on the French translation ('ужасным'); censorship circumvention attempt via journal Obrazovanie (Dec 1902, blocked Jan 1903)."

  - surface: "Reception & afterlife — Russian society & church reaction"
    status: partial
    note: "The excommunication context is covered (the 22–24 Feb 1901 OS Synod decree preceded the essay; the treatise's critique of an infallible institutional Church bears on it but is not a formal reply, and the decree is not named in the text). Contemporary Russian press and clerical reaction to the published essay specifically is not in the corpus extracts and was not found in the web scholarship sweep. Requires targeted archival or newspaper research."

  - surface: "Composition-year interlocutors (people around the work)"
    status: covered
    note: "Network of 11 correspondents during composition identified and documented. See entities section."

  - surface: "Place in the cluster (sibling works)"
    status: covered
    note: "Cross-linked to existing dives: A Confession (1879–82), What I Believe (1882–84), Examination of Dogmatic Theology (1879–80), Kingdom of God Is Within You (1890–93), What Is Art? (1897–98), The Slavery of Our Times (1900), Christianity and Patriotism (1893–94), plus the theme dives christian / christian-anarchism / christian-communism-socialism. The near-contemporary On Religious Tolerance (О веротерпимости, Nov–Dec 1901) and On Freedom of Conscience are sibling works with NO dedicated dive yet (mentioned, not linked)."

  - surface: "Author's later verdict"
    status: partial
    note: "The 30 Nov 1901 letter calls the work 'one-sided' (одностороннюю); the Grauberger letter (Jan 1902) claims it expresses his 'definitive' conviction. No post-publication retrospective statement found in the corpus."

  - surface: "Visual & manuscript record"
    status: covered
    note: "9 images downloaded; visuals sweep complete. Manuscript holdings at GTM/AN USSR noted; no facsimile in local corpus."

  - surface: "Scholarly context"
    status: partial
    note: "Light web sweep completed; no deep academic database search. Core biographers (Maude, Bartlett) and Cambridge Core article identified. No dedicated monograph on this essay found."

