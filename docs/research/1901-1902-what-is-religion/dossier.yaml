    facsimile: ""

  - id: ev-notebook-1900-1901
    genre: notebook
    pssTom: 54
    pages: "211–240"
    date: "1900-01 / 1901-03"
    addressee: ""
    localPdf: ""
    extract: "extracts/v54_211_240_Zapisnaja_knizhka.txt"
    quoteRu: "Les obligations de l’homme envers Dieu voilà la religion ( Vauvenargues ).¹¹³¹\n\nLa religion est une affaire entre chaque homme et Dieu. (Beile).¹¹³²\n\nLa religion est le résultat des besoins de l’âme et des efforts de l’ intéligence. (B. Constant ).¹¹³³"
    quoteEn: "(working English) [Vauvenargues:] 'The obligations of man toward God — that is religion.' [Bayle:] 'Religion is a matter between each man and God.' [Constant:] 'Religion is the result of the needs of the soul and the efforts of the intelligence.'"
    significance: "Notebook cluster of French-language выписки from Vauvenargues, Bayle, Constant, Proudhon, Rousseau, Swift — the direct source material for the survey of definitions in chapter II. Coleridge noted absent from this notebook; Goblet d'Alviella and Reville appear only in the text itself."
    facsimile: ""

