needsReview:
  - item: "Title in flux at completion — «назначение» (purpose) vs «сущность» (essence): the 30 Nov 1901 Chertkov letter uses «назначение», the Grauberger letter (20 Jan 1902) uses «сущность». The works record should use «сущность» (PSS canonical form), but the workRecord titleAlternatives entry for the «назначение» variant should be confirmed."
    phase: 4
    why: "Minor but affects the workRecord titleAlternatives field."

  - item: "Chapter count — documented discrepancy. The PSS Tom 35 manuscript description states the critical text is главы I—XVIII (18 chapters; MS 76 'finishes it with the XVIII chapter', MS 82 'главы I—XVIII'); the tolstoydigital TEI used here carries only 17 numbered heads (I–XVII). Tolstoy's own count was lower mid-composition (12 + 'едва ли 6' on 6 Nov; 'last, 16th chapter' on 30 Nov) and grew into December. The one-head gap (TEI 17 vs PSS 18) is unresolved — most likely a chapter break not carried into the digitised heads; the local PSS Tom 35 scan has no usable text layer for an independent count. Chapter numbers cited in the dive follow the TEI heads; quotes are byte-faithful. A manual PSS-print count would confirm where the gap falls."
    phase: 2
    why: "TEI (17 heads) and the PSS manuscript description (18 chapters) differ by one; the dive states this honestly and numbers per the TEI."

  - item: "Subcategory for the works record — placed under Essays and Criticism following What Is Art?. The essay is also classified as 'religious' (PSS) and 'philosophical'. Johann should confirm the preferred subcategory."
    phase: 4
    why: "Schema judgment — not a mechanical question."

  - item: "Biryukov's role description — the PSS apparatus says 'co-translator' (Bienstock + Biryukov); Tolstoy's letter to Biryukov (31 Dec 1901) mentions him reviewing a Binshtok translation's religious-philosophical section, not necessarily co-authoring. The distinction between reviser and co-translator of the French edition needs confirmation against the French title page."
    phase: 3
    why: "Biryukov's vault page and the works record should accurately reflect his role."

