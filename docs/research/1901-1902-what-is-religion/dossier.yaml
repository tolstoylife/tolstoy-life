topic:
  slug: 1901-1902-what-is-religion
  title: "«Что такое религия и в чём сущность её?» / What Is Religion and What Is Its Essence?"
  question: "What does the treatise argue, how was it composed at Gaspra during Tolstoy's grave illness just after his excommunication, who were its interlocutors, and what is its place in the Prophet-period cluster?"
  date: "2026-06-07"
  period: Prophet period (1880–1910)
  corpusSurface: "Main text (PSS T. 35); PSS editorial apparatus (history of writing, manuscript description); Diary T. 54 (1900–1901 entries); Letters T. 73 (Aug 1901 – Dec 1902); Letters T. 88 (to Chertkov, Aug–Nov 1901); Notebook T. 54 (Jan 1900–Mar 1901)"
  dateRange: "1900-11-07 to 1902-01-20"

evidence:
  - id: ev-main-text
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "Истинная религия есть такое согласное с разумом и знаниями человека установленное им отношение к окружающей его бесконечной жизни, которое связывает его жизнь с этой бесконечностью и руководит его поступками."
    quoteEn: "(working English) True religion is such a relation, established by man in accord with his reason and knowledge, to the infinite life surrounding him, which binds his life to that infinity and guides his actions."
    significance: "The treatise's core positive definition of religion — given at the close of chapter III. Distinguishes true religion from both church orthodoxy and positivist science as substitutes."
    facsimile: ""

  - id: ev-definition-ch2
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "Всякая религия есть установление отношения человека к бесконечному существованию, которому он чувствует себя причастным и из которого он выводит руководство своей деятельности."
    quoteEn: "(working English) Every religion is an establishment of man's relation to the infinite existence of which he feels himself a part and from which he draws guidance for his activity."
    significance: "Chapter III synthesis statement after surveying Vauvenargues, Bayle, Constant, Goblet d'Alviella, and Reville — establishes the structural unity of all religions."
    facsimile: ""

  - id: ev-corruption-three-means
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "А нужно было внушать во всех религиях одни и те же три положения, служащие основанием всех тех извращений, которым подвергались стареющие религии. Во-первых, то, что есть особенного рода люди, которые одни могут быть посредниками между людьми и Богом или богами; во-вторых, то, что совершились и совершаются чудеса, которые доказывают и подтверждают истинность того, что говорят посредники между людьми и Богом, и"
    quoteEn: "(working English) In all religions it was necessary to instil the same three propositions that underlie all the corruptions to which ageing religions are subjected: first, that there exist special people who alone can mediate between humans and God; second, that miracles occurred and occur; and third, that there exist certain words that express the unchanging will of God."
    significance: "Chapter V — the three mechanisms of religious corruption (priesthood, miracles, scripture) applied to all historical religions including Christianity. Connects the church critique to a universal structural argument."
    facsimile: ""

  - id: ev-equality-core
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "признание равенства людей есть неизбежное, основное свойство всякой религии."
    quoteEn: "(working English) The recognition of the equality of people is the inevitable, fundamental property of every religion."
    significance: "Chapter IV — Tolstoy's structural claim that equality is the one feature all authentic religions share, and that corruption always consists in hiding or inverting this feature."
    facsimile: ""

  - id: ev-church-truc
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "Truc этот состоит в том, что приписывается непогрешимость не только известной букве, но и известному собранию людей, называемому церковью и имеющему право передавать эту непогрешимость избираемым ими людям."
    quoteEn: "(working English) The trick consists in attributing infallibility not only to certain written texts but to a certain assembly of people called the Church, which has the right to transfer that infallibility to people of its own choosing."
    significance: "Chapter VI — the specific Christian novelty in the corruption sequence: the concept of the Church as an infallible body, which renders all evangelical safeguards (against priesthood, texts) void."
    facsimile: ""

  - id: ev-faith-definition
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "Вера есть сознание человеком такого своего положения в мире, которое обязывает его к известным поступкам."
    quoteEn: "(working English) Faith is a person's awareness of such a position in the world as obliges him to certain actions."
    significance: "Chapter VII — Tolstoy's own definition of faith, contrasted with the Hebrews epistle's definition and with the catechism. Faith is not credence or hope but a defining awareness of one's situatedness that generates conduct."
    facsimile: ""

  - id: ev-universal-religion-ch14
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "Положения эти в том, что есть Бог, начало всего; что в человеке есть частица этого божественного начала, которую он может уменьшить или увеличить в себе своей жизнью; что для увеличения этого начала человек должен подавлять свои страсти и увеличивать в себе любовь; и что практическое средство достижения этого состоит в том, чтобы поступать с другими так же, как хочешь, чтобы поступали с тобою."
    quoteEn: "(working English) These propositions are: that there is God, the source of all; that in man there is a particle of this divine principle, which he can diminish or increase in himself through his life; that to increase this principle man must subdue his passions and increase love in himself; and that the practical means of achieving this is to act toward others as one wishes them to act toward oneself."
    significance: "Chapter XIV — the four propositions of the 'universal religion' common to Brahmanism, Judaism, Confucianism, Taoism, Buddhism, Christianity, and Islam. The culminating positive argument of the treatise."
    facsimile: ""

  - id: ev-religious-people-break-circle
    genre: work
    pssTom: 35
    pages: "157–198"
    date: "1901-08–1902-01"
    localPdf: ""
    extract: "extracts/v35_157_198_Chto_takoe_religiya.txt"
    quoteRu: "Как ни мало таких людей, как ни низко их общественное положение, как ни слабы они образованием или умом, люди эти так же верно, как огонь зажигает сухую степь, зажгут весь мир, все высохшие от долгой безрелигиозной жизни сердца людей, жаждущие обновления."
    quoteEn: "(working English) However few such people are, however low their social position, however weak in education or mind — these people, just as surely as fire ignites the dry steppe, will kindle the whole world, all the hearts dried out by a long irreligious life that thirst for renewal."
    significance: "Chapter XVII — the closing prophetic image: the true religious person, like fire on dry steppe, will break the vicious circle of false religion and state violence. A rare moment of eschatological confidence in Tolstoy's late prose."
    facsimile: ""

  - id: ev-diary-1900-11-07
    genre: diary
    pssTom: 54
    pages: "53–54"
    date: "1900-11-07"
    addressee: ""
    localPdf: ""
    extract: "extracts/v54_053_054_1900_11_07.txt"
    quoteRu: "2) Думал о трех статьях: 1) Письмо Китайцам, 2) О том, что все на убийстве, и 3) что у нас quasi христиан нет никакой религии."
    quoteEn: "(working English) Thought about three articles: … 3) that we quasi-Christians have no religion at all."
    significance: "First recorded crystallisation — embryonic third article of a planned trilogy. The three-article frame was later collapsed into one work."
    facsimile: ""

  - id: ev-diary-1901-02-08
    genre: diary
    pssTom: 54
    pages: "86–89"
    date: "1901-02-08"
    addressee: ""
    localPdf: ""
    extract: "extracts/v54_086_089_1901_02_08.txt"
    quoteRu: "Искал определение религии, взял книгу Чичерина — Религия и Наука. Искусственные построения на заданную тему. Мое определение такое: Это — такое установление человеком отношения к бесконечному,¹⁰ которым¹¹ определяется цель его жизни."
    quoteEn: "(working English) Sought a definition of religion, took Chicherin's book Religion and Science. Artificial constructions on a set theme. My definition is: It is such an establishment by man of his relation to the infinite, by which the purpose of his life is determined."
    significance: "Definitional keystone of the treatise — first articulation of the relation-to-the-infinite formula, dated about two weeks before the Holy Synod excommunication decree (22–24 Feb 1901 OS)."
    facsimile: ""

  - id: ev-diary-1901-02-11
    genre: diary
    pssTom: 54
    pages: "89–90"
    date: "1901-02-11"
    addressee: ""
    localPdf: ""
    extract: "extracts/v54_089_090_1901_02_11.txt"
    quoteRu: "Еще думал, что обращение к китайцам надо оставить. А прямо озаглавить: Безбожное время или новое падение Рима. И прямо начать с указания на отсутствие религии."
    quoteEn: "(working English) Also thought that the address to the Chinese should be dropped. Instead simply title it: A Godless Time, or the New Fall of Rome. And open directly with pointing to the absence of religion."
    significance: "First candidate title — «Безбожное время, или новое падение Рима» — confirms merger of three projected articles into one work. Title ultimately abandoned."
    facsimile: ""

  - id: ev-diary-1901-10-10
    genre: diary
    pssTom: 54
    pages: "110–112"
    date: "1901-10-10"
    addressee: ""
    localPdf: ""
    extract: "extracts/v54_110_112_1901_10_10.txt"
    quoteRu: "За все это время работаю над Религией. Кажется подвигается, но и умственно стал слабее, меньше времени могу работать."
    quoteEn: "(working English) All this time I have been working on Religion. It seems to be progressing, but mentally I have grown weaker, less time to work."
    significance: "Confirms active drafting at Gaspra, written despite serious illness that would continue through winter. Entry also contains aphorisms that recur in the treatise."
    facsimile: ""

  - id: ev-diary-1901-11-29
    genre: diary
    pssTom: 54
    pages: "113–115"
    date: "1901-11-29"
    addressee: ""
    localPdf: ""
    extract: "extracts/v54_113_115_1901_11_29.txt"
    quoteRu: "Я думаю, что кончил о религии. Как всегда сомневаюсь в важности и доброте этого сочинения, но кажется теперь более основательно, чем в прежних случаях."
    quoteEn: "(working English) I think I have finished On religion. As always I doubt the importance and quality of this work, but it seems now more well-grounded than in previous cases."
    significance: "First 'I think I have finished' declaration — immediately qualified by characteristic self-doubt, but 'основательно' (more thoroughly grounded) is a positive register rare in his post-completion notes."
    facsimile: ""

  - id: ev-diary-1901-12-26
    genre: diary
    pssTom: 54
    pages: "115–117"
    date: "1901-12-26"
    addressee: ""
    localPdf: ""
    extract: "extracts/v54_115_117_1901_12_26.txt"
    quoteRu: "Кончил о религии. Но должно быть пересмотрю еще."
    quoteEn: "(working English) Finished On religion. But I will probably review it again."
    significance: "Definitive completion declaration. Entry also contains a late alternative definition: 'Religion is such a state in which actions are conditioned not by considerations of this temporal life alone, but by considerations of the whole eternal, infinite life' — a consequence-oriented formulation complementing the February relation-to-the-infinite formula."
    facsimile: ""

  - id: ev-letter-chertkov-aug12
    genre: letter
    pssTom: 88
    pages: "243–244"
    date: "1901-08-12"
    addressee: "В. Г. Чертков (Vladimir Chertkov)"
    localPdf: ""
    extract: "extracts/v88_636_avgusta12.txt"
    quoteRu: "начал о религии, о ее значении и об отсутствии ее в нашем мире.⁴ Надеюсь и чувствую, что эта статья увлечет меня и даст возможность высказать многое, что хочется высказать. Надо торопиться."
    quoteEn: "(working English) I have begun [writing] about religion, about its significance and about its absence in our world. I hope and feel that this article will carry me away and will make it possible to say much that I want to say. I must hurry."
    significance: "Start-of-composition announcement to Chertkov. «Надо торопиться» — the urgency note signals Tolstoy's awareness of age and declining health."
    facsimile: ""

  - id: ev-letter-chertkov-sep14
    genre: letter
    pssTom: 88
    pages: "244–246"
    date: "1901-09-14"
    addressee: "В. Г. Чертков (Vladimir Chertkov)"
    localPdf: ""
    extract: "extracts/v88_637_sentyabrya14.txt"
    quoteRu: "Две, включая и О p e л иг ии, у меня есть вещи, которые я буду виноват, если не кончу до смерти.⁶ Виноват, потому что мог сделать это прежде."
    quoteEn: "(working English) Two things — including On Religion — are works for which I shall be guilty if I do not finish them before death. Guilty, because I could have done it earlier."
    significance: "Tolstoy ranks the religion essay among the two things he must finish before death. Written from Gaspra, day 4 of arrival; drafts left behind at Yasnaya Polyana."
    facsimile: ""

  - id: ev-letter-chertkov-nov6
    genre: letter
    pssTom: 88
    pages: "247–250"
    date: "1901-11-06"
    addressee: "В. Г. Чертков (Vladimir Chertkov)"
    localPdf: ""
    extract: "extracts/v88_641_noyabrya6.txt"
    quoteRu: "Пишу я, как вы знаете, о религии, «Что такое религия?». Написано и много раз пересмотрено 12 глав, — остается едва ли 6."
    quoteEn: "(working English) I am writing, as you know, about religion, 'What is religion?' Twelve chapters have been written and many times reviewed — barely 6 remain."
    significance: "Mid-composition chapter count — 12 done + ~6 remaining = projected ~18. Also: Tolstoy had been reading Mikhailovsky on religion ('произвольная, легкомысленная, ничего не говорящая чепуха') and Kuno Fischer on Kant."
    facsimile: ""

  - id: ev-letter-chertkov-nov30
    genre: letter
    pssTom: 88
    pages: "251–252"
    date: "1901-11-30"
    addressee: "В. Г. Чертков (Vladimir Chertkov)"
    localPdf: ""
    extract: "extracts/v88_644_noyabrya30.txt"
    quoteRu: "А, главное, надеюсь, что кончил о религии (Что такое религия и ее назначение). Нечто придется переменить, прибавить кое-что в последней 16-й главе. Как всегда, то кажется, что много там важных мыслей, хотя и дурно выраженных, то кажется, что всё нехорошо. Одно знаю, что написать это мне было нужно, и я сделал, что мог."
    quoteEn: "(working English) I hope I have finished On Religion (What is religion and its purpose). Something will need to be changed, a little added in the last, 16th chapter… One thing I know: it was necessary for me to write this, and I did what I could."
    significance: "First 30-Nov completion note to Chertkov: 16 chapters at this stage; Tolstoy calls the work «одностороннюю» (one-sided) after setting it down — notable self-description. Title still in flux: «назначение» (purpose) not «сущность» (essence)."
    facsimile: ""

  - id: ev-letter-ge-aug26
    genre: letter
    pssTom: 73
    pages: "134–136"
    date: "1901-08-26"
    addressee: "Н. Н. Ге (сын) (Nikolai Ge, son)"
    localPdf: ""
    extract: "extracts/v73_146_H_N_Gesynu.txt"
    quoteRu: "теперь пишу о религии,³ об ее отсутствии и въехал в работу."
    quoteEn: "(working English) Now I am writing about religion, about its absence, and I have gotten into the work."
    significance: "Earliest letter announcing active composition, two weeks after the Chertkov start-letter. The phrase «въехал в работу» (literally 'driven into the work') signals full engagement."
    facsimile: ""

  - id: ev-letter-rusanov-sep5
    genre: letter
    pssTom: 73
    pages: "144–145"
    date: "1901-09-05"
    addressee: "Г. А. Русанов (Gavril Rusanov)"
    localPdf: ""
    extract: "extracts/v73_154_G_A_Rusanovu.txt"
    quoteRu: "Теперь я занят статьей о религии: определение ее и выяснение ее отсутствия в нашем мире и ужасных последствиях этого. Очень меня занимает эта работа."
    quoteEn: "(working English) I am now occupied with an article on religion: defining it and elucidating its absence in our world and the terrible consequences of this. This work absorbs me greatly."
    significance: "Clearest early programme statement: definition + absence + consequences. This three-part structure maps directly onto the treatise's architecture. Written on the day of departure for Crimea."
    facsimile: ""

  - id: ev-letter-biryukov-dec31
    genre: letter
    pssTom: 73
    pages: "179–180"
    date: "1901-12-31"
    addressee: "П. И. Бирюков (Pavel Biryukov)"
    localPdf: ""
    extract: "extracts/v73_197_P_I_Biryukovu.txt"
    quoteRu: "О религии кончил⁴ и на днях отправлю.⁵"
    quoteEn: "(working English) On religion I have finished and will send it off in the coming days."
    significance: "Completion announcement on New Year's Eve 1901 — manuscript not yet dispatched to Chertkov at this moment. Also mentions Biryukov reviewing a Binshtok translation's religious-philosophical section."
    facsimile: ""

  - id: ev-letter-grauberger-jan20
    genre: letter
    pssTom: 73
    pages: "201–203"
    date: "1902-01-20"
    addressee: "Ф. Х. Граубергер (Fyodor Grauberger)"
    localPdf: ""
    extract: "extracts/v73_209_F_X_Graubergeru.txt"
    quoteRu: "Я совершенно согласен с тем, что вы пишете. Я понемногу приходил к этому убеждению и теперь пришел окончательно, что и выразил в своей статье «Что такое религия и в чем ее сущность?», которая теперь, вероятно, печатается у Черткова."
    quoteEn: "(working English) I entirely agree with what you write. I was gradually coming to this conviction and have now arrived at it definitively, which I expressed in my article 'What Is Religion and What Is Its Essence?', which is now, probably, being printed at Chertkov's."
    significance: "Only letter that names the article by its full Russian title and places it in the press. Written 20 Jan 1902, ~3 weeks after the Biryukov 'finished' letter — the manuscript had reached Chertkov in the interim."
    facsimile: ""

  - id: ev-history-writing
    genre: commentary
    pssTom: 35
