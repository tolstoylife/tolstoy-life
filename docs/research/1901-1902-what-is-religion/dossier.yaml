scholarship:
  summary: "The conventional scholarly view treats «Что такое религия» as the clearest and most systematic of Tolstoy's religious writings, his mature synthesis after three decades of religious thought. Bartlett (Tolstoy: A Russian Life, 2010) and Maude (The Life of Tolstoy: Later Years, 1911) both note the essay was written in the shadow of the excommunication, interpreting it as Tolstoy's doctrinal counterpoint to the Synod's action. Simmons (Introduction to Tolstoy's Writings, 1968, ch. 7) calls it 'perhaps his most conclusive, best-tempered, and persuasive treatment of the subject.' Daniel Moulin's 'Tolstoy, Universalism and the World Religions' (Journal of Ecclesiastical History 68:3, 2017) situates the treatise within Tolstoy's programme of convergent universalism — arguing all major religions share a common ethical core. The dominant scholarly frame (universalism + anti-institutionalism + reaction to excommunication) broadly confirms what the primary sources show. Where scholarship stops short is on the genesis detail — the specific intellectual arc from the three-article plan (Nov 1900) through the Chicherin rejection to the first definition formula (Feb 1901), and the production history at Free Word."
  triangulation:
    - evidenceRef: ev-definition-ch2
      conventionalView: "Scholarship treats the essay as a religious universalism manifesto, noting Tolstoy surveys world religions to find a common core."
      relation: confirms
      source: "Daniel Moulin, 'Tolstoy, Universalism and the World Religions', Journal of Ecclesiastical History 68:3 (2017)"

    - evidenceRef: ev-corruption-three-means
      conventionalView: "Scholars note Tolstoy's critique of institutional religion is rooted in his anti-clericalism."
      relation: extends
      source: ""
      note: "The primary text shows Tolstoy has a precise three-mechanism model (priesthood, miracles, scripture) applied structurally to all historical religions — more rigorous than the generic 'anti-clericalism' frame."

    - evidenceRef: ev-church-truc
      conventionalView: "The essay is read as anti-Orthodox polemic in the context of the 1901 excommunication."
      relation: complicates
      source: "Bartlett, Rosamund. Tolstoy: A Russian Life. London: Profile Books, 2010."
      note: "The primary text shows Tolstoy's critique of the Church is structural (the concept of infallible Church as the specific Christian 'trick'), not primarily reactive to the Synod's action. The excommunication sharpened his urgency but did not determine the argument — the three-article plan predates the decree by over a year."

    - evidenceRef: ev-universal-religion-ch14
      conventionalView: "Scholarship reads the universal-religion argument as derivative of Tolstoy's earlier Gospel work."
      relation: extends
      source: ""
      note: "The treatise's four-proposition distillate (God as source; divine particle in man; subdue passion, increase love; Golden Rule) is more explicit and more systematically comparative than anything in the earlier religious works. This is a terminus, not a repetition."

    - evidenceRef: ev-diary-1901-02-08
      conventionalView: "The composition is typically dated 'Aug 1901–Jan 1902' (i.e. from the first manuscripts)."
      relation: extends
      source: ""
      note: "The primary sources show the definitional kernel formed in February 1901 (Chicherin rejection; first relation-to-the-infinite formula), five months before the first dated manuscripts. The Nov 1900 diary entry places the conceptual genesis even earlier."

