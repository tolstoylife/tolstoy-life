  - id: ev-manuscript-description
    genre: commentary
    pssTom: 35
    pages: "675–676"
    date: "1950"
    addressee: ""
    localPdf: ""
    extract: "extracts/v35_675_676_primechanija.txt"
    quoteRu: "Рукописи, относящиеся к статье «Что такое религия и в чем сущность ее?», хранятся в Рукописном отделе Музея Л. Н. Толстого Академии наук СССР, в архиве В. Г. Черткова. Общее количество их исчисляется в 1449 рукописных единиц."
    quoteEn: "(working English) The manuscripts relating to the article are held in the Manuscript Department of the Tolstoy Museum of the Academy of Sciences of the USSR, in the Chertkov archive. Their total number amounts to 1,449 manuscript units."
