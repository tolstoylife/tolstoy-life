scholarship:
  summary: >
    English-language scholarship treats the народные рассказы appreciatively but
    thinly: Gary Jahn's Cambridge Companion chapter (2002) is the main specialist
    treatment, reading the tales as sophisticated stylisations of folk models
    rather than didactic decline; R. F. Christian (1969), Hugh McLean (2008) and
    the biographers (Wilson 1988, Bartlett 2010) place them as the first artistic
    fruit of the conversion, the hinge between the 1872 Azbuka and the late
    fiction. Jeffrey Brooks (When Russia Learned to Read, 1985) is the standard
    account of the Posrednik economics: booklets at roughly a kopeck, twelve
    million copies in the first four years. What Is Art? scholarship reports the
    famous self-condemnation footnote but stops at the Beethoven/Shakespeare
    verdicts. The "didactic decline" frame survives mainly in popular biography;
    specialist work concedes the tales' relative critical neglect. The dive's
    primary record both confirms this picture and reaches below it — the
    operational letters, the censor's verdicts, and the 1910 grading letter are
    not part of the anglophone conversation.
  triangulation:
    - evidenceRef: E11
      conventionalView: >
        Jahn (2002) infers a deliberate popular-literature programme from the
        tales' formal properties; the Zheltov letter naming «мои народные
        рассказы» as the model is not a known reference point in English
        scholarship.
      relation: extends
      source: "Gary R. Jahn, 'Tolstoy as a Writer of Popular Literature', in Orwin (ed.), The Cambridge Companion to Tolstoy, CUP 2002, pp. 111–126"
    - evidenceRef: E18
      conventionalView: >
        Brooks (1985) documents Posrednik's kopeck price-point and twelve million
        copies in four years; the letter-level terms (the 900-ruble Sytin
        transfer at 1½ kopecks) sit below the scholarship's resolution.
      relation: confirms
      source: "Jeffrey Brooks, When Russia Learned to Read, Princeton UP 1985, pp. 337–340"
    - evidenceRef: E40
      conventionalView: >
        The What Is Art? footnote (PSS 30) exempting only «Бог правду видит» and
        «Кавказский пленник» from Tolstoy's own «дурное искусство» is widely
        cited — but no accessible scholarship registers that the народные
        рассказы are thereby silently condemned, nor cites the 24 Oct 1910
        grading letter in which Tolstoy still ranks nine of the tales «очень
        хорошие». The tension between the public theoretical verdict (1898) and
        the private editorial verdict (1910) is unregistered.
      relation: extends
      source: "What Is Art? (PSS 30 footnote; cf. docs/research/1897-1898-what-is-art/); PSS 82, no. 278"
    - evidenceRef: E31
      conventionalView: >
        Censorship of Tolstoy is treated as pervasive (Brooks 1985; Hapgood 1887)
        but the asymmetric pattern — secular organs arresting the political
        tales, spiritual censorship condemning the heterodox legends, the pure
        devotional tales circulating freely — is not delineated as an analytical
        point.
      relation: extends
      source: "Isabel F. Hapgood, 'Count Tolstoi and the Public Censor', 1887"
    - evidenceRef: E34
      conventionalView: >
        The Saillens adaptation is a settled biographical fact; scholarship does
        not explore the structural cause — the unsigned-publication convention of
        the Posrednik workshop — which the 1888 letter states explicitly.
      relation: complicates
      source: "secondary summaries (e.g. yeyebook.com Saillens/Tolstoy account); PSS 64, no. 268"
    - evidenceRef: E01
      conventionalView: >
        Shchegolyonok's 1879 visit is documented biographically, but accessible
        English scholarship does not name him as the plot source of specific
        tales (the Twenty-Three Tales tradition garbles the date and identity).
      relation: extends
      source: "no clear source (PSS apparatus only)"
    - evidenceRef: E05
      conventionalView: >
        The standard narrative reads the tales as the conversion's first artistic
        fruit; the 1883 diary shows the *negative* genesis — the structural
        impossibility of the peasant love-plot novel — which scholarship does not
        cite as the form's origin.
      relation: complicates
      source: "R. F. Christian, Tolstoy: A Critical Introduction, CUP 1969"
    - evidenceRef: E30
      conventionalView: >
        The drama's stage ban and the tales' mass circulation are separately
        documented; the reception asymmetry — the same author, the same intended
        audience, opposite outcomes across genres (The Power of Darkness failed
        with the people; the tales reached them) — is not made as a point in
        accessible scholarship.
      relation: extends
      source: "Jeffrey Brooks, When Russia Learned to Read, Princeton UP 1985; cf. docs/research/1886-the-power-of-darkness/"

