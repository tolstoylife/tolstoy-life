# Dossier — Stories for the People (народные рассказы)
# Theme-dive (plain; multiple workRecord proposals per the parked plan).
# All quoteRu strings are byte-exact substrings of the named extract files.

topic:
  slug: stories-for-the-people
  title: "Stories for the People (народные рассказы)"
  question: >
    Tolstoy's народные рассказы (1881–1887) as a project: why he wrote moral
    parables for the people after rejecting conventional peasant fiction; how the
    Posrednik machinery (Chertkov, Sytin, the kopeck booklets) carried them; what
    the tales share as a moral core; whether they actually reached the popular
    reader; and how the project relates forward to What Is Art? and sideways to
    the two drama dives (The Power of Darkness, The Fruits of Enlightenment).
  date: 2026-06-11
  period: "1879–1910 (core composition window 1881–1887)"
  corpusSurface: >
    PSS Tom 25 tale TEIs (18 tales + Речь о народных изданиях + printed variants
    + first redactions); per-tale История писания commentary TEIs (v25_665–890);
    Tom 26 Цветник preface; letters Toms 62–64, 72, 82–86, 88, 90; diaries and
    notebooks Toms 49–53.
  dateRange: "1879–1910"

evidence:

  # ── Genesis: sources, first tale, the pivot to parable ─────────────────────

  - id: E01
    genre: letter
    pssTom: 62
    date: "1879-08-02/03 OS"
    addressee: "В. В. Стасов"
    extract: extracts/v62_523_V_V_Stasovu.txt
    quoteRu: "Олонецкий мужик, певец былин — очень умный и хороший старик"
    quoteEn: "(working English) An Olonets peasant, a singer of bylinas — a very intelligent and good old man."
    significance: >
      Tolstoy introduces V. P. Shchegolyonok to Stasov immediately after the
      bylina-singer's 1879 stay at Yasnaya Polyana. The PSS note links the legends
      Tolstoy recorded from him to «Чем люди живы», «Два старика», «Три старца» —
      the oral taproot of the cycle.

  - id: E02
    genre: letter
    pssTom: 83
    date: "1881-07-25 OS"
    addressee: "С. А. Толстая"
    extract: extracts/v83_181_a25.txt
    quoteRu: "Я два последние дня два раза начинал Петину историю"
    quoteEn: "(working English) These last two days I have twice begun Petya's story."
    significance: >
      From the Samara khutor: the first tale («Чем люди живы», promised to
      P. A. Bers's children's journal — hence «Петина история») is hard to start.
      Earliest composition witness for the cycle.

  - id: E03
    genre: letter
    pssTom: 90
    date: "1881-12-01 approx OS"
    addressee: "В. К. Истомин"
    extract: extracts/v90_036_V_K_Istominu.txt
    quoteRu: "Я переменил не больше 20 строк во всем, но они очень нужны, особенно в конце."
    quoteEn: "(working English) I changed no more than 20 lines in the whole, but they are badly needed, especially at the end."
    significance: >
      Final proof corrections of «Чем люди живы» for «Детский отдых» (No. 12,
      December 1881) — the PSS note records the last chapter was revised five times.

  - id: E04
    genre: letter
    pssTom: 90
    date: "1881-12-04 OS"
    addressee: "В. К. Истомин"
    extract: extracts/v90_037_V_K_Istominu.txt
    quoteRu: "Синий карандаш на портках не мой, и исключить их потому нельзя, что тогда ангел будет без порток."
    quoteEn: "(working English) The blue pencil on the breeches is not mine, and they cannot be cut, because then the angel would be without breeches."
    significance: >
      Tolstoy's comic defence of the peasant word «портки» against a copy-editor —
      vernacular diction defended at the level of a single word.

  - id: E05
    genre: diary
    pssTom: 49
    date: "1883-06-11 OS"
    extract: extracts/v49_102_103_1883_06_11.txt
    quoteRu: "Думал о своих неудачных попытках романа из народного быта. Что за нелепость?! Задаться мыслью написать сочинение, в котором первое место бы занимала любовь, а действующие лица были бы мужики, т. е. люди, у которых любовь занимает не только не первое место, но у которых и нет той похотливой любви, о которой требуется писать."
    quoteEn: "(working English) Thought about my failed attempts at a novel of peasant life. What an absurdity! To set out to write a work in which love would take first place, with peasants as the characters — that is, people for whom love not only does not take first place, but who do not even have that lustful love one is required to write about."
    significance: >
      The pivot, from inside the diary-gap years: the conventional love-plot novel
      of peasant life is structurally impossible — the genre that replaces it is
      the moral parable. The clearest genesis statement for the cycle's form.

  - id: E06
    genre: diary
    pssTom: 49
    date: "1883-03-26 OS"
    extract: extracts/v49_073_074_1883_03_26.txt
    quoteRu: "Пришли Златовратский и Маракуев. Златовратский программу народничества. Надменность, путаница и плачевность мысли поразительна."
    quoteEn: "(working English) Zlatovratsky and Marakuev came. Zlatovratsky — the programme of Populism. The arrogance, confusion and lamentable quality of the thought is striking."
    significance: >
      Boundary-setting against Populist literature: the folk tales are not
      народничество. Marakuev — soon a popular-editions publisher and attendee of
      the Posrednik founding meetings — is in the room.

  # ── The programme: Речь о народных изданиях & Цветник preface ─────────────

  - id: E07
    genre: speech
    pssTom: 25
    pages: "523–529"
    date: "1883-12/1884-02 approx"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_523_529_Rech_o_narodnyh_izdanijah.txt
    quoteRu: "Дело это, по моему, самое важное в мире, которому только может разумный человек посвятить свои силы. Дело — в духовном общении людей. Дело в распространении света истины. Дело — в единении людей около единой истины."
    quoteEn: "(working English) This work is, in my view, the most important in the world to which a rational man can devote his powers. The work is the spiritual communion of people. The work is the spreading of the light of truth. The work is the uniting of people around a single truth."
    significance: >
      The founding document of the Posrednik concept, delivered at the Moscow
      planning meetings (found in M. P. Shchepkin's archive). «Единение» — the
      What Is Art? criterion — is already the stated goal in 1884.

  - id: E08
    genre: speech
    pssTom: 25
    pages: "523–529"
    date: "1883-12/1884-02 approx"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_523_529_Rech_o_narodnyh_izdanijah.txt
    quoteRu: "Надо признать то, что народ есть люди такие же, как мы, только их больше нас и они требовательнее и чутче к правде, и что потому все, что не совсем хорошо для нас, совсем дурно для народа."
    quoteEn: "(working English) We must recognise that the people are people just like us, only there are more of them than us and they are more demanding and more sensitive to the truth; and that therefore everything that is not quite good for us is altogether bad for the people."
    significance: >
      The speech's central inversion: no separate "literature for the people" —
      the people are the stricter audience. The tales are written as the best,
      not the leftovers («ошурки»).

  - id: E09
    genre: work
    pssTom: 26
    pages: "307–309"
    date: "1886"
    localPdf: primary-sources/jubilee-edition/vol86/vol86.pdf
    extract: extracts/v26_307_309_Predislovie_k_sborniku_Tsvetnik.txt
    quoteRu: "Чтобы была правда в том, что описываешь, надо писать не то, что есть, а то, что должно быть, описывать не правду того, что есть, а правду царствия Божия, которое близится к нам, но которого еще нет."
    quoteEn: "(working English) For there to be truth in what you describe, you must write not what is, but what ought to be — describe not the truth of what is, but the truth of the Kingdom of God, which is drawing near to us but is not yet."
    significance: >
      The Цветник preface — the poetics Tolstoy himself pointed aspiring popular
      writers to (E11). Truth re-defined as what-ought-to-be: the criterion that
      makes a miraculous legend "true" and a documentary novel "a lie".

  - id: E10
    genre: work
    pssTom: 26
    pages: "307–309"
    date: "1886"
    localPdf: primary-sources/jubilee-edition/vol86/vol86.pdf
    extract: extracts/v26_307_309_Predislovie_k_sborniku_Tsvetnik.txt
    quoteRu: "Какие бы чудеса ни описывались, какие бы звери ни разговаривали по-людски, какие бы ковры самолеты ни переносили людей, — и легенды, и притчи, и сказки будут правда, если в них будет правда царствия Божия."
    quoteEn: "(working English) Whatever miracles are described, whatever beasts speak in human tongue, whatever flying carpets carry people — legends, parables and fairy tales will be truth, if the truth of the Kingdom of God is in them."
    significance: >
      The genre licence for the whole cycle: angels, devils and walking on water
      are admissible — truthful — because the truth-criterion is moral, not
      documentary.

  - id: E11
    genre: letter
    pssTom: 64
    date: "1887-04-21 OS"
    addressee: "Ф. А. Желтов"
    extract: extracts/v64_067_F_A_ZHeltovu.txt
    quoteRu: "Я не могу вам вкратце выразить то, что я считаю нужным для писания, иначе, как указав вам на мои народные рассказы последнего времени и на предисловие к «Цветнику»"
    quoteEn: "(working English) I cannot briefly express to you what I consider necessary for writing, other than by pointing you to my recent stories for the people and to the preface to Tsvetnik."
    significance: >
      Tolstoy names «мои народные рассказы» plus the Цветник preface as the model
      for aspiring popular writers — the cycle owned as a deliberate aesthetic
      programme, a decade before What Is Art? theorised it.

  # ── Posrednik: founding, operations, economics ─────────────────────────────

  - id: E12
    genre: letter
    pssTom: 85
    date: "1884-12-08 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_038_a8.txt
    quoteRu: "Ждите, что ничего из этого не выйдет. Я очень желаю успеха, но постоянно себя осаживаю, т. е. сомневаюсь в успехе."
    quoteEn: "(working English) Expect that nothing will come of this. I very much wish for success, but I constantly rein myself in — that is, I doubt the success."
    significance: >
      Tolstoy's sober caution to Chertkov at Posrednik's inception — deliberately
      damping the younger man's optimism while the first booklets are in
      preparation.

  - id: E13
    genre: letter
    pssTom: 85
    date: "1885-01-02/03 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_041_yanvarya2_3.txt
    quoteRu: "Но ни то ни другое не для народа."
    quoteEn: "(working English) But neither the one nor the other is for the people."
    significance: >
      The «для народа» editorial filter applied: two candidate texts rejected as
      unsuitable. The selection standard that governs the whole catalogue.

  - id: E14
    genre: letter
    pssTom: 85
    date: "1885-03-17/18 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_049_marta17_18.txt
    quoteRu: "Поправляю его. Может быть, будет лучше. Еще написал небольшой рассказ"
    quoteEn: "(working English) I am correcting it. Perhaps it will be better. I have also written a small story."
    significance: >
      Receipt of the anonymous Russian translation of Saillens' "Le père Martin"
      from Chertkov; the reworking becomes «Где любовь, там и Бог». The workshop
      mode: Chertkov commissions, Tolstoy reworks.

  - id: E15
    genre: letter
    pssTom: 85
    date: "1885-03-25/26 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_050_a25_26.txt
    quoteRu: "Еще написал маленький рассказец, я думаю для картинки с текстом."
    quoteEn: "(working English) I have also written a little story — I think for a picture with text."
    significance: >
      First mention of «Ильяс», conceived for the lubok-format text-with-picture
      sheet — the cycle's forms are shaped by Posrednik's print formats from the
      start.

  - id: E16
    genre: letter
    pssTom: 85
    date: "1885-04-26 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_054_a26.txt
    quoteRu: "Пишу вам от Сытина. Хотел с ним послать назад свой рассказ"
    quoteEn: "(working English) I am writing to you from Sytin's. I wanted to send my story back with him."
    significance: >
      Tolstoy physically at Sytin's office, routing a reworked tale toward Moscow
      censorship — the count in the lubok-printer's shop is the institutional
      image of the project.

  - id: E17
    genre: letter
    pssTom: 85
    date: "1885-05-02 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_055_maya2.txt
    quoteRu: "Радость великую мне доставил Репин"
    quoteEn: "(working English) Repin has given me great joy."
    significance: >
      Repin's picture (per the PSS note, for «Мартын» — «Где любовь, там и Бог»)
      delights Tolstoy; Repin drew for Posrednik gratis. The first named-artist
      commitment in the illustration programme.

  - id: E18
    genre: letter
    pssTom: 85
    date: "1885-05-10/11 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_059_a10_11.txt
    quoteRu: "Чтоб развязать поскорее грех, я предложил Сытину их взять."
    quoteEn: "(working English) To untie the sin as quickly as possible, I proposed that Sytin take them."
    significance: >
      Resolution of the double-edition conflict: Sofia Andreevna's slow-selling
      edition of the tales transferred to Sytin — the letter records the terms
      (900 rubles, at 1½ kopecks per copy). Concrete kopeck-economics of the
      cheap editions.

  - id: E19
    genre: letter
    pssTom: 85
    date: "1885-05-10/11 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_060_a.txt
    quoteRu: "чтобы ими заменять те, которые требуют в книжные лавки и земства, и чтобы Сытинския — наши шли глубже в народ"
    quoteEn: "(working English) …so that they replace those ordered by bookshops and zemstvos, and so that the Sytin ones — ours — go deeper into the people."
    significance: >
      The two-tier distribution strategy in Tolstoy's own words: parity pricing
      with the commercial lubok so that the Posrednik booklets reach «глубже в
      народ» — deeper than the bookshop network.

  - id: E20
    genre: letter
    pssTom: 85
    date: "1885-08-29/30 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_077_a29_30.txt
    quoteRu: "Сытину скажите, что он может печатать мои рассказы, но только как можно дешевле продавать их."
    quoteEn: "(working English) Tell Sytin that he may print my stories, but only sell them as cheaply as possible."
    significance: >
      The standing pricing instruction: maximum cheapness as the condition of
      permission — price policy as mission, not margin.

  - id: E21
    genre: letter
    pssTom: 85
    date: "1885-10-15/16 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_082_a15_16.txt
    quoteRu: "Все это или почти все не хорошо. Я постараюсь придумать лучше."
    quoteEn: "(working English) All of this, or almost all, is not good. I will try to think up better."
    significance: >
      Tolstoy catalogues the first cycle of tales with one-line summaries — then
      judges the whole list «не хорошо» and promises better. The in-flight
      self-critique that counterweights the project's outward success.

  - id: E22
    genre: letter
    pssTom: 85
    date: "1885-11-11 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v85_086_a11.txt
    quoteRu: "Вся историйка написана в виду этого конца. Вся она груба и по форме и по содержанию"
    quoteEn: "(working English) The whole little story was written for the sake of this ending. It is rough in both form and content."
    significance: >
      The «Свечка» ending controversy: Tolstoy refuses Chertkov's softening —
      the tale was heard rough from a peasant teller and cannot be otherwise
      «чтобы не быть фальшивою». Authenticity over edification.

  - id: E23
    genre: letter
    pssTom: 63
    date: "1885-04-16 OS"
    addressee: "К. М. Сибиряков"
    extract: extracts/v63_349_K_M_Sibiryakovu.txt
    quoteRu: "есть в Петербурге очень мне близкий человек Чертков, мы с ним-то и толковали о таком журнале"
    quoteEn: "(working English) There is in Petersburg a man very close to me, Chertkov — it is with him that I have been discussing such a journal."
    significance: >
      Funding outreach to the gold-magnate Sibiryakov for a popular journal —
      Tolstoy as fundraiser and networker for the cheap-editions programme.

  - id: E24
    genre: letter
    pssTom: 64
    date: "1887-03 OS"
    addressee: "тифлисские барышни (circular)"
    extract: extracts/v64_040_NN_tiflisskim_baryshnyam.txt
    quoteRu: "Книжки Сытинских изданий большие — так называемые романы все разосланы желавшим заняться их переделкой"
    quoteEn: "(working English) The large Sytin booklets — the so-called novels — have all been sent out to those who wished to undertake their reworking."
    significance: >
      The lubok-reform campaign at scale: educated volunteers rewriting Sytin's
      commercial popular novels — the tales' programme extended to the existing
      market's whole stock.

  - id: E25
    genre: letter
    pssTom: 64
    date: "1887-07/08 approx OS"
    addressee: "И. И. Петров"
    extract: extracts/v64_114_I_I_Petrovu.txt
    quoteRu: "Будьте так добры, попросите Сытина прислать мне всех вышедших Посредниковых книг по 50, но пожалуйста, скажите ему, чтобы не «даром», а за деньги"
    quoteEn: "(working English) Be so kind as to ask Sytin to send me 50 copies of every Posrednik book published — but please tell him, not 'for free', but for money."
    significance: >
      Tolstoy's own order list follows (17 titles with copy-counts: «Чем люди
      живы» 100, «Два старика» 100, «Где любовь» 100…) — the only primary-source
      copy-count record of the 1885–87 catalogue in his hand, and he insists on
      paying.

  - id: E26
    genre: letter
    pssTom: 86
    date: "1887-01-19/21 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v86_128_a19_21.txt
    quoteRu: "Я выпросил туда у жены Поликушку"
    quoteEn: "(working English) I begged Polikushka from my wife for it."
    significance: >
      The expansion programme: Tolstoy wrests his own pre-conversion work from
      Sofia Andreevna's copyright for the cheap editions, then lists the world
      classics (Voltaire, Rousseau, Lessing, Schiller, Cervantes…) to be adapted
      — Posrednik as a world-literature canon for the people.

  - id: E27
    genre: letter
    pssTom: 86
    date: "1887-02-23 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v86_136_a23.txt
    quoteRu: "Прошу всех печатать, где и как хотят, и прав собственности ни я ни мои наследники заявлять не будем."
    quoteEn: "(working English) I ask everyone to print, where and how they wish, and neither I nor my heirs will assert property rights."
    significance: >
      The open-printing declaration, four years before the 1891 newspaper waiver
      — asked to be announced via Posrednik. Copyright renunciation grows
      directly out of the cheap-editions logic (see the copyright-renunciation
      dive).

  - id: E28
    genre: letter
    pssTom: 86
    date: "1889-02-19/20 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v86_216_a19_20.txt
    quoteRu: "Что Посредника и свою работу в нем вам покидать не надо. На мой взгляд это божье дело и вы делаете его волю."
    quoteEn: "(working English) That you must not abandon Posrednik and your work in it. In my view it is God's work, and you are doing His will."
    significance: >
      Posrednik as «божье дело» — Tolstoy's most explicit sacralisation of the
      enterprise, urging Chertkov to stay; Gorbunov-Posadov arrives in the same
      letter as the new collaborator.

  # ── Censorship & reception ─────────────────────────────────────────────────

  - id: E29
    genre: letter
    pssTom: 64
    date: "1886-12 (before 20) approx OS"
    addressee: "И. Б. Файнерман"
    extract: extracts/v64_001_I_B_Fajnermanu.txt
    quoteRu: "только как можно избегайте нецензурного. Всё запрещают."
    quoteEn: "(working English) …only avoid the uncensorable as far as you can. They are banning everything."
    significance: >
      Written as «Крестник» is banned from a Posrednik edition (printed there
      only in 1906): censorship as the daily weather of the project by late 1886.

  - id: E30
    genre: commentary
    pssTom: 25
    pages: "665–674"
    date: "1937 (apparatus, on events of 1887–1893)"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_665_674_Chem_ljudi_zhivy.txt
    quoteRu: "рассказ был арестован Московским цензурным комитетом 4 февраля; затем в этом же году 10 октября Главное управление по делам печати запретило новое издание и потом вновь повторило свое распоряжение в 1888, 1891 и 1893 гг."
    quoteEn: "(working English) …the story was arrested by the Moscow Censorship Committee on 4 February; then in the same year, on 10 October, the Main Directorate for Press Affairs banned a new edition, and repeated its order in 1888, 1891 and 1893."
    significance: >
      The censorship chronology of «Чем люди живы» from the PSS apparatus: the
      cycle's founding devotional tale arrested in the February 1887 wave.

  - id: E31
    genre: commentary
    pssTom: 25
    pages: "715–719"
    date: "1937 (apparatus, quoting the 1887 verdict)"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_715_719_Skazka_ob_Ivane_Durake_i_ego_dvuh_bratja.txt
    quoteRu: "Сказка об Иване Дураке,— говорит он, — проводит, можно сказать принципиально мысли о возможности быть царству без войны, без денег, без науки, без купли и продажи, даже без царя"
    quoteEn: "(working English) The Tale of Ivan the Fool — he says — advances, one may say as a matter of principle, ideas of the possibility of a kingdom existing without war, without money, without science, without buying and selling, even without a tsar."
    significance: >
      The spiritual censor Archimandrite Tikhon's 1887 verdict, preserved in the
      apparatus — the censor reads the political fable exactly as written: a
      constitution without army, money or tsar.

  - id: E32
    genre: commentary
    pssTom: 25
    pages: "715–719"
    date: "1937 (apparatus, on events of 1887–1893)"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_715_719_Skazka_ob_Ivane_Durake_i_ego_dvuh_bratja.txt
    quoteRu: "уже в тот же месяц была арестована Московским цензурным комитетом, а в октябре запрещена к перепечатке Главным управлением по делам печати. Запрещения повторялись в 1892 и потом в 1893 г."
    quoteEn: "(working English) …already in the same month it was arrested by the Moscow Censorship Committee, and in October banned from reprinting by the Main Directorate for Press Affairs. The bans were repeated in 1892 and then in 1893."
    significance: >
      Ivan the Fool's ban chronology (the February 1887 2nd edition); in 1892 a
      special order even banned street and market sales of earlier printings.

  - id: E33
    genre: commentary
    pssTom: 25
    pages: "725–734"
    date: "1937 (apparatus, on the 1886 verdict)"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_725_734_Krestnik.txt
    quoteRu: "Духовная цензура дала отзыв, что не знает «книги безбожнее этой»"
    quoteEn: "(working English) The spiritual censorship gave the verdict that it knew of no book more godless than this."
    significance: >
      «Крестник» — a non-resistance legend built from Afanasyev — condemned by
      the spiritual censorship in the strongest terms; Posrednik printed it only
      in 1906.

  - id: E34
    genre: letter
    pssTom: 64
    date: "1888-10 OS"
    addressee: "R. Saillens"
    extract: extracts/v64_268_R_Sajyanu_R_Saillens.txt
    quoteRu: "C’est ainsi, monsieur, qu’à mon grand regret je me suis rendu coupable envers vous d’un plagiat involontaire"
    quoteEn: "(working English) [from the French original] Thus it is, monsieur, that to my great regret I have made myself guilty toward you of an involuntary plagiarism."
    significance: >
      The Saillens affair: «Где любовь, там и Бог» began as an anonymous Russian
      translation of "Le père Martin" supplied by Chertkov; the unsigned-
      publication convention for the tales caused the misattribution. Tolstoy's
      letter is the fullest account of the workshop's authorship norms.

  - id: E35
    genre: letter
    pssTom: 72
    date: "1899-03-20 OS"
    addressee: "R. Saillens"
    extract: extracts/v72_072_RubenuSajyanuRubenSaillens.txt
    quoteRu: "il y a plus de 15 que je me suis dédit de tous mes droits d’auteur pour tous mes ouvrages parus après 1881"
    quoteEn: "(working English) [from the French original] …for more than 15 [years] I have renounced all my author's rights over all my works published after 1881."
    significance: >
      Eleven years on, Tolstoy confirms to Saillens both the printed source
      attribution and the copyright renunciation covering the tales — the cycle
      legally given away.

  - id: E36
    genre: letter
    pssTom: 84
    date: "1891-07-11 OS"
    addressee: "С. А. Толстая (draft declaration)"
    extract: extracts/v84_453_a11.txt
    quoteRu: "Мой муж, Лев Николаевич Толстой, отказывается от авторского права на последние сочинения свои, предоставляя желающим безвозмездно печатать и издавать их. Сочинения эти следующие: Чем люди живы. Упустишь огонь не потушишь. Свечка."
    quoteEn: "(working English) My husband, Lev Nikolaevich Tolstoy, renounces the author's right to his latest works, granting anyone who wishes to print and publish them without payment. These works are the following: What Men Live By. A Spark Neglected. The Candle."
    significance: >
      The canonical 1891 waiver list, drafted by Tolstoy for Sofia Andreevna to
      publish — it opens with the народные рассказы, naming every major tale.
      The cycle defines the corpus of renounced works.

  # ── Retrospect: the What Is Art? arc and the 1910 verdict ──────────────────

  - id: E37
    genre: letter
    pssTom: 88
    date: "1897-07-23 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v88_458_iyulya23.txt
    quoteRu: "я нашел и прочел. Там ничего нет дурного, неверного, но как пьеса это несценично."
    quoteEn: "(working English) …I found and read [Ivan the Fool]. There is nothing bad or untrue in it, but as a play it is unstageable."
    significance: >
      While finishing «Что такое искусство?», Tolstoy re-reads an English stage
      adaptation of Ivan the Fool — the tales are live reference points inside
      the treatise's composition window.

  - id: E38
    genre: letter
    pssTom: 88
    date: "1897-07-15 OS"
    addressee: "В. Г. Чертков"
    extract: extracts/v88_456_iyulya15.txt
    quoteRu: "Достаточно, если она доставляет радость единения людей в безгрешном чувстве веселья, приятности, умиления или торжественности. Но дело в том, что она тем лучше, чем больше она людей соединяет."
    quoteEn: "(working English) It is enough if it gives the joy of uniting people in a sinless feeling of gaiety, pleasantness, tenderness or solemnity. The point is that it is the better, the more people it unites."
    significance: >
      The «единение» criterion in live correspondence during What Is Art?'s
      completion — the same word the 1884 Речь used for the popular-editions
      mission (E07). The 1880s practice and the 1898 theory share one vocabulary.

  - id: E39
    genre: diary
    pssTom: 53
    date: "1897-12-02 OS"
    extract: extracts/v53_167_169_1897_12_02.txt
    quoteRu: "Он составляет с Славянским Посредником центр маленькой, но думаю, что божеской работы."
    quoteEn: "(working English) He, with the Slavic Posrednik, forms the centre of a small but, I think, divine work."
    significance: >
      Makovický's Slovak counterpart blessed in the same terms as the original —
      «божеская работа» — while What Is Art? is on the desk: the project's
      sacral framing persists into the treatise years.

  - id: E40
    genre: letter
    pssTom: 82
    pages: "206–210"
    date: "1910-10-24 OS"
    addressee: "И. И. Горбунов-Посадов"
    extract: extracts/v82_278_I_I_Gorbunovu_Posadovu.txt
    quoteRu: "Получил листовки, высланные вами Саше, и очень заинтересовался ими. Разобрал их на четыре сорта: самые хорошие, хорошие, посредственные и плохие."
    quoteEn: "(working English) I received the leaflets you sent to Sasha and became very interested in them. I sorted them into four grades: the very good, the good, the mediocre and the bad."
    significance: >
      Two weeks before his death, Tolstoy grades the Posrednik leaflets like an
      editor. His own top tier: «Три старца», «Кающийся грешник», «Зерно с
      куриное яйцо», «Работник Емельян», «Ильяс», «Вражье лепко», «Где любовь,
      там и бог», «Крестник», «Упустишь огонь»; «Много ли человеку земли нужно»
      sits in the second grade — and Pushkin's «Станционный смотритель» in the
      fourth. A terminal self-verdict scholarship does not cite.

  # ── The tales themselves (keystone passages) ───────────────────────────────

  - id: E41
    genre: work
    pssTom: 25
    pages: "7–25"
    date: "1881"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_007_025_Chem_ljudi_zhivy.txt
    quoteRu: "Мы знаем, что мы перешли из смерти в жизнь, потому что любим братьев: не любящий брата пребывает в смерти"
    quoteEn: "(working English) We know that we have passed from death unto life, because we love the brethren: he that loveth not his brother abideth in death. (1 John III:14, the tale's head epigraph)"
    significance: >
      The Gospel verse-block head — the epigraph→narrative→moral arc that defines
      the cycle's devotional form.
    facsimile: extracts/facsimile-v25-p007-chem-ljudi-zhivy-018.png

  - id: E42
    genre: work
    pssTom: 25
    pages: "7–25"
    date: "1881"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_007_025_Chem_ljudi_zhivy.txt
    quoteRu: "— Узнал я, что жив всякий человек не заботой о себе, а любовью."
    quoteEn: "(working English) — I have learned that every man lives not by care for himself, but by love."
    significance: >
      The angel Mikhail's third word — the cycle's thesis sentence: self-provision
      is an illusion; the social fabric of mutual pity is the actual life-support.

  - id: E43
    genre: work
    pssTom: 25
    pages: "7–25"
    date: "1881"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_007_025_Chem_ljudi_zhivy.txt
    quoteRu: "Понял я теперь, что кажется только людям, что они заботой о себе живы, а что живы они одною любовью. Кто в любви, тот в Боге и Бог в нем, потому что Бог есть любовь."
    quoteEn: "(working English) I understood now that it only seems to people that they live by care for themselves — they live by love alone. He who is in love is in God, and God is in him, for God is love."
    significance: >
      The tale's closing theology: 1 John dramatised — God-in-the-neighbour as
      the cycle's devotional centre.

  - id: E44
    genre: work
    pssTom: 25
    pages: "35–45"
    date: "1885"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_035_045_Gde_ljubov_tam_i_bog.txt
    quoteRu: "— Для Бога, Мартын, жить надо. Он тебе жизнь дает, для Него и жить надо. Когда для Него жить станешь, ни о чем тужить не станешь, и всё тебе легко покажется."
    quoteEn: "(working English) — One must live for God, Martyn. He gives you life, and for Him one must live. When you begin to live for Him, you will grieve over nothing, and everything will seem easy to you."
    significance: >
      The pilgrim's counsel that turns the grieving cobbler around; Christ then
      arrives only as the freezing soldier, the starving mother, the apple-thief
      boy — Matthew 25 enacted before it is quoted.

  - id: E45
    genre: work
    pssTom: 25
    pages: "82–99"
    date: "1885"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_082_099_Dva_starika.txt
    quoteRu: "А то пойдешь за морем Христа искать, а в самом себе потеряешь."
    quoteEn: "(working English) Or else you go seeking Christ across the sea — and lose Him in your own self."
    significance: >
      Elisei's realisation mid-detour: the pilgrimage tale's whole argument — the
      diverted, costly act of mercy is the real arrival at the Sepulchre.

  - id: E46
    genre: work
    pssTom: 25
    pages: "82–99"
    date: "1885"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_082_099_Dva_starika.txt
    quoteRu: "— Тужить?! Нет, кум! В жизнь ни о чем, кроме о грехах, не тужил. Дороже души ничего нет."
    quoteEn: "(working English) — Grieve?! No, friend! In all my life I have grieved over nothing but my sins. There is nothing dearer than the soul."
    significance: >
      Elisei's credo — the peasant voice carrying the cycle's scale of values in
      a single saw.

  - id: E47
    genre: work
    pssTom: 25
    pages: "67–78"
    date: "1885"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_067_078_Mnogo_li_cheloveku_zemli_nuzhno.txt
    quoteRu: "Поднял работник скребку, выкопал Пахому могилу, ровно насколько он от ног до головы захватил — три аршина, и закопал его."
    quoteEn: "(working English) The labourer picked up the spade, dug Pakhom a grave exactly as long as he measured from feet to head — three arshins — and buried him."
    significance: >
      The famous closing accounting: the answer to the title question is
      grave-length. Acquisition as a contract with death — the
      non-acquisitiveness vector at its starkest.

  - id: E48
    genre: work
    pssTom: 25
    pages: "115–138"
    date: "1885"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_115_138_Skazka_ob_Ivane_Durake_i_ego_dvuh_bratjah_Semene_voine_i_Tarase_brjuhane_i_nemoj_sestre_Malane_i_o_starom_djavole_i_treh_chertenjatah.txt
    quoteRu: "Только один обычай у него и есть в царстве: у кого мозоли на руках — полезай за стол, а у кого нет — тому объедки."
    quoteEn: "(working English) There is only one custom in his kingdom: whoever has calluses on his hands — sit at the table; whoever has none — gets the scraps."
    significance: >
      The callus-test constitution of Ivan's kingdom: the labour-and-non-violence
      ethic scaled up to a political fable — the tale the censors read correctly
      (E31) and banned.

  - id: E49
    genre: work
    pssTom: 25
    pages: "100–105"
    date: "1885–1886"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_100_105_Tri_startsa.txt
    quoteRu: "А молясь, не говорите лишнего, как язычники: ибо они думают, что в многословии своем будут услышаны."
    quoteEn: "(working English) But when ye pray, use not vain repetitions, as the heathen do: for they think that they shall be heard for their much speaking. (Matthew VI:7, the tale's head epigraph)"
    significance: >
      The epigraph that the narrative then enacts as reversal: the bishop's
      correct catechesis is the heathen «многословие»; the hermits' wordless
      prayer walks on water.

  - id: E50
    genre: work
    pssTom: 25
    pages: "100–105"
    date: "1885–1886"
    localPdf: primary-sources/jubilee-edition/vol85/vol85.pdf
    extract: extracts/v25_100_105_Tri_startsa.txt
    quoteRu: "И древний старец сказал: Молимся мы так: трое Вас, трое нас, помилуй нас."
    quoteEn: "(working English) And the eldest hermit said: We pray thus — Three are Ye, three are we, have mercy on us."
    significance: >
      The artless prayer that out-prays the bishop — authority and literacy kneel
      to simple faith; the cycle's anti-clerical edge in its gentlest form, and a
      tale in Tolstoy's own 1910 top grade (E40).

