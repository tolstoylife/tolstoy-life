needsReview:
  - item: >
      Pobedonostsev as instigator of the Feb 1887 arrests: asserted in the
      commentary-mine digest but absent from the v25_665 apparatus extract (he
      appears corpus-wide only in the Так что же нам делать apparatus). Verify
      against the printed Tom 25 PDF or censorship-history scholarship before
      the vault asserts instigation.
    phase: extract
    why: "agent claim not anchored in the extract bytes"
  - item: >
      Print-run arithmetic for the 1885 Sytin transfer (E18): 900 rubles at 1½
      kopecks/copy implies 60,000 copies, not the 600,000 the letter-sweep stub
      reported. Confirm the count (and whether the PSS note gives one) before
      citing a figure.
    phase: sweep
    why: "order-of-magnitude discrepancy between agent note and letter arithmetic"
  - item: >
      The 1910 grading letter (E40) ranks only the leaflets Gorbunov-Posadov
      happened to send — «Чем люди живы» is absent from the list entirely. Do
      not read absence as demotion, and note several top-tier titles («Большая
      медведица», «Камни», «Сестры») are later Posrednik leaflets, not Tom 25
      tales.
    phase: synthesize
    why: "guard against over-reading the terminal ranking"
  - item: >
      «Сказка об Иване-дураке» first-publication venue: the apparatus digest
      says Posrednik (approval Apr 1886); some traditions cite part 12 of the
      1886 «Сочинения». Pin the venue before the works record is created.
    phase: scholarship
    why: "two candidate first-publication venues"
  - item: >
      genre value `fairy_tale` proposed for Ivan the Fool — verify against the
      works schema's controlled genre vocabulary before applying (fallback:
      short_story).
    phase: synthesize
    why: "possible enum gap"
  - item: >
      Multiple workRecords in one dossier (six) — sanctioned by the parked plan
      for this dive (theme-dive whose keystones get records), but the dossier
      schema documents a single workRecord block; ingestion should apply each
      proposal as if it were a single-work dive's block.
    phase: synthesize
    why: "schema-shape deviation, deliberate"
  - item: >
      First English translation dates for Where Love Is, Two Old Men, Ivan the
      Fool (Dole/Crowell window 1887–1891 vs Maude 1906) — partly unresolved.
    phase: scholarship
    why: "bibliographic gap"
  - item: >
      Tale keystone quotes were located by the deep-read subagent; all passed
      grep spot-checks, but «Два старика»'s «за морем Христа искать» line occurs
      in Elisei's deliberation paragraph — confirm the index prose attributes it
      to the right scene.
    phase: extract
    why: "attribution nuance inside the tale"

