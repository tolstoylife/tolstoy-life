contradictions:
  - claim: >
      What Is Art? (1898) consigns all of Tolstoy's own fiction to «дурное
      искусство» except two 1872 Azbuka stories — by omission, the народные
      рассказы included.
    correction: >
      The 24 Oct 1910 letter to Gorbunov-Posadov grades nine of the tales «очень
      хорошие» among the Posrednik leaflets — the private editorial verdict
      contradicts the public theoretical sweep. Both are primary; the tension is
      the finding, not an error to resolve.
    evidenceRef: E40

