    facsimile: null
    quoteRu: Попыток соединения Евангелий в одно было много, но те все, которые я знаю, — Arnolde, de Vence, Фаррара, Рейса, Гречулевича, — все они берут исторические основы соединения, и все они безуспешны
    quoteEn: There have been many attempts to combine the Gospels into one, but all those I know — Arnolde, de Vence, Farrar, Reuss, Grechulevich — all take historical bases for the combination, and all are unsuccessful. (working English)
    significance: 'He differentiates his method from prior harmonies (Farrar, Reuss, Grechulevich): they harmonize by historical chronology; he harmonizes by the MEANING of the teaching. (He took Grechulevich''s sequence as a base and cross-checked Reuss.)'
  - dive: gospel-translation
    id: harm-reject-orthodoxy
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
