    facsimile: null
    quoteRu: 1) Все его сочинения, литературные произведения и писания всякого рода, как уже где-либо напечатанные, так и еще не изданные, не составляли после его смерти ничьей частной собственности, а могли бы быть издаваемы и перепечатываемы всеми, кто этого захочет.
    quoteEn: (working English) 1) That all his compositions, literary works and writings of every kind, whether already published anywhere or not yet issued, should after his death be no one's private property, but might be published and reprinted by anyone who wishes.
    significance: The Explanatory Note to the final will (31 July 1910), drafted by V. G. Chertkov at Tolstoy's request — the legally precise statement that finally gave the renunciation binding form. The operative provision is encoded as <noteGrp type="comments"> apparatus rather than <p> body, so the extractor formerly returned only the opener; extract_tei.py --notes=auto now recovers it (see needsReview, resolved). The recovered extract mixes the document's own text with the PSS editors' commentary — verify any verbatim quotation against PSS Tom 82 pp.227–231.
