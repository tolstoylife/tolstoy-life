    date: '1898-04-02'
    addressee: Nicholas II — petition in the Doukhobors' name, draft (letter 107)
    localPdf: primary-sources/jubilee-edition/vol53/vol53.pdf
    extract: docs/research/doukhobors/extracts/v71_107_NikolayuII.txt
