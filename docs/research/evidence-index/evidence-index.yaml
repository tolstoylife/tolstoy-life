    quoteRu: была долина, в которой, принося жертву Молоху, жгли людей. В геенну отдать — значить сжечь.
    quoteEn: was a valley in which, offering sacrifice to Moloch, they burned people. To give over to Gehenna means to burn. (working English)
    significance: Matthew 5:22 footnote. Tolstoy demythologizes "геенна огненная" (fiery Gehenna) as a literal historical valley of human sacrifice, and elsewhere insists Gehenna "is understood not as something in the next world — its whole meaning is only a greater degree of criminality." Hell-fire flattened into a graded scale of guilt in this life.
