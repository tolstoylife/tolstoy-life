  - dive: tolstoy-in-art
    id: v52_044_044_1891_07_13
    genre: diary
    teiId: null
    pssTom: 52
    pages: '44'
    date: '1891-07-13'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol52/vol52.pdf
    extract: docs/research/tolstoy-in-art/extracts/v52_044_044_1891_07_13.txt
    facsimile: null
    quoteRu: Приехал Репин и Гинзбург. За это время они меня лепят и пишут, а я написал статью об обжорстве и много подвинулся в большой статье.
    quoteEn: Repin and Ginzburg have arrived. During this time they sculpt and paint me, while I have written an article on gluttony and made much progress on the big article. (working English)
    significance: Keystone for the July 1891 Yasnaya sitting — Repin painting AND Ginzburg sculpting Tolstoy simultaneously, in his own words.
  - dive: tolstoy-in-art
    id: v62_034_A_A_Fetu
    genre: letter
    teiId: null
    pssTom: 62
    pages: 48–49
    date: '1873-09-23'
    addressee: A. A. Fet
    localPdf: primary-sources/jubilee-edition/vol62/vol62.pdf
    extract: docs/research/tolstoy-in-art/extracts/v62_034_A_A_Fetu.txt
    facsimile: null
    quoteRu: У меня каждый день, вот уже с неделю, живописец Крамской [...] делает мой портрет в Третьяковскую галлерею, и я сижу и болтаю с ним и из Петербургской стараюсь обращать его в крещеную веру.
    quoteEn: Every day now, for a week already, the painter Kramskoy has been making my portrait for the Tretyakov gallery, and I sit and chat with him and try to convert him from the Petersburg faith to the baptized one. (working English)
    significance: The keystone. Tolstoy's own words date the Kramskoy sittings to the week before 23 Sept 1873 and name the Tretyakov commission.
  - dive: tolstoy-in-photographs
    id: v69_135_a
    genre: letter
    teiId: null
    pssTom: 69
    pages: '161'
    date: '1896-10-10'
    addressee: T. L. Tolstaya (daughter Tanya)
    localPdf: primary-sources/jubilee-edition/vol69/vol69.pdf
    extract: docs/research/tolstoy-in-photographs/extracts/v69_135_a.txt
    facsimile: null
    quoteRu: Мама целый день занимается фотографией. Она сняла несколько раз Козловку и группу нас всех.
    quoteEn: Mama spends the whole day on photography. She photographed Kozlovka [station] several times, and a group of all of us. (working English)
    significance: A dated record (10–11 Oct 1896) of Sofia Andreevna photographing at Yasnaya Polyana — the station at Kozlovka and a family group — in Tolstoy's own hand. Grounds the scholarly picture of Sofia as a prolific domestic photographer (~1,000 photographs from the late 1880s).
  - dive: tolstoy-in-photographs
    id: v89_852_sentyabrya26
    genre: letter
    teiId: null
    pssTom: 89
    pages: 143–146
    date: '1909-09-26'
    addressee: V. G. Chertkov
    localPdf: primary-sources/jubilee-edition/vol89/vol89.pdf
    extract: docs/research/tolstoy-in-photographs/extracts/v89_852_sentyabrya26.txt
    facsimile: null
    quoteRu: Фотографии Тапселя превосходны — нас с детьми.
    quoteEn: Tapsell's photographs are superb — of us with the children. (working English)
    significance: 'Tolstoy praises photographs by Thomas Tapsell, the English photographer Chertkov brought from England, showing Tolstoy with his grandchildren at Krekshino (PSS note: 18 Sept 1909). The same letter notes "the cinematograph men were at our place" and his departure "came out splendidly" — willing approval of Chertkov''s controlled, sympathetic photography.'
