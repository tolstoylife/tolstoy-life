    facsimile: null
    quoteRu: Чего желал Христос, совершается. Огонь возгорается. Не будем же противиться, а будем служить ему.
    quoteEn: What Christ wished for is coming to pass. The fire is blazing up. Let us then not resist it, but serve it. (working English)
    significance: Tolstoy's own coda. The Russian reads "let us not resist but serve it"; the Swedish edition the user cited renders it "let us not extinguish it, but spread and sustain it" — a free translation/redaction variant (flagged in needsReview), not a different source claim.
