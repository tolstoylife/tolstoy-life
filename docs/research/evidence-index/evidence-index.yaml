  rolesByDive:
    christian: 'Tolstoy''s governing distinction: истинное христианство (inward, universal) vs церковное христианство (''the greatest enemy of Christ'')'
  evidenceCount: 5
  evidence:
  - dive: christian
    id: diary_1890_mutual_exclusion
    genre: diary
    teiId: null
    pssTom: 51
    pages: '71'
    date: '1890-08-03'
    addressee: null
    localPdf: null
    extract: docs/research/christian/extracts/v51_071_071_1890_08_03.txt
    facsimile: null
    quoteRu: Православие и христианство имеют общего только название. Если церковники христиане, то я не христианин, и наоборот.
    quoteEn: Orthodoxy and Christianity have only the name in common. If churchmen are Christians, then I am not a Christian, and vice versa. (working English)
    significance: 'The epigram of the whole dive: the church-label and Tolstoy''s Christianity are mutually exclusive, stated in the privacy of the diary.'
  - dive: christian
    id: diary_1897_strength_not_weakness
    genre: diary
    teiId: null
    pssTom: 53
    pages: 159–160
    date: '1897-11-10'
    addressee: null
    localPdf: null
    extract: docs/research/christian/extracts/v53_159_160_1897_11_10.txt
    facsimile: null
    quoteRu: 'Как раз напротив: истинное христианство прежде всего требует высшее сознание своего достоинства, страшную силу и непоколебимость.'
    quoteEn: 'The most ordinary judgement of Christianity, especially among the new Nietzschean reasoners, is that Christianity is renunciation of one''s dignity, weakness, submission. On the contrary: true Christianity first of all requires the highest consciousness of one''s dignity, terrible strength and steadfastness. (working English)'
    significance: Defends 'true Christianity' as strength against the contemporary (Nietzschean) caricature — the positive content he keeps after discarding the church-label.
  - dive: christian
    id: vyazemsky_1901_church_enemy
    genre: letter
    teiId: null
    pssTom: 73
    pages: 23–25
    date: '1901-01-28'
    addressee: K. A. Vyazemsky
    localPdf: null
    extract: docs/research/christian/extracts/v73_015_K_A_Vyazemskomu.txt
    facsimile: null
    quoteRu: Чем больше я живу, чем более приближаюсь к смерти, тем более убеждаюсь в том, что церковное христианство есть величайший враг Христа, его учения и блага людей.
    quoteEn: The more I live, the closer I come to death, the more convinced I am that church Christianity is the greatest enemy of Christ, of his teaching, and of the good of men. (working English)
    significance: 'Written weeks before the Synod''s February 1901 edict: church-Christianity is set against Christ himself — the polarity that lets Tolstoy reject the church-label while keeping Christ.'
  - dive: christian
    id: nazhivin_1904_true_vs_social
    genre: letter
    teiId: null
    pssTom: 75
    pages: 60–62
    date: '1904-03-17'
    addressee: I. F. Nazhivin
    localPdf: null
    extract: docs/research/christian/extracts/v75_076_I_F_Nazhivinu.txt
    facsimile: null
    quoteRu: Христианство, истинное христианство, по моему мнению, тем и отличается от религий, которые можно называть общественными, как католичество, православие, магометанство, я думаю даже конфуцианство, что оно обращается к душе каждого отдельного человека, для каждого отдельного человека разрешает его вопрос жизни, указывает ему его назначение, состоящее в исполнении воли бога, в слиянии с ней своей воли, в служении для бога богу и людям и тем дает ему спокойствие и благо.
    quoteEn: Christianity, true Christianity, in my opinion, differs from the religions one may call social — such as Catholicism, Orthodoxy, Mohammedanism, and I think even Confucianism — in that it addresses the soul of each individual person. (working English)
    significance: 'The true-vs-church (here: vs ''social'' confessional) distinction stated as a definition; ''true Christianity'' is the inward, individual address, not the institutional religion.'
  - dive: christian
    id: rukavishnikov_1909_perennial
    genre: letter
    teiId: null
    pssTom: 79
    pages: 53–59
    date: '1909-01-29'
    addressee: N. A. Rukavishnikov
    localPdf: null
    extract: docs/research/christian/extracts/v79_055_N_A_Rukavishnikovu.txt
    facsimile: null
    quoteRu: 'Христианство же в его истинном значении я считаю не то, которое мне таковым кажется, но то, которое одинаково признавалось и признается всеми величайшими мыслителями мира до и после Христа. Истинное христианство это не есть какое-либо отдельное от других, исключительное учение, а есть наиболее полное и ясное для нашего времени выражение вечных, божеских истин, одинаково признаваемых всеми великими религиозными учениями мира: браминизмом, буддизмом, конфуцианством, маздеизмом, таосизмом, магометанством и другими.'
    quoteEn: 'True Christianity is not some separate, exclusive teaching, but the fullest and clearest expression for our time of the eternal, divine truths equally acknowledged by all the great religious teachings of the world: Brahminism, Buddhism, Confucianism, Mazdeism, Taoism, Mohammedanism and others. (working English)'
    significance: '''True Christianity'' redefined as one flowering of a single perennial truth shared across the world''s religions — Christianity as expression, not proprietary creed.'
