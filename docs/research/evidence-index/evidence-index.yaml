  rolesByDive:
    christian-anarchism: Tolstoy's closest disciple and publisher; gave «христианский анархизм» programmatic Russian form in the 1905 booklet O khristianskom anarkhizme (Svobodnoe Slovo), the in-circle frame the Sacy phrase points to. The 1905 booklet is not held locally.
    copyright-renunciation: co-drafter of the six wills; drafted the 1910 Explanatory Note; held Tolstoy's post-1881 rights
    crisis: disciple/correspondent from 1883; the PSS Tom 85 apparatus that carries the editors' 'кризис своих воззрений' annotates the Chertkov letters
    doukhobors: Co-author of «Help!»; expelled to England 1897, where he became the organising hub of the relief effort.
    jubilee-edition-tei-corpus: editor-in-chief (главный редактор) of the Jubilee Edition; Tolstoy's disciple and keeper of his manuscripts; d. 1936 mid-project
    tolstoyanism: 'Not named in the four quotes, but the focal point of the ambivalence: the de facto organiser, dogmatist and publisher (Free Age Press) of the very movement Tolstoy disowns. The gap between Tolstoy''s ''there is no such thing'' and Chertkov''s institution-building is the dive''s central tension.'
