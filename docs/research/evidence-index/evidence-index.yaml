  - dive: christian-anarchism
    id: v52_seed_reframing
    genre: diary
    teiId: null
    pssTom: 52
    pages: 138–140
    date: '1894-09-10'
    addressee: diary (Yasnaya Polyana)
    localPdf: primary-sources/jubilee-edition/vol18/vol18.pdf
    extract: docs/research/christian-anarchism/extracts/v52_138_140_1894_09_10.txt
    facsimile: null
    quoteRu: 'Ответ не может быть дан на вопрос, потому что он дурно поставлен. Вопрос не в том — устроить государство: по нынешнему, или по новому. Я и никто из нас не приставлен к решению этого вопроса.'
    quoteEn: The answer cannot be given to the question, because it is badly posed. The question is not whether to arrange the state in the present way or in a new way. Neither I nor any of us is appointed to the solving of that question. (working English)
    significance: 'The structural move that defines Tolstoy''s ''anarchism'': the question ''how to organise a stateless society'' is rejected as wrongly posed. No one is appointed to redesign the state; that is not the question a person can answer.'
  - dive: christian-anarchism
    id: v72_eltzbacher_reject_ru
    genre: letter
    teiId: null
    pssTom: 72
    pages: 424–426
    date: '1900-08-01'
    addressee: Paul Eltzbacher
    localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
    extract: docs/research/christian-anarchism/extracts/v72_341_PaulyuElcbaxeruPaulEltzhacher.txt
    facsimile: docs/research/christian-anarchism/extracts/pss-pages/tom72-eltzbacher-442.png
    quoteRu: Мне кажется только, что я не анархист в смысле политического реформатора. В оглавлении вашей книги под словом «насилие» сделаны указания на разные страницы из других сочинений, но ни одной ссылки на мои. Не доказательство ли это того, что то учение, которое вы мне приписываете и которое, в сущности, есть не что иное, как учение Христа, вовсе не политическое, а религиозное учение?
    quoteEn: It seems to me only that I am not an anarchist in the sense of a political reformer. In the index of your book under the word 'violence' references are made to various pages of the other writers, but not one to mine. Is this not proof that the teaching which you ascribe to me, and which is, in essence, nothing other than the teaching of Christ, is not a political but a religious teaching? (working English)
    significance: 'THE REJECTION (political). The classic double move: refuse the label (''not an anarchist in the sense of a political reformer''), affirm the substance, re-name it Christ''s teaching. The index argument is the proof — Eltzbacher''s own book has no Tolstoy reference under ''violence'', because Tolstoy wrote on non-resistance as religion, never on violence as politics. (PSS Tom 72 p.442 facsimile.)'
  - dive: christian-anarchism
    id: v73_sacy_ru
    genre: letter
    teiId: null
    pssTom: 73
    pages: 109–110
    date: '1901-07-28'
    addressee: Gabriel Sacy
    localPdf: primary-sources/jubilee-edition/vol37/vol37.pdf
    extract: docs/research/christian-anarchism/extracts/v73_126_GabrielyuSasiGabrielSacy.txt
    facsimile: docs/research/christian-anarchism/extracts/pss-pages/tom73-sacy-154.png
    quoteRu: я все-таки думаю, что бабизм, как нравственное и гуманитарное учение, имеет большое будущее в восточном мире. Имея много общего с христианским анархизмом, он должен рано или поздно с ним слиться.
    quoteEn: I still think that Babism, as a moral and humanitarian doctrine, has a great future in the eastern world. Having much in common with Christian anarchism, it must sooner or later merge with it. (working English)
    significance: THE UNIQUE SELF-ATTESTATION. The only place in the entire 90-volume Jubilee Edition where Tolstoy uses «христианский анархизм» in his own voice. Even here it is third-person — Babism 'has much in common with Christian anarchism' — naming it as an existing body of doctrine, one step short of 'I am a Christian anarchist'. (PSS Tom 73 p.154 facsimile.)
  - dive: copyright-renunciation
    id: v49_059_059_1883_01_01
    genre: diary
    teiId: null
    pssTom: 49
    pages: '59'
    date: '1883-01-01'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol50/vol50.pdf
    extract: docs/research/copyright-renunciation/extracts/v49_059_059_1883_01_01.txt
    facsimile: null
    quoteRu: Собственность, как она теперь — зло. А собственность сама по себе — радость на то, что тем, что я сделал, добро. […] Но собственность, ограждаемая насилием — городовым с пистолетом — это зло. Сделай ложку и ешь ею, но пока она другому не нужна.
    quoteEn: Property as it is now — is evil. Property in itself — is joy in the good one has made. […] But property defended by violence — by the policeman with a pistol — that is evil. Make a spoon and eat with it, but only until another needs it. (working English)
    significance: 'The philosophical groundwork: property is not in itself evil, property defended by violence is. The conceptual foundation the later, practical renunciation statements rest on.'
  - dive: copyright-renunciation
    id: v52_045_047_1891_07_22
    genre: diary
    teiId: null
    pssTom: 52
    pages: 45–47
    date: '1891-07-22'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol18/vol18.pdf
    extract: docs/research/copyright-renunciation/extracts/v52_045_047_1891_07_22.txt
    facsimile: null
    quoteRu: 'И вчера же был разговор с женой о напечатании письма в газетах об отказе от права авторской собственности. Трудно вспомнить, а главное, описать всё, что тут было: [Вымарано 19 строк.]'
    quoteEn: 'And yesterday too there was a conversation with my wife about printing in the newspapers the letter renouncing the right of literary property. It is difficult to recall, and chiefly to describe, everything that was said: [19 lines erased.] (working English)'
    significance: First detailed diary account of the household conflict over the 1891 declaration. The editorial marker [Вымарано 19 строк] preserves the fact that nineteen manuscript lines were deleted (by S. A. Tolstaya) — the source records the redaction without the redacted text.
  - dive: copyright-renunciation
    id: v53_014_018_1895_03_27
    genre: diary
    teiId: null
    pssTom: 53
    pages: 14–18
    date: '1895-03-27'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol19/vol19.pdf
    extract: docs/research/copyright-renunciation/extracts/v53_014_018_1895_03_27.txt
    facsimile: docs/research/copyright-renunciation/extracts/pss-vol53-pages/page-054.png
    quoteRu: '4) Право на издание моих сочинений прежних: десяти томов и азбуки прошу моих наследников передать обществу, т. е. отказаться от авторского права. Но только прошу об этом и никак не завещаю. […] То, что сочинения мои продавались эти последние 10 лет, было самым тяжелым для меня делом в жизни.'
    quoteEn: 4) I ask my heirs to hand over to the public the right of publication of my earlier works — the ten volumes and the Azbuka — that is, to renounce the copyright. But I only ask this and in no way bequeath it. […] That my writings have been sold during these last ten years was the heaviest thing in my life. (working English)
    significance: Will-as-diary-entry; the most plainly written first-person statement of the renunciation. Precedes the six formal wills of 1909–1910 by fourteen years.
  - dive: copyright-renunciation
    id: v66_036_RedaktoramgazetRusskievedomosti
    genre: letter
    teiId: null
    pssTom: 66
    pages: 47–48
    date: '1891-09-16'
    addressee: Editors of Russkie vedomosti and Novoye vremya
    localPdf: primary-sources/jubilee-edition/vol32/vol32.pdf
    extract: docs/research/copyright-renunciation/extracts/v66_036_RedaktoramgazetRusskievedomosti.txt
    facsimile: null
    quoteRu: Предоставляю всем желающим право безвозмездно издавать в России и за границей, по-русски и в переводах, а равно и ставить на сценах все те из моих сочинений, которые были написаны мною с 1881 года и напечатаны в XII томе моих полных сочинений издания 1886 года, и в XIII томе, изданном в нынешнем 1891 году, равно и все мои неизданные в России и могущие вновь появиться после нынешнего дня сочинения.
    quoteEn: I grant to all who so wish the right to publish gratis, in Russia and abroad, in Russian and in translations, and likewise to perform on stage, all those of my writings which were written by me from 1881 onward and printed in vol. XII of my complete works of the 1886 edition, and in vol. XIII, published in this present year 1891, and likewise all my works unpublished in Russia and any that may newly appear after the present day. (working English)
    significance: The public declaration renouncing copyright on all writings from 1881 onward (dated 16 September 1891 in-corpus; the papers printed it days later). Source of the «с 1881 года» reading (see contradictions).
  - dive: crisis
    id: ispoved_p10_ostanovka
    genre: work
    teiId: v23_001_059_Ispoved
    pssTom: 23
    pages: '10'
    date: '1882'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/crisis/extracts/v23_001_059_Ispoved.txt
    facsimile: null
    quoteRu: 'Так я жил, но пять лет тому назад со мною стало случаться что-то очень странное: на меня стали находить минуты сначала недоумения, остановки жизни, как будто я не знал, как мне жить, что мне делать, и я терялся и впадал в уныние. […] Эти остановки жизни выражались всегда одинаковыми вопросами: Зачем? Ну, а потом?'
    quoteEn: 'So I lived, but five years ago something very strange began to happen to me: at first there came over me moments of bewilderment, of life coming to a stop, as though I did not know how to live or what to do, and I lost my footing and fell into dejection. […] These stoppages of life always expressed themselves in the same questions: Why? And then what? (working English)'
    significance: Tolstoy's own image for the episode — "остановка жизни" (the arrest of life) — alongside отчаяние (despair, 16×) and the lost "смысл жизни" (meaning of life, 22×). Narrative and figurative, never the clinical noun "crisis".
  - dive: crisis
    id: vchem_moya_vera_opening
    genre: work
    teiId: v23_304_465_V_chem_moja_vera
    pssTom: 23
    pages: '304'
    date: '1884'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/crisis/extracts/v23_304_465_V_chem_moja_vera.txt
    facsimile: null
    quoteRu: Пять лет тому назад я поверил в учение Христа — и жизнь моя вдруг переменилась […] Со мной случилось то, что случается с человеком, который вышел за делом и вдруг дорогой решил, что дело это ему совсем не нужно,— и повернул домой.
    quoteEn: Five years ago I came to believe in Christ's teaching — and my life suddenly changed […] What happened to me was what happens to a man who goes out on some errand and then suddenly decides on the way that the errand is of no use to him at all — and turns back home. (working English)
    significance: 'The companion account, told as the turn toward faith. The word is "переменилась" (changed), not "кризис". Note the tension with A Confession: here the change is "вдруг" (sudden), there it "had long been preparing" — two framings, neither a "crisis".'
  - dive: crisis
    id: ispoved_p40_perevorot
    genre: work
    teiId: v23_001_059_Ispoved
    pssTom: 23
    pages: '40'
    date: '1882'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/crisis/extracts/v23_001_059_Ispoved.txt
    facsimile: docs/research/crisis/extracts/pss-tom23-page-040-perevorot.png
    quoteRu: Я жил так года два, и со мной случился переворот, который давно готовился во мне и задатки которого всегда были во мне. Со мной случилось то, что жизнь нашего круга — богатых, ученых — не только опротивела мне, но потеряла всякий смысл.
    quoteEn: I lived like that for a couple of years, and there occurred in me an upheaval [переворот] that had long been preparing within me, and whose seeds had always been in me. What happened to me was that the life of our circle — the rich, the learned — not only grew repugnant to me, but lost all meaning. (working English)
    significance: The keystone. In the work where Tolstoy narrates the transformation, the word is "переворот" (upheaval), never "кризис"; and he denies a sudden rupture — it "had long been preparing" and "its seeds had always been in me". Verified verbatim against PSS Tom 23 p.40 (vol83, phys p.78).
  - dive: crisis
    id: ispoved_p46_undatable
    genre: work
    teiId: v23_001_059_Ispoved
    pssTom: 23
    pages: '46'
    date: '1882'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/crisis/extracts/v23_001_059_Ispoved.txt
    facsimile: null
    quoteRu: И я спасся от самоубийства. Когда и как совершился во мне этот переворот, я не мог бы сказать. […] так же постепенно, незаметно возвратилась ко мне эта сила жизни. И странно, что та сила жизни, которая возвратилась ко мне, была не новая, а самая старая, — та самая, которая влекла меня на первых порах моей жизни.
    quoteEn: And I was saved from suicide. When and how this upheaval [переворот] took place in me, I could not say. […] just as gradually, imperceptibly, the force of life returned to me. And it is strange that the force of life which returned to me was not a new one, but the very oldest — the same that had drawn me in the first days of my life. (working English)
    significance: The transformation stated as explicitly un-datable ("when and how … I could not say") and as a return to something old rather than the arrival of something new — the strongest textual counter to reading it as a dated "crisis".
