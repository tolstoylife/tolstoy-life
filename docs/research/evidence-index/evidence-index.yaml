    quoteRu: До сих пор все отказы от военной службы бывали основаны на мотивах, вытекающих из религиозных верований, и правительства объясняли их как последствия сектантского фанатизма, тогда как отказ Вандервера, который даже не называет себя христианином (вероятно, в том смысле, который церкви обычно придают этому слову, в сущности же я считаю его более христианином, чем все епископы, которые будут осуждать его поступок), не дает правительству никакой возможности объяснить его поступок, как исключение, и ясно обнаруживает противоречие между христианством, к которому причисляют себя правительства, и существующим порядком, который они поддерживают постоянными армиями, не имеющими другого назначения, кроме насилия и убийства.
    quoteEn: '...Van der Veer, who does not even call himself a Christian (probably in the sense the churches usually give the word, though in essence I consider him more of a Christian than all the bishops who will condemn his act)... (working English)'
    significance: 'The explicit two-senses split: the church sense of ''Christian'' (which the conscientious objector rejects) vs the essential sense (which Tolstoy affirms of him).'
  - dive: christian
    id: vanderveer_1896_cannot_not_be
    genre: letter
    teiId: null
    pssTom: 69
    pages: 124–127
    date: '1896-08-23'
    addressee: John Van der Veer
    localPdf: null
    extract: docs/research/christian/extracts/v69_102_DzhonuVanderVeruVanderVeerJohn.txt
    facsimile: null
    quoteRu: Дорогой друг, Называю вас так, потому что, прочитав ваше письмо к командиру полка,³ По этому письму я вижу, что ваше понимание жизни и наших обязанностей к богу и ближнему тождественно с моим. Вы говорите в вашем письме, что вы не христианин; но вы не можете не быть таковым, так как поступок ваш мог вытечь только из христианского начала, заключающегося в признании цели своего существования не в благе своей личности, но в осуществлении истины и общего блага, иначе говоря — в осуществлении воли божьей и установлении его царства на земле.
    quoteEn: You say in your letter that you are not a Christian; but you cannot but be one, since your act could only have flowed from the Christian principle. (working English)
    significance: Tolstoy bestows the label on a man who refuses it, redefining 'Christian' by deed rather than self-ascription — the mirror image of declining it for himself.
