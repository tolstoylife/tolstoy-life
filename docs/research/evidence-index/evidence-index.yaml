    date: '1896-12-26'
    addressee: afterword to the appeal «Помогите!» (Help!)
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: docs/research/doukhobors/extracts/v39_192_196_Posleslovie_k_vozzvaniju_Pomogite.txt
    facsimile: null
    quoteRu: Среди духоборов, или, скорее, христианского всемирного братства, как они теперь называют себя, происходит ведь не что-нибудь новое, а только произрастание того семени, которое посеяно Христом 1800 лет тому назад, — воскресение самого Христа.
    quoteEn: 'Among the Doukhobors — or rather the universal Christian brotherhood, as they now call themselves — what is taking place is nothing new, but only the sprouting of that seed which was sown by Christ 1,800 years ago: the resurrection of Christ himself. (working English)'
    significance: The most exalted of all his Doukhobor statements. The afterword to the appeal «Help!», co-signed by Chertkov, Biryukov and Tregubov, who were exiled for it.
  - dive: doukhobors
    id: v39_099_105_unquenchable_fire
    genre: works
    teiId: null
    pssTom: 39
    pages: 99–105
    date: '1895-10-01'
    addressee: afterword to P. I. Biryukov's article 'The Persecution of Christians in Russia in 1895'
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: docs/research/doukhobors/extracts/v39_099_105_Posleslovie_k_state_P_I_Birjukova_Gonenie_na_hristian_v_Rossii_v_1895_g.txt
    facsimile: null
    quoteRu: Сколько бы ни набрасывали на горящую кучу хвороста дров, думая этим затушить огонь, — огонь, непотухающий огонь истины, только на время приглохнет, но разгорится еще сильнее и сожжет всё то, что наложено на него.
    quoteEn: However much firewood is thrown onto the burning heap of brush in the hope of putting the fire out, the fire — the unquenchable fire of truth — will only die down for a time, then blaze up the more strongly and burn everything that has been piled upon it. (working English)
    significance: 'The doctrinal companion to the factual letter, and the image that recurs across all his Doukhobor writing: the state cannot win — repression spreads the example. Biryukov wrote the article; Tolstoy the afterword.'
