  rolesByDive:
    lords-prayer: 'The subject of this dive: Tolstoy''s family of renderings of the Lord''s Prayer, his anti-petitionary reading, and the glory→reason / kingdom→spirit substitutions. A concept page anchored in the two works.'
  evidenceCount: 6
  evidence:
  - dive: lords-prayer
    id: lp-A-render
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: 'Так вот как молитесь: Отец! Чтобы было твое царство. Пусть будет твоя воля в тебе и во мне.'
    quoteEn: 'So pray thus: Father! That thy kingdom be. May thy will be in thee and in me. (working English)'
    significance: Version A — the close retranslation in the Sermon-on-the-Mount chapter (Matt 6:9-10). Collapses the opening petitions and re-points "as in heaven, so on earth" to "in thee and in me"; drops "who art in heaven" as absent from Luke.
  - dive: lords-prayer
    id: lp-B-render
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: 'И Иисус сказал им: когда молитесь, говорите: Отец! да будешь ты свят в нас, да объявится царство твое, т. е. да будет воля твоя; да сойдет в нас дух твой и очистит нас.'
    quoteEn: 'And Jesus said to them: when you pray, say: Father! mayest thou be holy in us, may thy kingdom be made manifest, that is, may thy will be done; may thy spirit descend into us and cleanse us. (working English)'
    significance: Version B — the transformed prayer in the "On Prayer" (Luke 11) chapter, the deepest rewriting. The kingdom petition is replaced by the descent of the spirit. See lp-B-variant-note for the text-critical pedigree.
  - dive: lords-prayer
    id: lp-abolish-question
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: Как еще яснее сказать, что не нужно молиться?
    quoteEn: How could it be said more plainly that one must not pray? (working English)
    significance: 'The hinge of Tolstoy''s whole reading: the Lord''s Prayer is not a formula to repeat but Jesus''s refutation of petitionary prayer (grounded in Matt 6:7-8, the Father "knows what you need before you open your lips"). The model prayer, for Tolstoy, abolishes prayer-as-asking.'
  - dive: lords-prayer
    id: lp-C-surprise
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/gib_lords_prayer.txt
    facsimile: null
    quoteRu: Окончив свою работу, я к удивлению и радости своей нашел, что так называемая молитва господня есть не что иное, как в самой сжатой форме выраженное всё учение Иисуса в том самом порядке, в котором были расположены мною главы, и что каждое выражение молитвы соответствует смыслу и порядку глав.
    quoteEn: On finishing my work I found, to my surprise and joy, that the so-called Lord's Prayer is nothing other than the whole teaching of Jesus expressed in the most condensed form, in the very order in which I had arranged the chapters, and that each phrase of the prayer corresponds to the sense and order of the chapters. (working English)
    significance: 'Version C''s premise (Gospel in Brief preface): the prayer maps phrase-by-phrase onto Tolstoy''s twelve chapters — which he treats as internal proof that his structure was the teaching''s own. A rhetorical, not text-critical, claim (see scholarship: extends).'
  - dive: lords-prayer
    id: lp-C-table-close
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/gib_lords_prayer.txt
    facsimile: null
    quoteRu: А будет твоя власть, и сила, и разум.
    quoteEn: But there will be thy power, and strength, and reason. (working English) — Tolstoy's meaning for the doxology (phrase 12 of 12)
    significance: 'The signature substitution that closes the twelve-fold table: "kingdom and power and GLORY" becomes "power and strength and REASON (разум)." Glory → reason is the most concentrated statement of Tolstoy''s whole programme.'
