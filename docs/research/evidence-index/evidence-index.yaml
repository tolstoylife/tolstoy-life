    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/gospel-translation/extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    facsimile: null
    quoteRu: В православном вероучении я нашел изложение самых непонятных, кощунственных и безнравственных положений, не только не допускаемых разумом, но совершенно непостижимых и противных нравственности, и — никакого учения о жизни и о смысле ее.
    quoteEn: In the Orthodox creed I found an exposition of the most incomprehensible, blasphemous and immoral propositions — not only inadmissible to reason but utterly incomprehensible and contrary to morality — and no teaching whatever about life or its meaning. (working English)
    significance: 'The motive, stated in the Introduction to the harmony: Orthodox dogmatic theology gave him no teaching about life, so he resolved to go behind it to Christ''s own words. The negative half of the project (the positive being the new translation itself).'
