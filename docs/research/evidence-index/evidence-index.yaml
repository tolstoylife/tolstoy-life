    pages: 313–442
    date: '1887'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol86/vol86.pdf
    extract: docs/research/fire-metaphor/extracts/v26_313_442_O_zhizni.txt
    facsimile: null
    quoteRu: 'Я видел свет от горевшей передо мной травы. Трава эта потухла, но свет только усилился: я не вижу причины этого света, не знаю, чтò горит, но могу заключить, что тот же огонь, который сжег эту траву, жжет теперь дальний лес, или что-то такое, чего я не могу видеть.'
    quoteEn: 'I saw the light from the grass that burned before me. That grass went out, but the light only grew stronger: I do not see the cause of this light, I do not know what is burning, but I can conclude that the same fire that burned this grass is now burning the distant forest, or something of the kind that I cannot see. (working English)'
    significance: 'The most original fusion of fire and light: a death is grass that burns out while its fire and light pass on, undiminished, to the distant forest — life as a single fire moving through the generations.'
