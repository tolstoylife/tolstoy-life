    quoteRu: Разделение Евангелия на 12 или на 6 глав (соединяя по две главы в одну) вытекло само собою из смысла учения.
    quoteEn: The division of the Gospel into 12 chapters (or into 6, joining two chapters into one) emerged of itself from the meaning of the teaching. (working English)
    significance: 'The harmony''s architecture: 12 chapters framed by the John 1 prologue and the 1 John epilogue — a structure Tolstoy says he did not impose but found in the teaching.'
  - dive: gospel-translation
