    extract: docs/research/fire-metaphor/extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    facsimile: null
    quoteRu: Кто пойдет за мной, тот не будет во тьме, а у того будет жизнь. Жизнь и свет одно и то же.
    quoteEn: Whoever follows me will not be in darkness, but will have life. Life and light are one and the same. (working English)
    significance: 'John 8:12 distilled: "Life and light are one and the same." The Johannine triad Word–life–light is collapsed into a single identity: reason = life = light, opposed to the darkness of the flesh.'
