    quoteRu: 'И потому, если мы не можем исполнять того, без чего нас нельзя терпеть в государстве, мы просим одно: отпустите нас.'
    quoteEn: 'And so, if we cannot fulfil that without which we cannot be tolerated in the state, we ask one thing only: let us go. (working English)'
    significance: AUTHORITIES THREAD. Tolstoy drafts the Doukhobors' own petition to the Tsar — the plea that, since their faith bars military service, they be allowed to emigrate with their conscription-age sons (then being exiled 18 years to Yakutsk).
  - dive: doukhobors
    id: v72_426_nicholas_four_demands
    genre: letter
    teiId: null
    pssTom: 72
    pages: 514–521
    date: '1900-12-07'
    addressee: Nicholas II (letter 426; first redaction, pre-reform orthography)
    localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
    extract: docs/research/doukhobors/extracts/v72_426_NikolayuII.txt
