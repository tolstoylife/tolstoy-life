    quoteRu: Я пришел сбросить огонь на землю. И как желаю, чтобы он разгорелся.
    quoteEn: I came to cast fire upon the earth. And how I wish that it would blaze up. (working English)
    significance: THE keystone (Luke 12:49). Tolstoy's own rendering, set beside the Synodal column. The verse is kept close, but in the commentary the fire is fully allegorized — not judgment-fire but the spark that kindles God-consciousness; see harm-luke12-49-commentary. Facsimile shows the two-column divergence directly.
