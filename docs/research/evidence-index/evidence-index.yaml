    quoteRu: Как огонь не бывает немножко горячий, немножко холодный, а бывает огонь только тогда, когда он жжет, так и истина не бывает немножко истина, немножко ложь, а всегда истина
    quoteEn: As fire is never a little hot, a little cold, but is fire only when it burns, so truth is never a little truth, a little falsehood, but is always truth. (working English)
    significance: 'On Every Day (На каждый день). The credo''s fire-image recast as a maxim on truth: fire is only fire when it burns, and truth only truth when it shows what is — the exact sibling of the What I Believe credo (vera-credo), rewritten for the daily-reading anthology.'
