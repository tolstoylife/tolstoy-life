    facsimile: null
    quoteRu: 'Тогда скажет тем, которые налево: идите от меня прочь вы, нелюбимые, в тьму внешнюю,'
    quoteEn: 'Then he will say to those on the left: go away from me, you unloved ones, into the outer darkness, (working English)'
    significance: Matthew 25:41. The standard "depart from me, you cursed, into the eternal FIRE" becomes "go away, you unloved, into the outer DARKNESS." Hell-fire is converted into exclusion-from-life — the single clearest instance of fire→darkness substitution.
  - dive: fire-metaphor
