    extract: docs/research/doukhobors/extracts/v71_081_Vinostrannyegazety.txt
    facsimile: null
    quoteRu: Но нынешнее русское правительство употребило против духоборов еще третий, казалось бы оставленный в наше время, выход из этого противоречия. Оно, кроме того, что подвергает самым тяжелым страданиям самих отказывающихся, заставляет еще систематически страдать отцов, матерей, детей отказывающихся, вероятно с тем, чтобы пытками этих невинных семей поколебать решимость несогласных их членов.
    quoteEn: But the present Russian government has used against the Doukhobors a third way out of this contradiction, one seemingly abandoned in our time. Besides subjecting the refusers themselves to the heaviest sufferings, it forces the fathers, mothers, and children of the refusers to suffer systematically as well — probably so as to shake the resolve of the dissenting members by the torture of these innocent families. (working English)
    significance: 'AUTHORITIES THREAD. The analytic heart of the state-handling case: Tolstoy contrasts the Mennonite (alternative service) and Austrian-Nazarene (imprisonment) solutions with Russia''s choice to punish the families. The 1898 advocacy letter that opened the emigration appeal to the West.'
