    quoteRu: что этот талант есть огонь, который только тогда огонь, когда он жжет. Я верю, что я — Ниневия по отношению к другим Ионам, от которых я узнал и узнаю истину, но что и я Иона по отношению к другим ниневитянам, которым я должен передать истину.
    quoteEn: that this talent is a fire which is only a fire when it burns. I believe that I am a Nineveh in relation to other Jonahs, from whom I have learned and learn the truth, but that I too am a Jonah in relation to other Ninevites, to whom I must pass the truth on. (working English)
    significance: THE second keystone — the one quoted at the close of Biryukov's vol. II. From the "Я верю" (I believe) litany ending What I Believe (1884). Faith is a fire that is only a fire when it burns; the truth must be passed on. Fuses the fire metaphor with the duty to transmit.
