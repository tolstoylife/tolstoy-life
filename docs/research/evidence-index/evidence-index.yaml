    facsimile: null
    quoteRu: разночтений евангельских книг насчитывают до пятидесяти тысяч.
    quoteEn: the variant readings of the Gospel books are counted at up to fifty thousand. (working English)
    significance: 'His textual-criticism warrant for independence from the canonical text: with ~50,000 variants and no autograph, no single received reading is sacrosanct — so a fresh translation is legitimate.'
  - dive: gospel-translation
    id: gib-crisis-at-50
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/gospel-translation/extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    facsimile: null
    quoteRu: Я был приведен к христианству не богословскими, не историческими исследованиями, а тем, что пятидесяти лет от роду [...] я пришел в отчаяние и хотел убить себя [...] И я стал изучать христианство
    quoteEn: I was brought to Christianity not by theological or historical investigations, but by the fact that, at fifty years of age […] I fell into despair and wanted to kill myself […] And I began to study Christianity. (working English)
    significance: 'The crisis that drove the project, from the Gospel-in-Brief preface: the harmony is the PRODUCT of the conversion, not its cause (the point scholarship — Matual 1992 — also makes). Cross-links the project''s "Confession → переworot" framing in the sibling crisis dive.'
  - dive: gospel-translation
    id: gib-four-part-plan
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/gospel-translation/extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    facsimile: null
    quoteRu: перевод четырех Евангелий и соединение их в одно.
    quoteEn: the translation of the four Gospels and their combination into one. (working English)
    significance: 'Step 3 of the four-part project Tolstoy lays out in the preface: (1) the autobiographical account [Confession]; (2) the critique of church dogma [Critique of Dogmatic Theology]; (3) the translation+harmony itself; (4) the exposition of the teaching''s true meaning [What I Believe]. The harmony is the keystone of a tetralogy, not a standalone book.'
  - dive: gospel-translation
    id: gib-lords-prayer
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/gospel-translation/extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    facsimile: null
    quoteRu: так называемая молитва господня есть не что иное, как в самой сжатой форме выраженное всё учение Иисуса в том самом порядке, в котором были расположены мною главы, и что каждое выражение молитвы соответствует смыслу и порядку глав.
    quoteEn: the so-called Lord's Prayer is nothing other than the whole teaching of Jesus expressed in the most condensed form, in the very order in which I had arranged the chapters, and each phrase of the prayer corresponds to the sense and order of the chapters. (working English)
    significance: 'The post-hoc confirmation Tolstoy reports with "surprise and joy": his 12-chapter outline maps onto the Lord''s Prayer phrase by phrase — for him, internal proof that the structure was the teaching''s own.'
  - dive: gospel-translation
    id: gib-mud-and-silt
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/gospel-translation/extracts/v24_801_938_Kratkoe_izlozhenie_Evangelija_Predislovie.txt
    facsimile: null
    quoteRu: нашел незаконно соединенную с ним грязь и тину, которая одна заслоняла для меня его чистоту; рядом с высоким христианским учением я нашел связанное с ним чуждое ему безобразное учение еврейское и церковное.
    quoteEn: I found, illegitimately joined to it, mud and silt which alone obscured its purity for me; beside the lofty Christian teaching I found bound up with it an alien, ugly Jewish and ecclesiastical teaching. (working English)
    significance: 'The governing image of the whole enterprise: the pure spring of Christ''s teaching choked by the "mud and silt" of church accretion, which the translation sets out to clear away.'
  - dive: lords-prayer
    id: lp-C-surprise
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/gib_lords_prayer.txt
    facsimile: null
    quoteRu: Окончив свою работу, я к удивлению и радости своей нашел, что так называемая молитва господня есть не что иное, как в самой сжатой форме выраженное всё учение Иисуса в том самом порядке, в котором были расположены мною главы, и что каждое выражение молитвы соответствует смыслу и порядку глав.
    quoteEn: On finishing my work I found, to my surprise and joy, that the so-called Lord's Prayer is nothing other than the whole teaching of Jesus expressed in the most condensed form, in the very order in which I had arranged the chapters, and that each phrase of the prayer corresponds to the sense and order of the chapters. (working English)
    significance: 'Version C''s premise (Gospel in Brief preface): the prayer maps phrase-by-phrase onto Tolstoy''s twelve chapters — which he treats as internal proof that his structure was the teaching''s own. A rhetorical, not text-critical, claim (see scholarship: extends).'
  - dive: lords-prayer
    id: lp-C-table-close
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/gib_lords_prayer.txt
    facsimile: null
    quoteRu: А будет твоя власть, и сила, и разум.
    quoteEn: But there will be thy power, and strength, and reason. (working English) — Tolstoy's meaning for the doxology (phrase 12 of 12)
    significance: 'The signature substitution that closes the twelve-fold table: "kingdom and power and GLORY" becomes "power and strength and REASON (разум)." Glory → reason is the most concentrated statement of Tolstoy''s whole programme.'
  - dive: lords-prayer
    id: lp-C-table-open
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
