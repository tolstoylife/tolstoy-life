    pages: 209–215
    date: '1895-08-14'
    addressee: the foreign newspapers (open letter)
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: docs/research/doukhobors/extracts/v39_209_215_Pismo_v_inostrannye_gazety_po_povodu_gonenij_na_kavkazskih_duhoborov.txt
    facsimile: null
    quoteRu: 'С духоборцами случилось то, что обыкновенно случается с замыкающимися в самих себя и вследствие того процветающими религиозными общинами: материальное благосостояние их увеличивается, но религиозное сознание понижается.'
    quoteEn: 'What happened with the Doukhobors is what usually happens with religious communities that close in upon themselves and prosper as a result: their material well-being increases, but their religious consciousness declines. (working English)'
    significance: Tolstoy's own account of who the Doukhobors were and of the revival under Verigin that preceded the crisis. The opening of the foundational factual document of the whole affair.
