    localPdf: primary-sources/jubilee-edition/vol35/vol35.pdf
    extract: docs/research/fire-metaphor/extracts/v70_030_P_A_Bulanzhe.txt
    facsimile: null
    quoteRu: Огонь принес я на землю, сказал Христос, и он разгорается и в нас и в наших плотских и духовных детях; только бы нам тихо сгореть в нем, а что он зажигает других, это не может быть иначе.
    quoteEn: Fire I brought to the earth, said Christ, and it is blazing up both in us and in our children of flesh and of spirit; only let us quietly burn up in it — and that it sets others alight, this cannot be otherwise. (working English)
    significance: 'Luke 12:49 as a personal credo: the fire burns in us and our children; self-combustion is the only required act; the spread is guaranteed.'
  - dive: fire-metaphor
    id: letter-turchaninov-1904
    genre: letters
    teiId: null
    pssTom: 75
    pages: '90'
    date: '1904-04-15'
    addressee: A. I. Turchaninov
    localPdf: primary-sources/jubilee-edition/vol38/vol38.pdf
    extract: docs/research/fire-metaphor/extracts/v75_090_A_I_Turchaninovu.txt
    facsimile: null
    quoteRu: 'Наше дело только в том, чтобы в себе разжечь огонь: гореть самому, и тогда окружающие нас сами собой будут согреваться и зажигаться.'
    quoteEn: 'Our task is only to kindle the fire in ourselves: to burn oneself, and then those around us will of their own accord be warmed and set alight. (working English)'
    significance: 'The distilled late-period ethic: kindle the fire in yourself; warming and igniting others follows automatically — no missionary effort required.'
