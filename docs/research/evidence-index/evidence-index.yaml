    quoteRu: je crois tout de même que le Babisme comme doctrine morale et humanitaire a un grand avenir dans le monde oriental ayant beaucoup de rapports avec l’anarchisme chrétien et tôt ou tard doit s’unir à lui.
    quoteEn: '[Tolstoy''s French original] ...I still believe that Babism, as a moral and humanitarian doctrine, has a great future in the eastern world, having much in common with Christian anarchism (l''anarchisme chrétien) and sooner or later must unite with it. (working English)'
    significance: Tolstoy's own French original of the Sacy attestation (the letter is bilingual, French then his Russian). The phrase in his French hand is «l'anarchisme chrétien». 'quoteRu' here holds the French as it stands in the letter.
