  rolesByDive:
    christian-anarchism: Berlin legal scholar (1868–1928); his Der Anarchismus (1900) classified Tolstoy as one of seven principal anarchist thinkers. Addressee of the 1900 letter; his index is the evidence Tolstoy turns against the classification.
  evidenceCount: 3
  evidence:
  - dive: christian-anarchism
    id: v72_eltzbacher_praise_ru
    genre: letter
    teiId: null
    pssTom: 72
    pages: 424–426
    date: '1900-08-01'
    addressee: Paul Eltzbacher
    localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
    extract: docs/research/christian-anarchism/extracts/v72_341_PaulyuElcbaxeruPaulEltzhacher.txt
    facsimile: null
    quoteRu: 'Ваша книга делает для анархизма то, что 30 лет назад было сделано для социализма: вводит его в программу политических наук. Ваша книга мне чрезвычайно понравилась. Она совершенно объективна, понятна, и, насколько я могу судить, источники в ней отлично использованы.'
    quoteEn: 'Your book does for anarchism what was done thirty years ago for socialism: it brings it into the programme of the political sciences. Your book pleased me exceedingly. It is entirely objective, intelligible, and — so far as I can judge — the sources in it are excellently handled. (working English)'
    significance: The praise that sets up the refusal. Tolstoy genuinely admires Eltzbacher's Der Anarchismus (1900), which classified him as one of seven principal anarchist thinkers (with Godwin, Proudhon, Stirner, Bakunin, Kropotkin, Tucker) — making the qualified denial that follows all the sharper.
  - dive: christian-anarchism
    id: v72_eltzbacher_reject_de
    genre: letter
    teiId: null
    pssTom: 72
    pages: 424–426
    date: '1900-08-01'
    addressee: Paul Eltzbacher
    localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
    extract: docs/research/christian-anarchism/extracts/v72_341_PaulyuElcbaxeruPaulEltzhacher.txt
    facsimile: null
    quoteRu: 'Mir scheint nur, dass ich kein Anarchist bin im Sinne eines politischen Reformators. Im Register Ihres Buches beim Worte: «Zwang» sind verschiedene Seiten bei allen anderen angegeben, aber keine in meinen Schriften. Ist das nicht ein Beweis, dass die Lehre, die Sie mir zuschreiben, aber die eigentlich nur die Lehre Christi ist, keine politische aber eine religiöse Lehre ist?'
    quoteEn: '[Tolstoy''s German original of the same passage] It seems to me only that I am not an anarchist in the sense of a political reformer. In the register of your book under the word ''Zwang'' [coercion] various pages are given for all the others, but none in my writings. Is this not a proof that the teaching you ascribe to me, but which is really only the teaching of Christ, is not a political but a religious teaching? (working English)'
    significance: Tolstoy's own German original of the rejection (the letter is bilingual, German then his Russian). 'quoteRu' here holds the German as it stands in Tolstoy's hand. Note the German index word is «Zwang» (coercion); the Russian renders it «насилие» (violence).
