    quoteRu: он знал, что его учение — не учение, но искра, которая зажигает сознание Бога в сердцах людей и, раз загоревшись, не может потухнуть.
    quoteEn: he knew that his teaching was not a doctrine but a spark that kindles the consciousness of God in people's hearts and, once lit, cannot go out. (working English)
    significance: 'The interpretive heart: Christ''s fire = the inward, contagious, unquenchable spark of awakened God-consciousness. This is the reading that powers every later use of Luke 12:49 (the keystone sentence of the whole dive).'
