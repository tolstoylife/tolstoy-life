    facsimile: null
    quoteRu: Мы обязаны жизнью разумению, а не отдаем ему всю свою плотскую жизнь, и потому мы должники неоплатные.
    quoteEn: We owe our life to reason, yet do not give over to it our whole fleshly life, and so we are debtors who can never pay. (working English)
    significance: 'The metaphysics under the debt petition: разумение (reason/understanding) is the creditor — the same keyword the sibling fire-metaphor dive tracks (John 1 Logos → разумение).'
  - dive: lords-prayer
    id: lp-B-debts
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: И не взыскивай с нас всё, чем мы должны, потому что и мы не взыскиваем с тех, что нам должны. И не считайся с нами.
    quoteEn: And do not exact from us all that we owe, because we too do not exact from those who owe us. And do not reckon with us. (working English)
    significance: Version B's debt petition, recast as a plea not to be called to account — paired with Tolstoy's gloss that we are insolvent debtors to reason (lp-B-debtors-gloss).
  - dive: lords-prayer
    id: lp-B-render
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: 'И Иисус сказал им: когда молитесь, говорите: Отец! да будешь ты свят в нас, да объявится царство твое, т. е. да будет воля твоя; да сойдет в нас дух твой и очистит нас.'
    quoteEn: 'And Jesus said to them: when you pray, say: Father! mayest thou be holy in us, may thy kingdom be made manifest, that is, may thy will be done; may thy spirit descend into us and cleanse us. (working English)'
    significance: Version B — the transformed prayer in the "On Prayer" (Luke 11) chapter, the deepest rewriting. The kingdom petition is replaced by the descent of the spirit. See lp-B-variant-note for the text-critical pedigree.
  - dive: lords-prayer
    id: lp-B-variant-note
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: 'слова: да сойдет дух твой в нас и очистит нас встречаются в цитатах древних церковных писателей.'
    quoteEn: the words 'may thy spirit descend into us and cleanse us' are found in citations of ancient church writers. (working English)
    significance: Tolstoy's own footnote shows he knew the "spirit" reading was a genuine ancient variant, not his invention. Standard text-criticism CONFIRMS it (minuscules 700, 162; Marcion's Luke; Gregory of Nyssa) — see scholarship.triangulation lp-B-variant-note.
  - dive: lords-prayer
    id: lp-abolish-content
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: Вся молитва должна состоять в желании царства Божия и в исполнении его правил, а все правила в том, чтобы не считать никого виновным, а всех любить и прощать.
    quoteEn: 'The whole prayer must consist in the desire for God''s kingdom and in the fulfilment of its rules, and all the rules are: to hold no one guilty, but to love and forgive everyone. (working English)'
    significance: 'What "prayer" reduces to once the asking is removed: wanting the kingdom and forgiving everyone. The ethical core that the rewritten petitions all restate.'
  - dive: lords-prayer
    id: lp-abolish-question
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 7–798
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/harmony_lords_prayer.txt
    facsimile: null
    quoteRu: Как еще яснее сказать, что не нужно молиться?
    quoteEn: How could it be said more plainly that one must not pray? (working English)
    significance: 'The hinge of Tolstoy''s whole reading: the Lord''s Prayer is not a formula to repeat but Jesus''s refutation of petitionary prayer (grounded in Matt 6:7-8, the Father "knows what you need before you open your lips"). The model prayer, for Tolstoy, abolishes prayer-as-asking.'
