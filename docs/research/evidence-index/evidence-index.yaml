  rolesByDive:
    tolstoyanism: Slovak doctor and disciple; his 1897 question (how to act as Tolstoy's 'representative in Hungary') is the occasion of the keystone denial. Personal physician at Yasnaya Polyana from 1904; the only doctor at Tolstoy's deathbed (Astapovo, 1910); compiler of the Yasnopolianskie zapiski.
  evidenceCount: 1
  evidence:
  - dive: tolstoyanism
    id: v53_167_169_denial
    genre: diary
    teiId: null
    pssTom: 53
    pages: 167–169
    date: '1897-12-02'
    addressee: diary (recording a conversation with Dušan Makovický)
    localPdf: primary-sources/jubilee-edition/vol19/vol19.pdf
    extract: docs/research/tolstoyanism/extracts/v53_167_169_1897_12_02.txt
    facsimile: docs/research/tolstoyanism/extracts/pss-pages/tom53-1897-12-02-205.png
    quoteRu: Я рад был случаю сказать ему и уяснить себе, что говорить о толстовстве, искать моего руководительства, спрашивать моего решения вопросов — большая и грубая ошибка. — Никакого толстовства и моего учения не было и нет, есть одно вечное, всеобщее, всемирное учение истины, для меня, для нас особенно ясно выраженное в евангелиях.
    quoteEn: I was glad of the chance to tell him, and to clarify for myself, that to speak of Tolstoyism, to seek my guidance, to ask me to decide questions — is a great and crude error. There was and is no Tolstoyism and no teaching of mine; there is one eternal, universal, world-wide teaching of truth, which for me, for us, is especially clearly expressed in the Gospels. (working English)
    significance: 'THE KEYSTONE. The plainest disavowal of the label in the whole corpus, set down the evening of the conversation with the Slovak disciple Makovický (who in 1910 would be the physician at Tolstoy''s deathbed). The «уяснить себе» — ''to clarify for myself'' — is load-bearing: the exchange was only the occasion; the denial is a private formulation he gives himself. Page facsimile rendered from the local PD PSS PDF. (Reused from the legacy combined dive; re-confirmed body-voice here.)'
