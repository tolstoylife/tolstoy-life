  rolesByDive:
    crisis: the event this dive is about; candidate concept page — should foreground Tolstoy's own vocabulary (переворот / остановка жизни) over the received 'crisis' label
  evidenceCount: 3
  evidence:
  - dive: crisis
    id: vchem_moya_vera_opening
    genre: work
    teiId: v23_304_465_V_chem_moja_vera
    pssTom: 23
    pages: '304'
    date: '1884'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/crisis/extracts/v23_304_465_V_chem_moja_vera.txt
    facsimile: null
    quoteRu: Пять лет тому назад я поверил в учение Христа — и жизнь моя вдруг переменилась […] Со мной случилось то, что случается с человеком, который вышел за делом и вдруг дорогой решил, что дело это ему совсем не нужно,— и повернул домой.
    quoteEn: Five years ago I came to believe in Christ's teaching — and my life suddenly changed […] What happened to me was what happens to a man who goes out on some errand and then suddenly decides on the way that the errand is of no use to him at all — and turns back home. (working English)
    significance: 'The companion account, told as the turn toward faith. The word is "переменилась" (changed), not "кризис". Note the tension with A Confession: here the change is "вдруг" (sudden), there it "had long been preparing" — two framings, neither a "crisis".'
  - dive: crisis
    id: ispoved_p40_perevorot
    genre: work
    teiId: v23_001_059_Ispoved
    pssTom: 23
    pages: '40'
    date: '1882'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/crisis/extracts/v23_001_059_Ispoved.txt
    facsimile: docs/research/crisis/extracts/pss-tom23-page-040-perevorot.png
    quoteRu: Я жил так года два, и со мной случился переворот, который давно готовился во мне и задатки которого всегда были во мне. Со мной случилось то, что жизнь нашего круга — богатых, ученых — не только опротивела мне, но потеряла всякий смысл.
    quoteEn: I lived like that for a couple of years, and there occurred in me an upheaval [переворот] that had long been preparing within me, and whose seeds had always been in me. What happened to me was that the life of our circle — the rich, the learned — not only grew repugnant to me, but lost all meaning. (working English)
    significance: The keystone. In the work where Tolstoy narrates the transformation, the word is "переворот" (upheaval), never "кризис"; and he denies a sudden rupture — it "had long been preparing" and "its seeds had always been in me". Verified verbatim against PSS Tom 23 p.40 (vol83, phys p.78).
  - dive: crisis
    id: ispoved_p46_undatable
    genre: work
    teiId: v23_001_059_Ispoved
    pssTom: 23
    pages: '46'
    date: '1882'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/crisis/extracts/v23_001_059_Ispoved.txt
    facsimile: null
    quoteRu: И я спасся от самоубийства. Когда и как совершился во мне этот переворот, я не мог бы сказать. […] так же постепенно, незаметно возвратилась ко мне эта сила жизни. И странно, что та сила жизни, которая возвратилась ко мне, была не новая, а самая старая, — та самая, которая влекла меня на первых порах моей жизни.
    quoteEn: And I was saved from suicide. When and how this upheaval [переворот] took place in me, I could not say. […] just as gradually, imperceptibly, the force of life returned to me. And it is strange that the force of life which returned to me was not a new one, but the very oldest — the same that had drawn me in the first days of my life. (working English)
    significance: The transformation stated as explicitly un-datable ("when and how … I could not say") and as a return to something old rather than the arrival of something new — the strongest textual counter to reading it as a dated "crisis".
  visuals: []
