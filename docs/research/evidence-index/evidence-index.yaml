    facsimile: null
    quoteRu: То, что я отрекся от церкви, называющей себя православной, это совершенно справедливо. Но отрекся я от нее не потому, что я восстал на господа, а напротив, только потому, что всеми силами души желал служить ему.
    quoteEn: That I have renounced the church that calls itself Orthodox is perfectly true. But I renounced it not because I rose up against the Lord, but, on the contrary, only because with all the strength of my soul I wished to serve him. (working English)
    significance: 'The public capstone — his reply to the Synod''s excommunication: renunciation of the church is framed as fidelity to God, the institutional bond severed in the name of the thing the institution claims.'
