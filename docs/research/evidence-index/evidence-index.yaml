    quoteEn: 9) Φῶς — light — in all contexts means the true reason/understanding of life. (working English)
    significance: The programmatic hermeneutic key. In a translator's footnote to John 1, Tolstoy declares that "light" everywhere in the Gospel = "the true understanding of life" (разумение) — not the divine person nor supernatural radiance. Every light-rendering below follows from this rule.
