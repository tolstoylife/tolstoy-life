    extract: docs/research/fire-metaphor/extracts/v24_007_798_Soedinenie_i_perevod_chetyreh_evangelij.txt
    facsimile: null
    quoteRu: 'Он говорил: очищаю вас водой, но после меня тот, кто сильнее меня, очистит вас духом. Когда он придет, он очистит вас, как хозяин очищает гумно свое: пшеницу соберет, а мякину сожжет.'
    quoteEn: 'He said: I cleanse you with water, but after me the one stronger than me will cleanse you with spirit. When he comes, he will cleanse you as a master cleanses his threshing-floor: the wheat he will gather, and the chaff he will burn up. (working English)'
    significance: Matthew 3:11-12. Where the standard text reads "he will baptize you with the Holy Spirit and fire" and burn the chaff "with unquenchable fire," Tolstoy drops "Holy," turns baptism-by-fire into "cleansing by spirit," and excises "неугасимым" (unquenchable) from the chaff-burning. Fire of judgment → inner purification.
