    addressee: L. F. Annenkova
    localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
    extract: docs/research/crisis/extracts/v67_214_L_F_Annenkovoj.txt
    facsimile: null
    quoteRu: …я, к счастию, этого отчаяния никогда не знал с тех пор, как родился вновь […] то каждый, проходя эти возрасты, эти кризисы, не будет пугаться, а будет ждать следующего состояния, будет знать, что то же было и с другими.
    quoteEn: …I, fortunately, have never known this despair since I was born anew… so that everyone, passing through these ages, these crises, would not take fright, but would wait for the next state, knowing that the same was so for others. (working English)
    significance: 'The other clean body-text "кризис": plural ("эти кризисы"), one of the universal "spiritual ages" everyone passes through — the opposite of a single great crisis. In the same breath Tolstoy describes his own change as "родился вновь" (born anew), not a crisis.'
  - dive: crisis
    id: v67_083_H_N_Straxovu
    genre: letter
    teiId: v67_083_H_N_Straxovu
    pssTom: 67
    pages: '84'
    date: '1894-03-16'
    addressee: N. N. Strakhov
    localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
    extract: docs/research/crisis/extracts/v67_083_H_N_Straxovu.txt
    facsimile: null
    quoteRu: Вы знаете, что Марья Петровна Фет при смерти — крупозное воспаление легких. До сих пор нет кризиса, и шансов смерти, говорят, больше, чем жизни.
    quoteEn: You know that Marya Petrovna Fet is dying — lobar pneumonia. So far there is no crisis, and the chances of death, they say, are greater than of life. (working English)
    significance: Tolstoy's own use of "кризис" in body text — the *medical* sense, the turning-point of a pneumonia. Evidence that for him the word is clinical, not a term for spiritual transformation.
  - dive: doukhobors
    id: v31_097_101_state_weapons
    genre: works
    teiId: null
    pssTom: 31
    pages: 97–101
    date: '1898-08-15'
    addressee: article «Две войны» (Two Wars)
    localPdf: null
    extract: docs/research/doukhobors/extracts/v31_097_101_Dve_vojny.txt
    facsimile: null
    quoteRu: 'Русское государство выставило против духоборов все те орудия, которыми оно может бороться. Орудия эти: полицейские меры арестов, непозволения выезда из места жительства, запрещение общения друг с другом, перехватывание писем, шпионство, запрещение печатания в газетах сведений о всем, касающемся духоборов, клевета на них, печатаемая в журналах, подкупы, сечения, тюрьмы, ссылки, разорение семей.'
    quoteEn: 'The Russian state brought against the Doukhobors every weapon it can fight with. These weapons are: police measures of arrest, prohibition of travel from one''s place of residence, the banning of communication with one another, the interception of letters, espionage, the suppression of newspaper reports of anything touching the Doukhobors, slander printed against them in the journals, bribery, floggings, prisons, exiles, the ruin of families. (working English)'
    significance: AUTHORITIES THREAD. Tolstoy's own catalogue of the instruments of state repression — the single most concentrated primary inventory of how the authorities handled the affair.
  - dive: doukhobors
    id: v39_209_215_burning_of_arms
    genre: works
    teiId: null
    pssTom: 39
    pages: 209–215
    date: '1895-08-14'
    addressee: the foreign newspapers (open letter)
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: docs/research/doukhobors/extracts/v39_209_215_Pismo_v_inostrannye_gazety_po_povodu_gonenij_na_kavkazskih_duhoborov.txt
    facsimile: docs/research/doukhobors/extracts/v39_209_215_p209_facsimile.png
    quoteRu: После этого, 28 июня 1895 года, духоборцы, живущие в Ахалкалакском уезде Тифлисской губернии, снесли в одну кучу в поле, около села Спасского, всё свое имевшееся у них оружие и, обложив его дровами и углем и облив керосином, сожгли
    quoteEn: After this, on 28 June 1895, the Doukhobors living in the Akhalkalaki district of the Tiflis province carried all the weapons they had into a single heap in a field near the village of Spasskoye and, having piled wood and coal upon them and doused them with kerosene, burned them. (working English)
    significance: THE KEYSTONE CITATION. The Burning of Arms — the coordinated mass renunciation of weapons that began the whole affair. Page facsimile rendered from the local PSS PDF.
  - dive: doukhobors
    id: v71_081_three_ways_of_the_state
    genre: letter
    teiId: null
    pssTom: 71
    pages: 322–327
    date: '1898-03-19'
    addressee: the foreign newspapers (letter 81)
    localPdf: primary-sources/jubilee-edition/vol53/vol53.pdf
    extract: docs/research/doukhobors/extracts/v71_081_Vinostrannyegazety.txt
    facsimile: null
    quoteRu: Но нынешнее русское правительство употребило против духоборов еще третий, казалось бы оставленный в наше время, выход из этого противоречия. Оно, кроме того, что подвергает самым тяжелым страданиям самих отказывающихся, заставляет еще систематически страдать отцов, матерей, детей отказывающихся, вероятно с тем, чтобы пытками этих невинных семей поколебать решимость несогласных их членов.
    quoteEn: But the present Russian government has used against the Doukhobors a third way out of this contradiction, one seemingly abandoned in our time. Besides subjecting the refusers themselves to the heaviest sufferings, it forces the fathers, mothers, and children of the refusers to suffer systematically as well — probably so as to shake the resolve of the dissenting members by the torture of these innocent families. (working English)
    significance: 'AUTHORITIES THREAD. The analytic heart of the state-handling case: Tolstoy contrasts the Mennonite (alternative service) and Austrian-Nazarene (imprisonment) solutions with Russia''s choice to punish the families. The 1898 advocacy letter that opened the emigration appeal to the West.'
  - dive: tolstoy-in-photographs
    id: v57_141_142_1909_09_17
    genre: diary
    teiId: null
    pssTom: 57
    pages: 141–142
    date: '1909-09-17'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol57/vol57.pdf
    extract: docs/research/tolstoy-in-photographs/extracts/v57_141_142_1909_09_17.txt
    facsimile: null
    quoteRu: Неприятно и то, что вызывает сознание себя не божественного, а пакостного Льва Николаевича.
    quoteEn: Unpleasant, too, in that it arouses the consciousness of oneself as not the divine but the vile Lev Nikolaevich. (working English)
    significance: 'The dive''s most powerful behaviour quote: meeting a photographer and a cinematograph operator makes Tolstoy feel like "the vile Lev Nikolaevich". The corpus supplies the subjective vocabulary that scholarship records only behaviourally.'
  - dive: tolstoy-in-photographs
    id: v61_444_M_N_Tolstoj
    genre: letter
    teiId: null
    pssTom: 61
    pages: 372–374
    date: '1856-04-14'
    addressee: M. N. Tolstaya (sister)
    localPdf: primary-sources/jubilee-edition/vol61/vol61.pdf
    extract: docs/research/tolstoy-in-photographs/extracts/v61_444_M_N_Tolstoj.txt
    facsimile: null
    quoteRu: по моему предложению, все литераторы сделали фотографическую группу
    quoteEn: at my proposal, all the literary men had a photographic group made (working English)
    significance: Tolstoy states HE proposed the famous 1856 St-Petersburg group photograph of the Sovremennik writers (Turgenev, Grigorovich, Druzhinin, Goncharov, Ostrovsky and himself), and promises to send his sister a copy. The earliest photographic event in the corpus, and a corpus-grounded correction to popular sources that credit the idea to Sofia (married only 1862). Photographer was S. L. Levitsky.
  - dive: tolstoy-in-photographs
    id: v78_213_V_A_Molochnikovu
    genre: letter
    teiId: null
    pssTom: 78
    pages: '191'
    date: '1908-07-23'
    addressee: V. A. Molochnikov
    localPdf: primary-sources/jubilee-edition/vol78/vol78.pdf
    extract: docs/research/tolstoy-in-photographs/extracts/v78_213_V_A_Molochnikovu.txt
    facsimile: null
    quoteRu: Не прислал до сих пор карточки потому, что забыл, а забыл потому, что не могу приписать этому значения
    quoteEn: I have not sent the card until now because I forgot, and I forgot because I cannot attach any importance to it (working English)
    significance: The clearest single statement of Tolstoy's indifference to his own photographic image, dated to his 80th-jubilee year. A keystone behaviour quote.
  - dive: tolstoyanism
    id: v53_167_169_denial
    genre: diary
    teiId: null
    pssTom: 53
    pages: 167–169
    date: '1897-12-02'
    addressee: diary (recording a conversation with Dušan Makovický)
    localPdf: primary-sources/jubilee-edition/vol19/vol19.pdf
    extract: docs/research/tolstoyanism/extracts/v53_167_169_1897_12_02.txt
    facsimile: docs/research/tolstoyanism/extracts/pss-pages/tom53-1897-12-02-205.png
    quoteRu: Я рад был случаю сказать ему и уяснить себе, что говорить о толстовстве, искать моего руководительства, спрашивать моего решения вопросов — большая и грубая ошибка. — Никакого толстовства и моего учения не было и нет, есть одно вечное, всеобщее, всемирное учение истины, для меня, для нас особенно ясно выраженное в евангелиях.
    quoteEn: I was glad of the chance to tell him, and to clarify for myself, that to speak of Tolstoyism, to seek my guidance, to ask me to decide questions — is a great and crude error. There was and is no Tolstoyism and no teaching of mine; there is one eternal, universal, world-wide teaching of truth, which for me, for us, is especially clearly expressed in the Gospels. (working English)
    significance: 'THE KEYSTONE. The plainest disavowal of the label in the whole corpus, set down the evening of the conversation with the Slovak disciple Makovický (who in 1910 would be the physician at Tolstoy''s deathbed). The «уяснить себе» — ''to clarify for myself'' — is load-bearing: the exchange was only the occasion; the denial is a private formulation he gives himself. Page facsimile rendered from the local PD PSS PDF. (Reused from the legacy combined dive; re-confirmed body-voice here.)'
  - dive: tolstoyanism
    id: v67_231_movement_disowned
    genre: letter
    teiId: null
    pssTom: 67
    pages: 225–227
    date: '1894-09-22'
    addressee: V. N. Mac-Gahan (Varvara Nikolaevna Mac-Gahan)
    localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
    extract: docs/research/tolstoyanism/extracts/v67_231_V_N_Mak_Gaxan.txt
    facsimile: null
    quoteRu: Вы вот пишете о «толстовцах» и других моих последователях, о движении, поднятом моей проповедью, и о том, почему толстовцы проявляют мало рвения к пропаганде мыслей, которые осчастливят человечество; а я не знаю не только каких-либо других последователей, но и толстовцев
    quoteEn: You write about 'the Tolstoyans' and my other followers, about the movement raised by my preaching, and about why the Tolstoyans show so little zeal in propagating the ideas that would make mankind happy; but I know of no other followers, nor of any Tolstoyans. (working English)
    significance: NEW (not in the legacy combined dive) — and the fullest disowning of the MOVEMENT, not just the label. Replying to a journalist who wrote of 'the Tolstoyans' and 'the movement raised by my preaching,' Tolstoy denies knowing any such followers or movement at all. The earliest of the four (1894).
  - dive: tolstoyanism
    id: v80_068_some_tolstoyans
    genre: letter
    teiId: null
    pssTom: 80
    pages: 50–53
    date: '1909-08-04'
    addressee: I. Ivanov
    localPdf: primary-sources/jubilee-edition/vol57/vol57.pdf
    extract: docs/research/tolstoyanism/extracts/v80_068_I_Ivanovu.txt
    facsimile: null
    quoteRu: православные не любят толстовцев, а толстовцы не любят православных. В этом вы, я думаю, ошибаетесь, во-первых, в том, что признаете каких-то толстовцев. Что же до меня касается, то хотя я и сам Толстой
    quoteEn: '[you say that] the Orthodox do not love the Tolstoyans, and the Tolstoyans do not love the Orthodox. In this, I think, you are mistaken — first of all, in that you acknowledge some sort of Tolstoyans. As for myself, though I am Tolstoy myself… (working English)'
    significance: 'NEW (not in the legacy combined dive) — the wry late note (1909). Against a correspondent''s premise that ''the Orthodox dislike the Tolstoyans and the Tolstoyans the Orthodox,'' Tolstoy faults the very premise: that one ''acknowledges some sort of Tolstoyans (каких-то толстовцев)'' at all — capped by the pun «хотя я и сам Толстой» (''though I myself am a Tolstoy / Tolstoyan'').'
