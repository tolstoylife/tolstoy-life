    extract: docs/research/doukhobors/extracts/v39_192_196_Posleslovie_k_vozzvaniju_Pomogite.txt
    facsimile: null
    quoteRu: Среди духоборов, или, скорее, христианского всемирного братства, как они теперь называют себя, происходит ведь не что-нибудь новое, а только произрастание того семени, которое посеяно Христом 1800 лет тому назад, — воскресение самого Христа.
    quoteEn: 'Among the Doukhobors — or rather the universal Christian brotherhood, as they now call themselves — what is taking place is nothing new, but only the sprouting of that seed which was sown by Christ 1,800 years ago: the resurrection of Christ himself. (working English)'
    significance: The most exalted of all his Doukhobor statements. The afterword to the appeal «Help!», co-signed by Chertkov, Biryukov and Tregubov, who were exiled for it.
  - dive: doukhobors
    id: v39_209_215_origins
    genre: works
    teiId: null
