    quoteRu: Ни молиться, ни поститься не нужно. Молиться не нужно потому, что отец знает всё, что людям нужно.
    quoteEn: Neither to pray nor to fast is needed. To pray is not needed, because the Father knows everything that people need. (working English)
    significance: The condensed redaction states the anti-petitionary reading flatly in the chapter on the kingdom. The same point the French Abrégé makes (lp-D-abrege).
