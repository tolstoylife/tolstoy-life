    date: '1910'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol13/vol13.pdf
    extract: docs/research/fire-metaphor/extracts/v45_013_496_Put_zhizni.txt
    facsimile: null
    quoteRu: '«Огонь пришел я низвесть на землю: и как желал бы, чтобы он уже возгорелся» (Луки XII, 49). Но почему же огонь этот так медленно разгорается?'
    quoteEn: '"Fire I came to cast upon the earth: and how I would wish that it were already kindled" (Luke XII, 49). But why does this fire blaze up so slowly? (working English)'
    significance: 'Path of Life (1910, his last book). The keystone returns one final time — now as a question: why does the fire spread so slowly? His answer: only the inner effort of each person kindles it, not external reform. The metaphor frames his final testament.'
  - dive: fire-metaphor
    id: letter-annenkova-1889
    genre: letters
    teiId: null
    pssTom: 64
    pages: '387'
    date: '1889-06-18'
    addressee: L. F. Annenkova
    localPdf: primary-sources/jubilee-edition/vol30/vol30.pdf
    extract: docs/research/fire-metaphor/extracts/v64_387_L_F_Annenkovoj.txt
    facsimile: null
    quoteRu: Мир зажжен Христом и горит. Если каждый из нас сознает то, что он горит, не препятствует, а радуется и содействует своему горению, то это всё, что нужно.
    quoteEn: The world is set alight by Christ and is burning. If each of us is conscious that he is burning, does not hinder it, but rejoices and assists his own burning, then that is all that is needed. (working English)
    significance: '"The world is set alight by Christ and burns." The duty-ethic at its clearest: the only task is conscious self-burning; one''s neighbour ignites of himself.'
  - dive: fire-metaphor
    id: letter-wilson-1889
    genre: letters
    teiId: null
    pssTom: 64
    pages: '391'
    date: '1889-06-22'
    addressee: L. G. Wilson
    localPdf: primary-sources/jubilee-edition/vol30/vol30.pdf
    extract: docs/research/fire-metaphor/extracts/v64_391_L_ZH_Vilsonu_L_G_Wilson.txt
    facsimile: null
    quoteRu: Я думаю, что время это пришло, и что мир уже горит, и дело наше только в том, чтоб гореть и, по возможности, соединяться с другими горящими точками, и это я намерен делать весь остаток моей жизни.
    quoteEn: I think that this time has come, and that the world is already burning, and that our task is only to burn and, as far as possible, to unite with other burning points — and this I intend to do for the whole remainder of my life. (working English)
    significance: To an American Quaker, immediately after quoting Luke 12:49. "Burning points" (горящие точки) is his image for kindred souls; the metaphor as personal vocation for life.
  - dive: fire-metaphor
    id: letter-bulanzhe-1897
