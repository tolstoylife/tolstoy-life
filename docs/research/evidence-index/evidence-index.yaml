    facsimile: null
    quoteRu: Человек — сын Бога.
    quoteEn: Man is the son of God. (working English) — Tolstoy's meaning for "Отче наш" (phrase 1 of 12)
    significance: 'The opening of the twelve-fold correspondence (Version C-table): "Отче наш" → "Man is the son of God," the title of chapter I. The full table is in index.md.'
  - dive: lords-prayer
    id: lp-Cbody-prayer
    genre: gospel-harmony
    teiId: null
    pssTom: 24
    pages: 801–938
    date: '1881'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: docs/research/lords-prayer/extracts/gib_lords_prayer.txt
    facsimile: null
    quoteRu: 'Молитесь только так: Отец наш безначальный и бесконечный, как небо! Пусть будет свято только твое существо. Пусть будет власть только твоя, так, чтобы воля твоя совершалась безначально и бесконечно на земле. Дай мне пищу жизни в настоящем. Ошибки мои прежние загладь и сотри так же, как и я заглаживаю и стираю все ошибки братьев моих, чтобы я не попал в соблазн, избавился от зла. Потому что твоя власть и сила и твое решение.'
    quoteEn: 'Pray only thus: Our Father, without beginning and without end, like the sky! May thy being alone be holy. May power alone be thine, so that thy will be done, without beginning and without end, on earth. Give me the food of life in the present. My former mistakes, efface and wipe them out, just as I efface and wipe out all the mistakes of my brothers, so that I may not fall into temptation, and may be delivered from evil. Because thine is the power and the strength and thine the decision. (working English)'
    significance: 'Version C-body — the recitable prayer in the body of the Gospel in Brief, the single form that most reads like a prayer one could say. It is the base text for "Tolstojs Fader vår" (the Swedish rendering). Note the close: "глава/glory" → "решение/decision" (Crowell 1896 English: "judgment").'
