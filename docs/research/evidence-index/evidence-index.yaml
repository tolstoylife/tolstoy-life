    facsimile: null
    quoteRu: «Огонь принес я на землю, — сказал Христос, — и как томлюсь, когда он возгорится».
    quoteEn: '"Fire I brought to the earth," said Christ, "and how I am in anguish for it to blaze up." (working English)'
