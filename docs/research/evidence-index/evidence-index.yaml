    quoteRu: Есть перерождение, через которое я должен пройти, и я томлюсь, пока оно не совершится.
    quoteEn: There is a rebirth through which I must pass, and I am in anguish until it is accomplished. (working English)
    significance: 'Luke 12:50. The "baptism" linked to the fire of v.49 (in the standard text: "I have a baptism to be baptized with") is rendered as "перерождение" — inner rebirth/regeneration. Fire and baptism alike become inward transformation.'
