    quoteRu: И потому христианином нельзя быть так же, как можно быть евреем, магометанином, церковником. Нельзя сказать про себя или про другого, что я или он христианин, потому что нет таких поступков, которыми бы я себя отличил от других как христианин. Еврей обрезался, соблюл субботу, магометанин помолился 5 раз, отдал десятину бедным, церковник окрестился, поговел; но христианину нечего такого сделать.
    quoteEn: And so one cannot BE a Christian the way one can be a Jew, a Mohammedan, a churchman. One cannot say of oneself or of another that I or he is a Christian, because there are no acts by which I might mark myself off from others as a Christian. (working English)
    significance: 'The conceptual core of Tolstoy''s refusal of the label: Christianity, unlike confessional identities marked by defining acts (circumcision, prayer, baptism), is an ideal/direction, not a status one can claim.'
  - dive: christian
    id: khilkov_1890_soul_christian
    genre: letter
    teiId: null
    pssTom: 65
    pages: 76–78
    date: '1890-04-09'
    addressee: D. A. Khilkov
    localPdf: null
    extract: docs/research/christian/extracts/v65_064_D_A_Xilkovu.txt
    facsimile: null
    quoteRu: Но и тут нельзя про себя сказать, что я христианин больше, чем не христианин, — татарин, поп и т. п. Как сказал какой-то писатель, «душа человека христианка».
    quoteEn: But even here one cannot say of oneself that I am more a Christian than a non-Christian — a Tatar, a priest, and so on. As some writer said, 'the soul of man is a Christian.' (working English)
    significance: Tolstoy will not rank himself as 'a Christian' over others; he relocates Christianity to a universal disposition of the soul rather than a possessed identity.
