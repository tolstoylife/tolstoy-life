    quoteRu: в человеке живет божественный свет, сошедший с неба, и свет этот есть разум, — и что ему одному надо служить и в нем одном искать благо.
    quoteEn: in man there lives a divine light, come down from heaven, and this light is reason — and that it alone must be served and in it alone must good be sought. (working English)
    significance: 'The doctrinal statement of the equation, in plain prose: the divine light in man "is reason" (разум). Tolstoy then aligns it with the Brahmins, the Hebrew prophets, Confucius, Socrates — universalizing and de-supernaturalizing the Gospel "light."'
  - dive: fire-metaphor
    id: vera-world-burning
    genre: works
    teiId: null
    pssTom: 23
    pages: 304–465
    date: '1884'
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol83/vol83.pdf
    extract: docs/research/fire-metaphor/extracts/v23_304_465_V_chem_moja_vera.txt
    facsimile: null
    quoteRu: 'Но мир горит уж 1800 лет, горит с тех пор, как Христос сказал: я огонь низвел на землю; и как томлюсь, пока он не разгорится, — и будет гореть, пока не спасутся люди.'
    quoteEn: 'But the world has been burning for 1800 years now, burning ever since Christ said: I brought fire down to the earth; and how I am in anguish until it blazes up — and it will burn until people are saved. (working English)'
    significance: Luke 12:49 read as a slow, centuries-long historical fire of Christ's teaching working toward humanity's salvation — not a fire of judgment. The metaphor as philosophy of history.
