  rolesByDive:
    1879-1882-a-confession: Wife; copyist of several manuscripts; diarist of the crisis; sought to publish the work in her collected editions (1885, 1911).
    biryukov-sofia-relationship: Dedicatee of Vol II; archive-keeper; vetoed the Arsenyeva letters; seized the 1910 diary. (Vault file spells the name 'Sophia Tolstaya'.)
    copyright-renunciation: opposed the 1891 renunciation; redacted 19 lines of the 22 July 1891 diary entry
    gospel-translation: Tolstoy's wife; her diaries are the primary witness to the work's domestic strain. The dive's evidence COMPLICATES the 'domestic-tragedy' frame (she names the cause yet accepts it as God's will)
    tolstoy-in-photographs: prolific domestic photographer (~1,000 photos from late 1880s); destroyed the Dec-1894 negatives
