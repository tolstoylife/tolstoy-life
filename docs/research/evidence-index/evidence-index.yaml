    quoteRu: 'Христос, тогда еще, в свое время томился ожиданием и говорил: «Огонь пришел низвесть я на землю, и как желал бы, чтобы он возгорелся». (Лука XII, 49.)'
    quoteEn: 'Christ, even then, in his time, was in anguish of expectation and said: "Fire I came to cast upon the earth, and how I would wish that it were kindled." (Luke XII, 49.) (working English)'
