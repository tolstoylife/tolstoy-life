    significance: >-
      Notebook No. 3, mid-June 1908 (the dateline «[16 Іюня]» follows). First-hand evidence of the
      chapter-level restructuring in June, under the final title (cf. the editorial history's account
      of demoting ch. III to an appendix at this very time).
    facsimile: null

  # ===== C. THE PEOPLE AROUND THE WORK (1908 letters, Toms 78 & 89) ================

  - id: zakon-chertkov-finished
    genre: letters
    pssTom: 89
    pages: null
    date: 1908-05-01
    addressee: V. G. Chertkov
    localPdf: primary-sources/jubilee-edition/vol59/vol59.pdf
    extract: extracts/v89_806_maya1.txt
    quoteRu: >-
      взялся за другое, пока жив.
    quoteEn: >-
      [I have finished the article and] taken up something else, while I am still alive. (working English)
    significance: >-
      To V. G. Chertkov, 1 May 1908 — the editorial history cites the full line «Статью кончил и взялся
      за другое, пока жив» (т. 89; here quoted from the clean span around the footnote markers). "While I
      am still alive" (пока жив) is the keynote of the whole 80th-year project: a dying man's last
      statement. The publication ran through Chertkov's press abroad.
    facsimile: null

  - id: zakon-chertkov-biryukov
    genre: letters
    pssTom: 89
    pages: null
    date: 1908-04-02
    addressee: V. G. Chertkov
    localPdf: primary-sources/jubilee-edition/vol59/vol59.pdf
    extract: extracts/v89_805_aprelya2.txt
    quoteRu: >-
      Он мне сделал много хороших замечаний, и я воспользовался
    quoteEn: >-
      He made me many good remarks, and I made use of them. (working English)
    significance: >-
      To V. G. Chertkov, 2 April 1908. Tolstoy had P. I. Biryukov ("Posha") read the draft for whether
      it said anything new; he used Biryukov's remarks. Same letter: the work "pleases me less" — the
      oscillation of self-assessment continues.
