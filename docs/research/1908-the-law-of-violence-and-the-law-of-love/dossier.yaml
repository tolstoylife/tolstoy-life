  # ===== D. TEXTUAL HISTORY, TITLE SAGA & PUBLICATION (editorial commentary) =======
  # Serebrovskaya's "История писания и печатания" (PSS Tom 37). SECONDARY — attributed.
  # It quotes Tolstoy's diaries and Gusev's diary verbatim; those quotes are primary-within-secondary.

  - id: zakon-gusev-chepukha
    genre: comments
    pssTom: 37
    pages: "436–438"
    date: 1908-02-23
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
