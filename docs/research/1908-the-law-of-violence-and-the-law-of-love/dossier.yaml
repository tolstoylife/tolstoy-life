    quoteRu: >-
      Всякое насилие состоит в том, что одни люди под угрозой страданий или смерти заставляют других людей делать то, чего нехотят насилуемые.
    quoteEn: >-
      All violence consists in this: that some men, under threat of suffering or death, compel other men to do what those subjected to violence do not want. (working English)
    significance: >-
      Chapter III. The definition that grounds the whole political critique — violence only holds
      while the coerced are weaker, so it divides rather than unites.
    facsimile: null

