contradictions:
  - claim: "The fire-metaphor dive's dossier carries «но истина христианства, как огонь в сухом дереве…» as a quote from this work (id zakon-dry-wood there), without flagging its source."
    correction: >-
      In the treatise the sentence is an EPIGRAPH attributed to «Сольтер» (Salter), placed by Tolstoy
      at the head of BOTH chapters VI and X (verbatim at lines 173 and 399 of the extract) — a quotation
      Tolstoy selected and repeated, not his own running prose. The "cold fire / hot ice" image
      (zakon-cold-fire) IS Tolstoy's own. Cross-reference for the fire-metaphor dive; not edited there.
    evidenceRef: zakon-dry-wood

