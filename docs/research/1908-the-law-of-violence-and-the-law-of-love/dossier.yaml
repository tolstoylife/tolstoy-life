    quoteEn: >-
      Now I am going to finish my nonsense. (working English)
    significance: >-
      N. N. Gusev's diary, 23 February 1908, quoted in Serebrovskaya's editorial history. Tolstoy
      repeatedly called the work-in-progress «чепуха» (nonsense) — and annotated a cover «даже и этой
      чепухе» ("even to this nonsense"). NOT a Tolstoy autograph: it is Gusev reporting Tolstoy's speech,
      via the editorial apparatus (see needsReview). The struggle is real but the wording is Gusev's.
    facsimile: null

