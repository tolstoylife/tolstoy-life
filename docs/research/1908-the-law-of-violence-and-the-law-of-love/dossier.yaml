notCovered:
  - "The full epigraph apparatus: each numbered chapter opens with quoted epigraphs (Amiel, Pascal, Lichtenberg, Mazzini, Channing, Ruskin, Kant, Herzen, La Boétie, Salter/Сольтер, Henry George, and others) before Tolstoy's prose. The dive maps their function, not each source."
  - "A page-by-page collation of the censored «Киевские вести» text (preface + chs I–VII) against the complete «Свободное слово» edition — i.e. exactly which passages the censor cut."
  - "The spun-off «Номер газеты» (1909, Tom 38) and the absorbed «Христианство и воинская повинность» (the 1906 article that became ch. XIII) read as full texts in their own right."
  - "The Krug Chtenija cognate «Закон насилия и закон любви» («Бука», Tom 41) read as a separate weekly reading — cross-referenced only (zakon-krug-cognate)."
  - "The non-English translation lineage (the work's foreign editions beyond the Free Age Press Russian text)."

needsReview:
  - item: "12 May diary verb form. The primary diary reads «и мне понравилось» (neuter); the handoff brief had «мне понравилась». The completion clause «и я кончил ее» is verbatim. Use the primary form."
    phase: 2
    why: "Brief-vs-primary discrepancy; the dive follows the primary text."
  - item: "«чепуха» is NOT a Tolstoy autograph. The 21/23 Feb «чепуха»/«даже и этой чепухе» lines are from N. N. Gusev's diary, quoted inside Serebrovskaya's editorial history; Tolstoy's own diary for 21–23 Feb does not mention the article. Attribute to Gusev-via-apparatus, never as Tolstoy's own pen."
    phase: 2
    why: "Attribution accuracy on the work's most quotable self-deprecation."
  - item: "The «огонь в сухом дереве» (dry wood) fire image is a Salter («Сольтер») epigraph Tolstoy placed at the head of chs VI and X, not his own prose. The fire-metaphor dive used it as the work's without this flag. The cold-fire image IS Tolstoy's own."
    phase: 2
    why: "Cross-dive attribution correction; the byte-string is verbatim either way, but provenance differs. Tentative full identification: William Mackintire Salter (1853–1931), American ethical-culture writer Tolstoy admired — verify before asserting the first name."
  - item: "'Remove chapter III' (16 June). Tolstoy's reasoning is from Gusev's diary via Serebrovskaya, not a first-hand Tolstoy autograph. The closest first-hand trace is Notebook No. 3's «Вставить главу о религиозном понимании» beside the «[16 Іюня]» dateline."
    phase: 2
    why: "Attribute the demotion reasoning to Gusev-via-apparatus."
  - item: "OS/NS colophon dates. The author's date «2 июля 1908» is Old Style (= 15 July NS); the 20 Jan 1908 start is OS (= 2 Feb NS); Kievskie Vesti 17 Feb 1909 is OS (= 2 Mar NS). Corrections continued 8 Jul and 6 Aug OS. Do not let a colophon date drive a slug/chronology unchecked (cf. the TEI diary-filename-year gotcha)."
    phase: 2
    why: "Bears on the workRecord chronology fields; OS dates were converted deterministically (+13 in 1908) but should be confirmed."
  - item: "1917 corrected text periodical title «Солдат-гражданин» (Soldier-Citizen), ed. Chertkov — cross-check the exact title and whether it is the 'corrected' text the editorial history references."
    phase: 3
    why: "Publication-history precision."
  - item: "First LEGAL complete Russian publication is unpinned. The censored Kievskie Vesti 1909 is the only lifetime Russian appearance; the authoritative full Russian text is PSS Tom 37 (1956). Whether any legal complete Russian printing appeared 1909–1936 is unconfirmed."
    phase: 3
    why: "Publication-history completeness; out of scope to resolve fully."
  - item: "Gandhi and THIS treatise. No source documents Gandhi reading or responding to «Закон насилия и закон любви» specifically; his documented Tolstoy influences are A Letter to a Hindu (Dec 1908) and Kingdom of God. Keep the treatise the doctrine's last statement, not a Gandhi influence-text (Finding 5 complicates)."
    phase: 3
    why: "Guards against over-claiming the Gandhi connection for this text."
  - item: "publishedInRussiaDuringLifetime edge case. Proposed true (a legal Russian newspaper printed it) but only partially and censored. A reviewer may prefer false with a censorshipNotes nuance. Flag prominently in the record-creating proposal."
    phase: 4
    why: "Schema-boundary judgment for the new works record."
  - item: "relatedWorks slugs. Of the six proposed related works, only the-kingdom-of-god-is-within-you has a confirmed works/ record; christianity-and-military-service, nomer-gazety, what-i-believe, a-letter-to-a-hindu, i-cannot-be-silent likely have no record yet. Verify/ create before wiring relationshipType links."
    phase: 4
    why: "Avoid dangling relatedWorks ids in the new record."
  - item: "Biographers' page-level treatment (Bartlett 2010, Simmons 1946, Maude 1908/10, Wilson 1988) of THIS treatise vs the position is unconfirmed; the provisional finding is 'passing mention only, Kingdom of God is the study-text'."
    phase: 3
    why: "The 'gap is the finding' claim rests on an absence; worth a page-level check."

