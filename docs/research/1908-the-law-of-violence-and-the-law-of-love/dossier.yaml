    genre: comments
    pssTom: 37
    pages: "436–438"
    date: 1909-02-17
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_436_438_Zakon_nasilija_i_zakon_ljubvi_Istorija_p.txt
