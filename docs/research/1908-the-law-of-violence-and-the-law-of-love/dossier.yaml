topic:
  slug: 1908-the-law-of-violence-and-the-law-of-love
  title: "The Law of Violence and the Law of Love (Закон насилия и закон любви) — a corpus work-dive"
  question: >-
    How does Tolstoy's 1908 treatise Закон насилия и закон любви state, for the last time and
    systematically, the doctrine of non-resistance as the form of the law of love; how was it
    composed across Jan–Jul 1908 (the title saga, the abandon-it struggle, the demoted chapters);
    and how did its censored partial appearance in Russia and its complete publication abroad carry
    it into the non-resistance lineage of his final, Gandhi-adjacent year?
  date: 2026-06-08
  period: prophet
  corpusSurface: [works, diaries, notebooks, letters, commentary, krug_chtenija]
  dateRange: "1908 (composition Jan–Jul 1908; first publication 1909; reception 1908–present)"

