# ---------------------------------------------------------------------------------------------
# Layer 4 — secondary scholarship (Phase 3). Attributed, English-first. Contrast, not baseline.
# ---------------------------------------------------------------------------------------------
scholarship:
  summary: >-
    English-language scholarship treats this treatise less as a discrete object of study than as a
    coda — the last full systematic statement of a position whose canonical study-text remains The
    Kingdom of God Is Within You (1893). Editorial and popular framing (the Dover / Mary Koutouzow
    Tolstoy translation; the Ted K Archive reprint) consistently calls it Tolstoy's "last book" and
    "testamental work" and credits it with the non-resistance lineage to Gandhi and King — real but
    thin, asserting lateness and influence without unpacking the argument. The most useful recent
    academic treatment that names it directly is Anya Tseitlin's 2025 Davis Center essay, which reads
    Tolstoy's distinction as between individual and *systemic* violence and stresses the consistency
    of his pacifism from the 1860s on. Alexandre Christoyannopoulos's work on Tolstoy as Christian
    anarchist and Martin Green's Tolstoy–Gandhi study engage the *position*, not this text. The gap is
    itself the finding: biography routes the late non-resistance story through Kingdom of God, I Cannot
    Be Silent, and the Gandhi correspondence, mentioning this treatise mostly as "his last book." Read
    the mainstream critically (the Sofia-centred "moralistic dogmatist" frame is the worked example);
    §"Scholarly context" is a divergence map, not corroboration.
  triangulation:
    - evidenceRef: zakon-no-exceptions
      conventionalView: "It is Tolstoy's last systematic statement of non-resistance, restating rather than revising Kingdom of God (1893); a doctrine 'remarkably consistent from the 1860s onward' (Tseitlin 2025)."
      relation: extends
      source: "Tseitlin, Davis Center 2025; Dover/Ted K editorial framing — the dive reaches below the 'restatement' gloss to the actual no-exceptions logical hinge (K3/K5)."
    - evidenceRef: zakon-fire-with-fire
      conventionalView: "Tolstoy condemned all coercive force, whether from authorities or their opponents, even as revolutionary violence rose after 1905 (Tseitlin 2025)."
      relation: confirms
      source: "Tseitlin 2025; Christoyannopoulos 2010/2020 (anti-statism) — confirmed; the dive extends on the imagery ('fire with fire', 'burning the house', not discussed in the secondary literature)."
    - evidenceRef: zakon-diary-wont-go
      conventionalView: "Mainstream English biography does not narrate the compositional struggle or title saga of THIS treatise; the detail lives in PSS Tom 37 and the 1908 diaries."
      relation: extends
      source: "No secondary source engages the drafting history at this granularity — corpus-only material."
    - evidenceRef: zakon-pub-censored-russia
      conventionalView: "Written 1908; partial/censored in «Киевские вести» Feb 1909; complete abroad via the Free Age Press 1909; corrected 1917; first Soviet text PSS vol. 37 (1956)."
      relation: confirms
      source: "Ted K Archive editorial note; multiple catalogues — match the primary editorial history (minor cross-checks in needsReview)."
    - evidenceRef: zakon-chertkov-finished
      conventionalView: "1908 is the hinge of the Tolstoy–Gandhi lineage, routed through A Letter to a Hindu (14 Dec 1908) and Kingdom of God — not this treatise."
      relation: complicates
      source: "Green 1986; Wikisource Tolstoy–Gandhi correspondence; Tseitlin 2025 — the year-cluster framing is sound, but no source documents Gandhi engaging THIS text; keep it the doctrine's last statement, not a Gandhi influence-text."

