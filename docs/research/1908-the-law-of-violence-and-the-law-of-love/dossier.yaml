  - surface: "What the work says (structural map)"
    status: covered
    note: "Preface + 19 chapters + 4 appendices read from the work's own TEI; 14 keystone passages in the evidence ledger (incl. both fire images)."
  - surface: "Redactions & textual history"
    status: covered
    note: "Centrepiece. The «Всему бывает конец» → «Закон насилия и закон любви» title saga; the spun-off «Номер газеты»; the absorbed «Христианство и воинская повинность» (ch XIII); three chapters demoted to appendices; 1536 leaves, рук. № 58. From the editorial commentary — NO separate _Varianty file exists for this work (noted)."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "Partial/censored «Киевские вести» Feb 1909 (DID appear in Russia, unlike Bethink); complete abroad «Свободное слово» 1909; corrected 1917. Translation lineage thin in this pass (English editions noted)."
  - surface: "Reception & afterlife (Russian/Church first)"
    status: partial
    note: "Text-specific contemporary reception is thin (censored, author died Nov 1910). The dominant context — the 1908 jubilee, the Synod's 22 Aug warning, the 1901 excommunication, Trotsky's 1908 tribute — is covered. The Gandhi lineage is covered but runs through the 1908 SIBLINGS, not this text (complicates)."
  - surface: "Place in the cluster"
    status: covered
    note: "Cross-linked to fire-metaphor, Bethink Yourselves, Kingdom of God, What I Believe, christian-anarchism, tolstoyanism, christian-communism-socialism."
  - surface: "The author's later verdict"
    status: covered
    note: "The «чепуха»/«не идет»/«хочется бросить» struggle vs the 12 May «мне понравилось, и я кончил ее»; the 1 May «пока жив» to Chertkov."
  - surface: "Visual & manuscript record"
    status: partial
    note: "10 PD photographs cached (incl. the keystone Prokudin-Gorsky 23 May 1908 colour portrait) + 1 self-rendered PD page facsimile; the manuscript facsimile of рук. № 58, a Gusev portrait, and the «Свободное слово»/«Киевские вести» title pages are not openly available (requests noted)."

