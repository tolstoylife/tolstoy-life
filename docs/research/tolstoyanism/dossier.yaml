scholarship:
  summary: >-
    The conventional scholarly view holds that Tolstoy sincerely and repeatedly disowned 'Tolstoyism'
    — insisting he had founded no doctrine, only restated the Gospel — while an organised, international
    movement nonetheless formed around his writings: vegetarian colonies in Russia and England
    (Purleigh, Whiteway), Gandhi's Tolstoy Farm in South Africa, conscientious objection, and
    a publishing network centred on Chertkov's Free Age Press. Charlotte Alston's Tolstoy and
    His Disciples (2013) is the first full history of that movement; Aylmer Maude (himself a former
    Purleigh participant who broke with the doctrinaire disciples) and Rosamund Bartlett (2010)
    narrate the household tension — Sofia Andreyevna's nickname «тёмные», 'the dark ones,' for
    the disciples, and Chertkov's contested influence. Scholars also note that «толстовство» circulated
    largely as an EXTERNAL label — in the press, church and police registers, often pejoratively
    — rather than as a self-designation; Alston is the standard cite for the movement's identity
    forming partly against that label. The corpus sweep behind this dive quantifies that point:
    of 44 files where the term appears, only 4 carry it in Tolstoy's own body voice.
  triangulation:
  - evidenceRef: v53_167_169_denial
    conventionalView: >-
      Every major biographer (Maude, Bartlett) and the movement's historian (Alston) records that
      Tolstoy rejected the label, calling 'Tolstoyism' no teaching of his but the Gospel's. The
      1897 diary is the primary anchor most often paraphrased.
    relation: confirms
    source: >-
      Maude, The Life of Tolstoy (1908–1910); Alston, Tolstoy and His Disciples (2013)
  - evidenceRef: v67_231_nothing_there
    conventionalView: >-
      Scholarship treats the disavowal thematically and dates the movement's self-consciousness
      to the mid-1880s–1890s; the blunt 1894 'there is no such thing' to a journalist is rarely
      cited and earlier than the usual examples.
    relation: extends
    source: null
  - evidenceRef: v80_068_some_tolstoyans
    conventionalView: >-
      The wry 1909 formulation — faulting the premise that 'some sort of Tolstoyans' even exist,
      with the «хотя я и сам Толстой» pun — is not part of the standard quotation set; the corpus
      supplies it.
    relation: extends
    source: null
  - evidenceRef: v77_001_ridicule
    conventionalView: >-
      The received picture is a clean rejection of the label. The Stakhovich letter complicates
      it: the label has real SOCIAL force — its 'ridicule' actually deflects Tolstoy from prescribing
      vegetarianism — even as it has no doctrinal reality for him.
    relation: complicates
    source: null
  - evidenceRef: v67_231_movement_disowned
    conventionalView: >-
      Scholars describe «толстовство» as a largely external, often pejorative label (press, church,
      police). The sweep grounds the claim quantitatively: 44 candidate files, only 4 in Tolstoy's
      own voice — the term is overwhelmingly said about him, not by him.
    relation: extends
    source: Alston, Tolstoy and His Disciples (2013)
contradictions:
- claim: >-
    Tolstoy flatly denies that any 'Tolstoyism' or 'Tolstoyans' exist (v53 1897, v67 1894, v80
    1909): «никакого толстовства… не было и нет»; «этого ничего нет».
  correction: >-
    Yet in the 1907 Stakhovich letter (v77) he speaks of «ridicul'a толстовства» — the 'ridicule
    of Tolstoyism' — as a real social force strong enough to deflect his own counsel. Not a true
    contradiction but a register difference: the label has no doctrinal reality for him and undeniable
    social reality around him.
  evidenceRef: v77_001_ridicule
notCovered:
- >-
  The «тёмные» ('dark ones') — Sofia Andreyevna's nickname for the disciples — was NOT in the
  keyword sweep (a different term). A тёмн* pass would be high-noise (тёмн- = 'dark' in every
  ordinary sense); left as a targeted follow-up if the household-tension angle is pursued.
- >-
  The ~40 note-only files where «толстовцы/толстовство» is the 1928–1958 editors' or third parties'
  word (e.g. Prugavin's «О Льве Толстом и о толстовцах», Korolenko) — the RECEPTION record. Surfaced
  as the central finding (term said about him), not entered as Tolstoy-voice evidence; a separate
  reception study could mine them.
- >-
  Incoming letters (Mac-Gahan's, Ivanov's, the journalists Tolstoy answers) — the TEI corpus holds
  only outgoing letters.
- >-
  The Goldenweiser / Makovický conversation transcripts (Yasnopolianskie zapiski, 1904–1910) —
  almost certainly carry further spoken disownings; not swept.
- >-
  Christian-anarchism material (Eltzbacher, Sacy, «христианский анархизм») — deliberately deferred
  to dive #2; the legacy combined dive docs/research/tolstoyanism-christian-anarchism/ holds those
  extracts.
- >-
  The movement's external history — colonies (Purleigh, Whiteway), Gandhi's Tolstoy Farm, the
  fate after 1917 — lies outside Tolstoy's own corpus; Alston (2013) is the route.
