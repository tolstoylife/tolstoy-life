topic:
  slug: tolstoyanism
  title: Tolstoy on "Tolstoyism" (Толстовство)
  question: >-
    Where across the local corpus (tolstoydigital TEI + Jubilee Edition PDFs) does Tolstoy himself
    use the label «толстовство» (Tolstoyism) and «толстовцы» (the Tolstoyans / the movement) —
    and what does his own voice do with them, given that the terms circulate overwhelmingly as
    something said about him rather than by him?
  date: '2026-05-30'
  period: prophet
  corpusSurface:
  - diaries
  - letters
  - works
  - commentary
  dateRange: 1894–1909
evidence:
- id: v53_167_169_denial
  genre: diary
  pssTom: 53
  pages: 167–169
  date: '1897-12-02'
  addressee: diary (recording a conversation with Dušan Makovický)
  localPdf: primary-sources/jubilee-edition/vol19/vol19.pdf
  extract: extracts/v53_167_169_1897_12_02.txt
  quoteRu: >-
    Я рад был случаю сказать ему и уяснить себе, что говорить о толстовстве, искать моего руководительства,
    спрашивать моего решения вопросов — большая и грубая ошибка. — Никакого толстовства и моего
    учения не было и нет, есть одно вечное, всеобщее, всемирное учение истины, для меня, для нас
    особенно ясно выраженное в евангелиях.
  quoteEn: >-
    I was glad of the chance to tell him, and to clarify for myself, that to speak of Tolstoyism,
    to seek my guidance, to ask me to decide questions — is a great and crude error. There was
    and is no Tolstoyism and no teaching of mine; there is one eternal, universal, world-wide
    teaching of truth, which for me, for us, is especially clearly expressed in the Gospels. (working
    English)
  significance: >-
    THE KEYSTONE. The plainest disavowal of the label in the whole corpus, set down the evening
    of the conversation with the Slovak disciple Makovický (who in 1910 would be the physician
    at Tolstoy's deathbed). The «уяснить себе» — 'to clarify for myself' — is load-bearing: the
    exchange was only the occasion; the denial is a private formulation he gives himself. Page
    facsimile rendered from the local PD PSS PDF. (Reused from the legacy combined dive; re-confirmed
    body-voice here.)
  facsimile: extracts/pss-pages/tom53-1897-12-02-205.png
- id: v67_231_movement_disowned
  genre: letter
  pssTom: 67
  pages: 225–227
  date: '1894-09-22'
  addressee: V. N. Mac-Gahan (Varvara Nikolaevna Mac-Gahan)
  localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
  extract: extracts/v67_231_V_N_Mak_Gaxan.txt
  quoteRu: >-
    Вы вот пишете о «толстовцах» и других моих последователях, о движении, поднятом моей проповедью,
    и о том, почему толстовцы проявляют мало рвения к пропаганде мыслей, которые осчастливят человечество;
    а я не знаю не только каких-либо других последователей, но и толстовцев
  quoteEn: >-
    You write about 'the Tolstoyans' and my other followers, about the movement raised by my preaching,
    and about why the Tolstoyans show so little zeal in propagating the ideas that would make
    mankind happy; but I know of no other followers, nor of any Tolstoyans. (working English)
  significance: >-
    NEW (not in the legacy combined dive) — and the fullest disowning of the MOVEMENT, not just
    the label. Replying to a journalist who wrote of 'the Tolstoyans' and 'the movement raised
    by my preaching,' Tolstoy denies knowing any such followers or movement at all. The earliest
    of the four (1894).
  facsimile: null
- id: v67_231_nothing_there
  genre: letter
  pssTom: 67
  pages: 225–227
  date: '1894-09-22'
  addressee: V. N. Mac-Gahan (Varvara Nikolaevna Mac-Gahan)
  localPdf: primary-sources/jubilee-edition/vol33/vol33.pdf
  extract: extracts/v67_231_V_N_Mak_Gaxan.txt
  quoteRu: >-
    А о толстовцах, движении и т. п. я ничего не знаю, или даже знаю, что этого ничего нет.
  quoteEn: >-
    As for Tolstoyans, a movement, and so forth — I know nothing of it, or rather I know that
    there is no such thing. (working English)
  significance: >-
    The punch-line of the same 1894 letter: not merely 'I am not the leader,' but 'there is no
    such thing.' The blunt restatement that makes Mac-Gahan the sharpest movement-denial in the
    four.
  facsimile: null
- id: v77_001_ridicule
  genre: letter
  pssTom: 77
  pages: 5–6
  date: '1907-01-01'
  addressee: M. A. Stakhovich (Mikhail Aleksandrovich Stakhovich)
  localPdf: primary-sources/jubilee-edition/vol39/vol39.pdf
  extract: extracts/v77_001_M_A_Staxovichu.txt
  quoteRu: сказал бы, не есть мяса, если бы не боялся ridicul’a⁴ толстовства
  quoteEn: >-
    [I] would say, eat no meat — were I not afraid of the ridicule of Tolstoyism. (working English)
  significance: >-
    The label as a RIDICULE he flinches from. Listing the simple abstentions that open the soul,
    Tolstoy stops short of prescribing vegetarianism for fear of the «ridicul'a толстовства» —
    the ridicule attached to the name. The single place where the label's social weight visibly
    constrains his own counsel. (Reused from the legacy dive.) NOTE: the superscript «⁴» in the
    quoteRu is the PSS editorial footnote marker carried through the TEI extract, not Tolstoy's
    text.
  facsimile: null
- id: v80_068_some_tolstoyans
  genre: letter
  pssTom: 80
  pages: 50–53
  date: '1909-08-04'
  addressee: I. Ivanov
  localPdf: primary-sources/jubilee-edition/vol57/vol57.pdf
  extract: extracts/v80_068_I_Ivanovu.txt
  quoteRu: >-
    православные не любят толстовцев, а толстовцы не любят православных. В этом вы, я думаю, ошибаетесь,
    во-первых, в том, что признаете каких-то толстовцев. Что же до меня касается, то хотя я и
    сам Толстой
  quoteEn: >-
    [you say that] the Orthodox do not love the Tolstoyans, and the Tolstoyans do not love the
    Orthodox. In this, I think, you are mistaken — first of all, in that you acknowledge some
    sort of Tolstoyans. As for myself, though I am Tolstoy myself… (working English)
  significance: >-
    NEW (not in the legacy combined dive) — the wry late note (1909). Against a correspondent's
    premise that 'the Orthodox dislike the Tolstoyans and the Tolstoyans the Orthodox,' Tolstoy
    faults the very premise: that one 'acknowledges some sort of Tolstoyans (каких-то толстовцев)'
    at all — capped by the pun «хотя я и сам Толстой» ('though I myself am a Tolstoy / Tolstoyan').
  facsimile: null
