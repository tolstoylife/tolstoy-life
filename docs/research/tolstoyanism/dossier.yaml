  background:
  - >-
    Alston, Charlotte. Tolstoy and His Disciples: The History of a Radical International Movement.
    London: I.B. Tauris, 2013 — the first full scholarly history of the толстовцы movement (colonies,
    publishing, conscientious objection, Chertkov); standard cite for the label as external/oppositional.
  - >-
    Maude, Aylmer. The Life of Tolstoy. 2 vols (First Fifty Years 1908; Later Years 1910). London:
    Constable — contemporary biography by a former Purleigh participant who broke with the doctrinaire
    disciples; treats the label and the household tension first-hand.
  - >-
    Bartlett, Rosamund. Tolstoy: A Russian Life. London: Profile Books, 2010 — narrates Chertkov's
    contested influence and Sofia Andreyevna's «тёмные» ('the dark ones').
  - >-
    Christoyannopoulos, Alexandre. Christian Anarchism: A Political Commentary on the Gospel.
    Exeter: Imprint Academic, 2010 — systematic study with Tolstoy central; more relevant to the
    sibling Christian-anarchism dive.
  - >-
    Prugavin, A. S. О Льве Толстом и о толстовцах. Moscow: published by the author, 1911 — contemporary
    documentary collection (essays, memoirs, official materials); an example of the external-reception
    literature the note-only files cite.
