  # ===== D. НЕ УБИЙ НИКОГО / Thou Shalt Not Kill Anyone (1907) — Tom 37, pp. 39–54 =============
  - id: nikogo-felten-framing
    genre: works
    pssTom: 37
    pages: "39"
    date: 1907
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol06/vol06.pdf
    extract: extracts/v37_039_054_Ne_ubij_nikogo.txt
    quoteRu: >-
      В начале июля 1907 года человек, участвовавший в Петербурге в издательстве «Обновление», был посажен в тюрьму Петербургским судебным следователем по обвинению его в распространении написанной мною семь лет тому назад брошюры под заглавием «Не убий».
    quoteEn: >-
      At the beginning of July 1907 a man involved in the "Obnovlenie" publishing house in St Petersburg was put in prison by a St Petersburg examining magistrate on the charge of distributing a brochure I had written seven years before, titled "Thou Shalt Not Kill." (working English)
    significance: >-
      The trigger and the frame: the 1907 essay is a sequel to the 1900 «Не убий», provoked by the
      jailing of its publisher (N. E. Felten) for reprinting it. A government fighting a "mania for
      murder" jails the man who circulates "Thou shalt not kill." The «закон возмездия» (law of
      retribution) the essay is built on.

