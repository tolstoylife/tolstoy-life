    date: 1910
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol07/vol07.pdf
    extract: extracts/v38_005_012_Tri_dnja_1.txt
    quoteRu: >-
      Да, не будь среди огромного населения русского крестьянства того глубокого, религиозного сознания братства всех людей, уже давно, несмотря ни на какую полицию (ее же так мало и не может быть много в деревнях), не только разнесли бы эти бездомные люди, дошедшие до последней степени отчаяния, все дома богатых, но и поубивали бы всех тех, кто стоял бы им на дороге.
    quoteEn: >-
      Yes, were it not for that deep, religious sense of the brotherhood of all people among the vast population of the Russian peasantry, then long ago — despite any police (of which there is so little, and can be little, in the villages) — these homeless people, driven to the last degree of despair, would not only have wrecked all the houses of the rich but would have killed everyone who stood in their way. (working English)
    significance: >-
      What truly protects the propertied is not the police, courts and gallows but the peasants'
      Christian charity to the wanderers. The penal apparatus is not only evil but superfluous —
      it is the threatened, not the threateners, who keep the peace.

  - id: tridnja-soldatka
    genre: works
    pssTom: 38
    pages: "13"
    date: 1910
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol07/vol07.pdf
    extract: extracts/v38_012_018_Tri_dnja_2.txt
    quoteRu: >-
      — Хозяина мово в Крапивну угнали. — Куда, зачем? — В солдаты, значит. А не по закону, потому один кормилец.
    quoteEn: >-
      "They've driven my husband off to Krapivna." — "Where, what for?" — "To be a soldier, that is. And it's against the law, because he's the only breadwinner." (working English)
    significance: >-
      Day 2 (The Living and the Dying): the soldier's wife. Poverty's other end-point — the breadwinner
      taken to be made into a killer, leaving the family to starve. The conscription that «Единственное
      средство» named as the foundation of the whole order, in one ruined household.

  - id: tridnja-chain-to-gallows
    genre: works
    pssTom: 38
    pages: "22"
    date: 1910
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol07/vol07.pdf
    extract: extracts/v38_019_022_Tri_dnja_3.txt
    quoteRu: >-
      Министры же, и те, которые занимаются торговлей водкой, и те, которые заняты обучением людей убийству, и те, которые заняты присуждениями к изгнаниям, тюрьмам, каторгам, вешанию людей, все министры и их помощники — эти уже вполне уверены, что и самовары, и овцы, и холсты, и телки, отбираемые от нищих, находят самое свое лучшее помещение в приготовлении водки, отравляющей народ, в изготовлении орудий убийства, в устройстве тюрем, арестантских рот и т. п.
    quoteEn: >-
      And the ministers — those engaged in the vodka trade, and those engaged in teaching people to kill, and those engaged in sentencing people to exile, prison, hard labour, the hanging of people — all the ministers and their assistants are quite certain that the samovars, sheep, linens and calves taken from the destitute find their very best use in the making of vodka that poisons the people, in the manufacture of instruments of murder, in the building of prisons and convict-companies, and so on. (working English)
    significance: >-
      THE keystone of Three Days and the dive's poverty→gallows hinge (Day 3, Taxes): the chain of
      complicity from the village elder who seizes a widow's last sheep up through the volost, the zemsky
      nachalnik, the governor, to the ministers occupied with «вешанию людей» — the hanging of people.
      Poverty's taxes fund the gallows; the gallows is poverty's end-point.

  - id: tridnja-starosta-sin
    genre: works
    pssTom: 38
    pages: "20"
    date: 1910
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol07/vol07.pdf
    extract: extracts/v38_019_022_Tri_dnja_3.txt
    quoteRu: >-
      Тридцать рублей наше жалованье, а греха не оберешься.
    quoteEn: >-
      Thirty roubles is our wage — and there's no end of sin to it. (working English)
    significance: >-
      The village elder (staroста), lowest link in the chain, knows his part in seizing the poor's goods
      is sin and wants to quit. The complicity Tolstoy traces is felt at the bottom and denied at the top
      — the moral inversion of «Не могу молчать»'s executioner-caretaker who "stands morally higher."

  # ===== G. GENESIS — diary rows (byte-faithful; see extracts/_genesis-diary-sweep.md) ==========
  - id: gen-neubij-dispatch
    genre: diaries
    pssTom: 54
    pages: "32–33"
    date: "1900-08-07"
    addressee: null
    localPdf: null
    extract: extracts/v54_032_033_1900_08_07.txt
    quoteRu: >-
      Кончил и отослал и Рабство нашего времени и о смерти Гумберта.
    quoteEn: >-
      Finished and sent off both Slavery of Our Time and [the piece] on Umberto's death. (working English)
    significance: >-
      Tolstoy's own record of completing «Не убий» (7 Aug 1900 OS), dispatched together with «Рабство
      нашего времени». The terse, un-celebratory phrasing is characteristic. (The text was re-signed and
      revised on 8 Aug — its dateline.)

  - id: gen-tsarju-trigger
    genre: diaries
    pssTom: 54
    pages: "90–93"
    date: "1901-03-19"
    addressee: null
    localPdf: null
    extract: extracts/v54_090_093_1901_03_19.txt
    quoteRu: >-
      студенческия истории, принявшия общественный характер и заставившия меня написать обращение к Царю и его помощникам и программу. Старался руководиться только желанием служить, а не личным удовлетворением. Еще не посылал.
    quoteEn: >-
      the student affairs, which took on a public character and drove me to write the address to the Tsar and his assistants, and a programme. I tried to be guided only by the wish to serve, not by personal satisfaction. Have not yet sent it. (working English)
    significance: >-
      Names the exact trigger of «Царю и его помощникам» (the spring-1901 student unrest) and Tolstoy's
      self-scrutiny over motive. The companion «программа» (withheld from print, later in Birukov's
      biography) is named here. (Old-style spellings retained as in the diary.)

  - id: gen-sredstvo-program
    genre: diaries
    pssTom: 54
    pages: "96"
    date: "1901-04-29"
    addressee: null
    localPdf: null
    extract: extracts/v54_096_096_1901_04_29.txt
    quoteRu: >-
      Народную программу бросил.
    quoteEn: >-
      I have abandoned the People's Programme. (working English)
    significance: >-
      «Единственное средство» went through a prior conceptual stage — the «Народная программа» Tolstoy
      dropped on 29 April 1901 OS before restarting the article from scratch in May–July. (On finishing it,
      16 July OS, the diary's verdict was «слабо» / weak — a rare flat self-dismissal of a political piece.)

  - id: gen-nikogo-felten
    genre: diaries
    pssTom: 56
    pages: "44–48"
    date: "1907-07-20"
    addressee: null
    localPdf: null
    extract: extracts/v56_044_048_1907_07_20.txt
    quoteRu: >-
      Оставил Круг Чтения и по случаю заключения в тюрьму Фельтена писал брошюру «Не убий никого». Вчера, хотя и не кончил, прочел ее Черткову и другим.
    quoteEn: >-
      Left off Krug Chteniya and, on account of Felten's imprisonment, wrote the pamphlet "Thou Shalt Not Kill Anyone." Yesterday, though I had not finished it, I read it to Chertkov and others. (working English)
    significance: >-
      The genesis of «Не убий никого» in Tolstoy's own hand: it displaced his daily reading-anthology,
      was provoked by Felten's jailing, and was read aloud to Chertkov mid-draft. The same surge planned
      a direct letter to PM Stolypin and the piece «Руки вверх».

  - id: gen-smertkazn-provoke
    genre: diaries
    pssTom: 57
    pages: "13–14"
    date: "1909-01-18"
    addressee: null
    localPdf: null
    extract: extracts/v57_013_014_1909_01_18.txt
    quoteRu: >-
      Нынче написал только маленькую прибавку к статье о Ст-не, прибавку о царе, с тайной целью вызвать против себя гонения.
    quoteEn: >-
      Today I wrote only a small addition to the article about St[olypin], an addition about the tsar, with the secret aim of provoking persecution against myself. (working English)
    significance: >-
      The most intimate genesis evidence in the cluster: the 18 Jan 1909 OS addition «о царе» (the
      passage on Nicholas II «даровав жизнь» to the 32) was made deliberately to provoke his own
      prosecution — the «execute me too» logic of «Не убий никого» and «Не могу молчать», turned inward.
      The same entry catches the motive as not «совсем хороша» and resolves to correct it.

  - id: gen-tridnja-impulse
    genre: diaries
    pssTom: 57
    pages: "180–181"
    date: "1909-12-01"
    addressee: null
    localPdf: null
    extract: extracts/v57_180_181_1909_12_01.txt
    quoteRu: >-
      Положение голопузых у Курносенковой ужасно. Очень хочется написать три дня в деревне.
    quoteEn: >-
      The condition of the bare-bellied children at Kurnosenkova's is terrible. I very much want to write Three Days in the Village. (working English)
    significance: >-
      The first diary record of «Три дня в деревне» by its eventual title (1 Dec 1909 OS), born from a
      visit to actual village poverty — «ужасно», the same shock register Tolstoy reserves for executions
      and floggings. The lived source, not an abstract theme.

