    quoteEn: >-
      To justify the death penalty with the words of Christ no fanatic has dared until now. Such a justification, besides being contrived, is both stupid and shameless. (working English)
    significance: >-
      Tolstoy's reply to the student who forwarded the article. To Stolypin himself he wrote a single
      word — «стыдно» (shame) — quoted in the next sentence of the essay. The reply that a man named in
