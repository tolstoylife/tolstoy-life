    quoteEn: >-
      "Thou shalt not kill" means only this: that Christians must kill no one — neither directly nor indirectly, by abetting killings. (working English)
    significance: >-
      The title's whole content, and the symmetry the cluster insists on: the commandment forbids ALL
      killing — state executions, war, and revolutionary terror alike — and forbids the indirect
      participation (taxes, service, obedience) that makes one an accomplice.

