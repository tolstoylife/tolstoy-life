    extract: extracts/v38_039_048_Smertnaja_kazn_i_hristianstvo.txt
    quoteRu: >-
      главное бедствие наше не в деспотизме, не в ничтожности и жестокости и глупости людей, стоящих во власти, не в озлобленности революционеров, не в бедности народа, а в одном: в отсутствии религии у одних и в притворстве или самообмане других.
