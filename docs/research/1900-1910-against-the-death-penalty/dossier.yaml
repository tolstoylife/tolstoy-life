    significance: >-
      The first of the four reforms the address asks for: abolition of corporal punishment for peasants.
      State bodily violence on the lowest is the same evil as the gallows at the top — the cluster reads
      the whole penal apparatus as one.

  # ===== C. ЕДИНСТВЕННОЕ СРЕДСТВО / The Only Means (1901) — Tom 34, pp. 254–269 =================
  - id: sredstvo-all-rests-on-killing
    genre: works
    pssTom: 34
    pages: "262"
    date: 1901
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol03/vol03.pdf
    extract: extracts/v34_254_269_Edinstvennoe_sredstvo.txt
    quoteRu: >-
      не были бы возможны ни войны, ни рабство, ни отнятие земли богатыми от бедных, ни обладание произведениями труда многих, потому что всё это держится только на возможности или на угрозе убийства.
    quoteEn: >-
      neither wars, nor slavery, nor the taking of land by the rich from the poor, nor the possession of the labour-products of the many would be possible — because all of it rests only on the possibility, or the threat, of killing. (working English)
    significance: >-
      The structural argument that ties the death penalty to the whole social order: every form of
      economic oppression «rests only on the possibility, or the threat, of killing». Make «не убий» the
      one binding law and the order falls.

