  # ===== E. СМЕРТНАЯ КАЗНЬ И ХРИСТИАНСТВО / Capital Punishment and Christianity (1909) — Tom 38 ==
  - id: smertkazn-stn-blasphemy
    genre: works
    pssTom: 38
    pages: "40"
    date: 1909
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol07/vol07.pdf
    extract: extracts/v38_039_048_Smertnaja_kazn_i_hristianstvo.txt
    quoteRu: >-
      Между тем в Евангелии только в одном месте (Ев. от Марка гл. 7, ст. 9—13) упоминается о смертной казни и... в пользу ее:
    quoteEn: >-
      Yet in the Gospel the death penalty is mentioned in only one place (Mark 7:9–13) — and… in its favour. (working English) — quoting A. A. Stolypin's article.
    significance: >-
      The provocation, reproduced verbatim in the essay: A. A. Stolypin's «Заметки» in Novoe Vremya
      (18 Dec 1908) argued that Christ did not forbid but SANCTIONED capital punishment (Mark 7:9–13, the
      "корван" passage). The essay is Tolstoy's answer to the use of the Gospel to defend the gallows.

