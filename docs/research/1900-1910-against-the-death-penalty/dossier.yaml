# =============================================================================================
# SCHOLARSHIP — secondary layer (Phase 3). Mainstream = contrast, not baseline.
#   (filled from extracts/_scholarship.md after the scholarship sweep.)
# =============================================================================================
scholarship:
  summary: >-
    English-language scholarship treats Tolstoy's opposition to capital punishment almost entirely
    through «Не могу молчать» (1908); the other five essays of this cluster have attracted little
    dedicated commentary. Bartlett (2010) frames the 1908 essay as the climax of Tolstoy's late
    political witness; Maude (1911), the closest English source, arranged the Free Age Press
    translations of most of the cluster but treats the 1908 outburst as the defining moment and the
    rest as context. Studies of Tolstoy's political non-fiction (Orwin, Gustafson) concentrate on the
    doctrinal treatises (The Kingdom of God, The Law of Violence and the Law of Love); the polemic
    essays are read as applications of doctrine, not as a coherent body. The most authoritative record
    is the Russian one — the PSS editorial apparatus (Eikhenbaum on «Не могу молчать»; the Tom 34/37/38
    commentaries on the rest) — which this dive treats as its baseline. Tolstoy's recurring legal claim
    (that the death penalty was a legislative newcomer, abolished de facto by Empress Elizabeth and
    revived only through the 1881 emergency statute and the post-1905 field courts) is historically
    grounded, though it overstates the case as regards the military and political-crime provisions that
    persisted throughout. The cluster as a coherent series — built on one logical kernel (the state
    kills more, and kills in the citizens' name) and aimed at precise targets (the 1881 statute, the
    Stolypin field courts, the Gorlovka sentences, A. A. Stolypin's Novoe Vremya article) — has no
    dedicated English study as of this writing.
  triangulation:
    - evidenceRef: tsarju-death-penalty-unrussian
      conventionalView: >-
        Tolstoy's claim that the death penalty was "formerly unknown in our code of laws" is usually
        treated as rhetoric. It is in fact substantively accurate for the ordinary civil penal code:
        Empress Elizabeth's de-facto moratorium (1744–1762) was real and, per Marasinova, unique in
        Europe; the 19th-century criminal code did not carry death for common crimes — it survived only
        in military law and for state crimes.
      relation: confirms
      source: "Marasinova, Quaestio Rossica 2018; TASS factbox; Wikipedia 'Capital punishment in Russia'."
    - evidenceRef: tsarju-death-penalty-unrussian
      conventionalView: >-
        Standard biography does not register the legal precision of «Царю и его помощникам»: Tolstoy
        names the 1881 «Положение о мерах к охранению» (Statute of Increased Protection) — the emergency
        mechanism that let commanders move cases to courts-martial — as the channel through which capital
        punishment re-entered Russian governance, not a change to the code.
      relation: extends
      source: "Tolstoy, To the Tsar and His Assistants (Wikisource/Maude); Wikipedia 'Martial law in Russia'."
    - evidenceRef: nikogo-felten-framing
      conventionalView: >-
        Where scholarship mentions «Не убий никого» at all, it rarely names its catalyst. The 1907 essay
        is a documented legal-solidarity sequel to «Не убий» (1900), triggered by the arrest of N. E.
        Felten of «Обновление» for circulating the 1900 pamphlet.
      relation: extends
      source: "Wikipedia 'Thou Shalt Not Kill (essay)'; nonresistance.org; PSS т.37 commentary."
    - evidenceRef: smertkazn-tsar-granted-life
      conventionalView: >-
        The Gorlovka case is confirmable by its numbers: the Odessa Military District court at
        Ekaterinoslav (7–19 Dec 1908) tried 131, convicted 92, sentenced 32 to death; 24 were commuted;
        8 were hanged on the night of 4 Sept 1909. Tolstoy scholarship does not usually trace the case.
      relation: confirms
      source: "Wikipedia RU «Горловское вооружённое восстание»; PSS т.38 commentary (Sergeenko)."
    - evidenceRef: smertkazn-stn-blasphemy
      conventionalView: >-
        Accounts that mention «Смертная казнь и христианство» rarely specify the trigger: A. A.
        Stolypin's Novoe Vremya article of 18 Dec 1908 defending the gallows via Mark 7:9–13, answered by
        Tolstoy on 2 Jan 1909. The corpus supplies the exact Gospel passage and the one-word reply.
      relation: extends
      source: "nonresistance.org (full text); PSS т.38 commentary."
    - evidenceRef: smertkazn-shame
      conventionalView: >-
        English accounts mention "Stolypin's brother" but rarely name him. Alexander Arkadyevich
        Stolypin (1863–1925), journalist and poet, younger brother of the Prime Minister, died in
        émigré Belgrade — the conservative who used the Gospel to defend the death penalty.
      relation: extends
      source: "Find a Grave 261205774; Wikipedia 'Stolypin (disambiguation)'."
    - evidenceRef: smertkazn-tsar-granted-life
      conventionalView: >-
        The execution wave is usually given as a single figure ("over 3,000", 1906–09). Kropotkin's
        contemporary compilation shows the granular series (280 in 1906, 508 in 1907, 802 in the first
        ten months of 1908) and the 1908 peak that is this cluster's backdrop; "Stolypin's necktie" was
        coined by the Kadet F. Rodichev (Duma, 17 Nov 1907).
      relation: complicates
      source: "Kropotkin, The Terror in Russia (1909); Wikipedia 'Pyotr Stolypin'."
    - evidenceRef: neubij-hypocrisy
      conventionalView: >-
        «Не убий» (1900) was triggered by the assassination of Umberto I by Gaetano Bresci (29 July
        1900). Its core move — the hypocrisy of rulers who decry assassination while killing on a vastly
        greater scale — is the single logical kernel of all six cluster essays; scholarship has not read
        the texts as one series built on it.
      relation: extends
      source: "Wikipedia 'Thou Shalt Not Kill (essay)'; Bartlett 2010."
    - evidenceRef: tridnja-chain-to-gallows
      conventionalView: >-
        «Три дня в деревне» is usually read as a late-life social sketch; its function as the cluster's
        coda — linking the gallows to poverty as effect to cause (the ministers «заняты… вешанию людей»
        funded by the taxes seized from the destitute) — is not highlighted.
      relation: complicates
      source: "marxists.org (Three Days text); Gutenberg Free Age Press edition note."
    - evidenceRef: nikogo-execute-me
      conventionalView: >-
        The censorship pattern is a uniform reception history: every cluster essay was banned in Russia
        on first publication and reached readers abroad (Chertkov's «Свободное слово» / Free Age Press,
        Maude translations) and then by hectograph/illegal print. It has not been studied as a pattern.
      relation: extends
      source: "Wikipedia 'Thou Shalt Not Kill (essay)'; PSS commentaries; the i-cannot-be-silent dive."
    - evidenceRef: sredstvo-all-rests-on-killing
      conventionalView: >-
        No English-language scholarship on «Единственное средство» (1901) was located. Its argument —
        that all economic oppression rests on the threat of killing, so the workers' only means is the
        refusal to be made into killers — connects the cluster's nonviolence to its social critique but
        has attracted no separate study.
      relation: extends
      source: "(no clear secondary source located — see extracts/_scholarship.md §5)."

