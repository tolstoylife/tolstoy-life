# Machine-readable dossier for the "Against the death penalty" (1900–1910) corpus theme-dive.
# Created 2026-06-13. Slug: 1900-1910-against-the-death-penalty.
# Subject: Tolstoy's sustained case against capital punishment and state killing across six works
# of his last decade. A MULTI-WORK theme-dive (like 1903-folk-tales): it carries SIX record-creating
# workRecord proposals (none of the cluster has a works/ record yet; non-fiction / essays-and-criticism).
# Centrepiece = «Не могу молчать» / I Cannot Be Silent (1908), dived separately at
# docs/research/1908-i-cannot-be-silent/ — CROSS-REFERENCED here, NOT re-extracted.
# Every evidence[].quoteRu is byte-faithful from its `extract` file (verify_quotes.py).
# Extraction: extract_tei.py --choice=reg --notes=auto (pre-1918 orthography → modern).
# PSS Tom→local PDF: Tom 34 = jubilee-edition/vol03; Tom 37 = vol06; Tom 38 = vol07 (mapping verified
# against docs/research/pss-volume-mapping.md). quoteEn is working English (labelled).

topic:
  slug: 1900-1910-against-the-death-penalty
  title: "Against the death penalty — Tolstoy's writings against capital punishment and state killing, 1900–1910"
  question: >-
    How, across the last decade of his life, did Tolstoy build a sustained moral case against capital
    punishment and state killing — from «Не убий» (1900, on the assassination of King Umberto) through
    the 1901 addresses «Царю и его помощникам» and «Единственное средство», the 1907 «Не убий никого»
    (provoked by the jailing of a publisher for reprinting «Не убий»), the 1908–09 «Смертная казнь и
    христианство» (answering a Novoe Vremya article that defended the gallows with the Gospel), and the
    1909–10 «Три дня в деревне» (poverty and the gallows as its end-point)? What recurring arguments
    bind the cluster (the death penalty as un-Russian and un-Christian; the symmetric guilt of state and
    revolutionary killing; complicity through non-resistance; refuse-to-kill as the only remedy); how was
    the cluster published and censored (Свободное слово abroad, «Обновление» 1906, the 1911 confiscations);
    and how does the cluster set «Не могу молчать» (1908) in its decade-long context?
  date: 2026-06-13
  period: prophet
  corpusSurface: [works, comments, diaries, letters]
  dateRange: "1900–1910 (composition 1900–1910; publication 1900–1917; reception 1900–present)"

# =============================================================================================
# EVIDENCE — flat citation ledger. Every quoteRu is verbatim in its `extract`.
#   Grouped by work. OS = Old Style (Julian); NS = New Style. 1900–1910: OS + 13 = NS.
#   Genesis diary/letter rows are appended after the work-text rows.
# =============================================================================================
evidence:

  # ===== A. НЕ УБИЙ / Thou Shalt Not Kill (1900) — PSS Tom 34, pp. 200–205 =====================
  - id: neubij-hypocrisy
    genre: works
    pssTom: 34
    pages: "200"
    date: 1900
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol03/vol03.pdf
    extract: extracts/v34_200_205_Ne_ubij.txt
    quoteRu: >-
      самые добрые из убитых королей, как Александр II или Гумберт, были виновниками, участниками и сообщниками, — не говоря уже о домашних казнях, — убийства десятков тысяч людей, погибших на полях сражений; недобрые же короли и императоры были виновниками сотен тысяч, миллионов убийств.
    quoteEn: >-
      even the kindest of the murdered kings, such as Alexander II or Umberto, were the authors, participants and accomplices — to say nothing of executions at home — of the murder of tens of thousands of people who perished on the battlefields; while the unkind kings and emperors were the authors of hundreds of thousands, of millions of murders. (working English)
    significance: >-
      The essay's hinge, written days after the assassination of King Umberto I of Italy (29 July 1900):
      the kings and emperors who recoil in horror at a regicide are themselves the greatest killers, by
      war and execution. Regicide is condemned not for cruelty or injustice but for its UNREASON.
    facsimile: extracts/v34_200_Ne_ubij_opening_facsimile.png

  - id: neubij-hydra
    genre: works
    pssTom: 34
    pages: "201"
    date: 1900
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol03/vol03.pdf
    extract: extracts/v34_200_205_Ne_ubij.txt
    quoteRu: >-
      Короли и императоры давно уже устроили для себя такой же порядок, как в магазинных ружьях: как только выскочит одна пуля, другая мгновенно становится на ее место.
    quoteEn: >-
      Kings and emperors have long since arranged for themselves the same order as in a magazine rifle: as soon as one bullet flies out, another instantly takes its place. (working English)
    significance: >-
      Why killing a ruler is pointless: the office refills itself («Le roi est mort, vive le roi!»). The
      cause of oppression is not the man but the structure that produces him — so the answer is not to
      kill rulers but to stop sustaining the structure.

  - id: neubij-spoil-children
    genre: works
    pssTom: 34
    pages: "203"
    date: 1900
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol03/vol03.pdf
    extract: extracts/v34_200_205_Ne_ubij.txt
    quoteRu: >-
      Убивать этих людей, — всё равно, что избаловать детей, а потом сечь их.
    quoteEn: >-
      To kill these people is the same as to spoil children and then flog them. (working English)
    significance: >-
      The peoples make their rulers by surrendering their freedom and dignity for small material gains,
      then rage at the rulers they made. The killing is doubly absurd.

  - id: neubij-refuse
    genre: works
    pssTom: 34
    pages: "204"
    date: 1900
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol03/vol03.pdf
    extract: extracts/v34_200_205_Ne_ubij.txt
    quoteRu: >-
      не убивать надо Александров, Карно, Гумбертов и других, а надо разъяснить им то, что они сами убийцы, и, главное, не позволять им убивать людей, отказываться убивать по их приказанию.
    quoteEn: >-
      one must not kill the Alexanders, Carnots, Umbertos and others, but must make clear to them that they are themselves murderers, and, above all, not allow them to kill people — refuse to kill at their command. (working English)
    significance: >-
      The cluster's positive remedy in its first statement: not regicide, but the refusal to kill on
      command. The same conclusion recurs in «Единственное средство», «Не убий никого», and «Не могу
      молчать». The note ends: «Это самое я и пытаюсь делать этой заметкой» (8 August 1900).

  # ===== B. ЦАРЮ И ЕГО ПОМОЩНИКАМ / To the Tsar and His Assistants (1901) — Tom 34, pp. 239–244 =
  - id: tsarju-opening
    genre: works
