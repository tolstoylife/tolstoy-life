      The essay's diagnosis: the death penalty flourishes because both camps lack a binding faith —
      liberals/revolutionaries have only "science," the government only church-deception. The titular
      argument: capital punishment is incompatible with the Christianity its defenders claim.

  # ===== F. ТРИ ДНЯ В ДЕРЕВНЕ / Three Days in the Village (1909–10) — Tom 38, pp. 5–22 ==========
