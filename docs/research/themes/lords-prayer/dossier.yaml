# Machine-readable dossier for the lords-prayer corpus-dive (index.md).
# Created 2026-06-06 by a corpus-dive run (slug: lords-prayer).
# Theme: what Tolstoy did to the LORD'S PRAYER (Отче наш) when he translated/harmonized
# the Gospels (1880-81) — the family of renderings in PSS Tom 24 (full harmony Соединение и
# перевод четырёх Евангелий; condensed Краткое изложение Евангелия; French Abrégé), his
# reading of it as the abolition of petitionary prayer, the diary/letter reactions of the
# composition years (Tom 63 letters; Tom 49 1881 diary), and a Swedish «Fader vår» rendering.
# Focused follow-up to the gospel-translation dive (sibling: that dive owns the project history).
# Russian quoteRu rows are byte-faithful vs the named extract (verify_quotes.py). The French
# (Abrégé) row holds French in quoteRu, verified against extracts/abrege_lords_prayer.txt
# (per the Abrégé precedent in the fire/gospel dossiers).
# Harmony + GiB extracts are focused slices of the already-verified parent gospel-translation
# extracts. The 1880 Tom 63 letters were re-extracted with extracts/_reg_extract.py to recover
# pre-reform <choice><orig>/<reg> text that extract_tei.py drops (known pre-reform gap).

topic:
  slug: lords-prayer
  title: "Tolstoy's Lord's Prayer: «Отче наш» rewritten — and a Swedish «Fader vår»"
  question: >-
    What did Tolstoy actually do to the Lord's Prayer when he translated and harmonized the
    Gospels (1880-81)? Extract his own renderings across PSS Tom 24 (the close retranslation in
    Matthew 6, the transformed Luke 11 version, the twelve-fold expansion and recitable prayer of
    the Gospel in Brief, the French Abrégé); read his reading of the prayer as the abolition of
    petitionary prayer; gather the diary/letter reactions DURING composition; and render the
    result into a Swedish «Fader vår». Sibling to gospel-translation, which owns the project's
    history; this dive drills into the single passage.
  date: 2026-06-06
  period: "prophet (composition 1880-81; Tom 24 first legal Russian printing 1957)"
  corpusSurface: [gospel-harmony, works, letters, diaries]
  dateRange: "1880-1881 (composition); afterlife to 1896 (Crowell English) / 1957 (Tom 24)"

# =============================================================================================
# Layer 1 — flat citation ledger.
#   A. The anti-petitionary reading (prayer abolishes prayer)
#   B. The renderings (A=Matthew, B=Luke, C=Gospel in Brief, D=Abrégé)
#   C. Reactions during composition (Tom 63 letters; Tom 49 diary)
# =============================================================================================
evidence:

  # ===== A. THE PRAYER THAT ABOLISHES PRAYER ====================================

  - id: lp-abolish-question
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      Как еще яснее сказать, что не нужно молиться?
    quoteEn: >-
      How could it be said more plainly that one must not pray? (working English)
    significance: >-
      The hinge of Tolstoy's whole reading: the Lord's Prayer is not a formula to repeat but
      Jesus's refutation of petitionary prayer (grounded in Matt 6:7-8, the Father "knows what you
      need before you open your lips"). The model prayer, for Tolstoy, abolishes prayer-as-asking.
    facsimile: null

  - id: lp-abolish-content
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      Вся молитва должна состоять в желании царства Божия и в исполнении его правил, а все правила в том, чтобы не считать никого виновным, а всех любить и прощать.
    quoteEn: >-
      The whole prayer must consist in the desire for God's kingdom and in the fulfilment of its rules, and all the rules are: to hold no one guilty, but to love and forgive everyone. (working English)
    significance: >-
      What "prayer" reduces to once the asking is removed: wanting the kingdom and forgiving
      everyone. The ethical core that the rewritten petitions all restate.
    facsimile: null

  - id: lp-abolish-gib
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/gib_lords_prayer.txt
    quoteRu: >-
      Ни молиться, ни поститься не нужно. Молиться не нужно потому, что отец знает всё, что людям нужно.
    quoteEn: >-
      Neither to pray nor to fast is needed. To pray is not needed, because the Father knows everything that people need. (working English)
    significance: >-
      The condensed redaction states the anti-petitionary reading flatly in the chapter on the
      kingdom. The same point the French Abrégé makes (lp-D-abrege).
    facsimile: null

  # ===== B. THE RENDERINGS ======================================================

  - id: lp-A-render
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      Так вот как молитесь: Отец! Чтобы было твое царство. Пусть будет твоя воля в тебе и во мне.
    quoteEn: >-
      So pray thus: Father! That thy kingdom be. May thy will be in thee and in me. (working English)
    significance: >-
      Version A — the close retranslation in the Sermon-on-the-Mount chapter (Matt 6:9-10). Collapses
      the opening petitions and re-points "as in heaven, so on earth" to "in thee and in me"; drops
      "who art in heaven" as absent from Luke.
    facsimile: null

  - id: lp-A-inthee-note
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      «Как на небе и на земле» я перевожу: «в тебе и во мне».
    quoteEn: >-
      'As in heaven and on earth' I translate: 'in thee and in me'. (working English)
    significance: >-
      Tolstoy's explicit note on the most striking re-pointing of Version A: heaven/earth becomes the
      inner/outer of the praying person.
    facsimile: null

  - id: lp-A-bread-note
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      неверно переведено: «насущный» — хлеб на этот день; слово это значит: необходимый.
    quoteEn: >-
      …wrongly translated 'daily' — bread for this day; this word means: necessary. (working English)
    significance: >-
      Tolstoy's footnote on ἐπιούσιος: he rejects "daily" for "necessary." Confirmed by standard
      scholarship — the ἐπί+οὐσία etymology that also produced the Vulgate "supersubstantialem"
      (see scholarship.triangulation). His rendered line: "Денное пропитание дай нам с нужду."
    facsimile: null

  - id: lp-A-forgive
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      И прости нам наши вины за то, что мы прощаем всякому, кто виноват перед нами.
    quoteEn: >-
      And forgive us our faults because we forgive everyone who is at fault before us. (working English)
    significance: >-
      Version A's forgiveness clause. Tolstoy EXCISES "lead us not into temptation, but deliver us from
      evil" entirely as verbiage that "contains no thought" and breaks the sense — the boldest cut in
      any of his renderings.
    facsimile: null

  - id: lp-B-render
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      И Иисус сказал им: когда молитесь, говорите: Отец! да будешь ты свят в нас, да объявится царство твое, т. е. да будет воля твоя; да сойдет в нас дух твой и очистит нас.
    quoteEn: >-
      And Jesus said to them: when you pray, say: Father! mayest thou be holy in us, may thy kingdom be made manifest, that is, may thy will be done; may thy spirit descend into us and cleanse us. (working English)
    significance: >-
      Version B — the transformed prayer in the "On Prayer" (Luke 11) chapter, the deepest rewriting.
      The kingdom petition is replaced by the descent of the spirit. See lp-B-variant-note for the
      text-critical pedigree.
    facsimile: null

  - id: lp-B-bread
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      Дай нам питание духа, то, которое дает жизнь.
    quoteEn: >-
      Give us the nourishment of the spirit, that which gives life. (working English)
    significance: >-
      Version B's bread petition: "daily bread" becomes the food of the SPIRIT — the most explicit
      spiritualizing of the material petition anywhere in the renderings.
    facsimile: null

  - id: lp-B-debts
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      И не взыскивай с нас всё, чем мы должны, потому что и мы не взыскиваем с тех, что нам должны. И не считайся с нами.
    quoteEn: >-
      And do not exact from us all that we owe, because we too do not exact from those who owe us. And do not reckon with us. (working English)
    significance: >-
      Version B's debt petition, recast as a plea not to be called to account — paired with Tolstoy's
      gloss that we are insolvent debtors to reason (lp-B-debtors-gloss).
    facsimile: null

  - id: lp-B-variant-note
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      слова: да сойдет дух твой в нас и очистит нас встречаются в цитатах древних церковных писателей.
    quoteEn: >-
      the words 'may thy spirit descend into us and cleanse us' are found in citations of ancient church writers. (working English)
    significance: >-
      Tolstoy's own footnote shows he knew the "spirit" reading was a genuine ancient variant, not his
      invention. Standard text-criticism CONFIRMS it (minuscules 700, 162; Marcion's Luke; Gregory of
      Nyssa) — see scholarship.triangulation lp-B-variant-note.
    facsimile: null

  - id: lp-B-debtors-gloss
    genre: gospel-harmony
    pssTom: 24
    pages: "7–798"
    date: 1880-1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/harmony_lords_prayer.txt
    quoteRu: >-
      Мы обязаны жизнью разумению, а не отдаем ему всю свою плотскую жизнь, и потому мы должники неоплатные.
    quoteEn: >-
      We owe our life to reason, yet do not give over to it our whole fleshly life, and so we are debtors who can never pay. (working English)
    significance: >-
      The metaphysics under the debt petition: разумение (reason/understanding) is the creditor — the
      same keyword the sibling fire-metaphor dive tracks (John 1 Logos → разумение).
    facsimile: null

  - id: lp-C-surprise
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/gib_lords_prayer.txt
    quoteRu: >-
      Окончив свою работу, я к удивлению и радости своей нашел, что так называемая молитва господня есть не что иное, как в самой сжатой форме выраженное всё учение Иисуса в том самом порядке, в котором были расположены мною главы, и что каждое выражение молитвы соответствует смыслу и порядку глав.
    quoteEn: >-
      On finishing my work I found, to my surprise and joy, that the so-called Lord's Prayer is nothing other than the whole teaching of Jesus expressed in the most condensed form, in the very order in which I had arranged the chapters, and that each phrase of the prayer corresponds to the sense and order of the chapters. (working English)
    significance: >-
      Version C's premise (Gospel in Brief preface): the prayer maps phrase-by-phrase onto Tolstoy's
      twelve chapters — which he treats as internal proof that his structure was the teaching's own.
      A rhetorical, not text-critical, claim (see scholarship: extends).
    facsimile: null

  - id: lp-C-table-open
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/gib_lords_prayer.txt
    quoteRu: >-
      Человек — сын Бога.
    quoteEn: >-
      Man is the son of God. (working English) — Tolstoy's meaning for "Отче наш" (phrase 1 of 12)
    significance: >-
      The opening of the twelve-fold correspondence (Version C-table): "Отче наш" → "Man is the son of
      God," the title of chapter I. The full table is in index.md.
    facsimile: null

  - id: lp-C-table-close
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/gib_lords_prayer.txt
    quoteRu: >-
      А будет твоя власть, и сила, и разум.
    quoteEn: >-
      But there will be thy power, and strength, and reason. (working English) — Tolstoy's meaning for the doxology (phrase 12 of 12)
    significance: >-
      The signature substitution that closes the twelve-fold table: "kingdom and power and GLORY"
      becomes "power and strength and REASON (разум)." Glory → reason is the most concentrated
      statement of Tolstoy's whole programme.
    facsimile: null

  - id: lp-Cbody-prayer
    genre: gospel-harmony
    pssTom: 24
    pages: "801–938"
    date: 1881
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/gib_lords_prayer.txt
    quoteRu: >-
      Молитесь только так: Отец наш безначальный и бесконечный, как небо! Пусть будет свято только твое существо. Пусть будет власть только твоя, так, чтобы воля твоя совершалась безначально и бесконечно на земле. Дай мне пищу жизни в настоящем. Ошибки мои прежние загладь и сотри так же, как и я заглаживаю и стираю все ошибки братьев моих, чтобы я не попал в соблазн, избавился от зла. Потому что твоя власть и сила и твое решение.
    quoteEn: >-
      Pray only thus: Our Father, without beginning and without end, like the sky! May thy being alone be holy. May power alone be thine, so that thy will be done, without beginning and without end, on earth. Give me the food of life in the present. My former mistakes, efface and wipe them out, just as I efface and wipe out all the mistakes of my brothers, so that I may not fall into temptation, and may be delivered from evil. Because thine is the power and the strength and thine the decision. (working English)
    significance: >-
      Version C-body — the recitable prayer in the body of the Gospel in Brief, the single form that
      most reads like a prayer one could say. It is the base text for "Tolstojs Fader vår" (the Swedish
      rendering). Note the close: "глава/glory" → "решение/decision" (Crowell 1896 English: "judgment").
    facsimile: null

  - id: lp-D-abrege
    genre: works
    pssTom: 24
    pages: "941–969"
    date: 1881-1883
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/abrege_lords_prayer.txt
    quoteRu: >-
      La prière ne peut pas consister dans les demandes que nous faisons à Dieu. Notre Père connaît tous nos besoins avant même que nous ne les ayons formulés.
    quoteEn: >-
      Prayer cannot consist in the requests we make to God. Our Father knows all our needs even before we have formulated them. (working English, from Tolstoy's French — Abrégé de l'Évangile)
    significance: >-
      Version D — the French Abrégé carries the same anti-petitionary reading in Tolstoy's own French,
      and uses the prayer's phrases as section-headings ("QUE TON RÈGNE VIENNE", etc.). quoteRu holds
      French (verified vs the French extract, per the Abrégé precedent).
    facsimile: null

  # ===== C. REACTIONS DURING COMPOSITION (1880-81) ==============================

  - id: lp-react-1880-conviction
    genre: letters
    pssTom: 63
    pages: "12–13"
    date: 1880-02-29
    addressee: N. N. Strakhov
    localPdf: primary-sources/jubilee-edition/vol29/vol29.pdf
    extract: extracts/v63_011_H_H_Straxovu.txt
    quoteRu: >-
      Бумаги измарал много с большим напряжением и не скажу радостью, но с уверенностью, что это так нужно.
    quoteEn: >-
      I have covered much paper, with great strain and — I will not say joy, but — with the conviction that it is necessary. (working English)
    significance: >-
      Early composition (Feb 1880): the labour is joyless but driven by necessity. The same letter says
      he is still finishing the critique of Orthodox theology before the translation proper.
    facsimile: null

  - id: lp-react-1880-cannot-stop
    genre: letters
    pssTom: 63
    pages: "15–16"
    date: 1880-03-23
    addressee: N. N. Strakhov
    localPdf: primary-sources/jubilee-edition/vol29/vol29.pdf
    extract: extracts/v63_014_H_N_Straxovu.txt
    quoteRu: >-
      Я все работаю и не могу оторваться и часто счастлив своей работой, но очень часто слабею головой.
    quoteEn: >-
      I keep working and cannot tear myself away, and am often happy in my work, but very often my head grows weak. (working English)
    significance: >-
      The grip of the work (Mar 1880): absorption and happiness alternating with exhaustion — the
      texture of the year the prayer was being translated.
    facsimile: null

  - id: lp-react-1880-sermon
    genre: letters
    pssTom: 63
    pages: "6–9"
    date: 1880-02-02
    addressee: A. A. Tolstaya
    localPdf: primary-sources/jubilee-edition/vol29/vol29.pdf
    extract: extracts/v63_006_Gr_A_A_Tolstoj.txt
    quoteRu: >-
      Особенно, когда вы прибавляете о том, что сущность учения в Нагорной проповеди.
    quoteEn: >-
      Especially when you add that the essence of the teaching is in the Sermon on the Mount. (working English)
    significance: >-
      The only place in the composition-year correspondence where the prayer's home text is named:
      Tolstoy locates "the essence of the teaching" in the Sermon on the Mount (Matt 5-7), the chapter
      that contains the Lord's Prayer.
    facsimile: null

  - id: lp-react-1880-tischendorf
    genre: letters
    pssTom: 63
    pages: "21–22"
    date: 1880-09-01
    addressee: N. N. Strakhov
    localPdf: primary-sources/jubilee-edition/vol29/vol29.pdf
    extract: extracts/v63_024_H_N_Straxovu.txt
    quoteRu: >-
      Очень благодарен вам за Тишендорфское евангелие.
    quoteEn: >-
      I am very grateful to you for the Tischendorf gospel. (working English)
    significance: >-
      The philological instrument arrives (Sep 1880): Strakhov sends Tischendorf's critical Greek New
      Testament — the very text Tolstoy cites by name in his Luke footnote ("в греческом тексте
      Тишендорфа"). Direct material link between the correspondence and the prayer's translation.
    facsimile: null

  - id: lp-react-1881-completed
    genre: letters
    pssTom: 63
    pages: "71–73"
    date: 1881-07-01
    addressee: N. N. Strakhov
    localPdf: primary-sources/jubilee-edition/vol29/vol29.pdf
    extract: extracts/v63_060_H_N_Straxovu.txt
    quoteRu: >-
      Из большего сочинения, которое я после вас и кончил, и еще раз все прошел, я сделал еще из Евангелия извлечение без примечаний, но с коротким предисловием
    quoteEn: >-
      Out of the larger work, which I have finished since you were here and gone through once more, I have made an extract from the Gospel, without notes but with a short preface… (working English)
    significance: >-
      The completion statement (July 1881): the big harmony is finished and the condensed Gospel in
      Brief made "with a short preface" — the preface where the twelve-fold prayer-correspondence
      (Version C) stands.
    facsimile: null

  - id: lp-react-1881-burning-room
    genre: diaries
    pssTom: 49
    pages: "37–38"
    date: 1881-05-18
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol50/vol50.pdf
    extract: extracts/v49_037_038_1881_05_18.txt
    quoteRu: >-
      нельзя сказать «трудно» бежать из горящей комнаты в единственную дверь.
    quoteEn: >-
      one cannot say it is 'difficult' to run from a burning room through the only door. (working English)
    significance: >-
      The temperature of the conviction the prayer encodes (diary, May 1881): the gospel as the single
      door out of a burning house — the same fire-and-rescue register the sibling fire-metaphor dive
      traces (Luke 12:49). The entry also has "царство небесное" on earth and the household calling him
      a madman ("Кто-нибудь сумашедший — они или я").
    facsimile: null

