contradictions:
  - claim: "Tolstoy produced a single new translation of the Lord's Prayer."
    correction: >-
      Tom 24 holds at least four distinct Russian forms that agree in substance but differ in wording:
      the Matthew close-retranslation (lp-A-render), the Luke transformed version with the spirit-variant
      (lp-B-render), the twelve-fold preface correspondence (lp-C-surprise / lp-C-table-close), and the
      recitable body prayer (lp-Cbody-prayer) — plus the French Abrégé (lp-D-abrege). The prayer is a
      family of renderings, not one text.
    evidenceRef: lp-Cbody-prayer

notCovered:
  - "No line-by-line collation of the published English (Crowell 1896; Wiener 1904; Walter Scott 1895-96) or French against the Russian. Crowell 1896 is quoted as a period parallel from page-image OCR (reference-grade, not byte-verified); only the Russian is byte-verified. The English-lineage question is owned by the parent gospel-translation dive."
  - "The Greek column of the full harmony (Tolstoy prints Tischendorf's Greek above his Russian) is described but not transcribed."
  - "The long Édouard Reuss quotation Tolstoy embeds in the Matthew chapter (the French exegete on the prayer, quoted at length and partly against) is noted but not mined — it is Reuss's voice, not Tolstoy's."
  - "Swedish RECEPTION: no published Swedish translation of Tolstoy's prayer was sought or collated; the Swedish here is this dive's own working rendering. The broader 'Tolstoy's gospel work in Swedish' thread is flagged in the parent dive's notCovered (Walborg Hedberg / Bonnier 1891 etc.)."
  - "The autograph manuscript pages of the prayer chapters (State Tolstoy Museum) are not openly available; would have to be requested (same gap as the parent dive)."

needsReview:
  - item: "Crowell 1896 'judgment' for решение vs the twelve-fold table's разум ('reason') for слава: the Gospel in Brief gives TWO different replacements for 'glory' (разум in the preface table, решение in the body prayer). Both are Tolstoy's; the Swedish renders them förnuft and avgörande respectively."
    phase: 4
    why: "Worth a note in any wiki page: the 'glory' substitution is not fixed; confirm both readings stand in the 1957 Tom 24 text (they do in the TEI/local extract)."
  - item: "Manuscript sigla for the Luke 11:2 Holy Spirit variant (minuscules 700, 162) and the Gregory of Nyssa / Marcion attributions are from standard web reference (Wikipedia; etimasthe.com), not a critical apparatus checked in hand (NA28/Metzger)."
    phase: 3
    why: "Robust at the general level; confirm exact sigla against Metzger's Textual Commentary or NA28 before asserting numbers in a wiki page."
  - item: "Swedish rendering register and key word-choices (härlighet→förnuft/avgörande; namn→väsen; allenast; förledas) are this dive's editorial choices, flagged in index.md for the reader's adjustment."
    phase: 4
    why: "Translation is editorial; the reader (a Swedish speaker) should sign off on register before any publication of the Swedish text."

