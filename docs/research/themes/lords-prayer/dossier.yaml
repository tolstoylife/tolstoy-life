scholarship:
  summary: >-
    On the project as a whole the received view holds (Matual 1992; Wilson 1988): Tolstoy's gospel is
    a deliberately de-supernaturalized, ethics-first rendering, and the Lord's Prayer is a sharp
    specimen of it. Two of his specific prayer-choices, often read as idiosyncratic, stand up against
    text-critical scholarship: the Luke "Holy Spirit" reading is a genuine ancient variant (minuscules
    700, 162; Marcion; Gregory of Nyssa), and his "necessary" for ἐπιούσιος follows the ἐπί+οὐσία
    etymology behind the Vulgate "supersubstantialem." Where the dive extends the literature is the
    prayer's role as Tolstoy's INTERNAL PROOF of his twelve-chapter structure (rhetorical, rarely
    examined) and his reading of the model prayer as the ABOLITION of prayer (a stronger anti-liturgical
    move than the general "rationalist gospel" label conveys).
  triangulation:
    - evidenceRef: lp-B-variant-note
      conventionalView: "The Lukan 'May thy Holy Spirit come upon us and cleanse us' is a genuine ancient variant: attested in minuscules 700 and 162, in Marcion's Luke (c.150 CE), and expressly in Gregory of Nyssa (who says Luke has 'Holy Spirit' where Matthew has 'kingdom')."
      relation: confirms
      source: "Wikipedia, 'Textual variants in the Gospel of Luke' / 'Minuscule 700'; etimasthe.com on Gregory of Nyssa (2018)"
    - evidenceRef: lp-A-bread-note
      conventionalView: "ἐπιούσιος is a hapax across surviving Greek; the ἐπί+οὐσία etymology gives 'necessary for existence / supersubstantial' — the line behind Jerome's Vulgate 'supersubstantialem' (Matthew). Tolstoy's 'необходимый' tracks it."
      relation: confirms
      source: "Standard reference on ἐπιούσιος (hapax; Vetus Latina 'quotidianum' vs Vulgate 'supersubstantialem')"
    - evidenceRef: lp-C-surprise
      conventionalView: "Scholarship treats the harmony as confident rationalist exegesis; the prayer-as-proof-of-structure claim is Tolstoy's own internal warrant and is rarely examined as a rhetorical move."
      relation: extends
      source: "(the claim is in the Gospel in Brief preface; under-discussed in the accessible literature)"
    - evidenceRef: lp-abolish-question
      conventionalView: "The 'rationalist gospel' label (Matual 1992; Wilson 1988) captures the de-supernaturalizing but understates the specific reading of the model prayer as the abolition of petitionary prayer."
      relation: extends
      source: "Matual, Tolstoy's Translation of the Gospels (1992); Wilson, Tolstoy (1988)"

