# ─────────────────────────────────────────────────────────────────────────────
# CONTRADICTIONS — intra-corpus / primary-vs-secondary corrections.
# ─────────────────────────────────────────────────────────────────────────────
contradictions:
  - claim: "«Это ты» was NOT sent to Sholom Aleichem and is a separate later work (scholarship sweep, drawing on the 1906 first-publication date)."
    correction: "Tolstoy's own letter of 25 Aug 1903 (E12) shows he translated «Das bist du» and sent it to Sholom Aleichem for the almanac. Its documented first publication is 1906, but it WAS offered as a fourth contribution in 1903."
    evidenceRef: E12
  - claim: "The June 9 1903 diary plan «Крик беса при приближении Христа» is the seed of «Разрушение ада» (diary-sweep annotation)."
    correction: "«Разрушение ада» was already written in Nov 1902 – early 1903 (E22). The June 1903 «Крик беса» is a separate, later, unrealised devil-idea — chronology rules it out as the legend's seed."
    evidenceRef: E22
  - claim: "The illustrator of the 1903 Posrednik edition was 'Zhivago' (visuals sweep)."
    correction: "The PSS reads «с 9-ю иллюстрациями Н. И. Живого» — the illustrator is N. I. Zhivoy (Живой), not Zhivago."
    evidenceRef: E26

