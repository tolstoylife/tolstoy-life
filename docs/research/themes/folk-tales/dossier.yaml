# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). Mainstream = contrast, not baseline.
# Full sweep + sources: extracts/_scholarship.md.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    The 1903 tales are almost never the object of a study; they surface as support material inside
    discussions of Tolstoy's pogrom response, his nonviolence, or his anticlericalism. The dominant
    English container is Aylmer Maude's 1906 preface to Twenty-Three Tales, which classifies the trio
    from the start as occasioned charity texts ("stories Tolstoy contributed in aid of the Jews")
    rather than independent works of art. «Это ты»/«Асархадон»'s descent from the Theosophischer
    Wegweiser «Das bist du», the Leskov relay behind «Три вопроса», and «Разрушение ада» as a literary
    object are essentially untreated in English scholarship; the censorship arc (banned 1906/1910/1913,
    Russia 1917) appears in no English article found. The received Kishinev account (Popoff 2013; the
    standard biographies) stresses Tolstoy's active engagement but underemphasises the censorship
    constraint he himself named — that he could not say in legal Russian print what he told Sholom
    Aleichem. Schefski (1982, via Ivry 2014) notes the standing tension that Tolstoy, even here, engaged
    Jews non-fictionally and never inhabited a Jewish character in his fiction.
  triangulation:
    - evidenceRef: E25
      conventionalView: "The three tales are 'aid literature' — charitable gestures classified by their occasion (Maude 1906; Popoff 2013)."
      relation: complicates
      source: "Maude, A. 1906, preface to Twenty-Three Tales; Popoff, A. 2013, 'Tolstoy and Anti-Semitism'."
    - evidenceRef: E24
      conventionalView: "The «Das bist du» → «Это ты»/«Асархадон» source chain is noted as a fact but given no literary-critical reading in English scholarship."
      relation: extends
      source: "del Olmo 2023 (IPOA, Barcelona, partial); Theosophischer Wegweiser V/5 1903."
    - evidenceRef: E11
      conventionalView: "The Leskov relay (1887 «Цветник» sketch → «Час воли божией» 1890 → 1903) is treated as a biographical footnote, not interpreted."
      relation: extends
      source: "Wikipedia 'The Three Questions'; rvb.ru Leskov commentary."
    - evidenceRef: E22
      conventionalView: "«Разрушение ада» is read only as a by-product of the 1901 excommunication / anticlerical campaign, rarely as a literary object."
      relation: extends
      source: "Tishchenko 2017 (abstract only); MDPI Religions 2016 (inaccessible)."
    - evidenceRef: E03
      conventionalView: "Tolstoy's Kishinev response is presented as straightforwardly 'active' (Popoff 2013), eliding the censorship constraint he himself named."
      relation: complicates
      source: "Popoff 2013; Ivry 2014; Schefski 1982 (via Ivry)."
    - evidenceRef: E15
      conventionalView: "Scholarship treats Tolstoy's unity-of-life metaphysics as broadly 'Hindu scripture via Schopenhauer'; the specific theosophical-journal mediation is not examined."
      relation: extends
      source: "Love, J., 'Eastern Religion', in Tolstoy in Context (Cambridge, ed. Orwin); Kamalakaran, Russia Beyond 2014."

