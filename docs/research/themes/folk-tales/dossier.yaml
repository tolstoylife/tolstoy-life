topic:
  slug: 1903-folk-tales
  title: "The народные рассказы of 1903 — Tolstoy's folk tales after Kishinev"
  question: >-
    Tolstoy's return to the народный рассказ form in 1903, sixteen years after the Posrednik
    cycle: the genesis (the Kishinev pogrom and Sholom Aleichem's relief almanac), the moral core
    (the unity of all life — «это ты» / tat tvam asi), the shift of vehicle, the censorship of the
    anticlerical legend, and the place of the five tales in the What Is Art? arc opened by the
    parent dive on the 1881–87 tales.
  date: "2026-06-11"
  period: "1903 (with the legend's genesis in Nov 1902)"
  corpusSurface: "PSS Tom 34 (the five tales + their per-tale «История писания» commentary in texts_front/comments); Tom 54 (1903 diary); Tom 74 (1903 letters — the five to Sholom Aleichem + the Kishinev-mayor letter); Tom 88 (Chertkov letters, via commentary)"
  dateRange: "1902-11 – 1903-12 (composition + first publication)"

# ─────────────────────────────────────────────────────────────────────────────
# EVIDENCE — flat citation ledger. Every quoteRu is verbatim in its `extract`.
# ─────────────────────────────────────────────────────────────────────────────
evidence:
  # --- Genesis: Kishinev and the commission ---
  - id: E01
    genre: letter
    pssTom: 74
    pages: "111"
    date: "1903-05 (early)"
    addressee: "Kishinev city mayor (collective letter)"
    extract: extracts/v74_134_Kishinevskomugorodskomugolove.txt
    quoteRu: 'глубоко потрясенные совершенным недавно в городе Кишиневе злодеянием, мы выражаем наше болезненное сострадание невинным жертвам зверства толпы, наш ужас перед этими зверствами русских людей, невыразимое омерзение и отвращение к подготовителям и подстрекателям толпы и безмерное негодование против попустителей этого ужасного дела.'
    quoteEn: '(working English) deeply shaken by the atrocity recently committed in the town of Kishinev, we express our anguished compassion for the innocent victims of the mob''s savagery, our horror at these savageries of Russian people, our inexpressible loathing and revulsion at the instigators and inciters of the mob, and our boundless indignation at those who allowed this terrible deed.'
    significance: "Tolstoy's public condemnation of the April 1903 pogrom — the collective protest letter signed «Лев Толстой [и другие подписи]». The civic act that precedes the literary one."
    facsimile: null
  - id: E02
    genre: letter
    pssTom: 74
    pages: "118–119"
    date: "1903-05-06"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    extract: extracts/v74_144_S_H_RabinovichuSHolom_Alejxemu.txt
    quoteRu: 'Я очень рад буду содействовать вашему сборнику и постараюсь написать что-либо соответствующее обстоятельствам.'
    quoteEn: '(working English) I shall be very glad to contribute to your anthology and will try to write something suited to the circumstances.'
    significance: "Tolstoy agrees to Sholom Aleichem's request for the Jewish relief almanac — the commission that produces the three tales."
    facsimile: null
  - id: E03
    genre: letter
    pssTom: 74
    pages: "118–119"
    date: "1903-05-06"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    extract: extracts/v74_144_S_H_RabinovichuSHolom_Alejxemu.txt
    quoteRu: 'виновник не только кишиневских ужасов, но всего того разлада, который поселяется в некоторой малой части — и не народной — русского населения[…]одно правительство. К сожалению, этого-то я не могу сказать в русском легальном издании.'
    quoteEn: '(working English) the culprit not only of the Kishinev horrors but of all that discord which settles into a certain small — and not popular — part of the Russian population … is the government alone. Unfortunately, this is just what I cannot say in a legal Russian publication.'
    significance: "The political core, and the reason the answer must come as coded legend, not statement: Tolstoy blames the government for the pogrom but cannot say so in a legal Russian outlet. The censorship constraint that shapes the form."
    facsimile: null
  - id: E04
    genre: diary
    pssTom: 54
    pages: "169–170"
    date: "1903-04-29 (OS)"
    addressee: null
    extract: extracts/v54_169_170_1903_04_29.txt
    quoteRu: 'Написал письмо о Кишиневском событии и телеграмму.'
    quoteEn: '(working English) Wrote a letter about the Kishinev event, and a telegram.'
    significance: "The diary marks the civic response in late April 1903, before the tales are conceived."
    facsimile: null

  # --- The writing ---
  - id: E05
    genre: diary
    pssTom: 54
    pages: "187–188"
    date: "1903-07-21 (OS)"
    addressee: null
    extract: extracts/v54_187_188_1903_07_21.txt
    quoteRu: 'Пытался написать сказку, но не пошло.'
    quoteEn: '(working English) Tried to write a tale, but it would not come.'
    significance: "The first dated trace of work on the trio (per the PSS commentary, this is the attempt at «Асархадон»). The folk-tale form does not come easily after sixteen years."
    facsimile: null
  - id: E06
    genre: diary
    pssTom: 54
    pages: "188"
    date: "1903-07-25 (OS)"
    addressee: null
    extract: extracts/v54_188_188_1903_07_25.txt
    quoteRu: 'Написал три сказки. Еще плохо, но может быть порядочно.'
    quoteEn: '(working English) Wrote three tales. Still poor, but perhaps it may turn out decent.'
    significance: "GENESIS DATE — the three Kishinev tales first exist on paper, with the characteristic self-deprecation. The keystone of the composition record."
    facsimile: null
  - id: E07
    genre: diary
    pssTom: 54
    pages: "189"
    date: "1903-08-09 (OS)"
    addressee: null
    extract: extracts/v54_189_189_1903_08_09.txt
    quoteRu: 'Сказки кончил.'
    quoteEn: '(working English) Finished the tales.'
    significance: "Completion (followed by further revision and the wavering count — «не три, a две» on 20 Aug — before the third tale was restored to the set)."
    facsimile: null
  - id: E08
    genre: commentary
    pssTom: 34
    pages: "554–556"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_554_556_Tri_skazki_Assirijskij_tsar_Asarhadon_Tr.txt
    quoteRu: '«Три сказки» были написаны Толстым летом 1903 г. Сказки писались параллельно с рассказом «После бала».'
    quoteEn: '(working English) The "Three Tales" were written by Tolstoy in the summer of 1903. They were written in parallel with the story "After the Ball".'
    significance: "The PSS editorial framing: the three Kishinev tales are a coherent unit («Три сказки»), written together summer 1903."
    facsimile: null

  # --- The dispatch (the people network) ---
  - id: E09
    genre: letter
    pssTom: 74
    pages: "165–166"
    date: "1903-08-20"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    extract: extracts/v74_217_S_N_RabinovichuSHolom_Alejxemu.txt
    quoteRu: 'для перевода их на жаргон и напечатания в еврейском Сборнике, издаваемом в пользу пострадавших в Кишиневе евреев.'
    quoteEn: '(working English) for translation into Yiddish ["the jargon"] and printing in the Jewish anthology published in aid of the Jews who suffered in Kishinev.'
    significance: "Sends the first two tales (Esarhaddon + Three Questions). The tales go out first in Yiddish, to a non-Russian readership."
    facsimile: null
  - id: E10
    genre: letter
    pssTom: 74
    pages: "166"
    date: "1903-08-22"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    extract: extracts/v74_219_S_N_RabinovichuSHolom_Alejxemu.txt
    quoteRu: 'Я послал вам две сказки, отложив приготовленную для вашего Сборника третью[…]из боязни, что она будет запрещена.'
    quoteEn: '(working English) I sent you two tales, holding back the third I had prepared for your anthology … out of fear that it would be banned.'
    significance: "The third tale (Work, Death and Sickness) was held back, then sent — censorship anxiety operating inside the gift itself."
    facsimile: null
  - id: E11
    genre: letter
    pssTom: 74
    pages: "167–168"
    date: "1903-08-25"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    extract: extracts/v74_222_S_N_RabinovichuSHolom_Alejxemu.txt
    quoteRu: 'Мысль сказки Царь Ассархадон принадлежит не мне, а взята мною из сказки неизвестного автора, напечатанной в немецком журнале Theosophischer Wegweiser'
    quoteEn: '(working English) The idea of the tale "King Esarhaddon" is not mine but taken by me from a tale by an unknown author, printed in the German journal Theosophischer Wegweiser.'
    significance: "Tolstoy's own attribution of the Esarhaddon kernel to the German theosophical parable «Das bist du» — the same source as «Это ты»."
    facsimile: null
  - id: E12
    genre: letter
    pssTom: 74
    pages: "167–168"
    date: "1903-08-25"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    extract: extracts/v74_222_S_N_RabinovichuSHolom_Alejxemu.txt
    quoteRu: 'Сказка Das bist du так хороша, что желательно бы было познакомить с нею как можно больше людей, и потому я перевел ее и посылаю вам для перевода на жаргон и напечатание в Сборнике.'
    quoteEn: '(working English) The tale "Das bist du" is so good that it would be desirable to acquaint as many people as possible with it, and so I have translated it and am sending it to you for translation into Yiddish and printing in the anthology.'
    significance: "Corrects the secondary record: «Это ты» WAS offered to Sholom Aleichem's almanac (in Tolstoy's own translation) — not a separate later work. A fourth contribution alongside the trio."
    facsimile: null
  - id: E13
    genre: letter
    pssTom: 74
    pages: "182"
    date: "1903-09-07"
    addressee: "S. N. Rabinovich (Sholom Aleichem)"
    extract: extracts/v74_241_C_N_RabinovichuSHolom_Alejxemu.txt
    quoteRu: 'я не могу отступить от раз навсегда принятого мною правила предоставлять всем права печатания моих писаний. Отдаю я в пользу пострадавших поэтому только то, что могу отдать — право первого печатания.'
    quoteEn: '(working English) I cannot depart from the rule I once and for all adopted, of granting everyone the right to print my writings. I therefore give to the sufferers only what I can give — the right of first printing.'
    significance: "The copyright renunciation of 1891 in action: the relief fund receives only first-printing rights. Ties the cluster to the renunciation and the Posrednik economics of the parent dive."
    facsimile: null

  # --- What the tales say (keystone passages) ---
  - id: E14
    genre: work
    pssTom: 34
    pages: "126–130"
    date: "1903"
    addressee: null
    extract: extracts/v34_126_130_Assirijskij_tsar_Asarhadon.txt
    quoteRu: '— Да ведь Лаилиэ это ты, — сказал старец.'
    quoteEn: '(working English) "But Lailie is you," said the old man.'
    significance: "Esarhaddon — the hinge sentence. The king's victim IS the king; the same kernel («это ты») that names the twin tale."
    facsimile: extracts/v34_126_Asarhadon_p126_facsimile-166.png
  - id: E15
    genre: work
    pssTom: 34
    pages: "126–130"
    date: "1903"
    addressee: null
    extract: extracts/v34_126_130_Assirijskij_tsar_Asarhadon.txt
    quoteRu: 'Жизнь одна во всем, и ты проявляешь в себе только часть этой одной жизни.'
    quoteEn: '(working English) Life is one in all things, and you manifest in yourself only a part of this one life.'
    significance: "The старец's teaching — the unity-of-life doctrine stated in its purest narrative form. The metaphysical centre of the whole cluster."
    facsimile: null
  - id: E16
    genre: work
    pssTom: 34
    pages: "138–140"
    date: "1903"
    addressee: null
    extract: extracts/v34_138_140_Eto_ty.txt
    quoteRu: 'Все люди — братья, то есть все люди по существу своему один и тот же человек.'
    quoteEn: '(working English) All people are brothers — that is, all people are in essence one and the same person.'
    significance: "«Это ты» — the sage's formulation. The near-translation of «Das bist du» states the doctrine as bald proposition where Esarhaddon dramatises it."
    facsimile: null
  - id: E17
    genre: work
    pssTom: 34
    pages: "138–140"
    date: "1903"
    addressee: null
    extract: extracts/v34_138_140_Eto_ty.txt
    quoteRu: 'Это та истина, которую я хотел внушить тебе и которая выражается словами: это ты.'
    quoteEn: '(working English) This is the truth I wished to instil in you, and which is expressed in the words: this is you.'
    significance: "The title line — the tale names itself on the tat tvam asi formula."
    facsimile: null
  - id: E18
    genre: work
    pssTom: 34
    pages: "131–133"
    date: "1903"
    addressee: null
    extract: extracts/v34_131_133_Trud_smert_i_bolezn.txt
    quoteRu: 'труд не должен быть пугалом для одних и принудительной каторгой для других, а должен быть общим радостным делом, соединяющим людей'
    quoteEn: '(working English) labour should not be a bugbear for some and forced penal toil for others, but a common joyful undertaking that unites people.'
    significance: "Work, Death and Sickness — the resolution. God's three gifts were all meant to unite; the closing recognises the unity that separateness had subverted."
    facsimile: null
  - id: E19
    genre: work
    pssTom: 34
    pages: "134–137"
    date: "1903"
    addressee: null
    extract: extracts/v34_134_137_Tri_voprosa.txt
    quoteRu: 'самое важное дело — ему добро сделать, потому что только для этого послан человек в жизнь.'
    quoteEn: '(working English) the most important task is to do him good, because that alone is what a person is sent into life for.'
    significance: "The Three Questions — the hermit's answer. Love-in-the-present resolves all three questions; the most-quoted line of the cluster."
    facsimile: null
  - id: E20
    genre: work
    pssTom: 34
    pages: "100–115"
    date: "1902–1903"
    addressee: null
    extract: extracts/v34_100_115_Razrushenie_ada_i_vosstanovlenie_ego.txt
    quoteRu: 'Так переделал, что люди верят не в его ученье, а в мое, которое они называют его именем.'
    quoteEn: '(working English) I reworked it so that people believe not in his teaching but in mine, which they call by his name.'
    significance: "The Destruction of Hell — the devil-in-the-cape on how the Church rebuilt hell after Christ destroyed it: the faith is reworked and kept under Christ's name. The thesis of the satire."
    facsimile: null
  - id: E21
    genre: work
    pssTom: 34
    pages: "100–115"
    date: "1902–1903"
    addressee: null
    extract: extracts/v34_100_115_Razrushenie_ada_i_vosstanovlenie_ego.txt
    quoteRu: 'Дело шло хорошо, но я боялся, как бы они не увидали слишком очевидного обмана, и тогда я выдумал церковь.'
    quoteEn: '(working English) Things were going well, but I feared they might notice the too-obvious deception — and so I invented the Church.'
    significance: "The devil names the Church as his own invention. The line that made the legend unprintable in Russia until 1917."
    facsimile: null

  # --- Genesis of the legend and the theosophical source ---
  - id: E22
    genre: commentary
    pssTom: 34
    pages: "546–547"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_546_547_Razrushenie_ada_i_vosstanovlenie_ego_Ist.txt
    quoteRu: 'Легенда «Разрушение ада и восстановление его» была задумана Толстым как «иллюстрация» к статье «Обращение к духовенству». Источником легенды послужила одна из легенд, рассказанных Толстому в 1879 г. В. П. Щеголенком'
    quoteEn: '(working English) The legend "The Destruction of Hell and Its Restoration" was conceived by Tolstoy as an "illustration" to the article "Appeal to the Clergy". The source of the legend was one of the legends told to Tolstoy in 1879 by V. P. Shchegolyonok.'
    significance: "Two cross-links to the parent dive: the legend's source is the skazitel' Shchegolyonok (who supplied the 1880s tales), and it was conceived as the companion-illustration to «Обращение к духовенству». Its roots predate the 1901 excommunication by twenty years."
    facsimile: null
  - id: E23
    genre: commentary
    pssTom: 34
    pages: "546–547"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_546_547_Razrushenie_ada_i_vosstanovlenie_ego_Ist.txt
    quoteRu: 'В России легенда «Разрушение ада и восстановление его» впервые появилась только в 1917 г.'
    quoteEn: '(working English) In Russia the legend "The Destruction of Hell and Its Restoration" first appeared only in 1917.'
    significance: "First published abroad in 1903 («Свободное слово», England); banned in Russia in 1906, 1910 and 1913; legal in Russia only after 1917. The one tale of the cluster not printed in Russia in Tolstoy's lifetime."
    facsimile: null
  - id: E24
    genre: commentary
    pssTom: 34
    pages: "561"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_561_561_Eto_ty_Istorija_pisanija.txt
    quoteRu: 'Эта же сказка дала Толстому повод к написанию «Ассирийского царя Асархадона»'
    quoteEn: '(working English) This same tale gave Tolstoy the occasion for writing "Esarhaddon, King of Assyria".'
    significance: "«Это ты» (a near word-for-word translation of «Das bist du», Theosophischer Wegweiser 1903 №5) and «Асархадон» are twins from one theosophical root — the close translation and the original elaboration."
    facsimile: null
  - id: E25
    genre: commentary
    pssTom: 34
    pages: "554–556"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_554_556_Tri_skazki_Assirijskij_tsar_Asarhadon_Tr.txt
    quoteRu: '«Ассирийский царь Асархадон», «Труд, смерть и болезнь» и «Три вопроса», под общим заглавием «Три сказки», появились впервые (в переводе на идиш) в еврейском сборнике «Гилф. Литературный сборник с иллюстрациями», издание «Фолксбилдунг», Варшава, издательство «Тушия»'
    quoteEn: '(working English) "Esarhaddon, King of Assyria", "Work, Death and Sickness" and "The Three Questions", under the common title "Three Tales", first appeared (in Yiddish translation) in the Jewish anthology "Hilf: a Literary Collection with Illustrations", a Folksbildung edition, Warsaw, the Tushiya publishing house.'
    significance: "First publication of the trio — in Yiddish, in the «Гилф» relief almanac. (The PSS-given censorship date — 4 Aug 1903 — precedes Tolstoy's own dispatch of the tales on 20–25 Aug; an internal inconsistency, see needsReview.)"
    facsimile: null
  - id: E26
    genre: commentary
    pssTom: 34
    pages: "554–556"
    date: "1952 (PSS apparatus)"
    addressee: null
    extract: extracts/v34_554_556_Tri_skazki_Assirijskij_tsar_Asarhadon_Tr.txt
    quoteRu: 'На русском языке сказки «Ассирийский царь Асархадон» и «Три вопроса» («Труд, смерть и болезнь» была запрещена цензурой) появились впервые в издании'
    quoteEn: '(working English) In Russian, the tales "Esarhaddon, King of Assyria" and "The Three Questions" ("Work, Death and Sickness" was banned by the censorship) first appeared in the edition…'
    significance: "Asymmetric Russian reception: Esarhaddon + Three Questions printed in Russia 1903 (Posrednik, with 9 illustrations by N. I. Zhivoy); Work, Death and Sickness banned, first Russian printing 1906."
    facsimile: null

  # --- The metaphysical substrate (the 1903 diary) ---
  - id: E27
    genre: diary
    pssTom: 54
    pages: "154"
    date: "1903-01-06 (OS)"
    addressee: null
    extract: extracts/v54_154_154_1903_01_06.txt
    quoteRu: 'Какое счастие, что воспоминание исчезает со смертью и остается одно сознание'
    quoteEn: '(working English) What happiness, that memory disappears with death and consciousness alone remains.'
    significance: "Death-as-awakening — the world-picture of Work, Death and Sickness and of Esarhaddon's immersion, in the diary at the year's opening."
    facsimile: null
  - id: E28
    genre: diary
    pssTom: 54
    pages: "162–163"
    date: "1903-03-13 (OS)"
    addressee: null
    extract: extracts/v54_162_163_1903_03_13.txt
    quoteRu: 'мы, люди, проделываем в своем шару окошечки, через которые смотрим на Бога, — кто сбоку, кто снизу, кто сверху, но видим все одно и то же'
    quoteEn: '(working English) we people make little windows in our sphere, through which we look at God — one from the side, one from below, one from above — but we all see one and the same thing.'
    significance: "The окошечко (little-window) parable of religious tolerance — the same all-religions-see-one-God idea that the anticlerical legend turns into satire and the tales into ethics."
    facsimile: null
  - id: E29
    genre: diary
    pssTom: 54
    pages: "190–191"
    date: "1903-09-03 (OS)"
    addressee: null
    extract: extracts/v54_190_191_1903_09_03.txt
    quoteRu: 'я ошибаюсь не тогда, когда называю одного вместо другого, а тогда, когда считаю каждого отдельным существом.'
    quoteEn: '(working English) I err not when I name one person instead of another, but when I count each as a separate being.'
    significance: "The tat tvam asi insight in its sharpest diary form, written between the tales and their dispatch: the error is separateness itself. The private statement the tales encode for the public."
    facsimile: null

