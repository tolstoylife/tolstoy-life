entities:
  - name: "Народные рассказы (Tolstoy's folk tales)"
    wikiType: concept
    wikilinkTarget: "Narodnye rasskazy"
    vaultStatus: missing
    role: "The genre the dive is about, in its 1905–06 phase — the народный рассказ revived a third time, now as realist short fiction for the Круг чтения weekly-reading slot. Proposed by the parent dives (stories-for-the-people, 1903-folk-tales); extend with this third movement and the realist-return finding."
    sources: []
    evidenceRefs: [E01, E08, E20]
    ingestionPriority: 1
    dependsOn: []
  - name: "Недельное чтение (the Круг чтения weekly-reading slot)"
    wikiType: concept
    wikilinkTarget: "Nedelnoe chtenie"
    vaultStatus: missing
    role: "The structural feature of Круг чтения these six tales occupy: one narrative reading every seven days, 52 a year, renamed from «воскресные чтения» on Abrikosov's advice. The genre function — a narrative exhibit of a day's theme — and the censorship calculus (banned works re-entered here; the surplus «месячные чтения» passed only in German). The anthology Круг чтения itself merits its own works/ record (genre: anthology) — see needsReview."
    sources: []
    evidenceRefs: [E01, E03, E05]
    ingestionPriority: 1
    dependsOn: ["Народные рассказы (Tolstoy's folk tales)"]
  - name: "Ivan Gorbunov-Posadov (I. I. Gorbunov-Posadov)"
    wikiType: person
    wikilinkTarget: "Ivan Gorbunov-Posadov"
    vaultStatus: missing
    role: "Editor and head of Посредник; editor of Круг чтения, who placed the tales in the weekly-reading slots and coordinated their printing. Tried (8 Nov 1911) and sentenced to a year in a fortress for publishing the anthology after Tolstoy's death. The dive's principal new person."
    sources: []
    evidenceRefs: [E05, E07, E34]
    ingestionPriority: 1
    dependsOn: []
  - name: "Посредник (Posrednik publishing house)"
    wikiType: institution
    wikilinkTarget: "Posrednik"
    vaultStatus: missing
    role: "The cheap-editions publisher (co-founded by Tolstoy/Chertkov, 1884) that issued Круг чтения and so all six tales' first Russian printings. Proposed by the parent dives; extend with the anthology."
    sources: []
    evidenceRefs: [E07, E33]
    ingestionPriority: 2
    dependsOn: []
  - name: "Vladimir Chertkov"
    wikiType: person
    wikilinkTarget: "Vladimir Chertkov"
    vaultStatus: exists
    role: "Tolstoy's closest disciple and the abroad-channel publisher («Свободное слово»); supervised the foreign first printings of Божеское и человеческое (1906) and shaped its proof; keeper of the uncensored originals; edited the posthumous 1911 «Посмертные художественные произведения» that first printed Алёша Горшок. Extend the existing page."
    sources: []
    evidenceRefs: [E04, E06, E11, E31, E32, E34]
    ingestionPriority: 2
    dependsOn: []
  - name: "Vasily Shchegolenok (V. P. Shchegolenok)"
    wikiType: person
    wikilinkTarget: "Vasily Shchegolyonok"
    vaultStatus: missing
    role: "The Olonets skazitel' (folk reciter) who stayed at Yasnaya Polyana in 1879; oral source of Корней Васильев («ушедший странствовать от жены») and of the angel-legend behind Молитва. Proposed by the parent dives (which sourced his photo + Repin portrait); extend. NB transliteration in the vault may be «Vasily Shchegolyonok» — loose-match before marking missing."
    sources: []
    evidenceRefs: [E14, E17]
    ingestionPriority: 2
    dependsOn: []
  - name: "Sergei Maximov (S. V. Maximov)"
    wikiType: person
    wikilinkTarget: "Sergei Maximov"
    vaultStatus: missing
    role: "Ethnographer (1831–1901); his «Сибирь и каторга» (1871) is the documentary source of За что? (the Migurski Polish-exile case and the gauntlet scenes). New person."
    sources: []
    evidenceRefs: [E23]
    ingestionPriority: 2
    dependsOn: []
  - name: "Dmitri Lizogub"
    wikiType: person
    wikilinkTarget: "Dmitri Lizogub"
    vaultStatus: missing
    role: "Revolutionary (народоволец) hanged in Odessa 8 Aug 1879; the real prototype of Anatoly Svetlogub in Божеское и человеческое (via Stepnyak-Kravchinsky's «Подпольная Россия» and a typescript biography). New person."
    sources: []
    evidenceRefs: [E29]
    ingestionPriority: 2
    dependsOn: []
  - name: "Capital punishment (smertnaya kazn)"
    wikiType: concept
    wikilinkTarget: "Capital punishment"
    vaultStatus: missing
    role: "The doctrine these tales prosecute: За что? (the gauntlet, state torture) and Божеское и человеческое (the gallows, the destroyed executioner) condemn the death penalty in narrative — the same matter as «Не могу молчать» (1908), written amid the 1905–06 executions. Links the cluster to the late anti-death-penalty writing."
    sources: []
    evidenceRefs: [E22, E27, E36]
    ingestionPriority: 2
    dependsOn: []
  - name: "Nicholas I"
    wikiType: person
    wikilinkTarget: "Nicholas I"
    vaultStatus: missing
    role: "Emperor (r. 1825–1855); named and condemned by name in За что?'s closing portrait as the vain, self-deceived author of the Migurskis' destruction. A historical person appearing as a named figure in the fiction (cf. the Father Sergius dive's Nicholas-I-as-person precedent)."
    sources: []
    evidenceRefs: [E22]
    ingestionPriority: 3
    dependsOn: []
  - name: "Alyosha the Pot (Alyosha Gorshok)"
    wikiType: character
    wikilinkTarget: "Alyosha the Pot"
    vaultStatus: missing
    role: "The title character of Алёша Горшок — the uncomplaining («безответный») peasant lad whose one revelation is being loved for himself, who dies without protest. prototypes[]: the real half-witted helper-cook/yard-man at Yasnaya Polyana in the 1860s (E10)."
    sources: []
    evidenceRefs: [E08, E09, E10]
    ingestionPriority: 3
    dependsOn: []
  - name: "Anatoly Svetlogub"
    wikiType: character
    wikilinkTarget: "Anatoly Svetlogub"
    vaultStatus: missing
    role: "The executed revolutionary of Божеское и человеческое, transformed by the Gospel into the «божеское» pole of the title. prototypes[]: Dmitri Lizogub (E29); the name evolved Синегуб → Светлогуб."
    sources: []
