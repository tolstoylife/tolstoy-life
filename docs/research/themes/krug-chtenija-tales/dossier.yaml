scholarship:
  summary: >-
    The 1905–06 weekly-reading tales fall almost entirely outside the English-language Tolstoy canon and
    are treated, when noticed, as a minor appendage to the anthology's aphoristic apparatus. The received
    English frame de-politicises them (Sekirin's spiritualising 2000 Zondervan edition; the 1997 Calendar
    of Wisdom that drops all 52 weekly stories) and homogenises the late tales as uniform "didactic/parabolic"
    prose. Gordon Spence's 2000 Northwestern edition is the one English framing to foreground "the political
    import and allegory… written around the Russian revolution of 1905". D. S. Mirsky (1926) calls Алёша
    Горшок "one of his most perfect creations" — the high-water mark of English praise for any of the six.
    The Gorbunov-Posadov trial has effectively no independent English footprint. Mainstream read as contrast.
  triangulation:
    - evidenceRef: E08
      conventionalView: "The late weekly-reading stories are generically uniform 'didactic/parabolic' prose, continuous with the 1880s folk tales (Kirkus 2000: 'heavily moralistic… many structured as parables'; Semmens 1968 names only Alyosha as a realist reversion)."
      relation: extends
      source: "Semmens 1968 (ourcivilisation.com digest); Kirkus Reviews 2000; PSS т.42 commentary."
    - evidenceRef: E02
      conventionalView: "The English reception de-politicises the anthology ('lovely artifacts', spiritual insight — Publishers Weekly 2000; Sekirin/Zondervan). Only Spence (2000) foregrounds the 1905-revolution politics, and only for his three tales."
      relation: extends
      source: "Spence 2000 (Northwestern, intro); Publishers Weekly 2000; PSS т.42 general apparatus (Spiridonov)."
    - evidenceRef: E07
      conventionalView: "The Gorbunov-Posadov prosecution is effectively undocumented in English: the English Wikipedia article omits it; Troyat/Wilson/Bartlett do not use it as a named episode."
      relation: extends
      source: "PSS т.42 general apparatus (Spiridonov) — primary; no English secondary located."
    - evidenceRef: E08
      conventionalView: "Алёша Горшок is a late masterpiece of simplicity; Mirsky (1926) 'one of his most perfect creations'; Pine (2020) links it to the What Is Art? infection ideal."
      relation: confirms
      source: "Mirsky 1926; Pine 2020 (Ploughshares); PSS т.36 (Mishin) — corpus extends with the compositional record (4 days, excluded, Kuzminskaya's protest)."
  translationStatus:
    note: >-
      Only Алёша Горшок had a published English translation before 2000 (Hagberg Wright 1912; Maude
      c.1922 / Oxford Centenary; Clarence Brown 1985). The other five first appeared in English in 2000,
      in two parallel editions both titled "Divine and Human and Other Stories" — Peter Sekirin (Zondervan)
      and Gordon Spence (Northwestern UP). None of the six is in Maude's Twenty-Three Tales. Do NOT claim the
      dive's working glosses are "first English"; the accurate claim is that the tales had no English home
      until 2000 (and remain absent from the English Круг чтения, whose Calendar of Wisdom omits all weekly stories).
    perTale:
      - { tale: "Алёша Горшок", status: translated-complete, english: "Hagberg Wright 1912; Maude c.1922; Clarence Brown 1985" }
      - { tale: "Корней Васильев", status: translated-complete, english: "Sekirin 2000 (a prior unidentified translation asserted by Sekirin — unverified)" }
      - { tale: "Молитва", status: translated-complete, english: "Sekirin 2000 ('The Prayer'); no pre-2000 standalone located" }
      - { tale: "Ягоды", status: translated-complete, english: "Sekirin 2000 + Spence 2000 ('Berries'); no pre-2000 standalone located" }
      - { tale: "За что?", status: translated-complete, english: "Sekirin 2000 ('Why Did It Happen?') + Spence 2000 ('What For?'); no pre-2000 standalone located" }
      - { tale: "Божеское и человеческое", status: translated-complete, english: "Sekirin 2000 + Spence 2000 ('Divine and Human'); abroad 1906 Russian-journal translations from an unnamed English intermediary; no pre-2000 standalone English located" }

