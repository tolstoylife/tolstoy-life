topic:
  slug: 1905-1906-krug-chtenija-tales
  title: "The народный рассказ in Круг чтения — Tolstoy's 1905–06 weekly-reading tales"
  question: >-
    Tolstoy's third movement of the народный рассказ form: the six original tales written in 1905–06
    for the weekly-reading (недельное чтение) slot of the anthology Круг чтения — Алёша Горшок,
    Корней Васильев, Ягоды, Молитва, За что?, Божеское и человеческое. What they say; how, when and
    why they were written (amid the 1905 revolution and its executions); their genre swing back to
    realist fiction after the 1903 parables; the anthology-as-channel and its censorship logic; and
    the works-record proposals each needs (none exists yet).
  date: "2026-06-12"
  period: "1905–1906 (Божеское и человеческое conceived 1897, first drafted 1903)"
  corpusSurface: >-
    PSS Tom 36 (Алёша Горшок + comm.); Tom 41 (Корней Васильев, Ягоды, Молитва — the texts); Tom 42
    (За что?, Божеское и человеческое — the texts + ALL six tales' «История писания» commentary +
    the Круг чтения general history); the reversed-title draft «Человеческое и божеское» (Набросок,
    Tom 54); Tom 55 (1904–06 diary); Toms 75–76 + 89 (1905–06 letters — Gorbunov-Posadov, Chertkov,
    Biryukov, family).
  dateRange: "1903-12 – 1911 (composition of the earliest draft → posthumous first printing of Алёша Горшок)"

# ─────────────────────────────────────────────────────────────────────────────
# EVIDENCE — flat citation ledger. Every quoteRu is verbatim in its `extract`
# (substring; verify_quotes.py exit 0). Working-English labelled.
# ─────────────────────────────────────────────────────────────────────────────
evidence:
  # ─── The anthology & the недельное чтение slot (the channel) ───
  - id: E01
    genre: commentary
    pssTom: 42
    pages: "557–583"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_557_583_Krug_chtenija_general.txt
    quoteRu: 'Толстой сначала называл эти выдержки «воскресными чтениями», но потом по совету помогавшего ему в работе Х. Н. Абрикосова решил называть их «недельными чтениями». Таких «недельных чтений» должно было быть всего, по числу недель в году, пятьдесят два.'
    quoteEn: '(working English) Tolstoy first called these excerpts "Sunday readings", but then, on the advice of his helper Kh. N. Abrikosov, decided to call them "weekly readings". There were to be fifty-two such "weekly readings" in all, one for each week of the year.'
    significance: "The structural slot the six tales occupy: one narrative reading every seven days, 52 in the year. The renaming «воскресные»→«недельные» (Abrikosov's suggestion) is the slot's identity. Excerpts were drawn from Tolstoy's own and others' fiction (even Turgenev, Herzen, Dostoevsky, Chekhov, Leskov — abridged)."
    facsimile: null
  - id: E02
    genre: commentary
    pssTom: 42
    pages: "557–583"
    date: "1957 (PSS apparatus, quoting Tolstoy)"
    addressee: null
    extract: extracts/c_v42_557_583_Krug_chtenija_general.txt
    quoteRu: 'я имею в виду именно нецензурное и постараюсь сохранить то, что вычеркнет цензура'
    quoteEn: '(working English) in composing the Circle of Reading I have in mind precisely the uncensorable, and shall try to preserve what the censor would strike out.'
    significance: "MARQUEE — the encryption thesis in Tolstoy's own words for the anthology: he built Круг чтения intending to keep what the censor would cut. The weekly-reading tales are part of that design."
    facsimile: null
  - id: E03
    genre: commentary
    pssTom: 42
    pages: "557–583"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_557_583_Krug_chtenija_general.txt
    quoteRu: 'Однако в русском издании поместить их оказалось невозможным, так как ни одно из них не могло быть пропущено цензурой. Вследствие этого месячные чтения появились только в немецком переводе «Круга чтения», сделанном А. Шкарваном и изданном в Дрездене в 1907 г.'
    quoteEn: '(working English) But it proved impossible to include them [the monthly readings] in the Russian edition, since not one of them could pass the censorship. As a result the monthly readings appeared only in the German translation of the Circle of Reading, made by A. Škarvan and published in Dresden in 1907.'
    significance: "The censorship pressure on the anthology made concrete: the surplus «месячные чтения» could not pass the Russian censor at all and survived only in the 1907 German Dresden edition. The encryption was real and only partly successful."
    facsimile: null
  - id: E04
    genre: letter
    pssTom: 89
    pages: "—"
    date: "1905-04-17"
    addressee: "V. G. Chertkov"
    extract: extracts/v89_738_Chertkovu_apr17_1905.txt
    quoteRu: 'Всё это, вероятно, не пройдет в России, но может быть напечатано за границей.'
    quoteEn: '(working English) All this will probably not get through in Russia, but it can be printed abroad.'
    significance: "ANCHOR (channel). Said of the Круг чтения prefaces and недельные чтения materials — Tolstoy writes that he has «написал один [рассказ] и не кончил» for it, and that this anthology material will not pass in Russia but can be printed abroad. The abroad-channel (Chertkov) is built into the weekly-reading plan."
    facsimile: null
  - id: E05
    genre: letter
    pssTom: 76
    pages: "—"
    date: "1905-09-25"
    addressee: "I. I. Gorbunov-Posadov"
    extract: extracts/v76_053_Gorbunovu_sep25_1905.txt
    quoteRu: 'Вообще недурно бы в Чтения выбирать из запрещенных моих, когда нужно заменить.'
    quoteEn: '(working English) In general it would not be a bad idea to draw on my banned works for the Readings, when something needs replacing.'
    significance: "ANCHOR (channel). The same letter reports «Ягоды — поправил». Tolstoy proposes filling the weekly-reading slots from his BANNED works — the anthology as a re-entry route for censored material into legal Russian print."
    facsimile: null
  - id: E06
    genre: letter
    pssTom: 76
    pages: "—"
    date: "1906-04-01"
    addressee: "E. V. Gertsik"
    extract: extracts/v76_179_Gerciku_apr1_1906.txt
    quoteRu: 'Я давно уже отказался от права собственности на все мои сочинения, вышедшие после 1891 года'
    quoteEn: '(working English) I long ago renounced the right of property in all my writings published after 1891.'
    significance: "The 1891 copyright renunciation in force over this cluster: Tolstoy holds no property in these tales and points the publisher to Chertkov as keeper of the uncensored originals. Ties the cluster to the copyright-renunciation dive and the Posrednik economics."
    facsimile: null
  - id: E07
    genre: commentary
    pssTom: 42
    pages: "557–583"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_557_583_Krug_chtenija_general.txt
    quoteRu: 'И. И. Горбунов-Посадов был признан виновным и присужден к заключению в крепости на один год.'
    quoteEn: '(working English) I. I. Gorbunov-Posadov was found guilty and sentenced to one year of imprisonment in a fortress.'
    significance: "MARQUEE — the prosecution arc. After Tolstoy's death the anthology's editor was tried (8 Nov 1911, the day after the first anniversary of Tolstoy's death) for publishing Круг чтения and sentenced to a year in a fortress; the seizure was lifted only after destroying 12 specified passages. The encryption did not finally protect it."
    facsimile: null

  # ─── Алёша Горшок ───
  - id: E08
    genre: work
    pssTom: 36
    pages: "54–58"
    date: "1905"
    addressee: null
    extract: extracts/v36_054_058_Alesha_Gorshok.txt
    quoteRu: 'есть еще отношения совсем особенные: не то чтобы нужно было человеку вычистить сапоги, или снести покупку, или запречь лошадь, а то, что человек так, ни зачем нужен другому человеку, нужно ему послужить, его приласкать, и что он, Алеша, тот самый человек.'
    quoteEn: '(working English) there are also quite special relations: not that a person needs his boots cleaned, or a purchase carried, or a horse harnessed, but that a man is simply needed by another man for no reason at all, that one should serve him, show him tenderness — and that he, Alyosha, is that very man.'
    significance: "Алёша Горшок's single revelation — the «самое необыкновенное событие» of his life: that he himself, not his labour, is wanted by another (the cook Ustinya's pity-become-love). The whole tale carries its meaning through character and action, no statement — the What Is Art? «infection» ideal made flesh."
    facsimile: extracts/v36_055_Alesha_autograph_plate-068.png
  - id: E09
    genre: work
    pssTom: 36
    pages: "54–58"
    date: "1905"
    addressee: null
    extract: extracts/v36_054_058_Alesha_Gorshok.txt
    quoteRu: 'А в сердце у него было то, что как здесь хорошо, коли слушаешь и не обижаешь, так и там хорошо будет.'
    quoteEn: '(working English) And in his heart there was this: that just as it is good here, if you obey and do not wrong anyone, so it will be good there too.'
    significance: "The death of Alyosha — pure acceptance, no fear, no complaint. He dies «Удивился чему-то, потянулся и помер» (he wondered at something, stretched out, and died). The radiant late-Tolstoyan ideal of the man without self-will."
    facsimile: null
  - id: E10
    genre: commentary
    pssTom: 36
    pages: "582–583"
    date: "1936 (PSS apparatus, V. S. Mishin)"
    addressee: null
    extract: extracts/c_v36_582_583_Alesha_Gorshok.txt
    quoteRu: 'Алеша Горшок — живое лицо.'
    quoteEn: '(working English) Alyosha Gorshok is a real person.'
    significance: "The tale's real-life basis: a half-witted helper-cook and yard-man («помощник повара и дворник») at Yasnaya Polyana in the 1860s, remembered in T. A. Kuzminskaya's memoir and S. A. Tolstaya's 1863 diary. A realist character study from life, not an invented parable."
    facsimile: null
  - id: E11
    genre: commentary
    pssTom: 36
    pages: "582–583"
    date: "1936 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v36_582_583_Alesha_Gorshok.txt
    quoteRu: 'Впервые рассказ напечатан в I томе «Посмертных художественных произведений Л. Н. Толстого» под редакцией В. Г. Черткова, Москва 1911.'
    quoteEn: '(working English) The story was first printed in vol. I of "Posthumous Artistic Works of L. N. Tolstoy", edited by V. G. Chertkov, Moscow 1911.'
    significance: "Алёша Горшок was EXCLUDED by Tolstoy from Круг чтения (written for it late Feb 1905, then dropped) and first published posthumously in 1911. The one tale of the six Tolstoy never saw in print. publishedDuringLifetime = false."
    facsimile: null

  # ─── Корней Васильев ───
  - id: E12
    genre: work
    pssTom: 41
    pages: "205–220"
    date: "1905"
    addressee: null
    extract: extracts/v41_205_220_Kornej_Vasilev.txt
    quoteRu: 'умиленная слабость вдруг овладела им.'
    quoteEn: '(working English) a tender weakness suddenly came over him.'
    significance: "Корней Васильев's spiritual hinge — returning a broken beggar to the house of the wife he beat and the daughter he maimed seventeen years before, the lifelong hatred he carried simply dissolves. Repentance dramatized, not preached."
    facsimile: null
  - id: E13
    genre: work
    pssTom: 41
    pages: "205–220"
    date: "1905"
    addressee: null
    extract: extracts/v41_205_220_Kornej_Vasilev.txt
    quoteRu: 'прощает ли он, или еще гневается.'
    quoteEn: '(working English) whether he forgives, or is still angry.'
    significance: "The realist refusal of a tidy moral close: Marfa walks to make peace and arrives one hour too late; the dead face gives no verdict. The dying Korney's «Гаша, … время мое доспело. Я помирать хочу. Так вот ты прости меня Христа ради» (asking forgiveness of the child he maimed) is the repentance; the unanswering corpse is the irony."
    facsimile: null
  - id: E14
    genre: commentary
    pssTom: 42
    pages: "599–605"
    date: "1957 (PSS apparatus, A. I. Nikiforov)"
    addressee: null
    extract: extracts/c_v42_599_605_Kornej_Vasilev.txt
    quoteRu: 'Рассказ, как это видно по черновым рукописям, переделывался автором тринадцать раз.'
    quoteEn: '(working English) The story, as the draft manuscripts show, was reworked by the author thirteen times.'
    significance: "Корней's labour and source: a plot Tolstoy carried for years from the skazitel' V. P. Shchegolenok (who stayed at Yasnaya Polyana in 1879 — the same oral source that fed the 1880s tales of the parent dive); first on the Feb-1905 list of «рассказов к воскресеньям» as «ушедший странствовать от жены»; reworked 13 times. First title «Чем был и чем стал»."
    facsimile: null

  # ─── Молитва ───
  - id: E15
    genre: work
    pssTom: 41
    pages: "128–133"
    date: "1905"
    addressee: null
    extract: extracts/v41_128_133_Molitva.txt
    quoteRu: 'Ты ведь не знаешь, чем он был бы, если бы остался жив. А я знаю.'
    quoteEn: '(working English) You do not know what he would have been, had he lived. But I know.'
    significance: "Молитва's doctrinal core — a grieving mother, her three-year-old dead of «водянка в голове», dreams that the angel-being shows her the debauched old man her boy would have become. Theodicy in narrative: death as mercy, the future unknowable, prayer answered by «по-своему, а не по ее». The nanny closes it: «А жив бы был, кто знает, что бы было»."
    facsimile: null
  - id: E16
    genre: work
    pssTom: 41
    pages: "128–133"
    date: "1905"
    addressee: null
    extract: extracts/v41_128_133_Molitva.txt
    quoteRu: 'Вот сейчас по всей России молятся, да какие люди! Самые первые архиереи, монахи в соборах, в церквах над мощами, все молятся, чтобы бог дал победы над японцами.'
    quoteEn: '(working English) Right now all over Russia people are praying — and what people! The very highest bishops, monks in the cathedrals, in the churches over the relics, all praying that God grant victory over the Japanese.'
    significance: "KEYSTONE VARIANT — this passage (the Russo-Japanese war prayer, with «Японцы тоже молятся, чтобы им победить» just after) is the exact span the censor cut from the 2nd edition of Круг чтения (E17). The 1905 war dates the tale and supplies its sharpest anticlerical-pacifist edge — the one the censor removed."
    facsimile: null
  - id: E17
    genre: commentary
    pssTom: 42
    pages: "594–597"
    date: "1957 (PSS apparatus, V. S. Spiridonov)"
    addressee: null
    extract: extracts/c_v42_594_597_Molitva.txt
    quoteRu: 'Во втором издании «Круга чтения» подверглось цензурному изъятию одно место в «Молитве» — от слов: «Вот сейчас» кончая словами: «Японцы тоже молятся, чтобы им победить»'
    quoteEn: '(working English) In the second edition of the Circle of Reading one passage in "A Prayer" was subjected to censorship excision — from the words "Right now" to the words "the Japanese too pray that they may win".'
    significance: "The censor's cut, located exactly (E16 is the cut span). The tale's source is a Shchegolenok legend of the angel who kills an infant who would have grown corrupt; the apparatus notes a likely autobiographical echo — Tolstoy's own infant son Nikolushka died 20 Feb 1875 of the same illness («водянка»). Молитва replaced the legend «Три старца» in the slot."
    facsimile: null

  # ─── Ягоды ───
  - id: E18
    genre: work
    pssTom: 41
    pages: "450–460"
    date: "1905"
    addressee: null
    extract: extracts/v41_450_460_Jagody.txt
    quoteRu: 'но собеседники всё курили и разговаривали, разговаривали и курили.'
    quoteEn: '(working English) but the companions kept on smoking and talking, talking and smoking.'
    significance: "Ягоды's satirical nerve — the dacha gentry (a Slavophile landowner and his Petersburg liberal friend) debate Russia's constitutional future all night to no effect, while the peasant children gather berries at dawn in a luminous scene of real life and real work. The 1905 constitutional moment rendered as gentry self-importance. The tale ends with everyone in the gentry house «доволен», incl. «Валя был доволен тем, что съел целую тарелку земляники» — the spoiled child eating the children's berries."
    facsimile: null
  - id: E19
    genre: diary
    pssTom: 55
    pages: "146"
    date: "1905-06-12 (OS)"
    addressee: null
    extract: extracts/v55_146_147_1905_06_12.txt
    quoteRu: 'Написал в два дня рассказ: Ягоды. Не дурно.'
    quoteEn: '(working English) Wrote a story in two days: Berries. Not bad.'
    significance: "The composition record for Ягоды (written 10–11 June 1905). The same period diaries carry the tale's exact moral nerve — «болею своим довольством» (I am sick with my own comfort [amid surrounding need]) — the gentry/peasant contrast lived before it is written."
    facsimile: null

  # ─── За что? ───
  - id: E20
    genre: work
    pssTom: 42
    pages: "84–106"
    date: "1906"
    addressee: null
    extract: extracts/v42_084_106_Za_chto.txt
    quoteRu: 'Опять бессмысленно повинующиеся десятки тысяч русских людей были пригнаны в Польшу'
    quoteEn: '(working English) Again, tens of thousands of senselessly obedient Russian people were driven into Poland…'
    significance: "За что?'s explicit indictment of the regime — the state as senseless, blood-soaked coercion (under Diebitsch, Paskevich, «и высшего распорядителя Николая I») serving «корыстолюбия и ребяческого тщеславия». The political core of the cluster, carried by a historical-fiction frame a treatise could not."
    facsimile: null
  - id: E21
    genre: work
    pssTom: 42
    pages: "84–106"
    date: "1906"
    addressee: null
    extract: extracts/v42_084_106_Za_chto.txt
    quoteRu: 'За что? за что? — думала она'
    quoteEn: '(working English) For what? for what? — she thought…'
    significance: "The title-question located, at the grave of the Migurskis' two dead children: the innocent want only «чтоб ему жить так, как он родился и жили его деды и прадеды» — and power takes it from them. «За что?» recurs as the cluster's cry against the state (it echoes again at the foiled escape). State torture appears in documentary close-up — the gauntlet of «высочайше утвержденной толщины» (a thickness approved at the highest level)."
    facsimile: null
  - id: E22
    genre: work
    pssTom: 42
    pages: "84–106"
    date: "1906"
    addressee: null
    extract: extracts/v42_084_106_Za_chto.txt
    quoteRu: 'задавил гидру революции не только в Польше'
    quoteEn: '(working English) [Nicholas Pavlovich rejoiced that he had] crushed the hydra of revolution not only in Poland [but in all Europe]…'
    significance: "The closing portrait: Nicholas I named and skewered — the author of the human catastrophe who believes himself a great benefactor, «на развращение и одурение которых были бессознательно направлены все его силы». The most directly censorship-sensitive sentence in the cluster — a named Tsar condemned in fiction."
    facsimile: null
  - id: E23
    genre: commentary
    pssTom: 42
    pages: "626–643"
    date: "1957 (PSS apparatus, B. M. Eikhenbaum)"
    addressee: null
    extract: extracts/c_v42_626_643_Za_chto.txt
    quoteRu: 'Альбина и Мигурский являются действительными личностями; сохранены не только их имена, но и события их жизни.'
    quoteEn: '(working English) Albina and Migurski are real persons; not only their names but the events of their lives are preserved.'
    significance: "Source confirmed: «Источником рассказа «За что?» послужил труд писателя-этнографа С. В. Максимова «Сибирь и каторга»» — Tolstoy read Maximov 18 Jan 1906 («Чудные сюжеты»). The Polish exiles Wincenty Migurski and Albina are real; Tolstoy researched the 1830 uprising via Baudouin de Courtenay, Shakhmatov, Stasov (17 vols). Historical realism, documented."
    facsimile: null
  - id: E24
    genre: commentary
    pssTom: 42
    pages: "626–643"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_626_643_Za_chto.txt
    quoteRu: 'Текст рассказа был переделан Толстым пятнадцать раз'
    quoteEn: '(working English) The text of the story was reworked by Tolstoy fifteen times.'
    significance: "The labour and its direction: the centre of Tolstoy's reworking was «углубление психологического анализа… в связи с обличением деспотизма николаевской эпохи» (deepening the psychological analysis in connection with the exposure of the despotism of the Nicholas era). In proof he sharpened the Polish-patriot register («русские»→«москали»). First title «Непоправимо»."
    facsimile: null
  - id: E25
    genre: letter
    pssTom: 76
    pages: "—"
    date: "1906-02-13"
    addressee: "A. L. Tolstaya (daughter)"
    extract: extracts/v76_139_A_L_Tolstoj_feb13_1906.txt
    quoteRu: 'Я написал маленький рассказ «За что», кажется, без тебя. Нехорошо.'
    quoteEn: '(working English) I wrote a little story, "What For", it seems while you were away. Not good.'
    significance: "The one naming of За что? in the surviving correspondence, fixing the writing to early 1906 and carrying the period's self-deprecation («Нехорошо»). The tale was written amid the 1905–06 revolution and executions (see E35–E36)."
    facsimile: null

  # ─── Божеское и человеческое ───
  - id: E26
    genre: work
    pssTom: 42
    pages: "194–227"
    date: "1903–1905"
    addressee: null
    extract: extracts/v42_194_227_Bozheskoe_i_chelovecheskoe.txt
    quoteRu: 'именно, отдать душу свою; не сберечь, а отдать. В этом радость, в этом жизнь.'
    quoteEn: '(working English) precisely, to give up one''s soul; not to save it, but to give it. In this is joy, in this is life.'
    significance: "The spiritual centre — the condemned revolutionary Svetlogub, reading the Gospel in his cell, finds the Sermon-on-the-Mount logic of giving (not saving) the soul. His transformation is the «божеское» (divine) pole of the title; he goes to the gallows in «умиленно торжественное» peace."
    facsimile: null
  - id: E27
    genre: work
    pssTom: 42
    pages: "194–227"
    date: "1903–1905"
    addressee: null
    extract: extracts/v42_194_227_Bozheskoe_i_chelovecheskoe.txt
    quoteRu: 'прости им, они не знают, что творят.'
    quoteEn: '(working English) forgive them, they know not what they do.'
    significance: "Svetlogub's letter to his mother extends Gospel forgiveness to both his comrades and his executioners — non-resistance and enemy-love made personal, at the foot of the scaffold. The tale indicts capital punishment in procedural detail (the general signing the warrant; the hangman destroyed by the act — «и не жалко тебе меня?») — the matter of «Не могу молчать» (1908) in narrative form."
    facsimile: null
  - id: E28
    genre: work
    pssTom: 42
    pages: "194–227"
    date: "1903–1905"
    addressee: null
    extract: extracts/v42_194_227_Bozheskoe_i_chelovecheskoe.txt
    quoteRu: 'Тело Меженецкого снесли в мертвецкую и положили на нары рядом с телом старика раскольника.'
    quoteEn: '(working English) Mezhenetsky''s body was carried to the mortuary and laid on the boards beside the body of the old Old-Believer.'
    significance: "The closing image and the title's argument in one sentence: the revolutionary Mezhenetsky, who answered the world with force and злоба, hangs himself; the Old-Believer, who sought the faith of the radiant youth, dies in vision. The «человеческое» (force, the state, revolution) and the «божеское» (faith, love) laid side by side. The tale condemns the executing state AND the revolutionary terror — neither is the divine."
    facsimile: null
  - id: E29
    genre: commentary
    pssTom: 42
    pages: "645–665"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_645_665_Bozheskoe_i_chelovecheskoe.txt
    quoteRu: 'В Одессе 8 августа 1879 г. были повешены по обвинению в подготовке покушения на Александра II трое революционеров — Лизогуб, Чубаров и Давиденко.'
    quoteEn: '(working English) In Odessa on 8 August 1879 three revolutionaries — Lizogub, Chubarov and Davidenko — were hanged on a charge of preparing an attempt on Alexander II.'
    significance: "Source of Svetlogub: the real Dmitri Lizogub, hanged Odessa 1879, known to Tolstoy through Stepnyak-Kravchinsky's «Подпольная Россия» and a typescript biography among his papers. Conceived late 1897 («казнь в Одессе»); first tried as the cut «Синегуб» episode of Resurrection; «прежде чем написать слово «Синегуба», Толстой… механически написал «Лизо», затем зачеркнул»."
    facsimile: null
  - id: E30
    genre: commentary
    pssTom: 42
    pages: "645–665"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_645_665_Bozheskoe_i_chelovecheskoe.txt
    quoteRu: 'озаглавленный им «Человеческое и божеское»'
    quoteEn: '(working English) [a story] entitled by him "The Human and the Divine".'
    significance: "TEXTUAL HISTORY — the title was reversed. The first written form (30 Dec 1903, on the blank end-pages of the diary, Tom 54) put the human first: «Человеческое и божеское». In reworking it cycled to «Божеское и человеческое», then «Еще три смерти», then back. 49 manuscript/proof units. The final order — divine first — is the verdict the tale reaches."
    facsimile: null
  - id: E31
    genre: letter
    pssTom: 89
    pages: "25"
    date: "1905-10-18"
    addressee: "V. G. Chertkov"
    extract: extracts/v89_747_Chertkovu_oct18_1905.txt
    quoteRu: 'начав перечитывать «Божеское и человеческое», ужаснулся на то, как главная часть, предсмертные часы Светлогуба отвратительно дурны.'
    quoteEn: '(working English) on re-reading "The Divine and the Human" I was horrified at how the main part — Svetlogub''s last hours before death — is disgustingly bad.'
    significance: "The redaction crisis: Tolstoy halts Chertkov's printing to radically rework the Svetlogub death-scene, because «жалко потерять случай высказать так много нужного» (it would be a pity to lose the chance to say so much that is needed). The most-laboured passage of the tale; the abroad-channel (Chertkov) routing visible in the proof correspondence."
    facsimile: null
  - id: E32
    genre: commentary
    pssTom: 42
    pages: "645–665"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_645_665_Bozheskoe_i_chelovecheskoe.txt
    quoteRu: 'С английского в переводе А. Грена рассказ под заглавием «Божеское и человеческое, или Еще три смерти» был напечатан в №№ 8 —14 газеты «Новая жизнь» от 16—22 июня 1906 г.'
    quoteEn: '(working English) From the English, in A. Gren''s translation, the story — under the title "The Divine and the Human, or Three More Deaths" — was printed in nos. 8–14 of the newspaper "Novaya zhizn", 16–22 June 1906.'
    significance: "Because vol. II of Круг чтения was delayed, Божеское и человеческое appeared first abroad/in émigré-channel translations (A. Gren, «Новая жизнь», June 1906; M. I. S—f, «Новое время», July 1906 — both from English, under Chertkov's supervision) BEFORE its Russian anthology printing. The abroad-first pattern of the late censored work."
    facsimile: null
  - id: E33
    genre: commentary
    pssTom: 42
    pages: "645–665"
    date: "1957 (PSS apparatus)"
    addressee: null
    extract: extracts/c_v42_645_665_Bozheskoe_i_chelovecheskoe.txt
    quoteRu: 'Рассказ впервые был напечатан в качестве недельного чтения на 3 ноября во второй части второго тома «Круга чтения», вышедшего в свет в издательстве «Посредник» в конце ноября 1906 г., но помеченного на корешке 1907 г.'
    quoteEn: '(working English) The story was first printed, as the weekly reading for 3 November, in part 2 of the second volume of the Circle of Reading, issued by Posrednik at the end of November 1906 but dated 1907 on the spine.'
    significance: "First Russian printing: vol. II part 2 of Круг чтения (the 3 November слот), late 1906. Tolstoy later regretted placing it there rather than letting Chertkov publish it separately (E34). In collected works first in the Sytin/Biryukov ed., vol. XVI, 1913."
    facsimile: null
  - id: E34
    genre: letter
    pssTom: 89
    pages: "—"
    date: "1906-11-26"
    addressee: "V. G. Chertkov"
    extract: extracts/v89_770_Chertkovu_nov26_1906.txt
    quoteRu: 'Очень жалею, что забыл про Божеское и Человеческое и поместил в Круг Чтения'
    quoteEn: '(working English) I much regret that I forgot about "The Divine and the Human" and placed it in the Circle of Reading.'
    significance: "Tolstoy's regret at putting the tale in the anthology rather than in Chertkov's abroad edition (a matter of money for the foreign edition and of the work's reach). Confirms the dual-channel logic — abroad (Chertkov) vs the legal anthology (Posrednik) — that governs the cluster."
    facsimile: null

  # ─── Composition amid the 1905 revolution & the executions ───
  - id: E35
    genre: diary
    pssTom: 55
    pages: "169"
    date: "1905-11-03 (OS)"
    addressee: null
    extract: extracts/v55_169_170_1905_11_03.txt
    quoteRu: 'Во всей теперешней революции нет идеала. И потому не революция, а бунт.'
    quoteEn: '(working English) In the whole present revolution there is no ideal. And therefore it is not a revolution but a riot.'
    significance: "Written the same week as «Писал Божеское и Человеческое недурно» — the political weather inside which Божеское и человеческое was composed. Tolstoy's «neither» stance (against both the state's violence and the revolution's) is the tale's structure: Svetlogub's faith above both."
    facsimile: null
  - id: E36
    genre: diary
    pssTom: 55
    pages: "256"
    date: "1906-10-10 (OS)"
    addressee: null
    extract: extracts/v55_256_258_1906_10_10.txt
    quoteRu: 'чтение газет с 22 казненными, и я начал писать об этом.'
    quoteEn: '(working English) reading the newspapers with 22 executed, and I began to write about it.'
    significance: "The Stolypin-era executions of autumn 1906 — the same political violence that drives За что? and Божеское и человеческое. The diary ends «Хочется ответить на вопрос: что делать?» — the question the tales put to the reader; this draft would grow into «Не могу молчать» (1908)."
    facsimile: null

