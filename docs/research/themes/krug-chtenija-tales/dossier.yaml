# COVERAGE — surfaces × status. Derives index.md "Material not covered".
# ─────────────────────────────────────────────────────────────────────────────
coverage:
  - { surface: "Genesis & composition (diary + letters + apparatus)", status: covered, note: "All six tales' composition traced from the «История писания» + the 1904–06 diary + the Gorbunov/Chertkov letters; the people-network surfaced. Diary thin on Алёша + Корней (apparatus carries those)." }
  - { surface: "What the tales say (keystone passages)", status: covered, note: "All six read in full; keystones extracted per tale; the reversed-title draft of Божеское read." }
  - { surface: "Redactions & textual history", status: covered, note: "Reworking counts (Корней 13×, За что? 15×, Божеское 49 ms. units) + the reversed-title finding + the Молитва censor-cut span; variant collation itself not done." }
  - { surface: "Publication, censorship & translation", status: covered, note: "Per-tale venues (Круг чтения vols I/II; Алёша posthumous 1911; Божеское abroad-first June 1906); the Молитва censor cut; the anthology prosecution. English translation: only Алёша had a pre-2000 translation (Hagberg Wright 1912; Maude; C. Brown 1985); the other five first appeared in English in 2000 (Sekirin/Zondervan + Spence/Northwestern); the English Круг чтения (Calendar of Wisdom 1997) still omits all 52 weekly stories." }
  - { surface: "Reception & afterlife", status: partial, note: "Censorship-as-reception covered (the Gorbunov-Posadov trial); contemporary critical reception of the individual tales thin/out-of-corpus." }
  - { surface: "Scholarly context", status: covered, note: "4 findings triangulated (3 `extends`, 1 `confirms`); 17 sources. The realist/parabolic split, the encryption thesis, and the Gorbunov-Posadov trial are all under-addressed in English; Spence (2000) is the closest political reading. See extracts/_scholarship.md." }
  - { surface: "Visual & manuscript record", status: covered, note: "1 PD facsimile (Алёша autograph plate) + 8 Commons downloads; 5 work-orders; Shchegolenok + Chertkov cross-refs." }
  - { surface: "The anthology as channel (недельное чтение)", status: covered, note: "The slot's structure + Tolstoy's encryption statement + the месячные чтения German-only fact + the banned-works re-entry policy." }

# ─────────────────────────────────────────────────────────────────────────────
# CONTRADICTIONS — intra-corpus / primary-vs-secondary corrections.
# ─────────────────────────────────────────────────────────────────────────────
contradictions:
  - claim: "За что? first appeared in volume I of Круг чтения (sweep/deep-read working note)."
    correction: "За что? is the SEPTEMBER weekly reading → volume II of the first edition (vol. II 1st half-volume, out 6 July 1906). The commentary says «в первом издании» (first EDITION, vs the 1908 2nd edition), not «первый том»; the diary confirms it went to the typesetter alongside «коректуры 2 тома Круга Чтения»."
    evidenceRef: E24
  - claim: "The tale's title is «Божеское и человеческое» from the start."
    correction: "The first written form (30 Dec 1903) was the REVERSED «Человеческое и божеское» (human first); the order was inverted only in reworking (and cycled through «Еще три смерти»). The final divine-first order is the verdict the tale reaches."
    evidenceRef: E30
  - claim: "Алёша Горшок was published in Круг чтения like the other five."
    correction: "Алёша Горшок was EXCLUDED by Tolstoy from Круг чтения and first printed only posthumously, in 1911 — the one tale of the six he never saw in print. publishedDuringLifetime = false."
    evidenceRef: E11

