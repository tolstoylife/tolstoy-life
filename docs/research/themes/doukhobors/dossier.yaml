# Machine-readable dossier for the Doukhobors survey (index.md).
# Built 2026-05-30 by a corpus-dive run (slug: doukhobors), revisiting a hand-written
# 2026-05-26 survey to add the three coordinated corpus-dive outputs the narrative lacked:
# this dossier (evidence + entity + visuals + scholarship layers), a heavy visual-materials
# sweep, and a draft dev-blog note. The 2026-05-26 index.md remains the authoritative
# narrative; the primary evidence and voice were left intact and only enriched.
#
# Run framing (Phase 0 contract, as confirmed): the FULL Tolstoy–Doukhobor relationship,
# with the STATE / authorities' handling foregrounded, and a heavy visual record.
# Scope: post-1880, all genres (letters first-class). Sweep: fan-out by genre + channel.

topic:
  slug: doukhobors
  title: "Tolstoy and the Doukhobors"
  question: >-
    Where across the local corpus (tolstoydigital TEI + Jubilee Edition PDFs) does Tolstoy
    speak about the Doukhobors — the pacifist Transcaucasian sect whose 1895 mass refusal of
    military service and "Burning of Arms" he made the central public cause of his late life —
    and how does the whole relationship unfold, from first contact through the 1899 emigration
    to Canada and the cooling aftermath, with particular attention to how the state handled it?
  date: 2026-05-30
  period: prophet
  corpusSurface: [letters, diaries, works, notebooks, commentary]
  dateRange: "1895–1910"

# ─────────────────────────────────────────────────────────────────────────────
# Layer 1 — flat citation ledger. Every quoteRu is byte-faithful from the clean
# extract named in `extract` (verified against the extracts/ .txt files this run).
# quoteEn is working English (labelled). PSS Tom -> local PDF via pss-volume-mapping.md.
# This ledger anchors the keystone moments of index.md; the fuller letter/diary clusters
# index.md tabulates are listed under notCovered (surfaced, not entered as evidence rows).
# ─────────────────────────────────────────────────────────────────────────────
evidence:
  - id: v39_209_215_origins
    genre: works
    pssTom: 39
    pages: "209–215"
    date: 1895-08-14
    addressee: "the foreign newspapers (open letter)"
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: extracts/v39_209_215_Pismo_v_inostrannye_gazety_po_povodu_gonenij_na_kavkazskih_duhoborov.txt
    quoteRu: >-
      С духоборцами случилось то, что обыкновенно случается с замыкающимися в самих себя
      и вследствие того процветающими религиозными общинами: материальное благосостояние
      их увеличивается, но религиозное сознание понижается.
    quoteEn: >-
      What happened with the Doukhobors is what usually happens with religious communities
      that close in upon themselves and prosper as a result: their material well-being
      increases, but their religious consciousness declines. (working English)
    significance: >-
      Tolstoy's own account of who the Doukhobors were and of the revival under Verigin that
      preceded the crisis. The opening of the foundational factual document of the whole affair.
    facsimile: null

  - id: v39_209_215_burning_of_arms
    genre: works
    pssTom: 39
    pages: "209–215"
    date: 1895-08-14
    addressee: "the foreign newspapers (open letter)"
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: extracts/v39_209_215_Pismo_v_inostrannye_gazety_po_povodu_gonenij_na_kavkazskih_duhoborov.txt
    quoteRu: >-
      После этого, 28 июня 1895 года, духоборцы, живущие в Ахалкалакском уезде Тифлисской
      губернии, снесли в одну кучу в поле, около села Спасского, всё свое имевшееся у них
      оружие и, обложив его дровами и углем и облив керосином, сожгли
    quoteEn: >-
      After this, on 28 June 1895, the Doukhobors living in the Akhalkalaki district of the
      Tiflis province carried all the weapons they had into a single heap in a field near the
      village of Spasskoye and, having piled wood and coal upon them and doused them with
      kerosene, burned them. (working English)
    significance: >-
      THE KEYSTONE CITATION. The Burning of Arms — the coordinated mass renunciation of weapons
      that began the whole affair. Page facsimile rendered from the local PSS PDF.
    facsimile: extracts/v39_209_215_p209_facsimile.png

  - id: v39_209_215_kars_gallows
    genre: works
    pssTom: 39
    pages: "209–215"
    date: 1895-08-14
    addressee: "the foreign newspapers (open letter)"
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: extracts/v39_209_215_Pismo_v_inostrannye_gazety_po_povodu_gonenij_na_kavkazskih_duhoborov.txt
    quoteRu: >-
      Тогда начальство построило виселицу, сшило саваны и со всею торжественностью,
      употребляющейся в казнях, вывело отказавшихся духоборов к казни.
    quoteEn: >-
      Then the authorities built a gallows, sewed shrouds, and with all the solemnity used in
      executions led the refusing Doukhobors out to die. (working English)
    significance: >-
      AUTHORITIES THREAD. The mock execution at Kars — the state staging a capital sentence to
      break conscientious objectors, then conceding defeat. The sharp end of how the state acted.
    facsimile: null

  - id: v39_209_215_diffuse_complicity
    genre: works
    pssTom: 39
    pages: "209–215"
    date: 1895-08-14
    addressee: "the foreign newspapers (open letter)"
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: extracts/v39_209_215_Pismo_v_inostrannye_gazety_po_povodu_gonenij_na_kavkazskih_duhoborov.txt
    quoteRu: >-
      Обратиться прямо к лицам, творящим зло, я не могу и потому, что их слишком много,
      начиная от царя, которого уверили, что гонение на духоборцев есть необходимое дело,
      до последнего казака, воображающего, что, разоряя, оскорбляя, побивая своего брата
      духоборца, он [не] только не делает зло, но поступает хорошо, исполняя присягу
    quoteEn: >-
      I cannot turn directly to the persons doing the evil, because there are too many of them,
      beginning with the Tsar, who has been assured that the persecution of the Doukhobors is a
      necessary matter, down to the last Cossack, who imagines that in ruining, insulting, and
      beating his Doukhobor brother he is not only doing no evil but acting well, in fulfilment
      of his oath. (working English)
    significance: >-
      AUTHORITIES THREAD + the "words as weapon" rationale. Tolstoy's diagnosis of state violence
      as diffuse complicity — from Tsar to Cossack — and his reason for turning to the press
      rather than the perpetrators. The frame the whole campaign rests on.
    facsimile: null

  - id: v39_099_105_unquenchable_fire
    genre: works
    pssTom: 39
    pages: "99–105"
    date: 1895-10-01
    addressee: "afterword to P. I. Biryukov's article 'The Persecution of Christians in Russia in 1895'"
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: extracts/v39_099_105_Posleslovie_k_state_P_I_Birjukova_Gonenie_na_hristian_v_Rossii_v_1895_g.txt
    quoteRu: >-
      Сколько бы ни набрасывали на горящую кучу хвороста дров, думая этим затушить огонь, —
      огонь, непотухающий огонь истины, только на время приглохнет, но разгорится еще сильнее
      и сожжет всё то, что наложено на него.
    quoteEn: >-
      However much firewood is thrown onto the burning heap of brush in the hope of putting the
      fire out, the fire — the unquenchable fire of truth — will only die down for a time, then
      blaze up the more strongly and burn everything that has been piled upon it. (working English)
    significance: >-
      The doctrinal companion to the factual letter, and the image that recurs across all his
      Doukhobor writing: the state cannot win — repression spreads the example. Biryukov wrote
      the article; Tolstoy the afterword.
    facsimile: null

  - id: v39_192_196_resurrection_of_christ
    genre: works
    pssTom: 39
    pages: "192–196"
    date: 1896-12-26
    addressee: "afterword to the appeal «Помогите!» (Help!)"
    localPdf: primary-sources/jubilee-edition/vol08/vol08.pdf
    extract: extracts/v39_192_196_Posleslovie_k_vozzvaniju_Pomogite.txt
    quoteRu: >-
      Среди духоборов, или, скорее, христианского всемирного братства, как они теперь называют
      себя, происходит ведь не что-нибудь новое, а только произрастание того семени, которое
      посеяно Христом 1800 лет тому назад, — воскресение самого Христа.
    quoteEn: >-
      Among the Doukhobors — or rather the universal Christian brotherhood, as they now call
      themselves — what is taking place is nothing new, but only the sprouting of that seed which
      was sown by Christ 1,800 years ago: the resurrection of Christ himself. (working English)
    significance: >-
      The most exalted of all his Doukhobor statements. The afterword to the appeal «Help!»,
      co-signed by Chertkov, Biryukov and Tregubov, who were exiled for it.
    facsimile: null

  - id: v31_097_101_two_wars
    genre: works
    pssTom: 31
    pages: "97–101"
    date: 1898-08-15
    addressee: "article «Две войны» (Two Wars)"
    localPdf: null   # Tom 31 -> local PDF unresolved in pss-volume-mapping.md (see needsReview)
    extract: extracts/v31_097_101_Dve_vojny.txt
    quoteRu: >-
      …которую с особенной силой и успехом ведет в последнее время горсть людей — христиан,
      кавказских духоборов, против могущественного русского правительства.
    quoteEn: >-
      …which of late has been waged with particular force and success by a handful of people —
      Christians, the Caucasian Doukhobors — against the mighty Russian government. (working English)
    significance: >-
      Sets the Spanish-American war of 1898 against the Doukhobors' "war against war." Casts the
      sect's resistance as the truer, holier conflict of the age.
    facsimile: null

  - id: v31_097_101_state_weapons
    genre: works
    pssTom: 31
    pages: "97–101"
    date: 1898-08-15
    addressee: "article «Две войны» (Two Wars)"
    localPdf: null
    extract: extracts/v31_097_101_Dve_vojny.txt
    quoteRu: >-
      Русское государство выставило против духоборов все те орудия, которыми оно может бороться.
      Орудия эти: полицейские меры арестов, непозволения выезда из места жительства, запрещение
      общения друг с другом, перехватывание писем, шпионство, запрещение печатания в газетах
      сведений о всем, касающемся духоборов, клевета на них, печатаемая в журналах, подкупы,
      сечения, тюрьмы, ссылки, разорение семей.
    quoteEn: >-
      The Russian state brought against the Doukhobors every weapon it can fight with. These
      weapons are: police measures of arrest, prohibition of travel from one's place of
      residence, the banning of communication with one another, the interception of letters,
      espionage, the suppression of newspaper reports of anything touching the Doukhobors,
      slander printed against them in the journals, bribery, floggings, prisons, exiles, the
      ruin of families. (working English)
    significance: >-
      AUTHORITIES THREAD. Tolstoy's own catalogue of the instruments of state repression — the
      single most concentrated primary inventory of how the authorities handled the affair.
    facsimile: null

  - id: v68_229_verigin_word_vs_book
    genre: letter
    pssTom: 68
    pages: "262–266"
    date: 1895-11-21
    addressee: "P. V. Verigin (letter 229)"
    localPdf: primary-sources/jubilee-edition/vol34/vol34.pdf
    extract: extracts/v68_229_P_V_Veriginu.txt
    quoteRu: >-
      теперь же нельзя предоставлять одним врагам это могущественное орудие для обмана, и не
      пользоваться книгой или письмом для передачи своих мыслей и восприятия мыслей других людей
    quoteEn: >-
      but now one cannot leave this mighty instrument of deception to the enemies alone, and
      not make use of the book or the letter to convey one's own thoughts and to receive the
      thoughts of others. (working English)
    significance: >-
      Tolstoy's first letter to the exiled leader, answering Verigin's claim that the living
      spoken word is superior to the dead book — the writer half-agreeing, half-defending the
      printed word as a weapon the friends of truth cannot cede. Opens "Дорогой брат!", closes
      "Братски обнимаю вас."
    facsimile: null

  - id: v70_150_asks_forgiveness
    genre: letter
    pssTom: 70
    pages: "126–128"
    date: 1897-08-21
    addressee: "the Caucasian Doukhobors (letter 150)"
    localPdf: primary-sources/jubilee-edition/vol35/vol35.pdf
    extract: extracts/v70_150_Kavkazskimduxoboram.txt
    quoteRu: >-
      то как же мне, не удостоившемуся пострадать за Христово дело, надо выпрашивать прощения
      у всех тех, кого мои слова и писания повели к страданиям?
    quoteEn: >-
      then how must I, who have not been found worthy to suffer for Christ's cause, beg
      forgiveness of all those whom my words and writings have led into suffering? (working English)
    significance: >-
      The pastoral letter in which Tolstoy asks the Doukhobors' forgiveness for having led them
      to suffer through his writings — and, strikingly, tells those who cannot bear the
      persecution that they may submit without shame.
    facsimile: null

  - id: v71_081_three_ways_of_the_state
    genre: letter
    pssTom: 71
    pages: "322–327"
    date: 1898-03-19
    addressee: "the foreign newspapers (letter 81)"
    localPdf: primary-sources/jubilee-edition/vol53/vol53.pdf
    extract: extracts/v71_081_Vinostrannyegazety.txt
    quoteRu: >-
      Но нынешнее русское правительство употребило против духоборов еще третий, казалось бы
      оставленный в наше время, выход из этого противоречия. Оно, кроме того, что подвергает
      самым тяжелым страданиям самих отказывающихся, заставляет еще систематически страдать
      отцов, матерей, детей отказывающихся, вероятно с тем, чтобы пытками этих невинных семей
      поколебать решимость несогласных их членов.
    quoteEn: >-
      But the present Russian government has used against the Doukhobors a third way out of this
      contradiction, one seemingly abandoned in our time. Besides subjecting the refusers
      themselves to the heaviest sufferings, it forces the fathers, mothers, and children of the
      refusers to suffer systematically as well — probably so as to shake the resolve of the
      dissenting members by the torture of these innocent families. (working English)
    significance: >-
      AUTHORITIES THREAD. The analytic heart of the state-handling case: Tolstoy contrasts the
      Mennonite (alternative service) and Austrian-Nazarene (imprisonment) solutions with
      Russia's choice to punish the families. The 1898 advocacy letter that opened the
      emigration appeal to the West.
    facsimile: null

  - id: v71_107_nicholas_let_us_go
    genre: letter
    pssTom: 71
    pages: "345–348"
    date: 1898-04-02
    addressee: "Nicholas II — petition in the Doukhobors' name, draft (letter 107)"
    localPdf: primary-sources/jubilee-edition/vol53/vol53.pdf
    extract: extracts/v71_107_NikolayuII.txt
    quoteRu: >-
      И потому, если мы не можем исполнять того, без чего нас нельзя терпеть в государстве, мы
      просим одно: отпустите нас.
    quoteEn: >-
      And so, if we cannot fulfil that without which we cannot be tolerated in the state, we ask
      one thing only: let us go. (working English)
    significance: >-
      AUTHORITIES THREAD. Tolstoy drafts the Doukhobors' own petition to the Tsar — the plea
      that, since their faith bars military service, they be allowed to emigrate with their
      conscription-age sons (then being exiled 18 years to Yakutsk).
    facsimile: null

  - id: v72_426_nicholas_four_demands
    genre: letter
    pssTom: 72
    pages: "514–521"
    date: 1900-12-07
    addressee: "Nicholas II (letter 426; first redaction, pre-reform orthography)"
    localPdf: primary-sources/jubilee-edition/vol36/vol36.pdf
    extract: extracts/v72_426_NikolayuII.txt
    quoteRu: >-
      уже давнымъ давно пора: во-первыхъ, пересмотрѣть и уничтожить существующіе теперь законы
      о гоненіяхъ за вѣру; во-вторыхъ, прекратить всѣ преслѣдованія за отступленія отъ принятаго
      государствомъ исповѣданія; въ-третьихъ, освободить всѣхъ на основаніи прежнихъ законовъ
      заключенныхъ и изгнанныхъ за преступленіе противъ вѣры, и въ-четвертыхъ, не казнить, какъ
      преступленіе, несогласіе религіозной совѣсти съ требованіями государства
    quoteEn: >-
      it is long, long since high time: first, to review and abolish the laws now existing on
      persecution for faith; second, to stop all prosecutions for departure from the
      state-accepted confession; third, to release all those imprisoned and exiled under the
      former laws for offences against faith; and fourth, not to punish as a crime the
      disagreement of religious conscience with the demands of the state. (working English)
    significance: >-
      AUTHORITIES THREAD. Tolstoy's four concrete demands to the Tsar on religious persecution,
      the Doukhobors as the emblem. NOTE: the final letter's TEI is heavily lacunose; this
      byte-faithful span is from the legible pre-reform first-redaction draft in the same file.
    facsimile: null

