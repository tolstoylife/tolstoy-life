# ─────────────────────────────────────────────────────────────────────────────
# Layer 4 — scholarship (secondary layer; Phase 3). English-first conventional
# Tolstoy scholarship + the Doukhobor heritage record, triangulated against the
# primary findings. Clear secondary sources are also listed in references.background.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    The conventional account — Maude's contemporary A Peculiar People (1904), Woodcock &
    Avakumovic's long-standard The Doukhobors (1968), Andrew Donskov's studies of the
    Tolstoy–Verigin relationship, and the Doukhobor heritage record (doukhobor.org) — agrees
    with the primary corpus on the spine of the story: Burning of Arms (1895), the appeals, the
    exile of «Help!»'s authors, the Resurrection-funded emigration, and the 1899 settlement of
    ~7,400 in Canada. Scholarship drifts from the primary record mainly in proportion (the
    weight of the Resurrection money), in the tidy heroic arc (which the primary sources
    complicate), and in reaching past 1900 into the Canadian story the corpus does not cover.
  triangulation:
    - evidenceRef: v39_209_215_burning_of_arms
      conventionalView: >-
        Standard histories (Woodcock & Avakumovic; the Canadian Encyclopedia) narrate the
        Burning of Arms of 28–29 June 1895 (OS) as the catalysing act.
      relation: confirms
      source: "Woodcock & Avakumovic, The Doukhobors (1968)"
    - evidenceRef: v31_097_101_state_weapons
      conventionalView: >-
        Scholarship treats the persecution thematically (floggings, billeting, exile) but
        rarely assembles the state's instruments as a single catalogue.
      relation: extends
      source: null
    - evidenceRef: v71_081_three_ways_of_the_state
      conventionalView: >-
        The Mennonite alternative-service precedent and the empire's handling of sectarian
        conscientious objection are known to specialists; Tolstoy's explicit three-way framing
        (Mennonite / Nazarene / Russian-against-the-families) is sharper than the received summary.
      relation: extends
      source: null
    - evidenceRef: v72_426_nicholas_four_demands
      conventionalView: >-
        The popular and even scholarly emphasis falls on the emigration's success; Tolstoy's
        direct, itemised demands to Nicholas II on religious-persecution law are less cited.
      relation: complicates
      source: "Donskov, Leo Tolstoy and the Canadian Doukhobors"
    - evidenceRef: v39_192_196_resurrection_of_christ
      conventionalView: >-
        The shorthand "Tolstoy wrote/sold Resurrection to pay the Doukhobors' passage" is true
        in spirit. Careful work (Pashchenko & Nagorna, 2006: 32,360 roubles to the committee,
        ~half the fund) shows the Resurrection money as one of three comparable streams alongside
        the Quakers and the Doukhobors' own savings.
      relation: complicates
      source: "Pashchenko & Nagorna (2006), via doukhobor.org"

# ─────────────────────────────────────────────────────────────────────────────
# Intra-corpus contradictions (primary-vs-primary) only — distinct from scholarship.
# ─────────────────────────────────────────────────────────────────────────────
contradictions:
  - claim: "Tolstoy gives the Doukhobor population as 'up to 20,000' (1895 open letter, v39_209_215_origins)."
    correction: >-
      The 1898 letter to the foreign press (v71_081) speaks of a 'population of 12,000 of the
      universal-brotherhood Christians.' The figures are not contradictory but scoped differently —
      ~20,000 Doukhobors in all on the Caucasus vs. the ~12,000 of the Verigin (Large Party)
      revival that bore the persecution; Tolstoy himself flags his 1895 numbers as 'могут быть
      преувеличены… могут быть и неполны' (may be exaggerated… may be incomplete).
    evidenceRef: v71_081_three_ways_of_the_state

