# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). Triangulation, not corroboration.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    English scholarship treats late-Tolstoy censorship as a well-documented background condition and confirms both the abroad-publishing channel and the Resurrection mutilation — but does not reach the dive's three live findings. Bartlett (2010) and Wilson (1988) give the censorship background; Alston (2014) and Holman (1988) document Chertkov's Free Age Press as an organised international movement (43 publications / ~209,000 copies 1900–1902, managed by Arthur Fifield from Tuckton House near Christchurch). What the literature does NOT examine: (1) that the parable/folk-tale form was chosen as a deliberate response to censorship rather than only for peasant reach — scholars read the folk turn aesthetically and through access, and document the Kishinev–Sholom-Aleichem contribution biographically without reading those tales as encoding the pogrom-condemnation Tolstoy said he could not publish legally; (2) the explicit 1900 protocol routing ALL writings abroad through Chertkov as a named agreement; (3) the four wisdom-anthologies as one compression project whose dropped attributions and thematic re-ordering also lowered the collection's censorship profile (Tulyakova et al. 2018 is the one article treating Круг чтения as politically active; the compression-as-encryption reading is absent). Popoff (2014) supplies the contested "false disciple" frame — Chertkov as a controlling editor-censor who extracted the posthumous will under duress; the primary record here (Tolstoy freely and repeatedly stating the channel as his own settled wish across 1900–1910, and reaffirming the 1895 papers-instruction in 1904) complicates that reading rather than confirming it. Full pass: extracts/_scholarship.md.
  triangulation:
    - { evidenceRef: key-sholom-aleichem, conventionalView: "Folk forms chosen for peasant reach and Tolstoy's aesthetic conversion; censorship acknowledged as pressure on Posrednik but not as the generative cause of the genre choice; the Kishinev–Aleichem link documented biographically, not read as encryption.", relation: extends, source: "Simmons, Introduction to Tolstoy's Writings; Emerson, Tolstoy in Context (2021); Wenzer 1997" }
    - { evidenceRef: chan-rule-only-through-you, conventionalView: "The abroad channel and Chertkov's posthumous authority are confirmed, but the explicit 1900 protocol routing ALL writings through Chertkov is not examined as a named agreement in English scholarship.", relation: extends, source: "Alston 2014; Holman, SEER 66/2 (1988); Popoff 2014" }
    - { evidenceRef: chan-public-sole-node, conventionalView: "Scholars describe the Free Age Press operation but not the public sole-node declaration as deliberate procedural architecture.", relation: confirms, source: "Alston 2014; Holman 1988" }
    - { evidenceRef: enc-resurrection-survival-sentence, conventionalView: "The ~497 Niva distortions and the Purleigh complete edition are documented; the full Russian text appeared only in 1936.", relation: confirms, source: "Simmons; Wikipedia (Resurrection); Chertkov Purleigh imprint records" }
    - { evidenceRef: chan-chertkov-controls-all, conventionalView: "State censorship is thoroughly documented; the 'two censors' framing (state + liberal press), attributed to Chertkov, is not a named concept in English scholarship.", relation: extends, source: "Hapgood 1887; Chertkov, «Две цензуры для Толстого» (1909); Popoff 2014" }
