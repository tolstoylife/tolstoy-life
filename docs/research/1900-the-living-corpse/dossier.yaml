# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). Ground in the primary record first; attribute, don't assert.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    The play is little-treated by the major English biographers as a text, but
    well-served on two fronts. (1) The 1911 Moscow Art Theatre premiere is the
    reception event: directed by Nemirovich-Danchenko with Stanislavski (who
    played Abrezkov), Ivan Moskvin as Fedya — an immediate success that travelled
    to Berlin, Vienna, Paris, London, and was rivalled within days by Meyerhold's
    Alexandrinsky staging in Petersburg. (2) Andrew Wachtel (PMLA 1992) is the
    substantive scholarly article: he reads the fake-suicide/resurrection knot as
    a "cultural paradigm," tracing its subtexts to the Gimer trial, a polemic with
    Chernyshevsky's What Is to Be Done?, and a dialogue with Nikolai Fedorov, and
    its issue to Mayakovsky, Erdman, Nabokov, Bulgakov. Simmons (1968) groups the
    play with Resurrection as the legal-circle court-case works and resists the
    "moral didacticism disfigures it" reading. On the abandonment, the standard
    account (Simmons; Russian Wikipedia; the 12 Dec 1900 Chertkov letter) gives the
    Gimer family's plea as the leading cause; the deeper What Is Art? / publicistic
    reading is, in the surveyed scholarship, only inferential — which is where the
    diary supplies the missing primary grounding. The Sofia-centred /
    Last-Station frame is not a factor here; the relevant mainstream lens is the
    "about-face from Kreutzer" reading (Kommersant 2024), which the primary record
    complicates.
  triangulation:
    - evidenceRef: lc-chernyshevsky
      conventionalView: 'Wachtel (1992) argues The Living Corpse is structured by a polemic with Chernyshevsky''s What Is to Be Done? (the staged-suicide motif), among four subtexts.'
      relation: confirms
      source: 'Wachtel, Andrew. "Resurrection à la Russe: Tolstoy''s The Living Corpse as Cultural Paradigm." PMLA 107:2 (1992), 261–273.'
    - evidenceRef: lc-chernyshevsky
      conventionalView: 'The intertext is argued thematically by scholars; that it is named INSIDE the play (Masha cites «Что делать?»/«Рахманов») is not usually foregrounded.'
      relation: extends
      source: 'Primary text, Act IV (lc-chernyshevsky); cf. Wachtel (1992).'
    - evidenceRef: lc-comm-davydov
      conventionalView: 'Simmons (1968) pairs The Living Corpse with Resurrection as the two works built from court cases supplied by Tolstoy''s legal circle (Davydov here; Koni for Resurrection).'
      relation: confirms
      source: 'Simmons, Ernest J. Introduction to Tolstoy''s Writings (1968), ch. on the dramatic writings.'
    - evidenceRef: lc-suicide-note
      conventionalView: 'Pre-1917 Orthodox divorce law placed dissolution in the Church consistories; the only practical ground was proven adultery, requiring perjured testimony — divorce rate ~0.0038% (1913). The play dramatises this trap.'
      relation: confirms
      source: 'Russia Beyond, "The trouble with divorce in Old Russia" (2019); UNI ScholarWorks digest of pre-1917 divorce law.'
    - evidenceRef: lc-kreutzer-lineage
      conventionalView: 'A popular reading (e.g. Kommersant 2024) frames The Living Corpse as an "about-face" from The Kreutzer Sonata: KS condemns marriage/sexuality itself, while the Corpse blames only the legal/ecclesiastical system.'
      relation: complicates
      source: 'Kommersant (2024), kommersant.ru/doc/7166441; tested against Tolstoy''s diary, 15 Dec 1900 (lc-kreutzer-lineage).'
    - evidenceRef: lc-brosit
      conventionalView: 'The standard account gives the Gimer family''s plea (and distaste for revision) as the leading reason Tolstoy abandoned the play.'
      relation: complicates
      source: 'Simmons (1968); Russian Wikipedia; PSS Tom 34 commentary — which itself frames the plea as "also" (также) a cause. Tested against the diary (lc-brosit, lc-ne-delo-bozhie, lc-sochinitelstvo).'
    - evidenceRef: lc-brosit
      conventionalView: 'The What Is Art? / publicistic-turn reading of the abandonment is, in the surveyed scholarship, inferential and unsourced to Tolstoy''s own words.'
      relation: extends
      source: 'Scholarship gap flagged in the reception sweep; the corpus supplies the grounding (diary 21 Aug, 28 Nov, 31 Dec 1900; Chertkov 12 Dec 1900).'

