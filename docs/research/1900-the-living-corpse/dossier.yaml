contradictions:
  - claim: 'Fedya dies in doubt — "perhaps I was mistaken" (diary draft, 7 Sept 1900).'
    correction: 'The finished text replaces the doubt with serenity — "Как хорошо… Как хорошо" — and the gypsy-scene foreshadow ("Кабы только не просыпаться. Так и помереть"). The doubt was a draft Tolstoy cut.'
    evidenceRef: lc-predsmertnye-draft
  - claim: 'The reporter-leaked plot and the Gimer family''s plea (late Nov 1900) are the reason Tolstoy dropped the play.'
    correction: 'In his own diary the abandonment (28 Nov 1900) is attributed to the pull of the people''s suffering after reading Novikov, not the Gimer plea; the structural dissatisfaction runs from 21 Aug. The PSS itself frames the plea as "также" (also) a cause. Over-determined, with the conscience-turn dominant in his own voice.'
    evidenceRef: lc-brosit

notCovered:
  - 'Full collation of the 8 numbered variants (рук. №№ 1–14) against the base text (ms. № 14).'
  - 'The 1911 Alexandrinsky (Meyerhold) production in depth, and the play''s European tour (Berlin/Vienna/Paris/London).'
  - 'The full English-translation lineage (whether the Maude Centenary Edition volume uses a Maude hand or another).'
  - 'Tolstoy''s 11–12 Oct 1887 letter to Biryukov advising E. P. Gimer not to leave her husband (Tom 64) — cited in commentary, not extracted here.'
  - 'The «большая драма» Tolstoy distinguished from the «малая драма» (the Corpse) in the 7 Sept 1900 diary — a separate, unwritten project.'

needsReview:
  - item: 'Karenin ← S. I. Chistov prototype is conjectural (not in PSS). Decide whether to record the edge or drop it at ingestion.'
    phase: 4
    why: 'The real Liza-figure married Chistov, but the PSS asserts no portrait; risk of over-claiming a prototype.'
  - item: 'Masha (gypsy) has no documented individual prototype; the gypsy-choir milieu (brother Sergei''s wife M. M. Shishkina) is biographical resonance, not a model.'
    phase: 4
    why: 'Avoid flattening a milieu into a named prototype.'
  - item: 'The reception sweep''s claim that A. F. Koni "wrote to Tolstoy on 14 Jan 1900 about how a husband might liberate his wife through self-sacrifice" is unverified against the PSS.'
    phase: 3
    why: 'The PSS commentary attributes the plot to Davydov and gives Koni a real-case + essay role; the 14 Jan 1900 self-sacrifice letter is a separate claim needing the Tom 54 note / Koni''s own essay to confirm.'
  - item: 'Whether the 1911 MAT and/or Alexandrinsky productions met any incidental stage-censorship (the play itself was not banned).'
    phase: 3
    why: 'bans: [] is proposed; confirm no theatrical-censorship event before ingestion.'
  - item: 'Marya Vasilyevna Kryukova: she is BOTH a cut first-redaction lead AND restored by the PSS in Act V, picture 2. At ingestion decide whether she warrants her own character node or folds into the redaction prose.'
    phase: 4
    why: 'Unusual textual status; borderline character node.'
