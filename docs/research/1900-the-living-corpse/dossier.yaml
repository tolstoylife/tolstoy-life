topic:
  slug: 1900-the-living-corpse
  title: 'The Living Corpse (Живой труп) — Tolstoy''s unfinished 1900 drama'
  question: >-
    Is The Living Corpse an indictment of the institution of legal/church
    marriage and its divorce machinery — honesty against the institution — and
    was its abandonment driven mainly by Tolstoy''s reluctance to wound the real
    people (the Gimers) whose court case it dramatises?
  date: '2026-06-12'
  period: 'Prophet period (post-1880); composed 1900'
  corpusSurface: 'works (PSS Tom 34: play + plans + variants + 2 commentaries); diaries Tom 53–54 (1897, 1900); letters Tom 72 + Tom 88 (1900)'
  dateRange: '1897-12 (seed) · 1900-01/11 (writing & abandonment) · 1911 (posthumous publication & premiere)'

# ─────────────────────────────────────────────────────────────────────────────
# EVIDENCE LEDGER — every quoteRu is byte-verified against its extract (verify_quotes.py 40/40 PASS)
