evidence:

  # ---- The play's own text (PSS Tom 34, pp. 7–99) ----
  - id: lc-volya
    genre: work
    pssTom: 34
    pages: '~12'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'Это степь, это десятый век, это не свобода, а воля.'
    quoteEn: '(working English) "This is the steppe, this is the tenth century, this is not freedom but boundless will (volya)." (Fedya at the gypsies, Act I, picture 2.)'
    significance: 'The play''s positive pole. Fedya distinguishes свобода (legal/social liberty) from воля (boundless, lawless aliveness) — the gypsy song is the one place he is not ashamed. The thing the institution cannot give him.'
    facsimile: ''
  - id: lc-pomeret
    genre: work
    pssTom: 34
    pages: '~17'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'Ах, хорошо. Кабы только не просыпаться. Так и помереть.'
    quoteEn: '(working English) "Ah, good. If only one need not wake. To die just so." (Fedya, ending Act I.)'
    significance: 'Death-as-release foreshadowed in Act I, in the gypsy room — the same note the play closes on ("Как хорошо… Кончается"). The corpse is wished-for from the start.'
    facsimile: ''
  - id: lc-ne-lgat
    genre: work
    pssTom: 34
    pages: '~38'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'Не могу спокойно лгать.'
    quoteEn: '(working English) "I cannot calmly lie." (Fedya to Prince Abrezkov, Act III, picture 2.)'
    significance: 'The moral core in four words. Fedya is "a scoundrel" by his own account, but the one thing he cannot do is the perjury the divorce requires. Honesty against the institution.'
    facsimile: ''
  - id: lc-razvod-lozh
    genre: work
    pssTom: 34
    pages: '~38'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'условия принятия вины на себя, всей лжи, связанной с этим, очень тяжелы.'
    quoteEn: '(working English) "…the conditions of taking the guilt on oneself, of all the lying bound up with it, are very heavy." (Fedya to Abrezkov on what a divorce demands, Act III.)'
    significance: 'States the institutional trap precisely: an Orthodox divorce required one party to confess fabricated adultery. The honest exit is closed by design.'
    facsimile: ''
  - id: lc-suicide-note
    genre: work
    pssTom: 34
    pages: '~58'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'Лгать, играть гнусную комедию, давая взятки в консистории, и вся эта гадость невыносима, противна мне.'
    quoteEn: '(working English) "To lie, to play a vile comedy, bribing the consistory, and all this filth is unbearable, repellent to me." (Fedya''s farewell letter, read aloud Act IV, picture 2.)'
    significance: 'CENTREPIECE. The institutional indictment in Fedya''s own written voice — the church consistory, the bribes, the comedy of fault — followed by his conclusion: "я мешаю этому, следовательно, я должен уничтожиться" (I am the obstacle, so I must annihilate myself).'
    facsimile: ''
  - id: lc-unichtozhitsya
    genre: work
    pssTom: 34
    pages: '~58'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'я должен уничтожиться'
    quoteEn: '(working English) "…I must annihilate myself." (Fedya''s farewell letter, Act IV.)'
    significance: 'The logic of the title: not death but self-erasure. He is the legal obstacle to two honest people''s happiness, so he removes the obstacle — becomes a corpse on paper.'
    facsimile: ''
  - id: lc-tri-vybora
    genre: work
    pssTom: 34
    pages: '~75'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'три выбора — только три: служить, наживать деньги, увеличивать ту пакость, в которой живешь.'
    quoteEn: '(working English) "…three choices — only three: to serve, to make money, to add to the filth one lives in." (Fedya to the painter Petushkov, Act V, picture 1. The other two: to destroy the filth — for that one must be a hero, and he is not; or to forget oneself — drink, carouse, sing.)'
    significance: 'Widens the indictment from marriage to the whole social order. Fedya''s social diagnosis: serve the system, fight it (heroism he lacks), or drink — and he chose the third. The "superfluous man" register named from inside.'
    facsimile: ''
  - id: lc-ya-trup
    genre: work
    pssTom: 34
    pages: '~76'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'Нет. Я труп. Да.'
    quoteEn: '(working English) "No. I am a corpse. Yes." (Fedya to Petushkov, Act V — the title spoken.)'
    significance: 'The title in the protagonist''s mouth. His wife "is left a widow"; he is legally dead and physically alive — a living corpse.'
    facsimile: ''
  - id: lc-sudyat-obshchestvo
    genre: work
    pssTom: 34
    pages: '~96'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'Не их судят, а они судят общество.'
    quoteEn: '(working English) "It is not they who are on trial — it is they who judge society." (The young lawyer on Karenin and Liza in the dock, Act VI, picture 2.)'
    significance: 'The marquee stated by a minor character: the courtroom inverts. The honest defendants indict the law that drags them there.'
    facsimile: ''
  - id: lc-prestuplenie-suicide
    genre: work
    pssTom: 34
    pages: '~97'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'так только за то, что вы не совершили самоубийства, то есть того, что считается преступлением по закону и гражданскому и церковному.'
    quoteEn: '(working English) "…[you are tried] only because you did NOT commit suicide — that is, the thing considered a crime by both civil and church law." (The defence lawyer Petrushin to Fedya, Act VI.)'
    significance: 'The Catch-22 made explicit: suicide is a crime, faking it to free his wife is a crime, and the best case binds them all again. No honest exit exists in law — so he shoots himself for real.'
    facsimile: ''
  - id: lc-svyazhut
    genre: work
    pssTom: 34
    pages: '~98'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'То есть они опять меня свяжут с ней, то есть ее со мной?'
    quoteEn: '(working English) "That is — they will bind me to her again, her to me?" (Fedya, on the "best case" of church penance and annulment, Act VI.)'
    significance: 'Why acquittal is unbearable: the law''s mercy re-imprisons all three in the marriage it could not honestly dissolve. The trigger for the real suicide.'
    facsimile: ''
  - id: lc-trup-final
    genre: work
    pssTom: 34
    pages: '~99'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'я труп и со мной ничего не сделаете; нет того положения, которое было бы хуже моего.'
    quoteEn: '(working English) "I am a corpse, and you can do nothing to me; there is no position worse than mine." (Fedya to the investigating magistrate, Act VI, picture 1.)'
    significance: 'The corpse as the only free man — beyond the reach of law because already dead to it. The play''s bitterest paradox.'
    facsimile: ''
  - id: lc-chernyshevsky
    genre: work
    pssTom: 34
    pages: '~62'
    date: '1900'
    extract: extracts/v34_007_099_play.txt
    quoteRu: 'Рахманов взял да и сделал вид, что он утопился.'
    quoteEn: '(working English) "…[that fellow] Rakhmanov went and pretended he had drowned." (Masha, proposing the fake suicide to Fedya, Act IV — misremembering the name from Chernyshevsky''s What Is to Be Done?.)'
    significance: 'The Chernyshevsky subtext IN the play: Masha gets the idea of the staged drowning from «Что делать?». Primary-text confirmation of the intertext scholars (Wachtel 1992) argue for.'
    facsimile: ''

  # ---- Genesis: diaries (Tom 53–54) ----
  - id: lc-seed-1897
    genre: diary
    pssTom: 53
    pages: '172'
    date: '1897-12-29 (OS)'
    extract: extracts/v53_172_174_1897_12_29.txt
    quoteRu: 'Вчера же целый день складывалась драма- комедия: Труп.'
    quoteEn: '(working English) "And yesterday all day long a drama-comedy was taking shape: Corpse." (Diary, 29 Dec 1897.)'
    significance: 'The seed — 29 Dec 1897, more than two years before he wrote a line. The play is conceived as a "drama-comedy."'
    facsimile: ''
  - id: lc-seed-hadji
    genre: diary
    pssTom: 53
    pages: '172'
    date: '1897-12-29 (OS)'
    extract: extracts/v53_172_174_1897_12_29.txt
    quoteRu: 'Думал о Хаджи-Мурате.'
    quoteEn: '(working English) "Thought about Hadji Murat." (Diary, 29 Dec 1897 — the same entry that records the Corpse seed.)'
    significance: 'The Corpse is conceived in the same breath as Hadji Murat — the late fiction germinating side by side (cf. After the Ball, conceived 1903 beside Hadji Murat''s Nicholas I).'
    facsimile: ''
  - id: lc-uncle-vanya
    genre: diary
    pssTom: 54
    pages: '10'
    date: '1900-01-27 (OS)'
    extract: extracts/v54_010_010_1900_01_27.txt
    quoteRu: 'Ездил смотреть Дядю Ваню и возмутился. Захотел написать драму Труп, набросал конспект.'
    quoteEn: '(working English) "Went to see Uncle Vanya and was indignant. Wanted to write the drama Corpse, sketched an outline." (Diary, 27 Jan 1900.)'
    significance: 'The trigger — and a correction to the bland "after seeing Uncle Vanya" framing. Tolstoy was PROVOKED (возмутился) by Chekhov''s play; the Corpse was begun in reaction, not admiration.'
    facsimile: ''
  - id: lc-rabstvo
    genre: diary
    pssTom: 54
    pages: '26'
    date: '1900-05-19 (OS)'
    extract: extracts/v54_026_026_1900_05_19.txt
    quoteRu: 'Кончил «Рабство» и написал два акта.'
    quoteEn: '(working English) "Finished Slavery [of Our Times] and wrote two acts." (Diary, 19 May 1900, Yasnaya Polyana.)'
    significance: 'The play is twinned with the publicistic tract The Slavery of Our Times — written in the same days. The art and the polemic share one desk; the polemic will soon win.'
    facsimile: ''
  - id: lc-okonchil
    genre: diary
    pssTom: 54
    pages: '33'
    date: '1900-08-15 (OS)'
    extract: extracts/v54_033_035_1900_08_15.txt
    quoteRu: 'писал Труп — окончил. И втягиваюсь все дальше и дальше.'
    quoteEn: '(working English) "…wrote Corpse — finished it. And I am drawn further and further in." (Diary, 15 Aug 1900.)'
    significance: 'Completion of the first full draft, and the danger he feels in it: the work pulls him in — exactly the "frivolous" absorption he will renounce four months later.'
    facsimile: ''
  - id: lc-ne-delo-bozhie
    genre: diary
    pssTom: 54
    pages: '35'
    date: '1900-08-21 (OS)'
    extract: extracts/v54_035_037_1900_08_21.txt
    quoteRu: 'Писал драму и недоволен ею совсем. Нет сознания, что это — дело Божие'
    quoteEn: '(working English) "Wrote the drama and am quite dissatisfied with it. No sense that this is God''s work…" (Diary, 21 Aug 1900.)'
    significance: 'The post–What Is Art? conscience already at work six days after finishing: a play is not "God''s work." The seed of the abandonment is internal, not the Gimer plea.'
    facsimile: ''
  - id: lc-predsmertnye-draft
    genre: diary
    pssTom: 54
    pages: '42'
    date: '1900-09-07 (OS)'
    extract: extracts/v54_039_042_1900_09_07.txt
    quoteRu: 'а может быть я ошибся. Ну да чтò сделано, то сделано. Несите.'
    quoteEn: '(working English) "…and perhaps I was mistaken. But what''s done is done. Carry me." (Diary draft for Fedya''s dying words, 7 Sept 1900.)'
    significance: 'A drafted ending Tolstoy did NOT keep — Fedya dying in doubt. The finished text replaces it with the serene "Как хорошо… Как хорошо." A keystone redaction visible in the diary.'
    facsimile: ''
  - id: lc-nemirovich
    genre: diary
    pssTom: 54
    pages: '48'
    date: '1900-10-16 (OS)'
    extract: extracts/v54_048_049_1900_10_16.txt
    quoteRu: 'Немирович Данченко был о драме. А у меня к ней охота прошла.'
    quoteEn: '(working English) "Nemirovich-Danchenko came about the drama. But my appetite for it has gone." (Diary, 16 Oct 1900.)'
    significance: 'The Moscow Art Theatre''s director comes to Yasnaya Polyana to ask for the play; Tolstoy''s desire for it is already dead — eleven years before the MAT would in fact premiere it.'
    facsimile: ''
  - id: lc-brosit
    genre: diary
    pssTom: 54
    pages: '65'
    date: '1900-11-28 (OS)'
    extract: extracts/v54_065_066_1900_11_28.txt
    quoteRu: 'Драму Труп надо бросить. А если писать, то ту драму и продолжение Воскресенья.'
    quoteEn: '(working English) "The drama Corpse must be dropped. And if I write, then that [other] drama and the continuation of Resurrection." (Diary, 28 Nov 1900.)'
    significance: 'THE abandonment, in his own hand — and the reason he names is not the Gimers but the pull of the people''s suffering (the entry opens recalling "the life of the people: need, humiliation, and our guilt" after reading Novikov''s article). The conscience-turn, dated.'
    facsimile: ''
  - id: lc-narod-vina
    genre: diary
    pssTom: 54
    pages: '65'
    date: '1900-11-28 (OS)'
    extract: extracts/v54_065_066_1900_11_28.txt
    quoteRu: 'вспомнил то, чтò забыл: жизнь народа: нужду, унижение и наши вины.'
    quoteEn: '(working English) "…remembered what I had forgotten: the life of the people — their need, humiliation, and our guilt." (Diary, 28 Nov 1900, the entry that drops the play.)'
    significance: 'The actual content of the conscience-turn: the people''s need, not the Gimers'' fear, is what makes the drama feel like a frivolous distraction.'
    facsimile: ''
  - id: lc-kreutzer-lineage
    genre: diary
    pssTom: 54
    pages: '72'
    date: '1900-12-15 (OS)'
    extract: extracts/v54_071_073_1900_12_15.txt
    quoteRu: 'я писал без всякой думы о проповеди людям, о пользе'
    quoteEn: '(working English) "…[The Kreutzer Sonata, The Power of Darkness, even Resurrection] I wrote with no thought of preaching to people, of usefulness… and yet [The Kreutzer Sonata especially] did much good. Is it not so with Corpse too?" (Diary, 15 Dec 1900.)'
    significance: 'Tolstoy himself places The Living Corpse in the lineage of Kreutzer / Power of Darkness / Resurrection — and wonders if it, too, might "do good." His own answer to the "about-face from Kreutzer" reading: continuity, not reversal.'
    facsimile: ''
  - id: lc-sochinitelstvo
    genre: diary
    pssTom: 54
    pages: '79'
    date: '1900-12-31 (OS)'
    extract: extracts/v54_079_079_1900_12_31.txt
    quoteRu: 'Хотел так переделать свою драму. Да видно, мое сочинительство кончилось.'
    quoteEn: '(working English) "I wanted to rework my drama like that. But evidently my fiction-writing is over." (Diary, 31 Dec 1900.)'
    significance: 'Year''s end: a fresh dramaturgical idea (each character should speak as long as his nature dictates) — and the verdict that his art-making is finished. The play is abandoned to that finality.'
    facsimile: ''

  # ---- Genesis & abandonment: letters (Tom 72, Tom 88) ----
  - id: lc-posse
    genre: letter
    pssTom: 72
    pages: '482'
    date: '1900-10-06 (OS)'
    addressee: 'V. A. Posse (editor of the journal Жизнь)'
    extract: extracts/v72_397_V_A_Posse.txt
    quoteRu: 'Я нетолько не обещал драмы, которой у меня нет, но и ничего не обещал.'
    quoteEn: '(working English) "I not only did not promise a drama I do not have — I promised nothing at all." (Letter to V. A. Posse, 6 Oct 1900.)'
    significance: 'The refusals begin: as the rumour leaks, editors and theatres ask for the play; Tolstoy denies he even has one. He guards the unfinished text.'
    facsimile: ''
  - id: lc-chertkov-baluyas
    genre: letter
    pssTom: 88
    pages: '216'
    date: '1900-12-12 (OS)'
    addressee: 'V. G. Chertkov'
    extract: extracts/v88_607_chertkov_dec12.txt
    quoteRu: 'шутя, или, вернее, балуясь, я написал начерно'
    quoteEn: '(working English) "…[the drama] I wrote in jest, or rather, fooling about, as a rough draft… but I not only do not think now of finishing and printing it, I very much doubt I ever shall." (Letter to Chertkov, 12 Dec 1900.)'
    significance: 'The most-quoted self-dismissal. Read with the diary, "балуясь" is not modesty but the conscience-verdict: the play was play, and "so much more is needful before my conscience."'
    facsimile: ''
  - id: lc-chertkov-legkomysl
    genre: letter
    pssTom: 88
    pages: '217'
    date: '1900-12-12 (OS)'
    addressee: 'V. G. Chertkov'
    extract: extracts/v88_607_chertkov_dec12.txt
    quoteRu: 'Это поощряло бы меня писать легкомысленное.'
    quoteEn: '(working English) "It would have encouraged me to write frivolous things." (Letter to Chertkov, 12 Dec 1900 — on abandoning a planned literary venture.)'
    significance: 'The clearest statement of the art-vs-conscience tension that abandoned the play: fiction-for-amusement is "frivolous" (легкомысленное) and to be resisted.'
    facsimile: ''

  # ---- Prototypes & abandonment: PSS commentary (Tom 34, История писания) ----
  - id: lc-comm-davydov
    genre: commentary
    pssTom: 34
    pages: '533'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'В основу сюжета драмы «Живой труп» положены обстоятельства судебного дела супругов Н. С. и Е. П. Гимер'
    quoteEn: '(working English) "The plot of the drama The Living Corpse is founded on the circumstances of the court case of the spouses N. S. and E. P. Gimer…" (PSS Tom 34 commentary; the case was told to Tolstoy by N. V. Davydov, chairman of the Moscow District Court.)'
    significance: 'The prototype edge, documented: a real false-suicide/bigamy case, supplied by Tolstoy''s judge-friend Davydov — the legal-circle source that also gave him Resurrection (via Koni).'
    facsimile: ''
  - id: lc-comm-protasovy
    genre: commentary
    pssTom: 34
    pages: '533'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'послуживших прототипами Федора Васильевича и Елизаветы Андреевны Протасовых'
    quoteEn: '(working English) "…[N. S. and E. P. Gimer], who served as the prototypes of Fyodor Vasilyevich and Elizaveta Andreevna Protasov." (PSS Tom 34 commentary.)'
    significance: 'The named character→person mapping for the two leads: Fedya ← N. S. Gimer; Liza ← E. P. Gimer. Documented, not conjectured.'
    facsimile: ''
  - id: lc-comm-simon
    genre: commentary
    pssTom: 34
    pages: '533'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'многие черты которой воплощены в образе матери Лизы Протасовой, Анны Павловны.'
    quoteEn: '(working English) "…[E. A. Simon] many of whose traits are embodied in the figure of Liza Protasova''s mother, Anna Pavlovna." (PSS Tom 34 commentary.)'
    significance: 'Anna Pavlovna ← E. A. Simon, the real mother (whom Tolstoy knew; she often visited the Tolstoys 1887–89, and her son lived at Yasnaya Polyana). A documented prototype.'
    facsimile: ''
  - id: lc-comm-ivanov
    genre: commentary
    pssTom: 34
    pages: '534'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'послужил прототипом Ивана Петровича Александрова.'
    quoteEn: '(working English) "[Tolstoy''s copyist Aleksandr Petrovich Ivanov, a sick man who suffered from drinking bouts, a frequent visitor of the Khitrovka flophouse] served as the prototype of Ivan Petrovich Aleksandrov." (PSS Tom 34 commentary.)'
    significance: 'The "genius" (гений) of the tavern ← A. P. Ivanov, Tolstoy''s own copyist. The same Ivanov who, drunk at Khitrovka, leaked the plot to a reporter — the prototype who helped doom the play.'
    facsimile: ''
  - id: lc-comm-ofrosimov
    genre: commentary
    pssTom: 34
    pages: '534'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'В образе Афремова (в черновых редакциях — Афросимова) изображен Александр Павлович Офросимов'
    quoteEn: '(working English) "In the figure of Afremov (in the drafts, Afrosimov) is depicted Aleksandr Pavlovich Ofrosimov [1846–1921, a rich Tula landowner, neighbour and acquaintance of the Tolstoys, a great lover of gypsy singing]." (PSS Tom 34 commentary.)'
    significance: 'Afremov ← A. P. Ofrosimov, a Tula neighbour. A documented minor-character prototype (with the gypsy-song milieu drawn from life).'
    facsimile: ''
  - id: lc-comm-gimer-plea
    genre: commentary
    pssTom: 34
    pages: '542'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'к Толстому пришел сын Н. С. Гимера и просил от имени матери не публиковать драму'
    quoteEn: '(working English) "…N. S. Gimer''s son came to Tolstoy and asked, on his mother''s behalf, not to publish the drama [lest it revive interest in the dormant court case and lead to her imprisonment]." (PSS Tom 34 commentary.)'
    significance: 'The documented "wound the living" pressure: after the leak (Nov 1900), the real family begged Tolstoy not to publish. Real and immediate — but, per the commentary, one cause "также" (also), alongside the conscience-turn.'
    facsimile: ''
  - id: lc-comm-gnedich
    genre: commentary
    pssTom: 34
    pages: '540'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'Я в «Плодах просвещения» был, как автор, на стороне мужиков'
    quoteEn: '(working English) "In The Fruits of Enlightenment I was, as author, on the side of the peasants — but on stage they suddenly turned out to be the same rogues and cheats as [the rest]…" (Tolstoy to P. P. Gnedich, refusing the play for the imperial theatres, autumn 1900; reported in Gnedich''s memoirs.)'
    significance: 'Tolstoy''s own stated distrust of the stage — the gap between text and performance — drawn from the Fruits of Enlightenment experience. A reason for withholding rooted in his theory of art, cross-linking the two drama dives.'
    facsimile: ''
  - id: lc-comm-koni-1904
    genre: commentary
    pssTom: 34
    pages: '541'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'Нет, это читать не стоит: оно не кончено, да и вообще мне не нравится, и я его совсем бросил'
    quoteEn: '(working English) "No, it''s not worth reading: it''s not finished, and anyway I don''t like it, and I''ve dropped it altogether." (Tolstoy to A. F. Koni, spring 1904, refusing to let him read the play; reported by Koni.)'
    significance: 'Tolstoy''s own later verdict, four years on: not finished, disliked, dropped. The author''s settled judgment — to the very jurist whose legal world the play indicts.'
    facsimile: ''
  - id: lc-comm-publication
    genre: commentary
    pssTom: 34
    pages: '542'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'Впервые драма была опубликована в газете «Русское слово» 23 сентября 1911 г.'
    quoteEn: '(working English) "The drama was first published in the newspaper Russkoe Slovo on 23 September 1911 [OS], and simultaneously as a separate edition under V. G. Chertkov''s editorship." (PSS Tom 34 commentary.)'
    significance: 'Publication facts: posthumous, 23 Sept (OS) 1911, Russkoe Slovo + a Chertkov/Sytin edition — within a year of Tolstoy''s death and days before the MAT premiere.'
    facsimile: ''
  - id: lc-comm-uncle-vanya
    genre: commentary
    pssTom: 34
    pages: '534'
    date: '1952'
    extract: extracts/v34_533_543_history.txt
    quoteRu: 'после просмотра пьесы А. П. Чехова «Дядя Ваня»'
    quoteEn: '(working English) "…work on the play was begun only in January 1900, after seeing A. P. Chekhov''s play Uncle Vanya at the Moscow Art Theatre." (PSS Tom 34 commentary.)'
    significance: 'Confirms the Uncle Vanya trigger and the January 1900 start; read with the diary (lc-uncle-vanya), the reaction was indignation, not admiration.'
    facsimile: ''

  # ---- Redactions: variants & plans (Tom 34) ----
  - id: lc-var-kryukova
    genre: work
    pssTom: 34
    pages: '411'
    date: '1900'
    extract: extracts/v34_411_483_variants.txt
    quoteRu: 'сторонница свободной любви, весь интерес жизни всех людей полагающая в влюбленьи.'
    quoteEn: '(working English) "…an advocate of free love, who places the whole interest of everyone''s life in being in love." (Description of Marya Vasilyevna Kryukova, the lead figure of the first redaction, var. № 1.)'
    significance: 'KEYSTONE REDACTION. The first draft (titled simply «Труп») opened not with Liza''s mother and the moral frame but with Kryukova, a 30-ish "advocate of free love." Tolstoy replaced this framing figure with the conventional mother Anna Pavlovna — shifting the play''s moral centre of gravity. (The PSS restores Kryukova in Act V, picture 2, where earlier editions had wrongly substituted Anna Pavlovna.)'
    facsimile: ''
  - id: lc-plan-predsmertnye
    genre: work
    pssTom: 34
    pages: '410'
    date: '1900'
    extract: extracts/v34_407_410_plans.txt
    quoteRu: 'Какая странная вещь жизнь! Зачем всё это так?'
    quoteEn: '(working English) "What a strange thing life is! Why is it all like this?" (Draft of Fedya''s dying monologue, plan № 5 / ms. № 4 — cut from the final text.)'
    significance: 'A cut metaphysical death-speech — Fedya philosophising as he dies ("…how many different ways it all could have been"). Tolstoy struck it for the bare "Как хорошо." A redaction that shows the play moving from talk toward gesture.'
    facsimile: ''

