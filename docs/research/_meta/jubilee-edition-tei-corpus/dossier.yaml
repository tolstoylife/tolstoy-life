  # ---- B. The printed Jubilee Edition (PD facsimiles + front matter) ----
  - id: pss-cover-tom53
    genre: print-frontmatter
    pssTom: 53
    pages: null
    date: 1953-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol19/vol19.pdf
    extract: extracts/pss-cover-headers.txt
    quoteRu: >-
      Полное собрание сочинений. Том 53.
    quoteEn: >-
      Complete Collected Works. Volume 53. (the auto-generated cover header). (working English)
    significance: >-
      The "Весь Толстой в один клик" cover header that names the canonical Tom number — the anchor for
      pss-volume-mapping (local PDFs are numbered by publication order, not Tom). Tom 53 = local vol19,
      imprint "Государственное издательство «Художественная литература», 1953".
    facsimile: null

  - id: pss-cover-tom91-index
    genre: print-frontmatter
    pssTom: 91
    pages: null
    date: 1964-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol60/vol60.pdf
    extract: extracts/pss-cover-headers.txt
    quoteRu: >-
      Полное собрание сочинений. Том 91.
    quoteEn: >-
      Complete Collected Works. Volume 91 — "Указатели" (Indexes). (working English)
    significance: >-
      The 1964 supplementary index volume (local vol60): alphabetical indexes of works, addressees, and
      >16,000 proper names + a chronological index. The intellectual source of the personList authority
      file and the index.tolstoy.ru web app.
    facsimile: null

  - id: pss-rgb-provenance
    genre: print-frontmatter
    pssTom: 53
    pages: null
    date: null
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol19/vol19.pdf
    extract: extracts/pss-cover-headers.txt
    quoteRu: >-
      Подготовлено на основе электронной копии 53-го тома Полного собрания сочинений Л. Н. Толстого, предоставленной Российской государственной библиотекой
    quoteEn: >-
      Prepared on the basis of an electronic copy of volume 53 of the Complete Collected Works of L. N. Tolstoy, provided by the Russian State Library. (working English)
    significance: >-
      The digitisation's scan source: the Russian State Library (РГБ) provided the electronic copies
      that the crowdsourcing project proofread. Maps to the sources.yaml id rgb-tolstoy-fond.
    facsimile: null

  - id: pss-reproduction-notice
    genre: print-frontmatter
    pssTom: 1
    pages: "iv"
    date: 1935-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol62/vol62.pdf
    extract: extracts/pss-vol62-frontmatter.txt
    quoteRu: >-
      Перепечатка разрешается безвозмездно
    quoteEn: >-
      Reprinting is permitted gratis [free of charge]. (Followed by "Reproduction libre pour tous les pays.") (working English)
    significance: >-
      The printed edition's OWN free-reproduction notice — the textual root of why the corpus is openly
      reusable, and a direct echo of Tolstoy's renunciation of copyright (see the copyright-renunciation
      dive). PD facsimile rendered from the local PDF.
    facsimile: extracts/pss-vol62-pages/page-004.png

  - id: pss-state-commission
    genre: print-frontmatter
    pssTom: 1
    pages: "v"
    date: 1928-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol62/vol62.pdf
    extract: extracts/pss-vol62-frontmatter.txt
    quoteRu: >-
      непосредственную работу по редактированию тому другу покойного писателя, которого он сам выбрал для этой цели
    quoteEn: >-
      …the direct work of editing to that friend of the deceased writer whom he himself chose for this purpose… (i.e. V. G. Chertkov). (working English)
    significance: >-
      From "ОТ ГОСУДАРСТВЕННОЙ РЕДАКЦИОННОЙ КОМИССИИ" (From the State Editorial Commission): the Soviet
      government's own statement that it entrusted the edition to the friend Tolstoy himself chose —
      Chertkov as editor-in-chief, in the edition's front matter. PD facsimile.
    facsimile: extracts/pss-vol62-pages/page-005.png

  - id: pss-commission-omissions
    genre: print-frontmatter
    pssTom: 1
    pages: "v"
    date: 1928-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol62/vol62.pdf
    extract: extracts/pss-vol62-frontmatter.txt
    quoteRu: >-
      Редакция не может не иметь права делать такого рода пропуски
    quoteEn: >-
      The editorial board cannot but have the right to make omissions of this kind… (working English)
    significance: >-
      The same State-Commission preface reserves a right of omission (for documents touching living
      persons, or a word/phrase) — the Soviet-era editorial constraint stated openly in the edition's
      own front matter. PD facsimile.
    facsimile: extracts/pss-vol62-pages/page-005.png

  - id: pss-chertkov-foreword-will
    genre: print-frontmatter
    pssTom: 1
    pages: "vi"
    date: 1928-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol62/vol62.pdf
    extract: extracts/pss-vol62-frontmatter.txt
    quoteRu: >-
      Это же самое желание он затем подтвердил письменно в своем завещательном распоряжении от 31 июля 1910 г.
    quoteEn: >-
      This same wish he then confirmed in writing in his testamentary disposition of 31 July 1910. (working English)
    significance: >-
      From "ОТ ГЛАВНОГО РЕДАКТОРА" (From the Editor-in-Chief), Chertkov's own foreword: Tolstoy asked him
      to review and publish the unpublished manuscripts, confirmed in the 31 July 1910 testamentary
      disposition — the exact document the copyright-renunciation dive centres on. PD facsimile.
    facsimile: extracts/pss-vol62-pages/page-006.png

  - id: pss-chertkov-everything
    genre: print-frontmatter
    pssTom: 1
    pages: "vi"
    date: 1928-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol62/vol62.pdf
    extract: extracts/pss-vol62-frontmatter.txt
    quoteRu: >-
      нам в настоящем издании приходится именно в таком полном виде воспроизводить решительно все, написанное Толстым.
    quoteEn: >-
      …in the present edition we have to reproduce, in exactly such complete form, absolutely everything written by Tolstoy. (working English)
    significance: >-
      Chertkov's statement of the edition's maximalist completeness principle — print everything,
      including private letters, diaries, and drafts — the textual-ethics foundation of the 90 volumes.
      PD facsimile.
    facsimile: extracts/pss-vol62-pages/page-006.png

