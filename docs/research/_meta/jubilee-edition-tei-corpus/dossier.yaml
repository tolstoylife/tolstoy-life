# Layer — secondary scholarship (Phase 3). English-first; Russian where authoritative.
scholarship:
  summary: >-
    There is little dedicated English-language scholarship on the Jubilee Edition as an object; the
    fullest account is the Russian documentary history L. A. Osterman, «Сражение за Толстого» (2000),
    and the Cambridge "Tolstoy in Context" chapter on the Complete Works (2022). On the digital side,
    the Tolstoy Digital team has published a substantial DH record (Bonch-Osmolovskaya et al., Journal
    of Web Semantics 2019; Orekhov 2020; DH conference papers). The received view: the 90-volume
    edition is "the most complete and professionally executed extant edition of Tolstoy" (Cambridge,
    2022), founded on a maximalist completeness principle, but shaped by Soviet-era editorial framing;
    the digital corpus is celebrated as a model of semantic scholarly editing of a literary heritage.
  triangulation:
    - evidenceRef: pss-state-commission
      conventionalView: >-
        English secondary accounts compress the edition's authorisation to "Lenin's affidavit (1918)"
        and "Stalin's state decree" (Cambridge, 2022).
      relation: complicates
      source: "Osterman, L. A. «Сражение за Толстого». Moscow: Monolit, 2000."
    - evidenceRef: pss-commission-omissions
      conventionalView: >-
        The edition is widely described as complete and authoritative, with Soviet-era ideological
        framing noted as a caveat.
      relation: extends
      source: "Osterman, L. A. «Сражение за Толстого» (2000); Tolstoy in Context, ch. 34 (Cambridge, 2022)."
    - evidenceRef: pss-chertkov-everything
      conventionalView: >-
        Scholars describe the edition's completeness principle thematically.
      relation: confirms
      source: "Tolstoy in Context, ch. 34 (Cambridge, 2022)."
    - evidenceRef: tei-licence-ccbysa
      conventionalView: >-
        The corpus is commonly described as openly licensed CC BY-SA.
      relation: complicates
      source: "github.com/tolstoydigital/TEI (header <availability>; repo API licence: None)."
    - evidenceRef: tei-personlist-record
      conventionalView: >-
        Tolstoy Digital is presented as a semantic edition with named-entity and relation layers.
      relation: confirms
      source: "Bonch-Osmolovskaya, A. et al. 'Tolstoy semanticized.' Journal of Web Semantics 59 (2019)."

# Intra-corpus corrections (primary-vs-primary / vs the project's own loose docs). Distinct from scholarship.
contradictions:
  - claim: "The edition is the '91-volume' Jubilee Edition / spans 1928–1964 (loose project usage)."
    correction: >-
      The edition proper is 90 volumes published 1928–1958; the 1964 «Том 91» is a separate
      supplementary index volume. The two existing project docs use both "1928–1964" and "1928–1958";
      the precise statement is 90 vols 1928–1958 + a 1964 index. Per-volume publication years on the
      covers confirm the run (e.g. Tom 1 = 1935, Tom 53 = 1953, Tom 91 = 1964).
    evidenceRef: pss-cover-tom91-index
  - claim: "tolstoydigital-tei-reference.md: 'the texts/ holds ~16,600 XML'."
    correction: >-
      Measured locally, texts/ holds 16,573 XML files (works 767, letters 9,087, diaries 4,584, notes
      100, krug_chtenija 444, azbuka 784, comments 807), mirrored 1:1 by texts_front/.
    evidenceRef: tei-taxonomy

notCovered:
  - "The 100-volume academic PSS (IMLI/Gorky Institute, 2000– ) — the modern successor edition; only contextually mentioned, not held locally."
  - "Per-volume editorial apparatus depth comparison (Tom 13 minimal vs Tom 47 maximal) beyond the headline."
  - "The witness corpora (Goldenweiser, Gusev's Летопись, Makovitski, S. A. Tolstaya) as content — inventoried structurally only."
  - "Wikidata reconciliation of the 3,113 personList ids against the vault's person identifiers (a separate ingestion task)."
  - "The full DH bibliography beyond the load-bearing papers (DH2014/2016/2018/2023 abstracts)."
  - "Tom 31 → local-PDF resolution (still open in pss-volume-mapping); not re-attempted here."

needsReview:
  - item: "No native wiki type for 'edition'."
    phase: synthesis
    why: >-
      The Jubilee Edition and the TEI corpus are routed as wikiType concept / institution, but neither
      fits an edition cleanly. Consider whether the wiki schema needs an 'edition' type, or whether
      concept is the settled home.
  - item: "tolstoydigital TEI corpus is not a registered source in sources.yaml."
    phase: synthesis
    why: >-
      The corpus underpins nearly all the platform's structured data but has no sources.yaml id. Adding
      a `tolstoydigital-tei` (database/primary) source id would let entity rows cite it.
  - item: "Dictionary.xml and listMedia.xml are not strictly well-formed."
    phase: extract
    why: >-
      They carry non-NCName xml:id values (e.g. obinujas'), so a strict XML parser fails; a recovering
      parser is required. Note for any future ingestion tooling.
  - item: "'5,000 copies' vs '10,000' print run."
    phase: scholarship
    why: >-
      Per Osterman (2000) the run was originally 5,000, raised to 10,000 by a Sovnarkom resolution of
      8 Aug 1934, with per-volume variation. The two existing project docs and most popular accounts
      cite only 5,000. State as 'originally 5,000, later raised to 10,000'.

