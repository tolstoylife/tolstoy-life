# Machine-readable dossier for the Jubilee-Edition + tolstoydigital-TEI corpus dive (index.md).
# Built 2026-05-30. This is an ATYPICAL dive: the "evidence" rows cite the corpus and edition
# *metadata* themselves (TEI headers, the printed front matter, the reference files) rather than
# thematic prose from Tolstoy. Every quoteRu is byte-faithful from the named `extract` file
# (verify_quotes.py gate). Consolidates + supersedes the two loose docs tolstoydigital-tei-reference.md
# and pss-volume-mapping.md.
topic:
  slug: jubilee-edition-tei-corpus
  title: "The Jubilee Edition and the tolstoydigital TEI/XML corpus"
  question: >-
    What are the Jubilee Edition (Полное собрание сочинений, 90 vols 1928–1958 + the 1964 index
    volume) and the tolstoydigital TEI/XML corpus that digitises it — their history, the people and
    institutions behind them, their editorial principles, the structure of the collections, and what
    tolstoy.life holds locally?
  date: 2026-05-30
  period: null            # meta/reference dive — not period-bound
  corpusSurface: [edition-metadata, tei-headers, reference-files, print-front-matter]
  dateRange: "1928–2022"  # print edition (1928–1958/64) through the TEI encoding (2015–2022)

# Layer 1 — flat citation ledger. For this meta-dive, quoteRu is verbatim corpus/edition metadata
# (not Tolstoy's prose). quoteEn is working English (labelled) where the source is prose; for bare
# metadata strings it is a short gloss. Facsimiles are PD pages rendered from the local PSS PDFs.
evidence:
  # ---- A. The tolstoydigital TEI/XML digital corpus ----
  - id: tei-bibl-citation-format
    genre: tei-metadata
    pssTom: 1
    pages: "3–95"
    date: null
    addressee: null
    localPdf: primary-sources/tolstoydigital-TEI/texts/works/v01_003_095_Detstvo.xml
    extract: extracts/tei-header-works.txt
    quoteRu: >-
      Толстой Л. Н. Детство // Толстой Л. Н. Полное собрание сочинений: в 90 тт. Т. 1. М.: Гос. изд. «Художественная литература», 1935.
    quoteEn: >-
      Tolstoy L. N. Childhood // Tolstoy L. N. Complete Collected Works: in 90 vols. Vol. 1. Moscow: State Publishing House "Khudozhestvennaya Literatura", 1935. (working English)
    significance: >-
      Every TEI file carries a title[@type="bibl"] giving the canonical PSS citation — Tom, publisher,
      year, page range. This is the join key from the digital corpus back to the printed Jubilee
      Edition (and to pss-volume-mapping for the local PDF).
    facsimile: null

  - id: tei-licence-ccbysa
    genre: tei-metadata
    pssTom: null
    pages: null
    date: null
    addressee: null
    localPdf: primary-sources/tolstoydigital-TEI/texts/works/v01_003_095_Detstvo.xml
    extract: extracts/tei-header-works.txt
    quoteRu: >-
      Тексты и метатекстовая разметка доступны для свободного использования и распространения по лицензии Creative Commons Attribution Share-Alike (cc by-sa)
    quoteEn: >-
      The texts and the metatextual markup are available for free use and distribution under the Creative Commons Attribution Share-Alike (cc by-sa) licence. (working English)
    significance: >-
      The CC BY-SA grant lives in the TEI header's <availability>, NOT as a repo-level LICENSE file
      (GitHub's API reports the repo licence as None). The grant is real but header-scoped — relevant
      for any downstream reuse claim.
    facsimile: null

  - id: tei-provenance-note
    genre: tei-metadata
    pssTom: null
    pages: null
    date: null
    addressee: null
    localPdf: primary-sources/tolstoydigital-TEI/texts/works/v01_003_095_Detstvo.xml
    extract: extracts/tei-header-works.txt
    quoteRu: >-
      Публикуемые документы был получены с сайта tolstoy.ru в формате html, переведены в формат TEI. Исправлены некоторые ошибки распознавания. Тексты, написанные в дореформенной орфографии, сопоставлены с их версиями в современной орфографии.
    quoteEn: >-
      The published documents were obtained from the site tolstoy.ru in html format and converted to TEI. Some recognition (OCR) errors were corrected. Texts written in pre-reform orthography were collated with their modern-orthography versions. (working English)
    significance: >-
      The data chain in the corpus's own words. Note the source typo "был" (for "были"), identical in
      every file — a fingerprint of the shared header template, not a per-file error.
    facsimile: null

