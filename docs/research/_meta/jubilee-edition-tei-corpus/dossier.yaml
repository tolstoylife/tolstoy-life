  - id: tei-taxonomy
    genre: tei-metadata
    pssTom: null
    pages: null
    date: null
    addressee: null
    localPdf: primary-sources/tolstoydigital-TEI/reference/taxonomy.xml
    extract: extracts/taxonomy-sample.txt
    quoteRu: >-
      Религия и философия
    quoteEn: >-
      "Religion and philosophy" — one topic category. (working English)
    significance: >-
      taxonomy.xml is the 125-category controlled vocabulary xi:include'd by every text via <catRef>:
      type (works/letters/diaries/notes/comments), genre (роман/повесть/рассказ/трактат…), sphere
      (fiction/non-fiction), topic, published/finished status, plus person and photo facets.
