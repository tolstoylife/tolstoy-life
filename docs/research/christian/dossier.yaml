scholarship:
  summary: 'Scholarship treats Tolstoy as a ''heterodox'' or ''unorthodox'' Christian who, after the crisis of 1878-1880, reinterpreted Christianity rationally and ethically around the Sermon on the Mount, universal love, and non-resistance; ''Christian anarchist'' is the standard label even though Tolstoy adopted none. The literature focuses overwhelmingly on what he REJECTED (Trinity, Christ''s divinity, miracles, sacraments, Church authority) rather than on his positive, explicit refusal of the bare word ''Christian'' in its church sense. The 1901 excommunication and his April reply are universally cited, but scholars quote the climax (''I profess this Christianity'') while rarely foregrounding the conditional ''as I understand it'' that governs it. His perennialism (the Krug chteniya drawing Buddha, Confucius and Marcus Aurelius alongside the Gospels) is acknowledged by specialists (Moulin 2017) but stays peripheral to the biographies. The dive''s contribution is granular: it maps the REPLY itself across many correspondents - the argumentative moves Tolstoy made when the word was put to him directly - which the secondary literature, classifying his theology from the outside, largely skips.'
  triangulation:
  - evidenceRef: das_sharma_1903_not_in_accepted_sense
    conventionalView: 'Biographers classify Tolstoy as a heterodox Christian from the outside (Wilson reportedly: ''he was never really a Christian'' by orthodox standards), inferring his distance from the label from his theology rather than quoting him decline the word in his own correspondence.'
    relation: extends
    source: A. N. Wilson, Tolstoy, 1988
  - evidenceRef: khilkov_1890_cannot_be
    conventionalView: No standard source works through Tolstoy's argument that Christianity is structurally unlike Judaism or Islam - no outward defining act, hence an ideal rather than a possessed identity; scholars note his 'way of life not a creed' but not this specific reason the label is inherently inapt.
    relation: extends
  - evidenceRef: gets_1898_indifferent_name
    conventionalView: The received view stresses Tolstoy's hostility to institutional labels (he resisted 'Tolstoyan' too) and his universalism, implicitly confirming indifference to denominational names; but no major source foregrounds the pragmatic 'it is all the same to me what one calls it' stance as a distinct position.
    relation: confirms
    source: Daniel Moulin, 'Tolstoy, Universalism and the World Religions', 2017
  - evidenceRef: murtazin_1910_worker_of_god
    conventionalView: Movement literature describes Tolstoyans as 'followers of Christ's teaching' rather than institutional Christians, echoing his framing; but the dissolution of social-identity labels into 'a worker of God' goes beyond what biographies register, which stop at his rejection of church Christianity.
    relation: extends
    source: Tolstoyan movement (Wikipedia); JSTOR Daily, 'Tolstoy's Christian Anarchism'
  - evidenceRef: rukavishnikov_1909_perennial
    conventionalView: 'Widely confirmed: scholarship agrees Tolstoy redefined ''true Christianity'' as the universal ethical kernel shared across traditions; Moulin (2017) documents his interfaith and Unitarian connections, and ''I try to be a Christian'' sits naturally within this view.'
    relation: confirms
    source: Daniel Moulin, 'Tolstoy, Universalism and the World Religions', 2017
  - evidenceRef: vyazemsky_1901_church_enemy
    conventionalView: 'Fully corroborated: every standard account (Maude, Wilson, Bartlett, Simmons) documents Tolstoy''s view that institutional Christianity inverted Christ''s teaching; the ''greatest enemy of Christ'' formula is stronger than most scholars quote but expresses the standard position.'
    relation: confirms
    source: Aylmer Maude, The Life of Tolstoy, 1930; A. N. Wilson, Tolstoy, 1988
  - evidenceRef: synod_1901_professes
    conventionalView: The April 1901 reply is universally cited and the climax 'I profess this Christianity' is read as his claiming the name under qualification; careful readers note 'as I understand it', but it is rarely foregrounded as the crux - that 'truth coincides FOR ME with Christianity' is a conditional, perspectival claim, not a bare assertion of Christian identity.
    relation: complicates
    source: Tolstoy, My Reply to the Synod (Wikisource); Pal Kolsto, Heretical Orthodoxy (Cambridge UP)
