scholarship:
  summary: >-
    The dominant English-language frame is Katherine M. H. Reischl's Photographic Literacy (Cornell
    UP, 2018), whose Tolstoy chapter ("Tolstoy in the Age of His Technological Reproducibility")
    argues a "crisis of authorship": Tolstoy was simultaneously a photographic subject shaped by
    others and an occasional agent of his own image, but mass reproduction dissociated his likeness
    from his person, and he lost control of it — the dispute settled, after his death, in Chertkov's
    favour, so his image "passed into the property of the public sphere". Scholarship frames two
    competing photographic projects: Sofia Andreevna's domestic, family-album photography (~1,000
    photographs from the late 1880s; Bendavid-Val 2007) and Chertkov's public, prophet-among-peasants
    image-making. Tolstoy's reluctance is acknowledged behaviourally (the Bioscope's account of
    cameramen at the gates; Drankov's hidden-camera 1908 filming), but the popular Sofia-as-jealous-
    antagonist framing (Popoff; The Last Station) is a contested, attributed position, not a baseline.
  triangulation:
    - evidenceRef: v61_444_M_N_Tolstoj
      conventionalView: "Some popular sources credit the 1856 group photo's initiative to Sofia (impossible — she married Tolstoy only in 1862)."
      relation: contradicts
      source: "Moscow MAMM / rbth.com (popular, internally incoherent)"
    - evidenceRef: v57_141_142_1909_09_17
      conventionalView: "Scholarship records Tolstoy's reluctance behaviourally (pursued by cameramen) but does not quote his subjective vocabulary."
      relation: extends
      source: "Reischl 2018; The Bioscope 2009"
    - evidenceRef: v53_002_002_1895_01_03
      conventionalView: "English scholarship treats the Sofia/Chertkov image conflict only generically; the Dec-1894 negative-destruction episode is largely absent from it."
      relation: extends
      source: "Reischl 2018 (generic); Russian-language notices"
    - evidenceRef: v78_213_V_A_Molochnikovu
      conventionalView: "Reischl frames Tolstoy's discomfort as commodification anxiety; this precise 'no importance' statement is not cited in English scholarship."
      relation: extends
      source: "Reischl 2018; Reischl 2012 (JGO)"
    - evidenceRef: v89_852_sentyabrya26
      conventionalView: "Tapsell is unidentified in English scholarship; Chertkov's role as the public image-maker is acknowledged."
      relation: extends
      source: "Reischl 2018; Leeds Russian Archive LRA/MS 1381 (finding aid)"
    - evidenceRef: v89_767_a26
      conventionalView: "Reischl: mass reproduction inflated celebrity and wounded Tolstoy's moral self-image."
      relation: confirms
      source: "Reischl 2018"

contradictions:
  - claim: "Sofia Andreevna was simply a supportive family photographer of Tolstoy."
    correction: >-
      The corpus shows her also as the destroyer of photographic evidence — she seized and destroyed
      the Dec-1894 negatives of Tolstoy with the Tolstoyans (diary v53_002, with the PSS apparatus
      quoting her own account). Both registers — tender album-keeper (v52_019) and image-controller —
      are hers.
    evidenceRef: v53_002_002_1895_01_03

notCovered:
  - "Sofia Andreevna's own photographic albums in full — held at Yasnaya Polyana / State Tolstoy Museum; her diaries (not in this PSS-letters/diaries corpus) document her practice in detail (Bendavid-Val 2007)."
  - "The c.1849 (Shenfeldt, St Petersburg) and c.1854 (Mazer, Moscow) daguerreotypes — the earliest images of Tolstoy; documented in secondary sources, not located on Commons; request from the State Tolstoy Museum / the MET (a c.1853 sixth-plate daguerreotype)."
  - "The full Chertkov negative archive (Lenin Library / RGALI fond 552; State Tolstoy Museum prints) — only a handful are on Commons."
  - "The 1908 Drankov footage and 1910 funeral newsreels as moving images — documented here but not retrievable as files; RGAKFD Krasnogorsk / net-film.ru."
  - "Karcточка-only references in 70+ letters that are visiting-cards/postcards, not photographs — excluded after sense-checking."

needsReview:
