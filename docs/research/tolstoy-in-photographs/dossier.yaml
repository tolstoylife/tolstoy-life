  - item: "No PSS facsimile rendered for the keystone (v57_141_142, 1909-09-17): vol57's PDF text layer is an unreliable single-blob OCR that matches every page, so the printed page could not be byte-located for pdftoppm. The TEI extract is clean and verify_quotes-checked; a facsimile can be added later."
    phase: 2
    why: "PDF page-locating unreliable for vol57; facsimile optional for a research prototype."
  - item: "Prokudin-Gorsky date: 23 May 1908 OS / 5 June NS is consistent across secondary sources but no peer-reviewed OS/NS discussion was retrieved; LoC repro number LC-DIG-prokc-21885 cited as known (LoC Cloudflare-blocked)."
    phase: 3
    why: "Confirm against LoC catalogue from an unblocked path before asserting the repro number."
  - item: "Thomas Tapsell is named in the PSS apparatus and his negatives are at Leeds (LRA/MS 1381), but he is unidentified in English scholarship — biographical details (dates, training) need the Leeds finding aid / Russian museum catalogues."
    phase: 3
    why: "Entity detail for the wiki page is thin."

