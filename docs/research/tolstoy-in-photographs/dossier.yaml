topic:
  slug: tolstoy-in-photographs
  title: "Tolstoy in photographs: the photographic record of Tolstoy and his circle, 1856–1910"
  question: >-
    How were Tolstoy, his family and circle, and his places photographed — when was each
    major photograph actually taken, do high-quality versions survive, are they public-domain
    or institution-controlled, and how did Tolstoy himself behave while being photographed,
    in his own letters and diaries?
  date: 2026-06-03
  period: "1856–1910 (post-1880 first-class)"
  corpusSurface: "letters (Toms 59–90, first-class), diaries (Toms 46–58), with What Is Art? and prefaces as context"
  dateRange: "1850-12-26 … 1910-09-25"

evidence:
  # ---------------- LETTERS ----------------
  - id: v61_444_M_N_Tolstoj
    genre: letter
    pssTom: 61
    pages: "372–374"
    date: "1856-04-14"
    addressee: "M. N. Tolstaya (sister)"
    localPdf: primary-sources/jubilee-edition/vol61/vol61.pdf
    extract: extracts/v61_444_M_N_Tolstoj.txt
    quoteRu: "по моему предложению, все литераторы сделали фотографическую группу"
    quoteEn: "at my proposal, all the literary men had a photographic group made (working English)"
    significance: >-
      Tolstoy states HE proposed the famous 1856 St-Petersburg group photograph of the
      Sovremennik writers (Turgenev, Grigorovich, Druzhinin, Goncharov, Ostrovsky and himself),
      and promises to send his sister a copy. The earliest photographic event in the corpus, and
      a corpus-grounded correction to popular sources that credit the idea to Sofia (married only
      1862). Photographer was S. L. Levitsky.
    facsimile: null
  - id: v62_490_A_S_Suvorinu
    genre: letter
    pssTom: 62
    pages: "472"
    date: "1879-02-13"
    addressee: "A. S. Suvorin"
    localPdf: primary-sources/jubilee-edition/vol62/vol62.pdf
    extract: extracts/v62_490_A_S_Suvorinu.txt
    quoteRu: "Даю свое согласие на то, чтобы П. М. Третьяков"
    quoteEn: "I give my consent that P. M. Tretyakov [permit a photographic copy to be made…] (working English)"
    significance: >-
      A consent-form letter; the clean body opens only as quoted. PSS apparatus (Tom 62) records
      that the consent is to PHOTOGRAPH the Kramskoy oil portrait in the Tretyakov collection — a
      work-around because Tolstoy had declined to sit for his own photograph. An early instance of
      photographic reluctance; the photographic specifics live in the editorial note (attributed,
      not quoted as Tolstoy's verbatim words).
    facsimile: null
  - id: v67_250_S_I_Plaksinu
    genre: letter
    pssTom: 67
    pages: "244"
    date: "1894-10-17"
    addressee: "S. I. Plaksin"
    localPdf: primary-sources/jubilee-edition/vol67/vol67.pdf
    extract: extracts/v67_250_S_I_Plaksinu.txt
    quoteRu: "в письме вашем конверт для фотографической карточки. Если дело в карточке, то я очень рад"
    quoteEn: "in your letter an envelope for a photographic card. If it is the card you want, I am very glad (working English)"
    significance: >-
      Tolstoy readily agrees to send a фотографическая карточка for a calendar, while refusing the
      requested article — the pragmatic, willing register of card-sending, set against his refusals
      of sittings.
    facsimile: null
  - id: v69_135_a
    genre: letter
    pssTom: 69
    pages: "161"
    date: "1896-10-10"
    addressee: "T. L. Tolstaya (daughter Tanya)"
    localPdf: primary-sources/jubilee-edition/vol69/vol69.pdf
    extract: extracts/v69_135_a.txt
    quoteRu: "Мама целый день занимается фотографией. Она сняла несколько раз Козловку и группу нас всех."
    quoteEn: "Mama spends the whole day on photography. She photographed Kozlovka [station] several times, and a group of all of us. (working English)"
    significance: >-
      A dated record (10–11 Oct 1896) of Sofia Andreevna photographing at Yasnaya Polyana — the
      station at Kozlovka and a family group — in Tolstoy's own hand. Grounds the scholarly picture
      of Sofia as a prolific domestic photographer (~1,000 photographs from the late 1880s).
    facsimile: null
  - id: v76_113_T_A_Kuzminskoj
    genre: letter
    pssTom: 76
    pages: "80"
    date: "1906-01-11"
    addressee: "T. A. Kuzminskaya (Sofia's sister)"
    localPdf: primary-sources/jubilee-edition/vol76/vol76.pdf
    extract: extracts/v76_113_T_A_Kuzminskoj.txt
    quoteRu: "я нашел, что неприятно посылать открытую карточку с портретом. Вложил в конверт"
    quoteEn: "I found it unpleasant to send an open card bearing a portrait. I put it in an envelope (working English)"
    significance: >-
      A precise behaviour note: Tolstoy intercepts a postcard Sofia had prepared bearing his own
      portrait and, finding it distasteful to send his face openly, encloses it in an envelope. A
      small, dated act of resistance to the circulation of his image.
    facsimile: null
  - id: v78_067_T_L_Suxotiioi
    genre: letter
    pssTom: 78
    pages: "79–80"
    date: "1908-03-10"
    addressee: "T. L. Sukhotina (daughter Tanya)"
    localPdf: primary-sources/jubilee-edition/vol78/vol78.pdf
    extract: extracts/v78_067_T_L_Suxotiioi.txt
    quoteRu: "карточки подписанные прилагаю"
    quoteEn: "I enclose the signed cards (working English)"
    significance: >-
      In the jubilee run-up Tolstoy signs and sends portrait cards on his daughter's commission —
      the same letter speaks of "the noise being made around my signboard" (шум … вокруг моей
      вывески). Cooperation and distaste in one breath.
    facsimile: null
  - id: v78_213_V_A_Molochnikovu
    genre: letter
    pssTom: 78
    pages: "191"
    date: "1908-07-23"
    addressee: "V. A. Molochnikov"
    localPdf: primary-sources/jubilee-edition/vol78/vol78.pdf
    extract: extracts/v78_213_V_A_Molochnikovu.txt
    quoteRu: "Не прислал до сих пор карточки потому, что забыл, а забыл потому, что не могу приписать этому значения"
    quoteEn: "I have not sent the card until now because I forgot, and I forgot because I cannot attach any importance to it (working English)"
    significance: >-
      The clearest single statement of Tolstoy's indifference to his own photographic image, dated
      to his 80th-jubilee year. A keystone behaviour quote.
    facsimile: null
  - id: v84_645_a12
    genre: letter
    pssTom: 84
    pages: "246–247"
    date: "1895-11-12"
    addressee: "S. A. Tolstaya (wife)"
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v84_645_a12.txt
    quoteRu: "Смотрел фотографию семьи: как Андрюша похож был на Ваничку."
    quoteEn: "I looked at the family photograph: how like Vanichka Andryusha was. (working English)"
    significance: >-
      Tolstoy reading a family photograph emotionally — the resemblance of his son Andryusha to
      little Vanichka (who would die in Feb 1895). The photograph as private memory, not public icon.
    facsimile: null
  - id: v84_705_a30
    genre: letter
    pssTom: 84
    pages: "309–310"
    date: "1898-04-30"
    addressee: "S. A. Tolstaya (wife)"
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v84_705_a30.txt
    quoteRu: "Миша обещал мне сходить в фотографию на Тверской, подле Филиппова, и спросить у ретушера Краснова"
    quoteEn: "Misha promised to go to the photographer's on Tverskaya, next to Filippov's, and ask the retoucher Krasnov (working English)"
    significance: >-
      Names a concrete Moscow photographic studio (Tverskaya St, next to Filippov's bakery) and a
      named retoucher, Krasnov — the everyday infrastructure of portrait photography around the
      Khamovniki household.
    facsimile: null
  - id: v84_805_a30
    genre: letter
    pssTom: 84
    pages: "382"
    date: "1908-03-30"
    addressee: "S. A. Tolstaya (wife)"
    localPdf: primary-sources/jubilee-edition/vol84/vol84.pdf
    extract: extracts/v84_805_a30.txt
    quoteRu: "Прости, что не сам решил, а утруждаю тебя."
    quoteEn: "Forgive me for not deciding myself but troubling you (working English)"
    significance: >-
      The covering note with which Tolstoy forwards Prokudin-Gorsky's proposal to come and make a
      colour photograph to Sofia, leaving the decision to her. The photographic content (Prokudin's
      name, "приехать снимать цветную фотографию", and the visit of 23 May 1908 OS) is in the PSS
      apparatus (attributed, not quoted as Tolstoy's verbatim words).
    facsimile: null
  - id: v89_767_a26
    genre: letter
    pssTom: 89
    pages: "46–48"
    date: "1906-10-26"
    addressee: "V. G. Chertkov"
    localPdf: primary-sources/jubilee-edition/vol89/vol89.pdf
    extract: extracts/v89_767_a26.txt
    quoteRu: "Вы не можете представить себе, какой вред мне делают похвалы при моем тщеславии. Это пьянство."
    quoteEn: "You cannot imagine what harm praise does me, given my vanity. It is drunkenness. (working English)"
    significance: >-
      Not a photograph per se, but the moral core of the image-cult theme in Tolstoy's own words —
      the harm of being celebrated, addressed to the very man (Chertkov) who was systematically
      photographing him for the public.
    facsimile: null
  - id: v89_852_sentyabrya26
    genre: letter
    pssTom: 89
    pages: "143–146"
    date: "1909-09-26"
    addressee: "V. G. Chertkov"
    localPdf: primary-sources/jubilee-edition/vol89/vol89.pdf
    extract: extracts/v89_852_sentyabrya26.txt
    quoteRu: "Фотографии Тапселя превосходны — нас с детьми."
    quoteEn: "Tapsell's photographs are superb — of us with the children. (working English)"
    significance: >-
      Tolstoy praises photographs by Thomas Tapsell, the English photographer Chertkov brought from
      England, showing Tolstoy with his grandchildren at Krekshino (PSS note: 18 Sept 1909). The same
      letter notes "the cinematograph men were at our place" and his departure "came out splendidly"
      — willing approval of Chertkov's controlled, sympathetic photography.
    facsimile: null
  - id: v89_852_kinematograf
    genre: letter
    pssTom: 89
    pages: "143–146"
    date: "1909-09-26"
    addressee: "V. G. Chertkov"
    localPdf: primary-sources/jubilee-edition/vol89/vol89.pdf
    extract: extracts/v89_852_sentyabrya26.txt
    quoteRu: "Кинематографщики были у нас и показывали всему народу, и наш отъезд вышел превосходно"
    quoteEn: "The cinematograph men were at our place and showed [the film] to all the people, and our departure came out splendidly (working English)"
    significance: >-
      Tolstoy's own register of the moving-image record — approving when it is Chertkov's friendly
      circle, contrasted with the diary's distaste for the press photographers who "pursued" him.
    facsimile: null
  # ---------------- DIARIES ----------------
  - id: v50_030_030_1889_01_28
    genre: diary
    pssTom: 50
    pages: "30"
    date: "1889-01-28"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol50/vol50.pdf
    extract: extracts/v50_030_030_1889_01_28.txt
    quoteRu: "Потом к Покровскому отдать ему свои карточки. И было ужасно стыдно."
    quoteEn: "Then to Pokrovsky to give him my [photo] cards. And it was terribly shameful. (working English)"
    significance: >-
      The shame register, precisely dated: handing out his own portrait cards felt "terribly
      shameful". The earliest diary instance of the discomfort that recurs to 1910.
    facsimile: null
  - id: v52_019_020_1891_03_13
    genre: diary
    pssTom: 52
    pages: "19–20"
    date: "1891-03-13"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol52/vol52.pdf
    extract: extracts/v52_019_020_1891_03_13.txt
    quoteRu: "она разложила карточки всех детей, кроме Ванички, и гордится и любуется. Трогательно."
    quoteEn: "she laid out the cards of all the children except Vanichka, and takes pride and delight in them. Touching. (working English)"
    significance: >-
      Sofia Andreevna's tender relation to the family photographs, seen by Tolstoy with affection —
      the domestic, album side of the photographic record (cf. Reischl's Sofia/Chertkov contrast).
    facsimile: null
  - id: v53_002_002_1895_01_03
    genre: diary
    pssTom: 53
    pages: "2"
    date: "1895-01-03"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol53/vol53.pdf
    extract: extracts/v53_002_002_1895_01_03.txt
    quoteRu: "История с фотографией очень грустная. Все они оскорблены. Я написал письмо Черткову."
    quoteEn: "The story with the photograph is very sad. They are all offended. I wrote a letter to Chertkov. (working English)"
    significance: >-
      Tolstoy's own verdict on the Dec-1894 group-photo affair (he was photographed with Chertkov
      and four Tolstoyans in Moscow; Sofia seized and destroyed the negatives). The keystone of the
      image-control struggle, in his hand. The vivid destruction detail (Sofia cutting his face from
      the negatives with a diamond earring) is from Sofia's own account quoted in the PSS apparatus —
      attributed, not Tolstoy's words.
    facsimile: null
  - id: v57_050_051_1909_04_19
    genre: diary
    pssTom: 57
    pages: "50–51"
    date: "1909-04-19"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol57/vol57.pdf
    extract: extracts/v57_050_051_1909_04_19.txt
    quoteRu: "проявление тщеславия при показывании карточки с картиной обо мне"
    quoteEn: "a show of vanity in displaying the card with the picture about me (working English)"
    significance: >-
      Tolstoy reproaches himself with vanity over a card reproducing a picture of himself — the
      self-critical underside of the cult of his image.
    facsimile: null
  - id: v57_079_079_1909_06_05
    genre: diary
    pssTom: 57
    pages: "79"
    date: "1909-06-05"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol57/vol57.pdf
    extract: extracts/v57_079_079_1909_06_05.txt
    quoteRu: "Приехал сын Джорджа с фотографом."
    quoteEn: "Henry George's son arrived with a photographer. (working English)"
    significance: >-
      A dated, matter-of-fact visit (Henry George Jr.) with a photographer in tow — the ordinary
      cadence of being photographed in the last years.
    facsimile: null
  - id: v57_141_142_1909_09_17
    genre: diary
    pssTom: 57
    pages: "141–142"
    date: "1909-09-17"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol57/vol57.pdf
    extract: extracts/v57_141_142_1909_09_17.txt
    quoteRu: "Неприятно и то, что вызывает сознание себя не божественного, а пакостного Льва Николаевича."
    quoteEn: "Unpleasant, too, in that it arouses the consciousness of oneself as not the divine but the vile Lev Nikolaevich. (working English)"
    significance: >-
      The dive's most powerful behaviour quote: meeting a photographer and a cinematograph operator
      makes Tolstoy feel like "the vile Lev Nikolaevich". The corpus supplies the subjective
      vocabulary that scholarship records only behaviourally.
    facsimile: null
  - id: v57_142_143_1909_09_18
    genre: diary
    pssTom: 57
    pages: "142–143"
    date: "1909-09-18"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol57/vol57.pdf
    extract: extracts/v57_142_143_1909_09_18.txt
    quoteRu: "Кинематографщик и фотографы преследовали."
    quoteEn: "The cinematograph man and photographers pursued [me]. (working English)"
    significance: >-
      The press camera as pursuit — the same Moscow trip where being recognised and greeted "arouses
      a bad feeling of self-importance" (вызывает дурное чувство самомнения).
    facsimile: null
  - id: v56_130_132_1908_05_29
    genre: diary
    pssTom: 56
    pages: "130–132"
    date: "1908-05-29"
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol56/vol56.pdf
    extract: extracts/v56_130_132_1908_05_29.txt
    quoteRu: "Были еще фотографы"
    quoteEn: "There were also photographers [present] (working English)"
    significance: >-
      Late-May 1908, days after Prokudin-Gorsky's colour session — "there were also photographers".
      The digital text of this entry is OCR-corrupted (names dropped); quoted minimally and flagged
      for PDF collation before ingestion.
    facsimile: null

