topic:
  slug: 1889-1904-the-forged-coupon
  title: "The Forged Coupon (Фальшивый купон)"
  question: >-
    What is The Forged Coupon and what does its doubled chain of consequence prove?
    Tested as a hypothesis: the novella is Tolstoy's most schematic narrative proof of the
    non-resistance / kingdom-of-God ethic — the doubled chain dramatises the claim, which he
    diagrammed in an 1886 dream-vision, that evil spreads but cannot conquer good while good
    spreads and does conquer evil.
  date: 2026-06-12
  period: "Composed intermittently 1889–1904 (theme-germ 1886; main pushes Oct–Nov 1902 and 25 Dec 1903 – early Feb 1904); posthumous 1911"
  corpusSurface: "works (PSS Tom 36) + variants + commentary; genesis diaries & letters (Toms 49–55, 1886–1904)"
  dateRange: "1886–1911"

# ───────────────────────── EVIDENCE LEDGER ─────────────────────────
evidence:
  # ---- A. Genesis: the seed and the long gestation ----
  - id: ev-program-1886
    genre: notebook
    pssTom: 36
    pages: "558 (commentary)"
    date: "1886-09-15"
    extract: extracts/v36_genesis-records-from-commentary.txt
    quoteRu: "И он увидал, что зло расходится, но не поборает добра. А добро также расходится и поборает зло"
    quoteEn: "And he saw that evil spreads, but does not conquer good. And good likewise spreads and conquers evil. (working English)"
    significance: >-
      The structural germ. In a programme for a planned tale about the rich man Mitasha, Tolstoy
      diagrams the whole doubled chain in a dream-vision: a "bright youth" shows the dreamer the
      entire history of the forged coupon — where it came from, how evil spread and how it was cut
      short. The asymmetry (evil spreads but does NOT conquer; good spreads AND conquers) is the
      thesis the finished novella executes. Commentary-mediated; original notebook not held locally.
    facsimile: ""
  - id: ev-diary-1889-05-29
    genre: diary
    pssTom: 50
    pages: "86–87"
    date: "1889-05-29"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Как хороша могла бы быть история об убийце, раскаявшемся на незащищавшейся женщине."
    quoteEn: "How fine the story of a murderer who repents over an undefended woman could be. (working English)"
    significance: >-
      The germ of Stepan and the centrepiece. Written the same day Tolstoy had clubbed a wounded
      hare while hunting and reflected «как невинны должны быть убийцы. Они думают о другом и убивают
      без борьбы» ("how innocent murderers must be — they think of something else and kill without
      a struggle"). The "undefended woman" is Maria Semyonovna; her non-resistance is the hinge.
    facsimile: ""
  - id: ev-diary-1891-07-31
    genre: diary
    pssTom: 52
    pages: "47"
    date: "1891-07-31"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Сюжет — впечатления и история человека, бывшего в золотой роте и попавшего в сад караульщиком около господского дома, в котором он видит близко господскую жизнь и даже принимает в ней участие."
    quoteEn: "A subject — the impressions and history of a man who had been in the punishment company and became a garden-watchman by a manor house, where he sees the gentry's life up close and even takes part in it. (working English)"
    significance: "The germ of the watchman (the figure that became the dvornik Vasily / Prokofy)."
    facsimile: ""
  - id: ev-diary-1895-03-12
    genre: diary
    pssTom: 53
    pages: "10–13"
    date: "1895-03-12"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Нынче захотелось писать художественное. Вспоминал, что да что у меня не кончено. Хорошо бы всё докончить"
    quoteEn: "Today I felt like writing something artistic. I recalled what I have left unfinished. It would be good to finish it all. (working English)"
    significance: >-
      «Купон» appears as item 5 in a list of nine unfinished artistic works (beside Resurrection,
      Father Sergius, Hadji Murat's siblings, The Devil). Shows the coupon dormant but alive through
      the 1890s.
    facsimile: ""
  - id: ev-diary-1897-11-14
    genre: diary
    pssTom: 53
    pages: "161–162"
    date: "1897-11-14"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "написать другого русского разбойника Григория Николаева, чтоб он видел всю незаконность жизни богатых"
    quoteEn: "Thought of writing, as a pendant to Hadji Murat, another Russian brigand, Grigory Nikolaev, who would see the whole lawlessness of the rich man's life, living as an apple-watchman on a rich estate with a lawn tennis court. (working English)"
    significance: "Ties the coupon's robber strand to Hadji Murat as a deliberate pendant; the apple-watchman becomes Vasily/Prokofy."
    facsimile: ""
  - id: ev-diary-1897-12-13
    genre: diary
    pssTom: 53
    pages: "170–171"
    date: "1897-12-13"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Фальшивый купон. 7) Хаджи-Мурат."
    quoteEn: "The Forged Coupon. 7) Hadji Murat — items 6–7 in a list of subjects worth working up. (working English)"
    significance: "«Фальшивый купон» listed (item 6) among workable subjects, with «Разбойник — убивающий беззащитных» (item 11, marked прекрасно) — the murderer-of-the-defenceless that becomes Stepan."
    facsimile: ""
  - id: ev-diary-1898-06-12
    genre: diary
    pssTom: 53
    pages: "196–199"
    date: "1898-06-12"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "только одно непротивление прекращает зло, поглощая его в себе, нейтрализирует его, не позволяет ему идти дальше, как оно неизбежно идет, как передача движения упругими шарами, если только нет той силы, которая поглощает его."
    quoteEn: "only non-resistance puts an end to evil, absorbing it into itself, neutralising it, not letting it travel further, as it inevitably does — like the transmission of motion by elastic balls — unless there is the force that absorbs it. (working English)"
    significance: >-
      The doctrinal spine of the whole novella, written in the same diary entry as «Рассказ Купон
      очень хочется дописать» ("I very much want to finish the Coupon story"). Evil propagates like
      momentum through colliding balls; non-resistance is the force that absorbs it. The novella is
      this theory dramatised: Maria Semyonovna's non-resistance is the absorbing force that stops
      Stepan's chain.
    facsimile: ""
  - id: ev-diary-1898-06-12b
    genre: diary
    pssTom: 53
    pages: "196–199"
    date: "1898-06-12"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Рассказ Купон очень хочется дописать."
    quoteEn: "I very much want to finish the Coupon story. (working English)"
    significance: "Confirms part of the tale was written by mid-1898."
    facsimile: ""
  - id: ev-diary-1899-12-20
    genre: diary
    pssTom: 53
    pages: "234–235"
    date: "1899-12-20"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Думал нынче о «Купоне» — хорошо. Может быть напишу."
    quoteEn: "Thought about the Coupon today — well. Perhaps I'll write it. (working English)"
    significance: "Last mention before the long gap to 1902."
    facsimile: ""
  # ---- B. The 1902–1904 composition pushes ----
  - id: ev-diary-1902-10-06
    genre: diary
    pssTom: 54
    pages: "145"
    date: "1902-10-06"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Вчера начал поправлять и продолжать Фальшивый купон."
    quoteEn: "Yesterday I began correcting and continuing The Forged Coupon. (working English)"
    significance: >-
      The first sustained push (the first seven chapters, per M. L. Obolenskaya's manuscript cover,
      Nov 1902). The same entry records a visit from Gorky and Pyatnitsky — people around the work.
    facsimile: ""
  - id: ev-diary-1903-12-02
    genre: diary
    pssTom: 54
    pages: "199"
    date: "1903-12-02"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "начать новое или драму, или о религии, или кончить купон."
    quoteEn: "to begin something new — either a drama, or something on religion, or to finish the coupon. (working English)"
    significance: "The coupon weighed against the alternatives just before the decisive push."
    facsimile: ""
  - id: ev-diary-1903-12-25
    genre: diary
    pssTom: 54
    pages: "202"
    date: "1903-12-25"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Начал писать фальшивый купон. Пишу очень небрежно, но интересует меня тем, что выясняется новая форма, очень sobre."
    quoteEn: "Began writing The Forged Coupon. I write very carelessly, but it interests me because a new form is taking shape, very sober. (working English)"
    significance: >-
      KEYSTONE composition note. The «новая форма, очень sobre» is the stripped, bare style — short
      chapters, no psychological dwelling, the supernatural devils about to be cut — that makes the
      chain stand on plain human causation. Cross-links the late-voice dive (compression).
    facsimile: ""
  - id: ev-letter-1904-01-19-LL
    genre: letter
    pssTom: 75
    pages: "13–15"
    date: "1904-01-19"
    addressee: "L. L. Tolstoy (son)"
    extract: extracts/v75_013_letter_LL_Tolstomu.txt
    quoteRu: "если помнишь, я давно начал, и дополнение о религии"
    quoteEn: "I am also writing The Forged Coupon — you remember, I began it long ago — and a supplement on religion. (working English)"
    significance: "Letter evidence of the work in progress during the Jan 1904 push; «я давно начал» confirms the long gestation."
    facsimile: ""
  - id: ev-diary-1904-01-22
    genre: diary
    pssTom: 55
    pages: "10"
    date: "1904-01-22"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Нынче занимался купоном и колеблюсь, оставить или уничтожить чертей."
    quoteEn: "Today I worked on the coupon and waver over whether to leave or destroy the devils. (working English)"
    significance: >-
      The decision behind the keystone redaction. Tolstoy had drawn little devils (чертенята) on the
      characters' shoulders, growing and dividing as evil spread; here he wavers, then destroys them,
      marking «пропустить» (omit) everywhere but three places he missed. The same entry calls the
      government «шайка разбойников» (a band of robbers) — the novella's politics in the diary.
    facsimile: ""
  - id: ev-diary-1904-02-02
    genre: diary
    pssTom: 55
    pages: "12"
    date: "1904-02-02"
    extract: extracts/_diaries-genesis.txt
    quoteRu: "Работаю над Купоном, а о войне не пишется."
    quoteEn: "I am working on the Coupon, but the war won't be written. (working English)"
    significance: "The last diary mention of work on the tale; it broke off within days and was never resumed."
    facsimile: ""
  # ---- C. The text: origin, centrepiece, reversal ----
  - id: ev-text-origin
    genre: works
    pssTom: 36
    pages: "5–6 (ch I)"
    date: ""
    extract: extracts/v36_005_053_main.txt
    quoteRu: "А я тебе скажу, что если ты так поведешь себя, ты будешь мошенник."
    quoteEn: "And I tell you that if you behave like this, you'll be a swindler. (working English)"
    significance: >-
      The first link. The liberal official Fyodor Mikhailovich Smokovnikov, in a bad mood, refuses
      his son the small sum and plants the word «мошенник» (swindler) — which the boy then half-sets
      out to fulfil by altering the coupon. Evil begins not in a great crime but in a father's
      contempt.
    facsimile: ""
  - id: ev-text-maria-nonresist
    genre: works
    pssTom: 36
    pages: "32 (ch XXIII)"
    date: ""
    extract: extracts/v36_005_053_main.txt
    quoteRu: "но она не подняла рук, не противилась и только прижала их к груди и тяжело вздохнула"
    quoteEn: "but she did not raise her hands, did not resist, and only pressed them to her breast and sighed heavily. (working English)"
    significance: >-
      THE centrepiece — the structural hinge. Maria Semyonovna does not resist as Stepan prepares to
      kill her; she pities him: «Пожалей себя. Чужие души, а пуще свою губишь» ("Have pity on
      yourself. You destroy others' souls, and your own still more"). Her non-resistance is the
      absorbing force of the 1898 diary; it is what Stepan «не мог больше переносить» and what turns
      the whole tale from the chain of evil to the chain of good.
    facsimile: ""
  - id: ev-text-maria-pity
    genre: works
    pssTom: 36
    pages: "32 (ch XXIII)"
    date: ""
    extract: extracts/v36_005_053_main.txt
    quoteRu: "Пожалей себя. Чужие души, а пуще свою губишь"
    quoteEn: "Have pity on yourself. You destroy others' souls, and your own still more. (working English)"
    significance: "Maria Semyonovna's words as she is killed — pity for her murderer, the seed of his conversion."
    facsimile: ""
  - id: ev-text-conversion
    genre: works
    pssTom: 36
    pages: "37 (Part II ch III)"
    date: ""
    extract: extracts/v36_005_053_main.txt
    quoteRu: "И с этого времени Степан стал другим человеком."
    quoteEn: "And from that time Stepan became a different man. (working English)"
    significance: >-
      The reversal completes inside Stepan. After Maria Semyonovna's face haunts him, her silent
      dream-forgiveness releases him, and the sectarian Chuev reads him the Gospel (Matthew 25, the
      sheep and goats; Luke 23, the repentant thief), Stepan is remade. From here good propagates
      back outward — he converts the executioner Makhorkin and, through Mahin's retelling, Lisa
      Eropkina.
    facsimile: ""
  - id: ev-text-executioner
    genre: works
    pssTom: 36
    pages: "40 (Part II ch V)"
    date: ""
    extract: extracts/v36_005_053_main.txt
    quoteRu: "Что ж, плети — так плети, а убивать закона нет."
    quoteEn: "Well — flog me then, but there's no law to kill. (working English)"
    significance: >-
      The good chain made visible: the convict-executioner Makhorkin, having heard Stepan, refuses
      to hang the two condemned peasants though threatened with flogging. The same machinery that
      transmitted evil now transmits the refusal of violence.
    facsimile: ""
  - id: ev-text-brothers
    genre: works
    pssTom: 36
    pages: "39 (Part II ch VI)"
    date: ""
    extract: extracts/v36_005_053_main.txt
    quoteRu: "— Оттого что понял, что все люди братья."
    quoteEn: "— Because I understood that all men are brothers. (working English)"
    significance: >-
      Stepan to Mahin, the investigator — who is the very schoolboy who first taught how to alter
      the coupon. The node that began the evil chain now carries the redemption-story outward; «От
      непонятия» ("from not-understanding") is Stepan's whole account of why men judge and kill.
    facsimile: ""
  # ---- D. Redactions: the devils (keystone variant) and the real bases ----
  - id: ev-devils-redaction
    genre: works
    pssTom: 36
    pages: "559–560 (commentary, on draft additions)"
    date: ""
    extract: extracts/v36_commentary-excerpts.txt
    quoteRu: "маленький чертенок, сидевший на бумаге, перескочил на плечо Федора Михайловича и, сидя на нем, несколько увеличился."
    quoteEn: "a little devil that had been sitting on the paper leapt onto Fyodor Mikhailovich's shoulder and, sitting there, grew somewhat larger. (working English)"
    significance: >-
      The keystone redaction. Tolstoy first wrote the chain of evil as a literal allegory — little
      devils sitting on shoulders, swelling and dividing and leaping from person to person as malice
      passed. He cut them all (decision of 22 Jan 1904), leaving the bare human causation: the «очень
      sobre» new form is what remained after the supernatural scaffolding was stripped away.
    facsimile: ""
  - id: ev-prototype-larivon
    genre: notebook
    pssTom: 36
    pages: "578 (commentary)"
    date: "1881"
    extract: extracts/v36_genesis-records-from-commentary.txt
    quoteRu: "Повели Ларивона в острог."
    quoteEn: "They led Larivon off to prison. (working English)"
    significance: >-
      Prokofy's author-stated prototype: Tolstoy's former coachman Larion/Larivon, whose destruction
      by the courts (jailed and re-jailed for trivial offences, declining, dead of consumption)
      Tolstoy had already told in his Notes of a Christian (Записки христианина, 1881). The novella's
      indictment of the justice system is drawn from a man Tolstoy knew.
    facsimile: ""
  - id: ev-prototype-stanislavsky
    genre: works
    pssTom: 36
    pages: "578 (commentary)"
    date: "1887-04-14"
    extract: extracts/v36_commentary-excerpts.txt
    quoteRu: "Эпизод убийства крестьянами управляющего имением Петра Николаевича Свентицкого"
    quoteEn: "The episode of the peasants' killing of the estate manager Pyotr Nikolaevich Sventitsky — commentary attribution. (working English)"
    significance: >-
      The killing of the manager Sventitsky (Part I ch XVII), and the hanging of two peasants for it,
      almost exactly reproduces the real killing of A. V. Stanislavsky, manager of N. A.
      Tuchkova-Ogareva's estate, by peasants on 14 April 1887 — two peasants were hanged. The
      execution disturbed Tolstoy deeply; he still spoke of it to Goldenweiser in 1904.
    facsimile: ""
  - id: ev-pub-censorship
    genre: works
    pssTom: 36
    pages: "580 (commentary)"
    date: "1911"
    extract: extracts/v36_commentary-excerpts.txt
    quoteRu: "однако с цензурными урезками"
    quoteEn: "however, with censorship excisions (working English)"
    significance: >-
      First printed in vol. 1 of the Posthumous Artistic Works (ed. Chertkov, pub. A. L. Tolstaya,
      Moscow 1911) WITH censorship cuts — the sharpest anti-clerical and pro-sectarian passages
      removed (Part I ch XII «Наплевать мне на ваш сан»; the anti-authority passage on Stepan in ch
      XV; the icon-renunciation in ch XVIII; most of ch XX on the sect; in Part II, the
      true-faith-of-Christ words in ch III, and ch XV entire). The simultaneous Berlin «Свободное
      слово» edition (also ed. Chertkov) carried the full uncensored text.
    facsimile: ""

