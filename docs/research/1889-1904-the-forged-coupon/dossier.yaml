# ───────────────────────── SCHOLARSHIP (Phase 3) ─────────────────────────
scholarship:
  summary: >-
    The received English-language view reads The Forged Coupon as a late "schematic moral parable"
    with a domino / chain structure expressing Tolstoy's non-resistance and Christian-anarchist
    ethic (Troyat; Simmons; Wilson; the 1912 Bernstein introduction; popular criticism). The most
    sophisticated academic treatment — Kliger & Zakariya, "Poetics of Brotherhood" (Slavic Review,
    2011) — reaches the doubled chain itself but frames it narratologically (organic vs mechanistic
    narrative), pairing the novella with Resurrection as Tolstoy's two long-form "proofs" of human
    brotherhood; it stops short of naming the theological asymmetry the chains dramatise and does
    not connect them to the 1886 dream-diagram. A Bryn Mawr digital exhibit reads the work through
    class and gender, which shifts emphasis from the moral mechanism to social structure. The work's
    dominant cultural afterlife — Robert Bresson's film L'Argent (1983) — adapts only Part I and
    stops exactly where the redemptive Part II would begin, so the most famous reception of the work
    breaks its doubled chain and has fed a reading in which Part II is a "schematic appendage." A
    primary-grounded reading contests that: Part II is the structural proof, not an appendage.
  triangulation:
    - evidenceRef: ev-program-1886
      conventionalView: "Scholars read the work as a 'domino' / chain parable of non-resistance but do not cite a documented origin for the doubled structure."
      relation: extends
      source: "Kliger & Zakariya 2011; Bernstein 1912"
    - evidenceRef: ev-diary-1898-06-12
      conventionalView: "The non-resistance theme is named in general terms; the explicit 'evil as transmitted momentum, non-resistance as the absorbing force' mechanism is not cited from the diaries."
      relation: extends
      source: "Wilson 1988; general criticism"
    - evidenceRef: ev-text-maria-nonresist
      conventionalView: "Kliger/Zakariya: the late novellas structurally enact human brotherhood; Maria Semyonovna's death is the connective pivot."
      relation: confirms
      source: "Kliger & Zakariya 2011, Slavic Review 70.4"
    - evidenceRef: ev-devils-redaction
      conventionalView: "Scholarship does not discuss the cut 'devils' allegory or the conscious de-allegorisation into the «очень sobre» form."
      relation: extends
      source: "— (no secondary source reaches this; PSS commentary + diaries only)"
    - evidenceRef: ev-text-conversion
      conventionalView: "A Bryn Mawr exhibit foregrounds class/gender and institutional-vs-authentic religion over the non-resistance proof."
      relation: complicates
      source: "Bryn Mawr 'Crime or Punishment' digital exhibit"
    - evidenceRef: ev-text-origin
      conventionalView: "Bresson's L'Argent (1983) — the dominant afterlife — keeps only the chain of evil (Part I), implying Part II is the dispensable, schematic half."
      relation: contradicts
      source: "Bresson, L'Argent (1983); Pipolo 2010; Cannes 1983"

