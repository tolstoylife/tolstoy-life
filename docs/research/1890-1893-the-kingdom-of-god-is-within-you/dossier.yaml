evidence:

  # — The work's own text: «Царство божие внутри вас», PSS Tom 28, pp. 1–293 —
  - id: kgd-text-01
    genre: work
    pssTom: 28
    pages: "5 (эпиграф)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Познаете истину, и истина освободит вас"
    quoteEn: "(working English) You shall know the truth, and the truth shall make you free (John 8:32)."
    significance: "The first of the book's three epigraphs (with Mt. 10:28 and 1 Cor. 7:23), and its key: the book is about a truth that frees, and about the refusal to lie that is, in the conclusion, the one free act."

  - id: kgd-text-02
    genre: work
    pssTom: 28
    pages: "5 (Вступление)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "В числе многих отступлений этого учения от учения Христа я указывал на главное отступление, именно — на непризнание заповеди непротивления злу насилием"
    quoteEn: "(working English) Among the many departures of this [church] teaching from the teaching of Christ, I pointed to the chief departure — namely, the non-recognition of the commandment of non-resistance to evil by force."
    significance: "The premise, stated at the opening: the book is the sequel to What I Believe (1884), and non-resistance to evil by force is the единственное / главное отступление on which Tolstoy says the churches betrayed Christ. The whole argument unfolds from this."

  - id: kgd-text-03
    genre: work
    pssTom: 28
    pages: "~67 (гл. V)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "необходимо установить новое жизнепонимание, из которого и вытекла бы и деятельность, соответствующая тому новому состоянию, в которое оно вступило или вступает."
    quoteEn: "(working English) it is necessary to establish a new understanding of life, from which would also flow the activity corresponding to the new condition into which [humanity] has entered or is entering."
    significance: "The subtitle made argument: humanity must adopt a new жизнепонимание as a grown man outgrows a child's understanding. Christianity is that new understanding of life — not a mysticism (the subtitle: «не как мистическое учение, а как новое жизнепонимание»)."

  - id: kgd-text-04
    genre: work
    pssTom: 28
    pages: "~65 (гл. IV)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Человек божеского жизнепонимания признает жизнь уже не в своей личности и не в совокупности личностей (в семье, роде, народе, отечестве или государстве), а в источнике вечной, неумирающей жизни — в боге"
    quoteEn: "(working English) The man of the divine understanding of life finds life no longer in his own personality, nor in the aggregate of personalities (the family, clan, people, fatherland, or state), but in the source of eternal, undying life — in God."
    significance: "The third of the three understandings of life (the personal-animal, the social-pagan, the divine-Christian). Because the Christian locates life in God and not in the state, no claim of the state can override the law of God — the hinge from the metaphysics of On Life to the politics of this book."

  - id: kgd-text-05
    genre: work
    pssTom: 28
    pages: "~152 (гл. VII)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "войска нужны прежде всего правительствам для обороны себя от своих подавленных и приведенных в рабство подданных."
    quoteEn: "(working English) armies are needed by governments first of all to defend themselves from their own oppressed and enslaved subjects."
    significance: "The keystone of the state analysis (ch. VII): the army is aimed less at foreign enemies than at the governed population. Universal military conscription is therefore the last limit of the contradiction in the social understanding of life."

  - id: kgd-text-06
    genre: work
    pssTom: 28
    pages: "~163 (гл. VIII)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Устрашение, подкуп, гипнотизация приводят людей к тому, что они идут в солдаты"
    quoteEn: "(working English) Intimidation, bribery, and hypnotization bring men to become soldiers"
    significance: "The closed ring of the four means by which state violence sustains itself (ch. VIII): intimidation, bribery, hypnotization, and the soldiery the first three produce — which in turn gives the power to execute, plunder, hypnotize and recruit. «Круг замкнут, и вырваться из него силой нет никакой возможности.»"

  - id: kgd-text-07
    genre: work
    pssTom: 28
    pages: "~284 (гл. XII, 5)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Истинную жизнь, по христианскому учению, имеет только тот, кто перенес свою жизнь в ту область, в которой она свободна, — в область причин, т. е. познания и признания открывающейся истины"
    quoteEn: "(working English) True life, according to the Christian teaching, is had only by the one who has carried his life into the realm in which it is free — into the realm of causes, that is, of the knowing and recognition of the opening truth."
    significance: "The doctrine of freedom (ch. XII.5): a person is not free in his acts, which have causes, but is free in whether he recognizes a truth — and recognition is itself the cause of acts. The metaphysical ground of the exit from state violence: not revolution, but the recognition and profession of truth."

  - id: kgd-text-08
    genre: work
    pssTom: 28
    pages: "~285 (гл. XII, 5)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Царство божие усилием берется, и только делающие усилие восхищают его"
    quoteEn: "(working English) The Kingdom of God is taken by effort, and only those who make the effort seize it."
    significance: "The title-phrase as imperative: the Kingdom of God is not a future order to be built but a thing taken now, by the inner effort of renouncing concern for external change and recognizing the truth. (After Mt. 11:12.)"

  - id: kgd-text-09
    genre: work
    pssTom: 28
    pages: "~290 (гл. XII, 6)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Одно, только одно дело, в котором ты свободен и всемогущ, дано тебе в жизни, все остальные вне твоей власти. Дело это в том, чтобы познавать истину и исповедовать ее."
    quoteEn: "(working English) One thing, only one thing, in which you are free and all-powerful, is given you in life; all the rest is beyond your power. That one thing is to know the truth and to profess it."
    significance: "The climax of the book's long direct address to the reader («Кто бы ты ни был…»): every social position — landowner, judge, emperor, soldier — is reduced to a single demand, to recognize and profess the truth. The one free act."

  - id: kgd-text-10
    genre: work
    pssTom: 28
    pages: "~288 (гл. XII, 6)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Ведь это так просто и ясно, если бы только мы лицемерием не затемняли себе несомненно открытую нам истину."
    quoteEn: "(working English) It is all so simple and clear, if only we did not, by hypocrisy, darken for ourselves the truth that has unquestionably been opened to us."
    significance: "Hypocrisy (лицемерие) is the conclusion's central diagnosis: the thing that holds the violent order up is not ignorance or malice but the pretence of not seeing a truth one knows. The 'scientific theory of hypocrisy' has replaced the religious one (ch. XII.4)."

  - id: kgd-text-11
    genre: work
    pssTom: 28
    pages: "~288 (гл. XII, 6)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Одумайтесь, люди, и веруйте в Евангелие, в учение о благе."
    quoteEn: "(working English) Bethink yourselves, people, and believe in the Gospel, in the teaching of the good."
    significance: "The conclusion's title and refrain — «Покайтесь, потому что Царствие Божие близко, при дверях» (Repent, for the Kingdom of God is at hand) — μετανοειτε read as 'bethink yourselves'. The same call Tolstoy will title a later anti-war tract «Одумайтесь!» (1904)."

  - id: kgd-text-12
    genre: work
    pssTom: 28
    pages: "293 (конец)"
    date: "1890–1893"
    extract: extracts/v28_001_293_Tsarstvo_bozhie_vnutri_vas.txt
    quoteRu: "Ибо вот: царствие божие внутрь вас есть»."
    quoteEn: "(working English) For behold: the Kingdom of God is within you."
    significance: "The book's last line, Luke 17:21 — the source of the title. The Kingdom is not 'here' or 'there', not a coming external order, but within: the inner recognition of truth from which the transformation of the outer order follows."

  # — Composition-window diaries: PSS Toms 51–52 (1890–93) —
  - id: kgd-diary-01
    genre: diary
    pssTom: 51
    pages: "60"
    date: "1890-07-08 (OS)"
    extract: extracts/v51_060_060_1890_07_08.txt
    quoteRu: "Написал предисловие к катехизису Балу."
    quoteEn: "(working English) Wrote a preface to Ballou's catechism."
    significance: "The genesis day: the first recorded work on what became The Kingdom of God Is Within You — a preface to the translation of Adin Ballou's Catechism of Non-Resistance. The book began as this preface and grew, over three years, into the treatise."

  - id: kgd-diary-02
    genre: diary
    pssTom: 51
    pages: "68–69"
    date: "1890-07-28 (OS)"
    extract: extracts/v51_068_069_1890_07_28.txt
    quoteRu: "Поправил перевод Гарисона и Балу и написал краткое предисловие, так, чтобы в таком виде можно было передать людям."
    quoteEn: "(working English) Corrected the translation of Garrison and Ballou and wrote a short preface, so that in this form it could be given to people."
    significance: "Three weeks in: the preface to the Garrison Declaration and the Ballou Catechism is taking shape. On the same day Tolstoy told Chertkov it was 'growing into a large and very necessary article about the deception of the church' (PSS Tom 87, per the commentary)."

  - id: kgd-diary-03
    genre: diary
    pssTom: 52
    pages: "69"
    date: "1892-08-06 (OS)"
    extract: extracts/v52_069_069_1892_08_06.txt
    quoteRu: "8-ая глава кончена, но над 9-й и 10-й все вожусь. И начинаю думать, что толкусь на месте."
    quoteEn: "(working English) The eighth chapter is finished, but I'm still struggling with the ninth and tenth. And I'm beginning to think I'm marking time."
    significance: "The grind of the middle chapters, mid-composition (and amid the famine-relief work): the overgrown eighth chapter, split on Strakhov's advice into VIII–X, cost Tolstoy enormous effort. E. I. Popov was living at Yasnaya Polyana as copyist, waiting."

  - id: kgd-diary-04
    genre: diary
    pssTom: 52
    pages: "78"
    date: "1893-05-14 (OS)"
    extract: extracts/v52_078_078_1893_05_14.txt
    quoteRu: "Вчера отослал совсем."
    quoteEn: "(working English) Yesterday I sent it off for good."
    significance: "The completion. The same entry records only relief — «Я свободен» (I am free) — and that illness had pushed him to stop. Tolstoy fixed 14 May 1893 (OS), Yasnaya Polyana, as the day the work was finished; the foreign editions print that date. (The full line: «Вчера отослал совсем. […] Я свободен.»)"

  # — Composition letter: PSS Tom 87 (letters to V. G. Chertkov) —
  - id: kgd-let-01
    genre: letter
    pssTom: 87
    pages: "117"
    date: "1891-12-14 (OS)"
    addressee: "V. G. Chertkov"
    extract: extracts/v87_304_CHertkovu_1891_12_14.txt
    quoteRu: "Смягчать, оговариваясь нельзя. Это нарушает весь тон, а тон выражает чувство, а чувство заражает"
    quoteEn: "(working English) To soften, with qualifications, is impossible. It destroys the whole tone, and the tone expresses the feeling, and the feeling infects [the reader]."
    significance: "Tolstoy's refusal, mid-composition, of Chertkov's wish to soften the book's attacks on the church and state. The clearest statement of how he wanted the book read: its uncompromising tone is the carrier of the feeling, and the feeling — sometimes of indignation — does more than argument. He accepted only minor prudential corrections later (the Uzlovaya passage)."

