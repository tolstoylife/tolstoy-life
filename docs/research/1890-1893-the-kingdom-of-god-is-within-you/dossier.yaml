# ── Scholarship (secondary layer — Phase 3) ─────────────────────────────────
scholarship:
  summary: >-
    English-language scholarship treats The Kingdom of God Is Within You as the systematic
    statement of Tolstoy's religio-political thought — the founding text of what is usually
    called his Christian anarcho-pacifism — and as the culmination of decades of thinking
    that issued in his theory of nonviolence (Alexandre Christoyannopoulos, Christian
    Anarchism, 2010, and Tolstoy's Political Thought; the Harvard Davis Center's account of
    Tolstoy's nonviolence). The substance is uncontested: the book subordinates political
    theory to the Gospel, opens with W. L. Garrison's New England Non-Resistance Society and
    Adin Ballou, and argues non-resistance as central to the Christian conception of life.
    Its afterlife is the headline of the reception: Gandhi read it in 1894 and wrote in his
    Autobiography that it 'overwhelmed' him and 'left an abiding impression,' ranking it with
    Ruskin's Unto This Last and the poet Raychandbhai among the three decisive modern
    influences on his life — a line that runs Garrison/Ballou → Tolstoy → Gandhi → the
    twentieth-century practice of nonviolent resistance (and, through Gandhi, to M. L. King).
    What the corpus adds is at two points the biographical literature passes over quickly:
    the genesis (the preface-to-Ballou origin, the four titles, the Strakhov-prompted split
    of chapter VIII, the Uzlovaya rewrite of the conclusion), traceable week by week in the
    1890–93 diaries; and the precise publication sequence, where the PSS apparatus corrects
    the received summary that the book was 'first published in Germany in 1894' — the French
    Le salut est en vous came first (Paris, 1893), and the original Russian and German
    editions of 1894 came from Berlin (Deubner) and Stuttgart, not the Leipzig venue the
    works record currently carries.
  triangulation:
    - evidenceRef: kgd-text-02
      conventionalView: "The Kingdom of God Is Within You is the founding statement of Tolstoy's Christian anarcho-pacifism, subordinating political theory to the Gospel's commandment of non-resistance."
      relation: confirms
      source: "Christoyannopoulos, Christian Anarchism (Imprint Academic, 2010) and Tolstoy's Political Thought (Routledge); Harvard Davis Center, 'Beyond War and Peace: Tolstoy's Theory of Nonviolence'. The primary text states exactly this hierarchy (non-resistance as the 'chief departure' the churches made from Christ)."
    - evidenceRef: kgd-diary-01
      conventionalView: "The book is the culmination of some thirty years of Tolstoy's thinking on Christianity and nonviolence."
      relation: extends
      source: "general reference accounts (e.g. the standard encyclopaedic summary). The corpus supplies the concrete genesis the summary compresses: the book began on 8 July 1890 as a preface to Ballou's Catechism and grew, traceably in the diaries, into the treatise — an origin more specific and more accidental than 'thirty years of thinking' implies."
    - evidenceRef: kgd-text-12
      conventionalView: "The Kingdom of God Is Within You was first published in Germany in 1894 after being banned in Russia."
      relation: complicates
      source: "popular and reference summaries (and, in substance, the works record's firstPublishedVenue 'Wilhelm Friedrich Verlag, Leipzig'). The PSS Tom 28 commentary shows the French Le salut est en vous appeared first (Paris: Perrin, October 1893); the original Russian (Berlin: Deubner) and the German (Stuttgart: Deutsche Verlags-Anstalt) came in January 1894 — 'first in Germany 1894' flattens the sequence and misnames the venue."
    - evidenceRef: kgd-text-03
      conventionalView: "Tolstoy's late religion is a form of Christian mysticism."
      relation: contradicts
      source: "popular framing; the book's own subtitle — «не как мистическое учение, а как новое жизнепонимание» (not as a mystical teaching but as a new understanding of life) — explicitly rejects it, as the On Life dive found in the philosophical book."
    - evidenceRef: kgd-let-01
      conventionalView: "Chertkov shaped and softened Tolstoy's late religious writing."
      relation: complicates
      source: "the 'Chertkov as controlling editor' frame (cf. the Sofia-centred biography; christian-anarchism, biryukov-sofia-relationship). The corpus shows Chertkov pressing for softenings and Tolstoy refusing the principle outright ('to soften, with qualifications, is impossible'); Chertkov's influence on this book was organizational (copying, relay to translators, later publication), not a softening of its content."

