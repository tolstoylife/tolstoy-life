topic:
  slug: 1890-1893-the-kingdom-of-god-is-within-you
  title: "The Kingdom of God Is Within You (Царство Божие внутри вас)"
  question: >-
    Document The Kingdom of God Is Within You as a work across the local Tolstoy corpus —
    the great non-resistance / anti-state synthesis of the Prophet period and the last and
    largest of the four religious treatises. Its genesis as a preface to translations of
    Adin Ballou's Catechism of Non-Resistance and W. L. Garrison's Declaration of Sentiments
    (begun 8 July 1890) that grew, over nearly three years, into a 293-page treatise; its
    composition tracked week by week in the 1890-93 diaries and letters, with the people
    around it (Chertkov, Strakhov, Biryukov, the daughters M. L. and T. L. Tolstaya as
    copyists, E. I. Popov); what the work argues (Christianity not as a mystical teaching but
    as a new understanding of life — новое жизнепонимание; non-resistance to evil by force as
    the chief departure the churches made from Christ; the state as organised violence whose
    army faces inward; universal military conscription as the last limit of the contradiction;
    the four means by which state violence sustains itself — intimidation, bribery,
    hypnotization, the soldiery; public opinion as the engine of change; freedom as the
    recognition of truth, and the refusal to lie as the one free act; "the Kingdom of God is
    within you"); the four title-changes and the Strakhov-prompted split of chapter VIII; the
    9 September 1892 Uzlovaya punitive-train encounter that reshaped the conclusion; its
    publication abroad (French first, Paris 1893; the first-printed Russian and the German,
    Berlin/Deubner and Stuttgart, January 1894; two English translations 1894) and the
    censorship and smuggling that followed (banned, then flooding into Russia in hectograph;
    first legally printed in Russia 1906); and its reception — the Russian censors and Stasov
    and Repin, then its single greatest afterlife, the young M. K. Gandhi — grounded in
    Tolstoy's own words, the Jubilee-Edition apparatus, the composition-window diaries and
    letters, and the project's prior dives.
  date: "2026-06-06"
  period: "Prophet period (post-1880); composition July 1890 – May 1893 (Old Style)"
  corpusSurface: "PSS Tom 28 (work «Царство божие внутри вас» pp. 1–293; Оглавление pp. 294–306; Варианты pp. 309–330; commentary pp. 333–381: История писания, текстологические примечания, описание рукописей); composition-window diaries Toms 51–52 (1890–93); letters Toms 65–66 and the Chertkov letters Tom 87"
  dateRange: "1890 (genesis: preface to Ballou's Catechism, 8 July) – 1906 (first legal Russian printing); first publication abroad French 1893 (Le salut est en vous, Paris) and original Russian + German January 1894 (Berlin/Deubner, Stuttgart)"

