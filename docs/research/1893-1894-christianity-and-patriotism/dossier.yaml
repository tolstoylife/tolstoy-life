evidence:

  # ---- The work itself: PSS Tom 39 pp.27–80 (v39_027_080) ----
  - id: W1
    genre: works
    pssTom: 39
    pages: "27 (preface)"
    date: "1894-03-17 (OS, signed)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "вызвали во мне, вероятно так же как и во многих людях, сначала чувство комизма, потом недоумения, потом негодования"
    quoteEn: "(working English) [the Franco-Russian festivities] aroused in me, probably as in many people, first a feeling of the comic, then of bewilderment, then of indignation."
    significance: "The essay's own account of its emotional genesis — it began as a short journal article and grew into a treatise."
    facsimile: ""
  - id: W2
    genre: works
    pssTom: 39
    pages: "27–28 (ch. I)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "все эти миллионы людей русских и французских вдруг вообразили себе, что они как-то особенно любят друг друга"
    quoteEn: "(working English) all these millions of Russians and Frenchmen suddenly imagined that they somehow specially loved one another."
    significance: "The absurd premise: squadron visits to Kronstadt (1891) and Toulon (1893) manufacture a sudden mutual 'love' between two peoples mostly set against each other by their governments."
    facsimile: ""
  - id: W3
    genre: works
    pssTom: 39
    pages: "34 (ch. III)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "Недавно профессор психиатрии Сикорский описал в Киевских университетских известиях исследованную им, как он называет это, психопатическую эпидемию малеванщины"
    quoteEn: "(working English) Recently Professor of Psychiatry Sikorsky described in the Kiev University News what he investigated and calls a psychopathic epidemic — the malevanshchina."
    significance: "The diagnostic frame: Tolstoy borrows the psychiatrist I. A. Sikorsky's term for a Kiev-province religious mania and applies it to mass patriotism."
    facsimile: ""
  - id: W4
    genre: works
    pssTom: 39
    pages: "35 (ch. III)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "ружьями, штыками, крепостями, броненосцами, меленитами, динамитами"
    quoteEn: "(working English) [the difference: the Toulon-Paris sufferers possess] rifles, bayonets, fortresses, ironclads, melinite, dynamite."
    significance: "Why the patriotic 'epidemic' is graver than the peasant one: its sufferers hold the means of mass violence plus the post, telegraph, and press to spread it."
    facsimile: ""
  - id: W5
    genre: works
    pssTom: 39
    pages: "44 (ch. V)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "кровь, раны, страдания, гниющие трупы и бессмысленная, напрасная смерть"
    quoteEn: "(working English) blood, wounds, suffering, rotting corpses, and a senseless, useless death."
    significance: "The fate of the deceived working people (the 'cannon fodder'), set against the gentlemen who mark map positions with pins after a good dinner."
    facsimile: ""
  - id: W6
    genre: works
    pssTom: 39
    pages: "46 (ch. VI)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "Дьявол — человекоубийца и отец лжи. И ложь всегда ведет к человекоубийству."
    quoteEn: "(working English) The devil is a murderer and the father of lies. And the lie always leads to murder."
    significance: "The moral core: the 'love' and the 'peace' of the festivities are a lie, and the lie is what leads to killing."
    facsimile: ""
  - id: W7
    genre: works
    pssTom: 39
    pages: "53 (ch. IX)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "Приходи лучше с нами работать, да и немца присылай. А отработаемся — гулять будем. И немца возьмем. Такие же люди."
    quoteEn: "(working English) Better come and work with us, and send the German along too. And when we're done, we'll make merry. We'll take the German too. They're people just the same."
    significance: "The peasant Prokofy's answer to the French war-agitator's plan to 'squeeze Germany from two sides' — the народ's own voice against patriotic hatred."
    facsimile: ""
  - id: W8
    genre: works
    pssTom: 39
    pages: "55 (ch. X)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "Я прожил полвека среди русского народа и в большой массе настоящего русского народа в продолжение всего этого времени ни разу не видал и не слышал проявления или выражения этого чувства патриотизма"
    quoteEn: "(working English) I have lived half a century among the Russian people, and in the great mass of the real Russian people, in all that time, I have not once seen or heard any manifestation or expression of this feeling of patriotism."
    significance: "The empirical claim grounding the whole argument: patriotism is not natural to the народ but instilled from above."
    facsimile: ""
  - id: W9
    genre: works
    pssTom: 39
    pages: "62 (ch. XII)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "Восторги толпы большей частью искусственно приготовляются теми, кому они нужны"
    quoteEn: "(working English) The raptures of a crowd are for the most part artificially prepared by those who need them."
    significance: "Introduces the Preobrazhensky-regiment anecdote (every tenth soldier ordered to cross himself) — manufactured 'spontaneous' enthusiasm; the festivities were staged the same way by the French government."
    facsimile: ""
  - id: W10
    genre: works
    pssTom: 39
    pages: "66 (ch. XIII)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "не что иное, как предпочтение своего государства или народа всякому другому государству и народу"
    quoteEn: "(working English) [patriotism is] nothing other than the preference of one's own state or people over every other state and people."
    significance: "Tolstoy's definition — which he then calls not high but 'stupid and immoral,' a virtue of the ancient world with no material or moral basis in the Christian era."
    facsimile: ""
  - id: W11
    genre: works
    pssTom: 39
    pages: "71 (ch. XIV)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "нет во всей истории ни одной войны, которая не была бы вызвана правительствами"
    quoteEn: "(working English) in all of history there is not one war that was not provoked by governments."
    significance: "The anti-state thesis: governments manufacture the hostility (patriotism) they then claim to pacify — the gypsy who peppers his horse then pretends to restrain it."
    facsimile: ""
  - id: W12
    genre: works
    pssTom: 39
    pages: "72 (ch. XIV)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "Патриотизм есть рабство."
    quoteEn: "(working English) Patriotism is slavery."
    significance: "The essay's most compressed verdict; patriotism is the basis on which all subordination to government rests."
    facsimile: ""
  - id: W13
    genre: works
    pssTom: 39
    pages: "77 (ch. XVII)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "нужно только не лгать"
    quoteEn: "(working English) one need only not lie."
    significance: "The remedy: the greatest change needs no feats, only that each person stop affirming what he does not believe — the seed of the later 'do not lie' ethic."
    facsimile: ""
  - id: W14
    genre: works
    pssTom: 39
    pages: "80 (ch. XVIII)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "как одна свеча зажигает бесконечное количество других"
    quoteEn: "(working English) as one candle lights an infinite number of others."
    significance: "The image of how truth spreads from one free person to the next, dissolving the apparatus of brute force."
    facsimile: ""
  - id: W15
    genre: works
    pssTom: 39
    pages: "80 (ch. XVIII)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "«Мир оставляю вам, мир мой даю вам: да не смущается сердце ваше и да не устрашается», — сказал Христос."
    quoteEn: "(working English) 'Peace I leave with you, my peace I give unto you: let not your heart be troubled, neither let it be afraid' — said Christ. (John 14:27)"
    significance: "The closing — the peace Christ gives is already among us, to be acquired by each person's free confession of truth, not by treaties or congresses."
    facsimile: ""
  - id: W16
    genre: works
    pssTom: 39
    pages: "75 (ch. XIV)"
    date: "1894-03-17 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v39_027_080_Hristianstvo_i_patriotizm.txt
    quoteRu: "Народы же, подчиняющиеся правительствам, не могут быть разумны, потому что подчинение правительствам уже есть признак величайшего неразумия."
    quoteEn: "(working English) But peoples subordinate to governments cannot be rational, because subordination to governments is itself the sign of the greatest unreason."
    significance: "The grounds on which Tolstoy rejects arbitration/peace-congress pacifism (he answers the «проповедники мира посредством арбитрации» directly): interstate arbitration cannot bring peace while peoples remain subordinate to governments. This is why he is not a conventional peace-movement pacifist."
    facsimile: ""

  # ---- Genesis: composition-window diary (Tom 52) ----
  - id: D1
    genre: diary
    pssTom: 52
    pages: "103–104"
    date: "1893-11-03 (OS; TEI file dated 1893-10-06 — filename-date artifact)"
    addressee: ""
    localPdf: ""
    extract: extracts/v52_103_104_1893_10_06.txt
    quoteRu: "Написал Тулон и не посылаю."
    quoteEn: "(working English) I have written Toulon and am not sending it."
    significance: "First diary record of a finished draft; he calls it 'Toulon' (his working title throughout) and already hesitates to publish."
    facsimile: ""
  - id: D2
    genre: diary
    pssTom: 52
    pages: "104–107"
    date: "1893-12-22 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v52_104_107_1893_12_22.txt
    quoteRu: "это тяжелая, не кончающаяся работа над Тулоном, которую я не могу бросить"
    quoteEn: "(working English) this heavy, unending work on Toulon, which I cannot abandon."
    significance: "A month into the Moscow revision — stuck but unable to let it go; one of three 'events' he lists for the period."
    facsimile: ""
  - id: D3
    genre: diary
    pssTom: 52
    pages: "112–114"
    date: "1894-03-23 (OS; TEI file dated 1894-03-09 — filename-date artifact)"
    addressee: ""
    localPdf: ""
    extract: extracts/v52_112_114_1894_03_09.txt
    quoteRu: "За всё это время писал Тулон и дней 5 тому назад кончил и решил не переводить и не печатать. И это облегчило меня."
    quoteEn: "(working English) All this time I was writing Toulon, and finished it five days ago, and decided not to translate it and not to print it. And that relieved me."
    significance: "The decision to suppress the finished essay — the 'relief' is the high point of his recurring wish to abandon it."
    facsimile: ""
  - id: D4
    genre: diary
    pssTom: 52
    pages: "114–116"
    date: "1894-04-21 (OS)"
    addressee: ""
    localPdf: ""
    extract: extracts/v52_114_116_1894_04_21.txt
    quoteRu: "Тулон решил послать переводчикам. Все одобряют."
    quoteEn: "(working English) Toulon — decided to send to the translators. Everyone approves."
    significance: "The reversal: within a month the suppressed essay is released for translation and international publication."
    facsimile: ""

  # ---- Genesis: composition-window letters (Toms 66, 67, 84, 87) ----
  - id: L1
    genre: letter
    pssTom: 66
    pages: "414–415"
    date: "1893-10-30 (OS)"
    addressee: "D. A. Khilkov"
    localPdf: ""
    extract: extracts/v66_561_D_A_Xilkovu.txt
    quoteRu: "Еще написал статью протест против франко-русских празднеств, которыми нас хотят уверить, что мы все сочувствуем. Эту статью пошлю в английские газеты."
    quoteEn: "(working English) I have also written an article — a protest against the Franco-Russian festivities by which they want to assure us that we all sympathise. This article I shall send to the English papers."
    significance: "Names the essay a 'protest' and fixes the English-press destination as of 30 Oct; an early working self-description of the piece."
    facsimile: ""
  - id: L2
    genre: letter
    pssTom: 87
    pages: "231–233"
    date: "1893-10-30 (OS)"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v87_351_a30.txt
    quoteRu: "и пошлю в «Daily Chronicle» и к Suttner"
    quoteEn: "(working English) ...and [I] will send it to the Daily Chronicle and to Suttner [for her journal Die Waffen nieder, named in the same sentence]."
    significance: "Both target outlets named — the English Daily Chronicle and Bertha von Suttner's pacifist journal; the essay is still unfinished at this point."
    facsimile: ""
  - id: L3
    genre: letter
    pssTom: 87
    pages: "233–235"
    date: "1893-11-03 (OS)"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v87_352_noyabrya3.txt
    quoteRu: "Но с Тулоном сделалось то, что он мне опротивел"
    quoteEn: "(working English) But with Toulon what happened is that it became repugnant to me."
    significance: "The abandonment crisis: an 'inner voice' tells him not to bother with such trifles; he is glad to hear it. Same day as the D1 'not sending it' diary note."
    facsimile: ""
  - id: L4
    genre: letter
    pssTom: 87
    pages: "235–238"
    date: "1893-11-05 (OS)"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v87_353_a6.txt
    quoteRu: "Это было очень глупо с моей стороны. Я опять ею занять, хотя хорошего в ней очень мало"
    quoteEn: "(working English) That was very foolish of me. I am occupied with it again, though there is very little good in it."
    significance: "The retraction, two days later — he disowns the 'inner voice' as foolish and resumes. The abandon→resume oscillation recurs through to April."
    facsimile: ""
  - id: L5
    genre: letter
    pssTom: 66
    pages: "436–437"
    date: "1893-11-27 / 1893-12-03 (OS)"
    addressee: "G. A. Rusanov"
    localPdf: ""
    extract: extracts/v66_588_G_A_Rusanovu.txt
    quoteRu: "Теперь пишу о Тулоне, гипнотизации патриотизма, кажется кончил."
    quoteEn: "(working English) Now I am writing about Toulon, about the hypnotisation of patriotism; it seems I have finished."
    significance: "Earliest explicit statement of the central concept — 'the hypnotisation of patriotism' — and a premature claim of completion."
    facsimile: ""
  - id: L6
    genre: letter
    pssTom: 87
    pages: "253–258"
    date: "1894-02-08 (OS)"
    addressee: "V. G. Chertkov"
    localPdf: ""
    extract: extracts/v87_363_fevralya8.txt
    quoteRu: "Я все продолжаю толочь воду в Тулонской ступе"
    quoteEn: "(working English) I keep on pounding water in the Toulon mortar [i.e. labouring in vain] — that is, I cannot finish it."
    significance: "Mid-winter, still grinding; he attributes the block to 'something not thought through.'"
    facsimile: ""
  - id: L7
    genre: letter
    pssTom: 84
    pages: "209–210"
    date: "1894-02-03 (OS)"
    addressee: "S. A. Tolstaya"
    localPdf: ""
    extract: extracts/v84_592_a3.txt
    quoteRu: "Всё тот же так называемый Тулон, в котором я был вовлечен в разъяснения вопроса «патриотизма», и это очень интересно и, мне думается, ново и нужно, т. е. доказательство лжи и вреда этого патриотизма."
    quoteEn: "(working English) Still the same so-called Toulon, in which I was drawn into clarifying the question of 'patriotism' — and it is very interesting and, I think, new and necessary: the demonstration of the lie and harm of this patriotism."
    significance: "The clearest authorial thesis statement, to his wife: the piece grew from the Toulon events into a demonstration of 'the lie and harm of patriotism.'"
    facsimile: ""

