# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). PENDING: gather agent running; this
# block is filled from extracts/_scholarship.md once it lands.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    Scholarship fits Christianity and Patriotism into Tolstoy's post-1880 non-resistance arc but rarely
    analyses it on its own terms — the essay-level attention goes to The Kingdom of God Is Within You.
    Maude (1910) gives it about six lines; Simmons (1946), Bartlett (2010) and Wilson (1988) treat the
    anti-patriotism as biography rather than close reading; Christoyannopoulos (2013) gives the most
    systematic placement, listing patriotism among the targets of Tolstoyan anarchism. The recurring
    framing to resist is the blanket "pacifist" label: McKeogh (2009) usefully calls Tolstoy a
    "dissident" rather than a peace-congress activist, but the literature tends to flatten the distinction
    the primary text insists on — Tolstoy rejects arbitration/congress pacifism explicitly (W16; his 1899
    Letter to the Peace Conference makes it sharper). Contested labels — "utopian/naïve," "Christian
    Anarcho-Pacifist" — are reported here as the mainstream's words, to attribute, never to assert.
  triangulation:
    - evidenceRef: W3
      conventionalView: "Scholars summarise Tolstoy's anti-patriotism as patriotic 'mass hypnosis' in general terms; none unpacks the specific psychiatric borrowing of Sikorsky's malevanshchina / 'psychopathic epidemic.'"
      relation: extends
      source: "Christoyannopoulos (2013); the 2024 Zdziechowski study paraphrases 'patriotic mass hypnosis' without naming Sikorsky; Maude (1910) does not analyse it."
    - evidenceRef: W8
      conventionalView: "Scholarship reads patriotism as an ideology imposed by elites, but rarely foregrounds Tolstoy's sharper inversion — that patriotism is not a natural feeling of the народ at all, but an artificial induction."
      relation: extends
      source: "Christoyannopoulos (2013) — Tolstoy 'challenges the myth of patriotism as ideology'; McKeogh (2009) treats it as political critique without the народ-specificity."
    - evidenceRef: W9
      conventionalView: "Widely cited core claim: governments manufacture patriotism via press, school, church and clergy."
      relation: confirms
      source: "Christoyannopoulos (2013); McKeogh (2009); Libertarianism.org (2024)."
    - evidenceRef: W16
      conventionalView: "The blanket 'pacifist' label collapses the distinction Tolstoy draws: he is read as a peace-movement figure, whereas he rejects arbitration/congress pacifism because peoples subordinate to governments cannot be rational interstate actors."
      relation: complicates
      source: "McKeogh (2009) partly supports ('dissident not activist'); Christoyannopoulos's title 'Christian Anarcho-Pacifist' (2013) risks the elision; Tolstoy's Letter to the Peace Conference (1899, primary) is the explicit pushback."
    - evidenceRef: W13
      conventionalView: "Scholarship absorbs the remedy into the general non-resistance / conscientious-objection frame; the specific 'не лгать' (do not lie) prescription is not isolated as the mechanism."
      relation: extends
      source: "No named scholar isolates it; Alston (2014) centres the lived Tolstoyan communities (the doing) rather than the diagnostic; McKeogh (2009) emphasises refusal of military service as the act."

