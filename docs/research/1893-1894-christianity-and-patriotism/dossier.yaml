topic:
  slug: 1893-1894-christianity-and-patriotism
  title: "Christianity and Patriotism (Христианство и патриотизм)"
  question: >-
    Read Tolstoy's 1893–94 anti-patriotism polemic as a single work: its argument
    (patriotism as a government-, press-, school-, and clergy-induced hypnosis,
    incompatible with Christianity; the Franco-Russian alliance / Toulon 1893
    festivities as the exhibit; the remedy of individual refusal to lie); its
    genesis, redactions, censorship and translation lineage, reception, and place
    in the non-resistance cluster.
  date: "2026-06-07"
  period: "Prophet period (post-1880)"
  corpusSurface: "works (PSS Tom 39) + composition-window diary (Tom 52) + letters (Toms 66, 67, 84, 87); light visuals sweep"
  dateRange: "composition 1893-10-08 / 1894-03-17 (OS); first publication 1894 (FR), Russia 1906"

# ─────────────────────────────────────────────────────────────────────────────
