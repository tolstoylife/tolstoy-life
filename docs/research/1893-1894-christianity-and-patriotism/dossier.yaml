contradictions:
  - claim: "The editorial history dates the abandonment diary entry to 3 Nov 1893 (PSS p.103) and the suppression entry to 23 Mar 1894 (p.112)."
    correction: "Both are filed in the TEI under different filename dates (1893-10-06 and 1894-03-09 respectively) because each opens a multi-day entry; the entry texts carry the true dates («Нынче 3 Ноября 1893», «23 Марта. Москва»)."
    evidenceRef: D1
  - claim: "The editorial history quotes the 22 Dec 1893 diary as «Тяжелая, некончающаяся работа над Тулоном…»."
    correction: "The diary text reads «это тяжелая, не кончающаяся работа над Тулоном, которую я не могу бросить» (lowercase, spaced «не кончающаяся»). Minor orthographic divergence between the apparatus paraphrase and the diary."
    evidenceRef: D2

