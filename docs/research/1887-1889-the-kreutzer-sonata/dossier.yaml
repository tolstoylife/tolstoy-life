    pages: "563-624"
    date: "1936"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_563_624_Krejtserova_sonata.txt
    quoteRu: "добилась с государем свидания, которое произошло 13 апреля в Петербурге."
    quoteEn: >-
      (working English) obtained an audience with the Sovereign, which took place
