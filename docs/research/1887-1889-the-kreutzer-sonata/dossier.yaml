# ============================================================================
scholarship:
  summary: >-
    English-language biography (Simmons; Bartlett 2010; Maude) reads the novella
    as the culmination of Tolstoy's post-1870s moral-religious crisis, belonging
    with the treatises rather than the earlier realist fiction — a placement the
    corpus confirms. The central interpretive split is the marquee question: a
    "mouthpiece" reading (Pozdnyshev = Tolstoy, leaning on the Afterword; Maude,
    popular reception) versus an "ironic-distance / unreliable-narrator" reading
    (the novella formally manages Pozdnyshev's voice; the Afterword is a separate
    rhetorical act — Yacobi 2005, engaged by Gershkovich 2019). Scholars also
    connect the novella's music theory to What Is Art?, trace the chastity
    argument partly to Alice Stockham's Tokology, and document a worldwide moral
    panic (US postal ban 1890; Roosevelt's "sexual moral pervert"). The
    Sofia-centred biographical frame is the mainstream lens the dive treats
    critically. Full attribution: extracts/_scholarship.md.
  triangulation:
    - evidenceRef: pos-horrified-own-conclusions
      conventionalView: >-
        Mouthpiece reading: Pozdnyshev voices Tolstoy's own ethics, confirmed by
        the Afterword (Maude; popular reception). Counter: the novella's formal
        management of the voice marks ironic distance; the Afterword is a
        separate rhetorical act (Yacobi 2005).
      relation: extends
      source: >-
        Yacobi 2005; Gershkovich, PMLA 2019; Maude 1908–10. The corpus locates
        the precise seam neither pole resolves: proposition owned in propria
        persona, modality (rule vs ideal) explicitly withheld.
    - evidenceRef: pos-chastity-ideal-not-rule
      conventionalView: >-
        The Afterword is often read as flat dogmatic absolutism (the
        "moralistic dogmatist" frame).
      relation: complicates
      source: >-
        General reception (Chesterton 1908 hostile touchstone). The primary text
        frames chastity as an asymptotic ideal — a compass-bearing, not a rule —
        which the absolutist reading flattens.
    - evidenceRef: ks-music-irritating
      conventionalView: >-
        Scholars read the novella's music theory as anticipating What Is Art?
        (Knapp 1988; Green 1966).
      relation: confirms
      source: "Knapp 1988; the project's own What Is Art? dive (1897-1898-what-is-art)."
    - evidenceRef: comm-andreev-burlak
      conventionalView: >-
        The autobiographical frame: the novella as an attack on the Tolstoy
        marriage, Pozdnyshev's jealousy mirroring Tolstoy's of Taneyev.
      relation: complicates
      source: >-
        Popular biography; Shirer 1994; Smoluchowski 1987. Chronology pushes
        back: the first sketch is 1887, the doctrine is grounded in
        post-conversion Gospel reading, and the Taneyev episode is mid-1890s.
    - evidenceRef: pos-abstinence-in-marriage
      conventionalView: >-
        The chastity doctrine read as patriarchal in origin.
      relation: complicates
      source: >-
        Edwards 1993; Bartlett 2010 — the argument is partly traceable to Alice
        B. Stockham's Tokology, a North American proto-feminist medical source
        Tolstoy promoted.

