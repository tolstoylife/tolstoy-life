topic:
  slug: 1887-1889-the-kreutzer-sonata
  title: "The Kreutzer Sonata (Крейцерова соната) + the Afterword — a novel-dive"
  question: >-
    How far does Tolstoy endorse Pozdnyshev? Read the novella and its Afterword
    together against the composition record to test the marquee question and to
    render the chastity doctrine as Tolstoy actually argued it.
  date: 2026-06-08
  period: "Prophet period (post-1880)"
  corpusSurface: >-
    PSS Tom 27 (novella, Afterword, 9 redactions/variants, «История писания»);
    diaries Tom 50–51 (1888–1890); letters Tom 64–65 (1887–1891).
  dateRange: "1887–1891 (composition 1887→1890; first Russian print 1891)"

# ============================================================================
evidence:

  # ---- Novella: the doctrine (chs X–XIV) ----
  - id: ks-doctrine-passion-evil
    genre: works
    pssTom: 27
    pages: "7-78"
    date: "1889"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_007_078_Krejtserova_sonata.txt
    quoteRu: >-
      Половая страсть, как бы она ни была обставлена, есть зло, страшное зло, с
      которым надо бороться, а не поощрять, как у нас.
    quoteEn: >-
      (working English) Sexual passion, however it is arranged, is an evil, a
      terrible evil, which must be fought, not encouraged as it is among us.
    significance: >-
      Pozdnyshev's core doctrine (ch. XI): the carnal is not a regrettable
      necessity but an evil to be combated — and the standard applies inside
      marriage.
    facsimile: ""

  - id: ks-gospel-own-wife
    genre: works
    pssTom: 27
    pages: "7-78"
    date: "1889"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_007_078_Krejtserova_sonata.txt
    quoteRu: >-
      Слова Евангелия о том, что смотрящий на женщину с вожделением уже
      прелюбодействовал с нею, относятся не к одним чужим женам, а именно — и
      главное — к своей жене.
    quoteEn: >-
      (working English) The words of the Gospel — that he who looks on a woman
      with lust has already committed adultery with her — apply not only to
      other men's wives, but precisely — and above all — to one's own wife.
    significance: >-
      The Matthew V:28 standard (the novella's epigraph) turned inward against
      one's own wife — the in-text form of the Afterword's argument.
    facsimile: ""

  - id: ks-marriage-as-sale
    genre: works
    pssTom: 27
    pages: "7-78"
    date: "1889"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_007_078_Krejtserova_sonata.txt
    quoteRu: >-
      Выходит что-то в роде продажи. Развратнику продают невинную девушку и
      обставляют эту продажу известными формальностями.
    quoteEn: >-
      (working English) It turns out to be something like a sale. An innocent
      girl is sold to a debauchee, and this sale is dressed up with certain
      formalities.
    significance: "Marriage as practised indicted as a disguised sale (ch. X)."
    facsimile: ""

  - id: ks-woman-instrument
    genre: works
    pssTom: 27
    pages: "7-78"
    date: "1889"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_007_078_Krejtserova_sonata.txt
    quoteRu: "Она орудие наслаждения. Тело ее есть средство наслаждения."
    quoteEn: >-
      (working English) She is an instrument of pleasure. Her body is a means of
      pleasure.
    significance: >-
      The objectification thesis (ch. XIV) — framed as an indictment of the male
      view, not an endorsement of it.
    facsimile: ""

  # ---- Novella: the music passage (ch. XXIII) ----
  - id: ks-music-irritating
    genre: works
    pssTom: 27
    pages: "7-78"
    date: "1889"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_007_078_Krejtserova_sonata.txt
    quoteRu: >-
      Что такое музыка? Что она делает? И зачем она делает то, что она делает?
      [...] Она действует ни возвышающим ни принижающим душу образом, а
      раздражающим душу образом.
    quoteEn: >-
      (working English) What is music? What does it do? And why does it do what
      it does? [...] It acts neither in an elevating nor in a degrading way on
      the soul, but in an irritating [provoking] way.
    significance: >-
      The theory of music as an involuntary power (ch. XXIII) — a direct primary
      anticipation of the "infectiousness" argument of What Is Art? (1897–98).
    facsimile: ""

  # ---- Novella: the murder (ch. XXVII) ----
  - id: ks-murder-dagger
    genre: works
    pssTom: 27
    pages: "7-78"
    date: "1889"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_007_078_Krejtserova_sonata.txt
    quoteRu: "изо всех сил ударил ее кинжалом в левый бок, ниже ребер."
    quoteEn: >-
      (working English) I struck her with all my strength with the dagger in the
      left side, below the ribs.
    significance: >-
      The killing rendered without exculpatory haze (ch. XXVII); Pozdnyshev
      insists he remembered everything.
    facsimile: ""

