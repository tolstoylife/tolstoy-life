  # ---- Afterword: the decisive doctrinal layer ----
  - id: pos-abstinence-in-marriage
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: >-
      воздержание, составляющее необходимое условие человеческого достоинства
      при безбрачном состоянии, еще более обязательно в браке.
    quoteEn: >-
      (working English) abstinence — which constitutes the necessary condition of
      human dignity in the unmarried state — is still more obligatory in
      marriage.
    significance: >-
      The maximal claim, in Tolstoy's own voice: chastity is more, not less,
      obligatory inside marriage. Rendered as made (project rule: not softened).
    facsimile: ""

  - id: pos-chastity-better
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: "никто не спорит о том, что целомудрие лучше распущенности."
    quoteEn: >-
      (working English) no one disputes that chastity is better than
      dissoluteness.
    significance: "The premise Tolstoy says no one actually contests."
    facsimile: ""

  - id: pos-ideal-full-chastity
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: "оно указывает идеал полного целомудрия."
    quoteEn: >-
      (working English) it [the teaching of Christ] points to the ideal of full
      chastity.
    significance: "The Gospel grounding of the ideal of full chastity."
    facsimile: ""

  - id: pos-chastity-ideal-not-rule
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: >-
      Целомудрие не есть правило или предписание, а идеал или скорее — одно из
      условий его.
    quoteEn: >-
      (working English) Chastity is not a rule or a prescription, but an ideal —
      or rather, one of the conditions of it.
    significance: >-
      THE doctrinal pivot and the answer to the marquee question's modality:
      Tolstoy endorses the chastity ideal but explicitly refuses it the status of
      a rule.
    facsimile: ""

  - id: pos-marriage-is-sin
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: >-
      плотская же любовь, брак, есть служение себе и потому есть во всяком случае
      препятствие служению Богу и людям, а потому с христианской точки зрения —
      падение, грех.
    quoteEn: >-
      (working English) but carnal love, marriage, is service of self and
      therefore is in any case an obstacle to the service of God and of people,
      and therefore, from the Christian point of view — a fall, a sin.
    significance: "The valuation of marriage itself — rendered exactly as stated."
    facsimile: ""

  - id: pos-sister-brother
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: >-
      заменой плотской любви чистыми отношениями сестры и брата.
    quoteEn: >-
      (working English) by replacing carnal love with the pure relations of
      sister and brother.
    significance: "What the ideal asks of a married couple specifically."
    facsimile: ""

  - id: pos-horrified-own-conclusions
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: "Я ужасался своим выводам, хотел не верить им, но не верить нельзя было."
    quoteEn: >-
      (working English) I was horrified at my own conclusions, I wanted not to
      believe them, but it was impossible not to believe them.
    significance: >-
      Decisive for the marquee question: the conclusions are «свои» — Tolstoy's
      own, reached against his own resistance, in propria persona, not a
      character's.
    facsimile: ""

  - id: pos-convictions-now-express
    genre: works
    pssTom: 27
    pages: "79-92"
    date: "1890"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_079_092_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: >-
      я никак не ожидал, что ход моих мыслей приведет меня к тому, к чему он
      привел меня.
    quoteEn: >-
      (working English) I in no way expected that the course of my thoughts would
      bring me to where it brought me.
    significance: >-
      Authorial ownership stated in the first person — "my thoughts," not a
      character's views.
    facsimile: ""

