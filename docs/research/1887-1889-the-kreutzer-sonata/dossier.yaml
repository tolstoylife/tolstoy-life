contradictions:
  - claim: "Pozdnyshev strangles his wife before stabbing her (two sequential acts)."
    correction: >-
      Present in the lithographed (8th) redaction («я душил ее, и я ударил ее
      кинжалом») but the strangling is dropped from the final printed text, where
      the dagger blow is the sole act. An intra-corpus variant, not an error.
    evidenceRef: litho-stud-horses
  - claim: "The murder weapon and manner are fixed from the start."
    correction: >-
      The first redaction already uses a кинжал (dagger) and the wife briefly
      survives asking forgiveness; the final text has her die unforgiving — the
      'apt' objection Tatyana raised (7 Sep 1889) shaped the change.
    evidenceRef: ks-murder-dagger

