  # ---- Commentary: Afterword genesis ----
  - id: comm-chertkov-pressure
    genre: commentary
    pssTom: 27
    pages: "625-646"
    date: "1936"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_625_646_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: "полное воздержание лучше всего, но только для тех, кто могут вместить."
    quoteEn: >-
      (working English) full abstinence is best, but only for those who can
      contain it.
    significance: >-
      Chertkov's 27 Oct 1889 plea (quoted by the editors) for a softer, "for
      those who can receive it" framing — the editorial pressure that prompted
      the Afterword.
    facsimile: ""

  - id: comm-no-such-marriage
    genre: commentary
    pssTom: 27
    pages: "625-646"
    date: "1936"
    addressee: ""
    localPdf: ""
    extract: extracts/v27_625_646_Posleslovie_k_Krejtserovoj_sonate.txt
    quoteRu: "Нет такого брака."
    quoteEn: "(working English) There is no such marriage."
    significance: >-
      Tolstoy (to Chertkov, 25 Apr 1890) refusing the "rehabilitation of honest
      marriage" Chertkov urged — he would not soften the doctrine.
    facsimile: ""

