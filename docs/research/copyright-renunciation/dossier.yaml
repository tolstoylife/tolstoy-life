# Deferred human-judgment / defects to surface.
needsReview:
  - item: "extract_tei.py returns only the opener for v82_305 (Explanatory Note to the Will)"
    phase: extract
    why: >-
      The operative provision is present in the raw TEI (26.9 KB) and in PSS Tom 82 pp.227–231, but is
      encoded inside <note type="comments"> apparatus, which the canonical extractor strips by design.
      Result: the body silently vanishes from clean output. A fuller extract or the PDF page is needed
      before quoting the Explanatory Note verbatim. Candidate fix for docs/research/lib/extract_tei.py.
  - item: "v63_430 (Birukoff, 1885) clean extract renders unreliably"
    phase: extract
    why: >-
      Early-volume pre-reform orthography; the extractor output is garbled in places. Cited by id/pages
      only; verify against PSS Tom 63 pp.295–298 (vol29) before any verbatim quotation.

