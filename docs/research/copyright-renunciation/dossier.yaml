# Machine-readable dossier for the copyright-renunciation survey (index.md).
# Added 2026-05-29 by a corpus-dive acceptance run (slug copyright-renunciation-and-literary-property),
# whose findings independently reproduced this survey's; the evidence/entity/visuals layers were ported
# here as an enrichment. The hand-built index.md remains the authoritative narrative.
topic:
  slug: copyright-renunciation
  title: "Tolstoy on copyright and the renunciation of literary property"
  question: >-
    Where across the local corpus (tolstoydigital TEI + Jubilee Edition PDFs) does Tolstoy
    discuss copyright, ownership of his writings, and the renunciation of literary property,
    and how does that position develop from the early 1880s to his death?
  date: 2026-05-29
  period: prophet
  corpusSurface: [diaries, letters, works, notebooks]
  dateRange: "1881–1910"

# Layer 1 — flat citation ledger. Every quoteRu is byte-faithful from the clean extract named in
# `extract`. quoteEn is working English (labelled). PSS Tom -> local PDF via pss-volume-mapping.md.
# This ledger anchors the keystone moments of index.md; the fuller letter/diary clusters index.md
# tabulates are listed under notCovered (surfaced, not yet entered as evidence rows).
evidence:
  - id: v49_059_059_1883_01_01
    genre: diary
    pssTom: 49
    pages: "59"
    date: 1883-01-01
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol50/vol50.pdf
    extract: extracts/v49_059_059_1883_01_01.txt
    quoteRu: >-
      Собственность, как она теперь — зло. А собственность сама по себе — радость на то, что тем,
      что я сделал, добро. […] Но собственность, ограждаемая насилием — городовым с пистолетом —
      это зло. Сделай ложку и ешь ею, но пока она другому не нужна.
    quoteEn: >-
      Property as it is now — is evil. Property in itself — is joy in the good one has made. […] But
      property defended by violence — by the policeman with a pistol — that is evil. Make a spoon
      and eat with it, but only until another needs it. (working English)
    significance: >-
      The philosophical groundwork: property is not in itself evil, property defended by violence is.
      The conceptual foundation the later, practical renunciation statements rest on.
    facsimile: null

  - id: v66_036_RedaktoramgazetRusskievedomosti
    genre: letter
    pssTom: 66
    pages: "47–48"
    date: 1891-09-16
    addressee: "Editors of Russkie vedomosti and Novoye vremya"
    localPdf: primary-sources/jubilee-edition/vol32/vol32.pdf
    extract: extracts/v66_036_RedaktoramgazetRusskievedomosti.txt
    quoteRu: >-
      Предоставляю всем желающим право безвозмездно издавать в России и за границей, по-русски и
      в переводах, а равно и ставить на сценах все те из моих сочинений, которые были написаны
      мною с 1881 года и напечатаны в XII томе моих полных сочинений издания 1886 года, и в XIII
      томе, изданном в нынешнем 1891 году, равно и все мои неизданные в России и могущие вновь
      появиться после нынешнего дня сочинения.
    quoteEn: >-
      I grant to all who so wish the right to publish gratis, in Russia and abroad, in Russian and
      in translations, and likewise to perform on stage, all those of my writings which were
      written by me from 1881 onward and printed in vol. XII of my complete works of the 1886
      edition, and in vol. XIII, published in this present year 1891, and likewise all my works
      unpublished in Russia and any that may newly appear after the present day. (working English)
    significance: >-
      The public declaration renouncing copyright on all writings from 1881 onward (dated 16 September
      1891 in-corpus; the papers printed it days later). Source of the «с 1881 года» reading
      (see contradictions).
    facsimile: null

  - id: v52_045_047_1891_07_22
    genre: diary
    pssTom: 52
    pages: "45–47"
    date: 1891-07-22
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol18/vol18.pdf
    extract: extracts/v52_045_047_1891_07_22.txt
    quoteRu: >-
      И вчера же был разговор с женой о напечатании письма в газетах об отказе от права авторской
      собственности. Трудно вспомнить, а главное, описать всё, что тут было: [Вымарано 19 строк.]
    quoteEn: >-
      And yesterday too there was a conversation with my wife about printing in the newspapers the
      letter renouncing the right of literary property. It is difficult to recall, and chiefly to
      describe, everything that was said: [19 lines erased.] (working English)
    significance: >-
      First detailed diary account of the household conflict over the 1891 declaration. The editorial
      marker [Вымарано 19 строк] preserves the fact that nineteen manuscript lines were deleted (by
      S. A. Tolstaya) — the source records the redaction without the redacted text.
    facsimile: null

  - id: v53_014_018_1895_03_27
    genre: diary
    pssTom: 53
    pages: "14–18"
    date: 1895-03-27
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol19/vol19.pdf
    extract: extracts/v53_014_018_1895_03_27.txt
    quoteRu: >-
      4) Право на издание моих сочинений прежних: десяти томов и азбуки прошу моих наследников
      передать обществу, т. е. отказаться от авторского права. Но только прошу об этом и никак
      не завещаю. […] То, что сочинения мои продавались эти последние 10 лет, было самым
      тяжелым для меня делом в жизни.
    quoteEn: >-
      4) I ask my heirs to hand over to the public the right of publication of my earlier works
      — the ten volumes and the Azbuka — that is, to renounce the copyright. But I only ask this
      and in no way bequeath it. […] That my writings have been sold during these last ten years
      was the heaviest thing in my life. (working English)
    significance: >-
      Will-as-diary-entry; the most plainly written first-person statement of the renunciation.
      Precedes the six formal wills of 1909–1910 by fourteen years.
    facsimile: extracts/pss-vol53-pages/page-054.png

  - id: v63_430_P_I_Biryukovu
    genre: letter
    pssTom: 63
    pages: "295–298"
    date: 1885-10-19
    addressee: "P. I. Birukoff"
    localPdf: primary-sources/jubilee-edition/vol29/vol29.pdf
    extract: extracts/v63_430_P_I_Biryukovu.txt
    quoteRu: null   # extract is pre-reform orthography and renders roughly; not quoted verbatim
    quoteEn: null
    significance: >-
      Earliest sustained discussion of free publication in the letters (the Posrednik / cheap-edition
      circle). Cited by id and PSS pages; not quoted verbatim because the clean extract of this
      early-volume pre-reform text renders unreliably (see needsReview).
    facsimile: null

  - id: v82_305_Obyasnitelnayazapiskakzaveshhaniyu
    genre: commentary
    pssTom: 82
    pages: "227–231"
    date: 1910-07-31
    addressee: null
    localPdf: primary-sources/jubilee-edition/vol58/vol58.pdf
    extract: extracts/v82_305_Obyasnitelnayazapiskakzaveshhaniyu.txt
    quoteRu: null   # operative text not present in clean extract — see needsReview (extractor gap)
    quoteEn: null
    significance: >-
      The Explanatory Note to the final will (31 July 1910), drafted by V. G. Chertkov at Tolstoy's
      request — the legally precise statement that finally gave the renunciation binding form. The
      operative provision is present in the raw TEI and in PSS Tom 82 pp.227–231 but is encoded as
      commentary apparatus, so the canonical extractor returns only the opener (see needsReview).
    facsimile: null

