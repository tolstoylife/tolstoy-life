# ── SCHOLARSHIP (secondary layer — attributed, not asserted) ─────────────────
scholarship:
  summary: >
    English-language scholarship treats Tolstoy as the most-depicted writer of his
    age and reads the late Repin portraits (ploughing, barefoot, at his desk) as the
    machinery that built the "sage of Yasnaya Polyana" iconography (Bartlett 2011;
    Vaysman 2022). Valkenier (1990) frames Repin and Tolstoy as mutual admirers who
    disagreed irreconcilably on art's purpose. The Kramskoy→Mikhailov identification in
    Anna Karenina is a received tradition passed through biographies (Bartlett 2011),
    complicated by Vladiv-Glover, not established from archive. Gatrall argues the
    Ge–Tolstoy bond was a bidirectional "interarts" dialogue, not simple discipleship.
    Reischl (2018) reads the late image-war as a contest between Sofia's domestic
    photography and Chertkov's prophet-among-peasants vision; the Sofia-as-jealous-
    antagonist framing (Popoff 2010; the film The Last Station) is itself a contested
    position, attributed — not adopted.
  triangulation:
    - evidenceRef: v64_115_V_V_Stasovu
      conventionalView: "Repin's late portraits constructed Tolstoy's prophet-iconography (Bartlett 2011; Vaysman 2022)."
      relation: confirms
      source: "Bartlett 2011; Vaysman 2022"
    - evidenceRef: v50_067_068_1889_04_15
      conventionalView: "Tolstoy admired Repin's depictions of him."
      relation: complicates
      source: "Valkenier 1990 (via Gambrell 1993)"
    - evidenceRef: v30_027_203_Chto_takoe_iskusstvo
      conventionalView: "What Is Art? is an undifferentiated attack on elite art; the depicted iconoclast is a paradox scholarship notes but does not resolve."
      relation: extends
      source: "Vaysman 2022"
    - evidenceRef: v19_003_399_Anna_Karenina_Chasti_5_8
      conventionalView: "Kramskoy is the model for the painter Mikhailov."
      relation: complicates
      source: "Bartlett 2011; Vladiv-Glover"
    - evidenceRef: v66_341_N_N_Geotcu
      conventionalView: "Tolstoy was the spiritual catalyst for Ge's late art but did not give compositional direction."
      relation: contradicts
      source: "Gatrall; Yudenkova 2011"
    - evidenceRef: v67_161_P_M_Tretyakovu
      conventionalView: "Tretyakov acquired Ge's late works often only on Tolstoy's urging."
      relation: confirms
      source: "Yudenkova 2011; Birchenough"
    - evidenceRef: v52_157_159_1894_12_31
      conventionalView: "The 1910 'portrait war' pitted a jealous Sofia against Chertkov."
      relation: complicates
      source: "Reischl 2018; cf. Popoff 2010 (contested)"

# ── CONTRADICTIONS (intra-corpus, primary-vs-primary) ───────────────────────
contradictions:
  - claim: "Repin was the sculptor at the July 1891 Yasnaya sitting."
    correction: "The diary names Ginzburg as the sculptor and Repin as the painter ('они меня лепят и пишут'); Repin's own busts are separately attested (v66_012)."
    evidenceRef: v52_044_044_1891_07_13
  - claim: "Tolstoy uniformly admired the artists who painted him."
    correction: "He repeatedly judged specific Repin canvases harshly ('невозможна — всё выдумано') while elevating Ge."
    evidenceRef: v50_067_068_1889_04_15

# ── NOT COVERED ─────────────────────────────────────────────────────────────
notCovered:
  - "Photography (Chertkov, Sofia Tolstaya, Bulla, the 1908 Prokudin-Gorsky colour plate) — excluded by scope; a large separate dive. The 1909 diary note of Chertkov 'делал портреты' (photographs) was extracted but flagged as photography, out of scope."
  - "Pre-1873 images (1848/1850s youth portraits) — out of the declared 1873–1910 window."
  - "Death masks and posthumous monuments (Merkurov 1910 death mask; later statues) — edge of scope, not catalogued."
  - "Caricature and the periodical-press graphic record (Niva, foreign illustrated weeklies beyond the Pasternak/Repin woodcuts noted)."
  - "Tatyana Lvovna Tolstaya's own paintings of her father — attested only in external biography, silent in the corpus; needs a separate vault/archive pass."

