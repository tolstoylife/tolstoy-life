# dossier.yaml — corpus-dive: Tolstoy in art (paintings, drawings, sculpture)
# Machine-readable companion to index.md. Evidence quotes are byte-faithful to
# the named extract file (verify_quotes.py gate). Secondary/scholarly claims are
# attributed, not asserted. Visuals cache is git-ignored; licence is the gate for
# any later publication to website/src/.

topic:
  slug: tolstoy-in-art
  title: "Tolstoy in art — paintings, drawings and sculpture of Tolstoy and his circle"
  question: >
    What fine-art and sculptural depictions exist of Tolstoy, the people and places
    around him (1873–1910); when were they actually made; do high-quality reproductions
    exist; are they public domain or held under institutional control? Grounded in
    Tolstoy's own letters and diaries.
  date: 2026-06-02
  period: "1873–1910 (portrait era); letters/diaries sweep emphasises post-1880"
  corpusSurface: "letters (Toms 62–82), diaries (Toms 49–58), works (Tom 19 Anna Karenina; Tom 30 What Is Art?; Tom 37 Orlov preface)"
  dateRange: "1873-09 – 1910-09"

# ── EVIDENCE LEDGER (byte-faithful primary citations) ───────────────────────
evidence:
  # KRAMSKOY — 1873 keystone
  - id: v62_034_A_A_Fetu
    genre: letter
    pssTom: 62
    pages: "48–49"
    date: "1873-09-23"
    dateNote: "Old Style"
    addressee: "A. A. Fet"
    localPdf: "primary-sources/jubilee-edition/vol62/vol62.pdf"
    extract: extracts/v62_034_A_A_Fetu.txt
    quoteRu: "У меня каждый день, вот уже с неделю, живописец Крамской [...] делает мой портрет в Третьяковскую галлерею, и я сижу и болтаю с ним и из Петербургской стараюсь обращать его в крещеную веру."
    quoteEn: "Every day now, for a week already, the painter Kramskoy has been making my portrait for the Tretyakov gallery, and I sit and chat with him and try to convert him from the Petersburg faith to the baptized one. (working English)"
    significance: "The keystone. Tolstoy's own words date the Kramskoy sittings to the week before 23 Sept 1873 and name the Tretyakov commission."
  - id: v62_035_N_N_Straxovu
    genre: letter
    pssTom: 62
    pages: "49–51"
    date: "1873-09-23"
    dateNote: "Old Style (written 23–24 Sept)"
    addressee: "N. N. Strakhov"
    localPdf: "primary-sources/jubilee-edition/vol62/vol62.pdf"
    extract: extracts/v62_035_N_N_Straxovu.txt
    quoteRu: "Он теперь кончает оба портрета и ездит каждый день, и мешает мне заниматься. Я же во время сидений обращаю его из петербургской в христианскую веру и, кажется, успешно."
    quoteEn: "He is now finishing both portraits and comes every day, keeping me from my work. During the sittings I am converting him from the Petersburg to the Christian faith — successfully, it seems. (working English)"
    significance: "Independent second-source confirmation that TWO 1873 portraits were painted (Tretyakov + a family version) and of the daily sittings."

  # ANNA KARENINA — the painter Mikhailov (literary counterpart)
  - id: v19_003_399_Anna_Karenina_Chasti_5_8
    genre: work
    pssTom: 19
    pages: "Part 5, ch. IX–XIII"
    date: "1875-1876"
    dateNote: "AK Part 5 composition"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol19/vol19.pdf"
    extract: extracts/v19_003_399_Anna_Karenina_Chasti_5_8.txt
    quoteRu: "Портрет с пятого сеанса поразил всех, в особенности Вронского, не только сходством, но и особенною красотою. Странно было, как мог Михайлов найти ту ее особенную красоту."
    quoteEn: "The portrait, after the fifth sitting, struck everyone, Vronsky especially, not only by its likeness but by a particular beauty. It was strange how Mikhailov could have found that particular beauty of hers. (working English)"
    significance: "Written in the same years Kramskoy painted Tolstoy; the painter Mikhailov who finds the sitter's inner truth (vs Vronsky the dilettante) is widely identified with Kramskoy — but the corpus text does NOT name him (that link is scholarship)."

  # GE — the closest art friendship (1882–94)
  - id: v64_307_N_N_Ge_otcu
    genre: letter
    pssTom: 64
    pages: "217–218"
    date: "1889-01-31"
    dateNote: "Old Style"
    addressee: "N. N. Ge (the painter, father)"
    localPdf: "primary-sources/jubilee-edition/vol64/vol64.pdf"
    extract: extracts/v64_307_N_N_Ge_otcu.txt
    quoteRu: "которая хороша не потому, что я ее люблю, а всем хороша будет, потому что очень задушевна."
    quoteEn: "...which is good not because I love it but because it will be good for everyone, since it is very heartfelt. (working English)"
    significance: "Dates Tolstoy's knowledge that Ge was painting a new canvas to Jan 1889 — the gestation of 'What Is Truth?' (exhibited 1890)."
  - id: v64_358_N_N_Ge_otcu
    genre: letter
    pssTom: 64
    pages: "248–250"
    date: "1889-04-21"
    dateNote: "Old Style"
    addressee: "N. N. Ge (father)"
    localPdf: "primary-sources/jubilee-edition/vol64/vol64.pdf"
    extract: extracts/v64_358_N_N_Ge_otcu.txt
    quoteRu: "Я знал эскиз, слышал про картину, но когда увидал, я умилился. Картина делает то, что нужно — раскрывает целый мир той жизни Христа, вне знакомых моментов, и показывает его там таким, каким каждый может себе его представить по своей духовной силе."
    quoteEn: "I knew the sketch, had heard about the picture, but when I saw it I was moved to tenderness. The picture does what is needed — it opens up a whole world of that life of Christ, outside the familiar moments, and shows him as each may picture him by his own spiritual strength. (working English)"
    significance: "Dated first-hand viewing (April 1889) of Ge's 'Exit from the Last Supper', with compositional critique — exceptional reception/provenance evidence."
  - id: v50_067_068_1889_04_15
    genre: diary
    pssTom: 50
    pages: "67–68"
    date: "1889-04-15"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol50/vol50.pdf"
    extract: extracts/v50_067_068_1889_04_15.txt
    quoteRu: "Картина Репина невозможна — всё выдумано. Ге хорош очень."
    quoteEn: "Repin's picture is impossible — it is all made up. Ge is very good. (working English)"
    significance: "Terse dated verdict (six days before the long Ge letter) preferring Ge's canvas to Repin's — a counterweight to the 'admiring sitter' framing."
  - id: v51_015_015_1890_01_28
    genre: diary
    pssTom: 51
    pages: "15"
    date: "1890-01-28"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol51/vol51.pdf"
    extract: extracts/v51_015_015_1890_01_28.txt
    quoteRu: "Приехал Ге старший, привез рисунок картины — очень хорошо."
    quoteEn: "Ge the elder arrived, brought a drawing of the picture — very good. (working English)"
    significance: "First-person record of Ge physically bringing a study to Yasnaya Polyana, Jan 1890 — provenance anchor for the 'What Is Truth?' year."
  - id: v51_095_096_1890_10_23
    genre: diary
    pssTom: 51
    pages: "95–96"
    date: "1890-10-23"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol51/vol51.pdf"
    extract: extracts/v51_095_096_1890_10_23.txt
    quoteRu: "Ге всё лепит."
    quoteEn: "Ge keeps sculpting. (working English)"
    significance: "Dated diary note that Ge was modelling in autumn 1890 — the period of his bust of Tolstoy."
  - id: v66_012_N_N_Geotcu
    genre: letter
    pssTom: 66
    pages: "24–25"
    date: "1891-07-30"
    dateNote: "Old Style"
    addressee: "N. N. Ge (father)"
    localPdf: "primary-sources/jubilee-edition/vol66/vol66.pdf"
    extract: extracts/v66_012_N_N_Geotcu.txt
    quoteRu: "Бюст сделал большой Гинцбург, нехорош. Репинский похож, но, не для того, чтобы вам сказать приятное, а потому, что так есть, ваш лучше всех."
    quoteEn: "Ginzburg has made a large bust [of me], not good. Repin's is a likeness, but — not to flatter you, but because it is so — yours is the best of all. (working English)"
    significance: "Sculpture keystone — documents THREE busts of Tolstoy (Ge, Ginzburg, Repin) competing in 1890–91, with Tolstoy ranking Ge's above the others."
  - id: v66_341_N_N_Geotcu
    genre: letter
    pssTom: 66
    pages: "258–259"
    date: "1892-09-22"
    dateNote: "Old Style"
    addressee: "N. N. Ge (father)"
    localPdf: "primary-sources/jubilee-edition/vol66/vol66.pdf"
    extract: extracts/v66_341_N_N_Geotcu.txt
    quoteRu: "«Повинен смерти» необходимо переписать Христа: сделать его с простым, добрым лицом и с выражением сострадания"
    quoteEn: "['Guilty of Death'] — Christ must be repainted: make him with a simple, kind face and an expression of compassion. (working English)"
    significance: "Tolstoy giving direct iconographic instruction on Ge's Passion canvas (Sept 1892) — evidence of his hands-on role in Ge's late religious art."
  - id: v67_161_P_M_Tretyakovu
    genre: letter
    pssTom: 67
    pages: "153–155"
    date: "1894-06-14"
    dateNote: "Old Style (written 7–14 June)"
    addressee: "P. M. Tretyakov"
    localPdf: "primary-sources/jubilee-edition/vol67/vol67.pdf"
    extract: extracts/v67_161_P_M_Tretyakovu.txt
    quoteRu: "Я нынче зимою был три раза в вашей галлерее и всякий раз невольно останавливался перед «Что есть истина»"
    quoteEn: "This winter I was three times in your gallery and each time involuntarily stopped before 'What Is Truth?'. (working English)"
    significance: "Capstone provenance: confirms 'What Is Truth?' hung in the Tretyakov Gallery by winter 1893–94, and frames Tolstoy's plea to acquire Ge's whole estate for the national collection."

  # REPIN — the most prolific depicter
  - id: v49_077_077_1883_04_03
    genre: diary
    pssTom: 49
    pages: "77"
    date: "1883-04-03"
    dateNote: "Old Style (dual-dated 3/15 April)"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol49/vol49.pdf"
    extract: extracts/v49_077_077_1883_04_03.txt
    quoteRu: "Дома Репин. С ним очень хорошо говорил, за работой."
    quoteEn: "At home — Repin. Talked with him very well, while he was at work. (working English)"
    significance: "Earliest Repin–Tolstoy working contact in the corpus (Moscow, 1883) — predates the canonical first Yasnaya Polyana visit of 1887."
  - id: v64_115_V_V_Stasovu
    genre: letter
    pssTom: 64
    pages: "66–67"
    date: "1887-09-08"
    dateNote: "Old Style"
    addressee: "V. V. Stasov"
    localPdf: "primary-sources/jubilee-edition/vol64/vol64.pdf"
    extract: extracts/v64_115_V_V_Stasovu.txt
    quoteRu: "Портрет Репина уложен и завтра отсылается."
    quoteEn: "Repin's portrait is packed and is being sent off tomorrow. (working English)"
    significance: "Primary anchor for the canonical 1887 Tretyakov portrait — Tolstoy logs the finished portrait leaving Yasnaya in Sept 1887."
  - id: v52_044_044_1891_07_13
    genre: diary
    pssTom: 52
    pages: "44"
    date: "1891-07-13"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol52/vol52.pdf"
    extract: extracts/v52_044_044_1891_07_13.txt
    quoteRu: "Приехал Репин и Гинзбург. За это время они меня лепят и пишут, а я написал статью об обжорстве и много подвинулся в большой статье."
    quoteEn: "Repin and Ginzburg have arrived. During this time they sculpt and paint me, while I have written an article on gluttony and made much progress on the big article. (working English)"
    significance: "Keystone for the July 1891 Yasnaya sitting — Repin painting AND Ginzburg sculpting Tolstoy simultaneously, in his own words."
  - id: v52_063_063_1892_02_24
    genre: diary
    pssTom: 52
    pages: "63"
    date: "1892-02-24"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol52/vol52.pdf"
    extract: extracts/v52_063_063_1892_02_24.txt
    quoteRu: "Был Репин, уехал нынче."
    quoteEn: "Repin was here; he left today. (working English)"
    significance: "Dates a Repin visit to the famine-relief site Begichevka (Feb 1892) — the setting of Repin's famine-aid sketches of Tolstoy at work."
  - id: v71_090_I_E_Repinu
    genre: letter
    pssTom: 71
    pages: "334–335"
    date: "1898-03-24"
    dateNote: "Old Style"
    addressee: "I. E. Repin"
    localPdf: "primary-sources/jubilee-edition/vol71/vol71.pdf"
    extract: extracts/v71_090_I_E_Repinu.txt
    quoteRu: "Если моя книга помогла уяснить вопросы искусства такому художнику, как Репин, то труд ее писания не пропал даром."
    quoteEn: "If my book helped to clarify questions of art for an artist such as Repin, then the labour of writing it was not in vain. (working English)"
    significance: "The art-theory bond behind the sittings — Tolstoy to Repin on What Is Art?; the painter he most wanted to reach disagreed with him on art's purpose."

  # WHAT IS ART? — Tolstoy theorising about the painters who painted him
  - id: v30_027_203_Chto_takoe_iskusstvo
    genre: work
    pssTom: 30
    pages: "27–203 (here ~p.150)"
    date: "1897"
    dateNote: "first published 1898"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol30/vol30.pdf"
    extract: extracts/v30_027_203_Chto_takoe_iskusstvo.txt
    quoteRu: "Таков рисунок Крамского, стоящий многих его картин [...] Образцами же в области живописи произведений, вызывающих негодование, ужас пред нарушением любви к Богу и ближнему, могут служить картина Ге — суд"
    quoteEn: "Such is Kramskoy's drawing, worth many of his paintings [...] As models in painting of works that arouse indignation and horror at the violation of love of God and neighbour, Ge's picture 'The Judgement' can serve. (working English)"
    significance: "In his own aesthetic treatise Tolstoy names Kramskoy and Ge — the two men who painted him — as exemplars of true art. Note: he praises Ge's earlier 'Suд/Judgement', not the late Passion canvases he championed privately."

  # ORLOV — 'my favourite artist'
  - id: v37_273_277_Predislovie_k_albomu_Russkie_muzhiki_N_Orlova
    genre: work
    pssTom: 37
    pages: "273–277"
    date: "1908"
    dateNote: "preface to Orlov's album, pub. 1909"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol37/vol37.pdf"
    extract: extracts/v37_273_277_Predislovie_k_albomu_Russkie_muzhiki_N_Orlova.txt
    quoteRu: "Орлов мой любимый художник, а любимый он мой художник потому, что предмет его картин — мой любимый предмет."
    quoteEn: "Orlov is my favourite artist, and my favourite because the subject of his pictures is my favourite subject. (working English)"
    significance: "The fullest statement in the corpus of Tolstoy's regard for a living artist — for a peasant-genre painter, not a portraitist of himself."

  # PASTERNAK — Resurrection illustrator
  - id: v75_262_L_O_Pasternaku
    genre: letter
    pssTom: 75
    pages: "186–187"
    date: "1904-11-22"
    dateNote: "Old Style"
    addressee: "L. O. Pasternak"
    localPdf: "primary-sources/jubilee-edition/vol75/vol75.pdf"
    extract: extracts/v75_262_L_O_Pasternaku.txt
    quoteRu: "Но вообще прекрасный, как все ваши рисунки, и я вам благодарен за них."
    quoteEn: "But on the whole splendid, like all your drawings, and I am grateful to you for them. (working English)"
    significance: "Tolstoy's own appraisal of Pasternak's draughtsmanship — the only letter-level corpus anchor for the painter who illustrated Resurrection (1898–99)."

  # YAROSHENKO — 1894 portrait
  - id: v52_116_117_1894_05_03
    genre: diary
    pssTom: 52
    pages: "116–117"
    date: "1894-05-03"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol52/vol52.pdf"
    extract: extracts/v52_116_117_1894_05_03.txt
    quoteRu: "Провожали нас Соловьев и Ярошенко, с которым приятно сблизился."
    quoteEn: "Solovyov and Yaroshenko saw us off — Yaroshenko, with whom I have grown pleasantly close. (working English)"
    significance: "Dates the Tolstoy–Yaroshenko closeness to 1894, the year of Yaroshenko's portrait — though no sitting is described."

  # THE PORTRAIT AS FRICTION — Chertkov / Sofia
  - id: v52_157_159_1894_12_31
    genre: diary
    pssTom: 52
    pages: "157–159"
    date: "1894-12-31"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol52/vol52.pdf"
    extract: extracts/v52_157_159_1894_12_31.txt
    quoteRu: "Был здесь Чертков. Вышло очень неприятное столкновение из-за портрета. Как всегда, Соня поступила решительно, но необдуманно и нехорошо."
    quoteEn: "Chertkov was here. A very unpleasant clash arose over a portrait. As always, Sonya acted decisively but rashly and badly. (working English)"
    significance: "Earliest corpus instance of a portrait of Tolstoy becoming an object of conflict between Chertkov and S. A. Tolstaya — sixteen years before the 1910 'portrait war'."

  # SELF-DEPICTION — the mirror effect
  - id: v53_025_026_1895_04_26
    genre: diary
    pssTom: 53
    pages: "25–26"
    date: "1895-04-26"
    dateNote: "Old Style"
    addressee: ""
    localPdf: "primary-sources/jubilee-edition/vol53/vol53.pdf"
    extract: extracts/v53_025_026_1895_04_26.txt
    quoteRu: "Вчера видел свой портрет, и он поразил меня своей старостью. Мало остается времени."
    quoteEn: "Yesterday I saw my portrait, and it struck me by its old age. Little time remains. (working English)"
    significance: "Rare first-person reaction to his own depicted likeness — the portrait as a memento mori."

