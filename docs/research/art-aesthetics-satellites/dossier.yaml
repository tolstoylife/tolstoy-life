evidence:

  # ── A · Preface to the Works of Maupassant (Tom 30, 1893–94) ──
  - id: maup-three-conditions
    genre: works
    pssTom: 30
    pages: "3-24"
    date: "1893-1894"
    extract: extracts/v30_003_024_Predislovie_k_sochinenijam_Gjui_de_Mopassana.txt
    quoteRu: "Из этих трех условий: 1) правильного, т. е. нравственного, отношения автора к предмету, 2) ясности изложения или красоты формы, что одно и то же, и 3) искренности, т. е. непритворного чувства любви или ненависти к тому, что изображает художник, из этих трех условий Мопассан обладал только двумя последними и был совершенно лишен первого."
    quoteEn: "(working English) Of these three conditions — (1) a correct, i.e. moral, relation of the author to the subject; (2) clarity of exposition, or beauty of form, which is one and the same; and (3) sincerity, i.e. an unfeigned feeling of love or hatred toward what the artist depicts — of these three conditions Maupassant possessed only the last two, and was entirely deprived of the first."
    significance: "MARQUEE. The full triad — the 'three conditions of true artistic creation' — stated three years before What Is Art? systematised them. Conditions (2) clarity and (3) sincerity map onto two WIA infection-conditions; condition (1) the moral relation is the added content/religious criterion. The commentary itself calls the preface «вступительную часть к трактату «Что такое искусство?»»."
  - id: maup-talent-defined
    genre: works
    pssTom: 30
    pages: "3-24"
    date: "1893-1894"
    extract: extracts/v30_003_024_Predislovie_k_sochinenijam_Gjui_de_Mopassana.txt
    quoteRu: "Автор обладал тем особенным, называемым талантом, даром, который состоит в способности усиленного, напряженного внимания, смотря по вкусам автора, направляемого на тот или другой предмет, вследствие которого человек, одаренный этой способностью, видит в тех предметах, на которые он направляет свое внимание, нечто новое, такое, чего не видят другие."
    quoteEn: "(working English) The author possessed that special gift, called talent, which consists in a capacity for intensified, concentrated attention — directed, according to the author's tastes, on one subject or another — by virtue of which the person endowed with this capacity sees in the objects on which he directs his attention something new, such as others do not see."
    significance: "Talent defined as a faculty of seeing, independent of moral content — so a writer can have it in full and still be 'bad art'. Sets up the strain Maupassant puts on the theory."
  - id: maup-sincerity
    genre: works
    pssTom: 30
    pages: "3-24"
    date: "1893-1894"
    extract: extracts/v30_003_024_Predislovie_k_sochinenijam_Gjui_de_Mopassana.txt
    quoteRu: "обладал и тем условием достоинства художественного произведения, без которого художественное произведение не производит действия, — искренностью, т. е. не притворялся, что любит или ненавидит, а точно любил и ненавидел то, что описывал."
    quoteEn: "(working English) He possessed too that condition of a work of art's worth, without which a work of art produces no effect — sincerity, i.e. he did not pretend to love or hate, but actually loved and hated what he described."
    significance: "Sincerity named the condition 'without which a work of art produces no effect' — the decisive infection-condition in WIA. Tolstoy grants Maupassant this fully, which is exactly what makes him a hard case for the content criterion."
  - id: maup-moral-relation
    genre: works
    pssTom: 30
    pages: "3-24"
    date: "1893-1894"
    extract: extracts/v30_003_024_Predislovie_k_sochinenijam_Gjui_de_Mopassana.txt
    quoteRu: "правильного, нравственного, отношения к тому, что он изображал, т. е. знания различия между добром и злом, он любил и изображал то, чего не надо было любить и изображать, и не любил, и не изображал того, что надо было любить и изображать."
    quoteEn: "(working English) [deprived of] a correct, moral relation to what he depicted, i.e. knowledge of the difference between good and evil, he loved and depicted what ought not to be loved and depicted, and did not love and did not depict what ought to be loved and depicted."
    significance: "Spells out the moral relation as 'knowledge of the difference between good and evil' — the content/religious criterion of WIA in embryo."
  - id: maup-cement
    genre: works
    pssTom: 30
    pages: "3-24"
    date: "1893-1894"
    extract: extracts/v30_003_024_Predislovie_k_sochinenijam_Gjui_de_Mopassana.txt
    quoteRu: "цемент, который связывает всякое художественное произведение в одно целое и оттого производит иллюзию отражения жизни, есть неединство лиц и положений, а единство самобытного нравственного отношения автора к предмету."
    quoteEn: "(working English) the cement that binds every work of art into a single whole, and thereby produces the illusion of reflecting life, is not unity of persons and situations, but the unity of the author's own distinctive moral relation to the subject."
    significance: "Raises the moral relation from a per-passage judgment to the structural principle of artistic unity — directly anticipates WIA's account of what makes a work cohere. (Verbatim oddity «есть неединство» parses as «есть не единство… а единство».)"
  - id: maup-artist-sees
    genre: works
    pssTom: 30
    pages: "3-24"
    date: "1893-1894"
    extract: extracts/v30_003_024_Predislovie_k_sochinenijam_Gjui_de_Mopassana.txt
    quoteRu: "Художник только потому и художник, что он видит предметы не так, как он хочет их видеть, а так, как они есть."
    quoteEn: "(working English) An artist is an artist only because he sees things not as he wants to see them, but as they are."
    significance: "Resolves the strain: true talent (truthful vision) tends to correct a defective moral relation over a career — Maupassant 'wishing to praise love, ended by cursing it' (the Balaam figure). Vision, fully exercised, bends toward truth."
  - id: maup-var-conditions
    genre: works
    pssTom: 30
    pages: "273-302"
    date: "1893-1894 (вариант)"
    extract: extracts/v30_273_302_Predislovie_k_sochinenijam_Gjui_de_Mopassana_Varianty.txt
    quoteRu: "ценность художественного произведения определяется, по моему мнению, тремя условиями: степенью важности и качеством содержания, искренностью автора, т. е. любовью к тому, что он описывает, и красотой формы."
    quoteEn: "(working English) the value of a work of art is determined, in my opinion, by three conditions: by the degree of importance and the quality of the content, by the sincerity of the author, i.e. love for what he describes, and by beauty of form."
    significance: "Draft form of the triad, in a different order and weighting (the first condition is here 'importance and quality of content', not yet 'a correct, i.e. moral, relation of the author to the subject'). The redaction's key move was sharpening condition 1 from content to the author's stance toward the content."

  # ── B · Preface to the English edition of What Is Art? (Tom 30, 1898) ──
  - id: engwia-true-form
    genre: works
    pssTom: 30
    pages: "204-206"
    date: "1898-03-29"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "Книга эта моя «Что такое искусство?» выходит теперь в первый раз в ее настоящем виде."
    quoteEn: "(working English) This book of mine, What Is Art?, now appears for the first time in its true form."
    significance: "The thesis of the preface — the authentic text is the one being prefaced (Maude's English), not any Russian edition. Dates the integral text to the 1898 English translation."
  - id: engwia-mutilated
    genre: works
    pssTom: 30
    pages: "204-206"
    date: "1898-03-29"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "Она вышла в России в нескольких изданиях, но во всех в таком изуродованном цензурою виде, что я прошу всех тех, кого интересуют мои взгляды на искусство, судить о них только по книге в ее настоящем виде."
    quoteEn: "(working English) It came out in Russia in several editions, but in all of them in a form so mutilated by the censorship that I ask everyone interested in my views on art to judge them only by the book in its true form."
    significance: "Makes the translation the safeguard and the standard of record; the Russian printings are explicitly disavowed as evidence of his views."
  - id: engwia-wholeness
    genre: works
    pssTom: 30
    pages: "204-206"
    date: "1898-03-29"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "уже некоторая доля ее цельности и искренности была вынута из нее"
    quoteEn: "(working English) already a certain part of its wholeness and sincerity had been taken out of it."
    significance: "MARQUEE (meta-plane). Tolstoy describes the censored book in the treatise's own currency — цельность (wholeness/integrity) and искренность (sincerity, the decisive condition of true art in WIA). A text drained of these cannot do art's work."
  - id: engwia-christ-censored
    genre: works
    pssTom: 30
    pages: "204-206"
    date: "1898-03-29"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "там, где я говорю о Христе, шедшем на крест за исповедуемую им истину, цензор вычеркнул это и поставил «за род человеческий»"
    quoteEn: "(working English) where I speak of Christ, who went to the cross for the truth he professed, the censor struck this out and put 'for the human race'."
    significance: "Concrete proof that the censored text does not merely subtract Tolstoy's meaning but inserts its opposite (the Redemption dogma he rejects) under his signature — the strongest case for needing an uncensored vessel."
  - id: engwia-not-mine
    genre: works
    pssTom: 30
    pages: "204-206"
    date: "1898-03-29"
    extract: extracts/v30_204_206_Predislovie_k_anglijskomu_izdaniju_traktata_Chto_takoe_iskusstvo.txt
    quoteRu: "Появилась книга, подписанная моим именем, содержащая мысли, выдаваемые за мои, но не принадлежащие мне."
    quoteEn: "(working English) There appeared a book signed with my name, containing thoughts put forward as mine but not belonging to me."
    significance: "States the failure of faithful transmission directly — the authorial signature no longer guarantees the feeling transmitted. The meta-plane breakdown the English text repairs."

  # ── C · On Gogol (Tom 38, 1909 article; Tom 26, 1888 note) ──
  - id: gogol-threefold
    genre: works
    pssTom: 38
    pages: "50-53"
    date: "1909-03"
    extract: extracts/v38_050_053_O_Gogole.txt
    quoteRu: "Гоголь — огромный талант, прекрасное сердце и небольшой, несмелый, робкий ум."
    quoteEn: "(working English) Gogol — an enormous talent, a fine heart, and a small, timid, fearful mind."
    significance: "The 1909 article's organising thesis — Gogol's gift and his moral feeling are affirmed; only the mind that tried to systematise them is faulted. The religious-art test does not condemn the religious turn, it condemns the bad theory laid over it."
  - id: gogol-talent-heart
    genre: works
    pssTom: 38
    pages: "50-53"
    date: "1909-03"
    extract: extracts/v38_050_053_O_Gogole.txt
    quoteRu: "Но как только хочет он писать художественные произведения на нравственно-религиозные темы или придать уже написанным произведениям несвойственный им нравственно-религиозный поучительный смысл, выходит ужасная, отвратительная чепуха, как это проявляется во второй части «Мертвых Душ», в заключительной сцене к «Ревизору» и во многих письмах."
    quoteEn: "(working English) But the moment he wants to write artistic works on moral-religious themes, or to lend already-written works a moral-religious didactic sense not proper to them, out comes terrible, repulsive nonsense, as appears in the second part of Dead Souls, in the closing scene of The Inspector General, and in many of the letters."
    significance: "MARQUEE (the strain). Tolstoy does NOT despise Gogol's preaching — the religious letters are praised. What fails is the fusion: art bent to doctrine. The test vindicates the penitent man and the sincere religious feeling, not the moralising fiction, which Tolstoy still judges failed art — more discriminating than a flat 'religious art good' reading of WIA would predict."
  - id: gogol-diagnosis
    genre: works
    pssTom: 38
    pages: "50-53"
    date: "1909-03"
    extract: extracts/v38_050_053_O_Gogole.txt
    quoteRu: "Происходит это от того, что, с одной стороны, Гоголь приписывает искусству несвойственное ему высокое значение, а с другой — еще менее свойственное религии низкое значение церковное, и хочет объяснить это воображаемое высокое значение своих произведений этой церковной верой."
    quoteEn: "(working English) This comes about because, on the one hand, Gogol ascribes to art a high significance not proper to it, and on the other a still-less-proper low significance to religion — the church significance — and wants to explain this imagined high significance of his works by that church faith."
    significance: "The diagnosis is symmetrical and is pure What Is Art? doctrine: art over-valued (the Hegelian 'служение красоте' cult), true religion under-valued (collapsed into церковность). Gogol's error is doctrinal mis-placement, not the religious turn as such."
  - id: gogol-public-comic
    genre: works
    pssTom: 26
    pages: "648-651"
    date: "1888-01 .. 1888-02"
    extract: extracts/v26_648_651_O_Gogole.txt
    quoteRu: "Гоголь же тот, который отрекается от своих ошибок и кается в них, того Гоголя мы не хотим знать и называем его сумашедшим."
    quoteEn: "(working English) But the Gogol who renounces his errors and repents of them — that Gogol we do not wish to know, and we call him a madman."
    significance: "The 1888 note's core grievance, stated as defence: the literary public keeps the comic Gogol and discards the penitent one — exactly the verdict the religious-art test reverses. (sic: «сумашедшим» per source.)"
  - id: gogol-canon-inversion
    genre: works
    pssTom: 26
    pages: "648-651"
    date: "1888-01 .. 1888-02"
    extract: extracts/v26_648_651_O_Gogole.txt
    quoteRu: "Всех учат тому, что Гоголь был велик, когда он писал свои повести, как Тарас Бульба, в которой восхваляются военные подвиги — убийство, и когда писал ревизора, в котором осмеиваются все без исключения люди целого города, но что Гоголь, пишущий о том, что ему открыло учение Христа, есть падший, сумашедший Гоголь."
    quoteEn: "(working English) Everyone is taught that Gogol was great when he wrote his tales, such as Taras Bulba, in which military exploits — murder — are extolled, and when he wrote The Inspector General, in which all the people of a whole town without exception are mocked; but that the Gogol who writes of what the teaching of Christ revealed to him is the fallen, mad Gogol."
    significance: "The inversion the religious-art test performs: by the moral-religious measure the celebrated works glorify killing or mere mockery; the despised late writing is the one touched by «учение Христа». The literary canon and the religious-art canon point opposite ways. (sic: «сумашедший».)"
  - id: gogol-belinsky
    genre: works
    pssTom: 26
    pages: "648-651"
    date: "1888-01 .. 1888-02"
    extract: extracts/v26_648_651_O_Gogole.txt
    quoteRu: "Белинский первый осудил Переписку и сказал: Проповедник кнута, апостол невежества и мракобесия, панегирист татарских нравов и т. п."
    quoteEn: "(working English) Belinsky was the first to condemn the Correspondence and said: a preacher of the knout, an apostle of ignorance and obscurantism, a panegyrist of Tatar mores, and so on."
    significance: "Names the antagonist directly. Tolstoy sets the religious-art test explicitly against the radical-critic consensus (Belinsky's 1847 letter); the crowd's reverence for Belinsky is itself, for Tolstoy, the symptom. This is the polemic he declined to finish (per the 1888 commentary)."
  - id: gogol-rebirth
    genre: works
    pssTom: 26
    pages: "648-651"
    date: "1888-01 .. 1888-02"
    extract: extracts/v26_648_651_O_Gogole.txt
    quoteRu: "есть нетолько неизбежное, но и самое важное событие в жизни человека — есть рождение к истинной жизни."
    quoteEn: "(working English) [this inner event — liberation from evil, repentance, the striving to return to the path of good] is not only the inevitable but the most important event in a man's life; it is birth into true life."
    significance: "The 1888 note universalises Gogol's case: every person passes through purity → temptation → repentance; Gogol's 'rebirth' is the normal and highest human event. The defence applies Tolstoy's own conversion-pattern, not special pleading for a genius. (sic: «нетолько».)"
  - id: gogol-var-slavophiles
    genre: works
    pssTom: 38
    pages: "280"
    date: "1909 (вариант)"
    extract: extracts/v38_280_280_O_Gogole_Varianty.txt
    quoteRu: "Гоголь же был даже не самобытным софистом, а усвоил все сложные и искусственные софизмы славянофилов того времени: Хомякова и особенно Аксаковых."
    quoteEn: "(working English) Gogol was not even an original sophist, but absorbed all the complex, artificial sophisms of the Slavophiles of that time: Khomyakov and especially the Aksakovs."
    significance: "A cut variant naming the Slavophiles (Khomyakov, the Aksakovs) as the source of Gogol's «софизмы»; the published 1909 article generalises this to «славянофильство» and removes the named targets — softening the polemic, consistent with Tolstoy's 1888 reluctance to fight Belinsky head-on."

  # ── D · Preface to Carpenter's "Modern Science" (Tom 31, 1897–98) ──
  - id: carp-superstition
    genre: works
    pssTom: 31
    pages: "87-95"
    date: "1897-1898"
    extract: extracts/v31_087_095_Predislovie_k_state_Eduarda_Karpentera_Sovremennaja_nauka.txt
    quoteRu: "распространено и укоренилось суеверие, по которому считается, что для блага человечества совсем не нужно распространение истинных религиозных и нравственных знаний, а нужно только изучение опытных наук"
    quoteEn: "(working English) [in Russian society there is] spread and rooted the superstition that for the good of mankind there is no need at all to spread true religious and moral knowledge, but only to study the experimental sciences."
    significance: "The opening endorsement. Tolstoy names the target a суеверие (superstition) — equating faith in experimental science with religious superstition — and frames the Russian intelligentsia as its worst case."
  - id: carp-how-to-live
    genre: works
    pssTom: 31
    pages: "87-95"
    date: "1897-1898"
    extract: extracts/v31_087_095_Predislovie_k_state_Eduarda_Karpentera_Sovremennaja_nauka.txt
    quoteRu: "Людям надо жить. А для того, чтобы жить, им надо знать, как жить. И все люди всегда — плохо ли, хорошо ли — узнавали это и, сообразно с этим знанием, жили, двигались вперед, и это знание того, как должно жить людям, со времен Моисея, Солона, Конфуция считалось всегда наукой, самой наукой наук."
    quoteEn: "(working English) People must live. And in order to live, they must know how to live. And all people have always — well or badly — learned this and, in accordance with this knowledge, lived and moved forward; and this knowledge of how people should live has, since the times of Moses, Solon, and Confucius, always been considered a science, the very science of sciences."
    significance: "MARQUEE. The positive claim — the religious-science twin of the religious-art test. True science is the knowledge of how to live; experimental science has usurped its place."
  - id: carp-trivia
    genre: works
    pssTom: 31
    pages: "87-95"
    date: "1897-1898"
    extract: extracts/v31_087_095_Predislovie_k_state_Eduarda_Karpentera_Sovremennaja_nauka.txt
    quoteRu: "Она с торжеством объявляет ему, сколько миллионов миль от солнца до земли, сколько миллионов колебаний эфира в секунду для света и сколько колебаний воздуха для звука; рассказывает о химическом составе млечного пути, новом элементе — гелии, о микроорганизмах и их испражнениях, о тех точках руки, в которых сосредоточивается электричество, об икс-лучах и тому подобном."
    quoteEn: "(working English) It triumphantly announces to him how many millions of miles from the sun to the earth, how many millions of ether-vibrations per second for light and how many air-vibrations for sound; it tells of the chemical composition of the Milky Way, of the new element helium, of microorganisms and their excretions, of those points on the hand where electricity is concentrated, of X-rays and the like."
    significance: "The 'trivia' charge made concrete — modern science studies spectacular minutiae while the working man asks only «как жить». (Helium and X-rays date the indictment to the 1890s frontier of physics.)"
  - id: carp-upper-classes
    genre: works
    pssTom: 31
    pages: "87-95"
    date: "1897-1898"
    extract: extracts/v31_087_095_Predislovie_k_state_Eduarda_Karpentera_Sovremennaja_nauka.txt
    quoteRu: "Более же выгодно изучать то, что может содействовать благосостоянию тех высших классов, к которым принадлежат люди, занимающиеся наукой; более же легко изучать всё не живое."
    quoteEn: "(working English) It is more profitable to study what may contribute to the well-being of those upper classes to which the people engaged in science belong; and it is easier to study everything that is not living."
    significance: "LOAD-BEARING PARALLEL. The exact structural twin of the WIA charge against art: science, like upper-class art, selects its objects to serve the leisured class that funds it, then disguises the selection as the neutral law «наука для науки»."
  - id: carp-counterfeit
    genre: works
    pssTom: 31
    pages: "87-95"
    date: "1897-1898"
    extract: extracts/v31_087_095_Predislovie_k_state_Eduarda_Karpentera_Sovremennaja_nauka.txt
    quoteRu: "науки религиозные, нравственные, общественные, считаются царствующей наукой не науками и предоставлены богословам, философам, юристам, историкам, политико-экономам, которые заняты только тем, чтобы под видом научных исследований доказывать, что существующий строй жизни, выгодами которого они пользуются, есть тот самый, который должен существовать"
    quoteEn: "(working English) the religious, moral, and social sciences are not regarded as sciences by the reigning science, and are handed over to theologians, philosophers, jurists, historians, and political economists, who are occupied solely with proving, under the guise of scientific research, that the existing order of life — by whose advantages they profit — is the very one that ought to exist."
    significance: "The 'counterfeit priesthood' charge in the science register: the moral sciences are exiled, and what remains justifies the status quo."
  - id: carp-remedy
    genre: works
    pssTom: 31
    pages: "87-95"
    date: "1897-1898"
    extract: extracts/v31_087_095_Predislovie_k_state_Eduarda_Karpentera_Sovremennaja_nauka.txt
    quoteRu: "должна прежде всего отречься от своего опытного метода, по которому она считает своим делом только изучение того, что есть, а вернуться к тому единственному разумному и плодотворному пониманию науки, по которому предмет ее есть изучение того, как должны жить люди."
    quoteEn: "(working English) [Our science] must first of all renounce its experimental method — by which it regards its task as merely the study of what is — and return to the one reasonable and fruitful understanding of science, by which its subject is the study of how people should live."
    significance: "The closing prescription, mirroring WIA's demand that art renounce the pursuit of pleasure for the transmission of religious feeling. The study of «что есть» is permitted only insofar as it serves the study of «как должны жить люди»."

