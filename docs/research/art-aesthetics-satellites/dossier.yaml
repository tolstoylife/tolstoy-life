# ─────────────────────────────────────────────────────────────────────────────
# COVERAGE — surfaces × status (derives 'Material not covered'; resume reads this)
# ─────────────────────────────────────────────────────────────────────────────
coverage:
  - surface: "Composition windows & genesis (incl. the people)"
    status: covered
    note: "All four pieces pinned OS+NS from their Tom commentaries (история писания); the people sweep yielded Maupassant/Nikiforov/Turgenev/Birukoff (Maupassant), Maude/Chertkov (English preface), Posse/Belinsky/Pushkin (Gogol), Carpenter/Kenworthy/Sergei L. Tolstoy/Gurevich/Volynsky (Carpenter)."
  - surface: "What each piece says (keystones)"
    status: covered
    note: "26 verbatim keystones across the four pieces; each tied to a What Is Art? criterion. The marquees: Maupassant's three conditions, the English preface's цельность/искренность hook, Gogol's talent/heart/preaching calibration, Carpenter's 'how to live' science test."
  - surface: "Redactions & textual history"
    status: covered
    note: "Maupassant variants (the draft three-conditions in a different order; the cut beauty-stratum that fed What Is Art?); Gogol 1909 variant (named Slavophiles cut to a generic label); the What Is Art? genesis-draft cluster (v30_213–v30_270) read as supporting genesis only."
  - surface: "Publication, censorship & translation"
    status: covered
    note: "Maupassant Posrednik 1894; the English preface's whole censorship story (Brotherhood Publishing Co. confirmed, Grant Richards corrected); Gogol Русское слово 1909; Carpenter «Северный вестник» 1898. English-translation status resolved per piece (Maupassant: Maude; English preface: it IS the English edition; Carpenter: Dole 1899; Gogol: likely untranslated)."
  - surface: "Reception & afterlife"
    status: partial
    note: "Only the Maupassant preface and the English-edition preface have a settled received literature. The Carpenter preface has a small science-critique niche; the Gogol articles have essentially no dedicated English scholarship — the dive's reads run ahead of the secondary literature there."
  - surface: "Scholarly context (triangulation)"
    status: covered
    note: "12 triangulation entries; the 'What Is Art? over-reaches' frame named and attributed (Bayley, Jahn), with the dive's more-discriminating Gogol read flagged as its own primary-grounded contribution."
  - surface: "Connective tissue / marquee (the religious-art test applied)"
    status: covered
    note: "Each piece triangulated as a hypothesis: Maupassant EXTENDS (the doctrine's seedbed); English preface EXTENDS onto the meta-plane + CONFIRMS; Gogol CONFIRMS + EXTENDS (with a documented strain on 'vindicates'); Carpenter EXTENDS to science (with two visible seams)."
  - surface: "Visual & manuscript record"
    status: covered
    note: "4 PD images cached (Maupassant/Nadar, Gogol/Möller, Carpenter/Hollyer, Tolstoy 1897) + provenance. Aylmer Maude portrait is a work-order item (only a CC BY-SA candidate found). No manuscript facsimiles rendered (the keystones are typeset PSS text)."

# ─────────────────────────────────────────────────────────────────────────────
contradictions:   # intra-corpus (primary-vs-primary) only
  - claim: "The launch brief's publisher for the 1898 English What Is Art?: 'Grant Richards'."
    correction: "The PSS Tom 30 commentary names Brotherhood Publishing Co. / The New Order, and independent rare-book records (Raptis, Biblio) confirm The Brotherhood Publishing Company, London, 1898 as the first English edition. 'Grant Richards' belongs to the later World's Classics Essays and Letters (1903) — a different, collected-essays volume. This is a brief-vs-source correction, not intra-corpus, recorded here for the ingestion record."
    evidenceRef: engwia-true-form

notCovered:
  - "Tolstoy's earlier scattered remarks on Maupassant (1881–1890 diaries/letters) — characterised from the Tom 30 commentary, not independently swept from those decades' diaries."
  - "Carpenter's own English 'Modern Science: A Criticism' (the article Tolstoy prefaces) — not Tolstoy's text; available in Carpenter's collections (Internet Archive)."
  - "Gogol's «Выбранные места из переписки с друзьями» itself (the object of both Gogol pieces) — not in this corpus; English: Jesse Zeldin (1969)."
  - "The fine-grained collation of the Maupassant preface's ~20 manuscripts / 4 proof passes — only the keystone redaction moves are characterised from the commentary."
  - "Tolstoy's March-1909 grading marks on each piece of Gogol's Selected Passages (embedded in the article extract) — noted as a distinctive primary artifact; not transcribed into an evidence table this pass."

needsReview:
  - item: "Shelving gap: the works schema Non-Fiction subcategories are Treatises / Personal Papers / Essays and Criticism / Educational — there is NO 'Prefaces' subcategory, and the genre enum has no 'preface' value. All four pieces (three prefaces + the Gogol article) are shelved under Essays and Criticism / genre essay. Flag for a possible vocab decision (do not invent vocab in the dive)."
    phase: 0
    why: "Three of the four records are prefaces; the schema cannot mark them as such. A 'Prefaces' subcategory or a 'preface' genre value would need a Johan-approved schema change."
  - item: "Preface to the English Edition of What Is Art? — publishedInRussiaDuringLifetime set false (first published abroad, Свободное слово, Purleigh 1898). Confirm whether the preface itself was printed in Russia before Tolstoy's death."
    phase: 4
    why: "Affects publishedInRussiaDuringLifetime; the preface attacks Russian censorship, so a Russian lifetime printing is unlikely but unconfirmed."
  - item: "On Gogol — whether the unfinished, unpublished 1888 Tom-26 note merits its own separate workRecord, or stays folded into the on-gogol (1909) record as a noted earlier attempt."
    phase: 4
    why: "Two distinct texts 21 years apart; the proposal currently makes one record for the published 1909 article and notes the 1888 fragment. Ingestion decision."
  - item: "Maupassant preface — exact Maude volume/pagination (Tolstoy on Art, 1924; Essays and Letters / Recollections and Essays, World's Classics). Confirm before citing a page. The 1903 Essays and Letters World's Classics printing is associated with Grant Richards — the likely source of the brief's publisher slip."
    phase: 3
    why: "titleAlternatives/translation provenance; exact pagination not pinned."
  - item: "Aylmer Maude portrait — no PD image found (only a CC BY-SA 4.0 Lafayette 1919 studio portrait). Try NPG / Bodleian open-access collections, or omit."
    phase: 2
    why: "Visuals work-order; Maude is central to the English-preface story but tertiary as an image."
  - item: "Gogol articles (1888 + 1909) — likely untranslated into English; route both to the translation-gaps ledger. Do not assert 'translated'."
    phase: 3
    why: "No English translation surfaced; English coverage addresses only Gogol's Selected Passages (the object), not Tolstoy's articles."
  - item: "OS→NS conversions for all four pieces are derived (+12 days 1880s–90s, +13 days 1909), not directly sourced from the commentary in every case. Verify if a slug or chronology depends on a specific NS date."
    phase: 4
    why: "Standard offset applied; the commentary gives OS dates."
  - item: "Carpenter preface — Sergei Lvovich Tolstoy (eldest son) is the translator; some English sources err calling him 'older brother' / 'Count Sergius'. Vault page sergei-tolstoy is the son — confirm at ingestion, distinct from brother Sergei N. Tolstoy."
    phase: 1
    why: "Person disambiguation; a wrong link would conflate son and brother."

