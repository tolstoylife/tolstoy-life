# ─────────────────────────────────────────────────────────────────────────────
# SCHOLARSHIP — secondary layer (Phase 3). See extracts/_scholarship.md.
# ─────────────────────────────────────────────────────────────────────────────
scholarship:
  summary: >-
    Mainstream Tolstoy scholarship does not treat these four as a cluster; it treats What Is Art?
    as the centre and these as satellites of uneven visibility. The Maupassant preface has the
    settled status: Aylmer Maude's editorial apparatus (Tolstoy on Art, 1924) presents it as the
    "discriminating preface" stating the very "three conditions" later carried into What Is Art?
    ch. 15, so it is implicitly read as the treatise's germ. The English-edition preface is well
    documented as the authorial note fronting the first uncensored text of the treatise; rare-book
    records confirm The Brotherhood Publishing Company (London, 1898) as the first English edition
    and Maude as the authorised translator — which corrects the dive brief's "Grant Richards"
    (that belongs to the later 1903 Essays and Letters volume). The Carpenter preface has a small
    science-critique literature (a Visions for Sustainability article; the MIT redingtn Carpenter
    pages) reading Tolstoy's endorsement as helping spread Carpenter beyond English. The Gogol
    pieces are the thinnest — the 1909 centenary article is barely discussed in English at all.
    Across the cluster, critics (Bayley, Jahn) read What Is Art? itself as over-reaching (it dooms
    Beethoven, Shakespeare, War and Peace), so the prefaces' case-verdicts inherit that reputation
    for over-application — a frame the dive's close-reads push back on (the Gogol read rescues only
    the religious feeling, not the moralising fiction — more discriminating than the caricature).
  triangulation:
    - evidenceRef: maup-three-conditions
      conventionalView: "Maude frames the preface as a 'discriminating' one that states the three conditions later systematised in What Is Art? ch.15; modern summaries map its triad onto the treatise's three conditions of contagiousness."
      relation: confirms
      source: "Maude, Tolstoy on Art (1924); marxists.org / ccel.org reprints"
    - evidenceRef: maup-var-conditions
      conventionalView: "Scholarship treats the genesis link as an editorial adjacency (Maude prints the preface beside the WIA prefaces) rather than an argued thesis — the PSS commentary states it outright («вступительную часть к трактату»)."
      relation: extends
      source: "Maude editorial framing; PSS Tom 30 commentary (dive primary)"
    - evidenceRef: maup-sincerity
      conventionalView: "The essay's own English text states the verdict — Maupassant has talent, clearness, sincerity but is 'entirely devoid of the first condition'."
      relation: confirms
      source: "Tolstoy, The Works of Guy de Maupassant (Maude trans.), marxists.org"
    - evidenceRef: engwia-mutilated
      conventionalView: "What Is Art? was 'first published in English in 1898 due to difficulties with the Russian censors'; Maude's is 'the first unexpurgated version … in any language'."
      relation: confirms
      source: "Wikipedia, What Is Art?; Aylmer and Louise Maude, Wikipedia"
    - evidenceRef: engwia-true-form
      conventionalView: "First English edition = The Brotherhood Publishing Company, London, 1898, trans. A. Maude; Grant Richards belongs to the later 1903 Essays and Letters volume."
      relation: contradicts
      source: "Raptis Rare Books; Biblio.com (corrects the dive brief's 'Grant Richards')"
    - evidenceRef: engwia-christ-censored
      conventionalView: "Maude's reproduced preface and standard accounts confirm the censorship and Tolstoy's disavowal; the specific 'for the truth' → 'for the human race' substitution is carried only in the primary text."
      relation: extends
      source: "Maude headnote (quoted widely); PSS Tom 30 commentary (dive primary)"
    - evidenceRef: gogol-belinsky
      conventionalView: "Gogol's Selected Passages 'was heartily appreciated by Tolstoy … engaged in a religious quest'; Belinsky's 1847 letter is the canonical condemnation."
      relation: confirms
      source: "zenosbooks note on Selected Passages; Belinsky letter, marxists.org"
    - evidenceRef: gogol-rebirth
      conventionalView: "English scholarship does not develop the 'Tolstoy reads Gogol as a self-portrait' reading about the 1909 article; it is consonant with the religious-quest framing but not an established thesis."
      relation: extends
      source: "(no dedicated source found; dive primary, Tom 26 + Tom 38)"
    - evidenceRef: gogol-threefold
      conventionalView: "No English-language treatment of the 1909 article surfaced; English coverage stops at Selected Passages reception — the article is a minor occasional centenary piece."
      relation: confirms
      source: "(absence of sources; searched 2026-06)"
    - evidenceRef: carp-how-to-live
      conventionalView: "Treated in the science-critique literature as Tolstoy's endorsement of Carpenter's anti-positivism; the explicit 'twin of the art test' framing is the dive's."
      relation: extends
      source: "Visions for Sustainability, 'Lev Tolstoy and modern science'; MIT redingtn Carpenter pages"
    - evidenceRef: carp-superstition
      conventionalView: "'Tolstoy's imprimatur helped spread Modern Science beyond the English-speaking world'; Tolstoy ranked Carpenter 'a worthy successor to Carlyle and Ruskin'."
      relation: confirms
      source: "MIT redingtn Carpenter pages; Journal of Leo Tolstoi notes, marxists.org"
    - evidenceRef: carp-upper-classes
      conventionalView: "Critics read What Is Art?'s religious criterion as over-reaching (it dooms Beethoven, Shakespeare, War and Peace); the case-verdicts in these prefaces inherit that reputation for over-application."
      relation: complicates
      source: "Bayley & Jahn (via Wikipedia, What Is Art?); Jahn, The Aesthetic Theory of Tolstoy's What Is Art? (1975)"

