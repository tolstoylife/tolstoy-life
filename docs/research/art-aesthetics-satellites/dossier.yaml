# Corpus-dive dossier — Art & aesthetics satellites
# Layer: reference. Primary evidence + entity/visual/scholarship/work-record/coverage maps.
# A multi-work theme dive: four short pieces orbiting What Is Art? — each PROPOSES a works/ record.
# The dive PROPOSES vault pages and records; it never writes them.

topic:
  slug: art-aesthetics-satellites
  title: "Art & aesthetics satellites — the What Is Art? prefaces and case-studies"
  question: >-
    Four short Tolstoy pieces that apply his What Is Art? (1897–98) religious-art test to
    specific cases: the Maupassant preface (1893–94), the preface to the English edition of
    What Is Art? (1898), On Gogol (1888/1909), and the preface to Carpenter's "Modern Science"
    (1898). For each: does it confirm, complicate, or extend the doctrine — and where does the
    case strain the theory? The Maupassant preface is the doctrine's seedbed; the Carpenter
    preface is its science twin; Gogol is the religious-turn writer the test vindicates; the
    English preface turns the integrity-of-transmission test on the treatise's own censored text.
  date: 2026-06-21
  period: "Prophet period (post-1880); the four pieces span 1888–1909, clustered around What Is Art? (1897–98)"
  corpusSurface: "work texts + variants (Toms 26, 30, 31, 38); composition-window commentary (история писания, Toms 26, 30, 31, 38); the What Is Art? genesis-draft cluster (Tom 30) as supporting genesis only"
  dateRange: "1888 .. 1909 (composition windows of the four pieces)"

